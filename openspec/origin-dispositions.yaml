    fact: >-
      The ratifying commit 968de748 is the first commit whose `proposal.md`
      declares `Status: ratified`. Its `.openspec.yaml` carried NO origin
      block, only `schema` and `created`, as at the reviewed head b5cdf154.
      Commit c798f1a1 ADDS the whole block (`kind: ad_hoc`, `id`, `reason`,
      `approved_by`, `approved_on`, `proposed_by`, `proposed_on`). Its
      approval pair restates the 2026-10-03 ratification and the 2026-10-08
      confirmation; it grants no new approval. As measured on 2026-10-08,
      this gate reads a ratifying commit without an origin as ORIGIN
      RETENTION NOT COMPARABLE and returns no finding, so it does not read
      this entry today. `changed_keys` is `[]` because `_changed_keys`
      measures nothing against an absent block. The entry is written anyway,
      on the word, because this file is the one place that says on whose
      word an origin was added after ratification. It also covers the
      addition if the gate is ever made to compare an absent block. The
      ruling's text names `health/dispositions.yaml`, but this gate reads
      THIS file (`ORIGIN_DISPOSITIONS_REL`), which serves the ruling's stated
      purpose of covering the origin addition at archive. If #1267 lands by
      squash, `mutation_at` names a commit main does not reach, and the
      archive act repoints it to the landing commit, as the
      add-estate-repository-inventory entry above did.
