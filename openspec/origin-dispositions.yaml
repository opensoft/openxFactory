# Origin dispositions — the ACCEPTING half of `release-realization`
# § "Origin retention at archive" (issue #745; read by
# `scripts/proposal-support.py` ONLY where a packet's origin declaration
# differs from the one at its ratifying commit). An entry is owner-attributed,
# names both commits in full, lists exactly the origin keys that moved, and
# quotes the verbatim word that authorized the move. A valid `accept` moves
# the gate's comparison baseline to the accepted declaration; it switches
# nothing off. Entries are permanent: the archived packet carries the accepted
# origin for good, and this file is the only place that says why, on whose
# word (see docs/document-lifecycle.md, "Proposal origin declaration").
