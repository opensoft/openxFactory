origin:
  kind: ad_hoc
  id: openxFactory:adhoc:2026-09-01-add-clearing-dispatch-boundary
  reason: >-
    THE ORIGIN IS AN OPERATOR RULING, NOT A STAGED TOPIC, and the kind says so
    rather than borrowing a topic that would fit. No `ideation/staging/` folder
    declares this capability as an exit — checked in both directions against
    `ideation/staging/INDEX.md`, because a topic that merely mentions runner
    groups is not this packet's origin. The origin act is Brett Heap's
    in-session ruling of 2026-09-01, captured verbatim-in-substance the same day
    as the record `cpc-clearing-boundary-ruling-2026-09-01.md`, being committed
    at the ROOT of `opensoft/xFactory` via a pull request on branch
    `record/cpc-clearing-boundary-ruling` whose merge was PENDING BRETT'S WORD
    at this packet's authoring time, and on which ratification is gated
    (`tasks.md` 2.3): xFactory is THE clearing and dispatch boundary for
    the governed Cloud PC, runner-group allowlists stay xFactory-only, no
    factory is ever broadly authorized to originate jobs directly to the host,
    and cross-factory work reaches it only as a SEALED BOUNDED REQUEST carrying
    ten declared fields that the clearing workflow VERIFIES against the
    provider's API rather than trusting from inside the bundle.

    THE RULING WAS SUPERSEDED IN PART BY ITS OWN AUTHOR THE SAME DAY, and the
    packet is built to the superseding form. Brett's option 1 of 2026-09-01:
    NO per-path allowlist addition for the readiness test, which instead becomes
    THE CLEARING LANE'S FIRST OPERATION; the workflow allowlist converges to ONE
    PERMANENT ENTRY PER GROUP, added by him once, ever; and
    `opensoft/xFactory#188`'s standalone `runner-readiness-diagnostic.yml`
    retires into that operation.

    THE PROVENANCE OF THE TEN REQUIREMENTS IS A SPLIT, AND THE PACKET STATES IT
    RATHER THAN CLAIMING UNIFORM FIDELITY. REQUIREMENTS 1-7 TRACE TO THE WRITTEN
    RECORD: the single door, the sealed bounded request and its ten declared
    fields, API-side verification, the one sanctioned producer exit, hosted
    validation before any repository effect, the closed permitted-operations
    register, and readiness-diagnostic as entry #1 are each in its text.
    REQUIREMENTS 8-10 EXTEND IT, per requirement rather than in bulk, because two
    of the three have a partial written footing and one has none. Requirement 8
    (route retirement): the record names ONE retirement verbatim — "PR #188's
    standalone workflow is retired into the clearing operation" — so the specific
    act is written; the GENERAL rule, and the append-never shrink-only grandfather
    enumeration, are this packet's generalization. Requirement 9 (the
    authoring-time conformance guard): WHOLLY ABSENT from the record, and the
    largest of the three extensions. Requirement 10: the DISPATCH RECORD is
    written — the clearing workflow "records the dispatch", and xFactory is named
    as the one place for provenance, policy and audit — but the PERIODIC
    SINGLE-DOOR ATTESTATION is not, the word appearing nowhere in the record. All
    three were ruled in the SAME SESSION on Brett's verbatim instruction "fold
    1-5 in and fan out", and they are carried as DECLARED EXTENSIONS submitted
    for ratification, their provenance recorded in that record's APPEND-ONLY
    ADDENDUM. An earlier draft of this packet asserted that every requirement
    traced to the ruling and that nothing extended it; that was false for three
    of the ten, and this split replaces it.

    THE FORCING FACT IS ON THE RECORD AND IS NOT THIS PACKET'S CLAIM: run
    `33381257642`, a codexFactory-path council smoke test, sat queued about
    eighteen hours and was never claimable, because the runner group admits the
    codexFactory repository but lists only xFactory workflow paths. It was
    cancelled 2026-09-01 and recorded on codexFactory issue #156. The right
    outcome, produced by a configuration nobody had written down — which is the
    whole reason a contract exists here.

    THE PACKET IS TEXT-ONLY BY CONSTRUCTION AND SEEKS RATIFICATION, NOT
    REALIZATION. It creates no contract byte, no workflow, no console change and
    no runner: the declared code surface — the xFactory `clearing-dispatch.yml`
    lane, the retirement of `runner-readiness-diagnostic.yml`, the guard, and the
    future neutral `contracts/clearing/` family — is realized POST-RATIFICATION
    at its own additive cut, because ratification authorizes realization and does
    not perform it.
  approved_by: >-
    Brett Heap, 2026-09-01, in session. The ruling record he authorized commissions
    this exact packet in its own closing section, quoted verbatim: "Next lane
    (fresh session): the clearing contract as governed design — An OpenSpec change
    (openxFactory neutral contract for the sealed-bundle clearing boundary +
    xFactory clearing-workflow realization + codexFactory packaging realization),
    honoring this ruling as its origin." That is the authorization to DRAFT and
    nothing more: no ratification is claimed here, the packet lands `Status:
    draft`, and the two acts only he can perform — ratification, and the one
    console act per runner group — are carried as open tasks rather than as
    approvals already given.
  approved_on: 2026-09-01
