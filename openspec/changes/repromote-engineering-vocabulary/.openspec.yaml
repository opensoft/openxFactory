    unapproved shape `add-drafted-proposal-origin` admits — drafting provenance,
    no approval — and the packet's three lifecycle documents carry `Status: draft`
    to match.
    THE DECISIONS MOST WORTH A VETO are D1 (the id itself, derived in a table from
    the packet's own 22 uses of "engineering adapter" and the two landed machine
    names, with four candidates rejected by reason), D2's edits 5 and 6 (the two
    of the six path literals whose sites name NO adapter call, because no read or
    write happens at those words — disclosed rather than dressed up as calls), D3
