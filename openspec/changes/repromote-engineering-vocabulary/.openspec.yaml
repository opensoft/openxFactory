  id: openxFactory:adhoc:2026-09-16-repromote-engineering-vocabulary
  reason: >-
    THE BOX IS THE ORIGIN, AND IT IS AN ACTIVE RATIFIED PACKET'S OWN TASK.
    `split-opendox-two-layer-product` § 5.2a (`tasks.md` :1527-1535) reads, in
    full: "The FIFTEEN engineering-vocabulary requirements are re-promoted HERE
    (RULING DQ-1), not shed. They leave the capability `ideation-dashboard` and
    land in `openxFactory`'s own corpus under the § 2.2a adapter's own successor
    capability, whose id this task authors. `promotion_fidelity.py` keys on
    (capability, normalized title), so the successor is a distinct key and the
    REMOVED delta stays visible to the checker. The only edit they take is
    re-expressing path literals as `adapter calls` — one of RULING OQ-1's three
    classes, by name." This packet is that realization and nothing else.
    WHY `kind: ad_hoc` AND NOT `kind: staged`. The organized source is a BOX of a
    ratified change plus two rulings on an issue — RULING DQ-1 (`#656` comment
    `5547049745`, 2026-09-04T22:14Z) and RULING OQ-1 (`5547060378`, 22:15Z) — not
    an `ideation/staging/` topic folder. No staging topic holds this subject, and
    declaring one would name a source that does not resolve.
    WHY IT IS FILED NOW. The id has FOUR live dependents — TWO BOXES and TWO OPEN
    CLOSURES: § 5.6's de-floor and § 8.4's both-directions floor accounting must
    both name the capability directory, and the § 6.1 (#1060) and § 6.5 (#1065)
    closures each carried a delta whole rather than re-author it against "the
    successor capability id … § 5.2a, unbuilt and assigned to another actor".
    WHAT THE PACKET PROPOSES. ONE `## ADDED Requirements` block, under the new
    capability `openxfactory-engineering-adapter`, carrying the fifteen
    requirements the packet's ratified per-requirement map assigns to
    openxFactory (the map's own split: 71 openDox / 16 openXdox / 15
    openxFactory). They are CARRIED, not authored: lifted from
    `openspec/specs/ideation-dashboard/spec.md` by TITLE by a script, every byte
    preserved except at the TWO disclosed sites where a path literal becomes the
    seam operation that answers for it — both `resolve` — and the carry proved by
    reversing those two edits and asserting byte equality against the promoted
    text. THE EDIT COUNT IS ITSELF A FINDING: six path-literal occurrences sit in
    the fifteen and only two name a question the six-wide seam answers as its
    requirement states it; the other four are RECORDED NON-EDITS with their
    reasons in `design.md` § D2, because replacing a literal with prose that names
    no call would be authoring rather than re-expressing, and `tasks.md` § 4.5
    carries what would unblock them as a BLOCKED box.
    WHAT IT DOES NOT PROPOSE. No second `## REMOVED` block on
    `ideation-dashboard` — the packet's ratified map is that removal's single
    writer, a sixth writer would be an undeclared sibling collision this box
    cannot declare, and in one archive order it becomes a removal of nothing
    (`design.md` § D3, which also states what would change if the ruling goes the
    other way). No byte of `openspec/changes/split-opendox-two-layer-product/`,
    no tick, no code, no contract, no pin, no gitlink, nothing under
    `openspec/specs/`.
    FILING IS NOT RATIFYING. The three lifecycle documents carry `Status: draft`;
    the spec delta carries no lifecycle header, as the overwhelming majority of
    spec-delta files in this corpus do not. Ratification, promotion and archive
    are three separate acts on Brett Heap's word and this filing has none of them.
  proposed_by: >-
    Lane `openxfactory-4` (display `openXfactory-4-openDox_extraction`), session
    `f3c8d406`, actor `substrate52a`, as the standing claim holder of
    `split-opendox-two-layer-product` § 5.2a — CLAIMED on openxFactory issue #656,
    comment `5703096449` (2026-09-16), after the three sibling reads
    lane-collision-protocol Rule 1 requires, all three clear of this box.
    NO APPROVAL PAIR IS DECLARED AND NONE IS IMPLIED. Nobody has ruled on this
    packet: `approved_by` and `approved_on` are ABSENT, which is the lawful
    unapproved shape `add-drafted-proposal-origin` admits — drafting provenance,
    no approval — and the packet's three lifecycle documents carry `Status: draft`
    to match.
    THE DECISIONS MOST WORTH A VETO are D1 (the id itself, derived in a table from
    the packet's own 22 uses of "engineering adapter" and the two landed machine
    names, with four candidates rejected by reason), D2's NARROWING (the carry keeps
    only the two path-literal edits the seam answers for, and records the other
    four as non-edits with the operation each would have needed — a narrowing
    taken after an automated review contested the wider reading and was right
    against the interface's own text), D3
    (no second `## REMOVED` block) and D4 (this packet archives BEFORE the split
    packet, so the fifteen are never in no capability at all).
