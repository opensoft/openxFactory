    and no decision. At the time this field is written the packet is
    `Status: draft`, carries no ratification citation, and owes one:
    ratification is a separate act of Brett Heap's, tracked as task 0.1.
    AND THE RULING WAS GIVEN OVER A KNOWN RATIFIED CONFLICT, WHICH IS WHY THE
    DOOR WAS PUT TO HIM AT ALL: the #268 comment that framed the doors states
    in terms that "it needs Brett Heap's word on which door, because E-8 is
    ratified and this reverses its recommendation". A SECOND ratified sentence,
    in THIS repository, was NOT in front of him and is quoted in full in
    `proposal.md` § The ratified sentence this change narrows — it is the one
    thing in this packet that most needs his eye.
