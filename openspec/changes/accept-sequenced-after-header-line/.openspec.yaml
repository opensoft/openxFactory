  reason: >-
    A FIRST-HAND RULING NAMED THE DOOR, IN THIS REPOSITORY, ON A DEFECT
    MEASURED IN ANOTHER. codexFactory issue
    https://github.com/codeXfactory/codexFactory/issues/268 records that
    `sequenced_after:` declarations written by codexFactory authors are
    INVISIBLE to the reader this repository ships, because codexFactory writes
    its lifecycle headers UNFENCED — measured on codexFactory main `2ade133`:
    49 of 50 proposals carry no `---` front matter, EIGHT proposals carry a
    `sequenced_after:` header line, and `sequenced_after.corpus_sweep` still
    reports `declaring = 0`. That issue put TWO doors to Brett Heap: (a) fence
    the whole codexFactory corpus, which moves ratified proposal bytes and
    turns ABSENT into a declaration on already-ratified packets — the
    contested-class retention mutation `sequenced_after.retention_problem`
    names by that word; or (b) openxFactory teaches the reader the unfenced
    header form, after which codexFactory re-vendors and advances its pin and
    NO proposal byte moves. Brett Heap ruled, first-hand and in session on
    2026-09-10 at approximately 02:10Z, verbatim: **"do door b"**.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/` was listed in full and `INDEX.md` read on 2026-09-10:
    no topic folder names declaration sites, unfenced front matter, lifecycle
    header windows, or the legibility of `sequenced_after:` in a corpus that
    does not fence. The organized source is a recorded in-session ruling on
    another repository's issue, which is the shape `ad_hoc` exists for — the
    same shape `add-consent-custody-rederivation-record` (2026-09-07) filed
    under for an OpsxFactory ruling.
    NOTHING IN codexFactory IS TOUCHED BY THIS PACKET, and no proposal byte
    moves in ANY repository. The realization is confined to this repository's
    reader (`scripts/frontmatter_strict.py`, `scripts/sequenced_after.py`) and
    its suite (`tests/sequenced_after/`). codexFactory's re-vendor and pin
    advance are a SUCCESSOR act owned by lane codeXfactory-1, tracked unticked
    in `tasks.md` § 4.
  approved_by: >-
    Brett Heap (openxFactory operator authority; repository owner) — the
    ruling of 2026-09-10 ~02:10Z, first-hand and in session, verbatim
    **"do door b"**, on codexFactory issue #268.
    THIS FIELD RECORDS AUTHORIZATION TO AUTHOR, NOT RATIFICATION OF CONTENT,
    AND MUST NOT BE READ AS ONE. The ruling chose the DOOR between two named
    alternatives; it decided no requirement text, no window number, no
    conflict rule, and no field asymmetry. Every one of those is the authoring
    session's and is flagged for veto as design decisions H-1 through H-7 in
