    same "SHALL NOT merge, SHALL NOT approve" — recommended NOT amending it there
    (cross-repository requirement text is not that repository's to move) and
    recommended filing this packet separately, and its `tasks.md` box 5.1 records
    the successor as owed. Brett Heap took that recommendation in session on
    2026-09-08T13:22:40Z, verbatim "rule on finding 3, do the mirror packet too",
    recorded on openxFactory issue #745 (comment 5585824802), which states the
    scope on this side: "proposal only, Brett ratifies; its realization is gated
    on an approver existing for the `review-lane-repin` lane (openxFactory's
    envelope enrols only `intent-rolling-custody` today)".
    WHY IT IS A PACKET AND NOT AN EDIT. Working rule 3: a ratified requirement
    changes only by a ratified change. The sentence being narrowed was ratified
    here on 2026-09-06 as part of `mirror-floor-regeneration-automation` (PR #708,
    pair word "ratify both when green, then land them"), and it is enforced in
    running code by
    `tests/review_lane_pin/test_repin_lane.py::AnAutomatedPinAdvanceOnlyEverProposes::test_the_lane_opens_a_pull_request_and_stops_there`,
    a ten-term disposal sweep over the shell the runner executes. No ruling on a
    task box moves either.
    THE REALIZATION GATE IS FOUR REFUSALS DEEP AND IS STATED RATHER THAN
    DISCOVERED, which is the one place this mirror is not a transcription of its
    twin. Measured live 2026-09-08 against `opensoft/openxFactory`: (1)
    `.github/merge-approval-envelope.yml` enrols exactly one candidate,
    `intent-rolling-custody`, and the re-pin lane's branch and four writable paths
    are none of its; (2) `.github/workflows/merge-master-approval.yml:1504` parks
    any candidate touching a never-clearable path "whatever the envelope says",
    and `contracts/review-lane-pin.yaml` is such a path; (3) ORGANIZATION ruleset 18834180
    (`repository_name: ~ALL`, `ref_name: ~DEFAULT_BRANCH`) requires code-owner
    review on `main`, all four sites the lane writes are CODEOWNERS-routed, and a
    GitHub App cannot be named in CODEOWNERS — and NO BYPASS IS PROPOSED, because
    codexFactory's D-4 (i) was withdrawn on 2026-09-08 (its #232 comment
    5585989018) and the grant would be worse here (org-wide over every default
    branch, carrying `deletion`/`non_fast_forward`, removing the very gate that
    makes this repository's pin routing binding, and reportedly not honoured by
    the async auto-merge path at all); codexFactory's relocate-off-CODEOWNERS
    escape is measured UNAVAILABLE here because two of the four sites are
    workflow files; (4) codexFactory's promoted *Bounded autonomous surface* forbids
    the approval and `extend-merge-master-envelope-to-floor-bot-lanes`'s ratified
    N-1 narrowed it for the codexFactory REGENERATION lane ONLY. The remedy is
    named as a successor — `admit-review-lane-repin-to-merge-approval-envelope` —
    and is NOT authored here, and the COMPLETION PATH is left OPEN for Brett
    Heap's word with seven shapes costed in design.md M-D. The cheap precondition
    is recommended first and is unmeasured: openxFactory `main` carries NO classic
    branch protection (404) so protection is rulesets-only, and ZERO of the last
    60 closed pull requests here ever used auto-merge.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/` was enumerated and `INDEX.md` read on 2026-09-08: no topic
    folder and no INDEX row names the review-lane pin, the re-pin lane, the
    merge-approval envelope, the repository gate floor or bot merge authority.
    `kind: staged` would claim a staging source that does not resolve. The
    organized source is codexFactory's ratified packet at `93f0f0d7`, openxFactory
    issue #745 and codexFactory issue #232.
