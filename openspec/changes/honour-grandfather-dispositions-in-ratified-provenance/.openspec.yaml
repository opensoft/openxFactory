origin:
  kind: ad_hoc
  id: openxFactory:adhoc:2026-09-11-honour-grandfather-dispositions-in-ratified-provenance
  reason: >-
    EIGHTEEN ARCHIVED RECORDS STAND AT `critical` IN THE REPORT-ONLY NIGHTLY
    WITH NO REPAIR AVAILABLE TO ANYONE AND A RECORDED RULING SAYING NONE IS
    OWED, and the reason is one file `fam_ratified_provenance` does not read.
    Fifteen openxFactory ratification records were grandfathered on issue #877
    (opensoft/xFactory PR #420 -> `5bfa1fe4`) and codexFactory's three on
    xFactory PR #412; every one of the eighteen carries a dated, cited entry in
    the aggregation's `health/dispositions.yaml`, and every one is ARCHIVED, so
    `record-immutability` and `govern-archived-record-edits` put its header
    beyond a plain fix. The family emits `critical` from five arms and consults
    no disposition at any of them. The runner DOES read that file — `runner.main`
    loads it for `report.uncited_resolutions` — but that arm silences a
    DISAPPEARED CONTESTED finding and never a standing one, and this family is
    registered `auto-fixable` rather than `contested`, so it is not even in the
    set that arm adjudicates. The disposition is therefore a governance record
    that changes nothing a reader sees: the grandfather was granted and the
    nightly has never heard of it.
    THE REMEDY IS A PACKET AND NOT A PATCH, because the promoted requirement
    does not say it. `doc-health`'s *Governed corpus membership and the
    lifecycle scan set* is where this family's reporting duty over a scan-set
    document is written — *"the run MUST emit a `ratified-provenance` finding
    against that document's path"*, with *"the same severity it would carry for
    a governed-corpus document, because the defect is the same defect"* — and
    nothing in it admits a severity that moves for any reason. Lowering a band
    the canon fixes, in code, with no delta, is exactly the shape this
    repository refuses. Four sibling requirements already carry a *A finding is
    dispositioned* scenario (promotion fidelity, duplicate packet,
    modified-block currency, and the sibling-addition pairing class); this
    packet adds the fifth, for the family that needed it and never got one.
    THE DIVERGENCE FROM THOSE FOUR IS THE DECISION MOST WORTH A VETO AND IT IS
    `design.md` D1. All four SUPPRESS. This packet DOWNGRADES to `info` and
    quotes the citation, because their subject is a finding somebody can still
    repair — a suppressed row is a closed question — while this one's subject is
    an immutable record whose defect is permanent, and a suppressed row would
    delete a standing population from the artifact a reader reads and leave the
    reason for the silence legible only in a YAML file nobody opens.
    THE MEASUREMENT WAS TAKEN BEFORE THE DESIGN, over the real aggregation's
    real dispositions file. On `main` @ `96b4835b`, with openxFactory and
    codexFactory materialized under an `opensoft/xFactory` checkout, the family
    reports 41 rows, ALL `critical`. After the realization it reports the same
    41 rows against the same 41 paths: EIGHTEEN at `info` and TWENTY-THREE
    byte-identical, severity, rule, action and resolution class alike. The
    eighteen are exactly the eighteen `family: ratified-provenance` entries the
    file carries, and all eighteen are archived paths.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/` was enumerated and `INDEX.md` read on 2026-09-11: its
    30 topic folders carry no doc-health severity policy, no disposition
    mechanism and no ratification-record rule; the only INDEX line matching
    "grandfather" is the credential-escrow registry's ruling C, a different
    mechanism in a different capability. `kind: staged` would claim a staging
    source that does not resolve. The organized source is openxFactory issue
    #939, filed by this lane at Brett Heap's commissioning, and the two issues
    it stands on, #877 (the records) and #878 (the subject arm that reports
    them).
  proposed_by: >-
    Lane `openxfactory-1` (display `openXfactory-1`), session `a9c24afc`, on
    Brett Heap's word of 2026-09-11 at approximately 01:3xZ, a MULTIPLE-CHOICE
    ruling whose chosen option is verbatim **"Commission the packet"**.
    NO APPROVAL PAIR IS DECLARED AND NONE IS IMPLIED. That word COMMISSIONS THE
    AUTHORING and ratifies no wording: it admits no text here to canon, takes
    neither of the two decisions this packet carries, and is not read as an
    approval of either. The lawful unapproved shape is the one
    `add-drafted-proposal-origin` (issue #318) added — drafting provenance, no
    `approved_by`, no `approved_on` — and every document in the packet carries
    `Status: draft` to match. Approval, when it comes, is a pure ADDITION beside
    a fixed `kind` and `id`. Ratification, promotion and archive are three later
    acts on later words.
    THE DECISIONS MOST WORTH A VETO ARE `design.md` D1 AND D2, each put with the
    recommendation first and the alternative's cost written out beside it. D1:
    an `info` ROW carrying the citation, against SILENCE on the four siblings'
    precedent — a veto of D1 costs the eighteen rows their visibility and buys
    a report that matches its four neighbours exactly. D2: the ARCHIVED-ONLY
    boundary, against admitting an entry over an ACTIVE packet's record — a veto
    of D2 would let a disposition stand in for a one-commit repair. The two rest
    on no shared predicate and either stands whichever way the other goes.
    NOTHING IS PROMOTED AND NOTHING IS ARCHIVED BY THIS FILING. This pull
    request edits no file under `openspec/specs/`; `code_surface` is non-empty,
    so under `release-realization` the archive is a separate act on
    merged-plus-green realization evidence and a separate word, and openxFactory
    #939 closes there and not at this landing.
  proposed_on: 2026-09-11
