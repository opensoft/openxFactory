origin:
  kind: ad_hoc
  id: openxFactory:adhoc:2026-08-29-add-binding-consumer-identity
  reason: >-
    THE NAMED SUCCESSOR OF A RATIFIED CHANGE, RAISED ON BRETT HEAP'S IN-SESSION
    LANE AUTHORIZATION OF 2026-08-29. `add-notebook-hosting-credential-custody`
    was ratified on 2026-08-23 with three items deliberately put to the
    ratifier rather than decided quietly, and its third is this change's whole
    subject. Quoted from that change's own ratification record
    (`openspec/changes/add-notebook-hosting-credential-custody/review/ratification-2026-08-23.md`
    § "The three flagged items"): *"The enforcement gap, admitted rather than
    papered over. Per-system authority is NOT machine-provable today: the
    published `xfactory_credential_binding_template` requires only
    `[provider, secret_ref, owner, rotation_policy]` with optional `vault`,
    carries no consumer or access-identity field, and
    `scripts/validate-credential-contracts.py` compares no authorities — so two
    bindings naming the same vault principal validate cleanly. The invariant is
    held TODAY by review and by estate wiring. Making it provable means
    extending `contracts/schemas/`, which carries the full contract-release
    ritual, and is named as an owed successor (tasks §4.5) rather than folded in
    here."* That successor is registered a second time in the same packet's
    task list (§4.5, verbatim: *"NAMED SUCCESSOR, owed: extend the published
    binding shape so the per-system authority is REPRESENTABLE"*) and a third
    time in its "Next" section. This change is that successor and nothing wider.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, checked rather than assumed. No
    staged topic carries this subject. The nearest is
    `ideation/staging/notebook-access-wallet-governance/`, whose subject is the
    OUTBOUND half — how a HUMAN grantee's access to a shared notebook is held
    and revoked — and which explicitly targets `lifecycle-notebook-projection`
    and the share-out roster. This change is the INBOUND half: which of OUR
    SYSTEMS holds a binding to a credential and under which fetch identity. The
    two touch the same account and share no delta, and taking `staged` against
    a topic that neither declares this exit nor carries its claims would put a
    staging record behind an origin act that was a ratification's own named
    successor. The organized source is the ratified custody packet, cited above
    and quoted again in proposal.md and design.md, so `ad_hoc` is correct and is
    not a substitute for staging.
    AND THIS FILING IS A FRESH INSTANCE OF ISSUE #318, CITED HERE RATHER THAN
    RE-DERIVED. #318 names the origin-shape gap for drafts: an `ad_hoc` origin's
    own vocabulary pairs naturally with "approved", so a packet that is
    AUTHORIZED but NOT RATIFIED must do by PROSE what the taxonomy has no kind to
    do by declaration — which is exactly the disclaiming work `approved_by` below
    performs at length. The precedent for citing it in this slot is
    `add-modified-block-currency-check/.openspec.yaml`, which faced the analogous
    question and named the issue by number. Joining that queue is cheaper than
    every packet re-deriving the disclaimer from first principles.
  approved_by: >-
    Brett Heap (openxFactory operator authority) — 2026-08-29, in session,
    authorizing this lane: author the queued binding-template consumer-identity
    extension as an OpenSpec proposal in openxFactory, to be put to a
    §7.4-shaped council review before any ratification act. THIS RECORDS
    AUTHORIZATION TO AUTHOR, NOT RATIFICATION OF CONTENT. Ratification is a
    separate act that has NOT happened: this packet stands at `Status: draft`,
    every decision in it is the authoring session's and is flagged for the
    council and for Brett in proposal.md § Authoring decisions put to the
    council, and the council review is commissioned OUTSIDE the clearance
    pipeline by design — proposals are never-convenable through it on the
    unanimous ruling of 2026-08-28.
  approved_on: 2026-08-29
  # A SECOND ACT THE SAME DAY, recorded separately because it authorized a
  # different thing. A §7.4-shaped council reviewed this packet at `e6da07a4`
  # and returned SPLIT 2-2 on the verdict word with a UNANIMOUS 4/4 that the
  # text as drafted was not ratifiable — fifteen blocking amendments across four
  # seats. Brett ruled the same day: ACCEPT ALL BLOCKING AMENDMENTS, one fix
  # round, the ratification read after. That ruling authorized THIS REVISION and
  # nothing further. It is NOT a ratification of the amended text, and the
  # ratification act remains OPEN.
  council_review:
    held: 2026-08-29
    object: openxFactory PR 497 at e6da07a4
    outcome: >-
      Split 2-2 on the verdict word (lead-architect and lead-security REFUSE AS
      DEFINED; lead-quality and company-policy-lead ACCEPT AS AMENDED, both
      saying in terms that the word was the only thing separating them);
      UNANIMOUS 4/4 that the text as drafted was not ratifiable. Four seats
      independently reached ONE amendment — the block's `required:` list was an
      unphased narrowing at the minor, falsifying a scenario that would have
      promoted into canon — and every one of them found it by BUILDING the
      prescribed schema rather than reading it. The convener separately found
      that issues #329 and #330, asserted OPEN at four sites in this packet,
      had both closed on 2026-08-27; no seat found that.
    ruling: >-
      Brett Heap, 2026-08-29, in session: ACCEPT ALL BLOCKING AMENDMENTS; one
      fix round; ratification read after. Authorizes this revision only.
    # THREE FURTHER RULINGS, 2026-08-29 in session, recorded separately because
    # each decides a question the bench deliberately left to the liaison rather
    # than a question the bench answered.
    rulings:
      - id: decision-2-route
        question: >-
          The four-seat convergent amendment offered two routes and the bench
          expressed no preference: (i) PHASE the block's `required:` list to the
          major with the closure, or (ii) DELETE THE PROMISE that a pre-existing
          locally shaped `consumer:` object stays valid, striking the scenario
          from spec.md, proposal.md, design.md and the README.
        ruled: >-
          ROUTE (i) CONFIRMED. The promise is kept and the narrowing is phased,
          rather than the promise being withdrawn to match a narrowing. Recorded
          at design.md section 5's head, where route (ii) is also preserved as a
          coherent design that was considered and ruled against.
      - id: P-2-packaged-fixture-identifiers
        question: >-
          Parked by lead-security under its own escalation rule (LS-C1): whether
          the packaged, digest-pinned, distributed corpus may name the LIVE
          xFactory sync-lane and openXdox fetch identities.
        ruled: >-
          SYNTHETIC IDENTIFIERS. The positive two-consumer fixture MUST NOT name
          the live identities; they stay in the consuming installs' own
          credentials/ trees under the residency model. P-2 is DISCHARGED rather
          than parked. Encoded at spec.md's disclosure scenario and tasks 3.1
          and 3.5.
      - id: P-3-delta-pair-governance-gap
        question: >-
          Raised by lead-architect (LA-C2) and concurred by lead-quality (LQ-C5):
          the estate-level MODIFIED-over-a-sibling's-ADDED gap — no governing
          requirement, no evaluating arm, no marker. Both seats said this change
          must neither close it nor be delayed for it.
        ruled: >-
          FILE THE SUCCESSOR NOW. Filed as openxFactory issue #502, carrying the
          three holes with line citations, the four questions a successor must
          settle, and the measured population (FOUR live PENDING pairs on
          origin/main 3b342561; the seats' "eight" is the cumulative figure).
          This change neither closes nor waits on it. Cited from design.md
          section 7 and tasks section 8.
