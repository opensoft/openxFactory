  reason: >-
    A RULING IN ANOTHER REPOSITORY QUEUED THIS PACKET BY NAME, BY REPOSITORY
    AND IN A MATCHED PAIR. OpsxFactory PR #248 (merged `40aaa93b`), comment
    https://github.com/opensoft/OpsxFactory/pull/248#issuecomment-5571629298,
    Brett Heap in session 2026-09-07T13:51Z, first-hand to lane opsXfactory-1,
    ruling F.3. Two verbatim selections: the rule's SHAPE is "Header/bookkeeping
    edits only + re-derive pins", and its HOME is "Both at once" — "an
    OpsxFactory change (dated amendment to `docs/packet-lifecycle-headers.md` +
    an ADDED requirement: header/bookkeeping edits only under a recorded ruling,
    and every edit of a pinned target re-derives dependent pins in the same
    change) AND an openxFactory change amending the promoted document-lifecycle
    capability, with the OpsxFactory re-pin." The ruling states its own
    exposure: "two claims in two repos."
    THE MOTIVATION IS MEASURED, AND IS CITED HERE RATHER THAN RE-DERIVED.
    OpsxFactory commit `57fd9fd2` (2026-08-24, "Discharge all 55 lifecycle-header
    defects in the OpenSpec scan set", 63 files) wrote SIXTEEN files under that
    repository's `openspec/changes/archive/` tree, under its own ratified
    2026-08-24 convention `docs/packet-lifecycle-headers.md` § "Editing an
    archived packet" — a convention that required only a bookkeeping note. It
    broke THREE executed consent instruments' `custody.sha256`, one of them in a
    change directory that has NEVER been archived, and it went thirteen days
    unnoticed. The "FR-072 forbids archive writes" reading that two OpsxFactory
    packets cited was feature 010's close-time fence, not a general rule — so
    there was no general rule, only the permissive convention. Register:
    OpsxFactory
    `openspec/changes/add-pre-archive-citation-gate/supporting-docs/owed-findings.md`
    § F.3 — the LIVE path at OpsxFactory main today. That packet's archive is IN
    FLIGHT (OpsxFactory PR #273, still OPEN at this writing) and on merge the
    register files at
    `openspec/changes/archive/2026-09-07-add-pre-archive-citation-gate/supporting-docs/owed-findings.md`.
    Both are named rather than one asserted: citing an archive path before the
    archive lands is a claim about a file that does not yet exist.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/` was listed in full (33 topic folders) and `INDEX.md`
    read: no topic names archived-record editing, archive immutability,
    bookkeeping corrections, pinned-target integrity or content-address
    re-derivation. The organized source is a recorded in-session ruling on
    another repository's pull request, which is the shape `ad_hoc` exists for.
    NOTHING IS REALIZED BY THIS PACKET. No archived byte is edited, no pin is
    re-derived, no checker is written, no convention is amended, and every box
    in `tasks.md` is unticked.
  approved_by: >-
    Brett Heap (openxFactory operator authority; repository owner) — the F.3
    ruling of 2026-09-07T13:51Z on OpsxFactory PR #248, whose "Both at once"
    selection named THIS repository and the promoted `document-lifecycle`
    capability as one of the two homes.
    THIS FIELD RECORDS AUTHORIZATION TO AUTHOR, NOT RATIFICATION OF CONTENT.
    The ruling chose the rule's shape and its two homes; it did not choose the
    requirement titles, the delta shape (one MODIFIED plus two ADDED), the
    by-effect definition of the bookkeeping class, the ruling-before-the-edit
    ordering, the stricter-may/looser-may-not clause, or the refusal posture
    where a family declares no re-derivation rule. Each of those is the
    authoring session's and is flagged for veto in `design.md` as decisions
    D-1 through D-8. At the time this field is written the packet is
    `Status: draft`, carries no ratification citation and owes none; whether
    its content is ratified is a separate act of Brett Heap's, tracked as
    task 1.1.
