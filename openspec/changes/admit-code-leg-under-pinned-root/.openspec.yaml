  id: openxFactory:adhoc:2026-09-24-admit-code-leg-under-pinned-root
  reason: >-
    THE ESTATE INVENTORY CANNOT RECORD A CODE LEG NESTED UNDER A PINNED ASSEMBLY ROOT, SO A `code_surface:` CANNOT NAME WHERE A NEUTRAL PRODUCT'S CODE IS WRITTEN. `scripts/estate-repository-inventory.yaml` (release-realization, realized by #1119 -> `5e122388`, archived by #1149 -> `dd2466ad`) admits a repository by five closed kinds, and none of them admits `opensoft/openDox-code` or `opensoft/openXdox-code`, the code legs carried as gitlinks by the assembly roots `opensoft/openDox` and `opensoft/openXdox`, which openxFactory pins by commit and digest in `contracts/opendox-pin.yaml` and `contracts/openxdox-pin.yaml`. MEASURED ON THIS BRANCH'S BASE `1d14fee6`, NOT ASSERTED: a scratch inventory carrying `opensoft/openDox-code` as `governance: pinned`, admitted by a `gitlink` in `opensoft/openDox`, is REFUSED at load by `scripts/estate_inventory.py` line 966 (`validate-estate-inventory.py --inventory <scratch>` exits 2: "THE KIND SAYS GOVERNED and means it"); `pin` is excluded because openxFactory never pins or mounts a leg (`split-opendox-two-layer-product` task 5.1, restated in both pin files, which openxFactory #1150 cites as RULING OQ-2); `workflow` evidence is read at three structural sites and never from the `run:` lines (`pytest-suite.yml:425`, `openxdox-consumer-gate.yml:239`) through which openxFactory's workflows reach the legs; `change` fails because the carving change is archived. The consequence is live: `add-neutral-product-standalone-operability` (#1144, ratified 2026-09-24) names the two ROOTS in its head on Brett Heap's ruling `5804191141` ("1, name the roots and file the follow-up") and re-points at the legs once this lands. THE SHAPE WAS MEASURED BEFORE IT WAS CHOSEN: at the commits the two pins name (`dc7aa08f`, `2f3f857d`, equal to openxFactory's own `openDox` and `openXdox` gitlinks), each root's `.gitmodules` names exactly two legs, `spec` and `code`, and the other two pin-admitted `pinned` rows (`opensoft/openXwallet` at `f3eb929b`, `opensoft/openRepoShape` at `e9c4827b`) carry no submodule at all, so the widened carrier admits FOUR repositories and moves no other row. AND THE ONE NEW HAZARD THE SHAPE BRINGS WAS MEASURED TOO: on git 2.43.0 an unguarded `git show <commit>:.gitmodules` in a `--filter=blob:none` partial clone lazily FETCHED the blob from its promisor remote, while the same read under `GIT_ALLOW_PROTOCOL=none` was refused ("transport 'file' not allowed", exit 128), so the pinned-commit read the delta requires is network-free only with every transport refused, which `design.md` D5 states as a realization obligation. WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED: `ideation/staging/` was grepped on 2026-09-24 for `estate inventory`, `estate-repository-inventory`, `code leg`, `pinned root` and `pinned assembly root`, and returned nothing; `kind: staged` would claim a staging source that does not resolve. The organized source is openxFactory #1150, filed 2026-09-23 by lane `openxfactory-4` with three candidate shapes, and CLAIMED by this lane before authoring.
  proposed_by: Lane `openxfactory-5` (display `openXfactory-5`), session `d7c51922` (workstation Eagle), as the standing claim holder of openxFactory issue #1150 (CLAIMED 2026-09-24T16:36:12Z) and as the lane that realized the inventory this packet widens. NO APPROVAL PAIR IS DECLARED HERE AND NONE IS IMPLIED. Brett Heap's word of 2026-09-24, approximately 16:52Z, verbatim "(a) recommended for both, ratify when the draft is green" — given in the lane's terminal to lane `openxfactory-5` (session `d7c51922`) BEFORE this filing and recorded as a `RULED` entry against `opensoft/openxFactory#1150` in `opensoft/brett-wip` `lanes/log/openXfactory-5.md` at commit `536b7ecf` — RULES decision D1 now and ratifies this packet only WHEN ITS DRAFT HEAD IS GREEN, so until that condition is met the lawful shape is the unapproved one `add-drafted-proposal-origin` (issue #318) defined: drafting provenance, no `approved_by`, no `approved_on`, and this packet's three lifecycle documents carry `Status: draft` to match; its one spec delta carries no lifecycle header. The approval pair is a pure ADDITION beside a fixed `kind` and `id`, made when the condition is met and not before. THE DECISIONS PUT ARE `design.md` D1, D4 AND D6, at `proposal.md` § *The decision, put for a veto* with the recommendation first, and D1 IS RULED: the word names option (a) and is otherwise bare, so D4 and D6 take the recommendation when it applies. D1, the shape: (a) a `gitlink` whose carrier may be a `pinned` row admitted by exactly one `pin`, read at the commit that pin names (recommended), against (b) a sixth admission kind for a leg of a pinned root, and (c) reading `run:` `git submodule update` lines as workflow evidence (rejected: it reverses a deliberate reading rule and still needs the root's `.gitmodules` to turn a path into an address). D4, the leg's governance class: a row a pinned root's gitlink admits SHALL NOT declare `governed` (recommended), against leaving the class to the author and against requiring exactly `pinned`. D6, the delta kind: one `## MODIFIED` block over the enumeration requirement alone (recommended), against also modifying the membership requirement. NOTHING IS PROMOTED, NOTHING IS REALIZED AND NOTHING IS ARCHIVED BY THIS FILING. This pull request edits no file under `openspec/specs/`, adds no script, no inventory row and no test, and `tasks.md` §§ 1, 3, 4, 5 and 6 stay open. `code_surface` is NON-EMPTY, so under `release-realization` the archive is a separate act on merged-plus-green realization evidence and a separate word, and openxFactory #1150 stays OPEN and closes THERE.
