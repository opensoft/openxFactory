origin:
  kind: ad_hoc
  id: openxFactory:adhoc:2026-09-02-declare-spent-bundle-state
  reason: >-
    THE NAMED SUCCESSOR OF A DEFECT A RELEASE CUT MET, DECLARED AND REFUSED TO
    FIX INSIDE ITSELF. openxFactory issue #575, filed by the `contract-v3.0` cut
    (PR #573, squash `ff9ed815`) at the moment it hit the collision rather than
    afterwards, and named in `contracts/CHANGELOG.md` § `contract-v2.6`
    disposition so that a reader meeting the ERROR knows it is DECLARED rather
    than undiscovered.
    THE DEFECT, quoted from that entry: the `release-tag-publication` family
    "SIMPLY HAS NO THIRD STATE between published and owes a tag, and a
    spent-never-publishable number is that third state." `contract-v2.6` was
    declared at `bbbbeda9` (PR #565), is never verifiable (five
    HGR-RELEASE-DIGEST-MISMATCH findings, measurement of record PR #565 comment
    5502452624), can never carry a legal tag under the targeting rule, and
    declares change class ADDITIVE over a tree that refuses three shapes
    `contract-v2.5` accepted — which no completion commit and no rebuilt
    inventory can cure. Brett Heap ruled it 2026-09-02, verbatim as quoted in
    #575: "Supersede: v3.0 is the completion."
    WHY THE CUT DID NOT TAKE IT, and why this is a separate packet: the ruling
    said `contract-v3.0` supersedes `contract-v2.6`, NOT that a checker should
    stop objecting to abandoned bundles. The entry records that the shape of any
    such vocabulary — "what record counts as a supersession, who may declare
    one, whether it is `contested` and needs a disposition entry" — is "design
    work that owes its own change and its own review", and that "a release cut
    quietly relaxing the one check that exists to stop bundles being walked away
    from is precisely the failure that check was built for."
    WHY `kind: ad_hoc` AND NOT `kind: staged`, checked rather than assumed. No
    topic under `ideation/staging/` carries this subject and `INDEX.md` holds
    nothing on release-tag publication states. The organized source is a GitHub
    issue carrying a recorded ruling and a measurement, which is the shape
    `add-requirement-ref-resolution-integrity`,
    `fix-content-resolution-conflation` and
    `fix-pin-value-boundary-and-sentinel-split` all filed under. `ad_hoc` is
    correct here and is not a substitute for staging.
  approved_by: >-
    Brett Heap (openxFactory repository owner) — commissioned in session on
    2026-09-02, relayed to the authoring session verbatim: "Merge now, fix #575
    next", the first clause disposing of PR #573 and the second commissioning
    this packet.
    THIS FIELD RECORDS AUTHORIZATION TO AUTHOR, NOT RATIFICATION OF CONTENT,
    AND MUST NOT BE READ AS ONE. The citation covers THE DECISION TO WRITE A FIX
    FOR #575 and nothing else. Every decision beyond that clause was the
    authoring session's, is listed in proposal.md § Orchestrator Decisions as
    OD-1 … OD-8, and was FLAGGED FOR VETO when written — as were the three items
    in § Open questions, each of which carries a recommendation and no decision.
    TWO OF THEM CARRY GOVERNANCE CONTENT AND ARE OWED AN EXPLICIT RULING rather
    than acceptance by silence: OD-3, whether a correctly declared spent bundle
    is RECORDED at `info` or SILENT, and OD-4, that the only way to quiet a
    spent bundle is to publish its successor's tag. Tasks § 1.2 carries them.
    AND THIS FILING IS ANOTHER INSTANCE OF ISSUE #318, cited rather than
    re-derived: an `ad_hoc` origin's vocabulary pairs "approved" naturally with
    ratification, so a packet that is AUTHORIZED but NOT RATIFIED must do by
    PROSE what the taxonomy has no kind to declare, which is the disclaiming
    work this field performs. `Status:` is `draft`.
  approved_on: 2026-09-02
