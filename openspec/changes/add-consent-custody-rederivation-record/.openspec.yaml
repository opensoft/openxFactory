  reason: >-
    A RULING IN ANOTHER REPOSITORY QUEUED THIS PACKET BY NAME AND BY
    REPOSITORY. OpsxFactory PR #248 (merged `40aaa93b`), comment
    https://github.com/opensoft/OpsxFactory/pull/248#issuecomment-5571629298,
    Brett Heap in session 2026-09-07T13:51Z, first-hand to lane opsXfactory-1,
    ruling F.1, verbatim: "Bump the openxFactory instrument schema first" — "a
    structured custody-history block is added to the consent-instrument
    contract in openxFactory, a contract version is cut, OpsxFactory re-pins
    (lockstep with the worker-enrollment-broker re-pin), and only then the
    three instruments take their `amendments` entries plus the structured
    block."
    THE FINDING IS MEASURED, NOT REASONED. OpsxFactory's citation sweep
    re-derived the `custody.locator` target of all four executed consent
    instruments on 2026-09-06 at `ddc03ad7`: three of four no longer hash to
    their pinned `custody.sha256`, all three broke at the SAME OpsxFactory
    commit `57fd9fd2` (2026-08-24, "Discharge all 55 lifecycle-header defects
    in the OpenSpec scan set"), and the one that still matches is the one that
    commit did not touch — 3 of 3, with a `Status:` header inserted and no
    other byte changed. The register is OpsxFactory
    `openspec/changes/add-pre-archive-citation-gate/supporting-docs/owed-findings.md`
    § F.1 (live at OpsxFactory main `40aaa93b`; that packet archives
    2026-09-07 to
    `openspec/changes/archive/2026-09-07-add-pre-archive-citation-gate/supporting-docs/owed-findings.md`).
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/` was listed in full and `INDEX.md` read: no topic folder
    names consent custody, custody-digest integrity, content-address
    re-derivation, or the consent instrument's growth beyond
    `contract_schema_version: 2`. The organized source is a recorded in-session
    ruling on another repository's pull request, which is the shape `ad_hoc`
    exists for.
    NOTHING IS REALIZED BY THIS PACKET: no schema byte moves, no contract
    version is cut, no digest inventory is written, no validator leg is added,
    no example is authored, no consumer pin advances, no instrument takes an
    `amendments` entry, and every box in `tasks.md` is unticked.
