    prescribed the split-by-repo direction, and book definitions are
    contract surface requiring an OpenSpec delta before implementation, so
    the delta was proposed the same day (with a cross-model decision review
    of the six architect decisions), ratified in-session, realized,
    migrated, and archived within the same session.
