origin:
  kind: ad_hoc
  id: openxFactory:adhoc:2026-08-10-split-ideation-book-per-repo
  reason: >-
    Incident-driven, authored and ratified in-session on 2026-08-10: the
    shared Ideation notebook hit NotebookLM's 300-source per-notebook cap
    mid-sync, killing the run and leaving every subsequent ideation document
    across the governed repos silently unprojected. The workflow doc's Known
    Limitations section (docs/lifecycle-notebook-projection.md §11) had
    already prescribed the split-by-repo direction, so the proposal went
    straight to OpenSpec from the live incident; no staged topic existed or
    was warranted for a capacity remediation of this shape.
  approved_by: Brett
  approved_on: 2026-08-10
