  id: openxFactory:adhoc:2026-09-05-amend-unreadable-read-sibling-scenarios
  reason: >-
    THE SUCCESSOR THE ARCHIVE NAMES AS OWED. `amend-published-tip-unreadable-scenario`
    (openxFactory PR #678, merge `87c15baa`; archived by #685) retired one clause
    from `doc-health`'s promoted *Release-tag publication* — "the commonest cause
    being a checkout that has not fetched that commit" — after openxFactory #612
    measured it the wrong way round: on the aggregation nightly the commit WAS
    fetched, and nine of the ten governed repositories simply carry no
    `contracts/manifest.yaml` at all. THAT CLAUSE WAS WRITTEN TWICE. The sibling
    scenario "The changelog cannot be read at the published tip" carries it word
    for word over `contracts/CHANGELOG.md` at
    `openspec/specs/doc-health/spec.md:2818`. #678 found this AFTER ratification,
    refused to widen its own ratified scope, and recorded the sibling as an owed
    successor in its `tasks.md` § 4.2 together with the one reading the successor
    owes first: the changelog read has no presence probe of its own, it inherits
    the manifest read's. This packet takes that reading and answers it in both
    halves — the probe IS inherited and is complete, and the WORDS are not, so
    the scenario's third bullet is made true in the family rather than owed by it.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/` was enumerated and `INDEX.md` read on 2026-09-05: no topic
    carries doc-health skip vocabulary, the fetched/absent distinction, or the
    release-tag family's reads. `kind: staged` would claim a staging source that
    does not resolve. The organized source is issue #662 and the archived packet's
    own record of what it left undone.
  proposed_by: >-
    Lane `openxfactory-1` (session `5e783e4d`), authoring the successor
    `amend-published-tip-unreadable-scenario` § 4.2 names. NO APPROVAL PAIR IS
    DECLARED AND NONE IS IMPLIED: no word of Brett Heap's admits this packet to
    the queue or ratifies its text. The lawful unapproved shape is the one
    `add-drafted-proposal-origin` added — drafting provenance, no `approved_by`,
    no `approved_on` — and every document in the packet carries `Status: draft`
    to match. The decision most worth a veto is `design.md` D2: whether the third
    bullet, and with it the `openxFactory` code surface, is in scope at all.
  proposed_on: 2026-09-05
  approved_by: >-
    Brett Heap (openxFactory operator authority) — in session on 2026-09-05,
    lane `openxfactory-1`, verbatim: "ratify 688, land it when green". THIS IS
    THE RATIFICATION ACT AND IT IS ADDED, NOT SUBSTITUTED. The drafting
    provenance above is kept exactly as authored and `kind` and `id` never move,
    which is the shape `add-drafted-proposal-origin` (issue #318) defined for
    this transition: approval is a pure ADDITION to a fixed origin identity, so
    the support manifest that repeats `kind` and `id` never comes to disagree
    with the packet. The decision the word reaches is `design.md` D2 — the third
    bullet and with it the `openxFactory` code surface — which was carried as
    the packet's veto point in the pull request body, in `tasks.md` § 1.2 and in
    the README row, and was NOT vetoed; the cost is ratified with it, namely
    that under `release-realization` this packet archives on merged-plus-green
    realization evidence rather than on landing. The adversarial review's P2
    finding is ratified as an OWED SUCCESSOR (`design.md` D6), not as fixed.
    Record: `review/ratification-2026-09-05.md`.
