  reason: >-
    Commissioned in-session by Brett on 2026-08-28, by a multi-choice put to him
    by the orchestrating session over what to work next; the option he selected
    was that session's recommendation, "the doc-health error floor", and his
    instruction on the three workstreams it named was, verbatim: "lets do all 3
    in order". THIS PACKET CARRIES THE THIRD, whose ruling was relayed as a
    selection rather than as quoted wording: declared generated projections get
    a NON-RECORD status via a change, ending at the root the tension in which
    `ideation/cross-reference.md` is regenerated by tooling on every run yet
    carries `Status: record`. The ruling was explicit that the standing finding
    must clear BECAUSE THE FILE IS NO LONGER A RECORD and not because the family
    was silenced, and this packet takes that literally: no family is skipped, no
    disposition suppresses anything, and `record-immutability` still fires on
    every real record. The other two workstreams ship as
    `clean-doc-health-floor`; they were split from this one because this one
    extends the controlled taxonomy and owes a disposition in the AGGREGATION
    repository, which would have put their archive gate behind an act neither
    of them needs. Not a staged ideation topic — `ideation/staging/` and its
    INDEX carry no topic on generated projections, record immutability, or the
    status taxonomy, so `kind: staged` is UNAVAILABLE rather than declined,
    verified by grep before this line was written. THE FORCING FACTS, measured
    on the day of filing in a fresh worktree off `origin/main` at `6d100e51`:
    `ideation/cross-reference.md` is headed "**GENERATED FILE — do not edit by
    hand.**" on line 8, is rewritten in place from `ideation/cross-reference.yaml`
    by `scripts/render-ideation-cross-reference.py`, is touched by 5 commits on
    main of which 4 re-rendered it (the fifth created it), and carries
    `Status: record` on line 3 — so
    `record-immutability` reports it as "record document changed after capture",
    one of the 5 standing criticals, EVERY TIME the correct act is performed.
    AND PROMOTED CANON ALREADY CONTRADICTS THE HEADER:
    `openspec/specs/ideation-cross-reference/spec.md:449-452` states "the
    orphaned pin is carried by a generated artifact that is not a `record` — the
    cross-reference index and its rendered twin among them" and "nothing about a
    regenerable projection is immutable evidence". Canon says it is not a record;
    the file says it is. Authored in openxFactory because the taxonomy, the
    generator, the checker and the file are all openxFactory's own.
