    "One ruling, one discharge: the landed packet is it." Had the merge order
    gone the other way, both packets would have archived silently — the
    promotion-fidelity family commissioned the same day reads 0 findings either
    way, because canon then holds exactly what both packets said it should.
    This change takes that prevention, and it is authored here rather than in a
    domain repository because the check is domain-neutral tooling and doc-health
    is an openxFactory capability.
