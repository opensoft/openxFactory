  id: openxFactory:adhoc:2026-09-15-adopt-entry-grain-dispositions-form
  reason: >-
    THE FINDING, AND IT IS A MEASUREMENT RATHER THAN A PREFERENCE. openxFactory
    issue #1045, filed 2026-09-15 by lane `openxfactory-2` (display
    `openXfactory-2`) and NOT claimed at filing: `scripts/doc_health/pin_shapes.py`'s
    shape adapter judges the OPTIONAL shape-(c) member `dispositions:` only at the
    MEMBER grain — `_is_disposition_list` (`:217-223`) is `value is None or
    isinstance(value, list)` — while the full verifier's `pinned_dispositions`
    (`scripts/validate-openspec-cli-pin.py:787-857`) ALSO refuses malformed ENTRIES
    in the SAME pure, source-free pass. Measured in this packet's authoring session
    on a fresh clone of `main` at `8944758c`, by importing the verifier at its fixed
    authored path and calling the guard on in-memory records: TEN records the
    guard REFUSES are ACCEPTED by `judge(record, "openspec-cli")` — `[{}]`,
    `[null]`, `["a"]`, an entry missing `cited_to`, `cited_to: []`, `why: ""`,
    `cited_to: "x"`, `level: "WARNING"`, `level: ""`, and an entry naming
    neither `ratified_by` nor `recorded_by` — and ZERO in the other direction.
    The adapter is therefore NARROWER than the guard on the entries and
    nowhere WIDER.
    WHY THAT DIRECTION IS THE ONE THAT MATTERS, IN CANON'S OWN WORDS. `document-
    lifecycle`'s *Prose tagging marker hygiene* says a resolver "that ACCEPTED what
    the shape's own GUARD REFUSES would, on exactly those trees, admit a record the
    repository's own gate rejects at its first shape check". Those trees are the
    ones the adapter exists for — a doc-health fixture tree, an aggregate run, a
    `--single-repo` run over an arbitrary checkout, an added
    `contracts/evil-pin.yaml` — where no pin verifier has run at all. On a landed
    tree the gap is invisible, every record in `contracts/` having already passed
    its full verifier as a required check, which is why #1045 is a FINDING and not a
    defect.
    THE PREDECESSOR RULED IT STANDS AND NAMED THIS SUCCESSOR, VERBATIM. The point
    was raised by an automated review on PR #1040 (round 8) against
    `pin_shapes.py:223` and RULED STANDS by the lane, on grounds that still hold:
    the ratified design D-2 of `extend-prose-tagging-target-to-pinned-capabilities`
    cites exactly `:801-803` and `:804-809` for this member, the two-leg equivalence
    test holds the adapter to the CITED guards, and a record carrying
    `dispositions: [{}]` resolves nothing without a well-formed `capabilities:`
    enumeration naming the capability. That ruling also named what it declined:
    "Extending the optional-member form to the entry grain is a legitimate later
    delta against `neutral-product-pin`/this capability, not this realization's —
    noted, not filed." This packet is that later delta and it is the first; a corpus
    search returns only issue #1045 itself.
    AND THE ASYMMETRY IS INTERNAL TO THE ADAPTER, MEASURED. The table carries
    exactly TWO optional members. For shape (a)'s `pinned_by_commit_only:` the
    adapter ALREADY reaches the entry grain — `_is_path_only_list` refuses `[{}]`,
    matching `scripts/verify-openxwallet-pin.py:449-454` and
    `scripts/validate-openreposhape-pin.py:493-498` — and canon ALREADY states that
    rule in the scenario *A source pin enumerates its members in two different
    forms*. For shape (c)'s `dispositions:` it does not, and canon is silent. This
    packet adds the counterpart scenario, immediately after that one.
    WHAT THE PACKET PROPOSES, AND WHAT IT DOES NOT. ONE `## MODIFIED Requirements`
    block over `document-lifecycle`'s *Prose tagging marker hygiene*, restating the
    promoted requirement IN FULL and adding EXACTLY ONE scenario: a
    published-artifact record COMPLETE FOR ITS REQUIRED SHAPE MEMBERS, whose
    OPTIONAL `dispositions:` entry is the SOLE MALFORMED PART — an entry that
    shape's own pure guard refuses — MUST be reported as an invalid pin naming
    the member AND the entry, MUST NOT resolve, and an absent member, an
    explicit `null` and an empty sequence MUST each still be read as EMPTY.
    `dispositions:` stays OPTIONAL and stays OUT of the shape-guard-required set, so
    canon's sentence "`dispositions:` is NOT in the set: it is read with an
    absent-is-empty default (`:801-803`)" is carried VERBATIM and stays true.
    FILING IS NOT RATIFYING. This packet is a PROPOSAL. It admits no text to canon,
    ratifies no design decision, moves no byte of `scripts/doc_health/pin_shapes.py`
    or of `tests/doc-health/test_pin_shape_adapter.py`, edits no pin verifier, no
    record under `contracts/` and no file under `openspec/specs/`, and ticks no box
    in `tasks.md` section 1. The three lifecycle documents carry `Status: draft`;
    the spec delta carries no lifecycle header, as 308 of the 312 spec-delta files
    measured on `origin/main` do not. Ratification, realization and archive are
    three separate acts on Brett Heap's word, and this filing has none of the three.
    WHY `kind: ad_hoc` AND NOT `kind: staged`. The organized source is an ISSUE and
    a landed pull request's review record — openxFactory #1045 and the round-8
    ruling on PR #1040 — not an `ideation/staging/` topic folder. No staging topic
    holds this subject, and declaring one would name a source that does not resolve.
