    SESSION'S wording for the option it recommended, and quoting it as Brett's
    would attribute an authoring session's phrase to the approver. What Brett
    said is the eight words above, and they are the approval act.
    IT IS AN ADMISSION INTO THE PROPOSAL QUEUE, NOT A RATIFICATION OF CONTENT.
    The citation covers the DECISION TO FILE and nothing else. Every decision in
    `proposal.md` § Orchestrator decisions — the two-packet split on the
    contract-bundle boundary (OD-1), the single all-ADDED delta on `doc-health`
    (OD-2), the realization-only shape for the sentinel split (OD-3), the
    proposed remedy being a trailing boundary rather than a whole-value rewrite
    (OD-4), and the decision to correct rather than restate the inherited record
    of the `"unknown"` sites (OD-5) — was taken by the authoring session and
    stays FLAGGED FOR VETO, as do the four questions in § Open Questions, each of
    which carries a recommendation and no decision.
