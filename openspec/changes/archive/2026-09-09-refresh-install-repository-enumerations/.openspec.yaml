    provenance above is kept exactly as authored and `kind`, `id` and `reason`
    never move, which is the shape `add-drafted-proposal-origin` (issue #318)
    defined for this transition: approval is a pure ADDITION to a fixed origin
    identity, so nothing that repeats `kind` and `id` comes to disagree with
    the packet, and the archive gate's origin-retention arm reads the
    declaration this commit establishes.
    TWO DIFFERENT WORDS, AND ONLY THE SECOND RATIFIES. The earlier word "do
    794, 795 and 796" (2026-09-08 ~14:3xZ, same issue) ADMITTED the work and
    the packet said in terms that it ratified no text; this word reaches the
    text. It was given over a packet whose THREE veto points were carried
    verbatim in `tasks.md` § 1.2 and in openxFactory PR #818's body — `design.md`
