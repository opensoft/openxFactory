    exactly TWO widened units are absent from issue #796's list) and
    `design.md` D5 (the one deliberately OPEN-ENDED widening, "Submodule
    sequencing") — and NONE of the three was vetoed. The packet is ratified AS
    AUTHORED.
    RATIFICATION PERFORMS NO REALIZATION. No promoted specification byte moves,
    the `## Purpose` widening stays OWED at `tasks.md` § 4.1, no box in
