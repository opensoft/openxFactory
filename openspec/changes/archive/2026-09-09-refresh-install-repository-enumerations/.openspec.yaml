  reason: >-
    OQ-9 AND TASK § 8.4 OF THE ARCHIVED `implement-omniworker-install-repo`,
    filed at that packet's archive as openxFactory issue #796 so the owed box
    ticked on a naming rather than staying open, and extended by a 2026-09-08
    addendum that raised its scope from three enumerations to FOUR after
    `copilot-pull-request-reviewer` raised the fourth on PR #803.
    THE GAP IS AN INDEX, NOT A BOUNDARY. `opensoft/OmniWorker-Install` was
    created 2026-09-05T16:15:48Z, admitted to the top-level xFactory aggregation
    at `installs/omniworker-install` by opensoft/xFactory#274 (merge commit
    648c8bd3fc4717e5b969cd95ea3e0207700e8925), and its boundary requirement was
    promoted into `repo-boundary-governance` on 2026-09-08 by openxFactory#803
    (d7fbe933). So the repository exists, is mounted and is governed — while
    four hand-written enumerations across three capabilities still name two or
    four install repositories. One of them, `repo-boundary-governance`'s `##
    Purpose`, has not moved since 9ebceeff (2026-06-26) and is three
    repositories behind.
    WHY IT WAS DEFERRED, AND WHY THE DEFERRAL ENDS HERE. Every predecessor left
    the enumeration alone on `implement-keycloak-install-repo`'s reasoning that
    two changes sharing one requirement collide at archive time. This packet
    CHECKED that collision rather than inheriting it, and it does not exist: no
    active change writes the `Install repository scope` requirement key at all
    (two archived writers only), and the `co-modifier` class on both `implement-
    keycloak-install-repo` and `implement-openxpki-install-repo` comes from each
    sharing its OWN sibling boundary requirement with an active partner (`add-
    identity-brokering`, `add-trust-anchor`), not from the enumeration. Grepping
    all 41 other active change directories for each of the seven requirement
    titles this packet writes -- the six it MODIFIES plus the one it ADDS --
    returns zero hits, so nothing is owed under `release-realization`'s
    ordered-deltas rule. THE LEDGER ROW NEVERTHELESS SEEDS `class: co-modifier`,
    and that is not a contradiction: the ledger's corpus is active PLUS
    archived, and `admit-install-repos-to-aggregation` -- archived -- wrote
    `Install repository scope` in August. `class:` states a fact about HISTORY;
    the absence of a LIVE collision is the separate fact above. Which is why
    this packet DECLARES `sequenced_after: [admit-install-repos-to-aggregation]`
    at depth 1, the positive claim that its deltas are relative to that
    change's outcome, rather than leaving the field absent.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/INDEX.md` and every topic folder were read on 2026-09-08:
    no topic carries the install-repository enumerations, the index-versus-
    authority question, or the aggregation mount list. `kind: staged` would
    claim a staging source that does not resolve. The organized source is issue
    #796 and the archived packet's own design § D6.
