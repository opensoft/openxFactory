    structural reading and left it as a named candidate — "a requirement whose
    text every new family must restate is a requirement every new family can
    truncate — and the fix is to stop restating it: derive the enumeration and
    the counts from `FAMILIES` rather than re-typing them into canon" — and
    Brett commissioned exactly that variant. Authored here because doc-health is
    an openxFactory capability and the requirement being checked is its own.
