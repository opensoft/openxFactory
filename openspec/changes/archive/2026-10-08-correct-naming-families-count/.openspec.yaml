    BRETT HEAP'S WORD OF 2026-10-07, IN SESSION, VERBATIM: "open an OpenSpec
    change for the four families heading". It was given first-hand to lane
    `codeXfactory-5` and logged RULED on that lane's register at
    2026-10-07T09:45:29Z (opensoft/brett-wip `lanes/log/codeXfactory-5.md`).
    THAT SENTENCE AUTHORIZED AUTHORING AND OPENING THIS PROPOSAL AND NOTHING
    MORE. It is not a ratification and it rules on no design point: the
    count-free reading, the scope of the correction and the doctrine wording in
    this packet are PROPOSED for Brett Heap's ratification and are not his
    rulings.
    THE DEFECT, MEASURED 2026-10-07 ON `main` `16779816`. The promoted
    capability `project-repo-schema` says "The four live naming families SHALL
    be governed as DATA by the naming policy of the pinned openRepoShape
    standard" (`openspec/specs/project-repo-schema/spec.md:108`), and the
    ratified doctrine `docs/project-repo-schema.md` heads its section "Naming,
    and the four families" (:236) and says "The four families are governed as
    DATA in the pinned standard's `contracts/repository-naming.yaml`" (:248).
    That was true at the pin in force when canon was promoted on 2026-09-03,
    openRepoShape `deacbdc`. It has been false since openxFactory's pin moved
    to `122d729b` on 2026-09-04 (PR #650), whose naming policy declares five
    families, and it is false at the pin in force today, `1a9fc537` (PR #1260,
    landed 2026-10-07 as `f335c077`), whose policy declares six and calls them
    "the six live naming families" in its own header.
    WHY THE DEFECT NEEDS A CHANGE. Both sentences sit in canon and in a
    `Status: ratified` document, so neither can be corrected by an edit: the
    canon sentence moves only through a `## MODIFIED` block, and the doctrine
    sentence follows its ratified amendment, as
    `amend-register-act-5b-projection-proof` and `prefer-triad-project-shape`
    did.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/` was searched on 2026-10-07 (main `16779816`) for
    `naming famil`, `repository-naming`, `four famil` and `openreposhape`. Two
    files match and neither proposes this correction:
    `ideation/staging/INDEX.md` is the topic inventory, and
    `ideation/staging/opendox-two-layer-product/` names openRepoShape as a
    public product. The organized source is the owner's word above.
