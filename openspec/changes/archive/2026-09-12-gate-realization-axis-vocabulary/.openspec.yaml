    by this ratification.
    THE ARCHIVE IS A SEPARATE ACT ON A SEPARATE WORD AND IT IS NOT PERFORMED
    HERE. `code_surface` is NON-EMPTY, so under `release-realization` this
    packet archives on MERGED-PLUS-GREEN REALIZATION EVIDENCE at canon's grain
    — this pull request merged into `main` and a green `pytest-suite` run at
    the tree that merge carries — rather than on landing. `tasks.md` § 5 stays
    ENTIRELY OPEN, § 6 (residue) stays ENTIRELY OPEN, and openxFactory #956
    therefore closes at the archive and on no earlier pull request.
