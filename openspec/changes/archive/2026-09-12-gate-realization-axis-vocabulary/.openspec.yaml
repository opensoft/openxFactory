    https://github.com/opensoft/openxFactory/pull/963#issuecomment-5646922493).
    THIS IS THE RATIFICATION ACT AND IT IS ADDED, NOT SUBSTITUTED. The drafting
    provenance above is kept exactly as authored and `kind` and `id` never
    move, which is the shape `add-drafted-proposal-origin` (issue #318) defined
