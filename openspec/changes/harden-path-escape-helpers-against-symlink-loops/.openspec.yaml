  id: openxFactory:adhoc:2026-09-17-harden-path-escape-helpers-against-symlink-loops
  reason: >-
    FOUR PATH-CONTAINMENT GUARDS PROMISE AN ANSWER AND THREE OF THEM RAISE INSTEAD. `pathlib.Path.resolve(strict=True)` signals a symlink loop as a `RuntimeError`, not an `OSError`, and `RuntimeError` is a subclass of neither `OSError` nor `ValueError`. MEASURED HERE, NOT QUOTED, on a fresh clone at `c6997f12` and on the interpreter the required check pins (`.github/workflows/pytest-suite.yml:556`, `python-version: "3.12"`; measuring shell `Python 3.12.3`): the loop raises `RuntimeError` at the candidate's LEAF and at any PARENT COMPONENT alike. Three modules carry a guard that resolves a candidate, compares it with the resolved root, and hands its caller a NEGATIVE ANSWER so the candidate is DROPPED rather than judged: `scripts/code_surface.py` `_unescaped` (:746, clause :777), `scripts/target_release.py` `_unescaped` (:600, clause :630) and `_registry_present` (:354, clause :394), and `scripts/proposal-support.py` `_contained` (:341, clause :347). Each names only `OSError` (the last names `OSError` and `ValueError`), so all four clauses are open at the failure a symlink loop produces; but ONLY THREE OF THE FOUR ARE DRIVEN TO THAT CLAUSE BY A COMMITTED TREE SHAPE. The fourth, `_registry_present`, is a CLAUSE-LEVEL, RACE-ONLY case: re-measured at this head in all three positions the first requirement names, a loop at the registry LEAF `contracts/releases`, a loop at the ANCESTOR `contracts/`, and `repo_root` itself a loop, it returned `False` every time, `stat` absorbing the loop at the `is_dir()` pre-check on :390 rather than raising. Where the pre-check DOES pass, the registry is a real directory every component of which `stat` has just resolved, so only a tree that changes BETWEEN the pre-check on :390 and the resolution on :392 puts the loop inside the clause. DRIVEN END TO END, NOT INFERRED: on a minimal tree whose one change directory carries `proposal.md -> loop-b -> proposal.md`, `scripts/validate-code-surface.py` and `scripts/validate-target-release.py` both end in a traceback; with the loop on `.openspec.yaml` instead, so do `former_identity_claimants` and `declared_former_ids_in_tree`, the two public readers the archive gate's former-identity arm is built on. A traceback is neither a drop nor a finding: it is the gate refusing to report on the tree at all, which is the one outcome each guard's own docstring was written to prevent. THE CORRECTION MUST REACH ALL THREE MODULES IN ONE ACT, WHICH IS WHY IT IS A PACKET AND NOT A FIX. `code_surface._unescaped`'s docstring ends "`target_release._unescaped` is the exact shape this mirrors"; `target_release._unescaped`'s opens "THIS IS `_registry_present`'S TEST, GENERALIZED TO ANY PATH THIS MODULE OPENS". Those two sentences bind the four sites into one claim of identity, and widening one module alone would falsify it. `target_release.py` realizes the ARCHIVED `gate-realization-axis-vocabulary`; `proposal-support.py` is the governed OpenSpec wrapper the estate's archive acts run through; `code_surface.py` realizes `gate-code-surface-declarations`, whose archive is still held on merged-plus-green evidence. This is the disposition PR #1029 recorded rather than taking the rider (comment 5703004913), and openxFactory issue #1074 is the follow-up it promised. #1074'S OWN TEXT IS CORRECTED BY THIS MEASUREMENT: it says `_registry_present` is shielded "except when the repository root itself sits behind a loop", and that exception does not hold either, `is_dir()` answering `False` rather than raising so the function returns at :390 and never reaches :392. No tree state was found that drives that guard to its clause; it is widened anyway, for the three reasons `design.md` D3 records. WHY TWO `## ADDED` REQUIREMENTS AND NOT A `## MODIFIED` BLOCK. The promoted corpus carries NO requirement about what this capability's readers do when a path cannot be resolved at all; the only symlink sentence in canon is `document-lifecycle`'s pin-record containment rule, over a different reader and a different tree. There is no current text to restate. The nearest titles, *Realization axis vocabulary is gated* and *Realization axis declaration*, are ALREADY written by the active ratified `add-target-release-deferred-allocation`, so a second block over either would owe `sequenced_after:` on it, take its pre-text from that change rather than from canon, inherit its archive-order hold, and add a third active writer to a requirement whose existing two are part of the population this repository's modified-block-currency self-gate is red on today. Two ADDED requirements over NOVEL titles owe none of it and edit no promoted byte; both titles were checked against `openspec/specs/`, every active delta and the archive, and appear nowhere else. WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED. `ideation/staging/` was enumerated on 2026-09-17 (31 topics): none names a path-containment guard, a symlink loop, a resolution failure, or the exception surface of this repository's validators. `kind: staged` would claim a staging source that does not resolve. The organized source is openxFactory issue #1074, filed by this lane on 2026-09-16 at the landing of PR #1029 and claimed before authoring.
  proposed_by: Lane `openxfactory-5` (display `openXfactory-5`), session `651195c7` (workstation Eagle), as the standing claim holder of openxFactory issue #1074 (CLAIMED comment 5714101833). NO APPROVAL PAIR IS DECLARED AND NONE IS IMPLIED, AND NO WORD OF BRETT HEAP'S RATIFIES ANY WORDING HERE. The lane FILED the issue and then CLAIMED it; filing a finding and authoring a proposal decides nothing and admits no text to canon. The lawful unapproved shape is the one `add-drafted-proposal-origin` (issue #318) defined: drafting provenance, no `approved_by`, no `approved_on`, and this packet's three lifecycle documents carry `Status: draft` to match; its one spec delta carries no lifecycle header. Approval, when it comes, is a pure ADDITION beside a fixed `kind` and `id`. THE DECISIONS MOST WORTH A VETO ARE `design.md` D1, D2, D3 AND D4, put as ONE multiple choice at `proposal.md` § *The decision, put for a veto* (OQ-1) with the recommendation first. D1: which capability and which delta kind: two `## ADDED` requirements over `release-realization` (recommended), against a `## MODIFIED` block over either realization-axis title, against a new capability of its own. D2: how many acts: ONE act across all four sites in all three modules (recommended), against three riders on three owning packets, against fixing only the three reachable sites. D3: `_registry_present`, which no tree state reaches: widen it too and declare its proof a test of the CLAUSE (recommended), against leaving it and naming a successor. D4: the scope of the obligation: the containment ROLE (recommended), against every `except OSError:` in the three modules, against naming the four clauses literally so the requirement rots on the next line move. D5 (the test shape) is NOT put for a veto: it is the second requirement's own subject. NOTHING IS PROMOTED, NOTHING IS REALIZED AND NOTHING IS ARCHIVED BY THIS FILING. This pull request edits no file under `openspec/specs/`, moves no byte of any script, adds no test and commits no symlink; `tasks.md` § 1 is Brett Heap's act, and §§ 3, 4, 5 and 6 stay entirely open. `code_surface` is NON-EMPTY, so under `release-realization` the archive is a separate act on merged-plus-green realization evidence and a separate word, and openxFactory #1074 stays OPEN and closes THERE.
  proposed_on: 2026-09-17
