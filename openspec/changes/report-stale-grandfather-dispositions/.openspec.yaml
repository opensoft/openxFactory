  id: openxFactory:adhoc:2026-09-11-report-stale-grandfather-dispositions
  reason: >-
    THREE RECORDED RULINGS DISPOSE OF NOTHING AND NO ARTIFACT ANYBODY READS
    SAYS SO. `fam_ratified_provenance`'s grandfather pass, landed by
    openxFactory PR #945 on #939, reads the aggregation's
    `health/dispositions.yaml` and downgrades a finding to `info` exactly when
    the finding's `(repo, path)` carries a dated, cited `family:
    ratified-provenance` entry AND the path is archived. THE CONVERSE IS
    REPORTED NOWHERE. An entry naming a record that has since been REPAIRED, or
    a path that has since VANISHED, matches no finding, moves no severity and
    appears in no row; it stops disposing anything silently, and the file keeps
    it for as long as nobody re-reads it by hand. The rule the landed arm
    implements is one SET EQUALITY over whatever the file records and whatever
    the run reports, and it honours neither half of the difference.
    THE POPULATION IS RE-MEASURED AT AUTHORING AND IT IS NOT ZERO. At
    `opensoft/xFactory` `main` `0ecb370e8fec2c1ac78498adf8f6a4ea3ca1c9bb`,
    `health/dispositions.yaml` is a 49-entry list of which 18 carry
    `family: ratified-provenance` — 15 `openxFactory`, 3 `codexFactory` — every
    one dated, cited and naming a path under `openspec/changes/archive/`. Run
    against that file with each repository materialized at the pin the
    aggregation holds (`openxFactory` `b91af6ea`, `codexFactory` `2dd4e5a3`),
    the family reports 35 rows, `20 critical / 15 info`: FIFTEEN entries match a
    live finding and THREE match nothing. All three are codexFactory's, and all
    three are stale by REPAIR — each record now carries `Status: ratified` with
    a `Ratified:` line naming an approver and a date, so no arm of this family
    opens a finding against it and the entry that grandfathered it reaches
    nothing. The same measurement taken with each repository at its own
    `origin/main` instead (`openxFactory` `8015d45f`, `codexFactory`
    `dc67ad82`) returns the IDENTICAL 15/3 split, and a THIRD rig taken at the
    encode after both repositories moved (`openxFactory` `c521504c`,
    `codexFactory` `c3108adc`, the aggregation byte-unmoved at `0ecb370e`)
    returns that SAME 15/3 split over the same three paths — so the residue is
    a fact about the file rather than an artefact of a lagging pin.
    THE REMEDY IS A PACKET AND NOT A PATCH, because the promoted requirement
    does not say it. `doc-health`'s *Governed corpus membership and the
    lifecycle scan set* is where this family's disposition reading is written —
    its *A finding is grandfathered by a recorded disposition* scenario,
    promoted into canon at `bc1f25c4` — and that scenario governs only the
    entries that MATCH. A new finding class with its own severity, its own
    subject and its own population is exactly the shape the parent packet
    refused to smuggle in: `design.md` D6 of
    `honour-grandfather-dispositions-in-ratified-provenance` names it as a
    successor rather than taking it, and that packet's `tasks.md` § 7.1 ticks
    by naming openxFactory issue #965 and by nothing else.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/` was enumerated on 2026-09-11 — 30 topic folders — and
    `INDEX.md` read: no topic names doc-health severity policy, the disposition
    mechanism, a stale-entry rule or ratification-record rules. The only
    `grandfather` hits in that index are the credential-escrow registry's
    ruling C, a different mechanism in a different capability. `kind: staged`
    would claim a staging source that does not resolve. The organized source is
    openxFactory issue #965, filed by this lane AT the parent's archive as the
    successor § 7.1 owes.
  proposed_by: >-
    Lane `openxfactory-1` (display `openXfactory-1`), session `c44b04`
    (team-01f), on Brett Heap's word of 2026-09-11 at approximately 18:20Z,
    verbatim **"usage reset, resume all. read handoff and resume and fan out
    wide and do as much as possible in parallel"**.
    NO APPROVAL PAIR IS DECLARED AND NONE IS IMPLIED. That word COMMISSIONS THE
    AUTHORING and ratifies no wording: it admits no text here to canon, takes
    none of the decisions this packet carries, and is not read as an approval of
    any of them. The lawful unapproved shape is the one
    `add-drafted-proposal-origin` (issue #318) added — drafting provenance, no
    `approved_by`, no `approved_on` — and every document in this packet carries
    `Status: draft` to match. Approval, when it comes, is a pure ADDITION beside
    a fixed `kind` and `id`. Ratification, promotion and archive are three later
    acts on later words.
    THE DECISION MOST WORTH A VETO IS `design.md` D1, AND IT IS PUT AS A
    MULTIPLE-CHOICE QUESTION WITH THE RECOMMENDATION FIRST: what a stale entry
    IS. (1) A PRUNE PROMPT — a new finding class at `warning` against the
    aggregation's own `health/dispositions.yaml`, so the file converges on the
    set the run reports; (2) the EXPECTED RESIDUE of a repair, graded `info`
    with no action; (3) an AGGREGATION DEFECT at `error`. The packet encodes (1)
    and writes the cost of each. A veto re-authors one THEN bullet of the delta
    and one constant in the arm; D2 through D5 stand whichever way D1 goes,
    except that D2's band sentence follows it.
    NOTHING IS PROMOTED AND NOTHING IS ARCHIVED BY THIS FILING. This pull
    request edits no file under `openspec/specs/`; `code_surface` is non-empty,
    so under `release-realization` the archive is a separate act on
    merged-plus-green realization evidence and a separate word, and openxFactory
    #965 closes THERE and not at this landing.
  proposed_on: 2026-09-11
