  reason: >-
    THE ORIGIN IS THE ARCHIVED PACKET'S OWN UNCLOSED RESIDUE, plus the owner's
    question of 2026-09-22. `split-opendox-two-layer-product` archived
    2026-09-22 (#1139 -> `e8fde27f`) at 67 [x] / 0 [ ] / 5 [~] of 72, and its
    own `tasks.md` records what did not close: the governance ledger closed
    and the DEPENDENCY INVERSION did not. openDox-code's
    `src/opendox/consumer_reach.py` names the remedy in the tree - "the
    injection that would make this reach disappear does not exist yet and is
    BUILD-arc work". This packet is that arc's opening and nothing else.
    WHY `kind: ad_hoc` AND NOT `kind: staged`. The organized source is the
    RESIDUE of a ratified, archived packet plus rulings on an issue - the
    founding ruling on `#656` (Brett Heap, 2026-09-04), RULING C2, DIRECTION
    Q5, RULING DQ-1 (`#656` comment `5547049745`) and RULING OQ-B - not an
    `ideation/staging/` topic folder. No staging topic holds this subject, and
    declaring one would name a source that does not resolve.
    WHY IT IS FILED HERE AND NOT IN openDox-spec, WHICH IS ITSELF A FINDING.
    openDox-spec's instance is OPERABLE - `openspec validate --all --strict`
    exits 0 there over four changes - so the brief's default did not fire and
    the choice needed an argument. It is EMPTY: `openspec/specs/` is a
    `.gitkeep`, `openspec/changes/archive/` is a `.gitkeep`, and `openspec
    list --specs` answers "No specs found." The CLI refuses what this arc
    needs on openDox-spec's own changes already - "target spec does not exist;
    only ADDED requirements are allowed for new specs. MODIFIED and RENAMED
    operations require an existing spec." The requirements this arc discharges
    against (`corpus-adapter-seam`, `domain-mapping-declaration`,
    `release-realization`) are promoted HERE; the artifacts it binds
    (`ideation_dashboard`, `corpus_adapter_openxfactory`,
    `scripts/opendox_host.py`, `docs/opendox-carve-manifest.yaml`) are
    openxFactory's; and openDox-spec's own `openspec/project.md` limits it to
    "this leg's scope only". That openDox cannot yet govern its own BUILD arc
    is carried as requirement 8, whose third scenario ENDS this arrangement
    once openDox-spec promotes its assigned 71.
    WHAT THE PACKET PROPOSES. ONE `## ADDED Requirements` block creating the
    capability `neutral-product-standalone-operability` - sixteen requirements,
    sixty-nine scenarios, written domain-neutrally with openDox as the measured
    instance. AGAINST THE 2026-09-22 FEATURE/GAP SWEEP, requirement 1 is the
    guard and answers no gap, requirements 2-9 answer G1-G8, and requirement
    10 answers both G9 and G10; REQUIREMENTS 11-16 ARE THE LATER RULINGS of
    2026-09-22 - the
    neutral submission step, the standalone install's datastore and its local
    identity mode, the health fix loop with its exception rule, and the
    check-pack interface. Each is separately satisfiable and each is falsifiable
    by a command named in `tasks.md`.
    WHAT IT DOES NOT PROPOSE. No code byte. No rewrite of the document
    surface. No doc-health check family moves, no corpus document moves, no
    `openspec/specs/` capability is modified or removed, and no pin, gitlink,
    contract bundle or release tag moves. It does not re-promote openDox's 71
    requirements - that is openDox-spec's act, carried here as a BLOCKED task.
    Where the snapshot generator lives was RULED by Brett Heap on 2026-09-22
    (`#656` comment `5783335210`, "yes, openDox gets its own neutral
    generator") and `design.md` R-G3 records the ruling together with this
    packet's superseded recommendation and the measurement that made the
    ruling the better answer; requirement 4 is written to the OUTCOME, so it
    names no mechanism and is satisfied by the ruled one.
    FILING IS NOT RATIFYING. All three lifecycle documents carry `Status:
    draft`, no approval pair is declared, and nothing here admits text to
    canon.
    AFTER FILING, AND ADDED BESIDE THE ABOVE RATHER THAN SUBSTITUTED FOR IT.
    The text above describes the filing truthfully as of the filing
    (2026-09-22 ~19:45Z), when the packet put G3 to Brett as an open question.
    It was RULED at 20:08:59Z the same day - `#656` comment `5783335210`,
