  reason: >-
    EXIT 1 OF THREE of the staged topic — the tranche its own `## Exit path`
    marks "Composable TODAY", raised without waiting for the rulings its
    siblings wait on. Links 1–3, PLUS the signed transparency log (a tranche-one
    artifact by that same text's sequencing note — "the log is the record; the
    anchors are late additions to it"), PLUS the gate existing from tranche one
    "validating a short chain, rather than arriving at the end validating a long
    one". Tranche two (attestation, links 4–6 and 10, gated on Q7 and on the
    omnigent layer plus `implement-openxpki-install-repo`) and tranche three
    (on-chain anchoring, gated on rulings for Q3 and Q6) are NAMED successors
    and are not drafted here.

    THE TOPIC was registered 2026-08-27 from Brett Heap's expansion ruling of
    that day and hardened by five adversarial review rounds on its own pull
    request (openxFactory PR #452, squash `6612d323`), which is why it is the
    design authority for this packet rather than a starting point: the ten
    links, the hash-linked binding rule, the two enforcement horizons with the
    remediation exemption, the tier model forced by `access_secrets: false`, and
    the on-chain boundary all arrived through that bench. The vendored
    `chain-selection-study.md` beside it is research input, cited and not
    re-argued.

    THIS PACKET IS NOT RATIFIED AND CLAIMS NO RATIFICATION. THE CLARIFY ROUND
    IT ONCE WAITED ON IS DISCHARGED: Brett Heap ruled all seven of the topic's
    open questions on 2026-08-29 (openxFactory pull request #499, squash
    `9c501df6`), and ruled Narrowing A — tier 1 is RATIFYING authority, so
    agent-held REVIEW wallets stay lawful and the realized `wal-agent-mrc-0001`
    is untouched — separately and in session on the same day, the sitting having
    taken the seven questions and nothing else. Narrowing B needed no separate
    act: Q1's disposition itself says no new artifact is created for the
    presentation. Q1 is encoded AS RULED in requirement 1 and no longer flagged;
    Q4's two sequencing facts were already met; Q5 is complied with by writing
    no contract-code posture and NO TRIGGER CONDITION; Q2, Q3, Q6 and Q7 govern
    later tranches and are pre-encoded nowhere. Ratification is Brett Heap's act
    and is recorded in `tasks.md` §2 as an open box.
  approved_by: >-
    NOT AN APPROVAL TO RATIFY, and the field is spelled out because its usual
    reading is stronger than the fact. What is approved is the DRAFTING of this
    packet, GREEN-LIT BY BRETT HEAP ON 2026-08-29 IN SESSION.
    THIS FIELD WAS CORRECTED, AND THE CORRECTION IS THE POINT. As first filed it
    cited the 2026-08-28 session-handoff board, which is an orchestrating
    session's record of his direction and not his word — a weaker warrant than
    the field's usual reading implies. The 2026-08-29 clarify sitting then said
    in terms that it did NOT green-light the drafting and that "the next act is
    his". So the original citation was not merely thin, it named an
    authorization the record explicitly said was still outstanding. He gave it
    separately, in session, on 2026-08-29 — in the same ruling that COLLAPSED
    the two parallel tranche-one packets (#494 and #495) onto this one and
    ADOPTED Narrowing A.
    NOTHING ELSE IS APPROVED — not the requirement text, not the vocabulary act,
    not `target_release`, and above all not ratification.
  approved_on: 2026-08-29
