  reason: >-
    TRANCHE ONE of the staged topic's own three-tranche exit path — the
    tranche its `## Exit path` section calls "composable TODAY" because it
    needs no omnigent layer, no PKI plane and no chain. The topic was
    registered 2026-08-27 from Brett Heap's expansion ruling of that day and
    landed as openxFactory pull request #452 on 2026-08-28 with a vendored
    chain-selection study beside it; its doctrine was hardened across five
    Codex bench rounds on that pull request, and this packet carries the
    settled half of it forward without re-arguing it.
    NO STAGED FILE MOVES AT THIS GATE. This is a partial promotion of ZERO
    files: both documents in the topic folder — the primary fragment and the
    vendored study — are load-bearing for tranches two and three, which are
    NOT raised here, so the topic stays staged for them and its `INDEX.md`
    row records that tranche one was raised. The precedent is the same-week
    `add-credential-escrow-checkout`, whose ruled two-packet split left
    `client-credential-escrow-registry` staged for exit two and updated the
    index row in the packet's own commit. The `Staging ID:` header the origin
    contract requires at the proposal transition is added to the primary
    fragment in this packet's commit; it was absent when the topic was
    registered.
    WHY THIS TRANCHE IS RAISED NOW AND NOT LATER. The topic's tranche-two and
    tranche-three boundaries are gated on rulings and on layers that do not
    exist (Q7 gates tranche two's contract text; Q3 and Q6 gate tranche
    three). Tranche one is gated on nothing: its instrument —
    `add-wallet-carried-review-authority`'s wallet-carried review authority
    with its issuer anchored to the responsible operator — is ratified text
    with its S2 issuer anchor realized, and the wallet primitives it exercises
    are pinned into this repository at `wallet-v1.3`
    (`contracts/openxwallet-pin.yaml`).
  approved_by: >-
    Brett Heap's expansion ruling of 2026-08-27, which registered the topic
