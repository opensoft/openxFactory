# NO SPEC DELTA, DECLARED RATHER THAN OMITTED. `bump-openspec-cli-pin-to-1.12`
# already states every rule this packet exercises — a disposition is scoped to
# one repository, an entry naming another repository is neither applied nor
# stale on this tree, and an entry goes stale on the tree it names when its
# change archives — and its scenario "A consuming repository runs the same pin
# over its own tree" is literally this situation. So this packet ADDS NO RULE:
# it is the first APPLICATION of that rule to a second repository, and the
# honest shape for that is zero deltas declared, not a restatement of ratified
# text under an `## ADDED Requirements` header. A `## MODIFIED` delta against
# that requirement is refused on ordering grounds and was not written: the
# requirement is not yet promoted, the bump being active.
