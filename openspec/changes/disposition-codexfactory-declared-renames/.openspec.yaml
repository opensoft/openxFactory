  reason: >-
    TASK 6.1 OF `add-openspec-cli-pin`, TAKEN FROM THE CONSUMER SIDE, STEP 2 OF
    THREE. #667 named "codexFactory wires the fleet OpenSpec-CLI pin into CI" as
    owed work. codexFactory measured its own tree through this repository's
    pinned entrypoint on 2026-09-05 at `1.12.0` and read `Totals: 23 passed,
    2 failed (25 items)` — 23 of 25 items clean, and the two failures the SAME
    disagreement openxFactory's own pair is: 1.12.0's scenario-currency check
    cannot read this estate's reserved narrowing marker
    ``**Merged into `<destination>` by <change-id> (<date>):**`` and therefore
    re-reports two declared, ratified retitles as ERRORs. codexFactory PR #216
    (`prepare-openspec-1.12-readiness`, head `b2a6af34`) cleared everything
    clearable and converted one marker to the form canon reserves for a retitle;
    it CANNOT clear these two, because the only edit that satisfies the tool is
    to copy the superseded scenario titles back, which reinstates bars two
    ratified changes were written to lower. The disposition mechanism lives in
    THIS repository's pin file, so the acceptance has to be written HERE. This
    packet writes it, scoped to codexFactory and to nothing else.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/` and its `INDEX.md` were read on 2026-09-05: no topic
    carries the OpenSpec CLI pin, a consuming repository's wiring, or a
    finding-disposition. `kind: staged` would claim a staging source that does
    not resolve. The organized source is codexFactory PR #216's evidence record
    and the operator ruling quoted below.
  approved_by: >-
    Brett Heap (openxFactory convener) — 2026-09-05, verbatim to lane
    codexfactory-1: "use recommended name, go on 3 repo shape". The words
    accept, for codexFactory's pair, the same exit he ruled "take exit 2" for
    openxFactory's own pair on the same day (#677): declare the retitle with the
    marker canon reserves for it, and DISPOSITION the residual scenario-currency
    finding rather than copy the superseded scenario back. "3 repo shape" is the
    three-step realization he commissioned — (1) codexFactory PR #216, the
    marker conversion and the readiness measurement; (2) THIS packet, the
    disposition of the two residual findings in the fleet pin; (3)
    `adopt-openspec-cli-pin-gate` in codexFactory, the gate leg and the stack
    re-pin. THIS IS A RULING ON THE SUBSTANCE — it settles which exit
    codexFactory takes and in what order — and it is NOT a ratification of this
    packet's text, which carries `Status: draft` and owes a ratification
    citation from a separate act.
  approved_on: 2026-09-05
