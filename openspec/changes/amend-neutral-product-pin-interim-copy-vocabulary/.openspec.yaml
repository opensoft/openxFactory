origin:
  kind: ad_hoc
  id: openxFactory:adhoc:2026-09-09-amend-neutral-product-pin-interim-copy-vocabulary
  reason: >-
    A DEFECT OF EXPRESSION IN PROMOTED CANON, filed as openxFactory issue #868
    and found by the review bench of a different act. Codex raised it as a P2 on
    PR #780 — the archive of `publish-openspec-cli-pin-as-contract-member`, which
    promoted that packet's delta into `openspec/specs/neutral-product-pin/spec.md`
    — against the promoted requirement *A consumption pin that another repository
    reads is a PUBLISHED contract member, adopted by pin-sync*: "For a repository
    without an `xfactory:` stack pin, this scenario declares a properly documented
    copy 'lawful,' while [the same requirement] explicitly state[s] that declaring
    the copy does not make it lawful … distinguish 'permitted as an interim' from
    'compliant with the required-check requirement', or use one consistent
    status."
    THE FINDING WAS REFUSED IN THAT PULL REQUEST, ON THE PULL REQUEST'S LIMIT AND
    NOT ON THE READING, and the refusal named this packet's shape. The text is
    PROMOTED, RATIFIED CANON: ratified by Brett Heap on 2026-09-07 as part of
    `publish-openspec-cli-pin-as-contract-member` (PR #757 -> `a5940811`,
    ratifying commit `05a9db8b`) and written into the specification byte-for-byte
    by the archive act, whose own evidence is that the promoted block is
    byte-identical to the ratified delta (sha256
    `8d31ffee932339919461da8d69ec4287ad15d14f39f9e64df7c2b13f82bbd902`, 9,462
    bytes, on both sides). Rewording it in that pull request would have edited
    ratified text with no word behind it and destroyed the byte-identity that
    makes the archive auditable. The refusal recorded the remedy instead — "the
    fix is a vocabulary change … and NOT a change to which behaviours are
    admitted — no consumer's conformance outcome moves either way" — and left the
    successor to the owner's word, which working rule 3 requires in general: a
    ratified requirement changes only by a ratified change.
    THE PACKET EXISTS ON BRETT HEAP'S WORD OF 2026-09-09, verbatim "R1 'lawful'
    amendment packet", given in session as one option of several put to him. That
    word commissions the AUTHORING; it ratifies no wording and takes no design
    decision, so this packet is a DRAFT and carries no approval pair.
    WHAT IS CLAIMED IS SMALL AND IS STATED AS SUCH. Two scenario bullets change
    one word each, one body paragraph is added to state the reservation in one
    place, and one scenario is added to assert it. No behaviour moves: the same
    copies are admitted on the same four terms, and the required-check claim stays
    unmet for exactly as long as it did before. The two body sentences that
    already used `lawful` correctly are carried unchanged, because under the
    reserved reading they are right as written.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/` was enumerated and `INDEX.md` read on 2026-09-09: no topic
    folder and no INDEX row names the consumption pin, the declared interim copy,
    the no-stack-pin fallback or this capability's vocabulary. `kind: staged`
    would claim a staging source that does not resolve. The organized source is
    issue #868 and the refused review thread on PR #780.
  proposed_by: >-
    Lane `openxfactory-1` (display `openXfactory-1`), authoring the remedy issue
    #868 proposes, on Brett Heap's word of 2026-09-09 "R1 'lawful' amendment
    packet". NO APPROVAL PAIR IS DECLARED AND NONE IS IMPLIED: that word
    commissions an authoring and admits no text to canon. The lawful unapproved
    shape is the one `add-drafted-proposal-origin` (issue #318) added — drafting
    provenance, no `approved_by`, no `approved_on` — and every document in the
    packet carries `Status: draft` to match; approval, when it comes, is a pure
    ADDITION beside a fixed `kind` and `id`.
    THE DECISION MOST WORTH A VETO is `design.md` D1: the replacement word.
    TOLERATED is recommended and written; PERMITTED is the alternative, and it is
    the word the refusal on PR #780 itself floated ("say `PERMITTED as a declared
    interim` in the scenario"). D1 records why TOLERATED was preferred and what
    changes if the veto lands — two bullets, one added paragraph and one added
    scenario, one word each, and nothing else in the packet moves. D2 (state the
    reservation in the BODY rather than only in the scenario) and D4 (add a
    scenario rather than rely on the body alone) are the other two, each costed.
  proposed_on: 2026-09-09
  approved_by: >-
    Brett Heap (openxFactory operator authority) — on 2026-09-09, lane
    `openxfactory-1` (display `openXfactory-1`), verbatim: "Ratify with
    TOLERATED", recorded on openxFactory PR #870 at 2026-09-09T23:31:12Z. THIS
    IS THE RATIFICATION ACT AND IT IS ADDED, NOT SUBSTITUTED. The drafting
    provenance above is kept exactly as authored and `kind` and `id` never move,
    which is the shape `add-drafted-proposal-origin` (issue #318) defined for
    this transition: approval is a pure ADDITION beside a fixed origin identity,
    so the support manifest that repeats `kind` and `id` never comes to disagree
    with the packet, and the archive gate's origin-retention arm reads the
    declaration this commit establishes. The earlier word of 2026-09-09,
    verbatim "R1 'lawful' amendment packet", stays the ORIGIN of the AUTHORING
    and is not read as an approval.
    THE WORD IS A MULTIPLE-CHOICE RULING AND IT REACHES `design.md` D1, the
    packet's declared veto point: TOLERATED against PERMITTED, the latter being
    the word the refusal on PR #780 itself floated. It is resolved as TOLERATED,
    which is the RECOMMENDED and ENCODED option, so THE PACKET'S WORDING STANDS
    UNCHANGED — the case-preserving substitution over the seven enumerated
    occurrences (`specs/neutral-product-pin/spec.md` lines 121, 133, 134, 170,
    171, 185, 186) was NOT performed, and `lawful` stays reserved for a
    stack-pinned consumption while the declared interim copy is TOLERATED on the
    same four terms, an undeclared duplicate never becoming tolerated by being
    useful. D2 through D6 were carried beside D1 and were not vetoed.
    THE ARCHIVE IS A SEPARATE ACT ON A SEPARATE WORD. `code_surface: none`
    means this packet archives ON LANDING plus its own task list under
    `release-realization` rather than on merged-plus-green realization evidence,
    but that archive is not performed here: nothing under `openspec/specs/` is
    edited by this ratification, `tasks.md` § 4 stays OPEN, and openxFactory
    #868 therefore closes AT THE ARCHIVE and not at this landing.
    Record: `review/ratification-2026-09-09.md`, with the gate run re-derived on
    the ratified tree at `review/verification-2026-09-09.md`.
  approved_on: 2026-09-09
