origin:
  kind: ad_hoc
  id: openxFactory:adhoc:2026-09-22-amend-neutral-product-pin-source-tree-digest
  reason: >-
    TWO RATIFIED READINGS IN ONE CAPABILITY DISAGREE, AND THE PINS THE ESTATE
    CARRIES OBEY THE SECOND. `neutral-product-pin`'s requirement *An external
    neutral product is pinned by commit and digest, never by tag* opens by
    obliging a consuming pin to carry a per-file `sha256` for every artifact the
    product's own manifest digests per file, plus `pinned_by_commit_only:` for
    the rest. Three paragraphs later, for a product distributed as a published
    artifact, the same requirement reasons that obligation away in its STRONGER
    form: the two lists exist only because "a commit is not a digest a consumer
    can compare a single file against, so the surface must be ENUMERATED for
    completeness to be checkable at all", whereas "ONE digest addresses EVERY
    byte inside it, so no member can be undeclared and none can be added or
    altered without changing the referent" — "DISCHARGED MORE STRONGLY here
    rather than waived".
    THE REASONING DOES NOT DEPEND ON THE MEDIUM, AND THE ESTATE HAD ALREADY
    APPLIED IT TO A SOURCE TREE. `contracts/openxdox-pin.yaml` and
    `contracts/opendox-pin.yaml` each pin an assembly ROOT by commit plus a
    whole-tree `sorted-ls-tree-r-v1` digest, carry neither list, and quote that
    paragraph as their reason. On 2026-09-21 the condition those headers had
    deferred against fired: at openDox `dc7aa08f` the product's own
    `contracts/manifest.yaml` carried a non-empty `entries:` for the first time,
    so the per-file obligation had members. Brett Heap ruled the pin shape at
    `opensoft/openxFactory#656` comment 5768144952 — "(b) for the pin shape,
    keep going" — and the lists stayed deferred on the whole-tree digest's own
    strength.
    THAT SETTLED THE PIN FILES AND NOT THE NORMATIVE TEXT. Copilot review
    comment r4067623184 found the residue on the #1139 archive pre-stage and the
    lane's bookkeeper verified it: the corpus held a rule and an unwritten
    exception. Brett Heap ruled the remedy by multi-choice on 2026-09-22 —
    AMEND THE CLAUSE rather than record an exception beside it — and named this
    packet's form: "it becomes its own small OpenSpec change against
    `neutral-product-pin`, citing 5768144952, this ruling, and Copilot
    r4067623184."
    NOTHING HERE IS A CODE DECISION, AND THAT IS MEASURED. No verifier reads
    `files:` or `pinned_by_commit_only:` for a source-tree pin: the only two
    occurrences across `scripts/verify-opendox-pin.py` and
    `scripts/verify-openxdox-pin.py` are module-docstring prose about the
    openXwallet pin, neither closed refusal vocabulary carries a code for a
    missing per-file list, and `pytest tests/opendox_pin tests/openxdox_pin`
    reads 105 passed over fixtures already in the admitted shape. The delta
    states what the readers have done since they were written.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/` was enumerated and grepped on 2026-09-22 for
    `neutral-product-pin`, `whole-tree digest`, `sorted-ls-tree` and `per-file`.
    Three topics name the capability and NONE proposes this rule:
    `opendox-two-layer-product` is the source of the runtime-deployment clause
    this block carries; `openxwallet-neutral-home` is the source of the ORIGINAL
    per-file clause being amended, not of the amendment; and
    `wallet-carried-work-authority` is about wallet authority. `kind: staged`
    would claim a staging source that does not resolve. The organized source is
    the ruling and the Copilot finding that raised it.
  proposed_by: >-
    Lane `openxfactory-4` (display `openXfactory-4-openDox_extraction`),
    encoding Brett Heap's ruling of 2026-09-22 and reaching no judgment beyond
    it. THE DECISIONS THIS PACKET DOES REACH ARE DECLARED FOR A VETO in
    `design.md`: D2 (an enumeration stays lawful and stays owed where no
    whole-tree digest is recorded, so the amendment admits a second form rather
    than replacing the first), D3 (the boundary goes in the NORMATIVE text — the
    equivalence reaches WHICH FORM the digest obligation takes and never WHETHER
    digests are owed, and the runtime-deployment clause is carried VERBATIM AND
    UNEDITED rather than reconciled, because correcting its "commit and per-file
    `sha256`" phrase would be a normative edit to a clause the ruling did not
    reach), and D4 (the block is written over `split-opendox-two-layer-product`'s
    OUTCOME rather than over canon, so it is correct whichever archives first).
    Each is separable and each carries its own veto cost.
  proposed_on: 2026-09-22
