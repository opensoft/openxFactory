    day against `origin/main` at `31c931fa`:
    `tests/doc-health/test_ideation_readiness.py::test_derivation_reproduces_the_real_bootstrap_clusters`
    resolves its subject by walking UP from the repository under test to the
    first ancestor holding `openxFactory/ideation/cross-reference.yaml`, which
    inside the aggregation workspace is always the one shared checkout — so
    every agent worktree proves a verdict about somebody else's working tree,
    and a concurrent uncommitted pin bump in that checkout (67 listed clusters
    against 253 derived) reddened every worktree on the machine while every
    isolated clone passed at every revision. Independently, `main`'s index
    pins `f13a3b6007736292e1e157febef1ac733e534de9`, a commit reachable from
    no ref local or remote — the branch that generated it landed squashed as
    `4e57009c` — and the test converts that into `pytest.skip`, so the
    assertion has never executed in a fresh clone, and the skip's stated
    reason ("shallow clone?") is false in the one place it fires, since
    `pytest-suite.yml` checks out at `fetch-depth: 0`.
    Authored in openxFactory because `doc-health` is an openxFactory
    capability and the verification being hardened is its own.
