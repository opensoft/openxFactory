  reason: >-
    A HARD, NAMED DEPENDENCY OF A RATIFIED CONSUMER MECHANISM THAT CANNOT BE
    BUILT WITHOUT IT. codexFactory's `realize-provenance-gated-autonomous-merge`
    carries convener ruling R1 (Brett Heap, 2026-08-28), which requires the
    provenance-tie verifier to COMPOSE THE ORDERED-DELTA CHAIN MECHANICALLY
    rather than to read a single change. That packet's own task list records the
    consequence as dependency `0.5` and labels it MISSING and BLOCKING:
    "There is TODAY no machine-readable parent link to walk."
    THE THREE CANDIDATE LINKS WERE MEASURED AND ALL THREE FAIL, quoted from the
    consumer's design D14 and task 0.5 rather than summarised: openxFactory
    `release-realization`'s "Ordered deltas and branch vocabulary" is
    MECHANISM-AGNOSTIC PROSE; the only mechanical reader — the doc-health
    `add-modified-block-currency-check` family — resolves ordering by a
    WHOLE-TOKEN OCCURRENCE of the sibling change id anywhere in the declaring
    `proposal.md`, which cannot distinguish a parent from a mention, cannot
    detect a fork, and is author-mutable in the same document the author writes;
    and the `Sequenced-after:` header seen in some openxFactory proposals is
    FREE TEXT NO SCHEMA VALIDATES (measured 2026-09-01: THREE occurrences, all
    three in ARCHIVED proposals).
    THE FILING IS THEREFORE SYMMETRIC WITH `add-structured-scope-substrate`,
    which the same program's CRITICAL #1 forced into openxFactory as the other
    half of the same front-matter block. That change is the model this one
    mirrors — artifact shape, sibling-field resolution, validator pattern
    (`scripts/validate-scope-globs.py`), and its trust-root-floor doc — and it is
    also this change's PARENT, declared machine-readably in `proposal.md` front
    matter as the substrate's own first instance.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/` was enumerated and `INDEX.md` read on 2026-09-01: NO
    topic carries ordered-delta sequencing, parent declaration, or chain
    resolution. `kind: staged` would claim a staging source that does not
    resolve. The organized source is a ratified sibling packet's recorded
    convener ruling plus its dependency register — the same shape
    `fix-content-resolution-conflation` and `add-modified-block-currency-check`
    filed under.
