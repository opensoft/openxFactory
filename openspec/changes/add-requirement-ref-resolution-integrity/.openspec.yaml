  id: openxFactory:adhoc:2026-08-31-add-requirement-ref-resolution-integrity
  reason: >-
    THE NAMED SUCCESSOR OF A DEFECT FOUND, CONFIRMED AND DELIBERATELY NOT FIXED
    IN A MERGED REALIZATION, raised on Brett Heap's recorded ruling of
    2026-08-30 and anchored at openxFactory issue #523, which is both the origin
    act's record and the scope statement this packet is written to.
    THE DEFECT, quoted from that issue: "a `requirement_ref` that resolves to
    ZERO or MULTIPLE requirements is reported ONLY when bindings share a
    `secret_ref`. A dangling or ambiguous ref on a non-sharing binding passes
    silently." It was found by Codex on openxFactory PR #516 — the realization
    of `add-binding-consumer-identity`, merged `5e8a33cf` — where the split is
    recorded in the review thread, and it was left unfixed there for a reason
    the issue states in three parts: an ERROR would have been an UNPHASED
    NARROWING; a WARNING needed a NINTH code against a ratified rule that the
    warning set is "ENUMERATED against the refusals", which an unresolvable
    reference is not; and the ratified packet is itself SPLIT — its block
    requirement's general "SHALL be reported", its lift requirement's scenario
    scoped to a sharing pair, and its task list § 2.5's "report AND withhold the
    lift".
    WHY `kind: ad_hoc` AND NOT `kind: staged`, checked rather than assumed. No
    topic under `ideation/staging/` carries this subject; `INDEX.md` was read
    and holds nothing on the credential validator's reference resolution. The
    organized source is a GitHub issue carrying a recorded ruling, which is the
    shape `fix-content-resolution-conflation`,
    `fix-pin-value-boundary-and-sentinel-split` and
    `add-modified-block-currency-check` all filed under, so `ad_hoc` is correct
    here and is not a substitute for staging.
    AND THIS FILING IS A FRESH INSTANCE OF ISSUE #318, cited rather than
    re-derived: an `ad_hoc` origin's vocabulary pairs "approved" naturally with
    ratification, so a packet that is AUTHORIZED but NOT RATIFIED must do by
    PROSE what the taxonomy has no kind to declare — which is the disclaiming
    work `approved_by` below performs.
  approved_by: >-
    Brett Heap (openxFactory operator authority) — ruling recorded 2026-08-30 on
    PR #516's discussion and in issue #523: the fix is a SMALL SUCCESSOR CHANGE
    CARRYING ITS OWN RESOLUTION-INTEGRITY CODE, resolution integrity becoming
    its own check rather than a by-product of the shared-secret lift.
    THIS FIELD RECORDS AUTHORIZATION TO AUTHOR, NOT RATIFICATION OF CONTENT,
    AND MUST NOT BE READ AS ONE. The citation covers THE DECISION TO FILE and
    the SHAPE OF THE FIX (its own code, not an unphased narrowing) and nothing
    else. Every decision beyond that sentence was the authoring session's, is
    listed in proposal.md § Authoring decisions as AD-1 … AD-6, and was FLAGGED
    FOR VETO when written — as were the four items in § Open questions, each of
    which carries a recommendation and no decision.
    THE PACKET IS NOW RATIFIED, BY A SEPARATE AND LATER ACT — 2026-09-01, Brett
    Heap (repository owner), in session via an explicit multi-choice put, session
    `openxfactory-f5`; record at `review/ratification-2026-09-01.md`, and
    proposal.md carries `Status: ratified` with the record-citing `Ratified:`
    line. **AD-1 IS RULED TWO CODES, AS DRAFTED**, and the twelve-item
    AD-1/ONE-CODE AMENDMENT SET is DECLINED — none of its items executed, and it
    is left standing in the proposal as the record of the rulable alternative
    rather than struck. AD-2 … AD-6 stand as drafted; OQ-1 … OQ-4 REMAIN OPEN,
    the ruling having reached the decisions without reaching the questions.
    AND ONE POST-RATIFICATION AMENDMENT HAS SINCE LANDED, BY THE SAME RATIFIER,
    THE SAME DAY, AS A SEPARATE ACT AND WITH HIS EXPRESS CONSENT AS THE
    RATIFYING OWNER. The third Codex round's P2 — the frozen resolver's
    per-document lookup, leaving the ratified ambiguity scenario's
    cross-document reach unmeetable — was ROUTED OPEN by the ratification and
    was then RULED, 2026-09-01, session openxfactory-f5, by an explicit
    multi-choice put with the contradiction before him: SCOPE TO PER-DOCUMENT,
    the CROSS-DOCUMENT arm FILED AS THE NAMED SUCCESSOR at openxFactory issue
    #553. It moved SCOPE AND NOTHING ELSE — the two codes, the phasing, the
    removal target, the corpus, the all-ADDED shape and the TWELVE-scenario
    count all stand — and it is recorded as a consented amendment at every site
    it touches, the delta carrying two dated AMENDED 2026-09-01 notes and the
    ratification record a dated addendum. THIS FIELD STILL RECORDS
    AUTHORIZATION TO AUTHOR; the ratification and the amendment are the two
    later acts named above, and neither is this field's.
    NO §7.4 COUNCIL SITTING WAS CONVENED AND NONE WAS PRESCRIBED — tasks § 2.3
    left the question to Brett and he took the DIRECT path, so no seat sat, no
    ballot was cast, and nothing in this packet may be cited as a council
    disposition. Ratification authorizes realization and performs none of it:
    the change stays ACTIVE until tasks § 8's merged-and-green evidence exists.
