rather than a derivation) is carried beside them with its measurement and is not put separately, the derivation having been measured to refuse a lawful declaration on its first day. NOTHING IS PROMOTED, NOTHING IS REALIZED AND NOTHING IS ARCHIVED BY THIS FILING. This pull request edits no file under `openspec/specs/`, adds no script, no inventory and no test, and `tasks.md` §§ 1, 3, 4, 5 and 6 stay entirely open. `code_surface` is NON-EMPTY, so under `release-realization` the archive is a separate act on merged-plus-green realization evidence and a separate word, and openxFactory #1087 stays OPEN and closes THERE.
