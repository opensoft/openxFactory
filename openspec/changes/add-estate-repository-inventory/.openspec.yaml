  reason: >-
    THE `code_surface:` GATE JUDGES WHAT A REPOSITORY NAME LOOKS LIKE AND HAS NO WAY TO KNOW WHETHER THE REPOSITORY EXISTS. `gate-code-surface-declarations` landed the grammar and stated its own bound in the promoted requirement *Code-surface declaration grammar is gated*, quoted: "The gate SHALL judge the identifier's SHAPE and SHALL NOT judge its MEMBERSHIP of any inventory, for the measured reason that this repository defines no inventory of the estate's repositories to resolve against", and its `tasks.md` § 6.1 named the successor and refused to build it, filing openxFactory #1087 at the archive's landing (PR #1076, merge `5dd0a8dc`). THE MISSPELLING § 6.1 WARNS OF IS ALREADY IN THIS TREE, MEASURED AND NOT ASSERTED: `contracts/hermes-runtime/fixtures/domain-regression-inventory.yaml` names `opensoft/LegalxFactory`, which the provider answers 404 for, which no `.gitmodules` carries and no pin names; two more of its rows name repositories at addresses that survive only through a provider redirect, while `contracts/policies/repository-identity.yaml` (the estate's transfer map, whose own header says a redirect "is a grace period, not an identity") carries ONE row. THE CANDIDATE INVENTORY WAS BUILT BEFORE THE DESIGN, FROM FOUR NAMING SITES, ON `origin/main` `ad089e8a`: the aggregation repository's `.gitmodules` (23 submodules, read through `gh api repos/opensoft/xFactory/contents/.gitmodules`), this repository's `contracts/*-pin.yaml` (7 pins naming 6 distinct repositories, 2 of them no submodule), `.github/workflows/` (1, already a submodule) and the aggregation root itself (1, which no `.gitmodules` can name because a superproject is not its own submodule). TWENTY-SEVEN ROWS, and the twenty-seventh is the one the measurement forced rather than the design chose. THE DECLARED POPULATION WAS READ THROUGH THE SHIPPED READER (`scripts/code_surface.py` `declaration` then `parse_head`) AND NEVER BY A PRIVATE SCAN: 49 active proposals, 49 declaring, 7 `none`, 8 named by the closed register, 34 a readable repository list, and those 34 heads name SIX distinct identifiers, ALL SIX of which the candidate carries, so the membership arm refuses NOTHING on the day it lands. That single figure falsifies the predecessor's stated fatal cost for membership resolution ("on the day it landed the gate would refuse all 41 non-`none` declarations"), which was a property of having no inventory and not a property of resolving against one. THE FIFTH ADMISSION KIND WAS MEASURED INTO EXISTENCE: `opensoft/LedgerxWallet` is a real repository named by no gitlink, no pin and no workflow, declared by the RATIFIED `create-ledgerxwallet-overlay-boundary` whose realization CREATES it, because a code surface is FORWARD-LOOKING, so a repository the estate is creating is declared before any site can name it, and `admitted_by: change` carries a PROVISIONAL row that expires into a finding at that change's archive. WHY ONE `## MODIFIED` BLOCK AND NOT AN ADDED-ONLY DELTA, DECIDED AGAINST THE PROMOTED TEXT RATHER THAN BY HABIT: the promoted `SHALL NOT judge its MEMBERSHIP` is unconditional in its own words, so an ADDED requirement saying membership SHALL be judged would leave canon carrying two requirements that cannot both be obeyed, and `document-lifecycle` makes `ideation/brainstorm/` the only place contradiction is legal. The block restates the requirement exactly as canon states it but for ONE paragraph, and that paragraph is lifted BY REMOVING ITS REASON: the reason stops holding at this packet's realization and the prediction beside it is measured false, which is the only honest way to lift a bound that states its own ground. The self-gate was checked and not assumed: no active change writes `(release-realization, code-surface declaration grammar is gated)`, so the block is SOLE, no `sequenced_after:` is owed on it, and the `modified-block-currency` family reports no NEW finding. WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED: `ideation/staging/` was enumerated on 2026-09-18 and no topic names an estate repository inventory, a membership check, or the enumeration of the estate; `kind: staged` would claim a staging source that does not resolve. The organized source is openxFactory #1087, filed at the landing of PR #1076 as the successor `gate-code-surface-declarations` § 6.1 named, and CLAIMED by this lane before authoring.
