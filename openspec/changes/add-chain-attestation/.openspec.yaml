  id: openxFactory:staging:signed-execution-chain
  path: ideation/staging/signed-execution-chain
  reason: >-
    EXIT 2 OF THREE of the staged topic — the tranche its `## Exit path` calls
    "harness and runner attestation": links 4–6 and 10. The harness-controller
    setup attestation, the per-task runner attestations, the signed
    pull-request-open decision, and the governed post-merge test that CLOSES a
    chain — plus the three rules that ride with them because the links themselves
    create the holes: the SIGNED HASH-LINK RULE taking effect at link 4 (which
    tranche one DECLARED and could not perform, having no link after inception
    with a signer of its own), tier-2 custody, and the omnigent precondition.

    THE QUESTION-GATE IS OPEN. Q7 was ruled by Brett Heap on 2026-08-29 AS
    RECOMMENDED — remote signing served by the harness controller, the runner's
    signing REQUEST recorded beside the signature it received, the controller
    corroborating the submitted payload against its own link-4 setup attestation,
    an HSM a later hardening of the same shape — and the topic records that this
    "gated TRANCHE TWO's contract text, which may now name the mechanism". This
    packet names it.

    TRANCHE ONE (`add-signed-execution-chain`, RATIFIED 2026-08-29, PR #495) is
    the direct predecessor and its ratified text governs every point of contact:
    the chain identity, the ONE digest construction, the traveling contract, the
    transparency log, and the short-chain gate this change extends from links 1–3
    to links 1–6. Tranche three (`add-chain-anchoring`, in parallel drafting) is
    a named sibling and none of its content appears here.

    WHAT Q4 SAYS ABOUT RAISING THIS NOW IS RECORDED RATHER THAN ANSWERED. Its
    ruling adds that later boundaries are "RE-DERIVED when the omnigent layer and
    the PKI plane are real, not fixed now", and neither is real today. The packet
    ratifies-not-realizes, writes requirements naming no interface either plane
    must expose, and carries the re-derivation as an obligation OF THE
    REALIZATION (`tasks.md` §5.1) — but the literal reading, that tranche two
    should not be drafted yet, is available on the text and is routed to the
    council rather than ruled out here.
  approved_by: >-
    BRETT HEAP, 2026-09-01, on the prescribed-fix basis and against a disclosed
    state. Both governance acts are behind this packet: the §7.4 COUNCIL REVIEW —
    the council-reviewed-but-human-approved path that needs no candidate class
    and no flip and reaches this repository without an envelope — was HELD ON
    2026-08-30, four seats, UNANIMOUS 4/4 that the drafted text was not
    ratifiable, THIRTEEN blocking amendments, all discharged, with the bundle
    filed at `review/` — and RATIFICATION, TAKEN 2026-09-01 after eighteen bot
    rounds, with the record at `openspec/changes/add-chain-attestation/review/ratification-2026-09-01.md`. The house pattern
    is `add-binding-consumer-identity`, the first packet through that path end to
    end on 2026-08-29, whose `review/` directory this packet's own `review/`
    mirrors. RATIFICATION AUTHORIZES REALIZATION AND DOES NOT PERFORM IT: no
    contract byte moves with it, and `tasks.md` §5 stays gated on machinery that
    does not yet exist.
  approved_on: 2026-09-01
