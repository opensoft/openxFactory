schema: spec-driven
created: 2026-09-12
origin:
  kind: ad_hoc
  id: openxFactory:adhoc:2026-09-12-encode-wallet-authority-rulings-r6-r12
  reason: >-
    A RATIFIED RULINGS RECORD NAMES THIS CHANGE BY SHAPE AND MAKES SEVEN
    RULINGS UNENFORCEABLE UNTIL IT EXISTS. The record is
    `openspec/changes/add-wallet-carried-review-authority/rulings-2026-08-29.md`,
    section "Packet 4 — canonical composition and re-issuance (R6-R12)", whose
    closing paragraph reads, verbatim: "What makes R6-R12 enforceable: a FRESH
    OpenSpec change, authored after issuance, carrying R6-R12 as ratified
    contract text (with R12's signer half landing in signed-execution-chain
    instead). Until that change is authored, ratified and realized, the
    canonical serialization, the digest, the re-issuance grammar and the
    corpus-drift rule are recorded direction and NOT enforced behavior."
    THIS PACKET IS THAT FRESH CHANGE AND CARRIES NO OTHER SUBJECT.
    THE SECOND THING IT IS. The same absence is the single ground on which the
    parent's task 7.6 stays open. `add-wallet-carried-review-authority/tasks.md`
    section 7.6, "GROUND 1 - THE TASK'S OWN SENTENCE, and it has nothing to do
    with the walk": "neither ruling is enforced until the change carrying R6-R12
    is ratified, so this task stays OPEN." R6-R12 is not authored, let alone
    ratified. The runbook has been WRITTEN and walked TWICE - precision-class
    2026-08-31 (`walk-2026-08-31-composition-bump.md`) and revocation-class
    2026-09-02 (`walk-2026-09-02-register-act.md`) - and Ground 2 is therefore
    discharged on the evidence, leaving Ground 1 alone holding the task shut.
    THIS PACKET TICKS NOTHING IN THE PARENT. It is the parent's OWN tasks.md
    that carries 7.6, a sibling lane is ticking the S3/S5 bookkeeping rows, and
    a change does not reach into another change's ledger. What discharges
    Ground 1 is THIS PACKET'S RATIFICATION, and the tick that follows is the
    parent's act on a separate word (OQ-6).
    THE SHARPEST MEASUREMENT IN THE PACKET, and it moved the delta before it
    was written. R7 rules "Canonical serialization: JSON Canonicalization
    Scheme (RFC 8785)" with the digest "sha256:<lowercase-hex>", "recorded
    together with the canonicalization profile name and its version". THAT
    CONSTRUCTION ALREADY SHIPS IN THIS REPOSITORY. It is `xfc-jcs-sha256-1`,
    declared once in `contracts/signed-execution-chain/digest-construction.schema.yaml`
    under the promoted `signed-execution-chain` requirement "One digest
    construction governs every digest this capability computes", and its own
    header invites exactly this movement: "A LATER TRANCHE ADDS NO SECOND RULE.
    Any digest a later tranche introduces is computed under this construction,
    with its subject added to the enumeration below; a second construction
    declared beside this one is a defect whatever it is called." The invitation
    has been taken twice already, once from INSIDE the family
    (`add-chain-anchoring`, eleven subjects) and once from a DIFFERENT
    CAPABILITY (`add-cpc-clearing-boundary`, `sealed_bundle_manifest`). So R7
    is encoded as ADOPTION BY REFERENCE plus one `digest_subject` member, not
    as a second JCS profile - and that is why this packet declares a real
    `code_surface` instead of none.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/INDEX.md` carries no topic for the composition digest,
    the canonicalization profile, the re-issuance record grammar or the
    corpus-drift rule; the organized source is a ratified rulings record in
    this repository's own `openspec/changes/` tree plus two dated walk records,
    which is the shape `ad_hoc` exists for.
  proposed_by: >-
    Lane `hermes-wallet-exercise` (window `hermes-wallet-exercise`, session
    `codeXfactory-2`, workstation Eagle), on Brett Heap's multiple-choice word
    of 2026-09-12, verbatim: "Author the R6-R12 successor change".
    NO APPROVAL PAIR IS DECLARED AND NONE IS IMPLIED. That word commissions the
    AUTHORING and nothing further: it ratifies no wording, resolves none of the
    nine decisions this packet puts, admits no text to canon, discharges no
    task and enforces no ruling. The lawful unapproved shape is the one
    `add-drafted-proposal-origin` (issue #318) added - drafting provenance,
    no `approved_by`, no `approved_on` - and every document in the packet
    carries `Status: draft` to match. Approval, when it comes, is a pure
    ADDITION beside a fixed `kind` and `id`.
    NINE DECISIONS ARE PUT AS MULTIPLE CHOICE, each with a RECOMMENDED option
    and the one-line reason it is recommended, and the RECOMMENDED option is
    what the delta already encodes, so "accept all A" moves not one byte.
    OQ-1 is the veto point (home capability). OQ-2 carries the measurement
    above and decides whether R7 adopts `xfc-jcs-sha256-1` or mints a second
    profile. OQ-4 is the one that can revoke live grants: whether R6's
    plane-inside-the-digest reading applies PROSPECTIVELY or forces
    re-derivation of composition digests both councils' active grants were
    issued against. OQ-3, OQ-5, OQ-6, OQ-7, OQ-8 and OQ-9 fix the record
    grammar's extensibility, R12's interim half, who ticks 7.6, ratification
    ordering against the pending gate-rules act, the realization surface, and
    the closed-versus-minimum reading of R10's governing-configuration members.
  proposed_on: 2026-09-12
