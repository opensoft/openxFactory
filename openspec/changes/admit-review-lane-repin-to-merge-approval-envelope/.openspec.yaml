    expressly does not author it; and its `tasks.md` box 4.3 records the filing
    as owed with the tick condition "the successor being NAMED — its
    openxFactory issue or packet id recorded here".
    THE WORD THAT AUTHORIZED THE FILING. Brett Heap, 2026-09-10 at
    approximately 17:2xZ, in session to lane `openxfactory-2`, verbatim "do 1
    and 2, sign, file it, do 744"; the third clause covers item 4 of the lane's
    ranked queue, recorded on openxFactory #745 comment 5622848416
    (2026-09-10T17:35:50Z): "File the enrolment successor
    `admit-review-lane-repin-to-merge-approval-envelope` … on his word 'file
    it' — a PROPOSAL (filing ≠ ratifying); it re-opens ratified decision N-1 and
    says so; the 4.3 box ticks on the recording (successor NAMED)."
    WHY NOW, AND IT IS A MEASURED FIGURE RATHER THAN A PREFERENCE. Cycle three
    of the two-repository floor mechanism, recorded on openxFactory #745 comment
    5618883586: the codexFactory regeneration half ran 22 min 16 s unattended
    end to end with no human actor (#325 -> `df42f803`), while this
    repository's re-pin half was driver-produced by hand and merged on a human
    word (#883 -> `e916f0ea`). The same recording states the consequence this
    packet exists to answer: "A fully unattended two-repository figure is
    UNOBTAINABLE while this lane's merge is human by ruling (6.3), so it is owed
    to the enrolment successor".
    IT RE-OPENS A RATIFIED DECISION AND SAYS SO IN ITS OWN SECOND HEADING.
    Decision N-1 of `extend-merge-master-envelope-to-floor-bot-lanes` (ratified
    2026-09-07, "ratify 746 and 272 as recommended when green, then land them")
    admits the codexFactory REGENERATION lane ONLY and leaves this lane on a
    human merge word; this packet asks for that decision's own recorded
    alternative N-1 (b) with its condition N-1b (ii), the named carve. Brett
    Heap's § 6.3 rulings of 2026-09-10 (codexFactory #232 comment 5618469628 —
    "openxFactory re-pin lane NOT extended, INERT by ruling"; openxFactory #745
    comment 5618883586 — the human merge word "HOLDS for this lane, whose arming
    is INERT by ruling until the enrolment successor … is filed and realized")
    STAND until this proposal is ratified, and are quoted verbatim in
    `proposal.md`.
    THE DESIGN PROBLEM IS CONFRONTED RATHER THAN ROUTED AROUND, and it is the
    reason this is a packet with a design.md and not an envelope edit.
    `contracts/review-lane-pin.yaml` is a never-clearable floor member whose
    ground, in codexFactory
    `scripts/merge_master/openxfactory-review-authority-floor.yaml:108-111`, is
    that a clearable pin "would let a pull request choose its own judge" — and
    the floor is composed OVER the envelope in running code at this
    repository's `.github/workflows/merge-master-approval.yml:1603`. The answer
    offered is that the enrolment gives the pull request no degree of freedom
    over the judge: the author, head and base are measured off PR #732; the diff
    is written by `scripts/review_lane_repin.py`, which moves all five sites or
    opens nothing and writes nothing outside them; the value is codexFactory's
    default-branch head resolved AT RUN TIME with any trigger-named reference
    refused (`review-lane-repin.yml:424-441`, header `:67-69`); and LQ-A7 runs
    against the PROPOSED core as a required check that `require_all_checks:
    true` conjuncts in. The residual — that an autonomous approval of such a
    delivery is the envelope approving a change to its own NEXT judge — is
    STATED, with its bounds, rather than argued away. AND THE ENROLMENT IS
    NARROWEST-SAFE BY CONSTRUCTION: it asks for a CARVE naming one candidate and
    one member, never a removal, and it refuses a ruleset bypass actor in any
    form, so it lands INERT until codexFactory carves.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/` was enumerated and `INDEX.md` read on 2026-09-10: no
    topic folder and no INDEX row names the merge-approval envelope, the
    review-lane pin, the re-pin lane, the repository gate floor or bot merge
    authority. `kind: staged` would claim a staging source that does not
    resolve. The organized source is `amend-mirror-floor-regeneration-merge-authority`
    § The realization gate, openxFactory issue #745 and codexFactory issue #232.
