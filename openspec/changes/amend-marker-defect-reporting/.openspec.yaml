  id: openxFactory:adhoc:2026-09-09-amend-marker-defect-reporting
  reason: >-
    AN OWED SUCCESSOR, filed as openxFactory issue #729 and scoped by the
    packet that owed it. `amend-marker-reason-boundary` (PR #719, origin #692,
    itself filed out of the adversarial review of PR #685) moved a marker's
    reason boundary so that a code span standing after the first ` — ` outside
    every code span is prose the reason quotes rather than a unit the marker
    names. Its own `tasks.md` § 5.1, ratified 2026-09-06, recorded TWO silences
    it did not take: a marker naming something no unit of the requirement
    matches, which has been silent since the family launched; and the case that
    amendment created, an author separating two NAMES with the separator, whose
    second span is read as prose so that the unit it meant to declare is
    reported while the MARKER that caused it is not. It named that successor as
    having "its own scenarios to write, and it is not this packet".
    THE CHECKER IS NOT WRONG ABOUT CANON, WHICH IS WHY THIS IS A PACKET AND NOT
    A PATCH. The promoted requirement mandates exactly ONE reporting ground for
    a marker — "A marker naming a unit the block still carries declares nothing
    and SHALL itself be reported" — and `suppression` conforms to it exactly,
    its own docstring recording the third resolution as "deliberately NOT a
    finding … an obligation this feature has no standing to invent". For the
    second case canon does not merely omit a report: it PRESCRIBES the treatment
    ("the units the span would have named MUST therefore remain subject to the
    carriage arms"), which this packet keeps word for word and adds a report
    about the MARKER beside. Two obligations over the same facts is an amendment
    of the requirement, so the remedy is a `## MODIFIED` block with the
    realization in the same pull request under `release-realization`'s
    merged-plus-green rule.
    AND ONE FIELD IS THE ENABLING HALF: `parse_marker` derived the
    post-boundary spans and DISCARDED them, so the second silence was not
    merely unreported but not mechanically detectable at all.
    BOTH GROUNDS HAVE A POPULATION OF ZERO TODAY, measured rather than assumed
    on 2026-09-09 over main @ 6df21737 — the tree the design was taken on, and
    the scope every figure in this packet is stated at. Sixteen unit-naming
    markers in the corpus, EIGHT of them quoting a code span inside their reason
    and every one of those eight a PROMOTED marker; of the 34 spans they quote,
    ZERO is a derived unit of its own document. That third figure is the design:
    a ground written on the span's POSITION reports eight correct markers the
    moment a MODIFIED block restates one of their requirements, and the share
    grew from 2 of 7 to 8 of 16 in three days, so `design.md` D1 takes the
    EXACT-MATCH predicate and writes the position predicate out beside it with
    its cost.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/` was enumerated and `INDEX.md` read on 2026-09-09: no
    topic carries the marker grammar, marker defect reporting, or doc-health's
    carriage arms. `kind: staged` would claim a staging source that does not
    resolve. The organized source is issue #729 and the archived § 5.1 that
    scoped it.
  proposed_by: >-
    Lane `openxfactory-1` (session `3c606f68`), authoring the remedy issue #729
    proposes. NO APPROVAL PAIR IS DECLARED AND NONE IS IMPLIED: Brett Heap's
    "author the 729 packet" (2026-09-09T12:32:46Z) instructs a lane to author,
    and his "merge 842 and 846 when green, then ratify the 729 packet"
    (2026-09-09T13:13:41Z) states the intended sequence — neither ratifies a
    wording and neither takes a design decision, and the ratification they
    foresee happens on a later word once this pull request is frozen green. The
    lawful unapproved shape is the one `add-drafted-proposal-origin` added —
    drafting provenance, no `approved_by`, no `approved_on` — and every document
    in the packet carries `Status: draft` to match. The decision most worth a
    veto is `design.md` D1: option A, a reason-quoted span reported only where
    it matches EXACTLY a promoted unit the block does not carry and no marker
    declares removed, against option B, any code span inside a reason — the
    remedy shape issue #729's own body proposes, which fires on canon's blessed
    form and on eight correct promoted markers. A veto of A is a veto of ground
    two alone; ground three rests on no predicate choice.
  proposed_on: 2026-09-09
  approved_by: >-
    Brett Heap (openxFactory operator authority) — in session on 2026-09-09,
    lane `openxfactory-1`, verbatim: "merge 842 and 846 when green, then ratify
    the 729 packet". THIS IS THE RATIFICATION ACT AND IT IS ADDED, NOT
    SUBSTITUTED. The drafting provenance above is kept exactly as authored and
    `kind` and `id` never move, which is the shape `add-drafted-proposal-origin`
    (issue #318) defined for this transition: approval is a pure ADDITION to a
    fixed origin identity, so the support manifest that repeats `kind` and `id`
    never comes to disagree with the packet, and the archive gate's
    origin-retention arm reads the declaration this commit establishes.
    THE WORD IS ONE UTTERANCE OF THREE CLAUSES IN ORDER, AND THE ORDER WAS
    KEPT: openxFactory PR #842 merged 4cdadd56 (16:11:57Z) and PR #846 merged
    183d1b43 (16:12:40Z), both green, and this act is the third clause. The
    earlier "author the 729 packet" (2026-09-09T12:32:46Z) stays the ORIGIN of
    the authoring and is not read as an approval.
    The decision the word reaches is `design.md` D1 — option A, a reason-quoted
    code span reported only where it matches EXACTLY a unit of the requirement's
    basis that the block does not carry and that no marker declares removed,
    against option B, any code span standing inside a reason — which was carried
    as the packet's veto point in the pull request body, in `tasks.md` § 1.2, in
    the README row and on issue #729, and was NOT vetoed; A is ratified AS
    DESIGNED, ground two included, together with the narrowing D5 adds to the
    ruling's literal wording ("and that no marker declares removed", narrower in
    the silent direction), disclosed on issue #729 at 14:22Z before the act this
    word authorized. Ground three rested on no predicate choice and stood either
    way.
    Under `release-realization` a non-empty `code_surface` means this packet
    archives on merged-plus-green realization evidence rather than on landing,
    on a separate word; this one does not archive it, so openxFactory #729
    closes at archive and not at this landing.
    Record: `review/ratification-2026-09-09.md`.
