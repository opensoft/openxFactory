    `merge-master-approval/spec.md`, for `extend-merge-master-envelope-to-floor-bot-lanes`
    and `relocate-review-authority-floor`. Each retires when its sibling
    re-derives its `## MODIFIED "Bounded autonomous surface"` block against the
    archived canon. codexFactory reads this pin at the openxFactory commit its
    own `stack.yaml` declares, so the re-derivations can only be read against a
    pin that already lacks the entries. Measured on 2026-10-09 through this
    repository's pinned entrypoint over codexFactory `main` `33b916c1`: with
    both blocks re-derived, the pin on `main` REFUSES `pin-disposition-stale`
    (exit 2) and this packet's pin exits 0; with neither re-derived, the pin on
    `main` exits 0 and this packet's pin exits 1 with both findings
    UNDISPOSITIONED. So the deletion is published here first, and codexFactory's
    pin advance and both re-derivations land together as one codexFactory pull
    request (codeXfactory/codexFactory#549, its second advance). The
    obligation is recorded, and not performed, in
    `disposition-codexfactory-regular-pr-council-clearance-archive` `tasks.md`
    6.3: "Neither is drafted or begun here."
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED.
    `ideation/staging/INDEX.md` was read on 2026-10-09: no topic folder and no
    INDEX row names the OpenSpec CLI pin, a consuming repository's findings, or
