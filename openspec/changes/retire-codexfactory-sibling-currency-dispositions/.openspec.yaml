# NO SPEC DELTA, DECLARED RATHER THAN OMITTED, on the reading the three
# `disposition-codexfactory-*` packets recorded before it. Promoted
# `neutral-product-pin` (`openspec/specs/neutral-product-pin/spec.md:639`,
# "A dispositioned finding is cited, upgrade-coupled, and refused when stale")
# already states every rule this packet relies on: a disposition is scoped to
# one repository, an entry naming another repository is neither applied nor
# stale on this tree, a finding no disposition covers FAILS the run, and the
# remedy for an entry is an edit to the pin file. This packet DELETES two entries
# and adds none. Deleting an entry while its finding still occurs on some tree
# is not a new rule either: the scenario "A finding is reported that no
# disposition covers" says what then happens on that tree, and the coordinated
# sequence in `proposal.md` is what keeps that from happening on codexFactory
# `main`. `design.md` § 3 sets out the criterion and the reading.
