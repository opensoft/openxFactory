origin:
  kind: ad_hoc
  id: openxFactory:adhoc:2026-09-16-citation-remainder-report
  reason: >-
    THE RESOLUTION RULE LANDED; THE REPORT OF WHAT IT STILL CANNOT RESOLVE DID NOT. `add-declared-former-id` (archived 2026-09-15) gave every `openspec/changes/<id>/…` citation in this corpus a RESOLUTION RULE and shipped it as `scripts/packet_reference.py`, whose own docstring is explicit about what it is not: "Run: this module is a library and has no CLI." Its one consumer, `scripts/validate-pin-registrations.py`'s `check_citations`, reads ONE field of registered pins (`dispositions[].cited_to`) and was never a corpus-wide sweep. That packet's `design.md` D4 ruled a reporting sweep out of scope on cost and its `tasks.md` § 6.1 commissioned a successor; the successor is openxFactory issue #1053, and this packet is its answer.
    MEASURED HERE, NOT QUOTED, AND CHEAPLY RATHER THAN DEEPLY. Re-taken on a fresh clone at `origin/main` `b1df95ee` by the issue's own stated recipe so it reproduces, and run through the LANDED resolver rather than a hand-rolled approximation. `git ls-files` minus `openspec/changes/archive/`, minus `tests/`, minus `specs/` gives 2,973 entries in scope of 5,466 tracked entries (4 of the 2,973 entries are mode-160000 submodule gitlinks — `installs/omnigent-install`, `openDox`, `openXdox`, `openXwallet` — directories rather than files, skipped and contributing no token, so the sweep reads 2,969 files, none of them binary, measured); every `openspec/changes/[A-Za-z0-9][A-Za-z0-9._\-/]*`-shaped token extracted from their text gives 586 DISTINCT tokens; each resolved through `packet_reference.resolve()` gives 498 RESOLVED (76 of them RELOCATED, which is the archive move the rule exists to survive), 74 DANGLING(identity-half), 7 DANGLING(file-half), 0 AMBIGUOUS and 7 NOT_A_PACKET_REFERENCE. 162 tokens have no raw path in the tree at all and the rule repairs 76 of them. THE INCLUSIVE REMAINDER IS 81 TOKENS, carried by 65 distinct citing files.
    THE ISSUE'S FIGURES AND THIS ONE DIFFER, AND BOTH ARE REPORTED. #1053 measured at `8944758c`: 2,979 entries in scope (2,975 files read), 578 tokens, 153 raw-path-absent, 73 repaired, 80 inclusive remainder, and — after pulling cross-repository citations out by an automated qualifier check and then reading all 59 survivors by hand — about 48 true in-tree remainder in nine classes. This re-measurement is 2,973 / 586 / 162 / 76 / 81 at a DIFFERENT commit several merges later, so the two are approximately and not exactly comparable, which is the same caveat #1053 records against its own two predecessors. THE DEEP RE-MEASUREMENT HAS ARRIVED AND IS COMMITTED IN THIS PACKET, so this sentence no longer describes it as future work: `evidence/measurement-b1df95ee.md`, taken by a sibling writer in this lane at the same head, reports INCLUSIVE remainder 78, THIS-TREE-ONLY 57, TRUE in-tree remainder by manual read 39 and AMBIGUOUS 0, with all 57 classified and none left `unclassified`, and it proves the methodology is not the variable by reproducing all twelve of #1053's published figures against a control clone at `8944758c`. `design.md` D0's named slot is FILLED and D4 carries each mechanical probe's precision measured against that hand read, so the packet's own classified figures are its own and are no longer cited to #1053. What IS still quoted to #1053 rather than re-derived is #1053's own classification of its own 59 at its own revision; where the two reads differ, the evidence's § 5.2 names the difference on quoted evidence and this packet carries both rather than overwriting one with the other.
    THREE FACTS THIS RE-MEASUREMENT FOUND THAT #1053 DOES NOT CARRY, AND THEY MOVE THE DESIGN RATHER THAN DECORATE IT. FIRST, the 74 identity-half tokens collapse to 48 DISTINCT IDENTITIES: 18 identities are cited by more than one remainder token, `add-council-clearance-rule-template` by six. A token count and an identity count are different quantities and this report must print both, because a reader who repairs one identity clears up to six lines. That 48 lands on #1053's hand-read "about 48" by a completely different route is a COINCIDENCE OF TWO DIFFERENT QUANTITIES and is recorded as one, not as a confirmation. SECOND, the token grammar itself manufactures remainder: 15 remainder tokens end in `/`, one ends in a sentence-terminal `.` (`…/codexfactory-floor-relocation-2026-09-10.md.` in `contracts/openspec-cli-pin.yaml`), two end in `-` where a Python implicit string concatenation or a prose line break split the path, and one carries a `/./` segment. #1053 names ONE tokenization artifact; there are at least four shapes of it. THIRD, `openspec/changes/README.md` — the very path `packet_reference.py`'s own docstring offers as the canonical `NOT_A_PACKET_REFERENCE` example — resolves DANGLING(identity-half) in this tree, because the file does not exist here; the resolver's outcome for a bare path depends on whether the raw path is PRESENT, so the class of a citation moves with the tree. It is cited from `scripts/packet_reference.py` and `scripts/validate-pin-registrations.py`.
    WHAT THE POPULATION IS MADE OF IS WHY THE REMEDY IS A REPORT AND NOT A GATE. The remainder is not a defect list. #1053's manual read finds at least ten cross-repository citations the automated adjacency check misses (the other repository is named one to three lines above the bare path, not adjacent to it), twelve self-referential illustrative examples in source and design-doc prose, seventeen synthetic fixture ids confirmed never to have existed, thirteen ids that never were packets here, one pre-tracking rename, and five file-half cases of which two are deliberately-absent scope-isolation fixtures. A gate over that population would red the suite on prose, on docstrings and on fixtures. A REPORT over it is visibility at a fraction of the cost.
    WHY A CLI AND NOT A TWENTY-FOURTH DOC-HEALTH FAMILY, SIZED RATHER THAN ASSERTED. `openspec/specs/doc-health/spec.md`'s *Deterministic check families* promotes an enumeration reading "twenty-three check families" and names all of them, and `scripts/doc_health/families.py` registers exactly 23 (counted from the live registry, not from the prose). The promoted requirement *The family enumeration is derived, not restated on trust* makes the suite verify that enumeration against the registry and refuse a restatement that omits a registered family, names an unregistered one, or carries a numeral inconsistent with the registry in its own tree. A twenty-fourth family therefore costs a `## MODIFIED Requirements` block restating the WHOLE enumeration (MODIFIED replaces wholesale, so a partial restatement drops scenarios silently, which is the exact failure that requirement's own text records happening three times), a registry edit, a numeral, and a severity decision whose own launch precedent says it must FOLLOW a population measurement rather than precede it: "This family SHALL be advisory at launch… Raising the severity and adding the contested classification are ONE later decision taken together by ruling, and SHALL follow a measurement of the population the gate would red rather than precede it." `promotion-fidelity` and `duplicate-packet` each walked exactly that two-step path. This packet is step one and SIZES step two rather than taking it.
    WHY A NEW CAPABILITY AND NOT A DELTA ON AN EXISTING ONE. A reporting surface is not doc-health's family enumeration, and the alternative home `add-declared-former-id` D4 already considered and rejected — `proposal-origin` — is foreclosed the same way: its promoted text fixes "The family's finding classes are therefore SEVEN, named: …", so an eighth class would be a MODIFIED block over a requirement about proposal ORIGINS for a class about CITATIONS. `specs/packet-citation-report/` is a NEW capability directory and every requirement in this delta is `## ADDED`, so this packet edits no promoted byte, owes no `sequenced_after`, and collides with no other active change's MODIFIED block.
    WHY `kind: ad_hoc` AND NOT `kind: staged`, CHECKED RATHER THAN ASSUMED. `ideation/staging/` was enumerated on 2026-09-16 — 30 topic folders — and `INDEX.md` read: no topic names the citation remainder, a packet-reference report, a reporting CLI, or the doc-health family set. The seven staged files whose prose contains the word "citation", "remainder" or "dangling" were opened and every hit is about a different subject (a wallet claim, a price-page footnote, an adapter's unbuilt surface). `kind: staged` would claim a staging source that does not resolve. The organized source is openxFactory issue #1053, filed by the orchestrator at the archive of `add-declared-former-id` as the successor that packet's `tasks.md` § 6.1 owed.
  proposed_by: >-
    Lane `openxfactory-1` (display `openXfactory-1`), session `393ade52`, in answer to openxFactory issue #1053, which the lane CLAIMED before authoring (issuecomment-5698503297); the change object itself is CLAIMED in the lane log at `e6236d5b`.
    NO APPROVAL PAIR IS DECLARED AND NONE IS IMPLIED, AND NO WORD OF BRETT HEAP'S RATIFIES ANY WORDING HERE. #1053 was filed by the orchestrator AS A ROUTING RECORD and NOT CLAIMED, on Brett Heap's word "File it after #1041 lands"; taking it commissions the AUTHORING and ratifies nothing. Brett Heap's word of 2026-09-16, verbatim "claim #1053 and #1013, fan out wide", commissions the CLAIM and decides no wording either. Every document in this packet carries `Status: draft`, which is the shape `add-drafted-proposal-origin` (issue #318) defined: drafting provenance, no `approved_by`, no `approved_on`. Approval, when it comes, is a pure ADDITION beside a fixed `kind` and `id`.
    THE DECISIONS MOST WORTH A VETO ARE `design.md` D1 THROUGH D7, each put with its RECOMMENDED option first and the alternatives' costs written out beside it. D1 the HOME of the report — a report CLI outside doc-health (recommended, per the issue's own recommendation), against a twenty-fourth doc-health family now, against nothing. D2 the SURFACE — a sibling script importing the library (recommended), against giving `scripts/packet_reference.py` a CLI its own docstring says it does not have. D3 the RECIPE — FLAG a suspected cross-repository citation (recommended), against silently dropping it, against counting it as remainder. D4 the CLASSES — a small MECHANICAL set plus an honest `unclassified` (recommended), against a mechanical guess at every one of #1053's nine. D5 the NIGHTLY WIRING — artifact-only (recommended), against a date-partitioned commit-back, against a committed rolling file. D6 what STABLE means for the later step (a). D7 the SCOPE FENCES. Each stands whichever way the others go.
    NOTHING IS PROMOTED, NOTHING IS REALIZED AND NOTHING IS ARCHIVED BY THIS FILING. This pull request edits no file under `openspec/specs/`, adds no script, no workflow and no test; `code_surface` is non-empty, so under `release-realization` the archive is a separate act on merged-plus-green realization evidence and a separate word, and openxFactory #1053 closes THERE and not at this landing.
  proposed_on: 2026-09-16
