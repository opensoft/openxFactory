  reason: >-
    A RULING ON A DECISION SHEET QUEUED THIS PACKET BY NAME, AND THE FORCING
    FACT IS A VISIBILITY FLIP THAT HAS NOT HAPPENED YET. Brett Heap ruled on
    2026-09-07 that `openxFactory` becomes PUBLIC (the governed half of that
    ruling is `adopt-codexfactory-repository-identity`, ratified 2026-09-07 and
    on main at `eb30db7a`). The redaction sheet
    `~/session-prompts/redaction-outside-ideation-decision-2026-09-07.md`
    then classified every line outside `ideation/` that carries one of four
    real addresses — 119 lines across 22 files, measured at main `543d47a9`
    (the sheet counted 123 across 22 at `f2355208`; `main` has moved and the
    Q1 arm has begun landing) — into three questions, and Q2 is this packet.
    Q2's ruling, verbatim option [A], 2026-09-08T03:36Z: "one small governed
    change (proposal -> your ratification -> Speckit realization): MODIFY the
    lifecycle-notebook-projection scenario to name a role placeholder; the
    committed example becomes a synthetic instance; Opensoft's real
    declaration becomes a configured value outside the public tree
    (hermes-install config or a private aggregation path — the realization
    decides, both are already private); test fixtures switch to synthetic
    literals in the same feature."
    WHY A GOVERNED CHANGE RATHER THAN A DOCS PULL REQUEST, WHICH IS THE WHOLE
    OF Q2's ARGUMENT. Forty of the 119 lines are not prose about an account,
    they are FUNCTIONAL VALUES: one of them is a scenario bullet inside a
    PROMOTED capability spec, eighteen are the live hosting declaration
    itself, and twenty-one are fixture literals in three test modules. The
    promoted bullet cannot be edited except through a delta, and the live
    declaration cannot be redacted in place at all — `hosting.account`,
    `hosting.migration.from_account` and every roster row are the values
    `enforce_hosting_profile()` compares against the address a `nlm` CLI
    profile is actually signed in as, so a placeholder there does not redact
    the record, it breaks the guard. Q2's option [B] (tests and example only,
    no governed change) was declined for exactly that reason: it would leave
    the one address in the promoted spec and would move the live
    declaration's home by informal practice.
    NOTHING IS REALIZED BY THIS PACKET. No promoted spec byte moves, the
    committed example is not edited, no test literal changes, no resolver is
    written, no file is moved into a private tree, and every box in `tasks.md`
    below Group 0 is unticked. Two open questions (OQ-A, OQ-B) plus three
    smaller ones (OQ-C, OQ-D, OQ-E) are named for the convener rather than
    answered here.
