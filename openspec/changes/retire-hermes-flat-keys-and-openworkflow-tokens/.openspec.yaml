  reason: >-
    openxFactory issue #522 — "three contract-v2.0-targeted deprecations
    outlived their target" — was measured on 2026-08-31 against main tip
    `4290cad2` and every reachable consumer, and the measurement memo is
    durable on the operator host at
    `deprecations-522-memo-2026-08-31.md`, held on the operator's own
    machine and DELIBERATELY NOT COMMITTED anywhere in this repository. It is
    NAMED and not located: Principle IV forbids a host-absolute path in a
    committed file. The durable in-repo referents are issue #522 and its
    2026-09-01 ruling comment. There is no
    staged topic: the subject arrived as a filed issue and was dispositioned
    by ruling on the memo's recommendations, so `kind: staged` here would
    claim a staging source that does not exist.

    THIS PACKET CARRIES ENTRIES 1 AND 2 OF THE THREE. Entry 3 — the doxBench
    chat-turn v1 envelope family — is the named sibling
    `retire-doxbench-chat-turn-v1`, separated on the memo's own
    recommendation ("execute at contract-v3.0, but as its own Speckit slice,
    not folded into a combined cut") and on the different shape of its
    surface: entry 3 moves a digest-pinned schema, an inventory member's
    bytes, four packaged fixtures and a server fallback posture, where these
    two move only validator code and the policy rows that describe it.

    ENTRY 1 IS SPLIT BY THE RULING AND THIS PACKET CARRIES BOTH HALVES. The
    phased half — the fallback read in `check_hermes`, and the starter
    script's emission of the deprecated keys — is EXECUTED. The refusing
    half — a refusal of the co-resident flat keys themselves — is NOT, and
    the reason it is not is recorded on the entry rather than left to drift:
    its warning has been dead code for the whole supported population, so
    the Breaking clause's "one full minor of warnings" precondition is unmet
    for the shape a refusal would refuse.

    THIS PACKET IS RATIFIED — 2026-09-01, Brett Heap, repository owner, in
    session ("ratify #551 and #552"), at pull request #551 tip `64907604`;
    record at `review/ratification-2026-09-01.md`. THE RATIFICATION IS A THIRD
    ACT and is deliberately not merged with the two below it: the FILING of
    issue #522 on his word of 2026-08-30, then the RULING of 2026-09-01
    adopting the memo's recommendations (recorded as a comment on #522, and
    named in `approved_by`), then this. Ratification authorizes the requirement
    text alone — it performs no realization, cuts no bundle, spends no number
    and moves no CHANGELOG row, so `tasks.md` §§ 2-5 stay open and § 7's
    archive gate is undischarged. TWO THINGS THE ACT STOOD ON ARE DISCLOSED IN
    THE RECORD RATHER THAN GLOSSED: no Codex review of this packet has
    happened — four requests, four provider usage-limit refusals, zero verdicts,
    and a pass still owed and unblocked — and `main` carries an inherited
    `pytest-suite` red from PR #510's carriage-ledger subject, which this
    packet neither causes nor fixes.

    REALIZATION NOTE, added 2026-09-01 after the fact and scoped so the
    paragraph above stays readable as what it is — a description of the
    RATIFYING ACT, every clause of which remains true of that act. The later
    commission it named has since been carried out, in a SEPARATE pull request
    from an independent clone: `tasks.md` §§ 2 (the validator retirements and
    their coverage), 3 (the policy rows, both Executed and the restated In
    Force entry) and 6.1 (the D4 issue, filed as openxFactory #561) are
    PERFORMED and ticked with their evidence. §§ 4 and 5 — the `contract-v3.0`
    cut and its post-cut verification — and § 7's archive gate are UNTOUCHED
    and open, so the change stays ACTIVE. The realization spends no bundle
    number, publishes no tag and moves no CHANGELOG row.
