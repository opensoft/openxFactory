  id: openxFactory:adhoc:2026-09-01-retire-hermes-flat-keys-and-openworkflow-tokens
  reason: >-
    openxFactory issue #522 — "three contract-v2.0-targeted deprecations
    outlived their target" — was measured on 2026-08-31 against main tip
    `4290cad2` and every reachable consumer, and the measurement memo is
    durable on the operator host at
    `~/projects/xFactory/deprecations-522-memo-2026-08-31.md`. There is no
    staged topic: the subject arrived as a filed issue and was dispositioned
    by ruling on the memo's recommendations, so `kind: staged` here would
    claim a staging source that does not exist.

    THIS PACKET CARRIES ENTRIES 1 AND 2 OF THE THREE. Entry 3 — the doxBench
    chat-turn v1 envelope family — is the named sibling
    `retire-doxbench-chat-turn-v1`, separated on the memo's own
    recommendation ("execute at contract-v3.0, but as its own Speckit slice,
    not folded into a combined cut") and on the different shape of its
    surface: entry 3 moves a digest-pinned schema, an inventory member's
    bytes, four packaged fixtures and a server fallback posture, where these
    two move only validator code and the policy rows that describe it.

    ENTRY 1 IS SPLIT BY THE RULING AND THIS PACKET CARRIES BOTH HALVES. The
    phased half — the fallback read in `check_hermes`, and the starter
    script's emission of the deprecated keys — is EXECUTED. The refusing
    half — a refusal of the co-resident flat keys themselves — is NOT, and
    the reason it is not is recorded on the entry rather than left to drift:
    its warning has been dead code for the whole supported population, so
    the Breaking clause's "one full minor of warnings" precondition is unmet
    for the shape a refusal would refuse.
  approved_by: >-
    BRETT HEAP, repository owner, 2026-09-01 in session, ruling on openxFactory
    issue #522 and recorded as a comment on that issue: "execute all three
    retirements at contract-v3.0, as the memo recommends", with entry 1 SPLIT
    (phased half executed, refusing half recorded-why), entry 2 EXECUTED, and
    entry 3 EXECUTED AS ITS OWN SLICE. The ruling authorizes the PROPOSALS;
    it is not itself a ratification of this packet's text, and this packet is
    `Status: draft` accordingly.
  approved_on: 2026-09-01
