    window-budget rule explicit, which is exactly the kind of narrow
    amendment the corpus takes routinely (`amend-marker-reason-boundary`,
    `amend-neutral-product-pin-interim-copy-vocabulary`)." THIS PACKET IS
    THAT AMENDMENT, and no other.
    THE AUTHORING MANDATE IS BRETT HEAP'S RESUME RULING OF 2026-09-10,
    VERBATIM "fan out wide", given first-hand and in session, which
