#
# Realizes the WORKFLOW-INSTANCE HALF of `add-substantive-review-lane` task 5.1
# ("`opensoft/openxFactory` gets its own workflow instance ... since
# `pull_request_target` fires in the repo the PR targets"). The RULESET HALF of
# that task is deliberately NOT here — see WHAT THIS DOES NOT DO below.
#
# WHAT IT DOES. On every pull request against the default branch it checks out
# codexFactory's decision core at a RECORDED PIN, gathers the pull request's
# changed paths provably complete, and evaluates the `repository_gate_floor`
# that the core declares for `opensoft/openxFactory` — the never-clearable path
# set (`scripts/merge_master/openxfactory-review-authority-floor.yaml`). The
# verdict is rendered to the job summary. That floor has been committed in
# codexFactory since the `015-widen-review-authority-floor` work and NOTHING in
# openxFactory read it until this file.
#
# WHAT THIS DOES NOT DO, itemized because every one of them is a thing a reader
# would otherwise assume landed:
#   * NO APPROVAL. There is no step that mints the merge-master App token, no
#     step that submits a review, no merge call, no auto-merge enablement. The
#     absence is STRUCTURAL, not a disabled condition, and
#     `tests/review_lane_pin/test_review_lane_caller.py` asserts the absence.
#   * NO RULESET CHANGE. This check is required by nothing, satisfies nothing,
#     and blocks nobody. The human review gate on this repository is untouched.
#     It stays that way until S3 and S5 of `add-wallet-carried-review-authority`
#     land AND a ratified ruleset change says otherwise.
#   * NO ENROLLED CANDIDATE CLASS, and no `.github/merge-approval-envelope.yml`.
#     codexFactory's envelope schema requires `candidates` with `minItems: 1`
#     and `envelope.py` mirrors that at runtime, so there is no legal empty
#     envelope — and the `gate_rules_council` has defined no OPERABLE candidate
#     class for openxFactory (`add-substantive-review-lane` task 3.2). A record
#     DOES exist as of 2026-08-28: the council convened and REFUSED the class
#     proposed to it, unanimously, because a class over `openspec/changes/**`
#     can never convene — its admitted surface lies wholly inside the canonical
#     GATE_INTEGRITY_FLOOR. A class that can never convene is not an operable
#     class, so that record defines none and task 3.2 stays OPEN. A placeholder
#     candidate would be inventing the enrollment that task 3.2 exists to grant.
#     So no tier-1 envelope decision is computed here at all.
#   * NO WALLET-BOUND EXERCISE RECORD. `governance/review-authority/register.yaml`
#     records `act`-tier review authority for the merge-readiness council over
#     `opensoft/openxFactory` (row `row-mrc-0001`). This lane claims no exercise
#     of it. A wallet-signed exercise verified at `check_verdict` is S3 of
#     `add-wallet-carried-review-authority` and is unlanded; until it lands such
#     an act records as `event_class: unauthenticated_request` and
#     `unattributed`, which `openxwallet/spec.md` rules "is not assigned to a
#     holder".
#   * NO REVOCATION CHECK. S5's revocation-at-verdict-consumption, staleness
#     bound, and unreadable-register-refuses rule are not implemented.
#
# WHY THIS IS NOT A THIN CALLER OF `review-lane-reusable.yml`. The obvious-looking
# precedent — xFactory's `.github/workflows/review-lane.yml`, which is
# `uses: opensoft/codexFactory/.github/workflows/review-lane-reusable.yml@<sha>`
