#
# THE FAMILY CLOSES HERE, AND THE RULE OUTLIVES IT. Three advances in one
# afternoon — `subject-establishment` at 12:25:19Z, `medxchart-overlay-boundary`
# at 14:05:07Z, `medxpractice-overlay-boundary` at 16:02:21Z — because an EXACT
# ENUMERATION owes an advance to every promotion of a NEW capability. No
# openxFactory change now in flight promotes one, so the next advance belongs to
