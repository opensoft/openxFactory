# re-derives it:
#   * that reusable workflow produces a substantive review artifact and a
#     review-record pull request. It reports no check named
#     `merge-master-approval`, and its caller is `workflow_dispatch` ONLY: it
#     never runs on a pull request;
#   * the `merge-master-approval` check-run name comes from a JOB ID. GitHub
#     names a called workflow's check-runs `<caller job>/<called job>`, so a
#     caller that `uses:` a reusable can only ever produce
#     `merge-master-approval / prepare` and friends — never the literal token a
#     future ruleset would require.
# The workflow that actually produces that check is a single non-reusable job:
# codexFactory's own `.github/workflows/merge-master-approval.yml` and
# xFactory's aggregation caller of the same name, both `pull_request_target`.
# That is the shape mirrored here.
#
# THE PIN, AND WHY IT DIVERGES FROM xFACTORY'S. xFactory pins codexFactory
# `f4702f647c285012c15717043332f68f1edefc29` (2026-08-28) in BOTH its
