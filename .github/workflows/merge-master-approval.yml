# promotes `openspec/specs/chain-anchoring/spec.md`, which arrived OFF the
# enumerated floor for the same structural reason as the three before it. PR
# #204 regenerated the block at openxFactory `3afd8a8c` — THIS pull request's
# own pushed head, EXACTLY — for fifty-nine spec paths.
#
# Sixty-six never-clearable paths becomes SIXTY-SEVEN, the single added entry
# IS the spec, the eight hand-reasoned entries are untouched, nothing is
