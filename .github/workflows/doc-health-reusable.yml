        run: pip install pyyaml jsonschema pytest
      - name: Download prepared deterministic inventory
        if: needs.prepare.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: semantic-sweep-bundle
          path: prepared
