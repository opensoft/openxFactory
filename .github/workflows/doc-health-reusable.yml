              # unrestricted; recreate the branch fresh (a creation push,
              # never a non-fast-forward).
              git push origin --delete "${BRANCH}" || true
              git push origin "${NEW_COMMIT}:refs/heads/${BRANCH}"
            fi
          else
            git push origin "${NEW_COMMIT}:refs/heads/${BRANCH}"
          fi
          if [ "$(gh pr list --repo "${GITHUB_REPOSITORY_OWNER}/openxFactory" \
              --head "${BRANCH}" --state open --json number --jq 'length' || echo 0)" = "0" ]; then
            gh pr create --repo "${GITHUB_REPOSITORY_OWNER}/openxFactory" \
              --head "${BRANCH}" \
              --title "Derive-possibles register merge ${RUN_DATE}" \
              --body "Nightly derive-possibles lane output: merged possibles_register + immutable evidence (add-possibles-derivation-lane task 4.4). Auto-merges on approval." \
              && gh pr merge --repo "${GITHUB_REPOSITORY_OWNER}/openxFactory" \
                   "${BRANCH}" --merge --auto || true
          fi
      # Ideation-dashboard snapshot lane (openxFactory add-ideation-dashboard
      # task 4.1 + add-dashboard-repo-selector task 4.2): AFTER the deterministic
      # pass, refresh one current snapshot per project-register repository plus
      # the thin (repository, ref) index beside the dated reports;
      # the "Commit report" step's `git add health/` sweeps
      # health/ideation-dashboard/ into the same commit that lands the reports
      # and inventories. The lane script always exits 0 — any error
      # (generation, validation, missing checkout) is reported as SKIPPED in
      # health/ideation-dashboard/lane-status.json and on stdout — and
      # continue-on-error is belt-and-braces so this step can never affect the
      # deterministic doc-health results.
      - name: Ideation-dashboard snapshot lane (skip-on-error, never gates)
        continue-on-error: true
        run: |
          python3 openxFactory/scripts/ideation-dashboard-nightly.py \
            --repo-root . \
            --repositories registered \
            --aggregate medx-clinical \
            --aggregate-members MedxFactory,openChart,MedxEHR,HealthLinc \
            --aggregate-display-name "Medx clinical"
      # Delivers living health/ artifacts. NOT gated on steps.run.outputs.commit:
      # a same-day rerun redirects only the DATED report/inventory to
      # RUNNER_TEMP (records are immutable — they never re-enter the tree, so
      # `git add health/` cannot pick them up), while the SAME rerun still
      # refreshes living artifacts under health/ (the ideation-dashboard lane
      # status + snapshot, document-catalog runs, inventories). `git add health/`
      # + `git diff --cached --quiet` acts whenever — and only when — something
      # under health/ actually changed, so the dated report stays immutable while
      # fresh lane output always lands.
      #
      # DELIVERY IS VIA PR, NOT DIRECT PUSH (org ruleset 18962101, created
      # 2026-07-15): the default branch now requires PR + 1 approval with
      # OrgAdmin-only bypass, so this job's token can no longer push reports
      # straight to it. Instead we stage the report onto a rolling branch
      # `doc-health/nightly`, open a PR against the default branch, and enable
      # auto-merge. Merge Master now evaluates the exact-head, base-branch
      # envelope and approves an in-envelope PR autonomously; any failed or
      # unevaluable condition leaves it parked for the human gate.
      #
      # DELIVERY IS FORCE-FREE (org ruleset 8981805 "Copilot Auto-Review All
      # PRs"): that ruleset applies `non_fast_forward` to `~ALL` branches with
      # NO bypass, so NO token — App or PAT — can force-push ANY branch in this
      # org, including a non-default one like `doc-health/nightly`. (An earlier
      # revision force-rebuilt the branch and wrongly claimed the rule scoped
      # `~DEFAULT_BRANCH` only; it succeeded solely on nights the push happened
      # to CREATE the branch, which is not a non-fast-forward.) So we deliver
      # only via branch creation and fast-forward:
      #   * No open PR (branch absent, or a stale branch left by a merged/closed
      #     PR): delete any stale branch (ref DELETION is unrestricted), then
      #     push a single fresh commit atop current main as a branch CREATION,
      #     and open the PR.
      #   * Open PR exists: PRESERVE it and its review thread. Advance the branch
      #     by a merge commit whose FIRST parent is the current remote branch tip
      #     (so the push is a FAST-FORWARD, not blocked) and whose SECOND parent
      #     is current main. Its tree is current main with the fresh report
      #     health/ overlaid, so (a) report content always wins, (b) everything
      #     outside health/ matches main, hence the PR diff stays exactly
      #     health/** — which the merge-approval envelope's path_allowlist
      #     requires — and (c) same-day reruns replace the report content without
      #     stacking a stale base.
      #
      # No-change fast-path preserved: if nothing under health/ changed, there is
      # no commit, no branch, and no PR. And if the fresh report is already
      # byte-identical to main's health/, there is nothing to deliver.
      - name: Commit report (deliver via rolling PR — ruleset 18962101)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          # The content-App token above satisfies the branch-confinement
          # ruleset for the push, but its installation carries no `actions`
          # permission, so the approval-workflow dispatch at the end of this
          # step must run on the job's GITHUB_TOKEN instead (403 otherwise —
          # live-verified 2026-07-28, task 7.1 canary).
          DISPATCH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_DATE: ${{ steps.run.outputs.run_date }}
          NEW_COUNT: ${{ steps.run.outputs.new_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "doc-health"
          git config user.email "doc-health@users.noreply.github.com"
          git add health/
          # No-op guard #1 (unchanged same-day-rerun contract): nothing under
          # health/ moved -> no commit, no branch, no PR.
          if git diff --cached --quiet; then
            echo "No health/ changes — no commit, no branch, no PR."
            exit 0
          fi
          # Snapshot the report tree as a local commit so we can overlay just its
          # health/ subtree below.
          git commit -m "Doc-health report ${RUN_DATE}"
          REPORT_COMMIT="$(git rev-parse HEAD)"
          # Resolve the default branch (PR base). github.event.repository is not
          # populated on schedule events, so ask the API.
          DEFAULT_BRANCH="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef -q .defaultBranchRef.name)"
          git fetch origin "$DEFAULT_BRANCH"
          MAIN_TIP="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          # Build the delivery tree in the index: current default-branch tree with
          # the FRESH report health/ overlaid (report content always wins). Reset
          # to main, drop main's health/, then lay down exactly the report's
          # health/ — so files main carried but the report dropped are removed too.
          git checkout -B doc-health/nightly "$MAIN_TIP"
          rm -rf health/
          git checkout "$REPORT_COMMIT" -- health/
          git add -A health/
          # No-op guard #2 (already-current-on-main): the report's health/ tree is
          # byte-identical to what already sits on the default branch — nothing to
          # deliver.
          if git diff --cached --quiet; then
            echo "health/ already current on ${DEFAULT_BRANCH} — nothing to deliver."
            exit 0
          fi
          DELIVERY_TREE="$(git write-tree)"
          # Is there an open rolling PR whose thread we must preserve?
          OPEN_PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head doc-health/nightly --base "$DEFAULT_BRANCH" --state open --json number -q '.[0].number')"
          if [ -n "$OPEN_PR" ]; then
            # Preserve the open PR + its review thread. Fast-forward the branch:
            # merge commit, first parent = current remote branch tip (makes the
            # push a fast-forward, never blocked by ~ALL non_fast_forward), second
            # parent = current main. Tree = main + fresh report health/.
            git fetch origin doc-health/nightly
            REMOTE_TIP="$(git rev-parse FETCH_HEAD)"
            NEW_TIP="$(git commit-tree "$DELIVERY_TREE" -p "$REMOTE_TIP" -p "$MAIN_TIP" -m "Doc-health report ${RUN_DATE}")"
            git update-ref refs/heads/doc-health/nightly "$NEW_TIP"
            git push origin doc-health/nightly            # fast-forward, no --force
          else
            # No open PR: (re)create the delivery branch from scratch. Remove any
            # stale branch first (ref deletion is unrestricted by the ruleset),
            # then push a single fresh commit atop main as a branch CREATION.
            if git ls-remote --exit-code --heads origin doc-health/nightly >/dev/null 2>&1; then
              git push origin --delete doc-health/nightly
            fi
            NEW_TIP="$(git commit-tree "$DELIVERY_TREE" -p "$MAIN_TIP" -m "Doc-health report ${RUN_DATE}")"
            git update-ref refs/heads/doc-health/nightly "$NEW_TIP"
            git push origin doc-health/nightly            # branch creation, no --force
            printf '%s\n' \
              "Nightly doc-health report for ${RUN_DATE}." \
              "" \
              "- Run: ${RUN_URL}" \
              "- New findings this run: ${NEW_COUNT}" \
              "" \
              "🤖 Generated with [Claude Code](https://claude.com/claude-code)" \
              > "$RUNNER_TEMP/doc-health-pr-body.md"
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base "$DEFAULT_BRANCH" --head doc-health/nightly \
              --title "Doc-health report ${RUN_DATE}" \
              --body-file "$RUNNER_TEMP/doc-health-pr-body.md"
            gh pr comment doc-health/nightly --repo "$GITHUB_REPOSITORY" \
              --body "Auto-merge is enabled. Merge Master evaluates this PR's exact head against the reviewed low-risk envelope and approves it autonomously only when every condition holds. Any failed or unevaluable condition leaves the PR parked for the human gate (ruleset 18962101 requires PR + 1 approval; repository ruleset 19887057 dismisses previous-head approvals)."
          fi
          # Land on approval. Non-fatal: if repo auto-merge is disabled the PR
          # still waits for a manual merge after approval.
          gh pr merge doc-health/nightly --repo "$GITHUB_REPOSITORY" --auto --merge \
            || echo "::warning::Could not enable auto-merge; merge doc-health/nightly manually after approval."
          # Chain the merge-master approval workflow. Reached only on a real
          # delivery (both no-op guards above exit 0 before here). The
          # content-App-authored push DOES raise pull_request_target, but that
          # run evaluates before required checks finish and parks fail-closed,
          # and Actions-created check suites never retrigger check_suite — so
          # this explicit dispatch is the trigger that actually approves
          # (live-verified 2026-07-28). It runs on the job's GITHUB_TOKEN
          # (DISPATCH_TOKEN): the content-App token cannot dispatch, and
          # workflow_dispatch is exempt from the recursion guard. Non-fatal
          # (fail-closed): a failed dispatch just leaves the PR parked for the
          # human gate, never fails the nightly.
          GH_TOKEN="$DISPATCH_TOKEN" gh workflow run merge-master-approval.yml \
            --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            || echo "::warning::approval-workflow dispatch failed — PR parks for the human gate"
      - name: Open regression issue (one per run, contract regression rule)
        if: steps.run.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "New critical/error findings versus the previous report"
            echo "(matched by family + path). Full report:"
            echo "health/reports/${{ steps.run.outputs.run_date }}.md"
            echo
            python3 - <<'PY'
          import json
          for f in json.load(open("new-findings.json")):
              print(f"- [{f['severity']}] {f['family']} {f['repo']}:{f['path']} — {f['rule']}")
          PY
          } > issue-body.md
          gh issue create \
            --title "doc-health regressions ${{ steps.run.outputs.run_date }}" \
            --body-file issue-body.md \
            --repo "${{ github.repository }}"
      - name: Supersede stale regression issues
        # Non-fatal housekeeping. Each nightly recomputes regressions fresh
        # against the previous report, so any OPEN "doc-health regressions
        # <date>" issue whose date is STRICTLY OLDER than this run's date is a
        # stale point-in-time alert already superseded by the current report.
        # Close those, citing the current report. The strict-older date filter
        # guarantees the current run's own issue (date == run_date) is never
        # touched. Every gh call is guarded so this step can never fail the
        # nightly.
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DATE: ${{ steps.run.outputs.run_date }}
          REPORT_PATH: health/reports/${{ steps.run.outputs.run_date }}.md
        run: |
          if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --limit 200 --json number,title > open-issues.json; then
            echo "::warning::could not list issues; skipping stale-regression cleanup"
            exit 0
          fi
          STALE="$(python3 - "$RUN_DATE" <<'PY'
          import json, re, sys
          run_date = sys.argv[1]
          # Exact title shape only: "doc-health regressions YYYY-MM-DD".
          pat = re.compile(r"^doc-health regressions (\d{4}-\d{2}-\d{2})$")
          try:
              issues = json.load(open("open-issues.json"))
          except (OSError, json.JSONDecodeError):
              issues = []
          for issue in issues:
              m = pat.match(issue.get("title", ""))
              # ISO dates compare correctly as strings; strict-older only.
              if m and m.group(1) < run_date:
                  print(issue["number"])
          PY
          )"
          if [ -z "$STALE" ]; then
            echo "No stale regression issues older than ${RUN_DATE}."
            exit 0
          fi
          for n in $STALE; do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "superseded by ${REPORT_PATH}" \
              && echo "Closed stale regression issue #${n}." \
              || echo "::warning::failed to close stale regression issue #${n}"
          done
