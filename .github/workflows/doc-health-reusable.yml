          import json, os
          value = json.load(open("organizer-readiness.json", encoding="utf-8"))
          print(f"ready={str(value['ready']).lower()}")
          print(f"reason={value['reason']}")
          print(f"dispatch_label={value.get('dispatch_label', '')}")
          print(f"correlation_id=organizer-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}")
          PY
      - name: Dispatch artifact-only organizer child
        id: organizer-dispatch
        # readiness-only can prove ready=true but must never dispatch.
        if: steps.organizer-readiness.outputs.ready == 'true' && inputs.readiness-only != true
        env:
          GH_TOKEN: ${{ github.token }}
