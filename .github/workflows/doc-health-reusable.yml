                # named after its own dispatched job id (IDEAORG-*.json,
                # organizer.envelope's id prefix) -- "Run doc-health suite"
                # below recovers that job id from the downloaded filename.
                if [ "$CONCLUSION" = "success" ] && \
                   gh run download "$CHILD_ID" \
                     --repo "$GITHUB_REPOSITORY" \
                     --name "ideation-organizer-recommendation-${CORRELATION_ID}" \
                     --dir findings; then
                  REASON="ready"
                elif [ -n "$CONCLUSION" ]; then
                  REASON="child_${CONCLUSION:-artifact_unavailable}"
                fi
              fi
            fi
          fi
          printf '%s\n' "$REASON" > findings/organizer-unavailable-reason.txt
      - name: Run doc-health suite
        id: run
        if: always()
        env:
          # Only reaches the inline-fallback worker; the runner scrubs its
          # subprocess environment so no repo token reaches the model.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKIP_FAMILIES_INPUT: ${{ inputs.skip-families }}
          FAIL_ON_INPUT: ${{ inputs.fail-on }}
          OMNIGENT_ENABLED: ${{ needs.prepare.outputs.omnigent }}
          ORGANIZER_MANUAL_INPUT: ${{ inputs.organizer-manual-ideas }}
          ORGANIZER_TENANT: ${{ inputs.worker-tenant-boundary }}
          ORGANIZER_DATA_BOUNDARY: ${{ inputs.worker-data-boundary }}
          ORGANIZER_HANDLING: ${{ inputs.worker-handling-class }}
        run: |
          RUN_DATE="$(date -u +%F)"
          PREV="$(ls health/reports/[0-9]*.md 2>/dev/null | sort | tail -1 || true)"
          # Reports are immutable records: a same-day rerun must never
          # overwrite the landed report — it becomes an artifact instead.
          REPORT_OUT="health/reports/${RUN_DATE}.md"
          COMMIT="true"
          if [ -f "$REPORT_OUT" ]; then
            REPORT_OUT="${RUNNER_TEMP}/doc-health-${RUN_DATE}.md"
            COMMIT="false"
          fi
          # Inventory: the snapshot both passes report against. Same-day
          # rerun redirects to temp like the report (records are immutable).
          PREV_INV="$(ls health/inventory/[0-9]*.json 2>/dev/null | sort | tail -1 || true)"
          INV_OUT="health/inventory/${RUN_DATE}.json"
          [ -f "$INV_OUT" ] && INV_OUT="${RUNNER_TEMP}/inventory-${RUN_DATE}.json"
          # Sweep mode: merge the omnigent worker's artifact when dispatch
          # is enabled (a missing artifact records the worker-offline skip);
          # otherwise attempt the inline sweep (skips without CLI/key).
          INVENTORY=()
          if [ "$OMNIGENT_ENABLED" = "true" ]; then
            REASON="$(cat findings/unavailable-reason.txt 2>/dev/null || echo worker_unavailable)"
            if [ -f prepared/inventory.json ]; then
              INVENTORY=(--inventory-in prepared/inventory.json)
            else
              REASON="deterministic_inventory_unavailable"
              rm -f findings/findings.json
            fi
            SWEEP=(--semantic-findings-in findings/findings.json \
              --semantic-unavailable-reason "$REASON")
          else
            SWEEP=(--semantic-sweep)
          fi
          SKIPS=()
          if [ -n "$SKIP_FAMILIES_INPUT" ]; then
            read -r -a SKIP_VALUES <<< "$SKIP_FAMILIES_INPUT"
            for family in "${SKIP_VALUES[@]}"; do
              SKIPS+=(--skip-family "$family")
            done
          fi
          GATE=()
          if [ -n "$FAIL_ON_INPUT" ]; then
            GATE=(--fail-on "$FAIL_ON_INPUT")
          fi
          # Catalog mode: unlike the sweep, this always engages -- FR-001/
          # FR-006/FR-007 require every nightly main run to produce a full
          # mechanical snapshot regardless of whether a cataloger worker is
          # even enabled (US1 acceptance 1), so this is not gated on
          # OMNIGENT_ENABLED the way SWEEP's inline-fallback branch is.
          # findings/catalog-unavailable-reason.txt defaults to
          # worker_unavailable when the collector step above never ran
          # (omnigent disabled) or never got far enough to write it.
          CATALOG_REASON="$(cat findings/catalog-unavailable-reason.txt 2>/dev/null || echo worker_unavailable)"
          # The downloaded recommendation artifact is named after its own
          # dispatched job id (CATJOB-*.json); doc-health.py recovers the
          # job id from this filename (--catalog-findings-in's stem). The
          # worker dispatches and uploads exactly one shard's artifact per
          # run (doc-health-cataloger-worker.yml) -- more than one match
          # here means that invariant broke, so this fails closed (treated
          # as unavailable) rather than silently picking one and dropping
          # the rest (PR #6 review).
          mapfile -t CATALOG_FILES < <(ls findings/CATJOB-*.json 2>/dev/null || true)
          if [ "${#CATALOG_FILES[@]}" -eq 1 ]; then
            CATALOG=(--catalog-findings-in "${CATALOG_FILES[0]}" \
              --catalog-unavailable-reason "$CATALOG_REASON")
          else
            if [ "${#CATALOG_FILES[@]}" -gt 1 ]; then
              CATALOG_REASON="multiple_recommendation_artifacts"
            fi
            CATALOG=(--catalog-unavailable-reason "$CATALOG_REASON")
          fi
          # Organizer mode (task 7.2): like the catalog lane this always
          # engages so the report's "## Ideation Organizer" section always
          # renders (skipped when no worker is enabled); it is non-blocking and
          # never writes anything unless a valid recommendation returned. The
          # manual-idea and host-boundary flags MUST match the prepare phase so
          # the merge recomputes the same selection/authorization and can match
          # the dispatched idea's returned artifact (IDEAORG-*.json, named after
          # its own dispatched job id). More than one match means the
          # one-child-per-run invariant broke, so this fails closed.
          ORGANIZER_REASON="$(cat findings/organizer-unavailable-reason.txt 2>/dev/null || echo worker_unavailable)"
          ORGANIZER_MANUAL=()
          if [ -n "$ORGANIZER_MANUAL_INPUT" ]; then
            read -r -a OM_VALUES <<< "$ORGANIZER_MANUAL_INPUT"
            for idea in "${OM_VALUES[@]}"; do
              ORGANIZER_MANUAL+=(--organizer-manual-idea "$idea")
            done
          fi
          ORGANIZER_HOST=(--organizer-tenant-boundary "$ORGANIZER_TENANT" \
            --organizer-data-boundary "$ORGANIZER_DATA_BOUNDARY" \
            --organizer-handling-class "$ORGANIZER_HANDLING")
          mapfile -t ORGANIZER_FILES < <(ls findings/IDEAORG-*.json 2>/dev/null || true)
          if [ "${#ORGANIZER_FILES[@]}" -eq 1 ]; then
            ORGANIZER=(--organizer-findings-in "${ORGANIZER_FILES[0]}" \
              --organizer-unavailable-reason "$ORGANIZER_REASON" \
              "${ORGANIZER_MANUAL[@]}" "${ORGANIZER_HOST[@]}")
          else
            if [ "${#ORGANIZER_FILES[@]}" -gt 1 ]; then
              ORGANIZER_REASON="multiple_recommendation_artifacts"
            fi
            ORGANIZER=(--organizer-unavailable-reason "$ORGANIZER_REASON" \
              "${ORGANIZER_MANUAL[@]}" "${ORGANIZER_HOST[@]}")
          fi
          python3 openxFactory/scripts/doc-health.py \
            --repo-root . "${SKIPS[@]}" "${GATE[@]}" \
            --report-out "$REPORT_OUT" \
            ${PREV:+--previous-report "$PREV"} \
            --emit-inventory "$INV_OUT" \
            "${INVENTORY[@]}" \
            ${PREV_INV:+--previous-inventory "$PREV_INV"} \
            "${SWEEP[@]}" \
            "${CATALOG[@]}" \
            "${ORGANIZER[@]}" \
            --new-findings-out new-findings.json
          echo "run_date=${RUN_DATE}" >> "$GITHUB_OUTPUT"
          echo "report_out=${REPORT_OUT}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "new_count=$(python3 -c 'import json;print(len(json.load(open("new-findings.json"))))')" >> "$GITHUB_OUTPUT"
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-health-report-${{ steps.run.outputs.run_date }}
          path: ${{ steps.run.outputs.report_out }}
      # Ideation readiness lane (openxFactory
      # add-ideation-cross-reference-readiness, change tasks 4.1/4.3).
      # Clones the cataloger lane's own readiness-check/dispatch/collect
      # shape (same runner-group/heartbeat query, same artifact-only
      # child-workflow dispatch, same bounded discovery/queue/run
      # watchdog) with ONE deliberate difference: this lane's own ADDED
      # requirement binds it to run AFTER the deterministic pass, against
      # the SAME inventory snapshot this run just emitted -- so every step
      # below lives here in `finalize`, after "Run doc-health suite",
      # never in `prepare` alongside the semantic/cataloger bundles (which
      # dispatch against the PREVIOUS day's inventory instead). No host
      # advertises the `ideation-readiness` profile yet, so `ready` below
      # is false and every following step short-circuits via its own
      # `if:` guard -- this WILL be the initial state.
      - name: Evaluate readiness-scorer worker readiness
        id: xref-readiness
        env:
          WORKER_ENABLED: ${{ needs.prepare.outputs.omnigent }}
          HERMES_READINESS_URL: ${{ vars.HERMES_READINESS_URL }}
          HERMES_WORKER_ID: ${{ vars.OMNIGENT_WORKER_ID }}
          HERMES_READINESS_TOKEN: ${{ secrets.HERMES_READINESS_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REQUIRED_TENANT: ${{ inputs.worker-tenant-boundary }}
          REQUIRED_DATA_BOUNDARY: ${{ inputs.worker-data-boundary }}
          REQUIRED_HANDLING: ${{ inputs.worker-handling-class }}
          MAX_AGE: ${{ inputs.worker-heartbeat-max-age-seconds }}
        run: |
          GROUP="xfactory-artifact-workers"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          QUERY_ERROR=""
          : > xref-runners-api.json
          if [ "$WORKER_ENABLED" = "true" ]; then
            GROUP_ID=""
            if gh api --paginate --slurp \
                "orgs/${OWNER}/actions/runner-groups?per_page=100" \
                > xref-runner-groups-api.json 2>/dev/null; then
              GROUP_ID="$(python3 - "$GROUP" <<'PY'
          import json
          import sys
          try:
              pages = json.load(open("xref-runner-groups-api.json", encoding="utf-8"))
              if not isinstance(pages, list):
                  raise ValueError("runner group pages must be an array")
              groups = []
              for page in pages:
                  if not isinstance(page, dict) or not isinstance(
                          page.get("runner_groups"), list):
                      raise ValueError("runner group page is malformed")
                  groups.extend(page["runner_groups"])
              print(next((item.get("id") for item in groups
                          if isinstance(item, dict)
                          and item.get("name") == sys.argv[1]
                          and isinstance(item.get("id"), int)), ""))
          except (OSError, json.JSONDecodeError, AttributeError, ValueError):
              print("")
          PY
              )"
            else
              QUERY_ERROR="runner_group_query_failed"
            fi
            if [ -n "$GROUP_ID" ]; then
              gh api --paginate --slurp \
                "orgs/${OWNER}/actions/runner-groups/${GROUP_ID}/runners?per_page=100" \
                > xref-runners-api.json 2>/dev/null || QUERY_ERROR="runner_query_failed"
            elif [ -z "$QUERY_ERROR" ]; then
              QUERY_ERROR="runner_group_query_failed"
            fi
          fi
          python3 - "$GROUP" "$QUERY_ERROR" <<'PY'
          import json
          from pathlib import Path
          import sys
          group, error = sys.argv[1:]
          try:
              pages = json.loads(Path("xref-runners-api.json").read_text() or "[]")
              if not isinstance(pages, list):
                  raise ValueError("runner response must be an array")
              runners = []
              for page in pages:
                  if not isinstance(page, dict) or not isinstance(
                          page.get("runners"), list):
                      raise ValueError("runner response page is malformed")
                  runners.extend(page["runners"])
          except (json.JSONDecodeError, ValueError):
              runners, error = [], error or "invalid_runner_response"
          Path("xref-runner-group.json").write_text(json.dumps({
              "group": group, "query_error": error,
              "runners": runners,
          }))
          PY
          if [ "$WORKER_ENABLED" = "true" ] && \
             [ -n "$HERMES_READINESS_URL" ] && \
             [ -n "$HERMES_WORKER_ID" ]; then
            AUTH=()
            [ -n "$HERMES_READINESS_TOKEN" ] && \
              AUTH=(-H "Authorization: Bearer ${HERMES_READINESS_TOKEN}")
            if curl --fail --silent --show-error \
                 "${AUTH[@]}" \
                 "${HERMES_READINESS_URL%/}/api/readiness/workers/${HERMES_WORKER_ID}" \
                 > xref-hermes-worker.json; then
              if ! python3 - <<'PY'
          import json
          from pathlib import Path
          response = json.load(open("xref-hermes-worker.json", encoding="utf-8"))
          if not isinstance(response, dict):
              raise ValueError("readiness response must be an object")
          worker = response.get("worker", {})
          if not isinstance(worker, dict):
              raise ValueError("readiness worker must be an object")
          metadata = worker.get("metadata", {})
          heartbeat = dict(metadata) if isinstance(metadata, dict) else {}
          heartbeat.setdefault("host_id", worker.get("id"))
          heartbeat.setdefault("observed_at", worker.get("last_seen_at"))
          heartbeat["status"] = worker.get("status")
          heartbeat["current_jobs"] = worker.get("current_jobs")
          Path("xref-heartbeat.json").write_text(json.dumps(heartbeat),
                                              encoding="utf-8")
          PY
              then
                printf '%s\n' '{"query_error":"invalid_heartbeat_response"}' \
                  > xref-heartbeat.json
              fi
            else
              printf '%s\n' '{"query_error":"heartbeat_query_failed"}' \
                > xref-heartbeat.json
            fi
          else
            printf '%s\n' '{"query_error":"heartbeat_endpoint_unconfigured"}' \
              > xref-heartbeat.json
          fi
          ENABLED=()
          [ "$WORKER_ENABLED" = "true" ] && ENABLED=(--enabled)
          python3 scripts/check-worker-readiness.py \
            --runner-group xref-runner-group.json \
            --heartbeat xref-heartbeat.json \
            "${ENABLED[@]}" \
            --required-group "$GROUP" \
            --required-label ideation-readiness \
            --required-profile readiness-scorer \
            --required-profile-version 1 \
            --required-tenant "$REQUIRED_TENANT" \
            --required-data-boundary "$REQUIRED_DATA_BOUNDARY" \
            --required-handling "$REQUIRED_HANDLING" \
            --required-policy-version artifact-worker-v1 \
            --max-age-seconds "$MAX_AGE" \
            --output xref-readiness.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          value = json.load(open("xref-readiness.json", encoding="utf-8"))
          print(f"ready={str(value['ready']).lower()}")
          print(f"reason={value['reason']}")
          print(f"dispatch_label={value.get('dispatch_label', '')}")
          print(f"correlation_id=readiness-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}")
          PY
      - name: Build readiness bundle (per-cluster untrusted payloads)
        id: xref-build
        # Precomputes each cluster's FULL untrusted analysis-input text (not
        # just raw ingredients): the child below has no repository access
        # and cannot import doc_health at all (the same reason
        # doc-health-cataloger-worker.yml embeds only stdlib json, never a
        # package import), so this step does ALL the clustering + prompt
        # assembly a bounded worker needs, using the SAME checkout state
        # that just produced this run's inventory.
        if: steps.xref-readiness.outputs.ready == 'true'
        run: |
          python3 openxFactory/scripts/ideation-readiness-nightly.py \
            --repo-root . --phase prepare --out-dir xref-bundle \
            --as-of "${{ steps.run.outputs.run_date }}" \
            --run-id "${{ steps.xref-readiness.outputs.correlation_id }}"
          echo "cluster_count=$(python3 -c 'import json; print(json.load(open("xref-bundle/manifest.json"))["cluster_count"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.xref-readiness.outputs.ready == 'true' && steps.xref-build.outputs.cluster_count != '0'
        with:
          name: ideation-readiness-bundle
          path: xref-bundle
      - name: Dispatch artifact-only readiness child
        id: xref-dispatch
        # Cloned from "Dispatch artifact-only cataloger child" (no separate
        # readiness-only guard needed: the whole finalize job already
        # carries `if: always() && inputs.readiness-only != true`).
        if: steps.xref-readiness.outputs.ready == 'true' && steps.xref-build.outputs.cluster_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CORRELATION_ID: ${{ steps.xref-readiness.outputs.correlation_id }}
          DISPATCH_LABEL: ${{ steps.xref-readiness.outputs.dispatch_label }}
        run: |
          if gh workflow run doc-health-readiness-worker.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f source_run_id="$GITHUB_RUN_ID" \
            -f source_sha="$GITHUB_SHA" \
            -f correlation_id="$CORRELATION_ID" \
            -f dispatch_label="$DISPATCH_LABEL"; then
            echo "dispatched=true" >> "$GITHUB_OUTPUT"
            echo "reason=ready" >> "$GITHUB_OUTPUT"
          else
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            echo "reason=child_dispatch_failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect bounded readiness result
        # Cloned from "Collect bounded cataloger result" verbatim --
        # identical 120s discovery / 600s queue-timeout / 1800s
        # run-timeout deadlines and cancel-on-timeout behavior. This
        # lane's own readiness-check + dispatch already ran earlier in
        # THIS SAME job (not `prepare` -- see the block above), so the
        # gating and correlation id come from this job's own step
        # outputs rather than `needs.prepare.outputs.*`.
        if: steps.xref-readiness.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED: ${{ steps.xref-dispatch.outputs.dispatched }}
          CORRELATION_ID: ${{ steps.xref-readiness.outputs.correlation_id }}
        run: |
          mkdir -p xref-findings
          REASON="child_dispatch_failed"
          if [ "$DISPATCHED" = "true" ]; then
            TITLE="doc-health-readiness-${CORRELATION_ID}"
            DISCOVERY_DEADLINE=$((SECONDS + 120))
            CHILD_ID=""
            REASON="child_not_observed"
            while [ $SECONDS -lt $DISCOVERY_DEADLINE ]; do
              if ! gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow doc-health-readiness-worker.yml \
                  --limit 50 \
                  --json databaseId,displayTitle \
                  > xref-child-runs.json 2>/dev/null; then
                REASON="worker_result_query_failed"
                break
              fi
              if ! CHILD_ID="$(python3 - "$TITLE" <<'PY'
          import json
          import sys
          try:
              runs = json.load(open("xref-child-runs.json", encoding="utf-8"))
              if not isinstance(runs, list):
                  raise ValueError("run list is not an array")
              print(next((str(run.get("databaseId")) for run in runs
                          if isinstance(run, dict)
                          and run.get("displayTitle") == sys.argv[1]
                          and isinstance(run.get("databaseId"), int)), ""))
          except (OSError, json.JSONDecodeError, ValueError):
              raise SystemExit(1)
          PY
              )"; then
                REASON="worker_result_response_invalid"
                break
              fi
              [ -n "$CHILD_ID" ] && break
              sleep 10
            done
            if [ -n "$CHILD_ID" ]; then
              COMPLETED="false"
              RUNNING="false"
              QUEUE_DEADLINE=$((SECONDS + 600))
              REASON="child_queue_timeout"
              while [ $SECONDS -lt $QUEUE_DEADLINE ]; do
                if ! STATUS="$(gh run view "$CHILD_ID" \
                    --repo "$GITHUB_REPOSITORY" \
                    --json status --jq .status 2>/dev/null)"; then
                  REASON="worker_result_query_failed"
                  break
                fi
                if [ "$STATUS" = "completed" ]; then
                  COMPLETED="true"
                  break
                fi
                if [ "$STATUS" = "in_progress" ]; then
                  RUNNING="true"
                  break
                fi
                sleep 15
              done
              if [ "$RUNNING" = "true" ]; then
                RUN_DEADLINE=$((SECONDS + 1800))
                REASON="child_timeout"
                while [ $SECONDS -lt $RUN_DEADLINE ]; do
                  if ! STATUS="$(gh run view "$CHILD_ID" \
                      --repo "$GITHUB_REPOSITORY" \
                      --json status --jq .status 2>/dev/null)"; then
                    REASON="worker_result_query_failed"
                    break
                  fi
                  if [ "$STATUS" = "completed" ]; then
                    COMPLETED="true"
                    break
                  fi
                  sleep 15
                done
                if [ "$COMPLETED" != "true" ] && \
                   [ "$REASON" = "child_timeout" ]; then
                  if STATUS="$(gh run view "$CHILD_ID" \
                      --repo "$GITHUB_REPOSITORY" \
                      --json status --jq .status 2>/dev/null)"; then
                    [ "$STATUS" = "completed" ] && COMPLETED="true"
                  else
                    REASON="worker_result_query_failed"
                  fi
                fi
              fi
              if [[ "$COMPLETED" != "true" && \
                    ( "$REASON" = "child_timeout" || \
                      "$REASON" = "child_queue_timeout" ) ]]; then
                gh run cancel "$CHILD_ID" --repo "$GITHUB_REPOSITORY" \
                  >/dev/null 2>&1 || true
              fi
              if [ "$COMPLETED" = "true" ]; then
                if ! CONCLUSION="$(gh run view "$CHILD_ID" \
                    --repo "$GITHUB_REPOSITORY" \
                    --json conclusion --jq .conclusion 2>/dev/null)"; then
                  REASON="worker_result_query_failed"
                  CONCLUSION=""
                fi
                # The child uploads exactly one file, findings.json, so
                # the download always lands at xref-findings/findings.json.
                if [ "$CONCLUSION" = "success" ] && \
                   gh run download "$CHILD_ID" \
                     --repo "$GITHUB_REPOSITORY" \
                     --name "ideation-readiness-findings-${CORRELATION_ID}" \
                     --dir xref-findings; then
                  REASON="ready"
                elif [ -n "$CONCLUSION" ]; then
                  REASON="child_${CONCLUSION:-artifact_unavailable}"
                fi
              fi
            fi
          fi
          printf '%s\n' "$REASON" > xref-findings/unavailable-reason.txt
      - name: Ideation readiness lane (merge, persist, report link)
        # Runs unconditionally: a not-ready / never-dispatched / collection-
        # failed run still must record the lane as SKIPPED and preserve any
        # PRIOR findings (doc-health "Ideation readiness lane" scenario "The
        # lane is skipped" / change task 5.1's last case: absent findings
        # from a skipped lane are never treated as resolved) — this step
        # never gates on `xref-readiness`/`xref-dispatch` the way the steps
        # above do. continue-on-error is belt-and-braces so this lane can
        # never affect the already-landed deterministic report/inventory.
        if: always()
        continue-on-error: true
        env:
          CHECK_REASON: ${{ steps.xref-readiness.outputs.ready != 'true' && steps.xref-readiness.outputs.reason || '' }}
        run: |
          FINDINGS_IN=""
          [ -f xref-findings/findings.json ] && FINDINGS_IN="xref-findings/findings.json"
          UNAVAILABLE="$CHECK_REASON"
          if [ -z "$UNAVAILABLE" ] && [ -f xref-findings/unavailable-reason.txt ]; then
            REASON_FILE="$(cat xref-findings/unavailable-reason.txt)"
            [ "$REASON_FILE" != "ready" ] && UNAVAILABLE="$REASON_FILE"
          fi
          ARGS=(--repo-root . --phase merge \
            --as-of "${{ steps.run.outputs.run_date }}" \
            --run-id "readiness-${{ github.run_id }}-${{ github.run_attempt }}" \
            --report-in "${{ steps.run.outputs.report_out }}")
          [ -n "$FINDINGS_IN" ] && ARGS+=(--findings-in "$FINDINGS_IN")
          [ -n "$UNAVAILABLE" ] && ARGS+=(--unavailable-reason "$UNAVAILABLE")
          python3 openxFactory/scripts/ideation-readiness-nightly.py "${ARGS[@]}"
      # =====================================================================
      # Derive-possibles lane (openxFactory add-possibles-derivation-lane,
      # tasks 4.1/4.2/4.4). Clones the ideation-readiness lane's
      # readiness-check/build/dispatch/collect/merge shape above verbatim
      # (same runner-group/heartbeat query, same artifact-only child-workflow
      # dispatch, same bounded 120s-discovery / 600s-queue / 1800s-run
      # watchdog with cancel-on-timeout) with TWO deliberate differences:
      # (1) it runs AFTER the readiness merge above, so the clusters it
      # derives against are this run's freshest index, and (2) its outcome
      # NEVER reaches the Ranked Plan — undisposed derived possibles are
      # excluded from ranked plans by contract and get their own report
      # section only. No host advertises the `derive-possibles` profile yet,
      # so `ready` below is false and every following step short-circuits via
      # its own `if:` guard — the same valid landed state the readiness lane
      # shipped in (the lane reports SKIPPED until the ops deployment step).
      - name: Evaluate derive-possibles worker readiness
        id: dposs-readiness
        env:
          WORKER_ENABLED: ${{ needs.prepare.outputs.omnigent }}
          HERMES_READINESS_URL: ${{ vars.HERMES_READINESS_URL }}
          HERMES_WORKER_ID: ${{ vars.OMNIGENT_WORKER_ID }}
          HERMES_READINESS_TOKEN: ${{ secrets.HERMES_READINESS_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REQUIRED_TENANT: ${{ inputs.worker-tenant-boundary }}
          REQUIRED_DATA_BOUNDARY: ${{ inputs.worker-data-boundary }}
          REQUIRED_HANDLING: ${{ inputs.worker-handling-class }}
          MAX_AGE: ${{ inputs.worker-heartbeat-max-age-seconds }}
        run: |
          GROUP="xfactory-artifact-workers"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          QUERY_ERROR=""
          : > dposs-runners-api.json
          if [ "$WORKER_ENABLED" = "true" ]; then
            GROUP_ID=""
            if gh api --paginate --slurp \
                "orgs/${OWNER}/actions/runner-groups?per_page=100" \
                > dposs-runner-groups-api.json 2>/dev/null; then
              GROUP_ID="$(python3 - "$GROUP" <<'PY'
          import json
          import sys
          try:
              pages = json.load(open("dposs-runner-groups-api.json", encoding="utf-8"))
              if not isinstance(pages, list):
                  raise ValueError("runner group pages must be an array")
              groups = []
              for page in pages:
                  if not isinstance(page, dict) or not isinstance(
                          page.get("runner_groups"), list):
                      raise ValueError("runner group page is malformed")
                  groups.extend(page["runner_groups"])
              print(next((item.get("id") for item in groups
                          if isinstance(item, dict)
                          and item.get("name") == sys.argv[1]
                          and isinstance(item.get("id"), int)), ""))
          except (OSError, json.JSONDecodeError, AttributeError, ValueError):
              print("")
          PY
              )"
            else
              QUERY_ERROR="runner_group_query_failed"
            fi
            if [ -n "$GROUP_ID" ]; then
              gh api --paginate --slurp \
                "orgs/${OWNER}/actions/runner-groups/${GROUP_ID}/runners?per_page=100" \
                > dposs-runners-api.json 2>/dev/null || QUERY_ERROR="runner_query_failed"
            elif [ -z "$QUERY_ERROR" ]; then
              QUERY_ERROR="runner_group_query_failed"
            fi
          fi
          python3 - "$GROUP" "$QUERY_ERROR" <<'PY'
          import json
          from pathlib import Path
          import sys
          group, error = sys.argv[1:]
          try:
              pages = json.loads(Path("dposs-runners-api.json").read_text() or "[]")
              if not isinstance(pages, list):
                  raise ValueError("runner response must be an array")
              runners = []
              for page in pages:
                  if not isinstance(page, dict) or not isinstance(
                          page.get("runners"), list):
                      raise ValueError("runner response page is malformed")
                  runners.extend(page["runners"])
