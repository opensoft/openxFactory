          set -euo pipefail
          # The SAME governed filter the init step below applies, so the two can
          # never disagree about which submodules a token has to reach.
          GOVERNED='^(openxFactory|xFactories/)'
          MODULES=$(git config --file .gitmodules --get-regexp 'submodule\..*\.path' || true)
          FOREIGN=""
          while read -r key path; do
            [ -n "${path:-}" ] || continue
            printf '%s\n' "$path" | grep -qE "$GOVERNED" || continue
            name=${key#submodule.}
            name=${name%.path}
            url=$(git config --file .gitmodules --get "submodule.${name}.url" || true)
            owner=$(printf '%s\n' "$url" | sed -nE \
              -e 's#^git@github\.com:([^/]+)/.+$#\1#p' \
              -e 's#^https://github\.com/([^/]+)/.+$#\1#p')
            if [ -z "$owner" ]; then
              echo "::warning::no GitHub owner could be read from submodule '${path}' url '${url}'; leaving it to the org-wide rewrite"
              continue
            fi
            echo "governed submodule ${path} -> owner ${owner}"
            if [ "$owner" != "$SELF_OWNER" ]; then
              FOREIGN="${FOREIGN}${owner}"$'\n'
            fi
          done <<< "$MODULES"
          UNIQUE=$(printf '%s' "$FOREIGN" | sed '/^$/d' | sort -u)
          COUNT=$(printf '%s\n' "$UNIQUE" | grep -c . || true)
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::the governed submodules span $COUNT foreign owners ($(printf '%s' "$UNIQUE" | tr '\n' ' ')) but actions/create-github-app-token mints ONE owner per step; extend this workflow with a mint+rewrite pair per foreign owner"
            exit 1
          fi
          if [ "$COUNT" -eq 1 ]; then
            echo "has_foreign=true" >> "$GITHUB_OUTPUT"
            echo "foreign_owner=${UNIQUE}" >> "$GITHUB_OUTPUT"
            echo "foreign submodule owner ${UNIQUE} needs its own installation token"
          else
            echo "has_foreign=false" >> "$GITHUB_OUTPUT"
            echo "foreign_owner=" >> "$GITHUB_OUTPUT"
            echo "every governed submodule lives in ${SELF_OWNER}; the org-wide rewrite suffices"
          fi
