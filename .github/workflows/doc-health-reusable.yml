            --runner-group organizer-runner-group.json \
            --heartbeat organizer-heartbeat.json \
            "${ENABLED[@]}" \
            --required-group "$GROUP" \
            --required-label ideation-organizer \
            --required-profile ideation-organizer \
            --required-profile-version 1 \
            --required-tenant "$REQUIRED_TENANT" \
            --required-data-boundary "$REQUIRED_DATA_BOUNDARY" \
            --required-handling "$REQUIRED_HANDLING" \
            --max-age-seconds "$MAX_AGE" \
            --output organizer-readiness.json
