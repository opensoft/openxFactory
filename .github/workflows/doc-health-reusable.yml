            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            echo "reason=child_dispatch_failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect bounded derive-possibles result
        # Cloned from "Collect bounded readiness result" verbatim — the
        # SAME 120s discovery / 600s queue-timeout / 1800s run-timeout
        # deadlines and cancel-on-timeout realize the change's watchdog
        # requirement (task 4.2: report and cancel a child queued beyond
        # ten minutes or running beyond thirty).
        if: steps.dposs-readiness.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED: ${{ steps.dposs-dispatch.outputs.dispatched }}
          CORRELATION_ID: ${{ steps.dposs-readiness.outputs.correlation_id }}
        run: |
          mkdir -p dposs-findings
          REASON="child_dispatch_failed"
          if [ "$DISPATCHED" = "true" ]; then
            TITLE="doc-health-derive-possibles-${CORRELATION_ID}"
            DISCOVERY_DEADLINE=$((SECONDS + 120))
            CHILD_ID=""
            REASON="child_not_observed"
            while [ $SECONDS -lt $DISCOVERY_DEADLINE ]; do
              if ! gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow doc-health-derive-possibles-worker.yml \
                  --limit 50 \
                  --json databaseId,displayTitle \
                  > dposs-child-runs.json 2>/dev/null; then
                REASON="worker_result_query_failed"
                break
              fi
              if ! CHILD_ID="$(python3 - "$TITLE" <<'PY'
          import json
          import sys
          try:
              runs = json.load(open("dposs-child-runs.json", encoding="utf-8"))
              if not isinstance(runs, list):
                  raise ValueError("run list is not an array")
              print(next((str(run.get("databaseId")) for run in runs
                          if isinstance(run, dict)
                          and run.get("displayTitle") == sys.argv[1]
                          and isinstance(run.get("databaseId"), int)), ""))
          except (OSError, json.JSONDecodeError, ValueError):
              raise SystemExit(1)
          PY
              )"; then
                REASON="worker_result_response_invalid"
                break
              fi
              [ -n "$CHILD_ID" ] && break
              sleep 10
            done
            if [ -n "$CHILD_ID" ]; then
              COMPLETED="false"
              RUNNING="false"
              QUEUE_DEADLINE=$((SECONDS + 600))
              REASON="child_queue_timeout"
              while [ $SECONDS -lt $QUEUE_DEADLINE ]; do
                if ! STATUS="$(gh run view "$CHILD_ID" \
                    --repo "$GITHUB_REPOSITORY" \
                    --json status --jq .status 2>/dev/null)"; then
                  REASON="worker_result_query_failed"
                  break
                fi
                if [ "$STATUS" = "completed" ]; then
                  COMPLETED="true"
                  break
                fi
                if [ "$STATUS" = "in_progress" ]; then
                  RUNNING="true"
                  break
                fi
                sleep 15
              done
              if [ "$RUNNING" = "true" ]; then
                RUN_DEADLINE=$((SECONDS + 1800))
                REASON="child_timeout"
                while [ $SECONDS -lt $RUN_DEADLINE ]; do
                  if ! STATUS="$(gh run view "$CHILD_ID" \
                      --repo "$GITHUB_REPOSITORY" \
                      --json status --jq .status 2>/dev/null)"; then
                    REASON="worker_result_query_failed"
                    break
                  fi
                  if [ "$STATUS" = "completed" ]; then
                    COMPLETED="true"
                    break
                  fi
                  sleep 15
                done
                if [ "$COMPLETED" != "true" ] && \
                   [ "$REASON" = "child_timeout" ]; then
                  if STATUS="$(gh run view "$CHILD_ID" \
                      --repo "$GITHUB_REPOSITORY" \
                      --json status --jq .status 2>/dev/null)"; then
                    [ "$STATUS" = "completed" ] && COMPLETED="true"
                  else
                    REASON="worker_result_query_failed"
                  fi
                fi
              fi
              if [[ "$COMPLETED" != "true" && \
                    ( "$REASON" = "child_timeout" || \
                      "$REASON" = "child_queue_timeout" ) ]]; then
                gh run cancel "$CHILD_ID" --repo "$GITHUB_REPOSITORY" \
                  >/dev/null 2>&1 || true
              fi
              if [ "$COMPLETED" = "true" ]; then
                if ! CONCLUSION="$(gh run view "$CHILD_ID" \
                    --repo "$GITHUB_REPOSITORY" \
                    --json conclusion --jq .conclusion 2>/dev/null)"; then
                  REASON="worker_result_query_failed"
                  CONCLUSION=""
                fi
                # The child uploads exactly one file, findings.json, so
                # the download always lands at dposs-findings/findings.json.
                if [ "$CONCLUSION" = "success" ] && \
                   gh run download "$CHILD_ID" \
                     --repo "$GITHUB_REPOSITORY" \
                     --name "ideation-derive-possibles-findings-${CORRELATION_ID}" \
                     --dir dposs-findings; then
                  REASON="ready"
                elif [ -n "$CONCLUSION" ]; then
                  REASON="child_${CONCLUSION:-artifact_unavailable}"
                fi
              fi
            fi
          fi
          printf '%s\n' "$REASON" > dposs-findings/unavailable-reason.txt
      - name: Derive-possibles lane (merge, persist, report link)
        # Runs unconditionally: a not-ready / never-dispatched / collection-
        # failed run still must record the lane as SKIPPED in the dated
        # report while leaving the register and the deterministic results at
        # their prior state (the delta's "The worker is offline" scenario) —
        # this step never gates on `dposs-readiness`/`dposs-dispatch`.
        # continue-on-error is belt-and-braces so this lane can never affect
        # the already-landed deterministic report/inventory.
        if: always()
        continue-on-error: true
        env:
          CHECK_REASON: ${{ steps.dposs-readiness.outputs.ready != 'true' && steps.dposs-readiness.outputs.reason || '' }}
        run: |
          FINDINGS_IN=""
          [ -f dposs-findings/findings.json ] && FINDINGS_IN="dposs-findings/findings.json"
          UNAVAILABLE="$CHECK_REASON"
          if [ -z "$UNAVAILABLE" ] && [ -f dposs-findings/unavailable-reason.txt ]; then
            REASON_FILE="$(cat dposs-findings/unavailable-reason.txt)"
            [ "$REASON_FILE" != "ready" ] && UNAVAILABLE="$REASON_FILE"
          fi
          ARGS=(--repo-root . --phase merge \
            --as-of "${{ steps.run.outputs.run_date }}" \
            --run-id "derive-possibles-${{ github.run_id }}-${{ github.run_attempt }}" \
            --report-in "${{ steps.run.outputs.report_out }}" \
            --status-out dposs-status.json)
          [ -n "$FINDINGS_IN" ] && ARGS+=(--findings-in "$FINDINGS_IN")
          [ -n "$UNAVAILABLE" ] && ARGS+=(--unavailable-reason "$UNAVAILABLE")
          python3 openxFactory/scripts/derive-possibles-nightly.py "${ARGS[@]}"
      - name: Derive-possibles register commit-back (rolling PR; dormant until first lane persist)
        # Change task 4.4: when — and only when — the merge above PERSISTED a
        # merged register into the openxFactory checkout, commit those
        # governed writes (index yaml + md + health/derive-possibles/
        # evidence) inside the SUBMODULE under the factory identity and
        # deliver them to openxFactory via the same force-free rolling-PR
        # pattern the report delivery uses (org rulesets: default branches
        # need PR + approval; non-fast-forward is blocked org-wide, ref
        # deletion is not). The aggregation PIN BUMP follows once that PR
        # merges — via the established "Sync submodule pointers" practice —
        # because pinning the aggregation to a not-yet-reviewed branch commit
        # would smuggle unreviewed content past openxFactory's own gate.
        # Dormant until a host advertises the derive-possibles profile (the
        # merge above reports SKIPPED and writes persisted=false).
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RUN_DATE: ${{ steps.run.outputs.run_date }}
          CORRELATION_ID: ${{ steps.dposs-readiness.outputs.correlation_id }}
        run: |
          [ -f dposs-status.json ] || { echo "no lane status — nothing to commit back"; exit 0; }
          PERSISTED="$(python3 -c 'import json; print(str(json.load(open("dposs-status.json")).get("persisted", False)).lower())')"
          [ "$PERSISTED" = "true" ] || { echo "lane did not persist — nothing to commit back"; exit 0; }
          BRANCH="doc-health/derive-possibles"
          cd openxFactory
          git config user.name "openxfactory[bot]"
          git config user.email "openxfactory[bot]@users.noreply.github.com"
          git add ideation/cross-reference.yaml health/derive-possibles/
          [ -f ideation/cross-reference.md ] && git add ideation/cross-reference.md
          git diff --cached --quiet && { echo "no submodule changes staged"; exit 0; }
          git commit -m "derive-possibles: merged register (${RUN_DATE}, ${CORRELATION_ID:-manual})"
          NEW_COMMIT="$(git rev-parse HEAD)"
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${BRANCH}"
            OPEN_PR="$(gh pr list --repo "${GITHUB_REPOSITORY_OWNER}/openxFactory" \
              --head "${BRANCH}" --state open --json number --jq 'length' || echo 0)"
            if [ "${OPEN_PR}" != "0" ]; then
              # Preserve the open PR: advance the branch by a merge commit
              # whose FIRST parent is the remote tip (a fast-forward push)
              # and whose tree is this run's content.
              MERGE="$(git commit-tree "${NEW_COMMIT}^{tree}" \
                -p "$(git rev-parse FETCH_HEAD)" -p "${NEW_COMMIT}" \
                -m "derive-possibles: merged register (${RUN_DATE})")"
