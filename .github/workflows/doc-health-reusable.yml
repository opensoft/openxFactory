          path: dposs-bundle
      - name: Dispatch artifact-only derive-possibles child
        id: dposs-dispatch
        if: steps.dposs-readiness.outputs.ready == 'true' && steps.dposs-build.outputs.cluster_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CORRELATION_ID: ${{ steps.dposs-readiness.outputs.correlation_id }}
