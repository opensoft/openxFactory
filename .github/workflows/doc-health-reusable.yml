# Reusable doc-health run (doc-health-checker capability).
# The caller (the xFactory aggregation repo's thin nightly workflow) owns
# scheduling, dispatch, and permissions; suite logic changes only here.
#
# Hosted prepare/finalize jobs never depend on a self-hosted job. Prepare
# performs a fail-closed readiness check and asynchronously dispatches the
# caller repo's artifact-only child workflow. Finalize polls that child for a
# bounded interval, then records a skip and continues if it is unavailable.
name: doc-health-reusable

on:
  workflow_call:
    inputs:
      skip-families:
        description: >-
          Space-separated family ids to skip with notice. Scheduled runs
          skip notebook-projection-drift until a CI auth strategy for nlm
          exists (operator-triggered runs cover it).
        type: string
        default: "notebook-projection-drift"
      fail-on:
        description: Optional gate severity (critical or error); empty = report-only.
        type: string
        default: ""
      worker-tenant-boundary:
        description: Required tenant attestation for the semantic corpus.
        type: string
        default: "opensoft"
      worker-data-boundary:
        description: Required data-boundary attestation for the semantic corpus.
        type: string
        default: "opensoft-internal"
      worker-handling-class:
        description: Required worker handling authorization.
        type: string
        default: "internal-governance"
      worker-heartbeat-max-age-seconds:
        description: Maximum accepted readiness heartbeat age.
        type: number
        default: 300
      readiness-only:
        description: >-
          Run the real fail-closed readiness evaluation (runner group +
          authenticated Hermes heartbeat) as if the worker were enabled,
          while structurally disabling analysis dispatch, the inline
          fallback, and every finalize side effect. Lets operators prove
          the runner/heartbeat pair with OMNIGENT_WORKER=false.
        type: boolean
        default: false
      catalog-baseline:
        description: >-
          Force baseline-shard mode for the document-cataloger this run,
          regardless of catalog_baseline.is_baseline_complete() state (an
          operator escape hatch; normal baseline progress happens
          automatically across scheduled runs until complete). Full
          baseline-mode behavior lands with feature task T014 (US2); this
          input is plumbed through now so US1's bundle-build step can
          reference it without a later YAML change.
        type: boolean
        default: false
      catalog-scope:
        description: >-
          Optional manual override of the document-cataloger's incremental
          selection scope (e.g. a single repository); empty means "let
          cataloger.select() decide from the inventory diff as usual."
        type: string
        default: ""
      organizer-manual-ideas:
        description: >-
          Optional space-separated Idea IDs (XFI-YYYY-NNN) to request a bounded
          ideation-organizer review this run, in addition to the ideas the
          deterministic selector qualifies automatically (the "manual requests"
          trigger). Empty reviews qualifying inputs only.
        type: string
        default: ""
      neutrality-drift:
        description: >-
          Run the neutrality-drift lane (add-neutrality-drift-lane): the
          deterministic stage-1 pre-filter over the pinned xFactories/*
          domain repos plus the bounded model scout over its survivors.
          Default on (opt-out input); with no omnigent worker host the
          lane records a graceful skip note and stage-1 counts only.
        type: boolean
        default: true
      neutrality-baseline:
        description: >-
          Optional domain repo name (e.g. MedxFactory) for a one-time
          manual FULL neutrality sweep of that repo, ignoring its recorded
          baseline marker; the lane records a fresh baseline marker when
          the sweep queue drains. Empty means incremental as usual.
        type: string
        default: ""
    secrets:
      XFACTORY_APP_ID:
        description: App ID of the openxFactory GitHub App (factory identity).
        required: false
      XFACTORY_APP_PRIVATE_KEY:
        description: Private key of the openxFactory GitHub App.
        required: false
      SUBMODULE_TOKEN:
        description: >-
          Fallback PAT able to read the pinned family repos; used only when
          the app credentials are absent.
        required: false
      ANTHROPIC_API_KEY:
        description: >-
          Inline-fallback model key, used only when no omnigent worker host
          is registered (OMNIGENT_WORKER unset). The dispatch path needs no
          model secret — the workstation's claude persona login is the
          credential. Absent both, the sweep is recorded as skipped.
        required: false
      HERMES_READINESS_TOKEN:
        description: >-
          Read-only control-plane token used by hosted readiness to fetch the
          sanitized worker heartbeat. It has no repository authority.
        required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      HAS_APP_KEY: ${{ secrets.XFACTORY_APP_PRIVATE_KEY != '' }}
    outputs:
      # vars resolves against the caller repo: set OMNIGENT_WORKER=true on
      # opensoft/xFactory only after readiness publication is operational.
      omnigent: ${{ vars.OMNIGENT_WORKER == 'true' }}
      dispatched: ${{ steps.dispatch.outputs.dispatched || 'false' }}
      worker_reason: ${{ steps.dispatch.outputs.reason || steps.readiness.outputs.reason }}
      correlation_id: ${{ steps.readiness.outputs.correlation_id }}
      catalog_dispatched: ${{ steps.catalog-dispatch.outputs.dispatched || 'false' }}
      catalog_worker_reason: ${{ steps.catalog-dispatch.outputs.reason || steps.catalog-readiness.outputs.reason }}
      catalog_correlation_id: ${{ steps.catalog-readiness.outputs.correlation_id }}
      organizer_dispatched: ${{ steps.organizer-dispatch.outputs.dispatched || 'false' }}
      organizer_worker_reason: ${{ steps.organizer-dispatch.outputs.reason || steps.organizer-readiness.outputs.reason }}
      organizer_correlation_id: ${{ steps.organizer-readiness.outputs.correlation_id }}
    steps:
      - name: Mint xFactory app token
        id: app-token
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.XFACTORY_APP_ID }}
          private-key: ${{ secrets.XFACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Rewrite ssh submodule URLs for token auth
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
        env:
          TOKEN: ${{ steps.app-token.outputs.token || secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/checkout@v4
      # WHY A SECOND TOKEN, AND WHY IT IS DERIVED. An App INSTALLATION token is
      # scoped to exactly ONE installation, and the mint above asks for
      # `owner: ${{ github.repository_owner }}` — the caller's organization.
      # Since aggregation commit 0c6ea39 ("Repoint the Medx submodules at
      # MedxSoft, where they now live", 2026-08-26) the governed submodule set
      # SPANS ORGANIZATIONS, so that one token cannot clone all of it: the
      # nightly died at "Init governed submodules only" with `fatal: repository
      # 'https://github.com/MedxSoft/MedxEHR.git/' not found` (opensoft/xFactory
      # runs 33038056012 on 2026-08-27 and 33143248243 on 2026-08-28; the
      # 2026-08-26 15:43 run, before the repoint, passed). The message reads
      # like a deleted repository and is really a token minted for the wrong
      # installation — the App IS installed on the other organization
      # (installation 157085693, all repositories, contents: write); it only
      # ever lacked a token of its own.
      #
      # THE OWNER IS READ FROM `.gitmodules`, NEVER NAMED HERE. `.gitmodules` is
      # the only authority on where a submodule lives, so a hardcoded
      # organization would rot at the next repoint and would stay silent when a
      # THIRD organization appeared. More than one foreign owner therefore FAILS
      # the run instead of guessing, because `create-github-app-token` takes one
      # `owner` per step and a second pair has to be written by hand.
      - name: Detect foreign submodule owners
        id: foreign-owner
        env:
          SELF_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # The SAME governed filter the init step below applies, so the two can
          # never disagree about which submodules a token has to reach.
          GOVERNED='^(openxFactory|xFactories/)'
          MODULES=$(git config --file .gitmodules --get-regexp 'submodule\..*\.path' || true)
          FOREIGN=""
          while read -r key path; do
            [ -n "${path:-}" ] || continue
            printf '%s\n' "$path" | grep -qE "$GOVERNED" || continue
            name=${key#submodule.}
            name=${name%.path}
            url=$(git config --file .gitmodules --get "submodule.${name}.url" || true)
            owner=$(printf '%s\n' "$url" | sed -nE \
              -e 's#^git@github\.com:([^/]+)/.+$#\1#p' \
              -e 's#^https://github\.com/([^/]+)/.+$#\1#p')
            if [ -z "$owner" ]; then
              echo "::warning::no GitHub owner could be read from submodule '${path}' url '${url}'; leaving it to the org-wide rewrite"
              continue
            fi
            echo "governed submodule ${path} -> owner ${owner}"
            if [ "$owner" != "$SELF_OWNER" ]; then
              FOREIGN="${FOREIGN}${owner}"$'\n'
            fi
          done <<< "$MODULES"
          UNIQUE=$(printf '%s' "$FOREIGN" | sed '/^$/d' | sort -u)
          COUNT=$(printf '%s\n' "$UNIQUE" | grep -c . || true)
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::the governed submodules span $COUNT foreign owners ($(printf '%s' "$UNIQUE" | tr '\n' ' ')) but actions/create-github-app-token mints ONE owner per step; extend this workflow with a mint+rewrite pair per foreign owner"
            exit 1
          fi
          if [ "$COUNT" -eq 1 ]; then
            echo "has_foreign=true" >> "$GITHUB_OUTPUT"
            echo "foreign_owner=${UNIQUE}" >> "$GITHUB_OUTPUT"
            echo "foreign submodule owner ${UNIQUE} needs its own installation token"
          else
            echo "has_foreign=false" >> "$GITHUB_OUTPUT"
            echo "foreign_owner=" >> "$GITHUB_OUTPUT"
            echo "every governed submodule lives in ${SELF_OWNER}; the org-wide rewrite suffices"
          fi
      - name: Mint app token for the foreign submodule owner
        id: foreign-app-token
        # NO `|| github.token` FALLBACK, deliberately: if the App is not
        # installed on that organization this step fails loudly, which is a far
        # better diagnosis than the "Repository not found" the init printed for
        # two nights.
        if: env.HAS_APP_KEY == 'true' && steps.foreign-owner.outputs.has_foreign == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.XFACTORY_APP_ID }}
          private-key: ${{ secrets.XFACTORY_APP_PRIVATE_KEY }}
          owner: ${{ steps.foreign-owner.outputs.foreign_owner }}
      # LONGEST PREFIX WINS, so the org-wide rewrite above STAYS. Git resolves
      # `insteadOf` by the LONGEST matching left-hand side, and
      # `git@github.com:<owner>/` is longer than `git@github.com:` — this
      # narrows the earlier rewrite for exactly that owner's submodules and
      # leaves every other governed submodule on the caller-org token. Removing
      # the broad rewrite would strand every same-org submodule instead.
      - name: Rewrite foreign-owner submodule URLs
        if: env.HAS_APP_KEY == 'true' && steps.foreign-owner.outputs.has_foreign == 'true'
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/${OWNER}/".insteadOf "git@github.com:${OWNER}/"
        env:
          TOKEN: ${{ steps.foreign-app-token.outputs.token }}
          OWNER: ${{ steps.foreign-owner.outputs.foreign_owner }}
      - name: Init governed submodules only
        run: |
          SUBS=$(git config --file .gitmodules --get-regexp 'submodule\..*\.path' \
                 | awk '{print $2}' | grep -E '^(openxFactory|xFactories/)')
          git submodule update --init $SUBS
          # The NESTED neutral-product gitlink, one level down and scoped by
          # name. `openxFactory/openXwallet` is a submodule OF a submodule, so
          # the filter above cannot reach it — it reads the aggregation's own
          # `.gitmodules`, which declares `openxFactory` and nothing below it.
          # NOT `--recursive`, which would additionally pull
          # `installs/omnigent-install` and every domain's nested submodules
          # into every aggregation doc-health run.
          #
          # GUARDED on the nested `.gitmodules` actually declaring it, because
          # the aggregation's openxFactory pin and openxFactory's own gitlink
          # land in different pull requests (P4 after P3): before that bump the
          # init has nothing to do and an unguarded invocation would fail the
          # nightly for the ordering rather than for a defect.
          if git -C openxFactory config --file .gitmodules \
               --get submodule.openXwallet.path >/dev/null 2>&1; then
            git -C openxFactory submodule update --init openXwallet
          else
            echo "openxFactory declares no openXwallet gitlink at this pin; skipping the nested init"
          fi
      - name: Verify openXwallet root-gitlink parity
        # split-openxwallet-repo task 9.4 / design D11. THIS IS THE ONLY CI THAT
        # INITIALIZES BOTH GITLINKS, which is why the check is invoked here and
        # not from openxFactory's own consumer gate: the invariant is
        # root-gitlink-equals-nested-gitlink, and openxFactory alone cannot see
        # the aggregation's root gitlink at all.
        #
        # ONE IMPLEMENTATION, ONE REFUSAL VOCABULARY: this is a MODE of
        # openxFactory's own verifier (`--aggregation-root`), not a second
        # script in xFactory, which has no validator convention of its own and
        # would drift a duplicate refusal set. `verify()` runs first inside the
        # tool and pins the nested gitlink, the nested checkout and the eight
        # digests to the pin's commit; `verify_aggregation` then requires the
        # aggregation's OWN gitlink to record that same commit. Every failure
        # exits 2 and fails this job, which fails the whole reusable call.
        #
        # IN `prepare` AND NOT IN `finalize`, once: prepare runs first and its
        # failure fails the call, so a second invocation would only cost a
        # second place for the guard to drift.
        #
        # NO EXTRA SUBMODULE INIT IS NEEDED and that is a property of the check,
        # not an omission: `verify_aggregation` reads the RECORDED gitlink
        # through `git ls-tree HEAD` / `git ls-files -s`, which answer from the
        # commit and the index without any checkout. The root `openXwallet/`
        # working tree is never read here, so the governed-submodule init above
        # is deliberately left alone rather than widened — widening it would add
        # `openAvatar`'s Flutter monorepo to every nightly for no check that
        # reads it. That becomes false the day a CI auth strategy for `nlm`
        # lands and `notebook-projection-drift` stops being skipped, because
        # that family DOES sweep a root product's documents; the sweep prints a
        # named WARN for a pinned-but-empty root product rather than reporting
        # it as document-free, so the day it matters it says so out loud.
        #
        # GUARDED ON THE NESTED DECLARATION, exactly as the init above is, and
        # for the same ordering reason: the aggregation's openxFactory pin bump
        # and its own root gitlink land in ONE pull request (P4), so before that
        # bump there is nothing to compare and an unguarded invocation would
        # fail the nightly for a deploy ordering rather than for a defect.
        # AFTER the bump the guard is satisfied and the check is fail-closed:
        # an aggregation whose openxFactory consumes openXwallet but which
        # records no root gitlink refuses as `pin-member-missing`, because a
        # consumer that stops carrying the pin is not passing, it is not
        # participating.
        run: |
          if git -C openxFactory config --file .gitmodules \
               --get submodule.openXwallet.path >/dev/null 2>&1; then
            python3 openxFactory/scripts/verify-openxwallet-pin.py \
              --aggregation-root .
          else
            echo "openxFactory declares no openXwallet gitlink at this pin; skipping the root-gitlink parity check"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install suite dependencies
        # run_suite() below runs preflight too (--family is not passed, so
        # only_family is None): same OpsxFactory `make validate` dependency
        # as the finalize job's install step, kept in sync with it.
        run: pip install pyyaml "cryptography>=41,<46"
      - name: Build semantic sweep bundle
        if: inputs.readiness-only != true
        env:
          SKIP_FAMILIES_INPUT: ${{ inputs.skip-families }}
        run: |
          PREV_INV="$(ls health/inventory/[0-9]*.json 2>/dev/null | sort | tail -1 || true)"
          SKIPS=()
          if [ -n "$SKIP_FAMILIES_INPUT" ]; then
            read -r -a SKIP_VALUES <<< "$SKIP_FAMILIES_INPUT"
            for family in "${SKIP_VALUES[@]}"; do
              SKIPS+=(--skip-family "$family")
            done
          fi
          python3 openxFactory/scripts/doc-health.py \
            --repo-root . \
            "${SKIPS[@]}" \
            ${PREV_INV:+--previous-inventory "$PREV_INV"} \
            --semantic-prepare sweep-bundle
      - uses: actions/upload-artifact@v4
        if: inputs.readiness-only != true
        with:
          name: semantic-sweep-bundle
          path: sweep-bundle
      - name: Build document catalog bundle
        # Deterministic-first (FR-001/FR-002): --catalog-prepare runs the
        # full 13-family suite (including the document-catalog family) and
        # computes the mechanical entries/diff before this step's shard
        # bundle is even built, so nothing here can race ahead of that pass.
        # The durable, committed snapshot write happens once, unconditionally,
        # from "Run doc-health suite" below (scripts/doc_health/
        # catalog_dispatch.py's prepare_catalog_bundle docstring explains why
        # this step itself never calls catalog.write_snapshot).
        if: inputs.readiness-only != true
        env:
          CATALOG_BASELINE_INPUT: ${{ inputs.catalog-baseline }}
          CATALOG_SCOPE_INPUT: ${{ inputs.catalog-scope }}
        run: |
          BASELINE=()
          [ "$CATALOG_BASELINE_INPUT" = "true" ] && BASELINE=(--catalog-baseline)
          SCOPE=()
          if [ -n "$CATALOG_SCOPE_INPUT" ]; then
            SCOPE=(--catalog-scope "$CATALOG_SCOPE_INPUT")
          fi
          python3 openxFactory/scripts/doc-health.py \
            --repo-root . \
            "${BASELINE[@]}" "${SCOPE[@]}" \
            --catalog-prepare catalog-bundle
      - uses: actions/upload-artifact@v4
        if: inputs.readiness-only != true
        with:
          name: document-catalog-bundle
          path: catalog-bundle
      - name: Evaluate hosted worker readiness
        id: readiness
        env:
          WORKER_ENABLED: ${{ vars.OMNIGENT_WORKER == 'true' }}
          READINESS_ONLY: ${{ inputs.readiness-only == true }}
          HERMES_READINESS_URL: ${{ vars.HERMES_READINESS_URL }}
          HERMES_WORKER_ID: ${{ vars.OMNIGENT_WORKER_ID }}
          HERMES_READINESS_TOKEN: ${{ secrets.HERMES_READINESS_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REQUIRED_TENANT: ${{ inputs.worker-tenant-boundary }}
          REQUIRED_DATA_BOUNDARY: ${{ inputs.worker-data-boundary }}
          REQUIRED_HANDLING: ${{ inputs.worker-handling-class }}
          MAX_AGE: ${{ inputs.worker-heartbeat-max-age-seconds }}
        run: |
          GROUP="xfactory-artifact-workers"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          # Readiness-only mode probes and evaluates as if enabled; the
          # dispatch step below is separately and unconditionally guarded.
          PROBE="$WORKER_ENABLED"
          [ "$READINESS_ONLY" = "true" ] && PROBE="true"
          QUERY_ERROR=""
          : > runners-api.json
          if [ "$PROBE" = "true" ]; then
            GROUP_ID=""
            if gh api --paginate --slurp \
                "orgs/${OWNER}/actions/runner-groups?per_page=100" \
                > runner-groups-api.json 2>/dev/null; then
              GROUP_ID="$(python3 - "$GROUP" <<'PY'
          import json
          import sys
          try:
              pages = json.load(open("runner-groups-api.json", encoding="utf-8"))
              if not isinstance(pages, list):
                  raise ValueError("runner group pages must be an array")
              groups = []
              for page in pages:
                  if not isinstance(page, dict) or not isinstance(
                          page.get("runner_groups"), list):
                      raise ValueError("runner group page is malformed")
                  groups.extend(page["runner_groups"])
              print(next((item.get("id") for item in groups
                          if isinstance(item, dict)
                          and item.get("name") == sys.argv[1]
                          and isinstance(item.get("id"), int)), ""))
          except (OSError, json.JSONDecodeError, AttributeError, ValueError):
              print("")
          PY
              )"
            else
              QUERY_ERROR="runner_group_query_failed"
            fi
            if [ -n "$GROUP_ID" ]; then
              gh api --paginate --slurp \
                "orgs/${OWNER}/actions/runner-groups/${GROUP_ID}/runners?per_page=100" \
                > runners-api.json 2>/dev/null || QUERY_ERROR="runner_query_failed"
            elif [ -z "$QUERY_ERROR" ]; then
              QUERY_ERROR="runner_group_query_failed"
            fi
          fi
          python3 - "$GROUP" "$QUERY_ERROR" <<'PY'
          import json
          from pathlib import Path
          import sys
          group, error = sys.argv[1:]
          try:
              pages = json.loads(Path("runners-api.json").read_text() or "[]")
              if not isinstance(pages, list):
                  raise ValueError("runner response must be an array")
              runners = []
              for page in pages:
                  if not isinstance(page, dict) or not isinstance(
                          page.get("runners"), list):
                      raise ValueError("runner response page is malformed")
                  runners.extend(page["runners"])
          except (json.JSONDecodeError, ValueError):
              runners, error = [], error or "invalid_runner_response"
          Path("runner-group.json").write_text(json.dumps({
              "group": group, "query_error": error,
              "runners": runners,
          }))
          PY
          if [ "$PROBE" = "true" ] && \
             [ -n "$HERMES_READINESS_URL" ] && \
             [ -n "$HERMES_WORKER_ID" ]; then
            AUTH=()
            [ -n "$HERMES_READINESS_TOKEN" ] && \
              AUTH=(-H "Authorization: Bearer ${HERMES_READINESS_TOKEN}")
            if curl --fail --silent --show-error \
                 "${AUTH[@]}" \
                 "${HERMES_READINESS_URL%/}/api/readiness/workers/${HERMES_WORKER_ID}" \
                 > hermes-worker.json; then
              if ! python3 - <<'PY'
          import json
          from pathlib import Path
          response = json.load(open("hermes-worker.json", encoding="utf-8"))
          if not isinstance(response, dict):
              raise ValueError("readiness response must be an object")
          worker = response.get("worker", {})
          if not isinstance(worker, dict):
              raise ValueError("readiness worker must be an object")
          metadata = worker.get("metadata", {})
          heartbeat = dict(metadata) if isinstance(metadata, dict) else {}
          heartbeat.setdefault("host_id", worker.get("id"))
          heartbeat.setdefault("observed_at", worker.get("last_seen_at"))
          heartbeat["status"] = worker.get("status")
          heartbeat["current_jobs"] = worker.get("current_jobs")
          Path("heartbeat.json").write_text(json.dumps(heartbeat),
                                              encoding="utf-8")
          PY
              then
                printf '%s\n' '{"query_error":"invalid_heartbeat_response"}' \
                  > heartbeat.json
              fi
            else
              printf '%s\n' '{"query_error":"heartbeat_query_failed"}' \
                > heartbeat.json
            fi
          else
            printf '%s\n' '{"query_error":"heartbeat_endpoint_unconfigured"}' \
              > heartbeat.json
          fi
          ENABLED=()
          [ "$PROBE" = "true" ] && ENABLED=(--enabled)
          python3 scripts/check-worker-readiness.py \
            --runner-group runner-group.json \
            --heartbeat heartbeat.json \
            "${ENABLED[@]}" \
            --required-group "$GROUP" \
            --required-label self-hosted \
            --required-label artifact-only \
            --required-label doc-analysis \
            --required-profile doc-analysis-worker \
            --required-profile-version 1 \
            --required-tenant "$REQUIRED_TENANT" \
            --required-data-boundary "$REQUIRED_DATA_BOUNDARY" \
            --required-handling "$REQUIRED_HANDLING" \
            --required-policy-version artifact-worker-v1 \
            --max-age-seconds "$MAX_AGE" \
            --output readiness.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          # FAIL-CLOSED OUTPUT EMISSION (adversarial review 2026-07-26, informational
          # finding 5a -- the same class as the aggregation approval workflow's
          # `reason=$REASON`). `$GITHUB_OUTPUT` is a newline-delimited key=value file and
          # the LAST write of a key WINS, so any value carrying a newline can append its
          # own `ready=true` line AFTER the verdict below and flip this gate open --
          # `ready` is written FIRST, so the injected line is the one that counts.
          # Neither `reason` nor `dispatch_label` is produced by this workflow:
          # `dispatch_label` is echoed out of the REMOTE Hermes heartbeat, through an
          # evaluator this repository does not own (the caller's
          # scripts/check-worker-readiness.py). They are therefore not trusted to be
          # single-line here. A value that cannot be rendered on one line is REFUSED,
          # never escaped or truncated: the step emits ready=false with a naming reason
          # and nothing else, so a malformed or hostile evaluator result can only ever
          # WITHHOLD the dispatch, never authorise one. `ready` must be a real JSON
          # boolean for the same reason -- a string "true" is not a verdict.
          def one_line(value):
              text = "" if value is None else str(value)
              return None if ("\n" in text or "\r" in text) else text
          try:
              value = json.load(open("readiness.json", encoding="utf-8"))
              if not isinstance(value, dict):
                  raise ValueError("readiness result must be an object")
              ready = value["ready"]
              reason = one_line(value["reason"])
              label = one_line(value.get("dispatch_label", ""))
          except (OSError, KeyError, TypeError, ValueError):
              ready, reason, label = None, None, None
          if ready is not True and ready is not False:
              ready, reason, label = False, "readiness_output_unusable", ""
          elif reason is None or label is None:
              ready, reason, label = False, "readiness_output_unsafe", ""
          print(f"ready={str(ready).lower()}")
