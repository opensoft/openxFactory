    permissions:
      actions: write
      contents: write
      issues: write
      # pull-requests: write is required by the "Commit report" step: since
      # org ruleset 18962101 (PR + 1 approval, OrgAdmin-only bypass) protects
      # the default branch, the nightly can no longer push reports directly —
      # it delivers them through a rolling PR instead. Callers must grant the
