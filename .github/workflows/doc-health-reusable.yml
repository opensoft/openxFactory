            [ -e "$sub/.git" ] || continue
            if git -C "$sub" fetch --no-tags --quiet origin \
                 "+refs/heads/main:refs/remotes/origin/main"; then
              echo "live main fetched: $sub $(git -C "$sub" rev-parse --short=12 origin/main)"
            else
              echo "no live main for $sub — the family reports the fall-back"
            fi
          done
      - name: Run doc-health suite
