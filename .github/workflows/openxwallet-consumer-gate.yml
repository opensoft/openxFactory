# The openxWallet CONSUMER gate: openxFactory no longer owns the wallet
# standard, so this gate initializes the pinned `openXwallet` gitlink, refuses
# to proceed unless the pin verifies, and then runs the PINNED reader over
# openxFactory's own tree.
#
# SUCCESSOR TO `wallet-validation.yml`, WHICH THIS FILE REPLACES BY ALIAS.
# REQUIRED since 2026-08-26: org ruleset 21538893 ("openxFactory wallet-gate")
# requires the check `wallet-validation` on the default branch. That token is
# the JOB ID, never the filename — so the file is renamed and
# `jobs: wallet-validation:` below is RETAINED unchanged. Ruleset 21538893 is
# edited by nothing in this wave; the token reports on this pull request's own
# head from this new file, and no operator act stands between the shed and its
# merge. Both alternatives are unmergeable and are named here so neither is
# re-proposed: deleting the old workflow first means the required token never
# reports on the pull request that removes it, and repointing the ruleset first
# fails because a check is not selectable until a workflow has reported under it
# once. Renaming the TOKEN to `openxwallet-consumer-gate` is a named SUCCESSOR,
# not part of this change.
#
# The job carries no display name on purpose: the status check must surface as
# exactly `wallet-validation`, the literal token the ruleset pins; a distinct job
# display name silently de-advises the gate.
#
# WHY AN APP TOKEN AND NOT `github.token`. `opensoft/openXwallet` is a SECOND,
# PRIVATE org repository, and `github.token` is scoped to this repository alone.
# `.gitmodules` deliberately keeps `git@github.com:` — openXwallet is private, so
# an anonymous HTTPS clone fails and a token is needed either way, while an HTTPS
# URL would make every human clone prompt for credentials instead of using the
# operator's key. The house pattern (`doc-health-reusable.yml`, prepare job:
# `Mint xFactory app token` → `Rewrite ssh submodule URLs for token auth` →
# `Init governed submodules only`) is therefore adopted: mint an App token,
# then rewrite the SSH URL to a token URL with `insteadOf` BEFORE checkout.
# The SECRET NAMES differ from that file's on
# purpose: the org secret `XFACTORY_APP_ID` is visibility-`selected` and
# openxFactory is not among its repositories, while this repository already holds
# `OPENXFACTORY_APP_ID` / `OPENXFACTORY_APP_PRIVATE_KEY` for the content App
# (App 4253636, installation 145372182, `repository_selection: all`), which
# reaches every repository in the organization including openXwallet.
#
# WHY A SCOPED INIT AND NOT `submodules: true`. A blanket init would also fetch
# `installs/omnigent-install`, which nothing in this gate reads. `--recursive` is
# rejected for the same reason one level down. This wave's init is deliberately
# scoped, which is why the remediation trailer every refusal prints says
# `--init openXwallet` and not `--init --recursive`.
name: openxwallet-consumer-gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  wallet-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The house guard (`doc-health-reusable.yml:125`). If the App key is
      # absent the mint is SKIPPED rather than erroring on an empty app-id, the
      # token expression falls back, and the scoped init then fails on the
      # PRIVATE nested repository — a red gate with a legible cause. Falling back
      # is not a pass: without a token the pin cannot be verified, and this gate
      # refuses rather than proceeding on an unverifiable reader.
      HAS_APP_KEY: ${{ secrets.OPENXFACTORY_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint openxFactory app token
        id: app-token
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.OPENXFACTORY_APP_ID }}
          private-key: ${{ secrets.OPENXFACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Rewrite ssh submodule URLs for token auth
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
        env:
          TOKEN: ${{ steps.app-token.outputs.token || github.token }}

      - uses: actions/checkout@v4

      - name: Init the openXwallet gitlink only
        run: git submodule update --init openXwallet

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml jsonschema rfc3339-validator

      # FIRST, before anything pinned is trusted. Six ordered checks, and every
      # refusal exits 2 with a named code and the one fixed remediation trailer.
      - name: Verify the openXwallet pin
        run: python3 scripts/verify-openxwallet-pin.py

      - run: python3 openXwallet/scripts/wallet-yaml-syntax-gate.py .

      # THE LITERAL INVOCATION, pinned by
      # `tests/openxwallet_consumer_gate/test_gate_invocation.py`. The argument
      # must be PRESENT and equal to `.`: `main()` runs `repo_scan` only
      # `if args.path is not None`, and `repo_scan` reads the intake register
      # only `if sweep`, where `sweep = target.is_dir()`. A missing or
      # file-valued argument is a green check that opened no register. No
      # `--strict`, unchanged from `wallet-validation.yml:34`.
      #
      # `shell: bash` is declared so the step runs under `-o pipefail`: the
      # default shell does not set it, and without it `tee` would return 0 over
      # a failing validator and the gate would pass while refusing nothing.
      - name: Run the pinned validator over openxFactory's own tree
        shell: bash
        run: python3 openXwallet/scripts/validate-openxwallet.py . | tee wallet-gate.log

      # THE ASSERTION IS POSITIVE, and it needs no edit to the pinned code. On
      # the happy path `check_register` emits no finding — the only lines naming
      # the register are its failures — so the proof that the register was
      # OPENED is the conjunction the validator DOES produce: the `repo scan:`
      # note (the sweep ran) AND `wallet-v1.1`'s `intake register read:` NOTE
      # (the register resolved) AND the absence of both the
      # `no intake register at this tree` note and every `register-*` finding
      # code. A green check that proves no register was opened is a vacuous
      # pass, which is the whole class of defect this step exists to close.
      - name: Assert the intake register was actually read
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          grep -qE '^note  repo scan: [0-9]+ openxWallet artifact' wallet-gate.log \
            || fail "the gate log carries no 'repo scan:' note — the whole-tree sweep did not run, so nothing was adjudicated and no register could have been opened"
          grep -qE '^note  intake register read: governance/review-authority/register\.yaml \([0-9]+ row\(s\)\)$' wallet-gate.log \
            || fail "the gate log carries no 'intake register read: governance/review-authority/register.yaml' NOTE — the pinned reader did not resolve openxFactory's intake register at the scan target"
          ! grep -q 'no intake register at this tree' wallet-gate.log \
            || fail "the gate log says 'no intake register at this tree' — the scan target was not the openxFactory root, so review authority was adjudicated against nothing"
          ! grep -qE '\[register-[a-z-]+\]' wallet-gate.log \
            || fail "the gate log carries a register-* finding; see the validator output above"
          # wallet-v1.2 (openXwallet `add-per-seat-register-entries`): the
          # per-seat council signing keys were ADJUDICATED, not merely parsed.
          #
          # The number is the evidence and the word "adjudicated" is why: the
          # pinned reader excludes every entry it refused from this count, so
          # `8 of 8` can only be emitted on a run that stood behind all eight
          # keys. Asserting the note's PRESENCE alone would be satisfied by a
          # register that records none of them — the reader notes THAT case with
          # a different line, deliberately — and asserting a parsed count would
          # prove parsing, which is the class this whole step exists to close.
          #
          # The count is LITERAL, not `[0-9]+`. EIGHT seats are minted and
          # recorded — merge-readiness's four (2026-08-28) plus gate-rules'
          # four (`register-gate-rules-council-seats` task 3.7) — and a ninth
          # arriving, or one going missing, must break this gate and be a
          # deliberate edit here beside the register edit, not a silent pass
          # under a wildcard.
          #
          # MOVED FROM `4 of 4` IN THE SAME ACT that wrote the second body's
          # row and seat entries, which is the mint runbook's §0.1.4
          # precondition: "Every count the consuming gate asserts is LITERAL …
          # move them in the same act, or the REQUIRED check goes red on a
          # human-only surface."
          grep -qE '^note  intake register: 8 of 8 per-seat signing key\(s\) adjudicated and resolved$' wallet-gate.log \
            || fail "the gate log does not say the eight per-seat council signing keys were ADJUDICATED (8 of 8); the register's seat_keys surface was not read, or an entry was refused, or the pinned reader predates wallet-v1.2"
          ! grep -q 'no per-seat signing key is recorded' wallet-gate.log \
            || fail "the gate log says no per-seat signing key is recorded — the register lost its seat_keys surface, and a Hermes projection derived from it could authorize no seat"
          # wallet-v1.3 (openXwallet `add-multi-key-wallets`): the WALLET now
          # DECLARES those four seat keys, and a green gate must prove the
          # declaration was adjudicated.
          #
          # WHY THIS IS A SEPARATE ASSERTION FROM THE ONE ABOVE. The register
          # recording a key and the wallet declaring it are different facts, and
          # only the second one satisfies the pinned validator's rule (r): a
          # presenting key no wallet declares is refused, which is exactly what
          # would have happened to the first exercise record hermes-install
          # writes carrying a per-seat `key_id`. A gate that proved only the
          # register half would go green on a tree where every convening's
          # exercise record is unrepresentable.
          #
          # The COUNT is literal and the WALLET ID is named. The reader emits
          # this note only for a wallet whose declared set has more than one
          # member, and it names the ids it stood behind — so five is the whole
          # set (one operator-vaulted root plus four CI-resident seats) and a
          # sixth arriving, or one going missing, must break this gate and force
          # a deliberate edit here beside the wallet edit.
          grep -qE "^note  wallet 'wal-agent-mrc-0001': 5 declared key\(s\) adjudicated " wallet-gate.log \
            || fail "the gate log does not say wal-agent-mrc-0001's FIVE declared keys were adjudicated; the wallet lost its keys: block, or an entry was refused, or the pinned reader predates wallet-v1.3 — in any of which cases rule (r) refuses every exercise record naming a per-seat key"
          # THE SECOND BODY'S WALLET, asserted SEPARATELY and not by widening
          # the line above. The mint runbook's §4 says so in terms: "add one
          # for the new wallet, do not widen the existing one" — a single
          # assertion covering either wallet would go green on a tree that
          # lost one of them, which is the class this step exists to close.
          # Five again: one operator-vaulted root (`key-grc-0001`) plus four
          # CI-resident seat keys.
          grep -qE "^note  wallet 'wal-agent-grc-0001': 5 declared key\(s\) adjudicated " wallet-gate.log \
            || fail "the gate log does not say wal-agent-grc-0001's FIVE declared keys were adjudicated; the gate-rules wallet lost its keys: block, or an entry was refused, or the pinned reader predates wallet-v1.3 — in any of which cases rule (r) refuses every exercise record naming a gate-rules per-seat key"
          echo "register-read conjunction holds:"
          grep -E "^note  (repo scan:|intake register read:|intake register: |wallet 'wal-agent-mrc-0001':|wallet 'wal-agent-grc-0001':)" wallet-gate.log

      # ---------------------------------------------------------------------
      # THE FACTORY-IDENTITY REGISTER, read inside the SAME REQUIRED check.
      #
      # Task 2.6 of the ratified change `add-cpc-clearing-boundary`. The reader
      # is an openxFactory file, not a pinned one, because the register it reads
      # is an openxFactory artifact with no contract schema (design D3) — but it
      # DERIVES NOTHING OF ITS OWN: every public-key decoding and every
      # fingerprint in it comes from the pinned openXwallet reader initialized
      # above, imported rather than copied, and it REFUSES rather than falling
      # back to arithmetic of its own when the gitlink is absent. That is why
      # this step runs AFTER the scoped init and after the pin is verified.
      #
      # WHY IT IS HERE AND NOT IN ITS OWN WORKFLOW. `wallet-validation` is the
      # REQUIRED token (org ruleset 21538893). A second workflow would be
      # advisory until an operator marked it required, and a register whose
      # reader is advisory confers nothing on the day it matters.
      - name: Read the factory-identity register and check register disjointness
        shell: bash
        run: python3 scripts/validate-factory-identity.py . | tee factory-identity-gate.log

      # THE ASSERTION IS POSITIVE, for the reason the intake assertion above
      # gives: on the happy path the reader emits no finding, so "no
      # factory-identity finding" alone is satisfied by never having opened the
      # register. The conjunction is what proves it ran: the register was READ,
      # its active rows were COUNTED, and the disjointness rule was ADJUDICATED
      # against the review-authority tree with a literal count of shared
      # identifiers.
      #
      # THE COUNTS ARE LITERAL, NOT `[0-9]+`. One originating repository is
      # registered today. A second arriving, or the first going missing, must
      # break this gate and be a deliberate edit here beside the register edit —
      # a wildcard would let a register that lost its only row pass the positive
      # assertion and confer nothing.
      - name: Assert the factory-identity register was actually read
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          grep -qE '^note  factory-identity register read: governance/factory-identity/register\.yaml \([0-9]+ row\(s\)\)$' factory-identity-gate.log \
            || fail "the log carries no 'factory-identity register read:' NOTE — the sibling origin register was not opened, so an origin signature would be verified against nothing"
          grep -qE '^note  factory-identity register: 1 active origin row\(s\) over 1 originating repository\(ies\)$' factory-identity-gate.log \
            || fail "the log does not say ONE active origin row over ONE originating repository; the register lost its row, or a second originator arrived without a deliberate edit to this gate beside it"
          grep -qE '^note  factory-identity: disjointness holds against governance/review-authority/ \([0-9]+ identifier\(s\) here, [0-9]+ identifier\(s\) there, 0 shared\)$' factory-identity-gate.log \
            || fail "the log does not record the disjointness rule ADJUDICATED with zero shared identifiers; the ratified requirement's whole enforceable half did not run, or it found an overlap"
          ! grep -qE '\[factory-identity-[a-z-]+\]' factory-identity-gate.log \
            || fail "the log carries a factory-identity-* finding; see the reader output above"
          echo "factory-identity register-read conjunction holds:"
          grep -E '^note  factory-identity' factory-identity-gate.log
