# THE SHORT-CHAIN GATE — a RUNNING check, not a described one.
#
# `add-signed-execution-chain` (ratified 2026-08-29) requires that the
# chain-validating gate exists FROM TRANCHE ONE, validating a SHORT chain, "so
# the refusal path is exercised from the start rather than first tested when it
# matters most" (Brett Heap's Q4 ruling). This workflow is that gate: it runs
# `scripts/validate-signed-execution-chain.py`, which walks links 1-3 over every
# chain record in the tree and self-tests the packaged corpus first.
#
# THIS WORKFLOW IS STILL NOT EVIDENCE THAT THE CHECK IS REQUIRED, and that is
# worth keeping written down now that it IS required. The capability's ninth
# requirement is that until `signed-execution-chain-gate` is REQUIRED in the
# branch ruleset, every record this family defines confers and refuses NOTHING.
# `tasks.md` 4.5 — the OPERATOR act — was performed on 2026-08-31: opensoft org
# ruleset 21957695, `~DEFAULT_BRANCH` of openxFactory, enforcement active,
# `required_status_checks: [signed-execution-chain-gate]`, a dedicated ruleset
# mirroring the wallet-gate precedent (org ruleset 21538893) that
# `add-wallet-carried-review-authority` tasks 2.5/2.6 established. `tasks.md` 4.6
# then SAW it refuse: canary PR #549, run 33455808456, one named refusal,
# pull request BLOCKED, closed unmerged. The evidence is the live ruleset read
# and that canary — never this file. Editing or merging this file changes nothing
# about the ruleset, and deleting the ruleset would leave this file untouched and
# the capability back to conferring nothing.
#
# THE JOB CARRIES NO DISPLAY NAME ON PURPOSE: the status check must surface as
# exactly `signed-execution-chain-gate`, the literal token a branch ruleset would
# pin. A distinct job display name silently de-advises the gate — the same rule
# `openxwallet-consumer-gate.yml` and `pytest-suite.yml` each document for
# themselves.
#
# WHY THE openXwallet GITLINK IS INITIALIZED HERE. Link 1's instrument is the
# SHIPPED `xfactory_wallet_grant_exercise`, carried inside the signed
# ratification, and the reader validates every carried block against the PINNED
# schema rather than against a local restatement of it. Without the gitlink the
# reader falls back to the members this capability restricts and says so — which
# would be a check quietly validating less than it claims. `--require-pinned-wallet-vocabulary`
# turns that fallback into a REFUSAL, so this gate cannot pass vacuously.
#
# WHY NO `--strict`. The reader emits a WARNING for any leaf signed by a key no
# carried wallet declares — a store signing identity this tranche defines no
# custody for — which is a FACT this realization declares rather than a defect,
# and `--strict` would convert the capability's own honest self-report into a red
# gate that could never go green. (It emitted a SECOND standing warning, for as
# long as it was not itself a required check; 4.5 retired that one on 2026-08-31,
# and the reader still emits it for any realization whose declaration records the
# reader unrequired.) Errors fail the step; warnings are printed and read.
name: signed-execution-chain-gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  signed-execution-chain-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # NO MINT, AND NO `HAS_APP_KEY` GUARD — RETIRED 2026-09-11 (runbook 7.6,
      # codexFactory issue #279). A `Mint openxFactory app token` step stood here
      # minting this repository's content App
      # (`OPENXFACTORY_APP_ID` / `OPENXFACTORY_APP_PRIVATE_KEY`) for the single
      # purpose of authenticating the `openXwallet` gitlink below, guarded by a
      # job-level `HAS_APP_KEY` env so an absent key SKIPPED the mint rather than
      # erroring on an empty app-id (`doc-health-reusable.yml`'s house pattern).
      # Both existed for ONE reason: `opensoft/openXwallet` was a SECOND, PRIVATE
      # org repository and `github.token` is scoped to this repository alone. IT
      # HAS BEEN PUBLIC SINCE 2026-09-07T15:24:11Z — its own flip, two days
      # before openxFactory's — so the default token reads the pinned gitlink
      # like any other public tree. NO SECRET WAS DELETED: the same names are
      # still required by `merge-master-approval.yml`, `review-lane-repin.yml`,
      # `session-open-pr.yml` and `pytest-suite.yml`'s decision-core mint.
      #
      # THE REWRITE BELOW STAYS AND IS STILL LOAD-BEARING. `.gitmodules` spells
      # the gitlink in SSH form (`git@github.com:opensoft/openXwallet.git`) so a
      # human clone uses the operator's key instead of prompting; a runner has no
      # such key, and this `insteadOf` is what makes that URL fetchable over
      # HTTPS at all. Only the credential the rewritten URL carries changed, and
      # `github.token` is exactly what the retired `||` expression already fell
      # back to whenever the App key was absent.
      #
      # THIS FAILS CLOSED, which is why no further fallback is written, and it is
      # what the retired guard's comment was really claiming: without the pinned
      # vocabulary the carried blocks cannot be held to the shapes that own them,
      # so `--require-pinned-wallet-vocabulary` below turns a missing gitlink
      # into a REFUSAL rather than a reader that checks less than it says. If
      # openXwallet is flipped back to private, REVERT this change rather than
      # patching around the failure.
      - name: Rewrite ssh submodule URLs for token auth
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
        env:
          TOKEN: ${{ github.token }}

      - uses: actions/checkout@v4

      # SCOPED, not `--recursive`: a blanket init would also fetch
      # `installs/omnigent-install`, which nothing in this gate reads.
      - name: Init the openXwallet gitlink only
        run: git submodule update --init openXwallet

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml jsonschema rfc3339-validator

      # FIRST, before anything pinned is trusted — the same ordering
      # `openxwallet-consumer-gate.yml` uses. A carved-out copy validated against
      # an unverified pin is a check against bytes nobody vouched for.
      - name: Verify the openXwallet pin
        run: python3 scripts/verify-openxwallet-pin.py

      - name: Walk the short chain over this tree
        shell: bash
        run: |
          python3 scripts/validate-signed-execution-chain.py . \
            --require-pinned-wallet-vocabulary | tee chain-gate.log

      # THE ASSERTION IS POSITIVE, and it needs no edit to the reader. On the
      # happy path the reader emits no finding, so the proof that it actually
      # WALKED anything is the conjunction of the notes it DOES produce: the
      # pinned vocabulary was read (so carried blocks were held to the shipped
      # shapes), the packaged corpus was adjudicated as one coherent scope with
      # every closed refusal code red-proven, and the whole-tree sweep ran. A
      # green check that proves nothing was walked is a vacuous pass, which is
      # the class of defect this step exists to close.
      - name: Assert the gate actually walked something
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          grep -qE '^note  pinned openXwallet vocabulary read from ' chain-gate.log \
            || fail "the gate log carries no 'pinned openXwallet vocabulary read' note — the carried exercise, wallet and attestation blocks were not held to the shipped shapes"
          grep -qE '^note  self-test: [0-9]+ packaged record\(s\) validated' chain-gate.log \
            || fail "the gate log carries no self-test note — the packaged corpus was not adjudicated, so no refusal was exercised"
          grep -qE '[0-9]+/[0-9]+ closed refusal codes red-proven' chain-gate.log \
            || fail "the gate log does not report the red-proven refusal count — a reader whose refusals are never provoked is a reader nobody has seen refuse"
          grep -qE '^note  repo scan \(.*\): [0-9]+ artifact\(s\) checked' chain-gate.log \
            || fail "the gate log carries no 'repo scan:' note — the whole-tree sweep did not run, so no real chain record was adjudicated"
          ! grep -qE '^ERROR \[' chain-gate.log \
            || fail "the gate log carries a refusal; see the reader output above"
