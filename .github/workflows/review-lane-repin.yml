# review-lane-repin — the automated advance of this repository's pinned
# decision core, PROPOSED and never disposed BY ITS OWN ACT.
#
# REALIZES `mirror-floor-regeneration-automation` (ratified 2026-09-06 by Brett
# Heap, verbatim "ratify both when green, then land them"; record
# `openspec/changes/mirror-floor-regeneration-automation/review/ratification-2026-09-06.md`).
# Its parent is codexFactory `add-floor-regeneration-automation`, which
# automates the OTHER half of the same repair.
#
# AMENDED 2026-09-09 IN ONE CLAUSE AND NO OTHER —
# `amend-mirror-floor-regeneration-merge-authority` (ratified 2026-09-08 by
# Brett Heap, verbatim "merge 292 when green, then ratify 807"; openxFactory
# PR #807 -> `6cc06288`; record
# `openspec/changes/amend-mirror-floor-regeneration-merge-authority/review/ratification-2026-09-08.md`).
# The requirement *An automated pin advance only ever proposes* was narrowed
# from "SHALL NOT merge" to "SHALL NOT merge BY ITS OWN ACT", and the lane MAY
# now ARM THE PLATFORM'S AUTO-MERGE on its own pull request — so the merge
# completes only when (a) the merge-master envelope approval for that exact head
# stands and (b) every required check has succeeded. "SHALL NOT approve" is
# untouched. ARMING IS NOT MERGING: `--auto` performs no merge, it records an
# intent the platform executes.
#
# AND IT LANDS INERT, ON A RULING, RATHER THAN QUIETLY (Brett Heap, 2026-09-09,
# verbatim "rule land inert, this lane realizes it"; openxFactory #745 comment
# 5601338925 — `tasks.md` box 1.3). **NO CANDIDATE CLASS ADMITS THIS LANE
# TODAY**: `.github/merge-approval-envelope.yml` enrols only
# `intent-rolling-custody`, so no envelope approval will ever stand for
# `bot/review-lane-repin` and the armed auto-merge cannot complete. The pull
# request therefore waits for exactly the human merge word it waited for
# yesterday, until the enrolment successor
# `admit-review-lane-repin-to-merge-approval-envelope` lands. **That inertness
# is a CONFORMING state the requirement names by itself**, and the lane SAYS SO
# in its own witness line rather than leaving a reader to mistake an armed
# proposal for progress.
#
# WHAT IT REPLACES. Twice on 2026-09-05 a human advanced this pin by hand —
# PR #689 (18:17Z → 18:39Z) and PR #702 (22:08Z → 22:50Z) — and both times the
# act was the same: copy one codexFactory commit id into FOUR places, re-copy
# one document, and recompute two numbers from its bytes. That is a
# transcription, and the pin file says so about itself: its `refresh:` field
# instructs "Re-copy the file ... recompute `sha256`, and update
# `entry_count`. Never hand-edit the copy: it is a witness, and an edited
# witness proves nothing" (`contracts/review-lane-pin.yaml`). THIS LANE IS
# THAT SENTENCE, EXECUTED — and the JUDGMENT it does not perform (is this the
# core commit we mean to be judged by?) stays with the human who merges.
#
# WHERE THE DECISIONS LIVE, AND WHY NOT HERE. Every refusal is in
# `scripts/review_lane_repin.py`, in pure functions the tests drive with
# fixtures. A refusal written in shell can only ever be asserted by grepping
# the shell; a refusal written in Python is MEASURED by
# `tests/review_lane_pin/test_repin_lane.py`. What stays here is what only a
# workflow can do: the triggers, the identity, the two API reads, and the pull
# request.
#
# THE TRIGGER IS A SWEEP, AND THE DISPATCH IS ONLY AN ACCELERATOR (decision
# M-1, ratified as recommended). The ratified requirement is explicit that the
# lane "SHALL NOT depend on being notified by the source repository's own
# automation: a pin advance is owed whenever the floor document has moved,
# INCLUDING when it moved by a hand act". A hand-authored codexFactory
# regeneration — the only path a REMOVAL can ever take — sends no dispatch, so
# a dispatch-only lane would silently not re-pin. The `schedule:` below is
# therefore the mechanism and `repository_dispatch` is a nudge that makes the
# common case timely.
#
# AND THE NUDGE IS ONLY A NUDGE. Nothing in this file reads
# `github.event.client_payload`. The candidate commit is resolved from
# codexFactory's default branch at run time, by this lane, on every firing —
# the ratified requirement's second scenario says it in those words: "it
# ignores any commit, branch or reference named by its trigger". A payload
# naming a commit would be an unauthenticated caller choosing which tree judges
# this repository, which is the one decision this whole family exists to keep
# out of a caller's hands.
#
# WHERE THE SCHEDULE LIVES (tasks.md 3.6, which asked for the choice to be made
# and recorded rather than assumed). **It lives HERE, and this is the first
# `schedule:` in this repository** — the nightly doc-health run is scheduled by
# a thin caller in the xFactory aggregation repository and reaches this
# repository through `workflow_call`. The alternative was to schedule it there
# too. Both consequences, stated:
#
#   * HERE (chosen): a first for this repository, so the cron is unprecedented
#     and must be watched. But the credential stays in the two repositories
#     that already hold it, and the lane's correctness does not depend on a
#     third repository this packet has no authority over.
#   * IN THE AGGREGATION: no new cron here, but the App key would have to reach
#     a THIRD repository to open a pull request in this one — a widening of a
#     privileged identity's blast radius, paid for a cadence. Refused on the
#     same ground the packet refuses a `|| github.token` fallback.
#
# THE CADENCE IS DECLARED AGAINST THE RULED TOLERANCE. codexFactory's floor
# declares `pending_floor_extension_tolerance: 3` (ruled 2026-09-05, cxF PR
# #231). The busiest measured day, 2026-09-04, added FIVE floored paths across
# four repairs in eleven and a half hours — roughly one every 2.3 hours. HOURLY
# clears a landed regeneration well inside that, so the covered-pending set
# cannot sit at the tolerance waiting on this half of the repair. Nightly was
# refused by that same measurement.
#
# WHAT THIS LANE MAY NOT DO, and every one of these is a ratified requirement:
# it never merges BY ITS OWN ACT, never approves, and never writes to `main`
# (the ONE disposal act it may now take is arming the PLATFORM'S auto-merge on
# its own pull request — the 2026-09-08 amendment above, and nothing wider);
# it moves all five pinned sites or it opens nothing; it recomputes
# the vendored snapshot's witnesses from the bytes it wrote; it asks for no
# exemption from the freshness checks that judge it; and it REFUSES when its
# declared credential binding does not resolve rather than degrading to an
# identity that would find nothing and exit green.
#
# THE CREDENTIAL IS DECLARED, NOT INVENTED:
# `contracts/review-lane-repin-binding.template.yaml` — a template carrying no
# live value, naming the consuming system, the identity and the least privilege
# this lane needs. Secrets are referenced BY NAME here and nowhere by value.
name: review-lane-repin

on:
  # THE MECHANISM. See the header: the sweep is what makes the lane correct
  # when the nudge is dropped, revoked, or never sent because a human did the
  # regeneration.
  schedule:
    - cron: "17 * * * *"

  # THE ACCELERATOR. codexFactory may nudge this lane when its floor document
  # moves. THE PAYLOAD IS NEVER READ — see the header, and
  # `test_repin_lane.py::test_the_lane_reads_no_trigger_payload`.
  repository_dispatch:
    types: [floor-regenerated]

  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Measure, write into the runner's checkout, and re-read every site —
          but push nothing and open nothing. Default true, so a hand firing is
          an inspection unless it says otherwise.
        type: boolean
        default: true

# The workflow-level grant is READ. The one job that needs to push a branch and
# open a pull request widens itself, and nothing else in this file can.
permissions:
  contents: read

# One firing at a time. Two concurrent sweeps would both measure the same
# disagreement and race to the same branch; the second would be a no-op at
# best. `cancel-in-progress: false` because a firing that has already opened a
# pull request must be allowed to finish reporting it.
concurrency:
  group: review-lane-repin
  cancel-in-progress: false

jobs:
  review-lane-repin:
    runs-on: ubuntu-latest

    # LEAST PRIVILEGE, and the two entries are exactly what the binding
    # template declares (tasks.md 3.9). `contents: write` pushes the lane's own
    # branch; `pull-requests: write` opens and updates the one pull request.
    # NOTHING here grants any privilege over codexFactory — the App's read
    # access to that repository comes from its installation there, and this
    # block cannot widen it.
    permissions:
      contents: write
      pull-requests: write

    env:
      SOURCE_REPOSITORY: codeXfactory/codexFactory
      # THE DECLARED CANDIDATE LIST — ONE ENTRY AGAIN, FIRST-OBTAINED-WINS.
      # M-1 STEP (3) of `relocate-review-authority-floor-mirror` (ratified
      # 2026-09-08, PR #817): THE MIGRATION WINDOW IS CLOSED. Step (1) opened it
      # (PR #823, `5c782f29`) by appending the successor below the path in
      # force; codexFactory's move landed at its PR #297, merge commit
      # `8165d1f3`; run 34311220954 (2026-09-09T04:30Z) obtained the document at
      # the successor and reported step (3) as owed. This is that step.
      #
      # WHY IT RETURNS TO ONE ENTRY rather than keeping the pair for comfort:
      # two standing homes would mean the lane no longer knows where the
      # document lives, and a file reappearing at the abandoned path — by a
      # revert, a bad cherry-pick, or an author who did not read the relocation
      # — would be taken as authoritative and byte-copied into this
      # repository's witnessed snapshot. The list is a MIGRATION WINDOW opened
      # by a named governed relocation, not a feature.
      #
      # THE LIST FORM AND ITS LOOP STAY, and that is the requirement rather than
      # a leftover: the ratified requirement resolves the document through an
      # ORDERED list, refuses only when EVERY candidate fails naming each one
      # tried, and makes a firing that resolves anything but the FIRST entry SAY
      # SO. With one entry that last branch cannot fire; it is the machinery the
      # NEXT governed relocation opens with an env edit, and deleting it would
      # make that relocation a rewrite of this step instead.
      #
      # STILL DUPLICATED, DELIBERATELY, in `scripts/review_lane_repin.py`'s
      # `FLOOR_IN_SOURCE_CANDIDATES` — "a value read from the artifact it is
      # used to check makes the check a tautology" — and held honest by an
      # assertion that every declaration carries the SAME ordered list, not by
      # anyone remembering.
      #
      # NOT THE SAME THING AS WHAT THE PIN NAMES, and this is the one subtlety
      # step (3) left behind: `contracts/review-lane-pin.yaml` describes the
      # document at `core_commit`, which is still the PRE-relocation
      # `4b12ba83` — the successor path 404s there (measured 2026-09-09) — so
      # the pin and the two single-path test declarations still name the old
      # path, and move on the first advance that carries `core_commit` past the
      # relocation. This list names where the document is at the commit the lane
      # FETCHES, which is codexFactory's default branch head.
      #
      # THE LANE NEVER SEARCHES BEYOND IT (M-7).
      FLOOR_IN_SOURCE_CANDIDATES: |
        floor/openxfactory-review-authority-floor.yaml
      BOT_BRANCH: bot/review-lane-repin
      BINDING: contracts/review-lane-repin-binding.template.yaml
      # A hand firing defaults to an inspection; a scheduled or dispatched
      # firing is the real thing. `inputs.dry_run` is unset on every event but
      # `workflow_dispatch`, so the guard is the event name.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      # ---- 1. The binding, or nothing ---------------------------------------
      # REQUIREMENT: "An automated pin advance lane ... MUST refuse to run when
      # that binding does not resolve ... An unresolvable binding SHALL be a
      # loud failure."
      #
      # WHY THIS IS A STEP AND NOT A FALLBACK. `pytest-suite.yml:400` writes
      # `${{ steps.app-token.outputs.token || github.token }}`, and that is
      # right THERE: the step it guards is `continue-on-error`, the fallback
      # degrades to a narrower identity, and the degradation is caught by a
      # named-testcase watch. HERE the same pattern would degrade to an
      # identity that cannot read codexFactory at all — so the lane would
      # compare the pin against nothing, find no disagreement, and exit GREEN.
      # A missing credential must not be able to look like a clean run.
      - name: Refuse unless the declared credential binding resolves
        env:
          APP_ID: ${{ secrets.OPENXFACTORY_APP_ID }}
          APP_KEY: ${{ secrets.OPENXFACTORY_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${APP_ID}" ]  || missing="${missing} OPENXFACTORY_APP_ID"
          [ -n "${APP_KEY}" ] || missing="${missing} OPENXFACTORY_APP_PRIVATE_KEY"
          if [ -n "${missing}" ]; then
            echo "::error title=review-lane-repin::the credential binding declared in ${BINDING} does not resolve — unset:${missing}. The lane REFUSES. It does not fall back to another identity, because an identity that cannot read ${SOURCE_REPOSITORY} would find no disagreement and report a clean no-op, turning a missing credential into a silent pass." >&2
            exit 1
          fi
          echo "credential binding ${BINDING} resolves; both references are set."

      # TWO TOKENS, ONE PER REPOSITORY THE BINDING NAMES — the shape the
      # codexFactory regeneration lane already uses. `pytest-suite.yml:318-324`
      # mints this App with `owner:` alone, a token good for EVERY repository
      # the App is installed on; too wide here, because one of these tokens
      # can PUSH and OPEN PULL REQUESTS. A single two-repository token was too
      # wide in the other direction too: its permissions applied to BOTH
      # repositories, so `contents: write` would have been minted over
      # codexFactory, which the binding forbids (`never_grants`). Each token
      # below is scoped to ONE repository and requests EXACTLY that
      # repository's `grants:` in the binding — held equal by
      # `test_each_mint_requests_exactly_its_repository_grants`.
      #
      # `owner: codeXfactory`, NOT `github.repository_owner`. The source
      # repository moved organizations, and `actions/create-github-app-token`
      # resolves the installation from `owner:`
      # (`GET /orgs/<owner>/installation`): the token reaches only THAT
      # installation's repositories. Transfer step 1.6 creates a SECOND,
      # SEPARATE installation on `codeXfactory` and does not widen the
      # `opensoft` one, so `github.repository_owner` — `opensoft`, since this
      # workflow runs in openxFactory — would mint a token that cannot read the
      # source however Phase 1 goes. The mint below is the LOUD place for that
      # to surface.
      #
      # THIS STEP HAS NO `continue-on-error`, DELIBERATELY, and MUST NOT GAIN
      # ONE. It fails CLOSED: a missing or unwidened installation stops the lane
      # at the mint, with `create-github-app-token`'s own message naming the
      # owner it could not resolve. That is strictly better than continuing to a
      # checkout that reports a repository problem for a credential cause. The
      # two `continue-on-error` mints in `merge-master-approval.yml` are
      # deliberately the other way for a different reason, stated there: their
      # checkout has a NAMED diagnostic step that must be the thing a human
      # reads.
      - name: Mint the codexFactory READ token
        id: source-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.OPENXFACTORY_APP_ID }}
          private-key: ${{ secrets.OPENXFACTORY_APP_PRIVATE_KEY }}
          owner: codeXfactory
          repositories: codexFactory
          permission-contents: read

      # `permission-workflows: write` IS REQUIRED, and run 34033398015
      # (2026-09-06 12:32Z) is the measurement: the lane advanced all five
      # sites and the judge passed, then GitHub refused the push — "refusing to
      # allow a GitHub App to create or update workflow
      # `.github/workflows/merge-master-approval.yml` without `workflows`
      # permission". Two of the five pinned sites ARE workflow files (the core
      # checkout `ref:` in merge-master-approval.yml and pytest-suite.yml).
      # FAIL-LOUD: `create-github-app-token` refuses to mint a permission the
      # installation does not carry, so until the `openxfactory` App is granted
      # Workflows: Read and write (App settings → Permissions → Repository
      # permissions → Workflows) and the grant is accepted on the org
      # installation, this step fails with a named error — never a silent
      # degradation. The lane writes workflow files on ITS OWN BRANCH only; main
      # stays behind the repository rulesets (the binding's
      # `workflows:write-to-default-branch` refusal).
      - name: Mint the lane's App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.OPENXFACTORY_APP_ID }}
          private-key: ${{ secrets.OPENXFACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: openxFactory
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # THE HASHED LOCKFILE, NOT AN AD-HOC PIP LIST (Copilot round 1).
      # `pip install pyyaml` resolves whatever PyPI serves at run time: no
      # version, no hash, and a lane that advances THE PIN THAT CHOOSES THIS
      # REPOSITORY'S JUDGE is the last place to take an unpinned dependency.
      # This is the repository's existing pattern, copied from
      # `pytest-suite.yml`, whose own comment gives the reason: the `.in`/
      # `.lock` pair is tracked and `--require-hashes` makes the install
      # reproducible and supply-chain pinned.
      #
      # ONE INSTALL, NOT TWO. The lock carries `pyyaml==6.0.3` (the decision
      # module's only import) AND `pytest==9.1.1` (the freshness run below), so
      # the second, separately unpinned `pip install pytest` this step used to
      # need is gone. `test_the_lane_installs_only_from_the_hashed_lockfile`
      # asserts no unpinned install can come back.
      - name: Install the pinned dependency set
        run: pip install --require-hashes -r requirements/hermes-runtime-contracts.lock

      # ---- 1b. WHAT BECAME OF THE LAST ARMED ADVANCE (decision M-E) ----------
      #
      # THE ARMING IS AN ACT WHOSE OUTCOME LANDS BETWEEN RUNS. Without this
      # step a reader of the log would have to go to the platform to learn
      # whether the pull request the LAST firing armed merged, is still waiting,
      # or was closed — which is exactly the thing the requirement's "a reader
      # of the run can tell an armed proposal from an unarmed one without
      # consulting the platform" is about, one firing later.
      #
      # IT READS AND IT DOES NOT ACT. There is no disposal verb in this step and
      # a named control sweeps it for every one of them, because a step that
      # reads state is the easiest place for one to be added later. Every value
      # it prints is read from the platform and recomputable by anyone with the
      # same command; the lane states no claim only it can make.
      #
      # IT NEVER FAILS THE RUN, AND UNKNOWN IS NOT "NONE". Both halves of an
      # unavailable answer — a listing the platform refused, and a program that
      # stopped parsing one it returned — are reported as UNKNOWN rather than
      # turned into a red advance, and neither is allowed to render "no
      # previous advance", which is a claim ABOUT the platform and not the
      # absence of an answer from it. The step cannot be `continue-on-error`,
      # which no step in this lane may carry, so the guard is in the shell —
      # and `TheOutcomeReportIsExecutedNotJustRead` measures both halves by
      # executing this step's own bytes against a refusing `gh`.
      #
      # THE TWO OPEN BRANCHES ARE WHERE THE RESIDUAL IS DISCLOSED (Codex P1 on
      # openxFactory #844). An open advance is reported as ARMED or as NOT
      # armed, and the NOT-armed line states the retry condition exactly: the
      # arming lives in the DELIVERY step, which is gated
      # `steps.repin.outputs.action == 'advance'`, so a no-op firing — this
      # step's own firing — re-attempts nothing. Re-arming from here would be a
      # THIRD `gh pr merge --auto` occurrence, which decision M-C's ratified
      # equality forbids and a named negative control reds, so the lane says
      # what it does not do rather than quietly doing it.
      - name: Report what became of the last automated advance
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          # THE LISTING'S EXIT STATUS IS KEPT SEPARATE FROM ITS OUTPUT
          # (Copilot on openxFactory #844). A `|| echo '[]'` on the read
          # turned an auth or transient API failure into an EMPTY listing, and
          # an empty listing renders "no previous automated pin advance has
          # ever been opened on this branch" — a positive claim about the
          # platform's state, made on a firing that could not read the
          # platform, and the opposite of what this step's own header
          # promises. It is the masking `merge-master-approval.yml`'s gather
          # refuses in terms ("a `|| echo '[]'` fallback would convert a
          # failed or rate-limited query into a clean, empty,
          # apparently-complete fact set"). So ONLY a listing `gh` actually
          # returned reaches jq; a non-zero exit leaves the outcome empty and
          # falls through to the unreadable fallback below, which already
          # existed for the jq half of the same problem. The step still never
          # fails the run.
          OUTCOME=""
          if LAST="$(gh pr list --repo "$GITHUB_REPOSITORY" --state all \
            --head "${BOT_BRANCH}" --limit 1 \
            --json number,state,mergeCommit,autoMergeRequest 2>/dev/null)"; then
            OUTCOME="$(printf '%s' "${LAST}" | jq -r '
              if length == 0 then
                "no previous automated pin advance has ever been opened on this branch"
              else
                .[0] as $pr
                | if $pr.state == "MERGED" then
                    "the last automated pin advance #\($pr.number) MERGED at \($pr.mergeCommit.oid // "an unreadable commit")"
                  elif $pr.state == "OPEN" and $pr.autoMergeRequest then
                    "the last automated pin advance #\($pr.number) is still OPEN with auto-merge ARMED; no candidate class admits this lane, so it waits for a human merge word"
                  elif $pr.state == "OPEN" then
                    "the last automated pin advance #\($pr.number) is still OPEN and auto-merge is NOT armed; the arming lives in the delivery step, so this lane re-attempts it only on its next firing that delivers an advance, and that firing moves the head first. No candidate class admits this lane either way, so it waits for a human merge word; openxFactory #745 box 4.4 is the measurement of what the platform does with an arming here, and box 4.3 the enrolment that would let an armed state complete anything"
                  else
                    "the last automated pin advance #\($pr.number) was CLOSED unmerged"
                  end
              end' 2>/dev/null || true)"
          fi
          [ -n "${OUTCOME}" ] || OUTCOME="the last automated pin advance could not be read from the platform on this firing"
          # A WORKFLOW COMMAND IS A PARSED LINE AND THIS PAYLOAD IS THE
          # PLATFORM'S OWN TEXT, so it is escaped before it is emitted, `%`
          # first. The step SUMMARY parses no commands and keeps the raw bytes.
          SAFE="${OUTCOME//'%'/%25}"
          SAFE="${SAFE//$'\r'/%0D}"
          SAFE="${SAFE//$'\n'/%0A}"
          echo "::notice title=review-lane-repin::${SAFE}"
          echo "${OUTCOME}" >> "$GITHUB_STEP_SUMMARY"

      # ---- 2. Resolve the source default branch AT RUN TIME ------------------
      # REQUIREMENT: "The verification SHALL be made against the source
      # repository itself at run time and SHALL NOT be inferred from an event
      # payload, a pull-request head, a tag, or any reference supplied by a
      # caller."
      #
      # Two API reads, both quoted into the pull-request body so a reviewer can
      # repeat them. Note what is NOT here: any expression naming
      # `github.event.client_payload`, on any event.
      - name: Resolve codexFactory's default branch and head, at run time
        id: source
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          BRANCH="$(gh api "repos/${SOURCE_REPOSITORY}" --jq .default_branch)"
          if [ -z "${BRANCH}" ] || [ "${BRANCH}" = "null" ]; then
            echo "::error title=review-lane-repin::${SOURCE_REPOSITORY}'s default branch could not be resolved on this run. The lane refuses and pins at no other reference." >&2
            exit 1
          fi
          SHA="$(gh api "repos/${SOURCE_REPOSITORY}/commits/${BRANCH}" --jq .sha)"
          # REACHABILITY, MEASURED RATHER THAN ASSUMED. The candidate IS the
          # branch tip, so `compare` must answer `identical`; asking anyway
          # means the evidence in the pull-request body is an API answer a
          # reviewer can re-fetch, not this lane's word for it.
          STATUS="$(gh api "repos/${SOURCE_REPOSITORY}/compare/${BRANCH}...${SHA}" --jq .status)"
          case "${STATUS}" in
            identical|behind) REACHABLE=true ;;
            *)                REACHABLE=false ;;
          esac
          {
            echo "branch=${BRANCH}"
            echo "sha=${SHA}"
            echo "reachable=${REACHABLE}"
            echo "evidence=Reachability: \`GET /repos/${SOURCE_REPOSITORY}/compare/${BRANCH}...${SHA}\` answered \`status: ${STATUS}\`, so \`${SHA}\` is carried by \`${BRANCH}\`."
          } >> "$GITHUB_OUTPUT"
          echo "resolved ${SOURCE_REPOSITORY}@${BRANCH} = ${SHA} (compare status ${STATUS})"

      # ---- 3. Obtain the authoritative document AT that commit ---------------
      # REQUIREMENT: "MUST obtain the vendored floor snapshot by COPYING the
      # authoritative document from the source repository at the new core
      # commit". Raw bytes, so what lands on disk is what codexFactory has —
      # not a re-serialization.
      - name: Fetch the authoritative floor document at that commit
        id: floor
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          BRANCH_SHA: ${{ steps.source.outputs.sha }}
        run: |
          # `-e` IS KEPT, AND THE ONE PLACE IT IS SUSPENDED IS EXPLICIT. The
          # `gh api` call runs under `set +e` for exactly as long as it takes to
          # capture its exit status, and the status is then CLASSIFIED: only a
          # 404 — genuinely absent — moves to the next candidate, and every
          # other failure aborts the step. So no failure is tolerated by
          # accident, and "no candidate resolved" means what it says.
          set -euo pipefail
          OUT="${RUNNER_TEMP}/floor-at-source.yaml"
          FIRST=""
          OBTAINED=""
          OBTAINED_INDEX=0
          INDEX=0
          TRIED=""
          # HOW MANY CANDIDATES ARE DECLARED, counted from the same env value
          # the resolution loop reads, so the witness can say "candidate N of M"
          # and a reader of the run learns whether a migration window is OPEN
          # (M above one) without opening the workflow. Its own pass, because
          # the loop below STOPS at the first hit and would never reach the
          # entries past it.
          TOTAL=0
          while IFS= read -r CANDIDATE; do
            [ -n "${CANDIDATE}" ] || continue
            TOTAL=$((TOTAL + 1))
          done <<< "${FLOOR_IN_SOURCE_CANDIDATES}"
          # FIRST-OBTAINED-WINS over the declared list, IN ORDER. Each miss is
          # recorded so a refusal names the whole set that was tried, and the
          # loop stops at the first hit — it never keeps looking for a "better"
          # path, because a second copy is a fact about codexFactory this lane
          # is not entitled to arbitrate.
          while IFS= read -r CANDIDATE; do
            [ -n "${CANDIDATE}" ] || continue
            INDEX=$((INDEX + 1))
            [ -n "${FIRST}" ] || FIRST="${CANDIDATE}"
            TRIED="${TRIED:+${TRIED}, }${CANDIDATE}"
            # ABSENCE IS THE ONLY THING THAT ADVANCES THE LOOP. An `if` around
            # `gh api` would swallow EVERY failure — auth, rate limit, a 500 —
            # and read it as "this candidate does not exist", which during a
            # migration window is the worst possible misreading: a transient
            # error on candidate one would fall through to the successor and
            # report a relocation that has not happened, or exhaust the list and
            # refuse for a reason that is not true. So the HTTP status is
            # inspected: a 404 means genuinely absent and moves to the next
            # candidate; anything else ABORTS THE STEP, fail-closed.
            # REDIRECT ORDER IS LOAD-BEARING AND IT IS `2>&1 >FILE`, NOT
            # `>FILE 2>&1`. The latter points stderr at the FILE — the command
            # substitution then captures nothing, `ERR` is empty, the 404
            # classification below never matches, and EVERY miss aborts the
            # step, which is the exact opposite of the intent and would break
            # this lane on a genuine absence. It also leaves error text in the
            # document the lane is about to treat as the floor. Written this way
            # round, stderr is duplicated to the substitution BEFORE stdout is
            # sent to the file, so `ERR` is the message and `${OUT}` is bytes.
            set +e
            ERR="$(gh api "repos/${SOURCE_REPOSITORY}/contents/${CANDIDATE}?ref=${BRANCH_SHA}" \
                     -H "Accept: application/vnd.github.raw" 2>&1 >"${OUT}")"
            RC=$?
            set -e
            if [ "${RC}" -eq 0 ]; then
              OBTAINED="${CANDIDATE}"
              OBTAINED_INDEX="${INDEX}"
              break
            fi
            if printf '%s' "${ERR}" | grep -qiE '(HTTP 404|Not Found)'; then
              continue
            fi
            echo "::error title=review-lane-repin::reading ${CANDIDATE} at ${BRANCH_SHA} failed for a reason that is NOT absence (exit ${RC}): ${ERR}. The lane refuses rather than reading a transient or permission failure as a moved document."
            exit 1
          done <<< "${FLOOR_IN_SOURCE_CANDIDATES}"

          if [ -n "${OBTAINED}" ]; then
            echo "path=${OUT}" >> "$GITHUB_OUTPUT"
            # THE WITNESS LINE. It names WHICH declared path answered and HOW
            # MANY were declared, and says in words whether that is the path in
            # force or a migration in progress — so a reader of the run learns
            # the state of a two-repository move without opening either diff.
            # "candidate 1 of 1" is the settled state M-1 step (3) restored;
            # "candidate 1 of 2" or more would mean a window is open again.
            if [ "${OBTAINED}" = "${FIRST}" ]; then
              WITNESS="fetched ${OBTAINED} at ${BRANCH_SHA} ($(wc -c < "${OUT}") bytes) — candidate ${OBTAINED_INDEX} of ${TOTAL} in the declared list, the path in force; no migration in progress"
            else
              WITNESS="fetched ${OBTAINED} at ${BRANCH_SHA} ($(wc -c < "${OUT}") bytes) — candidate ${OBTAINED_INDEX} of ${TOTAL}, NOT the first declared candidate: ${FIRST} did not resolve, so a governed relocation has landed in codexFactory and this repository owes the step that returns the list to one entry"
            fi
            echo "${WITNESS}"
            echo "${WITNESS}" >> "$GITHUB_STEP_SUMMARY"
          else
            # The decision module turns an absent document into a refusal that
            # names itself; leaving `path` empty is how it is told. It fires
            # ONLY when no declared candidate resolved.
            rm -f "${OUT}"
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning title=review-lane-repin::no declared candidate resolved at ${BRANCH_SHA} (tried: ${TRIED}); the lane will refuse."
          fi

      # ---- 4. Measure, decide, write, and RE-READ ----------------------------
      # The whole of requirements 2, 3, 4 and 7's no-op, in one call. `--write`
      # writes into the runner's checkout and then re-reads all five sites from
      # disk; a site that did not move turns the whole run into a refusal and
      # this step exits non-zero, so no branch is pushed and no pull request is
      # opened.
      #
      # `--write` is passed on every firing INCLUDING a dry run: the dry run's
      # value is that it exercises the write and the re-read for real, and it
      # is the PUSH that `DRY_RUN` suppresses, two steps below. A dry run that
      # skipped the write would prove nothing about the write.
      - name: Measure the disagreement, advance the five sites, re-read them
        id: repin
        env:
          BRANCH: ${{ steps.source.outputs.branch }}
          BRANCH_SHA: ${{ steps.source.outputs.sha }}
          REACHABLE: ${{ steps.source.outputs.reachable }}
          EVIDENCE: ${{ steps.source.outputs.evidence }}
          FLOOR_PATH: ${{ steps.floor.outputs.path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/review_lane_repin.py \
            --repo . \
            --source-default-branch "${BRANCH}" \
            --candidate-commit "${BRANCH_SHA}" \
            --candidate-reachable "${REACHABLE}" \
            --reachability-evidence "${EVIDENCE}" \
            --floor-document "${FLOOR_PATH}" \
            --run-url "${RUN_URL}" \
            --plan-out "${RUNNER_TEMP}/plan.json" \
            --body-out "${RUNNER_TEMP}/pr-body.md" \
            --write
          ACTION="$(python3 -c 'import json,os,sys; print(json.load(open(os.environ["RUNNER_TEMP"]+"/plan.json"))["action"])')"
          echo "action=${ACTION}" >> "$GITHUB_OUTPUT"

      # ---- 5. A clean, NAMED no-op ------------------------------------------
      # REQUIREMENT: "Nothing to advance is a clean named no-op ... it reports
      # that nothing is owed and exits successfully AND it opens no pull
      # request." Named, so a green run is readable as "measured, nothing
      # owed" rather than as "ran, said nothing".
      - name: Report a clean no-op
        if: steps.repin.outputs.action == 'noop'
        run: |
          set -euo pipefail
          python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/plan.json"))["reason"])' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # ---- 5b. RUN THE JUDGE BEFORE PROPOSING -------------------------------
      # THE LANE DOES NOT GET AN EXEMPTION AND DOES NOT WANT ONE (requirement 5,
      # decision M-4). What it does instead is submit to the judge BEFORE it
      # opens anything, so an advance that would be red arrives as a failed run
      # rather than as a red pull request somebody has to triage.
      #
      # NOTE WHAT IS AND IS NOT HAPPENING HERE. This runs the EXISTING
      # `tests/review_lane_pin/` suite, unmodified, against the tree the lane
      # just wrote — the same assertions, at the same strictness, that will run
      # again on the pull request. It adds no assertion, relaxes none, and
      # skips none. If these two things ever disagree, the pull request's run
      # is the authority and this one is the early warning.
      #
      # THE CORE CHECKOUT IS AT THE CANDIDATE COMMIT, WHICH IS THE POINT. The
      # byte-identity verifier compares the snapshot the lane just wrote
      # against the authoritative document in a real checkout; checking out the
      # OLD pinned core would compare the new snapshot against the old document
      # and fail every honest advance. `tasks.md` 4.7 asks for exactly this
      # second run "with a codexFactory checkout on disk".
      #
      # `.merge-master-core` is never staged: step 6 stages four named paths.
      - name: Check out the candidate core so the freshness verifier can run
        if: steps.repin.outputs.action == 'advance'
        uses: actions/checkout@v4
        with:
          repository: codeXfactory/codexFactory
          ref: ${{ steps.source.outputs.sha }}
          path: .merge-master-core
          persist-credentials: false
          token: ${{ steps.source-token.outputs.token }}

      - name: Submit the advance to the checks that will judge it
        if: steps.repin.outputs.action == 'advance'
        env:
          PINNED_CORE_CHECKOUT: ${{ github.workspace }}/.merge-master-core
        run: |
          set -euo pipefail
          python3 -m pytest tests/review_lane_pin -q

      # ---- 6. Propose, arm, and stop ----------------------------------------
      # REQUIREMENT 1, AS NARROWED 2026-09-08 by
      # `amend-mirror-floor-regeneration-merge-authority`: "it opens a pull
      # request carrying that advance and takes no further action on it BEYOND
      # ARMING THE PLATFORM'S AUTO-MERGE on that same pull request AND it
      # neither merges BY ITS OWN ACT nor approves that pull request".
      #
      # THE PREVIOUS SENTENCE HERE IS SUPERSEDED, NOT DELETED, because a comment
      # that keeps asserting a state the file no longer has is a false witness.
      # It read: "There is no `gh pr merge`, no `--auto`, no `--admin` and no
      # `gh pr review` anywhere in this file, and a test asserts their absence
      # rather than trusting this comment." **TWO OF THOSE TEN SPELLINGS ARE NOW
      # ADMITTED, IN ONE EXACT FORM AND NOWHERE ELSE**: the arming command
      # `gh pr merge --auto --squash "${BOT_BRANCH}"`, twice — once on the
      # update path and once on the open path (decisions M-A and M-B). The
      # OTHER EIGHT — `gh pr review`, `gh pr close`, `--admin`,
      # `enable-auto-merge`, `--method PUT`, `-X PUT`, `/reviews`,
      # `enablePullRequestAutoMerge` — and the raw-API merge endpoint are still
      # absent, `scripts/review_lane_repin.py` still names none of the ten, and
      # `test_the_lane_opens_a_pull_request_arms_and_stops_there` measures all
      # of that BY EQUALITY rather than trusting this comment: the arming
      # appears exactly twice, no `gh pr merge` occurrence lacks `--auto`, and a
      # THIRD occurrence reds its own named control.
      #
      # REQUIREMENT 7: "at most one automated pin advance pull request is open
      # at any time". The branch name is FIXED, and the delivery follows the
      # doc-health nightly's rolling-PR idiom exactly: when a pull request is
      # already open, the branch is advanced by a two-parent `commit-tree`
      # whose FIRST parent is the current remote tip, so the push is a
      # fast-forward and NO FORCE IS EVER USED; when none is open, the branch
      # is recreated from `main` and a single pull request is opened.
      #
      # `git add --` names the four writable paths explicitly. A bare `git add
      # -A` would sweep anything else the runner happened to leave in the tree,
      # and requirement 1's third scenario is that every changed file is one of
      # the pinned sites.
      - name: Open or update the single automated advance
        if: steps.repin.outputs.action == 'advance' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          BOT_ID="$(gh api "/users/${BOT_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name  "${BOT_SLUG}[bot]"
          git config user.email "${BOT_ID}+${BOT_SLUG}[bot]@users.noreply.github.com"

          MAIN_TIP="$(git rev-parse HEAD)"
          git add -- \
            contracts/review-lane-pin.yaml \
            contracts/review-lane-floor-snapshot.yaml \
            .github/workflows/merge-master-approval.yml \
            .github/workflows/pytest-suite.yml
          if git diff --cached --quiet; then
            echo "::error title=review-lane-repin::the decision module reported an advance but staged no change. Refusing rather than opening an empty pull request." >&2
            exit 1
          fi
          # Nothing outside the five sites may be carried. Measured against the
          # staged set rather than asserted.
          STRAY="$(git diff --cached --name-only | grep -vE '^(contracts/review-lane-pin\.yaml|contracts/review-lane-floor-snapshot\.yaml|\.github/workflows/(merge-master-approval|pytest-suite)\.yml)$' || true)"
          if [ -n "${STRAY}" ]; then
            echo "::error title=review-lane-repin::the advance would carry a file that is not a pinned site: ${STRAY}. Refusing." >&2
            exit 1
          fi
          TREE="$(git write-tree)"
          MSG="$(printf 'Advance the pinned decision core to %s\n\nAll five sites move in this one commit. Opened by the review-lane-repin\nlane, which arms the platform auto-merge and neither merges by its own\nact nor approves. No candidate class admits this lane today, so the merge\nstill waits for the same human word a hand-authored advance needs.\n\nLane: review-lane-repin-bot\n' "${BRANCH_SHA}")"

          # ── THE ARMING, AND THE WITNESS THAT MAKES IT LEGIBLE ────────────────
          #
          # WHY ARMING BEFORE ANY APPROVAL EXISTS IS SAFE (decision M-A).
          # `--auto` performs NO merge. It records an intent GitHub executes
          # only when every merge requirement this repository declares holds at
          # once: the approving review count (ruleset 18962101),
          # `require_last_push_approval`, the code-owner review (18834180) and
          # the required status checks of rulesets 21957695 and 21538893. There
          # is no window in which arming merges something an approval has not
          # released — the PLATFORM holds the predicate, not this lane.
          #
          # WHY `--squash` (M-B). This repository permits all three methods, so
          # the method is a real choice here and was not one in codexFactory.
          # The lane's own precedent is a squash: PR #732, the only
          # `bot/review-lane-repin` pull request ever merged, landed as
          # `9ffc6252` with ONE parent. And the update path below advances the
          # branch with a TWO-PARENT `commit-tree` so it never force-pushes; a
          # merge commit would carry those synthetic bookkeeping parents onto
          # `main`, and a squash lands the advance as the one commit the pull
          # request is.
          #
          # WHY IT RUNS ON BOTH PATHS, UNCONDITIONALLY. GitHub disables an armed
          # auto-merge when the head branch is pushed by an actor WITHOUT write
          # permission; this lane's token holds `contents: write`, so its own
          # update does not disable it. THE RE-ARMING DOES NOT REST ON THAT: it
          # is performed on every delivery regardless of the previous state, so
          # an intent the platform kept is left exactly as it is (the call is an
          # idempotent no-op) and an intent the platform dropped is restored.
          # The requirement asks for exactly this — "the lane SHALL take that
          # same update path and SHALL re-arm the platform's auto-merge on that
          # pull request idempotently".
          #
          # A REFUSED ARM IS A RECORDED OUTCOME, NEVER A FAILED ADVANCE. The
          # pull request is already delivered and correct by the time this runs;
          # only its disposal may be unavailable, and that is the platform's or
          # the owner's to change. Community discussion #190610 reports that
          # since 2026-03-25 enabling auto-merge returns HTTP 422 until every
          # requirement is ALREADY met — which is precisely the state of this
          # lane's pull request TODAY and for as long as the arming is inert.
          # Turning that into a red run would turn every honest advance red, and
          # the requirement says the opposite in terms: an arming that cannot
          # complete "is a CONFORMING state of this requirement and SHALL be
          # reported as such rather than treated as a failure or as progress".
          # So the arming is guarded here, in the shell, and NOT by
          # `continue-on-error`, which no step in this lane may carry.
          #
          # A WORKFLOW COMMAND IS A PARSED LINE, AND THE REFUSAL TEXT IS THE
          # PLATFORM'S OWN. GitHub Actions percent-DECODES a `::notice`
          # message, so a payload carrying the literal characters `%0A` becomes
          # a NEWLINE in the log and whatever follows it becomes a SECOND
          # workflow command. Every payload below passes through `command_safe`
          # in the order the encoding requires (`%` FIRST, or the escapes would
          # themselves be re-escaped). The step SUMMARY is markdown, parses no
          # commands, and keeps the platform's own bytes.
          command_safe() {
            local text="$1"
            text="${text//'%'/%25}"
            text="${text//$'\r'/%0D}"
            text="${text//$'\n'/%0A}"
            printf '%s' "$text"
          }

          # THE TAIL OF THE ARMED WITNESS, AND THE CLAUSE THAT MUST BE DROPPED
          # THE DAY IT STOPS BEING TRUE. `admit-review-lane-repin-to-merge-approval-envelope`
          # is the enrolment successor named in the packet's § The realization
          # gate; until it lands, no candidate class admits this lane, no
          # envelope approval can ever stand for it, and the arming is inert.
          # The enrolment lane drops the second sentence and nothing else.
          ARMED_TAIL="the platform merges when the merge-master envelope approval for that head stands and every required check has succeeded; this lane neither merges nor approves. NO CANDIDATE CLASS ADMITS THIS LANE TODAY, so the arming is inert: the pull request waits for the same human merge word a hand-authored advance needs, until admit-review-lane-repin-to-merge-approval-envelope lands."

          # EVERY VALUE IN THE WITNESS IS READ FROM THE PLATFORM, and an
          # unreadable one is SAID rather than left blank: without the fallbacks
          # a transient failure here emits "ARMED on # at " and the line whose
          # whole purpose is to name the head an approval must bind to names
          # nothing at all, silently.
          report_the_arming() {
            local rc="$1" output="$2"
            local view number head_oid reason witness
            view="$(gh pr view "${BOT_BRANCH}" --repo "$GITHUB_REPOSITORY" --json number,headRefOid --jq '"\(.number) \(.headRefOid)"' 2>/dev/null || true)"
            number="${view%% *}"
            head_oid="${view##* }"
            [ -n "${number}" ] || number="an UNREADABLE number"
            [ -n "${head_oid}" ] || head_oid="an UNREADABLE head"
            if [ "${rc}" -eq 0 ]; then
              witness="auto-merge ARMED on #${number} at ${head_oid} — ${ARMED_TAIL}"
            elif printf '%s' "${output}" | grep -qi 'already enabled'; then
              witness="auto-merge ARMED on #${number} at ${head_oid} (already enabled) — ${ARMED_TAIL}"
            else
              # ONE LINE, ONE REASON, AND THE RETRY CONDITION EXACTLY. The
              # platform's own message is carried verbatim so a reader can tell
              # a 422 "requirements not met yet" from a permission problem
              # without opening the run.
              #
              # "ON ITS NEXT FIRING" WAS TOO LOOSE AND IS NARROWED (Codex P1 on
              # openxFactory #844). The arming lives in THIS step, which is
              # gated `steps.repin.outputs.action == 'advance'`, so a firing
              # that finds nothing to advance does not reach it: a refused
              # arming is re-attempted on the next firing that DELIVERS an
              # advance, and that firing moves the head first. Saying "its next
              # firing" would have promised an hourly retry the lane does not
              # perform. The residual is recorded on openxFactory #745.
              #
              # THE JOIN IS THE SAME ON ALL THREE VARIANTS (Copilot on #844):
              # `ARMED_TAIL` opens lowercase, so every branch reaches it
              # through " — " and never across a sentence end.
              reason="$(printf '%s' "${output}" | tr '\n' ' ' | cut -c1-300)"
              witness="auto-merge NOT armed on #${number} at ${head_oid}: platform refused (${reason}); the advance is delivered and correct, and the lane re-attempts the arming only on its next firing that delivers an advance — ${ARMED_TAIL}"
            fi
            echo "::notice title=review-lane-repin::$(command_safe "${witness}")"
            echo "${witness}" >> "$GITHUB_STEP_SUMMARY"
          }

          OPEN_PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${BOT_BRANCH}" --base main --state open --json number -q '.[0].number')"
          if [ -n "${OPEN_PR}" ]; then
            git fetch origin "${BOT_BRANCH}"
            REMOTE_TIP="$(git rev-parse FETCH_HEAD)"
            NEW_TIP="$(git commit-tree "${TREE}" -p "${REMOTE_TIP}" -p "${MAIN_TIP}" -m "${MSG}")"
            git update-ref "refs/heads/${BOT_BRANCH}" "${NEW_TIP}"
            git push origin "${BOT_BRANCH}"
            gh pr edit "${OPEN_PR}" --repo "$GITHUB_REPOSITORY" \
              --title "Advance the pinned decision core to ${BRANCH_SHA}" \
              --body-file "${RUNNER_TEMP}/pr-body.md"
            echo "updated the open automated advance #${OPEN_PR}; no second pull request opened."
            # RE-ARM ON THE UPDATE PATH. The pull request the requirement's
            # "further advance owed while the armed pull request is parked"
            # scenario describes is exactly this one, and the re-arming is the
            # same single route to the merge restated, not a second one. The
            # repository is resolved from this checkout, as the packet's
            # ratified spelling of the command has it.
            if ARM_OUTPUT="$(gh pr merge --auto --squash "${BOT_BRANCH}" 2>&1)"; then ARM_RC=0; else ARM_RC=$?; fi
            report_the_arming "${ARM_RC}" "${ARM_OUTPUT}"
          else
            if git ls-remote --exit-code --heads origin "${BOT_BRANCH}" >/dev/null 2>&1; then
              git push origin --delete "${BOT_BRANCH}"
            fi
            NEW_TIP="$(git commit-tree "${TREE}" -p "${MAIN_TIP}" -m "${MSG}")"
            git update-ref "refs/heads/${BOT_BRANCH}" "${NEW_TIP}"
            git push origin "${BOT_BRANCH}"
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "${BOT_BRANCH}" \
              --title "Advance the pinned decision core to ${BRANCH_SHA}" \
              --body-file "${RUNNER_TEMP}/pr-body.md"
            # ARM ON THE OPEN PATH. Byte-identical to the update path's call —
            # the pull request is named by the lane's own head branch, so one
            # spelling serves both and a reader cannot be told two different
            # things about what was armed.
            if ARM_OUTPUT="$(gh pr merge --auto --squash "${BOT_BRANCH}" 2>&1)"; then ARM_RC=0; else ARM_RC=$?; fi
            report_the_arming "${ARM_RC}" "${ARM_OUTPUT}"
          fi

      - name: Say what a dry run would have opened
        if: steps.repin.outputs.action == 'advance' && env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          {
            echo "### review-lane-repin — DRY RUN"
            echo
            echo "An advance is owed. The five sites were written and re-read in"
            echo "this runner's checkout; nothing was pushed, no pull request was"
            echo "opened or updated, and NO AUTO-MERGE WAS ARMED — the arming is"
            echo "part of the delivery step this dry run replaces. The body it"
            echo "would have carried:"
            echo
            cat "${RUNNER_TEMP}/pr-body.md"
          } | tee -a "$GITHUB_STEP_SUMMARY"
