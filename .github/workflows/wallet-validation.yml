# Wallet contract validation gate for every pull request to main (feature
# 010-wallet-validator-ci). Advisory until the operator marks it required —
# see the "Wallet validation gate" section in README.md for the exact
# click-path.
#
# The job carries no display name on purpose: the status check must surface
# as exactly `wallet-validation` (FR-007), the literal token branch
# protection pins; a distinct job display name silently de-advises the gate.
name: wallet-validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  wallet-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml jsonschema rfc3339-validator

      - run: python3 scripts/wallet-yaml-syntax-gate.py .

      - run: python3 scripts/validate-openxwallet.py .
