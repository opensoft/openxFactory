# THE ARRIVAL GATE — a RUNNING check, not a described one.
#
# `add-declared-former-id` (ratified 2026-09-13) requires that a landing be
# REFUSED where its commit brings a change packet directory in by a move from
# another change packet directory whose identity has ever declared
# `Status: ratified` and the arriving packet does not declare the source id in
# `former_ids:` in that same commit. `design.md` D3 (RULED (a)) put that
# refusal AT THE LANDING rather than at the archive gate — "each hop is one
# commit when it lands, so no chain-walking is ever needed" — and named the
# shape: a reader module under `scripts/`, a validator CLI beside it, and a
# test suite over the live corpus. This workflow is what RUNS that CLI.
#
# THIS FILE IS NOT EVIDENCE THAT THE CHECK IS REQUIRED, and that is worth
# writing down while it is still true. `tasks.md` § 4.5 — REGISTER IT AS A
# REQUIRED CHECK — is an OPERATOR act in the organization ruleset, and it is
# NOT PERFORMED. Until `former-id-arrival-gate` is a required status check on
# `~DEFAULT_BRANCH` of this repository, this gate refuses NOTHING: a pull
# request carrying an undeclared rename of a ratified packet would see a red
# check beside a merge button that still works. Merging this file changes
# nothing about the ruleset, and deleting the ruleset later would leave this
# file untouched and the capability back to conferring nothing.
#
# THE EVIDENCE THAT WOULD CLOSE § 4.5 IS A LIVE RULESET READ PLUS A CANARY, and
# never this file: a read of BOTH `GET /orgs/opensoft/rulesets/<id>` and
# `GET /repos/opensoft/openxFactory/rules/branches/main` showing the context,
# and a canary pull request carrying an undeclared rename of a ratified packet
# with the check going red on exactly one named refusal
# (`former-id-undeclared`), GitHub reporting the pull request BLOCKED, and the
# canary closed unmerged with its branch deleted. That is precisely what
# `add-signed-execution-chain` § 4.5/4.6 did — org ruleset 21957695, canary PR
# #549, run 33455808456 — and `signed-execution-chain-gate.yml` states the same
# rule about itself, which is where this paragraph's shape comes from.
#
# WHETHER A DEDICATED WORKFLOW IS OWED AT ALL IS AN OPEN DECISION (the
# realization plan's Q1, Brett Heap's). `design.md` D3 says "a NEW house
# validator run as a required check AT THE LANDING, in the shape
# `gate-realization-axis-vocabulary` established" — and that named precedent
# has NO dedicated workflow: `scripts/validate-target-release.py` is exercised
# only through `tests/target_release/test_target_release_gate.py` inside the
# already-required `pytest-suite`. So "the shape it established" and "run as a
# required check" pull in two directions. THIS FILE TAKES THE RECOMMENDATION
# because the gate must read the PULL REQUEST'S OWN COMMIT RANGE, which is a
# `pull_request`-event fact a corpus test cannot see, and because a gate folded
# into `pytest-suite` cannot report its own refusal status. If the cheaper
# route is ruled instead, DELETE THIS FILE: the module, the CLI and the suite
# stand unchanged, `tests/former_id_arrival` keeps exercising both arms inside
# `pytest-suite`, and no operator act is owed at all.
#
# THE JOB CARRIES NO DISPLAY NAME ON PURPOSE: the status check must surface as
# exactly `former-id-arrival-gate`, the literal token a branch ruleset would
# pin. A distinct job display name silently de-advises the gate — the same rule
# `signed-execution-chain-gate.yml`, `release-tag-gate.yml`,
# `openxwallet-consumer-gate.yml` and `pytest-suite.yml` each document for
# themselves.
#
# `fetch-depth: 0` IS LOAD-BEARING. On a `pull_request` run the checkout is the
# merge commit GitHub built, whose FIRST PARENT is the base tip and whose
# SECOND is the pull request head, so `HEAD^1..HEAD^2` is this pull request's
# own commits and nothing else — and a shallow checkout cannot resolve either.
# The reader REFUSES `former-id-arrival-unreadable` rather than passing blind
# when it cannot, which is `release-tag-gate.yml`'s `gate-unreadable-base` for
# the same reason. (A commit at a GRAFTED BOUNDARY inside a range that DID
# resolve is a different case and takes no refusal: `tasks.md` § 6.4 names a
# shallow-checkout refusal class NOT TAKEN, since it would be a new refusal
# class on a gate with no bypass flag.)
#
# NOT ON `push: main`, deliberately. The gate judges the commits a PULL REQUEST
# carries; on `main` there is no such range, and re-adjudicating history that
# has already landed would red the branch for moves nobody can now repair in
# the commit that made them. The corpus arm of this validator does run on every
# pull request regardless of the range, so the whole-tree declaration sweep is
# never skipped.
#
# NO BYPASS FLAG IS PASSED HERE BECAUSE THERE IS NONE (#690). `--base` and
# `--head` exist so the test suite can name a range; CI passes neither, and the
# gate derives the range from the checkout itself.

name: former-id-arrival-gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: former-id-arrival-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  former-id-arrival-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # THE READER REFUSES WITHOUT IT rather than sweeping a corpus it cannot
      # parse: with no PyYAML every `.openspec.yaml` reads as declaring
      # nothing and the whole-tree sweep would report a clean corpus it never
      # read. Installed here so the gate can run; refused there so the gate
      # cannot pass vacuously if it is ever run somewhere this step is not.
      - run: pip install pyyaml

      - name: Judge every landing this pull request carries
        shell: bash
        run: |
          python3 scripts/validate-former-id-arrival.py . | tee arrival-gate.log

      # THE ASSERTION IS POSITIVE, and it needs no edit to the reader. On the
      # happy path the reader emits no finding, so the proof that it actually
      # READ anything is the conjunction of the notes it DOES produce: a commit
      # range was resolved and judged (not "no commit range", which is what a
      # checkout without history or a non-pull_request invocation would print),
      # and the whole-tree sweep read a non-zero number of packets. A green
      # check that proves nothing was read is the class of defect this step
      # exists to close — the same guard `signed-execution-chain-gate.yml`
      # writes for its own reader.
      - name: Assert the gate actually judged something
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          grep -qE '^former-id arrival gate: [0-9]+ commit\(s\) of ' arrival-gate.log \
            || fail "the gate log reports no judged commit range — on a pull_request run the checkout is a merge commit and HEAD^1..HEAD^2 must resolve; check that fetch-depth is 0"
          grep -qE '^  corpus sweep: [1-9][0-9]* active and [0-9]+ archived packet\(s\)' arrival-gate.log \
            || fail "the gate log reports no active packet read by the corpus sweep — the whole-tree declaration sweep did not run, so no declaration was adjudicated"
          ! grep -qE '^former-id arrival gate (FAILED|CANNOT RUN):' arrival-gate.log \
            || fail "the gate log carries a refusal; see the reader output above"
