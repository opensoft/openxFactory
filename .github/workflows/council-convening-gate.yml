# THE COUNCIL-CONVENING CONTRACT GATE — the named reader for
# `contracts/council-convening/`.
#
# `scripts/validate-council-convening.py` is the canonical validator for the
# neutral resolved council protocol (`renew-resolved-council-protocol`, realized
# by Speckit feature 035). Its self-test is the only thing that adjudicates the
# shared conformance corpus on every change, and this workflow is what runs it.
#
# THE JOB CARRIES NO `name:` KEY, ON PURPOSE. The status check must surface as
# exactly `council-convening-gate`, the literal token a branch ruleset would
# pin; a distinct display name silently de-advises the gate. That is the rule
# `clearing-dispatch-gate.yml` and `signed-execution-chain-gate.yml` document
# for themselves.
#
# THIS CHECK IS NOT YET REQUIRED, AND THAT IS STATED RATHER THAN LEFT TO BE
# DISCOVERED. Until the owner makes it a required check on a ruleset, this gate
# REPORTS and does not GATE. The family itself is dormant and unregistered: no
# manifest row and no release until feature 035's Phase 7 cut. The tests that
# pin this wiring, `tests/council_convening/test_gate_wiring.py`, run inside the
# required `pytest-suite` job.
#
# THE INPUTS ARE THE HASH-LOCKED SET, not an ad-hoc pip list.
# `requirements/hermes-runtime-contracts.lock` is the ratified validator-input
# source `pytest-suite.yml` installs; with `--require-hashes` this gate reads the
# same bytes. It carries `rfc3339-validator`, without which jsonschema skips the
# date-time checker and the validator refuses to run rather than fail open.
#
# NO SUBMODULE, NO SECRET, NO TOKEN. The validator reads only this repository's
# own tree, so nothing is initialized and nothing is minted.
#
# THE ASSERTION STEP IS POSITIVE. On the happy path the validator emits no
# finding, so "0 errors" is also what a run that opened nothing would print. The
# proof that it walked anything is the conjunction of the NOTES it produces: the
# schemas loaded, the registry closed at its landed count, the corpus indexed,
# EVERY vector adjudicated, EVERY refusal and finding code probed, every
# coverage-floor requirement cited, and the corpus regenerated byte for byte. A
# green check that proves nothing was walked is a vacuous pass. The asserted set
# grows by phase: the predicate-registry note joins in Phase 2, and the
# requirements note's floor rises with each phase's `coverage_floor`.
name: council-convening-gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  council-convening-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # THE HASHED LOCK, AND `--only-binary :all:` BESIDE THE HASHES, so no
      # sdist's setup script runs during the install of a gate (Sonar
      # githubactions:S8541). `former-id-arrival-gate.yml`'s rule, taken for its
      # reason: "the hashes already bind WHICH artifact may be installed; this
      # binds WHAT KIND, which is the half a hash cannot express". It changes
      # nothing about WHAT is installed: measured against this lock on Python
      # 3.12, `pip install --require-hashes --only-binary :all: --dry-run`
      # resolves 17 packages, 17 wheels, ZERO sdists, exit 0. (A literal block,
      # because `--only-binary :all: -r` carries a colon and a space, which a
      # plain YAML scalar may not.)
      - name: Install the pinned dependency set
        run: |
          pip install --require-hashes --only-binary :all: \
            -r requirements/hermes-runtime-contracts.lock

      - name: Run the council-convening validator self-test
        shell: bash
        run: |
          python3 scripts/validate-council-convening.py | tee council-convening-gate.log

      - name: Assert the gate actually walked something
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          grep -qE '^note  schemas loaded: [0-9]+ \(family\) \+ digest-construction$' council-convening-gate.log \
            || fail "the family schemas and the digest construction were not loaded."

          # THE LITERAL COUNT IS THE POINT. The protocol registry is CLOSED at two
          # entries; adding one is a governed contract change, not an edit to a grep.
          grep -qE '^note  protocol registry closed: 2 entries$' council-convening-gate.log \
            || fail "the protocol registry is not closed at its two landed entries."

          # Phase 2 (T032): the predicate registry is CLOSED at two predicates over
          # two input contracts; adding one is a governed contract change too.
          grep -qE '^note  predicate registry closed: 2 predicates, 2 input contracts$' council-convening-gate.log \
            || fail "the predicate registry is not closed at its two predicates and two input contracts."

          grep -qE '^note  corpus index: [0-9]+ vectors, [0-9]+ both-sides, sha256:[0-9a-f]{64}$' council-convening-gate.log \
            || fail "the corpus index was not read."

          # `N/N` via a backreference: a pattern matching any two numbers passes
          # a run that adjudicated three vectors out of a hundred. The first
          # digit is 1-9, so `0/0`, a run that walked nothing, fails too.
          grep -qE '^note  vectors adjudicated: ([1-9][0-9]*)/\1$' council-convening-gate.log \
            || fail "not every vector was adjudicated to its expected outcome."

          grep -qE '^note  refusal codes probed: ([1-9][0-9]*)/\1$' council-convening-gate.log \
            || fail "a refusal code in the vocabulary at this commit has no probing vector."

          grep -qE '^note  finding codes probed: ([1-9][0-9]*)/\1$' council-convening-gate.log \
            || fail "a finding code in the vocabulary at this commit has no probing vector."

          grep -qE '^note  requirements probed: ([1-9][0-9]*)/\1 \(FR-001, FR-002, FR-003, FR-004, FR-005, FR-006, FR-007, FR-008, FR-011, SC-001, SC-002, SC-003\)$' council-convening-gate.log \
            || fail "a coverage-floor requirement is cited by no vector, or the floor moved without this assertion."

          grep -qE '^note  generator reproduced corpus byte-for-byte$' council-convening-gate.log \
            || fail "the generator did not reproduce the committed corpus."

          ! grep -qE '^ERROR \[' council-convening-gate.log \
            || fail "the council-convening validator reported an error. Read the ERROR lines above."

          echo "council-convening-gate: the validator loaded the schemas, closed the registry, adjudicated every vector, probed every code, and reproduced the corpus."
