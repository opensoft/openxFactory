    - product_or_service_mapping
    - missing_context_explanation
    - blocked_workflow_explanation
    - approval_need_explanation
    - staff_or_queue_recommendation
    - customer_message_drafting
    - change_summary
    - current_workflow_explanation
    - gap_risk_explanation
    - target_workflow_recommendation
    - consent_needed_explanation
  conventional_ui:
    - customer_roster
    - offer_catalog
    - queue_status_board
    - approval_queue
    - staff_capability_matrix
    - schedule_capacity_view
    - integration_credential_status
    - sla_outcome_dashboard
    - exception_dispute_queue
    - audit_transcript_search
    - policy_escalation_configuration
    - source_inventory
    - evidence_claim_table
    - workflow_definition_packet
    - best_practice_gap_matrix
    - migration_backlog
    - consent_acknowledgement_register
    - cutover_checklist

starter_workflows:
  - id: offer_setup
  - id: customer_onboarding
  - id: request_intake
  - id: eligibility_fit_check
  - id: scope_configuration
  - id: approval_routing
  - id: delivery_fulfillment
  - id: customer_communication
  - id: exception_handling
  - id: outcome_review
  - id: renewal_lifecycle
  - id: installation_discovery
  - id: workflow_migration

memory_buckets:
