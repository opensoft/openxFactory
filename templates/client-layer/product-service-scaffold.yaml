schema_version: 1
kind: xfactory_client_hermes_product_service_scaffold

template:
  id: client_product_service_scaffold
  name: Client Hermes Product And Service Scaffold
  description: >
    Reusable client-layer scaffold for operating organizations that sell,
    deliver, support, or manage products, services, subscriptions, managed
    services, marketplace offers, projects, engagements, or hybrid offers.

offer_shapes:
  - id: product
    models:
      - catalog_item
      - variant
      - entitlement
      - configuration
      - fulfillment
      - activation
      - warranty_or_return
      - support_policy
  - id: service
    models:
      - scope
      - intake_requirements
      - assignment
      - schedule
      - capacity
      - deliverable
      - sla
      - completion_criteria
      - follow_up
  - id: productized_service
    models:
      - package
      - fixed_inputs
      - fixed_outputs
      - turnaround
      - escalation_path
  - id: subscription
    models:
      - plan
      - term
      - entitlement
      - usage
      - renewal
      - cancellation
      - expansion
  - id: managed_service
    models:
      - monitored_asset
      - standing_approval_envelope
      - service_window
      - incident_class
      - change_class
      - escalation_contact
  - id: marketplace_offer
    models:
      - supplier
      - listing
      - eligibility
      - routing
      - dispute_path
  - id: outcome_based_offer
    models:
      - target_outcome
      - measurement_method
      - intervention_class
      - proof_requirement
      - review_cadence

client_layer_objects:
  - client_profile
  - offer_catalog
  - customer_roster
  - operating_policy
  - integration_map
  - staff_capability_map
  - approval_matrix
  - escalation_map
  - communication_policy
  - outcome_dashboard
  - client_infrastructure_liaison

# Neutral coordination profile for privileged infrastructure dependencies on a
# client tenant, a contracted managed host, or OpsxFactory. Composed from the
# roles below (never a new always-running agent); domain scaffolds may set a
# display alias that resolves to this same neutral contract. Governing doc:
# docs/client-infrastructure-liaison.md. Request/readiness contracts:
# contracts/schemas/xfactory-client-infrastructure-request.schema.yaml and
# contracts/schemas/xfactory-infrastructure-readiness-result.schema.yaml. The
# liaison coordinates only: it never holds tenant-administration authority,
# never executes privileged change, and never stores secrets.
client_infrastructure_liaison:
  present: true
  default_state: configured_but_inactive
  composed_from:
    - client_profile_steward
    - integration_credential_steward
    - policy_approval_gatekeeper
    - fulfillment_delivery_coordinator
    - communication_handoff_agent
    - quality_outcome_monitor
    - client_memory_steward
  # Display alias resolving to this neutral contract, e.g. Care / Firm /
  # Marketing / Engineering / IT Infrastructure Liaison. null = neutral name.
  domain_alias: null
  # REQUIRED even when active routing is disabled: an install must still name a
  # responsible operator and an escalation path (scaffold validation fails
  # otherwise).
  responsible_operator: null
  escalation_path: []
  # Blocks install activation when any declared component needs an external
  # operator and the activation_gate below is unsatisfied.
  activation_blocking: false
  supported_execution_bindings:
    - client_managed        # MUST-support
    - opsxfactory_executed  # MUST-support
    - managed_host          # SHOULD-support (named-host scope only, never the tenant)
  # Activation gate: defaults are configured-but-inactive; a liaison activates
  # only when every field below is satisfied and one failure-and-recovery
  # scenario has been exercised.
  activation_gate:
    operating_model: null            # client_managed | managed_host | opsxfactory_executed
    accountable_owner: null
    execution_authority: null
    approval_authority: null
    primary_coordination_path: null
    out_of_band_recovery_path: null  # MUST NOT depend on the managed dependency itself
    validation_profiles: []
    trusted_validators: []
    response_target: null
    restoration_target: null
    escalation_target: null
    failure_and_recovery_scenario_exercised: false

# Plane-1 house team: the decider personas + house style live in
# templates/client-layer/roles/ (10 deciders + the liaison capability;
# add-client-layer-tuning-contracts). The stewards below are Plane-2 workers
# the deciders direct.
agent_scaffold:
  - id: client_profile_steward
    purpose: maintain client identity, tenant boundaries, operating units, and supported customer kinds
  - id: offer_catalog_steward
    purpose: model products, services, subscriptions, bundles, eligibility, scope, deliverables, and entitlements
  - id: customer_relationship_steward
    purpose: maintain customer roster, relationship status, onboarding, offboarding, entitlement state, and account context
  - id: intake_and_triage_agent
    purpose: convert requests into the right offer, workflow, risk class, and required context
  - id: configure_quote_scope_agent
    purpose: scope a product, service, plan, engagement, or workflow package before approval or delivery
  - id: fulfillment_delivery_coordinator
    purpose: track assignment, schedule, capacity, deliverables, status, and completion criteria
  - id: policy_approval_gatekeeper
    purpose: apply client policy, local approval rules, service boundaries, and stricter-than-domain gates
  - id: integration_credential_steward
    purpose: track systems, credential bindings, tool permissions, grant readiness, and integration health
  - id: staff_capability_routing_agent
    purpose: map staff roles, licenses, permissions, availability, and escalation contacts to allowed work
  - id: communication_handoff_agent
    purpose: draft customer updates, internal handoffs, escalation notes, and next-step explanations
  - id: quality_outcome_monitor
    purpose: track SLA, quality, exceptions, outcome measures, complaint signals, and follow-up triggers
  - id: renewal_expansion_retention_agent
    purpose: monitor renewals, lifecycle events, expansion, cancellations, and service continuity
  - id: exception_dispute_agent
    purpose: handle blocked work, disputes, returns, failed service delivery, policy conflicts, and complaints
  - id: client_memory_steward
    purpose: decide what becomes client-level memory, customer-private memory, or domain-learning candidate
  - id: source_inventory_agent
    purpose: catalog approved document, email, ticket, CRM, calendar, and collaboration sources for installation discovery
  - id: workflow_definition_agent
    purpose: convert source-backed current-state evidence into workflow definition packets
  - id: practice_gap_auditor
    purpose: compare observed current practice with domain standards, client policy, security, and customer-facing expectations
  - id: migration_planner_agent
    purpose: produce containment, dual-run, cutover, retirement, and drift-monitoring plans
  - id: consent_adoption_gatekeeper
    purpose: collect workflow-change consent and block cutover when approval or acknowledgement is missing
  - id: cost_reporting_steward
    purpose: roll task and sub-project spend up to the Finance & Accounting Officer at the tenant-set tracking granularity; flag envelope breaches (cost-accountability model)

skill_scaffold:
  - id: offer_modeling
  - id: eligibility_and_fit
  - id: intake_and_scope
  - id: configuration_and_entitlement
  - id: routing_and_assignment
  - id: approval_packet_preparation
  - id: delivery_coordination
  - id: customer_communication
  - id: integration_readiness
  - id: quality_and_outcome_monitoring
  - id: exception_handling
  - id: renewal_and_lifecycle
  - id: source_inventory
  - id: workflow_trace_reconstruction
  - id: workflow_definition_packet
  - id: practice_gap_analysis
  - id: migration_plan_design
  - id: workflow_change_consent

user_interaction_scaffold:
