# docs/opendox-carve-manifest.yaml — FLOOR PART 1 of the RULED four-part floor
# for the openDox/openXdox carve (`split-opendox-two-layer-product` § 3.1, § D6;
# RULING OQ-1, `#656` comment `5547060378`).
#
# THE RULING'S OWN SENTENCE IS THE WHOLE POINT OF THIS FILE: "a file in no row,
# or an edit in no class, is an UNDECLARED MOVEMENT and the carve REFUSES."
# It is checked by `scripts/validate-carve-manifest.py`, driven on every
# required-suite pass by `tests/carve_manifest/test_carve_manifest.py`.
#
# HOW TO VERIFY IT. From any checkout that carries `carve_commit` in its
# history, either invocation answers:
#
#     python3 scripts/validate-carve-manifest.py
#     python3 scripts/validate-carve-manifest.py --at b075fd91dc8fced8e1373825ba80220c33536bae
#
# THE SECOND ONE STOPS ANSWERING THE DAY `phase:` BELOW FLIPS TO `post-shed`:
# at the carve commit every source path is PRESENT, which is exactly what a
# post-shed manifest refuses (`carve-shed-incomplete`). From that commit on,
# ask about the carve's own line by checking out a pre-shed revision, or read
# the digests straight out of git
# (`git cat-file blob b075fd91:<path> | sha256sum`).
#
# As first landed, check 2 asked whether the tested revision RESOLVES TO
# `carve_commit`, so only a checkout of the carve commit itself could pass and
# every other revision — a branch carrying the manifest, `main` after this
# landed, CI's synthetic merge ref — refused `carve-revision-mismatch`. That was
# a DEFECT IN CHECK 2, recorded on `#656` in the carve-commit ceremony comment
# (2026-09-09T19:33Z) and repaired by § 3.1 part 1b, which re-reads check 2 as
# "`carve_commit` is an ANCESTOR of the tested revision", compares each moved
# row's blob at BOTH revisions in check 3, and walks the surface at the tested
# revision in check 4. With 1b landed the no-argument run answers from any
# descendant of the carve commit, and `--at <sha>` remains how you ask about one
# revision in particular. This manifest lives under `docs/`, outside the
# surface, so its own landing never trips check 4's walk.
#
# THIS IS THE FIRST MACHINE-VALIDATED YAML UNDER `docs/` IN THIS REPOSITORY, and
# that is a deliberate break with the convention, not an oversight. Measured
# 2026-09-08, BEFORE this file existed: `find docs -name '*.yaml'` returned 0.
# Rerun it after this landed and it returns exactly one path — this file — which
# is the break being recorded, not a contradiction of it. Every other
# `schema_version`/`kind` artifact with a validator lives under `contracts/`,
# `examples/`, `tests/**`, `governance/` or `health/`. § 3.1 and design § D6 name
# `docs/opendox-carve-manifest.yaml` verbatim and Brett Heap RULED OQ-E on
# 2026-09-09 to honour the ruled path; the break is recorded here rather than
# corrected.
#
# THE ROW GRAMMAR is the release-digest inventory's
# (`contracts/releases/release-digest-inventory.schema.yaml:19-42`) so a reader
# of one document already knows how to read the other, with two divergences the
# scout memo § 1.2 chose and this file keeps: the digest field is
# `sha256: "<64 hex>"` rather than `digest: sha256:<hex>`, and `edits:` carries
# `{class, lines[]}` rather than a bare class string — the line numbers at the
# carve commit are what make `moved_with_declared_edit` falsifiable at the
# destination instead of a label. A moved row may additionally carry
# `also_replicated_to:` and a `replicated_at_destination` row may carry
# `edits:`, both RULED Q-L7 (a) and both explained below.
#
# THE THREE JUDGEMENTS THAT DECIDE MOST ROWS, all ruled on `#656` 2026-09-09:
#
#   * EDIT CLASSES (RULING OQ-1, verbatim and closed at three). Reserve
#     `path constants` for PACKAGE-INTERNAL asset and module paths (`cli.py:106`
#     `WEB_DIR`, `serve.py:1661` `--web-dir`, `gate_console.py:567`'s
#     `parents[2]` arithmetic). A CORPUS-SHAPED literal — `workbench.py:82-83`'s
#     `ideation/workbench/`, `corpus_root.py:43`'s `openspec` — is an
#     `adapter calls` edit, because the ruled answer is that the corpus tells you
#     its layout through `resolve`; filing it as a path constant would let
#     openDox ship openxFactory's tree shape as a literal, which is
#     `corpus-adapter-seam` requirement 4's failure exactly.
#   * TEST HOMES (RULED OQ-G). A MIXED openDox+openXdox test file's default home
#     is openXdox — lawful there, because openXdox pins openDox; unlawful in
#     openDox, which pins nothing. openDox keeps the import-clean files and the
#     front-end files. Measured over all 157 files at the carve commit, that rule
#     places 70 of them (68 test modules and two fixtures) at openXdox, where a
#     naive per-file reading would have sent most of them to openDox. It does NOT reach a file that also imports the STAYS column: those
#     are openxFactory's own adapter tests (`tasks.md` § 5.4, RULING DQ-1) and
#     exist at no destination, so they carry `not_moved` rows.
#   * WHAT "REPLICATED" MEANS (RULED OQ-A and OQ-C). The disposition list stays
#     three; the `not_moved` REASON carries the nuance. A neutral module
#     (`scripts/output_boundary.py`, `scripts/path_slug.py`,
#     `scripts/wire_messages.py`), the two § 2.4 EXTENSION-POINT SEAMS
#     (`scripts/route_extension.py`, `scripts/subcommand_extension.py`, added
#     under RULING Q-L1 on 2026-09-10) and the § 3.7 conformance corpus are
#     `not_moved / replicated_at_destination` — a replica at each destination,
#     never a shared module across a repository boundary with no pin. A file
#     CREATED at a destination gets no row at all:
#     this manifest declares what LEAVES, not what the destination assembles.
#     RULED Q-L7 (a) (2026-09-10) adds the two shapes the three dispositions
#     could not spell — a MOVED row that is also replicated somewhere, and a
#     replica that must differ on a declared line — WITHOUT touching the
#     disposition list, which stays three: `also_replicated_to:` is a field on a
#     moved row and `edits:` on a replica row, neither of them a fourth
#     disposition and neither of them a placement.
#
# TWO GRAMMAR EXTENSIONS, RULED Q-L7 (a) (Brett Heap, 2026-09-10, verbatim
# "rule Q-L7 (a)"; `#656` comment `5618683833`). Carve leg 1 landed and measured
# two facts the row grammar could not hold — a row was either MOVED or
# REPLICATED, and a replica was byte-identical and declared no line — and both
# are about the SAME pair of test-layout files, so the ruling amends the grammar
# once:
#
#   * `also_replicated_to: [<destination key>, …]` ON A MOVED ROW. The row's
#     bytes MOVE to its `destination` and are ALSO replicated, on RULED OQ-A's
#     terms, at every destination the list names. It carries NO arrival path:
#     placement is the leg's (RULED OQ-C) and is declared to
#     `scripts/verify-carve-arrival.py` with `--replica-at`, which is why the
#     completeness check's arrivals map is untouched by it. The row here is
#     `tests/ideation-dashboard/session_fixtures.py`, a moved row to
#     `opendox_code` that the replicated `tests/ideation-dashboard/conftest.py`
#     imports UNCONDITIONALLY at `:106` — so collecting `tests/` at openXdox-code
#     would have failed at import, on a file no row placed there.
#   * `edits:` ON A `replicated_at_destination` ROW, applied identically at
#     every replica, with the lines bounded by the SOURCE BLOB at the carve
#     commit exactly as a moved row's are. The row here is that same
#     `conftest.py`, whose `:25` `REPO_ROOT = HERE.parent.parent` must read
#     `HERE.parent` because the replica arrives one directory shallower. Under
#     every OTHER `not_moved` reason `edits:` is still the refusal it was: the
#     bytes arrive nowhere, so there is no replica for a line to be applied at,
#     which is why RULING OQ-B's three `stays_openxfactory_governance` rows go
#     on recording their import rewrite in `evidence:`.
#
# THIS IS NOT RULING OQ-K'S OWED FLOOR PART 2 FIELD, and the two must not be
# read as one. Design § D6 (2) clause (b) owes FLOOR PART 1 a field on a
# TEST-BEARING replica row naming the set of REPOSITORIES its copies land in
# — including the retained openxFactory one — so that
# `Σ over replicated rows of (m − 1) × row_test_count` is computable; the packet
# spells no name for it and its enumeration currently lives in the amendment
# record's prose. Both files this ruling touches carry ZERO `def test_` at the
# carve commit (measured), so neither enters that Σ and this amendment realizes
# neither clause. `also_replicated_to:` names `destinations:` KEYS for arrival
# admission; the owed field names repositories for an arithmetic. One row could
# carry both without either meaning the other.
#
# `not_moved_reasons:` declares FOUR of the validator's known five.
# `superseded_by_split` is absent because it is unused: measured at the carve
# commit, each of the three pre-carve splits (S-1 #837, S-2 #836, S-3 #835) left
# its source file in place — slimmed or re-exporting — and deleted nothing, so no
# file at this commit is superseded by a split part.
#
# RE-CUTTING. If `main` moves under the carve, this file is re-cut at a NEW
# `carve_commit` and every digest is RECOMPUTED, never carried forward
# (`contracts/openxwallet-pin.yaml:72-74`'s own sentence, scout memo § 6).

schema_version: 1
kind: opendox-carve-manifest

# WHICH SIDE OF THE SHED THIS REPOSITORY IS ON. `phase:` is OPTIONAL and closed
# to two values — `carve` (what an ABSENT key means) and `post-shed`. The
# validator takes these semantics from HERE and from nowhere else: there is
# deliberately no `--phase` flag, because the § 8.2 required-suite seat runs
# the tool with no arguments and a flag could never reach it, and because the
# declaration and the deletions must then land in ONE reviewable diff.
#
# Under `carve` — where this file is now, and stays until runbook § 5.2 runs —
# every one of the 456 rows' source paths must be PRESENT in this repository,
# and every MOVED row's blob here must still match its `sha256` below.
#
# Under `post-shed` the 318 MOVED rows and the one `deleted_at_carve` row — 319
# of the 456 — are EXPECTED ABSENT at the source, and the validator CHECKS that
# absence rather than refusing it. Nothing else moves: `carve_commit` stays
# `b075fd91…`, `carve_tag` stays `opendox-carve-0`, every `sha256` below is
# still recomputed on every run out of this repository's own history — which
# the shed does not touch — and every `stays_*` and `replicated_at_destination`
# row is still required PRESENT. It is not a re-cut, and no row changes
# disposition.
#
# The declaration is SYMMETRIC, which is what makes it a floor and not a mute:
# under `post-shed` a moved row this tree STILL CARRIES refuses
# `carve-shed-incomplete`. So the flip cannot land ahead of the deletions to
# buy silence for 319 rows at once, and the deletions cannot land ahead of the
# flip without refusing — they are ONE ACT (runbook § 8).
phase: post-shed

header: >-
  The openDox/openXdox carve manifest, authored AT the carve commit as the last
  thing on that tree (scout memo § 6 step 3). The referent is the 40-hex
  `carve_commit:` below; `carve_tag:` is a HUMAN LABEL beside it and never the
  referent. Read the comment block at the top of this file for the three
  judgements that decide most rows and for the record of RULED OQ-E's
  convention break.

carve_commit: "b075fd91dc8fced8e1373825ba80220c33536bae"
carve_tag: opendox-carve-0
source_repository: opensoft/openxFactory
digest_algorithm: sha256
digest_source: raw_git_blob
path_order: bytewise_utf8

# CLOSED. A row's `destination` is a KEY here, because one typo otherwise ships
# a file to a repository nobody declared. `opendox_root` is declared and carries
# NO rows: the assembly root is where `dox-v1.0` is CUT (§ 3.8), and a tag cut
# there is not a file that leaves here.
destinations:
  opendox_code: {repository: opensoft/openDox-code, leg: code}
  opendox_root: {repository: opensoft/openDox, leg: assembly}
  opendox_spec: {repository: opensoft/openDox-spec, leg: spec}
  openxdox_code: {repository: opensoft/openXdox-code, leg: code}
  openxdox_spec: {repository: opensoft/openXdox-spec, leg: spec}

# RULED OQ-1, verbatim and in order. Three, not four.
edit_classes: [import rewrites, path constants, adapter calls]

not_moved_reasons:
  - stays_openxfactory_adapter
  - stays_openxfactory_governance
  - deleted_at_carve
  - replicated_at_destination

# THE SURFACE the completeness check walks: every file under a prefix here
# appears in EXACTLY one row below, or the carve refuses. The tree prefixes are
# `tasks.md` § 5.2's deletion set; the exact paths are the files a RULING names
# individually (OQ-A's three neutral modules, OQ-C's shared conformance tooling,
# OQ-B's three NotebookLM tests, OQ-Q's corpus-adapter interface, RULING Q-L1's
# two § 2.4 extension-point seams, the dashboard contract schemas and the
# dashboard governance documents).
