    evidence: "RULING Q-L1 (Brett Heap, 2026-09-10, `#656` comment `5611834121`, verbatim \"rule Q-L1 approve\") on the manifest act carve leg 1 asked for: the ROUTE EXTENSION POINT of `split-opendox-two-layer-product` § 2.4 / design § D2 had no row at all, so `--replica-at` refused to place it and `--allow-created` would have called an openxFactory blob a destination's own creation — an undeclared movement wearing RULED OQ-C's name. THIS IS OQ-Q'S SHAPE EXACTLY (`scripts/corpus_adapter.py`, ruled 2026-09-09 ~22:3xZ): the § 3.1 surface omitted a neutral module at the top of `scripts/` that both sides of the carve consume, and the repair is the row, not an edit to the leg. The disposition is RULED OQ-A's and not a move, because openxFactory keeps needing the seam after the carve: measured at the carve commit its importers are `scripts/ideation_dashboard/serve.py:120` (this manifest's `opendox_code` row), `serve_gate.py:44` and `serve_projection.py:51` (`openxdox_code` rows), and `serve_openxfactory_lanes.py:49`, `tests/ideation-dashboard/test_route_extension.py:51` and `test_serve_column_split.py:56` (three `not_moved / stays_openxfactory_adapter` rows that stay here) — three destinations plus the home column, so no single destination can own it. Every one of those is a BARE top-level `import route_extension` on a line no row declares, which is the spelling the module's own docstring asks for (:19, \"it travels with the carve\") and the reason its arrival needs no import rewrite. It is neutral BY CONSTRUCTION at the carve commit — 555 lines importing only the standard library (:141 `__future__`, :143 `dataclasses`, :144 `typing`) — and both repositories are Apache-2.0, so each destination gets a replica rather than a shared module across a repository boundary with no pin. Its blob at `carve_commit` is `34802071d5b9e417f6c29c6929db69f518f91cce`, 30,017 bytes, mode 100644, sha256 `a39a6489b4421ce08ef41e918aea21fc35779ee4da5e932182b4d731bc99566f`; a `replicated_at_destination` row carries no digest field by the row grammar, so the figure is recorded here and re-derivable with `git cat-file blob b075fd91dc8fced8e1373825ba80220c33536bae:scripts/route_extension.py | sha256sum`. PLACEMENT IS THE LEG'S AND CARRIES NO `destination` KEY (RULED OQ-C: this manifest declares what LEAVES, never what a destination assembles), but this row RECOMMENDS it, because the importers constrain it and the leg cannot rewrite them: place the copy at `src/route_extension.py`, ON the destination's `src/` import root and BESIDE the package — the mirror of `scripts/route_extension.py` sitting beside `scripts/ideation_dashboard/` here — and NOT inside `src/opendox/`. Measured in leg 1's own tree at `cfabe3c4`, the arrived importer is `src/opendox/serve.py:117` (source `:120`; the line moved by three because the leg deleted the declared `:109-111` shim), still spelled `import route_extension` and on a line no row declares, so a copy inside the package would need an import rewrite this manifest does not authorize while a copy on the import root resolves unedited. Declare the placement to the arrival verifier with `--replica-at scripts/route_extension.py=src/route_extension.py`. Inverting the openDox -> openXdox import direction so this seam replaces the cross-column reach is the BUILD arc's (§ 3.5/3.6), not this row's."
