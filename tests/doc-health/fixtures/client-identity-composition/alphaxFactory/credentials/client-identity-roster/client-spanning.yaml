# `undeclared-cross-domain-reach`, the reaching half: alpha owns
# business_central and its declared_excess spans exchange, but alpha publishes
# NO entry for exchange in this client — while beta does. Intra-repo the excess
# is declared, bound to a gate obligation that resolves, and tested, so the
# blocking gate is green; only composition makes the reach visible. Because the
# breadth is DECLARED under a ratified capability, curing the finding would
# reverse a ratified fact, which is why it carries the contested class.
schema_version: 1
kind: xfactory_client_identity_roster
client_ref: client-spanning
client_tenant: 10000000-0000-0000-0000-000000000003
domain: alphaxfactory
legend:
  blast_radius_units:
    unit_a: Unit A environment
  duties:
    observing: Read-only observation
entries:
  - identity_ref: alpha-bc-and-exchange-observer
    identity_kind: entra_app_registration
    home_tenant: 10000000-0000-0000-0000-000000000003
    principal_locations:
      - 10000000-0000-0000-0000-000000000003
    residency_model: client_tenant_single
    admission_surface: business_central
    duty: observing
    blast_radius_unit: unit_a
    authority_class_intended: observe
    authority_class_achieved: observe
    granted_permissions:
      - id: Alpha.ReadAcross.All
        achieves: observe
        reaches: [business_central, exchange]
    admission:
      - surface: business_central
        act: per-environment application user created
        achieved_scope: Unit A environment
        enforcement_mode: provider_enforced
        evidence_ref:
          repo: opensoft/AlphaxFactory
          path: tenants/alpha-admission-evidence-v1.yaml
        verified_at: "2026-08-01T00:00:00Z"
        exceeds_governed_unit: false
      - surface: exchange
        act: application access policy applied
        achieved_scope: Unit A shared mailbox
        enforcement_mode: provider_enforced
        evidence_ref:
          repo: opensoft/AlphaxFactory
          path: tenants/alpha-exchange-admission-evidence-v1.yaml
        verified_at: "2026-08-01T00:00:00Z"
        exceeds_governed_unit: false
    per_unit_principal_available:
      business_central: true
      exchange: true
    lifecycle_state: enrolled
    standing_credential_attestation:
      no_standing_credential: true
      attested_at: "2026-08-01T00:00:00Z"
    ratified_by: alphaxfactory:alpha-observation-capability
    consent_ref: alpha-consent-v1
    declared_excess:
      provider_reason: >-
        the provider applies its mailbox access policy at the mailbox rather
        than at the environment, so one registration reaches both surfaces
      bound_mechanism: >-
        the alphaxfactory observation workflow refuses any target outside the
        governed unit
      gate_obligation: alpha_out_of_unit_refusal
      enforcement_test_ref: tests/alpha/test_out_of_unit_refusal.py
      spanned_surfaces:
        - exchange
