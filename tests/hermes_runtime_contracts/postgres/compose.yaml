services:
  postgres:
    image: "${POSTGRES_IMAGE:?a digest-pinned PostgreSQL image is required}"
    environment:
      POSTGRES_DB: hermes_runtime_contracts
      POSTGRES_USER: hermes_runtime
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?an ephemeral password is required}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes_runtime -d hermes_runtime_contracts"]
      interval: 1s
      timeout: 5s
      retries: 30
    network_mode: none
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../..:/workspace:ro
volumes:
  postgres-data: {}
