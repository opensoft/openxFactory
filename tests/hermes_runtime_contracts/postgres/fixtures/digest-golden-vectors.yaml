# Frozen golden vectors for the ratified `xfactory-v1-dataset-binary-v1`
# digest profile (requirement "v2 persistence coexists with v1 and migrates
# atomically", capability hermes-governed-record-integrity).
#
# Provenance: NONE of the expectations below were generated by
# scripts/hermes_runtime_validation/migration.py (the implementation these
# vectors validate).  The `smallest-single-row` vector is hand-derived
# byte-by-byte from the ratified framing text in the comment below; the
# remaining vectors were derived with an independent clean-room framer
# written directly from the same ratified text and cross-checked against the
# hand derivation.  SHA-256 values were computed from the derived bytes with
# stock hashing tools.
#
# Byte-by-byte hand derivation of `smallest-single-row`
# (dataset: schema "s", table "t", one non-null text column "a" at ordinal 1
# with primary_key_position 1, one row with value "x"):
#
#   magic/version           58 46 56 31 44 53 00 01      ASCII "XFV1DS" || 00 01
#   table frame, tag 10; every frame is tag:u8 || payload_length:u64be || payload
#     payload length = 139 = 0x8b (computed bottom-up below)
#                           10 00 00 00 00 00 00 00 8b
#     schema-name frame 11, payload UTF-8 "s" (1 byte):
#                           11 00 00 00 00 00 00 00 01 73             (10 bytes)
#     table-name frame 12, payload UTF-8 "t":
#                           12 00 00 00 00 00 00 00 01 74             (10 bytes)
#     column-count frame 13, payload u64be 1 (8 bytes):
#                           13 00 00 00 00 00 00 00 08
#                           00 00 00 00 00 00 00 01                   (17 bytes)
#     column frame 14, payload = ordinal:u64be || nullable:u8 ||
#     primary_key_position:u64be || name frame 15 || type frame 16
#       ordinal 1:          00 00 00 00 00 00 00 01                   (8 bytes)
#       nullable false:     00                                        (1 byte)
#       pk position 1:      00 00 00 00 00 00 00 01                   (8 bytes)
#       name frame 15 "a":  15 00 00 00 00 00 00 00 01 61             (10 bytes)
#       type frame 16 "text":
#                           16 00 00 00 00 00 00 00 04 74 65 78 74    (13 bytes)
#       payload = 8+1+8+10+13 = 40 = 0x28:
#                           14 00 00 00 00 00 00 00 28 <40 bytes>     (49 bytes)
#     row-count frame 17, payload u64be 1:
#                           17 00 00 00 00 00 00 00 08
#                           00 00 00 00 00 00 00 01                   (17 bytes)
#     row frame 20, payload = one column frame 21 per schema ordinal;
#     21 payload = ordinal:u64be || value frame; value frame = text tag 31
#       value frame "x":    31 00 00 00 00 00 00 00 01 78             (10 bytes)
#       21 payload = 8+10 = 18 = 0x12:
#                           21 00 00 00 00 00 00 00 12
#                           00 00 00 00 00 00 00 01
#                           31 00 00 00 00 00 00 00 01 78             (27 bytes)
#       20 payload = 27 = 0x1b:
#                           20 00 00 00 00 00 00 00 1b <27 bytes>     (36 bytes)
#     table payload total = 10+10+17+49+17+36 = 139 = 0x8b; table frame =
#     9 + 139 = 148 bytes; full stream = 8 + 148 = 156 bytes.
#   SHA-256 over magic/version plus the complete ordered table frame equals
#   the `expected_stream_sha256` recorded on the vector.
#
# Coverage notes for the other vectors:
# - every-value-tag: all value tags 30-36 (null in a nullable column, text
#   with non-ASCII and astral code points, empty string, raw control byte 0a
#   inside a text frame, minimal negative/zero integers with int4/int8 range
#   extremes, both boolean bytes, six-fractional-digit UTC timestamps, empty
#   and non-empty lowercase-hex binary, JSON with raw-UTF-8 key sorting,
#   quote/backslash escapes, `-0` normalized to `0`, and a control character
#   inside a JSON string proving the lowercase six-character backslash-u0000
#   style escape (LF renders as backslash + "u000a", visible in the expected
#   hex as bytes 5c 75 30 30 30 61) — never the `\n` short escape, per
#   integration decision D2).  The framed-primary-key row sort
#   places integer "-5" (payload byte 2d...) before "10" (31...).
# - composite-pk-framed-order: primary_key_position order (p:1 then g:2)
#   deliberately differs from schema-ordinal order (g, p), and the row whose
#   first key value frames as text "b" (payload length u64be 1) sorts BEFORE
#   rows framing "aa" (payload length u64be 2) because rows sort bytewise by
#   the concatenation of complete framed key value frames — the u64be length
#   bytes dominate — even though raw "aa" < "b" lexicographically.  Two rows
#   share the first key frame "aa" to prove the second key frame tie-break
#   ("m" before "z").
# - table-order-raw-utf8: tables sort by raw UTF-8 (schema, table) bytes, so
#   "z" (7a) precedes "é" (c3 a9); both tables carry zero rows.
# - empty-twelve-table: the exact twelve canonical v1 tables of the pinned
#   contract contracts/schemas/hermes-operational-postgres.sql (DDL column
#   order = schema ordinals, v1 type normalization integer->int4,
#   boolean->bool, text/timestamptz/jsonb unchanged) with zero rows each.
schema_version: 1
kind: xfactory-v1-dataset-golden-vectors
vectors:
- vector_id: smallest-single-row
  dataset:
    schema_version: 1
    kind: xfactory-v1-dataset-description
    source_schema: s
    tables:
    - schema_name: s
      table_name: t
      columns:
      - {name: a, normalized_type: text, nullable: false, primary_key_position: 1}
      rows:
      - - type: text
          value: "x"
  expected_stream_hex: ""
  expected_stream_sha256: "sha256:9ea7dbc274ae30f33531bf92570ad675814aedbf013b75857c11819d04cda037"
  expected_table_frame_digests:
    "s.t": "sha256:acfb0edfe93a2feb768f5122e2470b2fc8c21d31b446fc011b69fd84cf7ce108"
- vector_id: every-value-tag
  dataset:
    schema_version: 1
    kind: xfactory-v1-dataset-description
    source_schema: public
    tables:
    - schema_name: public
      table_name: value_tags
      columns:
      - {name: id, normalized_type: int8, nullable: false, primary_key_position: 1}
      - {name: note, normalized_type: text, nullable: true, primary_key_position: 0}
      - {name: empty, normalized_type: text, nullable: false, primary_key_position: 0}
      - {name: flag, normalized_type: bool, nullable: false, primary_key_position: 0}
      - {name: seen, normalized_type: timestamptz, nullable: false, primary_key_position: 0}
      - {name: blob, normalized_type: bytea, nullable: false, primary_key_position: 0}
      - {name: meta, normalized_type: jsonb, nullable: false, primary_key_position: 0}
      - {name: small, normalized_type: int4, nullable: false, primary_key_position: 0}
      - {name: ctl, normalized_type: text, nullable: false, primary_key_position: 0}
      rows:
      # Listed intentionally out of digest order: the framed-primary-key sort
      # must place id "-5" (2d 35) before id "10" (31 30).
      - - type: integer
          value: "10"
        - type: text
          value: "héllo 🚀"
        - type: text
          value: ""
        - type: boolean
          value: true
        - type: timestamp
          value: "2026-07-01T00:00:00.000000Z"
        - type: binary
          value: "00ff10"
        - type: json
          value:
            b: 1
            a:
            - true
            - null
            - "q\"uote\\slash"
            "€": "line\nbreak"
            # -0 parses to integer zero; canonical JSON must render `0`.
            zero: -0
        - type: integer
          value: "0"
        - type: text
          # Raw LF byte 0a inside a text value frame: framed as raw UTF-8,
          # never escaped (escaping applies only to tag-36 JSON payloads).
          value: "a\nb"
      - - type: integer
          value: "-5"
        - type: null
        - type: text
          value: ""
        - type: boolean
          value: false
        - type: timestamp
          value: "2026-07-12T23:59:59.999999Z"
        - type: binary
          value: ""
        - type: json
          value: []
        - type: integer
          value: "-2147483648"
        - type: text
          value: "c"
  expected_stream_sha256: "sha256:8a12b7b80d4d4e3b3ef743f348ded173e91a280f5f29319626a7c924890fe540"
  expected_stream_hex: ""
  expected_table_frame_digests:
    "public.value_tags": "sha256:87985a8bbc56f91b3b827c80659c054f3d765b4a717a0328890e00db3bbe88b7"
- vector_id: composite-pk-framed-order
  dataset:
    schema_version: 1
    kind: xfactory-v1-dataset-description
    source_schema: public
    tables:
    - schema_name: public
      table_name: composite
      columns:
      # Schema ordinal order (g, p, val) deliberately differs from
      # primary-key-position order (p at position 1, g at position 2).
      - {name: g, normalized_type: text, nullable: false, primary_key_position: 2}
      - {name: p, normalized_type: text, nullable: false, primary_key_position: 1}
      - {name: val, normalized_type: text, nullable: true, primary_key_position: 0}
      rows:
      # Digest order: ("a","b") first because framed "b" (length 1) sorts
      # before framed "aa" (length 2); then ("m","aa") before ("z","aa") on
      # the second framed key component.
      - - type: text
          value: "z"
        - type: text
          value: "aa"
        - type: text
          value: "row-z-aa"
      - - type: text
          value: "a"
        - type: text
          value: "b"
        - type: null
      - - type: text
          value: "m"
        - type: text
          value: "aa"
        - type: text
          value: "row-m-aa"
  expected_stream_sha256: "sha256:6fcbd38b5a9d9d2b000691b4f8987f2a99a4a6d2a2d59096784c8aea4966dbb7"
  expected_stream_hex: ""
  expected_table_frame_digests:
    "public.composite": "sha256:be21a34efe9c6e5a8fa822469bc323d059bb6e1b85f7e77ea28ba476d4e01d0d"
- vector_id: table-order-raw-utf8
  dataset:
    schema_version: 1
    kind: xfactory-v1-dataset-description
    source_schema: public
    tables:
    # Listed é-first; raw UTF-8 (schema, table) byte order must emit
    # "z" (7a) before "é" (c3 a9).
    - schema_name: public
      table_name: "é"
      columns:
      - {name: id, normalized_type: text, nullable: false, primary_key_position: 1}
      rows: []
    - schema_name: public
      table_name: z
      columns:
      - {name: id, normalized_type: text, nullable: false, primary_key_position: 1}
      rows: []
  expected_stream_sha256: "sha256:96fd0bba0a86869e041f1d2b7c3473c86eb5220664aad0e09c60dac8c4ec3045"
  expected_stream_hex: ""
  expected_table_frame_digests:
    "public.z": "sha256:66be9cc78bc277ba96509782a6695d042e499b4ac73ee858865880bb49e3a8a7"
    "public.é": "sha256:95aa0d15c5ba05f88e52017c360506966f23f762689719ef0429e344e47e0f3e"
