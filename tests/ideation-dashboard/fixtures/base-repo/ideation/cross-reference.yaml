# cl-keyword-lens is intentionally omitted above -> its snapshot name falls back
# to the titleized topic slug ("Keyword Lens").

possibles_register:
  # multi-cluster possible: claimed by cl-doc-health AND cl-ideation-governance
  - id: pos-health-sweep
    title: Semantic health sweep
    claim: A scheduled semantic sweep consolidates contested findings across the corpus.
