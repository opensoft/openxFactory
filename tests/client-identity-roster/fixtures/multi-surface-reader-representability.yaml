    synthetic_unit: "SYNTHETIC — the governed unit this fixture pretends to hold"
  duties:
    cross_surface_reading: "SYNTHETIC — read-only observation spanning two admission surfaces"
entries:
  - identity_ref: synthetic-multi-surface-reader
    identity_kind: entra_app_registration
    home_tenant: 00000000-0000-0000-0000-000000000000
    principal_locations:
