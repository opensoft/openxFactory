# =====================================================================
# SYNTHETIC REPRESENTABILITY FIXTURE — 2026-08-15
# =====================================================================
#
# 1. THIS RECORD IS SYNTHETIC. It is NOT a packaged example, it does not live in
#    `examples/client-identity-roster/`, and IT MUST NOT BE INSTANTIATED FROM.
#    No identity described below exists in any tenant. Every value is a
#    placeholder chosen to exercise a rule, and a domain copying it would be
#    copying a fiction.
#
# 2. WHY IT IS SYNTHETIC RATHER THAN PACKAGED. As of 2026-08-15, NO
#    in-vocabulary provider-forced multi-surface permission exists — that is a
#    measured finding, not an absence of effort, and BOTH halves of the
#    falsification are citable:
#
#      * Business Central offers NO read-only path at all
#        (OpsxFactory openspec/specs/business-central-administration/spec.md
#        lines 93-101: the platform exposes exactly four app-only roles and no
#        read-only admin-center role, so the credential able to read a
#        deployment status is also able to delete an environment); and
#      * Exchange offers a SURFACE-SCOPED read-only path
#        (OpsxFactory openspec/specs/exchange-administration/spec.md lines
#        46-56: `Mail.Read` constrained to exactly one mailbox by an Exchange
#        application access policy, verified by attempted overreach), which
#        falsifies "no read-only role scoped to just one of the two exists"
#        outright.
#
#    A governed packaged example is a TRUTHFUL worked case, so the fourth
#    mandated positive could not be packaged without asserting a provider fact
#    nobody can cite — and a packaged example is an instantiation template a
#    domain copies. Synthesizing one is exactly what this contract exists to
#    forbid.
#
# 3. WHAT IT EXISTS TO PROVE. Killed-flaw (a), REPRESENTABILITY: an entry whose
#    provider-forced reach spans a second admission surface, with that breadth
#    DECLARED, validates with ZERO findings. The ratified requirement is
#    CONDITIONAL — "WHEN the narrowest available permission reaches more than
#    one admission surface…" — so the contract must carry the capability even
#    while no in-vocabulary instance exists, and proving exactly that is this
#    fixture's whole job. It also stands ready for vocabulary growth: when a
#    surface enters with the promotion of the capability that governs it, the
#    shape is already known to work.
#
#    Its discrimination partner is itself: remove `spanned_surfaces[]` and the
#    same record is REFUSED for undeclared reach — which is what proves this
#    fixture measures the rules rather than passing vacuously.
#
# 4. AUTHORIZED BY DECISION C (Brett, 2026-08-15) — the relocation of the
#    fourth packaged case to this fixture, recorded at
#    openspec/changes/add-client-identity-roster/review/amendment-record-2026-08-15b.md.
#    All forced-breadth machinery, every reach rule and every named negative
#    stay exactly as specified; only the CASE moved, and its zero-findings
#    obligation moved with it.
# =====================================================================
schema_version: 1
kind: xfactory_client_identity_roster
