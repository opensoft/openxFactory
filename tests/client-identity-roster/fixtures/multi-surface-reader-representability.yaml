      - id: SYNTHETIC.CrossSurface.Read.All
        achieves: observe
        reaches: [business_central, exchange]
    admission:
      # An admission act on EACH surface: reach needs both keys, and an act on
      # a surface no permission declares is refused just as a permission
      # reaching a surface no act admits to would be.
      - surface: business_central
        act: "SYNTHETIC — per-environment application user created"
        achieved_scope: "SYNTHETIC — the governed unit's environment"
        enforcement_mode: provider_enforced
        evidence_ref:
          repo: opensoft/SyntheticxFactory
          path: fixtures/synthetic-business-central-admission-evidence.yaml
        verified_at: "2026-08-15T00:00:00Z"
        exceeds_governed_unit: false
      - surface: exchange
        act: "SYNTHETIC — application access policy created against a scope group"
        achieved_scope: "SYNTHETIC — the governed unit's mailbox set"
        enforcement_mode: provider_enforced
        evidence_ref:
          repo: opensoft/SyntheticxFactory
          path: fixtures/synthetic-exchange-admission-evidence.yaml
        verified_at: "2026-08-15T00:00:00Z"
        exceeds_governed_unit: false
    declared_excess:
      # THE DECLARATION UNDER TEST. Removing `spanned_surfaces` — and nothing
      # else — turns this record's clean verdict into `undeclared-reach`.
      spanned_surfaces: [exchange]
      # A REPRESENTABILITY PLACEHOLDER, deliberately NOT an asserted provider
