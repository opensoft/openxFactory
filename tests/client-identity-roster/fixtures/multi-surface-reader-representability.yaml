      # item 2 records that no in-vocabulary provider-forced multi-surface
      # permission is citable as of 2026-08-15, so this field states what a
      # real record WOULD have to carry rather than claiming it here.
      provider_reason: >-
        SYNTHETIC PLACEHOLDER — see this file's dated header, item 2. A real
        entry of this shape would carry, verbatim and citable, the provider's
        own statement that the narrowest available permission reaches both
        admission surfaces and that no surface-scoped equivalent exists. No
        such statement is citable within the v1 two-surface vocabulary, which
        is why this record is a fixture and not a packaged example.
      bound_mechanism: >-
        SYNTHETIC PLACEHOLDER — the deterministic surface and per-call evidence
        that would hold the bound the provider does not.
      gate_obligation: synthetic_cross_surface_refusal_gate
      enforcement_test_ref: >-
        SYNTHETIC PLACEHOLDER — the test that would prove the gate refuses a
        target outside the governed unit on either surface.
    per_unit_principal_available:
      # ONE ANSWER PER SURFACE. This is why the field is a MAPPING and not a
      # single boolean: a provider-forced multi-surface identity needs an answer
      # for its own surface AND for every surface it declares as spanned, and a
      # surface it touches with no key at all is its own finding.
      business_central: true
      exchange: true
    lifecycle_state: enrolled
    standing_credential_attestation:
