    residency_model: client_tenant_single
    admission_surface: business_central
    duty: cross_surface_reading
    blast_radius_unit: synthetic_unit
    authority_class_intended: observe
    authority_class_achieved: observe
    granted_permissions:
      # ONE permission reaching BOTH surfaces — the shape the ratified
