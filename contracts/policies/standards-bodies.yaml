      tax, information technology, risk/internal-control, and review work, but
      does not supply exact artifact-agent role labels.
    current_version: framework released 2019; current HKICPA framework page verified 2026-08-09
    status: current
    source_url: https://www.hkicpa.org.hk/en/Membership/For-Professional-Accountants-in-Business/Professional-Development-Framework-for-PAIBs
    term_list_availability: public
    attribution_note: Public HKICPA page; cite HKICPA. No framework-specific open license was verified.
    confidence: high  # Current page, purpose, knowledge areas, competencies, and seniority treatment were verified.

  - id: taiwan_icap_accounting_competency_standards
    jurisdiction: taiwan
    name: 臺灣勞動部 iCAP 會計職能基準 (Taiwan Ministry of Labor iCAP Accounting Competency Standards)
    steward: 勞動部勞動力發展署
    names: competencies
