  - id: apqc_pcf
    name: APQC Process Classification Framework (Cross-Industry)
    steward: APQC
    jurisdiction: international  # US-origin; APQC is based in Houston, Texas
    names: processes
    scope: >-
      A cross-industry hierarchy of business work. PCF 8.0 category 9.0 names
      finance processes relevant to invoice_coder, bookkeeper,
      reconciliation_specialist, close_accountant, tax_preparation_assistant,
      scenario_modeler, books_designer, ledger_platform_specialist,
      controller_reviewer, and compliance_reviewer. Process names describe
      organizational work, not artifact-only authority; approval, payment,
      posting, and filing nodes must not be applied as agent powers.
    crosswalk_scopes:
      - 8.0 Manage Information Technology (IT)
      - 9.0 Manage Financial Resources
    current_version: Cross-Industry PCF 8.0, published 2026-02-27 (licence page verified 2026-08-26)
    status: current
    verified_on: 2026-09-01
    source_url: https://www.apqc.org/resource-library/resource-listing/apqc-process-classification-framework-pcf-cross-industry-pdf-13
    term_list_availability: public  # Download is lead-form gated; public measure pages expose definitions.
    licence_page: >-
      Not a page on apqc.org: the grant is printed inside the artifact, on
      page 2 of the cross-industry PCF PDF under the heading COPYRIGHT AND
      ATTRIBUTION. For the pinned 8.0 the record is Brett's browser reading of
      that page on 2026-08-26, because apqc.org answers HTTP 403 to every
      automated fetch and no 8.0 mirror is public. The automation-verifiable
      copies of the same paragraph are the primary 7.4 PDFs at
      https://solutions.ifrc.org/sites/default/files/2024-10/K014750_APQC%20Process%20Classification%20Framework%20(PCF)%20-%20Cross%20Industry%20-%20PDF%20Version%207.4.pdf
      and
      https://www.business-analysis.com.au/wp-content/uploads/2025/04/K014750_APQC-Process-Classification-Framework-PCF-Cross-Industry-PDF-Version-7.4_January-2025.pdf
      plus 7.3.1 at https://juraguvi.com/data/files/pcf_crossindustry_v7.3.1_september_2023.pdf
      and 7.3.0 at https://www.ospco.net/wp-content/uploads/2022/07/APQC_7_3_ver_1653811220.pdf
      — three independently hosted versions carrying it identically, which is
      why it reads as APQC's standard licence page and not a one-version quirk.
    reuse_licence: >-
      APQC's own in-document grant, NOT a Creative Commons licence: "APQC
      hereby grants you a perpetual, worldwide, royalty-free license to use,
      copy, publish, modify, and create derivative works of the PCF", provided
      all copies and derivative works carry the attribution paragraph.
    redistribution_permitted_in_product_config: yes_with_conditions  # The condition is the attribution paragraph, verbatim, in every copy and derivative work.
    attribution_required: >-
      Reproduce the attribution_note paragraph below VERBATIM and unaltered,
      with its ® marks intact, in every copy of the PCF and in every
      derivative work — a domain overlay embedding PCF element names or
      numbers is a derivative work and must carry it. Process Classification
      Framework® and PCF® are registered marks of APQC; a crosswalk
      references the term and never adopts it as a class identity.
    attribution_note: >-
      APQC's Process Classification Framework® (PCF) is an open standard
      developed by APQC, a nonprofit that promotes benchmarking and best
      practices worldwide. The PCF is intended to facilitate organizational
      improvement through process management and benchmarking, regardless of
      industry, size, or geography. To download the full PCF or
      industry-specific versions of the PCF, as well as associated measures
      and benchmarking, please visit www.apqc.org/pcf.
