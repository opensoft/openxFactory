    # OPERATOR OVERRIDE 2026-09-01: Brett selected product-config permission
    # without written SFIA permission. This is a policy override, not a
    # steward-granted licence conclusion; the official conflict remains above.
    redistribution_permitted_in_product_config: 'yes'
    source_url: https://sfia-online.org/en/about-sfia/licensing-sfia/using-and-licensing-sfia
