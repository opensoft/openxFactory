# Canonical registry of professional standards bodies a domain overlay may
# crosswalk its worker terminology to (add-omnigent-domain-terminology).
#
# Why a registry: five repos writing free-text framework names would drift
# ("itil" / "ITIL v4" / "itil4") the same way the layer vocabulary would have
# without contracts/policies/layer-vocabulary.yaml. Framework ids in an
# overlay's terminology.workers.*.standards_alignment MUST resolve here.
#
# THE LOAD-BEARING FIELD IS `names`. These bodies do NOT all name the same
# kind of thing: some define practices, some processes, some skills, some
# controls, some clinical terminologies. A crosswalk that maps a worker class
# to a PROCESS is making a different claim than one mapping it to a ROLE, and
# conflating them is how a crosswalk quietly overstates what a worker is.
#
# A crosswalk is DESCRIPTIVE ONLY: listing a body here asserts no conformance
# with it, no certification by it, and no endorsement from it. Several bodies
# below hold trademarks in their names; a crosswalk references the term, it
# never adopts it as the class identity.
#
# SOURCING CAVEAT (honest): the ORIGINAL 17 entries and their term spellings
# are drawn from working knowledge, not verified against each body's current
# publication. Before a domain commits a crosswalk, its exact terms and the
# current framework version must be checked against the body's own current
# material — that verification is a task on each domain's follow-up change.
# The Greater China entries at the foot of this file ARE live-source
# verified (2026-08-09) and carry per-entry confidence ratings; the older
# entries do not, and that asymmetry is deliberate rather than hidden.
#
# ENTRY FIELDS. Required: id, name, steward, names, scope, jurisdiction.
# The verified entries additionally carry current_version, status,
# source_url, term_list_availability, and confidence — fields the original
# 17 lack. New entries SHOULD supply the full set; the version fields exist
# because APQC proved category numbers move between framework versions.
#
# JURISDICTION is mandatory on every body. Without it the registry's
# regional coverage is invisible in the data: for its first day this file
# held 17 bodies that were ALL Anglo-American and nothing said so.
schema_version: 1
kind: standards_body_registry
policy_id: standards-bodies-v1

bodies:
  # ---------------------------------------------------------------- cross-domain
  - id: apqc_pcf
    jurisdiction: international  # US-origin (APQC)
    name: APQC Process Classification Framework (Cross-Industry)
    steward: APQC
    names: processes
    scope: >-
      Cross-industry process taxonomy, and the only body here that reaches
      all five domains — which makes it the natural common crosswalk.
      VERSION-SENSITIVE, established by live-source verification 2026-08-09
      (LedgerxFactory china-accounting-bodies-research-report.md): CATEGORY
      NUMBERS MOVE BETWEEN VERSIONS. In current cross-industry PCF 8.0
      `Manage Financial Resources` is category 9.0, whereas the 7.0.5-era
      layout numbered it 8.x — and the public Mandarin PCF remains 7.0.5
      while current English is 8.0. Any crosswalk to this body MUST pin the
      version (and the language, where a translation is used) inside the
      mapping rather than citing a bare category number; the earlier
      unpinned category numbers in this file were themselves an instance of
      the error and are removed above.
    attribution_note: >-
      `Process Classification Framework` and `PCF` carry the registered-mark
      symbol and APQC reserves all rights; reference the name and version
      and comply with APQC terms. Do not assume the public download is
      public-domain or open-licence content.
  - id: sfia
    jurisdiction: international  # UK-origin (SFIA Foundation)
    name: SFIA (Skills Framework for the Information Age)
    steward: SFIA Foundation
    names: skills
    scope: >-
      Internationally adopted IT skills framework (e.g. CHMG change
      management, USUP incident management, PROG programming, TEST testing).
      Skill-shaped rather than role-shaped, which fits worker classes more
      closely than practice frameworks do. Strong fit for opsx and codex.

  # ---------------------------------------------------------------- IT operations
  - id: itil4
    jurisdiction: international  # UK-origin (PeopleCert/Axelos)
    name: ITIL 4
    steward: PeopleCert / Axelos
    names: practices
    scope: >-
      The lingua franca of IT service management (Change Enablement,
      Incident Management, Problem Management, Service Request Management,
      Deployment Management, Release Management, Monitoring and Event
      Management). ITIL 4 names PRACTICES, not roles — a worker class maps
      to the practice it acts within, never to a job title.
    attribution_note: ITIL is a registered trade mark; reference only.
  - id: cobit_2019
    jurisdiction: international  # US-origin (ISACA)
    name: COBIT 2019
    steward: ISACA
    names: governance_and_management_objectives
    scope: >-
      Audit- and governance-facing objectives (e.g. BAI06 Managed IT
      Changes, DSS01 Managed Operations). Useful where the audience is an
      auditor or a governance committee rather than an operator.
  - id: nist_csf
    jurisdiction: united_states
    name: NIST Cybersecurity Framework
    steward: NIST (US)
    names: functions_and_categories
    scope: >-
      Identify / Protect / Detect / Respond / Recover. Public-domain, no
      licensing friction. Fits the security-adjacent reviewer classes.
  - id: iso_iec_20000
    jurisdiction: international
    name: ISO/IEC 20000
    steward: ISO/IEC
    names: service_management_requirements
    scope: Certifiable service-management requirements; formal-assurance audiences.

  # ---------------------------------------------------------------- accounting
  - id: coso_icif
    jurisdiction: united_states
    name: COSO Internal Control — Integrated Framework
    steward: COSO
    names: control_components_and_principles
    scope: >-
      The internal-control body, and the natural home for the
      segregation-of-duties boundary the accounting overlay already makes a
      machine-checkable worker property.
  - id: ima_mac
    jurisdiction: united_states
    name: IMA Management Accounting Competency Framework
    steward: Institute of Management Accountants
    names: competencies
    scope: Competency-shaped; closest accounting analog to SFIA.
  - id: aicpa
    jurisdiction: united_states
    name: AICPA professional standards and competency framework
    steward: AICPA (US)
    names: standards_and_competencies
    scope: >-
      US professional standards and competencies. NOTE the distinction that
      matters here: GAAP (FASB) and IFRS (IASB) are REPORTING standards —
      they govern what the books must say, not what a worker is — so they
      are deliberately NOT registered as worker-crosswalk bodies. Ledgerx's
      reporting-standard grounding already lives in the subject books-design
      layer, not in the worker taxonomy.

  # ---------------------------------------------------------------- marketing
  - id: iab
    jurisdiction: international  # US-origin
    name: IAB / IAB Tech Lab specifications and taxonomies
    steward: Interactive Advertising Bureau
    names: adtech_specifications_and_taxonomies
    scope: >-
      Content Taxonomy, Audience Taxonomy, OpenRTB. Names ad-tech plumbing
      rather than roles — expect it to fit the media/audience classes and
      not the creative or compliance ones.
  - id: ama_marketing
    jurisdiction: united_states
    name: American Marketing Association definitions
    steward: American Marketing Association
    names: concept_definitions
    scope: Canonical concept definitions; useful for job_type and artifact labels.
  - id: cim
    jurisdiction: united_kingdom
    name: CIM Professional Marketing Competencies
    steward: Chartered Institute of Marketing (UK)
    names: competencies
    scope: Competency-shaped; the closest marketing analog to SFIA.

  # ---------------------------------------------------------------- engineering
  - id: swebok
    jurisdiction: international  # US-origin (IEEE CS)
    name: SWEBOK (Software Engineering Body of Knowledge)
    steward: IEEE Computer Society
    names: knowledge_areas
    scope: >-
      Requirements, design, construction, testing, maintenance,
      configuration management, quality. Knowledge-area shaped.
  - id: iso_iec_ieee_12207
    jurisdiction: international
    name: ISO/IEC/IEEE 12207
    steward: ISO/IEC/IEEE
    names: life_cycle_processes
    scope: Software life-cycle processes; formal-assurance audiences.

  # ---------------------------------------------------------------- medical
  - id: nucc_taxonomy
    jurisdiction: united_states
    name: NUCC Health Care Provider Taxonomy
    steward: National Uniform Claim Committee (US)
    names: provider_roles_and_specialties
    scope: >-
      The US provider role/specialty taxonomy. STRONG CAUTION: medical
      Omnigent workers are reasoning agents, not clinicians. Mapping a
      reasoning agent onto a provider role would imply clinician standing
      the worker does not have and must never appear to have, so
      `no_clean_equivalent` is expected to be the honest answer for most
      medical worker classes.
  - id: hl7_fhir_practitionerrole
    jurisdiction: international
    name: HL7 FHIR PractitionerRole and role code systems
    steward: HL7 International
    names: practitioner_roles
    scope: >-
      Interoperability-facing practitioner roles. Same caution as NUCC: it
      describes humans with clinical standing, not agents.
  - id: snomed_ct
    jurisdiction: international
    name: SNOMED CT
    steward: SNOMED International
    names: clinical_concepts
    scope: >-
      Clinical findings and procedures — the CONTENT a medical worker
      reasons about, not what the worker IS. Registered for artifact and
      job_type labels, not for worker-role crosswalks.

  # ------------------------------------------------- Greater China (2026-08-09)
  # Landed from the live-source research report (LedgerxFactory
  # openspec/changes/adopt-neutral-omnigent-overlay/supporting-docs/
  # china-accounting-bodies-research-report.md), which verified each entry
  # against primary sources and carries the crosswalk analysis for the 14
  # artifact-only accounting worker roles.
  #
  # JURISDICTIONS ARE NOT INTERCHANGEABLE. Mainland, Hong Kong, Taiwan and
  # Macau terms must never be substituted for one another even where the
  # English gloss looks identical — hence the jurisdiction field, now carried
  # by every body in this file so the registry's regional coverage is visible
  # in the data rather than implied.
  #
  # Entries are reproduced with the report's own confidence ratings and
  # inline reasoning intact. `gb_t_46704_financial_shared_services` is
  # recommended shared-service GUIDANCE and explicitly NOT a Chinese APQC
  # equivalent: no mainland body matches APQC's full finance hierarchy, and
  # that absence is a finding, not a gap to paper over.
  #
  # Reporting standards stay excluded here as everywhere: 企业会计准则 (CAS),
  # HKFRS and the Taiwan/Macau equivalents govern what the books must say,
  # not what a worker is — the same rule that excludes US GAAP and IFRS.
  - id: prc_enterprise_internal_control_norms
    jurisdiction: mainland_china
    name: 企业内部控制基本规范及配套指引 (Basic Standard for Enterprise Internal Control and Supporting Guidelines)
    steward: 财政部会计司及企业内部控制标准委员会; relevant regulators implement it, with 财政部 and 中国证监会 responsible for the current listed-company notice
    names: controls
    scope: >-
      The mainland enterprise-control system. It names five control elements,
      eighteen application-guide domains, enterprise self-evaluation, and
      external internal-control audit. It is the strongest mainland functional
      counterpart for controller_reviewer and compliance_reviewer, but it does
      not name artifact-only worker roles.
    current_version: 财会〔2008〕7号, effective 2009-07-01; supporting guidelines 财会〔2010〕11号; current listed-company implementation reinforced by 财会〔2023〕30号
    status: current
    source_url: https://kjs.mof.gov.cn/zhengcefabu/200807/t20080704_55982.htm
    term_list_availability: public
    attribution_note: Cite the Ministry of Finance source; no document-specific open-content license was verified, and bulk republication is not proposed.
    confidence: high  # Current use, maintenance machinery, and official texts were all verified.

  - id: prc_management_accounting_guidance_system
    jurisdiction: mainland_china
    name: 管理会计指引体系 (Management Accounting Guidance System)
    steward: 中华人民共和国财政部
    names: practices
    scope: >-
      A basic guide, application guides, and case library for management-
      accounting practice. It names activities, domains, tools, methods, and
      reports rather than professional competencies. 情景分析 is an honest
      practice-level counterpart for scenario_modeler; information-system,
      internal-control, compliance, and financial-shared-service terms provide
      narrower contextual alignments for other workers.
    current_version: 管理会计基本指引, 财会〔2016〕10号, plus the application-guide series through 第804号——财务共享服务, 财会〔2026〕9号, issued 2026-06-23
    status: current
    source_url: https://kjs.mof.gov.cn/zhengcefabu/201606/t20160624_2336654.htm
    term_list_availability: public
    attribution_note: Cite the Ministry of Finance source; no document-specific open-content license was verified.
    confidence: high  # The basic guide and the latest additions were verified in current MoF publications.

  - id: prc_accounting_professional_title_system
    jurisdiction: mainland_china
    name: 会计专业技术资格及会计人员职称制度 (Accounting Professional and Technical Qualification and Title System)
    steward: 人力资源和社会保障部 and 财政部
    names: professional_roles_or_qualifications
    scope: >-
      A human qualification and seniority ladder: 助理会计师, 会计师,
      高级会计师, 正高级会计师. It is authoritative qualification context,
      but none of the four titles is a safe Ledgerx worker label because using
      one would imply a human credential and professional standing.
    current_version: 人社部发〔2019〕8号; current 2026 examinations operate at 初级, 中级, and 高级 levels
    status: current
    source_url: https://kjs.mof.gov.cn/zhengcefabu/201901/t20190117_3124613.htm
    term_list_availability: public
    attribution_note: Public government material; cite the issuing ministries. No special trademark claim was found.
    confidence: high  # The title ladder and current examination operation were verified in MoF sources.

  - id: cicpa_industry_talent_competency_guide
    jurisdiction: mainland_china
    name: 中国注册会计师行业人才胜任能力指南 (Competency Guide for Talent in the Chinese CPA Profession)
    steward: 中国注册会计师协会, under national industry oversight and guidance by 财政部
    names: competencies
    scope: >-
      A staged competency framework for persons entering accounting firms,
      assistants, CPAs, non-managing partners, and managing partners. It includes
      technical competence, professional skills, management competence, ethics,
      experience, and international capability. Several domains resemble Ledgerx
      work, but the framework is for humans in public practice and must not confer
      CPA status on an agent.
    current_version: 会协〔2022〕48号, issued 2022-12-26 and effective 2023-01-01; supersedes the 2007 guide
    status: current
    source_url: https://www.cicpa.org.cn/xxfb/tzgg/202212/t20221226_63887.html
    term_list_availability: public
    attribution_note: Public CICPA PDF; cite CICPA. No framework-specific open license was verified.
    confidence: high  # Current effect, supersession, ladder, and competency structure were verified in CICPA sources.

  - id: cicpa_professional_practice_standards
    jurisdiction: mainland_china
    name: 中国注册会计师执业准则体系 (Chinese CPA Professional Standards System)
    steward: 财政部 and 中国注册会计师协会
    names: practices
    scope: >-
      A living public-practice suite covering audit, review, other assurance,
      related services, quality management, ethics, and current specialist
      assurance. It provides narrow practice-level analogues for
      controller_reviewer and compliance_reviewer, but its practitioner,
      engagement, opinion, and signing implications are incompatible with an
      artifact-only worker identity.
    current_version: living suite; key 11-standard consistency revision 财会〔2022〕1号, with current portal additions through 2026-03-04
    status: current
    source_url: https://www.cicpa.org.cn/ztzl1/Professional_standards/
    term_list_availability: public
    attribution_note: Public official standards; cite the specific MoF or CICPA standard used. No blanket open license was verified.
    confidence: high  # The current portal and the 2022 revision were verified; this is intentionally not described as one frozen edition.

  - id: prc_accounting_basic_work_norm
    jurisdiction: mainland_china
    name: 会计基础工作规范 (Accounting Basic Work Norm)
    steward: 中华人民共和国财政部
    names: other:roles_and_accounting_work_requirements
    scope: >-
      A mandatory departmental norm for accounting organization, positions,
      records, supervision, handover, and internal accounting management. It
      contains the most direct mainland role vocabulary for ordinary accounting
      work, but many position terms carry real operational duties. The current
      2019-amended text remains operative while a replacement and a voucher-and-
      ledger operation guide remain under revision.
    current_version: 财会字〔1996〕19号, amended by 财政部令第98号 on 2019-03-14; replacement drafts re-consulted under 财办会〔2025〕34号
    status: under_revision
    source_url: https://www.mof.gov.cn/gp/xxgkml/tfs/201903/t20190318_3195239.htm
    term_list_availability: public
    attribution_note: Public government text; cite the Ministry of Finance. Draft wording must not be treated as current law.
    confidence: high  # Current operative text and the still-draft replacement were both verified.

  - id: prc_agency_bookkeeping_basic_work_norm
    jurisdiction: mainland_china
    name: 代理记账基础工作规范（试行） (Basic Work Norm for Agency Bookkeeping, Trial)
    steward: 中华人民共和国财政部
    names: processes
    scope: >-
      A nationwide work-process and quality-control norm for licensed agency-
      bookkeeping institutions. It directly names engagement acceptance, work
      planning, document handover, accounting, quality control, personnel, and
      archives. It is highly relevant to intake, coding, draft bookkeeping,
      reconciliation, close support, and review, but the regulated institution
      performs real accounting and may produce signed outputs, so Ledgerx mappings
      require explicit draft-only and human-gate qualifiers.
    current_version: 财会〔2023〕27号, effective 2024-01-01
    status: current
    source_url: https://www.mof.gov.cn/gkml/caizhengwengao/wg2023/wg202311/202401/t20240131_3927918.htm
    term_list_availability: public
    attribution_note: Public government text and reference forms; cite the Ministry of Finance. No document-specific open-content license was verified.
    confidence: high  # Text, effective date, process list, and 2025 enforcement use were verified.

  - id: prc_accounting_informationization_norms
    jurisdiction: mainland_china
    name: 会计信息化工作规范及会计软件基本功能和服务规范 (Accounting Informationization Work Norm and Basic Accounting-Software Function and Service Norm)
    steward: 中华人民共和国财政部
    names: other:accounting_information_system_processes_and_controls
    scope: >-
      Mandatory national-unified-accounting-system rules for informationization
      governance, system construction, electronic-voucher processing, data and
      system controls, software functions, security, and supervision. They offer
      strong context for document_intake_processor, ledger_platform_specialist,
      controller_reviewer, and posting-admission controls, but they define system
      requirements rather than worker roles.
    current_version: 财会〔2024〕11号 and 财会〔2024〕12号, effective 2025-01-01; supersede the identified 2013, 1996, and 1994 predecessor norms
    status: current
    source_url: https://kjs.mof.gov.cn/zhengcefabu/202408/P020240805628932632907.pdf
    term_list_availability: public
    attribution_note: Public government PDFs; cite the Ministry of Finance. No document-specific open-content license was verified.
    confidence: high  # Both current norms, their effective date, and superseded predecessors were verified in MoF sources.

  - id: gb_t_46704_financial_shared_services
    jurisdiction: mainland_china
    name: GB/T 46704-2025 共享经济 企业财务共享服务指南 (Sharing economy—Guidelines for enterprise financial shared services)
    steward: 全国共享经济标准化技术委员会 TC587, under 国家标准化管理委员会
    names: service_management_requirements
    scope: >-
      Recommended national guidance for enterprise financial shared-service
      providers, users, platforms, service procedure, assurance/emergency
      arrangements, and continual improvement. It is a service-management
      standard, not an APQC-style hierarchical catalog of all finance processes,
      and its published vocabulary does not provide direct Ledgerx worker labels.
    current_version: GB/T 46704-2025, published and effective 2025-10-31; recommended GB/T, not mandatory GB
    status: current
    source_url: https://std.samr.gov.cn/gb/search/gbDetailed?id=42BA7D06A39BE936E06397BE0A0ACDC9
    term_list_availability: public
    attribution_note: The official platform marks its content 版权所有/侵权必究; reference the standard number and terms, but do not bulk reproduce the text without permission.
    confidence: medium  # Status and high-level structure are official; exact final clause vocabulary was not exported from the platform viewer.

  - id: hkicpa_paib_professional_development_framework
    jurisdiction: hong_kong
    name: 香港會計師公會商界專業會計師的專業發展框架 (HKICPA Professional Development Framework for PAIBs)
    steward: 香港會計師公會; statutory functions are overseen by the Accounting and Financial Reporting Council
    names: competencies
    scope: >-
      A Hong Kong competency framework for professional accountants in business,
      organized by technical, business, leadership/people, and ethics domains and
