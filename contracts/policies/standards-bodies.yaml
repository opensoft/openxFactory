    term_list_availability: public
    attribution_note: Public official PDFs; cite iCAP and the exact standard code/version. No document-specific open license was verified.
    confidence: high  # Current list, version status, and task content were verified in official iCAP PDFs.

  - id: macau_cpc_accounting_profession_qualifications
    jurisdiction: macau
    name: 澳門會計師專業及執業資格制度 (Macao Accounting Profession and Practising Qualification System)
