# THE SUBMITTED-THEN-CONFIRMED PATH, WRITTEN AS EVIDENCE ON BOTH WITNESSES. Each
# row names the profile its state is bound to, carries the submission evidence an
# interface actually accepted AND the confirmation evidence the approved condition
# found, and the durability row reports its two layers separately —
# `aggregation_submission: confirmed` and `chain_confirmation: confirmed`. Every
# edge has its leaf: two submissions, two confirmations, entry and completion. The
# long-horizon claim is admitted here because the chain layer is confirmed, which
# is the only thing that admits one.
