# THE APPEND-ONLY REGISTER, WITH ITS RETIRED PREDECESSOR KEPT IN PLACE. Four
# entries, two configured networks, exactly one entry with standing `active` per
# network at every boundary — the operational successor's activation closed its
# predecessor's interval in the same act, which is why no boundary has two active
# entries and why window opening never has to guess. Every entry binds its version,
# the canonical digest of the approved terms, the operator's approval record, its
# activation log sequence inside a named checkpoint, and its half-open effective
# interval.
