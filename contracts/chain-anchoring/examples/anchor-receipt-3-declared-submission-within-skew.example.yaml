# backward skew — and the receipt is ACCEPTED. No inequality holds between a
# chain's accepted time and the true submission instant: a header time is a
# reference with a width, never an upper bound on submission. Refusing this
# receipt is itself refused (honest_receipt_refused_within_skew); the negative
# corpus proves both directions.
