# WHAT A CHAIN SEES OF CONSENT — A CHECKPOINT, AND NOTHING ELSE: rows, linkage,
# access lists and salts stay in the governed permissioned plane; the anchored
# value stands over a log head and discloses that the consent log said
# something at a time. Enforcement is declared at the permissioned plane —
# never as contract code on an anchoring chain — an unreachable plane REFUSES
# the consent-dependent act, and revocation supersedes forward only: recall is
# what nothing on a chain can deliver, and no surface here claims it.
