# A LOG CHECKPOINT ANCHOR, WITH THE COST STATED: the checkpoint commits to the
# log's WHOLE PREFIX, refusals and later-invalidated events included —
# covers_refused_leaves is declared true because that is EXPECTED, an anchored
# refusal being evidence the refusal happened. The disclaimer is contract text
# carried as a constant: inclusion witnesses that the log said something at a
# time and is NEVER validation of any leaf inside it. The checkpoint digest is
# the referenced receipt's material digest, and the validator compares the two
# rather than assuming they agree.
