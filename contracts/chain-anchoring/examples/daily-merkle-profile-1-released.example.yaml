# THE RELEASED CONSTRUCTION, DIGESTED, WITH ITS DETERMINISTIC EMPTY ROOT. Two
# DIFFERENT domain separators, sequence ordering rather than timestamp ordering
# (timestamps tie and a tie has no deterministic tiebreak), a left-complete binary
# shape, and an unpaired node PROMOTED rather than duplicated. Every admission and
# every manifest binds this identifier, version and digest; the canonical reader
# resolves it and recomputes every leaf, every membership path and every batch root
# under exactly these rules.
