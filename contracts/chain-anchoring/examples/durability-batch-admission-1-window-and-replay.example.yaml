# TWO ADMISSIONS AND ONE REPLAY, ALL IN THE SAME FIXED UTC WINDOW. Each is ONE
# atomic transaction that did all five things — validated eligibility, applied the
# dedupe rule, recorded trusted acceptance time, selected the window FROM that
# acceptance time, and assigned the next monotonic sequence. The second sits at
# acceptance `2026-08-30T23:59:59Z`, the last second the day-one window admits;
# the day-three admission in the file beside this one is accepted at exactly
# `2026-09-01T00:00:00Z` and belongs to the window that OPENS then, because the
# interval is half-open and the prior window's exclusive boundary has passed by
# that instant. The third is a REPLAY ACKNOWLEDGEMENT: same
# dedupe key, same material digest, the EXISTING sequence returned, no second
# sequence consumed, and no pre-closure anchor receipt.
