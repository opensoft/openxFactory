# activation checkpoint — never to a window already counting. Both entries exclude
# `anchoring_control` from the count, which is what permits genuine consecutive
# empty windows: a window in which nothing but anchoring happened is honestly
# empty, and a manifest that had to contain its own description would be a regress
# rather than a fixed point.
