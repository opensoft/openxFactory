# AN EMPTY DAY IS STILL A DAILY ITEM. Count zero, the deterministic empty root the
# released construction declares, no first or last sequence (a range over an empty
# set asserts something false), and a continuity link over the PREVIOUS ITEM'S
# CONFIGURATION-BOUND ANCHORED DIGEST. That link is the whole reason an empty day
# cannot be dropped: two consecutive empty windows share this batch root on
# purpose, so a link over the root could not tell a missing intermediate day from a
# present one.
