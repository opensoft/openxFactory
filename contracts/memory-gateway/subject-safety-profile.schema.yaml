      subject_category:
        type: string
      age_band:
        type: string
      authority_mode:
        type: string
      guardian_or_delegate_ref:
        type: string
      allowed_interaction_modes:
        type: array
        items:
          type: string
      prohibited_uses:
        type: array
        items:
          type: string
      redaction_class:
        type: string
      retention_profile:
        type: string
      personalization:
        type: object
      audit_level:
        type: string
