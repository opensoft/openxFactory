schema_version: 1
name: memory_gateway_expert_context_packet
type: object
required:
  - expert_context_packet
properties:
  expert_context_packet:
    type: object
    required:
      - id
      - issued_at
      - expires_at
      - expert_profile
      - workflow_ref
      - knowledge_scopes
      - source_refs
      - provider_refs
      - allowed_uses
      - prohibited_uses
      - audit_refs
      - usage_refs
    # Closed shape (add-domain-ontology-layer, task 6.3 / release-review
    # finding 11): an undeclared key — including any authority-named one —
    # cannot ride into provider I/O inside a packet.
    additionalProperties: false
    properties:
      purpose:
        # Optional issuance purpose (release-review finding 13): when the
        # packet carries semantic_context, the preflight requires the two
        # purposes to agree, so an expert packet with semantic context
        # declares its purpose explicitly.
        type: string
      semantic_context:
        # Optional bounded semantic context (add-domain-ontology-layer,
        # task 6.2). When domain terms, mappings, classifications, or
        # semantic relations are included, the packet carries the exact
        # semantic-context identity and the kernel/domain pins used to
        # interpret them; preflight rejects digest failure, an unpinned or
        # retired package, or a purpose mismatch BEFORE provider I/O, and
        # the presence of semantic context never changes any rail, grant,
        # or permission (task 6.3).
        type: object
        required:
          - semantic_context_id
          - content_digest
          - purpose
          - kernel_pin
          - package_pin
          - term_subset
          - lifecycle
        additionalProperties: false
        properties:
          semantic_context_id:
            type: string
            pattern: "^ctx-[a-z0-9][a-z0-9-]{0,63}$"
          content_digest:
            type: string
            pattern: "^[a-f0-9]{64}$"
          purpose:
            type: string
          worker_scope:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              worker_archetype:
                enum: [frame, generate, verify, challenge, assemble_for_admission]
              worker_class:
                type: string
          kernel_pin:
            type: object
            required: [package_id, package_version, package_digest]
            additionalProperties: false
            properties:
              package_id:
                type: string
              package_version:
                type: string
              package_digest:
                type: string
                pattern: "^[a-f0-9]{64}$"
          package_pin:
            type: object
            required: [package_id, package_version, package_digest]
            additionalProperties: false
            properties:
              package_id:
                type: string
              package_version:
                type: string
              package_digest:
                type: string
                pattern: "^[a-f0-9]{64}$"
          tenant_binding_ref:
            type: string
          term_subset:
            type: array
            minItems: 1
            items:
              type: string
          lifecycle:
            type: object
            required: [package_lifecycle_state]
            additionalProperties: false
            properties:
              package_lifecycle_state:
                type: string
                enum: [published, deprecated]
              compiled_at:
                type: string
              ttl_seconds:
                type: integer
                minimum: 1
      id:
        type: string
      issued_at:
        type: string
      expires_at:
        type: string
      expert_profile:
        type: string
      workflow_ref:
        type: string
      knowledge_scopes:
        type: array
        items:
          type: string
      source_refs:
        type: array
        items:
          type: string
      provider_refs:
        type: array
        items:
          type: string
      source_authority:
        type: object
      allowed_uses:
        type: array
        items:
          type: string
      prohibited_uses:
        type: array
        items:
          type: string
      audit_refs:
        type: array
        items:
          type: string
      usage_refs:
        type: array
        items:
          type: string
