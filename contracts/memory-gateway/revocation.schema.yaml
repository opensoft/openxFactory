schema_version: 1
name: memory_gateway_revocation
type: object
required:
  - revocation
properties:
  revocation:
    type: object
    required:
      - id
      - subject_ref
      - revoked_uses
      - effective_at
      - tombstone_refs
      - audit_refs
    properties:
      id:
        type: string
      subject_ref:
        type: string
      revoked_uses:
        type: array
        items:
          type: string
      effective_at:
        type: string
      tombstone_refs:
        type: array
        items:
          type: string
      audit_refs:
        type: array
        items:
          type: string
      erasure_obligation_ref:
        type: string
