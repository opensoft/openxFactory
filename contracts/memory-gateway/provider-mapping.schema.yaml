schema_version: 1
name: memory_gateway_provider_mapping
type: object
required:
  - provider_mapping
properties:
  provider_mapping:
    type: object
    required:
      - id
      - canonical_object_id
      - canonical_port
      - provider_id
      - provider_object_ref
      - namespace
      - layer
      - audit_refs
    properties:
      id:
