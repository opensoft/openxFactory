      canonical_object_id:
        type: string
      canonical_port:
        type: string
      provider_id:
        type: string
      provider_object_ref:
        type: string
      namespace:
        type: string
      layer:
        type: string
      audit_refs:
        type: array
        items:
          type: string
      migration_ref:
        type: string
