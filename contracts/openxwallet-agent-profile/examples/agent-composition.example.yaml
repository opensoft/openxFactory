# VALID agent composition declaration, and the worked example of the decision
# this feature settled: WHAT THE COMPONENT SET COVERS.
#
# Five components are bound by CONTENT — their digests enter the hash, so
# editing a prompt, a tool manifest, a policy or a parameter changes the
# agent's identity and revokes its grants immediately.
#
# The retrieval corpus is bound by REFERENCE. Its identity and the
# configuration governing how it is consulted enter the hash; its row-level
# contents do not. Swapping the corpus, widening what may be retrieved, or
# changing the selection or admission rules all change identity and revoke.
# Documents arriving in an already-governed corpus do not — the agent's
# AUTHORITY has not changed, and the corpus has its own governance.
#
# The set is declared alongside the hash precisely so a reader can tell which
# of those two things a matching hash was asserting.
schema_version: 1
kind: xfactory_wallet_agent_composition
wallet_ref: wal-agent-poster-0001
holder_class: agent
composition:
  hash_algorithm: sha256
  declared_hash: "sha256:2a1961a71070be42d17a35b9599ff18a88bd1431ae721ada212ef18b697a9c18"
  component_set:
    - component: model_version
      binding_mode: content
      content_digest: "sha256:11a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f80"
    - component: prompt_contract
      binding_mode: content
      content_digest: "sha256:22b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091"
    - component: tool_manifest
      binding_mode: content
      content_digest: "sha256:33c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2"
    - component: policy_version
      binding_mode: content
      content_digest: "sha256:44d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3"
    - component: parameters
      binding_mode: content
      content_digest: "sha256:55e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4"
    - component: retrieval_corpus
      binding_mode: reference
      reference:
        ref: corpus:ledger-postings-kb
        governing_configuration_digest: "sha256:66f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5"
        covers:
          - corpus_identity
          - retrieval_scope
          - selection_configuration
          - admission_policy
      statement: >-
        Bound by reference. What the agent may retrieve and under what rules is
        part of its identity; which documents happen to be in the corpus this
        hour is not, because that churn would fire revocation constantly and
        get routed around.
