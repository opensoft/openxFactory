# expected_failure: composition-set-missing
# expected_failure_detail: no component set
# requirement: OXWA-R1
# VIOLATES profile R1: a composition hash that refuses to name what it covers.
#
# A hash without its component set asserts agreement about something it will
# not identify. Two agents could match on it while one hashed a prompt and a
# model version and the other hashed those plus a retrieval corpus — and a
# reader comparing them could not tell, which makes the comparison worthless
# for the one purpose it exists to serve.
#
# It is also the failure that would have made this feature's central decision
# invisible: the whole point of declaring the set is that a reader can see
# whether a corpus was bound by content or by reference.
