# expected_failure: declared-change-not-revoked
# expected_failure_detail: no tolerance band and no grace period
# requirement: OXWA-R2
# VIOLATES profile R2: a changed composition whose grants are still live.
#
# The attested hash differs from the declared hash — somebody edited a prompt,
# a policy or a tool manifest — and the record keeps `grants_state: active`.
# This is the plausible mistake, because a grace period sounds operationally
# kind: let the agent finish what it is doing.
#
# It is refused because an agent IS its composition. A changed agent is a
# different agent, and the authority granted to the previous one was never
# granted to this one. The family already applies this to OUTPUTS — a
# prompt-contract version bump invalidated every prior classification — and
# the profile generalizes it to AUTHORITY. No threshold, score, or tolerance
# band is consulted; any single declared component changing is sufficient.
