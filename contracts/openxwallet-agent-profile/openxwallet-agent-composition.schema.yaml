schema_version: 1
kind: openxfactory-openxwallet-contract-schema
name: xfactory_wallet_agent_composition
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://xforge.us/schemas/openxfactory/openxwallet-agent-profile/v1/openxwallet-agent-composition.schema.yaml"
contract_id: openxwallet-agent-composition
contract_schema_version: 1
title: openxWallet agent composition declaration
description: >-
  The agent profile's composition declaration (add-openxwallet, capability
  `openxwallet-agent-profile`). This is the FIRST profile over the
  holder-agnostic core, and it carries only what is agent-specific. It is a
  NEW capability over the same core rather than a modification of it, which is
  why it sits in its own contract family beside `contracts/openxwallet/` — a
  patient or practitioner profile would arrive the same way, each gated on a
  consumer of its own.

  AN AGENT IS ITS COMPOSITION. A holder of class AGENT declares the
  composition that constitutes its identity as a hash over a DECLARED
  COMPONENT SET, and the set is part of the declaration so a reader can tell
  what a matching hash was actually asserting. A hash without its component
  set is a validation failure — it asserts agreement about something it
  refuses to name.

  A DECLARED CHANGE REVOKES IMMEDIATELY. Any change in the declared
  composition ends that agent's certified identity: its outstanding grants are
  revoked at once through the core's revocation-propagation rule, with no
  tolerance band and no grace period, and resuming requires re-issuance
  against the changed composition. This generalizes to AUTHORITY an
  invalidation the family already applies to OUTPUTS — a prompt-contract
  version bump invalidated every prior classification, because a judgment by
  prompt-v1 is not the same classifier's judgment.

  WHAT THE COMPONENT SET COVERS — settled by this feature, per the change's
  task 3.2. The tension was real in both directions: including a fast-changing
  retrieval corpus fires revocation constantly and gets routed around, while
  excluding it lets an agent's behaviour change without its identity changing.

  The resolution is that "the corpus" is two things, not one, so every
  component declares a BINDING MODE:

    content   — the component's own digest enters the hash. Changing the
                component changes the hash and revokes. Model version, prompt
                contract, tool manifest, policy version, parameters.
    reference — the component's IDENTITY and GOVERNING CONFIGURATION enter the
                hash; its row-level contents do not. Retrieval corpora.

  So the hash covers WHICH corpus, WHAT may be retrieved from it, and UNDER
  WHAT rules it is consulted. Swapping the corpus, widening the retrieval
  scope, or changing the selection or admission configuration all change
  identity and revoke. Documents arriving in an already-governed corpus do
  not, because the agent's AUTHORITY has not changed — the corpus has its own
  governance, and borrowing this mechanism to police it would be the wrong
  control in the wrong place.

  Both binding modes stay available for every component, so a domain wanting
  content binding on a slow-moving corpus may declare it. The contract makes
  the choice visible and checkable; it does not make it for anyone.
type: object
required:
  - schema_version
  - kind
  - wallet_ref
  - holder_class
  - composition
additionalProperties: false
properties:
  schema_version: {type: integer, minimum: 1}
  kind:
    type: string
    enum: [xfactory_wallet_agent_composition]
  wallet_ref: {$ref: '#/$defs/identifier'}
  holder_class:
    # Locked to `agent`. Composition is meaningless for a patient — a patient
    # has no model version — and the core imposes none on any class. A record
    # of this kind for another class is refused rather than ignored.
    type: string
    enum: [agent]
  composition:
    type: object
    required: [hash_algorithm, declared_hash, component_set]
    additionalProperties: false
    properties:
      hash_algorithm:
        type: string
        enum: [sha256]
      declared_hash: {$ref: '#/$defs/digest'}
      component_set:
        # REQUIRED and non-empty. This is the half that makes a hash legible.
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: object
          required: [component, binding_mode]
          additionalProperties: false
          properties:
            component:
              type: string
              enum:
                - model_version
                - prompt_contract
                - tool_manifest
                - policy_version
                - parameters
                - retrieval_corpus
            binding_mode:
              type: string
              enum: [content, reference]
            content_digest:
              # Required when binding_mode is `content`.
              $ref: '#/$defs/digest'
            reference:
              # Required when binding_mode is `reference`. The corpus identity
              # AND the configuration governing how it is consulted both enter
              # the hash; contents do not.
              type: object
              required: [ref, governing_configuration_digest]
              additionalProperties: false
              properties:
                ref: {$ref: '#/$defs/identifier'}
                governing_configuration_digest: {$ref: '#/$defs/digest'}
                covers:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - corpus_identity
                      - retrieval_scope
                      - selection_configuration
                      - admission_policy
            statement: {type: string, maxLength: 600}
  attestation:
    # What a runtime actually reported, against which the declaration is
    # compared. Omnigent readiness heartbeats already attest the facts a
    # composition hash consumes (`worker_version`, `profile_versions`,
    # `policy_version`); extending that attestation is a named successor in
    # omnigent-install, not part of this change.
    type: object
    required: [attested_hash, attested_at]
    additionalProperties: false
    properties:
      attested_hash: {$ref: '#/$defs/digest'}
      attested_at: {type: string, format: date-time}
      source: {$ref: '#/$defs/identifier'}
  grants_state:
    # Declared so a divergence between attested and declared hash cannot be
    # recorded alongside grants that are still live. No threshold, score, or
    # tolerance band is consulted: any single declared component changing is
    # sufficient to revoke.
    type: string
    enum: [active, revoked_on_composition_change]
  policy_version: {type: integer, minimum: 1}
$defs:
  identifier:
    type: string
    minLength: 1
    maxLength: 200
    pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]*$'
  digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
