# Conforming example: an Omnigent install manifest pinning the Hermes
# runtime manifest as shared stack identity, one domain overlay, one
# bootstrap subject workload. Instantiation stub.
schema_version: 1
kind: omnigent_install_manifest

stack_identity:
  hermes_runtime_manifest:
    repository: opensoft/xFactory-Hermes-Install
    commit: 0123456789abcdef0123456789abcdef01234567
    path: config/runtime-manifest.yaml
    digest: 9f2c8e1a7b4d5f60312a8c9e0d1f2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c

domain_overlays:
  - domain_id: example-engineering
    repository: opensoft/codexFactory
    commit: 89abcdef0123456789abcdef0123456789abcdef
    overlay_root: omnigent
    overlay_manifest_path: omnigent/overlay-manifest.yaml
    overlay_manifest_digest: 1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809

subject_workloads:
  - workload_id: wl-demo-01
    subject_ref: subject-demo-0001
    activation_state: dormant_foundation
    validator_mode: render
    workload_root: clients/example/workloads/demo

effective_profiles:
  rendered_root: rendered/effective-profiles
  provenance:
    core_revision: fedcba9876543210fedcba9876543210fedcba98
    overlay_manifest_digest: 1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809
    tenant_params_digest: 2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a

evidence:
  records_root: evidence/omnigent-compose

# Install-pinned worker semantic contexts (add-omnigent-semantic-wiring):
# exact kernel/package pins plus one compiled artifact per worker class
# the pinned overlay declares. Both-direction completeness and per-artifact
# pin agreement are cross-checked over the pinned overlay by the canonical
# validator's wiring checks, not by this schema.
semantic_contexts:
  kernel:
    package_id: xf/core
    package_version: 1.0.0
    package_digest: 37090ba25369d8c34f6034535fdd8f7980b8e254e65496ec4de637e1ce369038
  ontology_package:
    package_id: xf/example
    package_version: 1.0.0
    package_digest: 3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b
  contexts:
    - worker_class: check_runner
      context_id: ctx-example-verify
      content_digest: 4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c
      path: rendered/semantic-contexts/ctx-example-verify.yaml
