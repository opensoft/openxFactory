# expect: stricter_rule_wins
schema_version: 1
kind: omnigent_domain_overlay
domain:
  id: bad-example
  orchestrator_profile: software
composition:
  operations_contract: domain_installation_overlay
  stricter_rule_wins: false
workers:
  - id: scope_framer
    archetype: frame
    responsibility: Valid worker; the violation is the loosening composition flag.
    inputs: [approved_intent]
    outputs: [scope_frame]
    permissions:
      read_workspace: true
      write_artifacts: true
      run_validations: false
      propose_admission: false
      execute_final_action: false
      access_secrets: false
credential_requirements:
  all_classes: [workspace_read]
  never_assignable: [final_action_execute]
routing:
  scope_ambiguity: intent_owner
stop_conditions:
  - missing_approved_scope
