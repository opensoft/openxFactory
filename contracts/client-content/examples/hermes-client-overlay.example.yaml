schema_version: 1
kind: hermes_client_overlay
client:
  ref: opensoft
  display_name: Company Policy
  policy_overrides:
    schema_version: 1
    kind: client_policy_overrides
    relation_to_domain: stricter_only
    policy:
      repo_boundaries:
        may_touch:
        - opensoft/project-alfa/**
        never_touch:
        - '**/secrets/**'
        - infra/**
      realization:
        mode: pr_only
      credential_posture:
        allowed_families:
        - repo_read
        - branch_write
        - pr_write
        never_standing:
        - production
        - deploy
        - package_publish
      budget_envelopes:
        runner_minutes_per_day: 240
        credits_per_project: 1000
      tracking_granularity:
        level: per_task
        set_by: finance-accounting-officer
      auto_clear_envelope:
        ratified_by: brett-heap
        ratified_at: '2026-07-23'
        conjunctive:
        - practice_maturity: '>= standard'
        - risk_class: low
        - new_credentials: none
        - realization: pr_only
  memory_boundaries:
    schema_version: 1
    kind: client_memory_boundaries
    buckets:
      client_private_memory:
        scope: per_tenant
      customer_relationship_memory:
        scope: per_customer
      domain_learning_candidates:
        scope: promotable
      current_state_evidence:
        scope: installation_discovery
    consent: gateway_consent_profile
    invariant: tenant_isolated
  integration_boundaries:
    schema_version: 1
    kind: client_integration_boundaries
    allowed_classes:
    - version_control
    - ci
    credential_binding:
      form: reference_only
      standing_forbidden:
      - production
      - deploy
      - package_publish
