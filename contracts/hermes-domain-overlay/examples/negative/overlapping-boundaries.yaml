# expected_failure: more than one boundary list
schema_version: 1
kind: hermes_domain_overlay

domain:
  id: codex
  display_name: codex Domain Hermes
  approval_scope_kinds:
    - engineering_intent
  required_approval_fields:
    - approved_scope_ref
  authority_boundaries:
    codex_owns:
      - final_merge_enforcement   # also repository-owned — must fail
      - branch_review
    xfactory_owns:
      - gates
    repository_owns:
      - final_merge_enforcement
