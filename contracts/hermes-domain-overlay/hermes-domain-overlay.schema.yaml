schema_version: 1
name: hermes_domain_overlay
# Neutral schema for a domain's seedable Hermes overlay (the document the
# hermes-install seed-layer-content verb loads digest-verified from the
# domain repo pin). Added by add-hermes-domain-overlay-contract.
#
# One rule JSON-Schema shape cannot express lives in the canonical validator
# (scripts/validate-hermes-domain-overlay.py): authority_boundaries MUST
# carry exactly one domain-owned list named `<domain.id>_owns` (e.g.
# `codex_owns`), non-empty, and no authority item may appear in more than
# one boundary list (the no-overlap rule).
type: object
required:
  - schema_version
  - kind
  - domain
properties:
  schema_version:
    type: integer
    minimum: 1
  kind:
    type: string
    enum:
      - hermes_domain_overlay
  domain:
    type: object
    required:
      - id
      - display_name
      - approval_scope_kinds
      - required_approval_fields
      - authority_boundaries
    properties:
      id:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
      display_name:
        type: string
      approval_scope_kinds:
        type: array
        minItems: 1
        items:
          type: string
      required_approval_fields:
        type: array
        minItems: 1
        items:
          type: string
      authority_boundaries:
        type: object
        required:
          - xfactory_owns
          - repository_owns
        properties:
          xfactory_owns:
            type: array
            minItems: 1
            items:
              type: string
          repository_owns:
            type: array
            minItems: 1
            items:
              type: string
        # the domain-owned list (`<domain.id>_owns`) arrives as an
        # additional property; the canonical validator enforces its
        # presence, naming, non-emptiness, and the no-overlap rule.
        additionalProperties:
          type: array
          items:
            type: string
