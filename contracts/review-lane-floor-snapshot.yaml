schema_version: 1
kind: repository_gate_floor
floor:
  id: openxfactory-review-authority-register
  repository: opensoft/openxFactory
  # D-3 OF `add-floor-addition-grace` — THE ESCALATION TOLERANCE, AND IT IS THE
  # ONE FIELD OF THIS DOCUMENT THE OWNER IS ASKED TO SET.
  #
  # The packet was RATIFIED 2026-09-05 by Brett Heap, in session, verbatim
  # "ratify 205, B1 stands". D-3's escalation MECHANISM was ratified with it;
  # its NUMBER was expressly not — "a number the owner should set" — and the
  # ratification record leaves it OPEN "to be proposed for veto by the
  # realization that sets it". THIS LINE IS THAT PROPOSAL. Change the number, or
  # delete the line, and nothing else moves.
  #
  # WHAT IT DOES. The addition grace reports a path the candidate itself creates
  # — and, under B1, a path added to the base branch since the block's
  # `generated_at` — as `pending_floor_extension` rather than refusing it. The
  # grace DEFERS the regeneration; it does not discharge it. This count is the
  # bound on the deferral: once MORE than this many paths are covered-pending,
  # the evaluation escalates back to `floor_incomplete` and refuses again.
  #
  # WHY THREE, from the packet's own measured table rather than from taste:
  #   * the largest SINGLE repair measured moved the block by TWO paths (#195),
  #     so 3 never escalates on the candidate that caused it, nor on a second
  #     promotion landing before the sweep;
  #   * the busiest measured DAY (2026-09-04) added FIVE paths across four
  #     repairs, so 3 escalates INSIDE that day — a whole day of un-regenerated
  #     additions goes red, which is the pressure D-3 exists to keep;
  #   * it is a COUNT, so it is deterministic and reproducible from the report
  #     alone. A time bound would turn an unrelated pull request red at midnight
  #     for something nobody did that day, which is what D-3 forbids.
  #
  # DELETING THIS LINE IS FAIL-CLOSED, NOT FAIL-OPEN. An absent declaration is
  # read as a tolerance of ZERO: every covered-pending path escalates and the
  # evaluation behaves exactly as it did before the grace existed. A floor that
  # wants the grace has to say so, in a number a reader can see.
  #
  # IT IS NOT PART OF THE MACHINE-GENERATED BLOCK, deliberately. The block's
  # bytes are witnessed by openxFactory's `contracts/review-lane-pin.yaml`
  # digest and by the generator's byte-identity `--check`; a policy number
  # rendered into it would move those witnesses on a decision that has nothing
  # to do with the tree the block enumerates. It is hand-authored HERE, beside
  # the eight hand-reasoned entries, in this CODEOWNERS-routed document.
  pending_floor_extension_tolerance: 3
  # THIS DOCUMENT IS 8 + 1, NOT 67 EQUALLY-REASONED CHOKEPOINTS.
  #
  # EIGHT hand-reasoned gate chokepoints, each with its own ground below: the
  # intake register, the two paths that determine WHICH READER opens it, a
  # fourth that determines WHICH DECISION CORE judges this repository at all,
  # and FOUR more naming the SIBLING factory-identity register family added by
  # openxFactory's ratified `add-cpc-clearing-boundary` (task 2.7).
  #
  # PLUS ONE machine-generated block carrying every tracked path under
  # `openspec/specs` — openxFactory's promoted OpenSpec canon — floored as one
  # undifferentiated set with ONE collective ground, stated inside the block.
  # Gate-Rules Council, 2026-08-31, the (b′) narrow act:
  # `hermes/domain/review-councils/records/2026-08-31-gate-rules-openxfactory-bprime.md`
  # §8 ("THE EXTENSION — ALL 53, PINNED AND REGENERATED"), ruled ACCEPT by
  # Brett Heap at §1 item 7.9. The block is written ONLY by
  # `scripts/merge_master/generate_specs_floor_block.py` (CSC-C7: "a hand-typed
  # or copy-pasted list is refused on its face").
  #
  # BLAST RADIUS, BOTH DIRECTIONS, STATED (CSC-C8, BLOCKING). A DEAD entry — a
  # floored path that no longer exists in openxFactory — is accepted silently in
  # the no-tree production mode (`load_governance_paths`) and reddens
  # openxFactory's ADVISORY lane, which today blocks nobody. A DUPLICATE entry is
  # refused BEFORE the tree check, i.e. in that same no-tree production mode,
  # i.e. inside codexFactory's OWN required gate: **one mistyped duplicate in
  # this list wedges a required gate in another repository.** With four entries
  # that risk was negligible; at fifty-seven — the floor's size when this rule
  # was adopted on 2026-08-31 — it was not, and the list has only grown since,
  # which is why nothing but the generator may write the block.
  #
  # The register alone was not enough. `RepositoryGateFloor.matching_paths` is
  # exact set membership, so protecting the register FILE protects
  # nothing about the TOOL that reads it. After openxFactory's ratified
  # `split-openxwallet-repo` P3, that reader lives in a nested `openXwallet`
  # submodule pinned by `contracts/openxwallet-pin.yaml` — and one pull request
  # could bump the gitlink to a neutered reader AND edit a grant under
  # `governance/review-authority/` while matching no floor path at all. It would
  # be council-clearable, and the check that would have caught it is the one the
  # same pull request replaces. A candidate could repoint its own checker and
  # clear the result by council. (`council-adversary-engineer.md` concern 2,
  # VALID/HIGH; widened by P3b, `design.md` D10.)
  #
  # `.gitmodules` is DELIBERATELY NOT a floor entry. A URL swap alone cannot
  # change what runs: the openxFactory-side check compares the recorded gitlink,
  # the checked-out revision and the eight digests against the pin, so a fork at
  # the same commit and bytes is inert and a fork at any other commit fails. Any
  # pull request that actually changes which reader runs must edit the pin file,
  # which IS floored. One chokepoint, chosen over a fence around every adjacent
  # file. `tests/merge-master/test_repository_gate_floor.py` asserts the absence
  # so it cannot later be mistaken for an oversight.
  #
  # PRE-EXISTING and out of scope here (`split-openxwallet-repo` §8.3): this floor
  # omits `governance/review-authority/{grants,wallets,attestations}/`, and
  # lead-security's 2026-08-26 floor-reachability finding stands. Both belong to
  # the arc owner of `add-wallet-carried-review-authority`.
  never_clearable_paths:
    - governance/review-authority/register.yaml
    # The product pin: which openXwallet commit and digests openxFactory consumes.
    - contracts/openxwallet-pin.yaml
    # The gitlink, bare name and no trailing slash — the form `git diff
    # --name-only` reports and the only form `_parse_exact_path` accepts; that
    # parser refuses a leading or trailing `/`.
    - openXwallet
    # A fourth, separately grounded entry (not part of the wallet-register
    # trio above): the review-lane pin selects which codexFactory commit's
    # decision core judges this repository. Clearable, it would let a pull
    # request choose its own judge.
    - contracts/review-lane-pin.yaml
    # ---------------------------------------------------------------------
    # THE SIBLING FACTORY-IDENTITY REGISTER FAMILY, entered BY NAME.
    #
    # openxFactory `add-cpc-clearing-boundary` (ratified 2026-09-02, merged
    # c0270d28), capability `factory-origin-identity`, task 2.7. Its ratified
    # requirement: "Where a gate enumerates never-clearable floor members,
    # `governance/factory-identity/` SHALL be entered BY NAME rather than
    # matched by a path-shaped clause, and where a consuming repository's floor
    # file is compared as an EXACT SET, that file SHALL be updated in the same
    # governed act that creates the register — an exact-set comparison against a
    # floor that does not yet name the new register fails closed on every
    # candidate, so the two are one change and not two."
    #
    # BY NAME IS FORCED HERE, NOT MERELY PREFERRED. `_parse_exact_path` refuses
    # wildcards, `.`/`..` segments and any leading or trailing `/`, so
    # `governance/factory-identity/` CANNOT be floored as a directory prefix.
    # Each file is named exactly, which is what the requirement asks for and
    # what `matching_paths`' exact set membership can act on.
    #
    # WHY ALL FOUR AND NOT ONLY THE REGISTER. The intake trio above floors
    # `governance/review-authority/register.yaml` alone, and §8.3 of
    # `split-openxwallet-repo` records that omitting its grants, wallets and
    # attestations is a PRE-EXISTING gap with lead-security's 2026-08-26
    # floor-reachability finding still standing against it. That gap is not
    # reproduced here: the ratified requirement for THIS family says "changes to
    # the factory-identity register AND THE RECORDS BESIDE IT" are landable only
    # by a human act, and a floor naming only the register would leave the grant
    # that confers the origin act — and the custody attestation that lifts its
    # unattested cap — council-clearable. Editing either one changes what a
    # verified origin signature MEANS without touching the register at all.
    #
    # THE STANDING LIMIT, STATED RATHER THAN DISCOVERED LATER. This is an
    # ENUMERATION, so a record ADDED under `governance/factory-identity/` is not
    # floored until it is added here. Admitting a second originating repository
    # is therefore not one act but two files in one act — its wallet, grant and
    # attestation entered here in the same governed change that adds its row —
    # which is the same one-governed-act discipline the requirement already
    # imposes on this file's relationship to the register. `repository_floor_
    # drift.py` catches the REMOVAL direction; nothing catches the addition
    # direction but this comment and the reviewer reading it.
    - governance/factory-identity/register.yaml
    - governance/factory-identity/wallets/wal-origin-codexfactory-0001.yaml
    - governance/factory-identity/grants/grant-origin-codexfactory-0001.yaml
    - governance/factory-identity/attestations/custody-attest-wal-origin-codexfactory-0001.yaml
