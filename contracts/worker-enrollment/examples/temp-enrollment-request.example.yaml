# Positive reference example — VOLUNTEER (temp estate) enrollment request
# (spec R1 scenario 2). An engineer ran the installer on an unmanaged
# workstation and completed the interactive device-code flow, so the
# authenticated subject is the ENGINEER, not the machine. No standing secret is
# written to the workstation at any step: the device-code identity is used for
# this exchange and for every renewal, and is never escrowed on the machine.
#
# The request asks for the temp group by name. It would be equally legal for it
# to ask for a standing execution lane — and the broker would REFUSE rather than
# silently downgrade it (spec R8 scenario 2). The refusal, not the request, is
# where segregation is enforced.
