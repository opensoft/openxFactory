# Positive reference example — the REVOCATION audit record (spec R6, R9). An
# operator revoked the lease of a volunteered workstation whose owner left the
# company. The machine was powered off at the time and was never contacted.
#
# This record, plus the refusal records of the renewals that follow it, is the
# whole evidence chain for "when did that worker lose authority, and why" — it
# establishes both WITHOUT reference to host-side logs, which on somebody's
# personal laptop nobody can compel.
#
# Read what is NOT here: no token, no key, no secret, no credential, no response
# body. Not because an emitter was careful, but because the schema has no property
# that could hold one and `reason_detail` is bounded so one cannot be smuggled
# into prose.
