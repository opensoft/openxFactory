# expected_failure: token-in-record
# VIOLATES spec R9: an audit record MUST NOT contain any registration token,
# remove token, key material, or secret value, in any field, at any time —
# redaction is a property of the record SHAPE, not of a logging convention.
#
# This is the plausible version of the mistake: a remove-token brokering record
# that records "which token" it issued, for traceability. Traceability is what
# `evidence_ref` is for. The token value itself must exist nowhere.
#
# Fails twice, by design — the audit schema's `additionalProperties: false` has no
# such property, and the canonical validator's rule (a) finds both a token-shaped
# property and a token-shaped VALUE in a record.
