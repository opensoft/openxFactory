# expected_failure: renewal-response-missing-floor
# VIOLATES spec R4: every renewal response MUST carry the current minimum app
# version, including approvals.
#
# This fixture is the optimization that quietly breaks the only control that
# reaches unmanaged hardware: "the floor did not change, so why send it?" Because
# the response is the ONLY channel to the machine. A floor that travels
# conditionally is a floor whose absence is indistinguishable from an unchanged
# one — and a worker that has never been told a floor cannot fail closed against
# it.
#
# Fails twice, by design: `floor` is a required property of the response, and the
# canonical validator's rule (d) checks it independently, because this is the one
# invariant the family cannot afford to have enforced in only one place.
