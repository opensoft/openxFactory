    subject:
      class: host
      ref: host:cpc-omni01
    standing_secret_on_host: broker_access_only
  observed:
    app_version: 1.4.0
    runner_version: v2.336.0
  liveness:
    last_heartbeat_at: "2026-07-31T07:57:00Z"
    consecutive_failed_renewals: 0

response:
