# expected_failure: temp-lease-in-standing-group
# VIOLATES spec R8 through a group name that reads like nothing at all: `Default`,
# GitHub's actual default runner group, visible to every repository in the org.
#
# This fixture exists because the no-policy fallback used to be a two-literal
# deny-list (`execution[ ._-]?lane|standing`) that matched exactly one group name
# — the one in the packaged policy example. `Default` matched nothing, and neither
# did `xfactory-omnigent-workers`; both are real standing lanes, and the leases
# that would carry them live in the broker and host-app repositories while the
# policy lives in the managed-platform repository, so the fallback IS the
# operative check in every realistic deployment and it silently passed.
#
# The fallback is now an ALLOW-list — a temp lease must bind a group that reads as
# a temp or volunteer group — so an unrecognized group fails closed instead of
# passing vacuously, and it says in a note when it runs. The self-test re-runs
# every fixture of this class through the no-policy path for exactly that reason.
schema_version: 1
kind: worker_lease

lease_id: wl-ws-volunteer-22-0001
estate: temp

subject:
  class: engineer
  ref: engineer:eng-0051

host:
  host_id: ws-volunteer-22
  device_name: WS-VOL22-MP3H9
  managed: false

worker:
  worker_id: xfactory-coding-temp-ws-volunteer-22
  runner_name: xfactory-coding-temp-ws-volunteer-22

binding:
  runner_group: Default
  labels:
    - self-hosted
    - omnigent
    - temp
    - volunteered

trust_tier: volunteered_hardware
issued_at: "2026-07-31T10:00:00Z"
expires_at: "2026-08-01T10:00:00Z"
cadence:
  ttl: PT24H
  renewal_interval: PT1H
  grace: PT12H
  clock_skew_tolerance: PT5M
floor_in_force:
  min_app_version: 1.4.0
state: active
policy_version: worker-enrollment-v1
