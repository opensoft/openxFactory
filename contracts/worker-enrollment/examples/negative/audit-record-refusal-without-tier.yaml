# expected_failure: schema
# expected_failure_detail: 'trust_tier' is a required property
# VIOLATES spec R9: "Every enrollment, renewal, refusal, and revocation SHALL emit
# an audit record carrying ... the lease id, the trust tier, the runner group".
#
# The tier and the group used to be required only under `decision: allowed`, so
# this record — a refused renewal, complete in every other respect — validated
# cleanly with neither. That is precisely backwards: R8 scenario 3 and R9 scenario
# 3 make the REFUSAL chain the evidence. An auditor asked to prove sensitive work
# never reached volunteered hardware, or to establish when a worker lost
# authority, got a compliant-but-tierless chain and had to join back to the lease
# store the record exists to make unnecessary.
#
# The tier now travels on every record whose tier can be known — the only
# exemptions are an unauthenticated caller and a `policy_unavailable` refusal,
# where there is no projection to read — and the group travels wherever a lease
# exists.
