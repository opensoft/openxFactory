# expected_failure: embedded-secret
# expected_failure_detail: reason_detail
# VIOLATES spec R9 in the one field of this shape that accepts prose. This is
# `removal-grant-token-persisted.yaml`'s exact scenario — keep the token "so a retry
# can reuse it" — written into the free-text field instead of a property of its own,
# with dots between the pieces so no single run reaches the bound.
#
# The lesson the family already paid for once (see
# `audit-record-chunked-token-in-reason-detail.yaml`): a run bound that excludes
# separators is a bound one `value.replace('.', '')` defeats. `constrained_text`
# counts separators as part of a run, and the canonical validator re-tests every
# value with separators stripped per word — so a token cannot ride prose here any
# more than it can ride an audit record's `reason_detail`. That equivalence is the
# point of reusing the audit record's `$def` character for character rather than
# writing a new one for this shape.
