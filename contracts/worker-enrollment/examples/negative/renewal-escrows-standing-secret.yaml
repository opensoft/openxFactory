# expected_failure: renewal-escrows-standing-secret
# VIOLATES spec R1: "no standing secret is written to the workstation — the
# device-code identity is used for the exchange AND FOR RENEWALS, never escrowed on
# the machine." This renewal is authenticated as the engineer, on a volunteered
# workstation, and declares that a standing credential on that host made the call.
#
# The renewal exchange used to carry no authenticating subject at all: a request
# was `requested_at` + `observed` + `liveness`, authenticated by nothing but a
# lease id. With an hourly renewal cadence a host app has exactly two ways to
# renew non-interactively — re-present the device-code identity, or persist a
# refresh credential next to the lease — and the contract distinguished neither,
# so the escrowing implementation emitted leases and renewals that validated with
# zero findings and no gate in the family could see it.
#
# `request.authentication.standing_secret_on_host` is that missing statement, and
# `none` is its only legal value under `device_code` — a schema constant AND the
# canonical validator's rule (f), because this is the property the design says
# should stop the program rather than be negotiated.
schema_version: 1
kind: worker_lease_renewal

renewal_id: rnw-ws-brett-01-0091
lease_id: wl-ws-brett-01-0001

request:
  requested_at: "2026-07-30T09:00:00Z"
  authentication:
    mode: device_code
    subject:
      class: engineer
      ref: engineer:eng-brett
    standing_secret_on_host: broker_access_only
  observed:
    app_version: 1.4.0
    runner_version: v2.337.1
  liveness:
    last_heartbeat_at: "2026-07-30T08:57:00Z"
    consecutive_failed_renewals: 0

response:
  decided_at: "2026-07-30T09:00:00Z"
  lease_state: active
  new_expiry: "2026-07-31T09:00:00Z"
  floor:
    min_app_version: 1.4.0
    source: policy
  required_action: none
  policy_version: worker-enrollment-v1
  note: renewed without an interactive prompt using a credential held on the host
