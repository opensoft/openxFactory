# expected_failure: temp-lease-in-standing-group
# VIOLATES spec R8 on the shape where the violation costs the most. Everything here
# is honestly labelled — `estate: temp`, `trust_tier: volunteered_hardware`,
# `host.managed: false`, an operator subject — and the removal grant is scoped to
# the STANDING execution-lane runner group.
#
# A remove token is not authority over one runner: it is authority to deregister
# registrations in a runner GROUP. So a removal grant scoped to
# `xfactory-execution-lane-workers` and handed to (or on behalf of) a volunteered
# workstation is a token that can deregister FLEET workers out of the standing lane
# — a strictly larger hazard than the temp LEASE the segregation rule was written
# for, arriving through a call whose stated purpose is tidying up.
#
# This is why `worker_removal_grant.binding.runner_group` is named to match
# `worker_lease.binding.runner_group`: the canonical validator's rule (b) reads a
# removal grant exactly as it reads a lease, with no special case that could fall
# out of step, and the check is armed by ANY temp-shaped fact rather than by the
# estate label alone. It fires here through the declared-policy path AND through the
# no-policy naming fallback, which is the path a broker checkout actually runs.
