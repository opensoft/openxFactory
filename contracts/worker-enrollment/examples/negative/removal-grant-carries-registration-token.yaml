# expected_failure: token-in-record
# expected_failure_detail: registration_token
# VIOLATES spec R2/R3 and the rule that a REMOVAL NEVER RE-ENROLLS. This is the
# plausible version of the mistake, and the one a broker author reaches for: the
# host asked for a remove token to clear a stale registration, so answer with the
# remove token AND a fresh registration token, saving the host a round trip.
#
# That round trip is the governance. Re-registering is a NEW LEASE DECISION —
# eligibility, the machine cap, the version floor, the trust tier, the policy
# version, an `enroll` audit record — and a repair call that quietly hands back
# registration authority skips every one of them. Worse, it does so on the one call
# whose whole purpose is to clean up after drift, so a host that repairs in a loop
# re-registers in a loop with no enrollment ever recorded.
#
# The declaration block below carries no `value` on purpose: the finding is the
# PRESENCE OF THE FIELD, not a leaked secret. Fails twice, by design — the shape's
# `additionalProperties: false` has no such property, and the canonical validator's
# rule (a) finds a token-shaped property in a kind whose only exempt one is
# `remove_token`.
