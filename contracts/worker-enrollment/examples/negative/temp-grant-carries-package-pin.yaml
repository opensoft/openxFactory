# expected_failure: temp-grant-carries-package-pin
# VIOLATES spec R7 from the other side. This temp grant is otherwise correct — temp
# lease, dedicated group, broker-served manifest, self-update enabled — and it also
# names a version and a digest, because pinning "feels safer".
#
# It is not safer here, it is the fail-closed control pointed at the wrong thing:
# a volunteered laptop must never lose its lease for runner-binary drift, which is
# upstream's business and not the engineer's. The only fail-closed control on
# volunteered hardware is the app-version floor.
#
# This fixture exists because rule (c) had a defined finding for this branch and no
# packaged negative exercising it — half of a load-bearing rule with no regression
# test, which the README's "fails closed if that degrades" promise could not see.
