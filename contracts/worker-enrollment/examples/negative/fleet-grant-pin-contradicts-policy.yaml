# expected_failure: fleet-grant-pin-contradicts-policy
# VIOLATES spec R7 by pinning the WRONG artifact. Every field the pin rule looked
# for is present — `mode: pinned`, a version, a sha256, `self_update: disabled`,
# `delivery: manifest_rollout` — and the version and digest match no package the
# enrollment policy declares.
#
# The stated purpose of the pin is "what makes the installed runner a known,
# digest-verified artifact and what keeps version changes inside the governed
# manifest-rollout path". PRESENCE establishes neither: a broker free to pin
# v2.100.0 and a digest of zeros is a broker that has taken the fleet's runner
# binary outside the governed rollout path while reading as compliant.
#
# The canonical validator's rule (c) therefore compares a fleet grant's pin
# against `estates.fleet.runner_package` whenever a policy is in scope.
