  schema_version: 1
  kind: worker_lease
  lease_id: wl-cpc-omni06-0001
  estate: fleet
  subject:
    class: host
    ref: host:cpc-omni06
  host:
    host_id: cpc-omni06
    device_name: CPC-Omni0-Y8QD1
