# expected_failure: lease-expiry-inconsistent-with-ttl
# VIOLATES spec R4 and R6 arithmetically rather than structurally: the cadence
# advertises a 24-hour TTL and the lease expires in ten days.
#
# Both fail-closed bounds this family promises are computed from these two fields
# — R4's "TTL plus the declared grace window" and R6 scenario 1's "cadence plus
# the grace window" — and nothing tied them together, so a broker bug that issued
# decade-long expiries while advertising an hourly renewal cadence was invisible
# to the schema and to every realization that pins the bundle. A lease is the
# authority record; its expiry is the authority.
#
# No schema can express this (it is arithmetic across three fields, one of them a
# duration), so it is the canonical validator's rule (g), evaluated within the
# lease's own declared clock-skew tolerance.
schema_version: 1
kind: worker_lease

lease_id: wl-ws-volunteer-31-0001
estate: temp

subject:
  class: engineer
  ref: engineer:eng-0063

host:
  host_id: ws-volunteer-31
  device_name: WS-VOL31-XR8T4
  managed: false

worker:
  worker_id: xfactory-coding-temp-ws-volunteer-31
  runner_name: xfactory-coding-temp-ws-volunteer-31

binding:
  runner_group: xfactory-temp-volunteer-workers
  labels:
    - self-hosted
    - omnigent
    - temp
    - volunteered

trust_tier: volunteered_hardware
issued_at: "2026-07-26T09:00:00Z"
expires_at: "2026-08-05T09:00:00Z"
cadence:
  ttl: PT24H
  renewal_interval: PT1H
  grace: PT12H
  clock_skew_tolerance: PT5M
floor_in_force:
  min_app_version: 1.4.0
state: active
policy_version: worker-enrollment-v1
