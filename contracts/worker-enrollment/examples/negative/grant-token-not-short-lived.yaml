# expected_failure: registration-token-not-short-lived
# VIOLATES spec R2 ("the registration token MUST be short-lived") and makes R2
# scenario 3 ("an expired token cannot register") untestable. The declaration says
# every right thing — `transient: true`, `single_use: true`, persist and log
# forbidden, excluded from derived records — and the token is good until 2099.
#
# `single_use` was pinned as a constant while "short-lived" had no representation
# anywhere in the family: no maximum in the grant, no token lifetime in the
# policy, and no check against `granted_at`. A 73-year single-use token validated
# with zero findings, and so did one already expired at the moment of issue, so
# the broker service, the host app and the managed-platform policy could each pick
# a different lifetime while all three claimed to pin the same bundle.
#
# Fixed in three places: the grant declares a `lifetime` the PATTERN caps at
# fifteen minutes, the policy declares `registration_token.max_lifetime` as the
# estate ceiling, and the canonical validator's rule (g) checks the actual
# `granted_at` -> `expires_at` span against both (and rejects a non-positive one).
