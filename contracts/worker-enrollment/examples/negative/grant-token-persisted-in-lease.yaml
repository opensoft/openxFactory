# expected_failure: token-in-record
# expected_failure_detail: lease.registration_token
# VIOLATES spec R2 (the lease is the record of authority and carries NO token
# field at all) and the transient-token declaration of
# worker-enrollment-grant.schema.yaml. The grant is otherwise well formed; the
# emitter helpfully copied the registration token into the lease so the host could
# "re-register later". That is exactly the failure the lease inversion exists to
# prevent: the lease is the document the host PERSISTS, so a token inside it is a
# standing credential on the machine.
#
# Fails twice, by design — the lease schema's `additionalProperties: false` has no
# such property, and the canonical validator's rule (a) finds a token-shaped
# property inside a derived record.
