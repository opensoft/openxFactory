# expected_failure: embedded-secret
# expected_failure_detail: pem_lines
# VIOLATES spec R2 and R9 in the one document the temp estate has no other
# delivery plane for. Everything about this grant is right — temp lease, dedicated
# temp group, self-updating runner with no pin, broker-served manifest, transient
# token declaration with no value — except that the manifest the broker RENDERS
# carries an App installation key, chunked across the items of an array, a hex
# secret under an innocuous key, and a runner registration token split in two.
#
# `host_manifest.inline` used to be `{type: object, minProperties: 1}`: an
# unbounded channel in the family that advertises `additionalProperties: false`
# at every level, and the ONLY channel that writes to a volunteer's disk. The
# property-name vocabulary was the sole guard, so `client_secret_hex` was caught
# and `installation_material_hex` was not.
#
# Now: the channel is bounded (closed key vocabulary, bounded scalars, bounded
# breadth and depth) and the canonical validator DE-CHUNKS inside this subtree —
# it concatenates array items and map values before testing for a token shape, and
# it refuses a long opaque hex blob under any key that is not a digest.
