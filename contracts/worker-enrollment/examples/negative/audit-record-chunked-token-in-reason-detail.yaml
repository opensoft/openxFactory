# expected_failure: embedded-secret
# expected_failure_detail: reason_detail
# VIOLATES spec R9 in the field the family declares immune by shape. This is
# `audit-record-carries-token.yaml`'s exact scenario — "record which token it
# issued, for traceability" — written into the one free-text field instead of a
# property of its own, with dots between the pieces.
#
# The run bound was the whole protection, and separators were excluded from the
# run class: `AABF...TS6.FCWO...HJ.TP7Q` is a complete 52-character token that a
# single `value.replace('.', '')` recovers. A 40-character unbroken base64ish
# string WAS rejected, so the bound worked against the naive case and only
# against the naive case.
#
# Fails twice now: `constrained_text` counts separators as part of a run, and the
# canonical validator re-tests every value with separators stripped per word.
