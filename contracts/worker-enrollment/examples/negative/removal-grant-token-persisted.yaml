# expected_failure: token-in-record
# expected_failure_detail: remove_token.value
# VIOLATES spec R2/R3 and the transient-token declaration of
# worker-removal-grant.schema.yaml. The declaration says every right thing —
# `transient: true`, `single_use: true`, persist and log forbidden, excluded from
# derived records — and then the broker wrote the issuance response to its own
# store with the token value still in it, "so a retry can reuse it".
#
# There is no retry. The token is single-use and short-lived by contract, and a
# retry is a second request against the lease. `value` is `writeOnly` precisely so
# that a stored, committed, or scanned artifact carrying it is a finding rather than
# a judgement call — which is why every packaged positive example of this family
# shows the declaration and no value.
#
# Fails twice, by design — the canonical validator's `remove_token.value` check and
# its rule (a) value scan, which sees a token-shaped run.
