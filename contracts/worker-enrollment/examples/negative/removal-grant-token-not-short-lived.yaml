# expected_failure: remove-token-not-short-lived
# VIOLATES spec R3 ("receives a short-lived single-use token") the same way
# `grant-token-not-short-lived.yaml` violated R2 for the registration token: the
# declaration says every right thing — `transient: true`, `single_use: true`,
# `lifetime: PT10M`, persist and log forbidden, excluded from derived records — and
# the token is good until 2099.
#
# This fixture exists because the phase-1 review proved the identical hole in the
# ENROLLMENT grant, and a remove token is the SAME administration-tier authority
# pointed the other way: it deregisters runners. A shape that declares a bounded
# `lifetime` and never checks it against the clock is a shape whose bound is
# decoration. So the canonical validator checks the actual `issued_at` ->
# `expires_at` span against both the declared lifetime and the contract's
# fifteen-minute ceiling, and rejects a non-positive one.
#
# A remove token that lives for decades is a standing deregistration credential —
# and unlike a stale registration, a stale REMOVAL authority takes workers out of
# the standing execution lane.
