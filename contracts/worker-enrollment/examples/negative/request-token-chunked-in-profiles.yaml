# expected_failure: embedded-secret
# expected_failure_detail: profiles
# VIOLATES spec R9 by CHUNKING. `requested_worker.profiles` is the one map in the
# request whose key names the consumer chooses, and a 52-character runner
# registration token is here in seven pieces under seven invented profile names.
#
# Two entries used to defeat the no-secret rule completely: the key names are
# unmodelled, so the property-name vocabulary had nothing to match, and each
# 26-character half sat under the value heuristic's run floor. The control case is
# the same token unsplit in an identifier field — THAT was always caught, which is
# what showed chunking to be the entire bypass.
#
# Both layers moved. The schema bounds the map on both sides (label-shaped keys,
# eight-character flag values, bounded breadth), so the two-halves version is now
# a schema failure; this fixture uses the residual seven-piece form that the
# schema still admits, and the canonical validator catches it by testing the
# CONCATENATION of the map's values for a token shape.
