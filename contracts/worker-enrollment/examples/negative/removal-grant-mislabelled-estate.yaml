# expected_failure: estate-coherence
# expected_failure_detail: estate 'fleet' contradicts
# VIOLATES spec R1/R8 the same way `volunteer-lease-relabelled-as-fleet.yaml` and
# `audit-record-volunteer-as-managed-fleet.yaml` do, on the third shape that carries
# the four coupled facts. `host.managed: false` and
# `trust_tier: volunteered_hardware` describe a volunteered workstation;
# `estate: fleet` claims managed metal.
#
# On a removal grant the relabelling is worse than on either of the other two,
# because the segregation rule that keeps volunteered hardware out of a standing
# runner group KEYS OFF THE ESTATE — so a removal grant that reads as fleet can be
# scoped to the standing execution lane without rule (b) ever arming. That is why
# the rule is additionally armed by any temp-shaped fact, why the shape couples the
# four fields in both directions, and why this fixture exists: a rule branch with no
# fixture is a rule branch that rots.
#
# The runner group here is the honest temp one, so the ONLY finding is the estate
# lie — the fixture tests the coupling and nothing else.
