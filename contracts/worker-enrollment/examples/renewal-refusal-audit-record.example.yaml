# Positive reference example — the REFUSAL audit record (spec R9 scenarios 1 and
# 3, R5). The floor was raised to 1.5.0 and this volunteer workstation is still on
# 1.3.2, so its renewal was refused. It is the counterpart of
# `renewal-below-floor-refusal.example.yaml`: that one is the EXCHANGE, this one is
# the record the audit trail keeps.
#
# It exists as a packaged positive because the family had none for any refusal, so
# nothing pinned the two things this shape has to settle:
#
#   * ONE ENCODING. A refused renewal is `event: renew` + `decision: refused`,
#     never `event: refuse` (which is reserved for a refused ENROLLMENT, before any
#     lease exists). Both used to be legal and nothing chose, so a compliance query
#     filtering one returned silence against a broker that emitted the other — and
#     read the silence as "no refusals occurred";
#   * THE TIER AND THE GROUP TRAVEL. They are required here, not only on allowed
#     decisions, because R9 scenario 3 makes the revocation record and the refusals
#     that follow it the SOLE evidence for when and why a worker lost authority —
#     and R8 scenario 3 asks that same trail to show sensitive work never reached
#     volunteered hardware.
#
# As on every record: no token, no key, no secret, no response body, and
# `reason_detail` bounded so none can be smuggled into prose.
