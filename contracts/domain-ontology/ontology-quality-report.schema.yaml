schema_version: 1
name: xfactory_ontology_quality_report
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://xforge.us/schemas/openxfactory/domain-ontology/v1/ontology-quality-report.schema.yaml"
# Domain-ontology contract (add-domain-ontology-layer; lifecycle spec
# "Measurable ontology quality accountability"). The per-release quality
# report shape. Introduced with the family so the privacy floor on term-level
# signals is enforceable from the first fixture (task 3.3); the telemetry
# wiring and threshold policy land with change section 5 (task 5.8).
#
# EVERY SIGNAL IS COMPUTABLE AND REPRODUCIBLE: numerator, denominator,
# observation window, recorded procedure, and (for fixture accuracy) the
# pinned fixture-set digest. Deterministic validator conformance is a separate
# pass/fail gate and is NOT a quality ratio.
#
# TERM-LEVEL SIGNALS SIT UNDER THE AGGREGATION FLOOR: counts over normalized
# term forms only, no free text, no subject/tenant/record identifiers; a term
# below the domain's distinct-subject AND distinct-tenant floor appears only
# inside `unreportable_count`. A declared distinct-subject floor below two is
# a recorded, reviewed privacy exception, never a default.
type: object
required:
  - schema_version
  - kind
  - package_id
  - package_version
  - package_digest
  - window
  - signals
  - aggregation_floor
additionalProperties: false
properties:
  schema_version:
    const: 1
  kind:
    const: xfactory_ontology_quality_report
  package_id:
    type: string
    pattern: "^xf/[a-z0-9_]+$"
  package_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  package_digest:
    type: string
    pattern: "^[a-f0-9]{64}$"
  window:
    type: object
    required: [from, to]
    additionalProperties: false
    properties:
      from:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      to:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  signals:
    type: array
    minItems: 1
    items:
      type: object
      required: [signal, numerator, denominator, procedure_ref]
      additionalProperties: false
      properties:
        signal:
          enum:
            - intake_scope_coverage
            - unknown_term_rate
            - mapping_resolution_rate
            - fixture_accuracy
            - open_candidate_age_p50_days
            - open_candidate_age_max_days
        numerator:
          type: number
          minimum: 0
        denominator:
          type: number
          minimum: 0
        procedure_ref:
          type: string
          minLength: 1
          maxLength: 300
        fixture_set_digest:
          # Required for fixture_accuracy (validator rule).
          type: string
          pattern: "^[a-f0-9]{64}$"
        threshold:
          type: number
        threshold_met:
          type: boolean
  term_signals:
    type: array
    items:
      type: object
      required: [term_form, count, distinct_subjects, distinct_tenants]
      additionalProperties: false
      properties:
        term_form:
          # Normalized term form only — length-capped, no surrounding text.
          type: string
          minLength: 1
          maxLength: 80
        count:
          type: integer
          minimum: 1
        distinct_subjects:
          type: integer
          minimum: 1
        distinct_tenants:
          type: integer
          minimum: 1
  aggregation_floor:
    type: object
    required: [distinct_subjects, distinct_tenants]
    additionalProperties: false
    properties:
      distinct_subjects:
        type: integer
        minimum: 1
      distinct_tenants:
        type: integer
        minimum: 1
      floor_exception_ref:
        # Required when distinct_subjects < 2 (validator ONT-FLOOR rule).
        type: string
        minLength: 1
        maxLength: 300
  unreportable_count:
    type: integer
    minimum: 0
