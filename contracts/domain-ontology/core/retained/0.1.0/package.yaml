kind: xfactory_ontology_package_manifest
# The xFactory semantic kernel package manifest (add-domain-ontology-layer,
# task 2.4). DRAFT by design: the kernel bootstraps before any domain package
# exists, so adoption evidence is pending (ratified bootstrap scenario); the
# package publishes only when every term's two adopters resolve — the
# MedxFactory/codexFactory pilots (change task 7.2) are what first make the
# core terms publishable. openxFactory alone classifies kernel revisions.
# Digests are stamped by tooling and recomputed by the canonical validator;
# the package digest is sha256 over the sorted "path sha256" inventory lines.
