  - path: relations.yaml
    sha256: 2d36d107a55791ac7940c9983afea476214c2156f58b2df00c7939141b047b03
  - path: sources.yaml
    sha256: c7a24dcc83052e03f5fa2b10233f3882a4f295be99880b866bf0af0a105ba715
package_digest: 9d4ea5fa3e44505bbe1c3e00c5f007941cf0a30f6cbd0f2030cd83250dd505a5
