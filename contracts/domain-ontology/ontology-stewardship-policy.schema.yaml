schema_version: 1
name: xfactory_ontology_stewardship_policy
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://xforge.us/schemas/openxfactory/domain-ontology/v1/ontology-stewardship-policy.schema.yaml"
# Domain-ontology contract (add-domain-ontology-layer, tasks 5.2/5.3/5.4/5.8).
# The machine-readable Domain Hermes stewardship policy for one ontology
# package: review council, source review cadence, the seven canonical
# fill/maintenance mode workflows, candidate triggers, and the quality gate.
#
# The policy is PACKAGE CONTENT (inventoried, digest-covered) so governance
# is pinned with the meaning it governs. The kernel package carries none —
# kernel revisions are classified by openxFactory through the OpenSpec
# process, not by a runtime policy. Tools consume this policy
# deterministically: `scripts/ontology-maintenance.py` evaluates `triggers`
# against a governed maintenance input; `scripts/ontology-release.py`
# enforces `quality_gate` and council reservations at publication; the
# canonical validator resolves every referenced steward against the package
# manifest roster.
type: object
required:
  - schema_version
  - kind
  - package_id
  - council
  - source_review
  - modes
  - triggers
  - quality_gate
  - aggregation_floor
additionalProperties: false
properties:
  schema_version:
    const: 1
  kind:
    const: xfactory_ontology_stewardship_policy
  package_id:
    type: string
    pattern: "^xf/[a-z0-9_]+$"
  council:
    type: object
    required: [name, members, quorum, high_impact_requires]
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 120
      members:
        # steward_ids resolved against the package manifest roster.
        type: array
        minItems: 1
        items:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
      quorum:
        type: integer
        minimum: 1
      high_impact_requires:
        # Approval kinds a high-impact semantic change must carry before
        # publication (lifecycle spec: "A high-impact domain requires
        # accountable human review").
        type: array
        minItems: 1
        items:
          enum: [licensed_human, domain_authority, council]
  source_review:
    type: object
    required: [default_review_days]
    additionalProperties: false
    properties:
      default_review_days:
        type: integer
        minimum: 1
      expired_source_mode:
        enum: [refresh, reconcile]
  modes:
    # The seven canonical fill/maintenance modes, each mapped to required
    # inputs, review evidence, outputs, and blocked states (task 5.3).
    type: object
    required: [seed, extend, refresh, reconcile, correct, deprecate, retire]
    additionalProperties: false
    properties:
      seed: {$ref: "#/$defs/mode_workflow"}
      extend: {$ref: "#/$defs/mode_workflow"}
      refresh: {$ref: "#/$defs/mode_workflow"}
      reconcile: {$ref: "#/$defs/mode_workflow"}
      correct: {$ref: "#/$defs/mode_workflow"}
      deprecate: {$ref: "#/$defs/mode_workflow"}
      retire: {$ref: "#/$defs/mode_workflow"}
  triggers:
    # Domain-declared thresholds; crossing one opens a candidate in the
    # mapped mode (task 5.4; lifecycle spec maintenance scenarios).
    type: object
    required:
      - unknown_term_count_threshold
      - mapping_failure_count_threshold
      - low_confidence_threshold
      - low_confidence_count_threshold
    additionalProperties: false
    properties:
      unknown_term_count_threshold:
        type: integer
        minimum: 1
      mapping_failure_count_threshold:
        type: integer
        minimum: 1
      low_confidence_threshold:
        type: number
        exclusiveMinimum: 0
        maximum: 1
      low_confidence_count_threshold:
        type: integer
        minimum: 1
      unknown_term_mode:
        enum: [extend, reconcile]
      mapping_failure_mode:
        enum: [refresh, reconcile, correct]
      low_confidence_mode:
        enum: [reconcile, correct]
      workflow_drift_mode:
        enum: [reconcile]
      subdomain_request_mode:
        enum: [extend]
      appeal_mode:
        enum: [correct, reconcile]
      promotion_mode:
        enum: [extend]
  quality_gate:
    # Publication gate (task 5.8): required signals with domain thresholds;
    # a missing or below-threshold required signal blocks publication unless
    # the release records a reviewed exception.
    type: object
    required: [required_signals]
    additionalProperties: false
    properties:
      required_signals:
        type: array
        minItems: 1
        items:
          type: object
          # At least one bound (add-ontology-stewardship-hardening, review
          # F26): a floor for coverage-style signals, a ceiling for
          # rate-style signals (unknown_term_rate must stay LOW), or both.
          # A required signal declaring neither bound is vacuous and fails.
          required: [signal]
          anyOf:
            - required: [min_value]
            - required: [max_value]
          additionalProperties: false
          properties:
            signal:
              enum:
                - intake_scope_coverage
                - unknown_term_rate
                - mapping_resolution_rate
                - fixture_accuracy
                - open_candidate_age_p50_days
                - open_candidate_age_max_days
            min_value:
              type: number
            max_value:
              type: number
      exception_requires:
        enum: [reviewed_exception_ref]
  aggregation_floor:
    # The domain's STANDING privacy floor for term-level signals; quality
    # reports and maintenance inputs are checked against it. A declared
    # distinct-subject floor below two is a recorded, reviewed privacy
    # exception, never a default.
    type: object
    required: [distinct_subjects, distinct_tenants]
    additionalProperties: false
    properties:
      distinct_subjects:
        type: integer
        minimum: 1
      distinct_tenants:
        type: integer
        minimum: 1
      floor_exception_ref:
        type: string
        minLength: 1
        maxLength: 300
$defs:
  mode_workflow:
    type: object
    required: [required_inputs, review_evidence, outputs, blocked_states]
    additionalProperties: false
    properties:
      required_inputs:
        type: array
        minItems: 1
        items:
          enum:
            - intake_answer_set
            - source_inventory_entry
            - candidate_record
            - conflict_report
            - impact_report
            - migration_map
            - quality_report
            - appeal_record
            - promotion_evidence
            - telemetry_observation
      review_evidence:
        type: array
        minItems: 1
        items:
          enum:
            - steward_review
            - council_review
            - domain_authority_approval
            - licensed_human_approval
            - fixture_update
            - consumer_impact_review
      outputs:
        type: array
        minItems: 1
        items:
          enum:
            - candidate_disposition
            - package_revision
            - release_record
            - migration_map
            - deprecation_notice
            - retirement_notice
            - maintenance_report
      blocked_states:
        type: array
        minItems: 1
        items:
          enum:
            - awaiting_review
            - awaiting_domain_authority
            - awaiting_migration_map
            - awaiting_quality_report
            - awaiting_consumer_notice
