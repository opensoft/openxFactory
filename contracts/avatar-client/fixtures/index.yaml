  # ---------- AVC-09 voice adapter descriptor ----------
  # Published by qualify-avatar-live-voice from the reserved shape. The two
  # negatives the change NAMES are `avc09-latency-budget-refused` (Fork 2's
  # Option C: no numeric budget field) and `avc09-carries-secret`.
  - case_id: avc09-valid
    target: avc-09-voice-adapter-descriptor.schema.yaml
    target_kind: schema
    expect: valid
    class: valid
    scenario_ids: [ALV-001-S01]
    evidence_id: TEST-ALV-001-S01
    instance:
      adapter_id: avc-voice-adapter
      adapter_version: "1.4.0"
      provider: openai
      supported_profiles: [gpt-realtime-2.1]
      requested_model: {alias: gpt-realtime-2.1}
      provider_resolved_model: gpt-realtime-2.1-snapshot-a
      server_component:
        component_id: broker-voice-adapter
        component_version: "1.4.0"
        prompt_configuration_version: prompt-7
        policy_configuration_version: policy-4
        voice_configuration_version: voice-2
        turn_configuration_version: turn-3
        capability_mapper_version: capmap-5
        event_mapper_version: evtmap-5
      client_component:
        component_id: flutter-voice-adapter
        component_version: "1.4.0"
        capability_mapper_version: capmap-5
        event_mapper_version: evtmap-5
      authorization_mode: broker_held_server_key
      sideband_readiness: {required: true, verified_before_grant_answer: true}
      direct_media_required: true
      contract_compatibility: {contract_major: 1, contract_schema_version: 1}
      region_and_data_controls:
        declared_region: us
        data_residency: us
        provider_retention: zero_retention_requested
        provider_training_opt_out: true
      status: candidate
      latency_evidence_refs: []
  - case_id: avc09-latency-budget-refused
    target: avc-09-voice-adapter-descriptor.schema.yaml
    target_kind: schema
    expect: invalid
    class: adversarial
    scenario_ids: [ALV-001-S02]
    evidence_id: TEST-ALV-001-S02
    # Fork 2 Option C. A per-profile absolute ceiling on a neutral contract is
    # the Option B that was NOT ruled; gating lives in the relative-regression
    # SLO and the measured numbers live in AVC-10.
    instance:
      adapter_id: avc-voice-adapter
      adapter_version: "1.4.0"
      provider: openai
      supported_profiles: [gpt-realtime-2.1]
      requested_model: {alias: gpt-realtime-2.1}
      provider_resolved_model: gpt-realtime-2.1-snapshot-a
      server_component:
        component_id: broker-voice-adapter
        component_version: "1.4.0"
        prompt_configuration_version: prompt-7
        policy_configuration_version: policy-4
        voice_configuration_version: voice-2
        turn_configuration_version: turn-3
        capability_mapper_version: capmap-5
        event_mapper_version: evtmap-5
      client_component:
        component_id: flutter-voice-adapter
        component_version: "1.4.0"
        capability_mapper_version: capmap-5
        event_mapper_version: evtmap-5
      authorization_mode: broker_held_server_key
      sideband_readiness: {required: true, verified_before_grant_answer: true}
      direct_media_required: true
      contract_compatibility: {contract_major: 1}
      region_and_data_controls: {declared_region: us}
      status: candidate
      latency_evidence_refs: []
      latency_budget_ms: 800
  - case_id: avc09-carries-secret
    target: avc-09-voice-adapter-descriptor.schema.yaml
    target_kind: schema
    expect: invalid
    class: redaction
    scenario_ids: [ALV-001-S03]
    evidence_id: TEST-ALV-001-S03
    # FR-006/FR-018 structural exclusion: the descriptor is incapable of
    # carrying a provider key, an ephemeral client secret, SDP, or raw content.
    instance:
      adapter_id: avc-voice-adapter
      adapter_version: "1.4.0"
      provider: openai
      supported_profiles: [gpt-realtime-2.1]
      requested_model: {alias: gpt-realtime-2.1}
      provider_resolved_model: gpt-realtime-2.1-snapshot-a
      server_component:
        component_id: broker-voice-adapter
        component_version: "1.4.0"
        prompt_configuration_version: prompt-7
        policy_configuration_version: policy-4
        voice_configuration_version: voice-2
        turn_configuration_version: turn-3
        capability_mapper_version: capmap-5
        event_mapper_version: evtmap-5
      client_component:
        component_id: flutter-voice-adapter
        component_version: "1.4.0"
        capability_mapper_version: capmap-5
        event_mapper_version: evtmap-5
      authorization_mode: broker_held_server_key
      sideband_readiness: {required: true, verified_before_grant_answer: true}
      direct_media_required: true
      contract_compatibility: {contract_major: 1}
      region_and_data_controls: {declared_region: us}
      status: candidate
      latency_evidence_refs: []
      provider_api_key: "SENTINEL_PROVKEY_0000000000"
  - case_id: avc09-client-component-carries-provider-config
    target: avc-09-voice-adapter-descriptor.schema.yaml
    target_kind: schema
    expect: invalid
    class: unknown-field
    scenario_ids: []
    # The client half is a CLOSED shape: it holds mappers and a transport, never
    # a server provider configuration (repo-boundary-governance).
    instance:
      adapter_id: avc-voice-adapter
      adapter_version: "1.4.0"
      provider: openai
      supported_profiles: [gpt-realtime-2.1]
      requested_model: {snapshot: gpt-realtime-2.1-snapshot-a}
      provider_resolved_model: gpt-realtime-2.1-snapshot-a
      server_component:
        component_id: broker-voice-adapter
        component_version: "1.4.0"
        prompt_configuration_version: prompt-7
        policy_configuration_version: policy-4
        voice_configuration_version: voice-2
        turn_configuration_version: turn-3
        capability_mapper_version: capmap-5
        event_mapper_version: evtmap-5
      client_component:
        component_id: flutter-voice-adapter
        component_version: "1.4.0"
        capability_mapper_version: capmap-5
        event_mapper_version: evtmap-5
        prompt_configuration_version: prompt-7
      authorization_mode: broker_held_server_key
      sideband_readiness: {required: true, verified_before_grant_answer: true}
      direct_media_required: true
      contract_compatibility: {contract_major: 1}
      region_and_data_controls: {declared_region: us}
      status: candidate
      latency_evidence_refs: []
  - case_id: avc09-approved-without-latency-evidence
    target: avc-09-voice-adapter-descriptor.schema.yaml
    target_kind: schema
    expect: invalid
    class: boundary
    scenario_ids: []
    # `approved` is the status that claims measured evidence. It may not be
    # claimed with an empty reference list.
    instance:
      adapter_id: avc-voice-adapter
      adapter_version: "1.4.0"
      provider: openai
      supported_profiles: [gpt-realtime-2.1]
      requested_model: {alias: gpt-realtime-2.1}
      provider_resolved_model: gpt-realtime-2.1-snapshot-a
      server_component:
        component_id: broker-voice-adapter
        component_version: "1.4.0"
        prompt_configuration_version: prompt-7
        policy_configuration_version: policy-4
        voice_configuration_version: voice-2
        turn_configuration_version: turn-3
        capability_mapper_version: capmap-5
        event_mapper_version: evtmap-5
      client_component:
        component_id: flutter-voice-adapter
        component_version: "1.4.0"
        capability_mapper_version: capmap-5
        event_mapper_version: evtmap-5
      authorization_mode: broker_held_server_key
      sideband_readiness: {required: true, verified_before_grant_answer: true}
      direct_media_required: true
      contract_compatibility: {contract_major: 1}
      region_and_data_controls: {declared_region: us}
      status: approved
      latency_evidence_refs: []

  # ---------- AVC-10 voice latency sample ----------
  # One observation, never a percentile and never a budget. The negatives the
  # change NAMES are the transcript-carrying and SDP-carrying samples; the
  # cross-platform regression comparison is refused under
  # `latency_comparison_cases` below, because a refusal of a COMPARISON cannot
  # be expressed as a single-instance schema case.
  - case_id: avc10-governed-adapter-valid
    target: avc-10-voice-latency-sample.schema.yaml
    target_kind: schema
    expect: valid
    class: valid
    scenario_ids: [ALV-002-S01]
    evidence_id: TEST-ALV-002-S01
    instance:
      sample_id: lat-1
      logical_session_id: s1
      session_epoch: 0
      media_leg: {media_leg_id: m1}
      turn_id: t1
      adapter_id: avc-voice-adapter
      adapter_version: "1.4.0"
      profile_id: gpt-realtime-2.1
      platform: windows_desktop
      network_class: nominal
      region: us
      clock: {source: monotonic, quality: trusted, resolution_ms: 1}
      monotonic_origin: media-leg-open
      markers:
        broker_request_ms: 0
        provider_call_ms: 42
        sideband_ready_ms: 210
        media_connected_ms: 340
        speech_ms: 900
        first_audio_ms: 1180
        playback_ms: 1195
      derived_intervals:
        first_playable_after_authorized_ms: 610
        sideband_ready_after_request_ms: 210
        broker_setup_ms: 42
        speech_to_first_audio_ms: 280
      reference_classification: governed_adapter
      fixture_ref: latency/windows-desktop/governed-run-01
  - case_id: avc10-direct-reference-valid
    target: avc-10-voice-latency-sample.schema.yaml
    target_kind: schema
    expect: valid
    class: valid
    scenario_ids: []
    # The same cell measured WITHOUT the broker in the setup path — the
    # comparison partner the relative-regression SLO needs.
    instance:
      sample_id: lat-ref-1
      logical_session_id: s2
      session_epoch: 0
      media_leg: {media_leg_id: m2}
      adapter_id: direct-provider-harness
      adapter_version: "1.4.0"
      profile_id: gpt-realtime-2.1
      platform: web_canvas
      network_class: nominal
      region: us
      clock: {source: performance_now, quality: trusted}
      monotonic_origin: media-leg-open
      markers:
        broker_request_ms: 0
        provider_call_ms: 12
        media_connected_ms: 300
        teardown_ms: 4200
      derived_intervals:
        first_playable_after_authorized_ms: 560
        teardown_to_terminal_ms: 140
      reference_classification: direct_provider_reference
      fixture_ref: latency/web-canvas/direct-reference-run-01
  - case_id: avc10-carries-transcript
    target: avc-10-voice-latency-sample.schema.yaml
    target_kind: schema
    expect: invalid
    class: redaction
    scenario_ids: [ALV-002-S03]
    evidence_id: TEST-ALV-002-S03
    # FR-018 structural exclusion: a latency sample carries timings, never
    # content. The `not` forbids the content keys regardless of evolution.
    instance:
      sample_id: lat-2
      logical_session_id: s1
      session_epoch: 0
      media_leg: {media_leg_id: m1}
      adapter_id: avc-voice-adapter
      adapter_version: "1.4.0"
      profile_id: gpt-realtime-2.1
      platform: windows_desktop
      network_class: nominal
      region: us
      clock: {source: monotonic, quality: trusted}
      monotonic_origin: media-leg-open
      markers: {broker_request_ms: 0, first_audio_ms: 1180}
      derived_intervals: {first_playable_after_authorized_ms: 610}
      reference_classification: governed_adapter
      fixture_ref: latency/windows-desktop/governed-run-02
      full_transcript: redacted_placeholder
  - case_id: avc10-carries-sdp
    target: avc-10-voice-latency-sample.schema.yaml
    target_kind: schema
    expect: invalid
    class: redaction
    scenario_ids: []
    instance:
      sample_id: lat-3
      logical_session_id: s1
      session_epoch: 0
      media_leg: {media_leg_id: m1}
      adapter_id: avc-voice-adapter
      adapter_version: "1.4.0"
      profile_id: gpt-realtime-2.1
      platform: windows_desktop
      network_class: nominal
      region: us
      clock: {source: monotonic, quality: trusted}
      monotonic_origin: media-leg-open
      markers: {broker_request_ms: 0, media_connected_ms: 340}
      derived_intervals: {first_playable_after_authorized_ms: 610}
      reference_classification: governed_adapter
      fixture_ref: latency/windows-desktop/governed-run-03
      sdp_answer: "SENTINEL_SDP_ANSWER_000000"
  - case_id: avc10-unknown-marker
    target: avc-10-voice-latency-sample.schema.yaml
    target_kind: schema
    expect: invalid
    class: unknown-field
    scenario_ids: []
    # The twelve markers are a CLOSED set; an unrecognized marker would make one
    # run's timings incomparable with another's.
    instance:
      sample_id: lat-4
      logical_session_id: s1
      session_epoch: 0
      media_leg: {media_leg_id: m1}
      adapter_id: avc-voice-adapter
      adapter_version: "1.4.0"
      profile_id: gpt-realtime-2.1
      platform: windows_desktop
      network_class: nominal
      region: us
      clock: {source: monotonic, quality: trusted}
