      - {speaker: authority, event: session_result, note: "authoritative DENIAL with fallback modes — the action needs a reviewer"}
      - {speaker: avatar, text: "That was declined. Your accountant can post it, or you can continue in text."}
    expected:
      verdict: pass
      behavior: >-
        The denial is rendered as a denial with its fallback modes and is NOT
        reported as a blocked state; control stays healthy.
    emits_on_failure:
      trigger: failed_blocked_state_evaluation
      rollback_class: ROLLBACK-A
      scenario_class: blocked_state
      session_outcome: revoked
      finding: "a governed denial was rendered as a blocked state"
    basis: >-
      examples/avatar-first-ui/fixtures/deterministic/governed-action-denial.yaml.

