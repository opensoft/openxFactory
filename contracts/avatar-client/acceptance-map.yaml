      - {id: ACR-002-S03, title: Session request is retried after a lost response}
      - {id: ACR-002-S04, title: A retry substitutes another SDP offer}
      - {id: ACR-002-S05, title: A grant answer is bound to another local offer}
      - {id: ACR-002-S06, title: A failed pending attempt needs a regenerated offer}
      - {id: ACR-002-S07, title: A second client instance requests the active session}
      - {id: ACR-002-S08, title: Tenant quota is exhausted}
      - {id: ACR-002-S09, title: Non-grant result attempts to carry a secret}
