schema_version: 1
kind: avatar-client-acceptance-map
change_id: define-avatar-client-contract-kernel
interface_baseline: avatar-client-parallel-v1
expected_requirement_count: 26
expected_scenario_count: 107
evidence_id_template: "TEST-{scenario_id}"
# Realized under contracts/avatar-client/ (traceability doc; task 3.2). The
# validator compares this map to the OpenSpec deltas and to evidence-register.yaml.
#
# COUNT PROVENANCE (qualify-avatar-live-voice task 3.4, measured not assumed).
# 17 -> 26 requirements and 72 -> 107 scenarios. The nine ADDED `avatar-live-voice`
# requirements bring 31 scenarios (ALV-001..ALV-009); the four MODIFIED
# requirements add one scenario each and no new requirement — ACR-001-S04,
# ACR-007-S05, ACR-011-S03, RBG-001-S03. 9 + 0 = 9 requirements; 31 + 4 = 35
# scenarios. Counted off the change's own delta files:
# `grep -c '^### Requirement:'` / `'^#### Scenario:'` gives avatar-live-voice
# 9/31, avatar-client-runtime 3/12 (against 9 already mapped) and
# repo-boundary-governance 1/3 (against 2 already mapped). The
# `avatar-client-lab` delta's requirement is not carried by THIS map; it lives
# in contracts/avatar-client-lab/.
requirements:
  - id: ACR-001
    capability: avatar-client-runtime
    title: Versioned neutral avatar-client contract kernel
    evidence_types: [automated]
    owner_changes: [qualify-avatar-live-voice]
    scenarios:
      - {id: ACR-001-S01, title: Compatible binding reads an additive contract}
      - {id: ACR-001-S02, title: Consumer receives an incompatible major}
      - {id: ACR-001-S03, title: Consequential vocabulary is unknown}
      - id: ACR-001-S04
        title: A live contract identifier leaves the reserved set
        owning_task: qualify-avatar-live-voice 3.1
        evidence_id: CHECK-interface_lock_reserved_set
        release_ring: internal_live
        status: evidenced
