# ---- the neutral relative-regression latency SLO (task 3.4) ---------------
# EXACTLY ONE SLO entry lives in this map, and `validate-avatar-client.py`'s
# `latency_posture` check fails closed on zero, on two, on a wrong threshold,
# and on any per-profile numeric latency ceiling presented as a gating field.
# Latency gating is HERE and nowhere else: AVC-09 carries no budget, because a
# ceiling frozen into a neutral contract is Fork 2's Option B, which was not
# ruled.
#
# THE 3.4 / 5.4 SPLIT, stated because it is easy to read wrong. This entry is
# the RULE, and the rule was ratified with the proposal — it is written here
# now, at the ratified threshold, because task 3.3's validator rule fails
# closed without it and task 8.2 requires the validator green in the same
# commit that unreserves the two identifiers. Task 5.4 owns the ENCODING
# AGAINST THE EVIDENCE RUN: the measured per-cell figures under
# `measured_evidence`, which are absent by design until §5 measures them on
# the real Flutter client.
latency_slo:
  id: ALV-SLO-001
  kind: neutral_relative_regression
  requirement: Neutral relative-regression latency SLO gates internal-live
  requirement_id: ALV-004
  owner_change: qualify-avatar-live-voice
  owning_task: qualify-avatar-live-voice 3.4
  release_ring: internal_live
  status: planned
  materiality:
    rule: greater_of
    relative_threshold_pct: 15
    absolute_threshold_ms: 150
    statement: >-
      A governed-adapter percentile is a MATERIAL REGRESSION when it exceeds the
      same-platform direct-provider reference percentile by more than 15 percent
      relative OR by more than 150 milliseconds absolute, WHICHEVER IS GREATER —
      that is, when adapter > reference + max(0.15 * reference, 150). The
      "whichever is greater" clause is load-bearing: a percentage-only or a
      milliseconds-only reading fails differently on fast and slow intervals.
  comparison_cell:
    must_match: [platform, network_class, region]
    reference_classification: direct_provider_reference
    adapter_classification: governed_adapter
    note: >-
      A comparison whose two sides do not share all three axes is REFUSED as
      evidence rather than evaluated.
  gated:
    percentiles: [p50, p95]
    intervals: [first_playable_after_authorized_ms, sideband_ready_after_request_ms]
    platforms: [windows_desktop, web_canvas]
    network_class: nominal
    effect: >-
      A material regression on ANY gated cell fails promotion to the
      internal-live ring.
  recorded_not_gated:
    percentiles: [p99]
    intervals: [teardown_to_terminal_ms, speech_to_first_audio_ms]
    network_classes: [degraded, jittered]
    effect: >-
      Recorded as informational tail evidence; candidates to become hard gates
      at the pilot ring when sample volume supports them. The five-second
      revocation bound stays pass-or-fail rather than a budgeted percentile.
      A comparison drawn from one of these cells IS EVALUATED AND RECORDED, not
      refused — the ratified rule is that such evidence MAY be recorded but MUST
      NOT substitute for a nominal-network gated cell. What is refused is a
      comparison that CLAIMS THE GATED TIER from a cell listed here, or from a
      reference-generation-only platform. The refusal attaches to the claim, not
      to the cell, or this tier would be unreachable.
  reference_generation_only_platforms: [linux_ci]
  measured_evidence:
    status: not_yet_measured
    owning_task: qualify-avatar-live-voice 5.1-5.4
    note: >-
      The per-cell measured figures belong to §5's evidence run on the real
      Flutter client. F0's harness distributions — first-playable p50 603.63 /
      p95 643.488 ms, sideband p50 772.37 / p95 1642.119 ms — were produced by
      a single Python and aiortc harness with no region on neither gated
      platform, and DO NOT QUALIFY as the reference. They may be cited as
      sanity checks only.
