schema_version: 1
kind: openxfactory-openxwallet-contract-schema
name: xfactory_wallet_custody_registry
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://xforge.us/schemas/openxfactory/openxwallet/v1/openxwallet-custody-registry.schema.yaml"
contract_id: openxwallet-custody-registry
contract_schema_version: 1
title: openxWallet custody registry
description: >-
  The CLOSED key-custody enumeration and the ordered authority ladder
  (add-openxwallet, capability `openxwallet`, requirement "Custody is declared
  and bounds what a signature evidences"; Brett's ruling of 2026-08-07).

  The ruling was that custody is DECLARED from a closed set and CAPS the
  authority a wallet may hold — neither mandated (which would stall every
  consumer, there being no key infrastructure in the stack) nor unstated
  (which would let a key readable by its own execution context masquerade as
  proof the HOLDER acted, making the audit record assert something false).

  What each member EVIDENCES is contract content, not an implementation
  detail. The failure mode this shape defends against is a set that fails to
  distinguish a key readable by the holder's own execution context from one
  isolated from it: the readable case would claim the isolated case's
  authority, and it would all validate cleanly.

  So `evidences` is NEVER independently asserted. It is DERIVED from two
  declared booleans and checked by the canonical validator:

      evidences = holder   iff  (not key_readable_by_holder_execution_context)
                                and use_requires_authorization_outside_holder_execution_context
                 environment otherwise

  A member that is readable yet claims to evidence the holder does not
  validate. Nor does a member whose ceiling is `act_unsupervised` without
  evidencing the holder, nor a readable member sitting at or above a member
  that evidences the holder. The collapse is structurally impossible rather
  than merely discouraged.

  The second boolean carries the distinction a two-member set would lose. A
  key isolated from the holder's execution context but signable by it WITHOUT
  LIMIT contains the key — it cannot be exfiltrated and replayed off-platform
  — but it does not attribute the act: a compromised environment still signs
  anything the holder could. Only an authorization the holder's own execution
  context cannot supply distinguishes "the holder decided" from "something
  running as the holder decided".

  Reading note on the ratified text: "only custody isolating the key from that
  context evidences that the HOLDER acted" is a NECESSARY condition, not a
  sufficient one. Isolation is required for a holder claim; it does not by
  itself earn one.
type: object
required:
  - schema_version
  - kind
  - registry_id
  - registry_version
  - authority_tiers
  - custody_models
additionalProperties: false
properties:
  schema_version: {type: integer, minimum: 1}
  kind:
    type: string
    enum: [xfactory_wallet_custody_registry]
  registry_id: {$ref: '#/$defs/identifier'}
  registry_version: {type: integer, minimum: 1}
  authority_tiers:
    # ORDERED, ascending. Each tier is defined by what the holder can do
    # ALONE. Approving is not a tier — it is an effecting act expressed as
    # grant scope, which is why `authority_agents_may_approve: true` requires
    # tier `act` or above rather than a tier of its own.
    type: array
    minItems: 2
    uniqueItems: true
    items:
      type: object
      required: [id, rank, statement]
      additionalProperties: false
      properties:
        id: {$ref: '#/$defs/identifier'}
        rank: {type: integer, minimum: 0}
        statement: {type: string, minLength: 1, maxLength: 600}
  custody_models:
    type: array
    minItems: 2
    uniqueItems: true
    items:
      type: object
      required:
        - id
        - title
        - key_readable_by_holder_execution_context
        - use_requires_authorization_outside_holder_execution_context
        - evidences
        - evidences_statement
        - authority_ceiling
      additionalProperties: false
      properties:
        id: {$ref: '#/$defs/identifier'}
        title: {type: string, minLength: 1, maxLength: 200}
        key_readable_by_holder_execution_context:
          # Can the holder's own execution context READ the key material —
          # process memory, a file it can open, an environment variable, a
          # mounted secret? If yes, the key can be exfiltrated and replayed
          # anywhere, and a signature evidences the environment at best.
          type: boolean
        use_requires_authorization_outside_holder_execution_context:
          # Does each signature require an authorization the holder's own
          # execution context cannot itself supply — a hardware presence
          # check, an external policy approval, a separate custodian? If no,
          # a compromised environment signs at will.
          type: boolean
        evidences:
          # DERIVED, never independently asserted. See the derivation above.
          type: string
          enum: [environment, holder]
        evidences_statement:
          # Prose a reader of an audit record can act on: what a signature
          # under this model actually proves, in the record's own words.
          type: string
          minLength: 1
          maxLength: 800
        authority_ceiling:
          # The highest authority tier a wallet declaring this model may hold.
          # Raising authority is therefore a custody question, never a trust
          # assertion.
          $ref: '#/$defs/identifier'
        notes: {type: string, maxLength: 1200}
  excluded_models:
    # Deliberate NON-members, recorded so they are not re-litigated as
    # oversights. A closed set is only honest if what it refuses is visible.
    type: array
    items:
      type: object
      required: [id, reason]
      additionalProperties: false
      properties:
        id: {$ref: '#/$defs/identifier'}
        reason: {type: string, minLength: 1, maxLength: 800}
$defs:
  identifier:
    type: string
    minLength: 1
    maxLength: 200
    pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]*$'
