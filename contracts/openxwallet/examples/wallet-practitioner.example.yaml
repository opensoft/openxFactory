# VALID wallet record for a NON-AGENT holder. It exists to prove the core is
# holder-class agnostic: no requirement here assumes a class, this record
# carries no composition, and nothing asks it to. A patient has no model
# version, which is exactly why composition lives in the agent profile.
schema_version: 1
kind: xfactory_wallet_record
wallet_id: wal-practitioner-0003
holder:
  holder_id: practitioner:hale-a
  holder_class: practitioner
  display_label: Reviewing practitioner
key_reference:
  did: "did:web:xforge.us:wallets:practitioner-hale"
  key_id: key-practitioner-0003
  signature_algorithm: ecdsa-p256
custody:
  model: isolated_per_use_authorized
  registry_version: 1
state: active
policy_version: 1
