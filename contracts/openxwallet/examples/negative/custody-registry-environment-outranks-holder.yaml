# expected_failure: custody-collapse
# expected_failure_detail: evidences only the ENVIRONMENT yet caps at or above
# requirement: OXW-R4
# VIOLATES core R4 through the GAP BETWEEN TWO LISTS.
#
# Found by review after the first two collapse probes were already green. Rule
# (d) originally asked whether a model's key was READABLE. But readability is
# only one route to evidencing the environment: `isolated_invocable` is not
# readable — its key cannot be exfiltrated — and still evidences only the
# environment, because the holder's context can obtain signatures at will.
#
# So it sat in neither the readable list nor the holder list, and could outrank
# the holder-evidencing model untouched. Here it caps at `act_unsupervised`
# while the model that actually evidences the HOLDER caps two tiers lower, and
# every `evidences` value is declared honestly.
#
# The rule now keys on WHAT A MODEL EVIDENCES rather than on where its key
# lives, which is the property the ruling was ever about.
schema_version: 1
kind: xfactory_wallet_custody_registry
registry_id: openxwallet-custody-env-outranks-holder
registry_version: 1
authority_tiers:
  - id: request
    rank: 1
    statement: Initiate an act a distinct holder must complete or approve.
  - id: act
    rank: 2
    statement: Complete an effecting act, with approval required before apply.
  - id: act_unsupervised
    rank: 3
    statement: Complete an effecting act with no approval before apply.
  - id: act_irreversible
    rank: 4
    statement: An irreversible act with no approval before apply and no recall.
custody_models:
  - id: holder_readable
    title: Key material readable by the holder's own execution context
    key_readable_by_holder_execution_context: true
    use_requires_authorization_outside_holder_execution_context: false
    evidences: environment
    evidences_statement: A signature evidences that the ENVIRONMENT acted.
    authority_ceiling: request
  - id: isolated_per_use_authorized
    title: Key isolated, each use authorized outside the holder's context
    key_readable_by_holder_execution_context: false
    use_requires_authorization_outside_holder_execution_context: true
    evidences: holder
    evidences_statement: A signature evidences that the HOLDER acted.
    authority_ceiling: act
  - id: isolated_invocable
    title: Key isolated, signable by the holder's context without limit
    key_readable_by_holder_execution_context: false
    use_requires_authorization_outside_holder_execution_context: false
    evidences: environment
    evidences_statement: >-
      A signature evidences that the ENVIRONMENT acted; the key cannot be
      exfiltrated, but the context can obtain signatures at will.
    authority_ceiling: act_unsupervised
  - id: isolated_hardware_presence
    title: Key isolated in hardware with a per-use presence check
    key_readable_by_holder_execution_context: false
    use_requires_authorization_outside_holder_execution_context: true
    evidences: holder
    evidences_statement: A signature evidences that the HOLDER acted.
    authority_ceiling: act_irreversible
