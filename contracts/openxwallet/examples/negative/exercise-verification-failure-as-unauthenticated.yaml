# expected_failure: verification-failure-miscategorised
# expected_failure_detail: different events
# requirement: OXW-R3
# VIOLATES core R3: a verification failure recorded as an unauthenticated
# request.
#
# A signature WAS presented and did NOT verify. Filed as
# `unauthenticated_request`, it becomes indistinguishable from ordinary
# unauthenticated traffic — and a signature that fails to verify is the single
# clearest signal that someone is attempting to use a grant they hold without
# the key that goes with it. Collapsing the two loses exactly the evidence the
# proof-of-possession rule was built to produce.
