# expected_failure: custody-evidences-derivation
# expected_failure_detail: derive 'environment'
# requirement: OXW-R4
# VIOLATES core R4: a custody model that claims to evidence the HOLDER while
# its key is readable by the holder's own execution context.
#
# THIS IS THE FAILURE THE RULING OF 2026-08-07 EXISTS TO PREVENT, and the
# reason `evidences` is derived rather than declared. Written by hand this
# reads perfectly: a plausible id, a confident statement, a high ceiling. If
# `evidences` were a free field it would validate cleanly, the audit record
# would assert that the holder acted, and the assertion would be false —
# which the design notes is worse than having no control at all.
#
# The derivation refuses it: a key readable by the holder's own execution
# context evidences the ENVIRONMENT, and only isolation WITH an authorization
# that context cannot supply evidences the HOLDER.
schema_version: 1
kind: xfactory_wallet_custody_registry
registry_id: openxwallet-custody-collapsed-a
registry_version: 1
authority_tiers:
  - id: act
    rank: 2
    statement: Complete an effecting act, with approval required before apply.
  - id: act_unsupervised
    rank: 3
    statement: Complete an effecting act with no approval before apply.
custody_models:
  - id: software_key_trusted
    title: Software key the agent reads at startup, trusted as the holder
    key_readable_by_holder_execution_context: true
    use_requires_authorization_outside_holder_execution_context: false
    evidences: holder
    evidences_statement: >-
      A signature proves the holder acted, because only the holder's process
      loads this key.
    authority_ceiling: act
  - id: isolated_per_use_authorized
    title: Key isolated, each use authorized outside the holder's context
    key_readable_by_holder_execution_context: false
    use_requires_authorization_outside_holder_execution_context: true
    evidences: holder
    evidences_statement: A signature evidences that the HOLDER acted.
    authority_ceiling: act_unsupervised
