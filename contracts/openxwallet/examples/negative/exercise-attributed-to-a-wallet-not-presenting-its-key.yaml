# expected_failure: attribution-laundered
# expected_failure_detail: never to a declared stand-in
# requirement: OXW-R5
# VIOLATES core R5: the audience's wallet declared, another wallet's key
# presented.
#
# The record names the grant's own audience in `attribution.wallet_ref` — so
# a binding that trusts the declared ref sees the audience exercising its own
# grant and passes. The key that actually signed is key-creator-0002, which
# is wal-agent-creator-0002's, not the poster's.
#
# Attribution is cryptographic, not declared. An act belongs to the wallet
# whose key was presented; a declared stand-in laundering it onto the
# audience is precisely the false audit record this family exists to refuse.
