# expected_failure: revoked-chain-exercised
# expected_failure_detail: in its chain is revoked
# requirement: OXW-R6
# VIOLATES core R6: a derivation of a REVOKED parent, still exercising.
#
# The grant named here reads `state: active` on its own face, and its parent
# was revoked ahead of expiry. A consumer that trusted issuance-time validity
# — or trusted only the grant it was handed — would permit this. Revocation is
# effective THROUGH derivation and is checked AT EXERCISE, or it is advisory:
# revoking a parent that leaves its children usable revokes nothing that
# matters.
#
# The record compounds it by reporting the revocation check as `active`, which
# is what a check that walked no chain would report.
