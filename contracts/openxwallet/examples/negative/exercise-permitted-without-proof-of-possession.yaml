# expected_failure: proof-of-possession-missing
# expected_failure_detail: possession of a grant confers nothing
# requirement: OXW-R3
# VIOLATES core R3: a grant PRESENTED and accepted, with no proof of
# possession.
#
# This is the bearer-token model the requirement exists to refuse. The grant
# is genuine and unexpired, and that is precisely the problem: if presentation
# sufficed, a grant copied out of a log, a config file or an intercepted
# request would carry the holder's full authority. Requiring a signature from
# the holder's key over the request is what makes a stolen grant inert, which
# is the property a bearer model cannot offer.
