# expected_failure: attenuation-widened
# expected_failure_detail: adds acts
# requirement: OXW-R2
# VIOLATES core R2: a derived grant that WIDENS its parent.
#
# The parent confers `post_transaction`. This derivation adds
# `approve_transaction`, which its parent never held and therefore cannot
# confer. Attenuation is monotonic: a derived grant may reduce scope or
# lifetime and may never widen either. Without that rule, delegation is
# key-sharing with extra steps, and a chain of derivations becomes a way to
# manufacture authority nobody granted.
