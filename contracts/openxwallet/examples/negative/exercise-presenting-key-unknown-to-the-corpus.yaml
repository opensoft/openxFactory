# expected_failure: presenting-key-unresolved
# expected_failure_detail: an exercise presented by an unknown key
# requirement: OXW-R3
# VIOLATES core R3: a presenting key no wallet record declares.
#
# The signature verifies and the grant resolves, but key-unknown-0099 is no
# wallet's key_reference, so there is no wallet to hold the audience binding
# against. Passing over that case would make the binding optional in
# practice: present any key the corpus has never seen and the check that
# secures the grant to its audience never runs.
#
# Same fail-closed asymmetry the grant and custody-ceiling bindings already
# close: what cannot be checked is refused, not skipped.
