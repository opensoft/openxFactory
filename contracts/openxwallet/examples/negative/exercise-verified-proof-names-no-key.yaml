# expected_failure: presenting-key-unresolved
# expected_failure_detail: names no presenting key
# requirement: OXW-R3
# VIOLATES core R3: a verified signature that never says which key verified.
#
# The proof block claims presented and verified — and omits
# `presenting_key_ref`, which the schema leaves optional. The attribution
# block then names the audience's key. A binding that falls back from the
# empty proof to the attribution block derives the presenting wallet from
# self-declared data: the original audience-laundering route, one omission
# deeper. Found by review on the SECOND fix in this area, which is the
# pattern worth recording — each repair trusted a field the record was still
# free to shape.
#
# A verification that does not record WHICH key verified binds the exercise
# to nothing, and is refused rather than trusted from attribution.
