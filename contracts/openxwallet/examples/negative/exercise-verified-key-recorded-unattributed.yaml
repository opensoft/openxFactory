# expected_failure: attribution-laundered
# expected_failure_detail: recording the act as nobody's
# requirement: OXW-R5
# VIOLATES core R5: a VERIFIED signature by the wrong wallet, recorded as an
# unattributed act.
#
# The honest unattributed record exists for acts with NO establishable wallet
# key — and the positive corpus shows a verification FAILURE recorded that
# way, because an unverified signature establishes nothing. This record is
# the inverse: the signature by key-creator-0002 verified, so the identity is
# established, and 'unattributed' is a choice rather than a fact.
#
# The choice is load-bearing: an unattributed act is not held to the audience
# binding (there is no claimed identity to contradict) or to distinct-holder
# evaluation against a named holder. Laundering an established identity into
# 'nobody' walks a non-audience key past both.
