# expected_failure: wallet-ref-as-subject-identifier
# expected_failure_detail: attestation, never the identifier
# requirement: OXW-R8
# VIOLATES core R8: a wallet reference doing an identifier's work.
#
# The subject is resolved THROUGH the wallet, and the record admits it is no
# longer reconstructable without one. That is the capability quietly becoming
# an identity substrate — the exact outcome two RATIFIED MedxFactory specs
# forbid: `patient-identity-and-assembly` (a wallet address MUST NOT be
# silently accepted as identity proof) and `patient-snapshot-ledger-custody`
# (custody stays wallet-neutral and reconstructable with no wallet available).
#
# A neutral capability that made this legal would contradict a ratified spec,
# so the shape refuses it twice over: `reference_role` and `resolved_by` are
# both closed to the single legal value.
