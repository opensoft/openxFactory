# expected_failure: key-material-embedded
# expected_failure_detail: contains a private key block
# requirement: OXW-R1
# VIOLATES core R1: the record carries key material.
#
# This is the PLAUSIBLE version of the mistake, and the reason the check walks
# values and not only property names. The schemas close every object, so no
# key-shaped PROPERTY can be added at any depth — that half is structurally
# impossible. What remains possible is a key pasted into a string field that
# legitimately exists, here the holder's display label, by someone capturing
# "the key we issued" for convenience.
#
# A raw key can be neither expired nor revoked, and a shared key destroys
# attribution. Key material is therefore unrepresentable here rather than
# discouraged.
schema_version: 1
kind: xfactory_wallet_record
wallet_id: wal-agent-leaky-0009
holder:
  holder_id: agent:ledger-leaky
  holder_class: agent
  display_label: "-----BEGIN PRIVATE KEY-----MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQDA-----END PRIVATE KEY-----"
key_reference:
  did: "did:web:xforge.us:wallets:agent-leaky"
  key_id: key-leaky-0009
  signature_algorithm: ed25519
custody:
  model: holder_readable
  registry_version: 1
state: active
