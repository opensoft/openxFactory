# expected_failure: custody-ceiling-unearned
# expected_failure_detail: HIGHEST tier this ladder declares
# requirement: OXW-R4
# VIOLATES core R4 by RENAMING its way past the rule.
#
# Found by attacking the validator rather than by reading it. The earlier form
# of rule (c) compared the ceiling against the literal id `act_unsupervised`,
# so a registry free to name its own tiers could call the top tier anything
# else and the check would never fire. This registry does exactly that: the
# top tier is `autonomous`, and `isolated_invocable` — which evidences only
# the ENVIRONMENT, because the holder's context can obtain signatures at will
# — is capped there.
#
# The collapse check (d) does not catch it either, because that model is not
# READABLE; and the derivation check (b) does not, because every `evidences`
# value here is declared honestly. Three checks, and the dishonest registry
# validated cleanly — which is the exact failure mode this family exists to
# refuse, reappearing one level up in the rule that refuses it.
#
# Rule (c) now keys on the top RANK rather than the tier's NAME.
schema_version: 1
kind: xfactory_wallet_custody_registry
registry_id: openxwallet-custody-renamed-top-tier
registry_version: 1
authority_tiers:
  - id: act
    rank: 2
    statement: Complete an effecting act, with approval required before apply.
  - id: autonomous
    rank: 3
    statement: Complete an effecting act with no approval before apply.
custody_models:
  - id: holder_readable
    title: Key readable by the holder's own execution context
    key_readable_by_holder_execution_context: true
    use_requires_authorization_outside_holder_execution_context: false
    evidences: environment
    evidences_statement: A signature evidences that the ENVIRONMENT acted.
    authority_ceiling: act
  - id: isolated_invocable
    title: Key isolated, signable by the holder's context without limit
    key_readable_by_holder_execution_context: false
    use_requires_authorization_outside_holder_execution_context: false
    evidences: environment
    evidences_statement: >-
      A signature evidences that the ENVIRONMENT acted; the key cannot be
      exfiltrated, but the context can obtain signatures at will.
    authority_ceiling: autonomous
  - id: isolated_per_use_authorized
    title: Key isolated, each use authorized outside the holder's context
    key_readable_by_holder_execution_context: false
    use_requires_authorization_outside_holder_execution_context: true
    evidences: holder
    evidences_statement: A signature evidences that the HOLDER acted.
    authority_ceiling: autonomous
