# VALID wallet record: an agent key the consuming platform can verify
# LOCALLY. rsa-2048-sha256 (RSASSA-PKCS1-v1_5 over SHA-256) entered the
# enum by measurement: Business Central 28.3 AL — the first enforcement
# surface consuming this family — verifies RSA/DSA/RSASSA-PSS and nothing
# curve-shaped, so the original curve-only enum admitted no algorithm the
# platform could check without an off-platform verifier. Everything else
# is the honest low tier unchanged: environment-evidencing custody,
# ceiling `act`.
