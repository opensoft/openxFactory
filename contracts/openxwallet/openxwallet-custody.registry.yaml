# The closed key-custody enumeration for openxWallet, and the ordered
# authority ladder it caps. Ratified by: add-openxwallet (Brett Heap,
# 2026-08-07 — "declared and capping authority"). Registered in
# contracts/manifest.yaml + contracts/CHANGELOG.md at the next additive bundle
# cut, per docs/contract-versioning-policy.md.
#
# `evidences` is DERIVED from the two booleans, never independently asserted,
# and the canonical validator enforces the derivation. See
# openxwallet-custody-registry.schema.yaml for the derivation and the reasoning.
schema_version: 1
kind: xfactory_wallet_custody_registry
registry_id: openxwallet-custody
registry_version: 1

authority_tiers:
  - id: attest
    rank: 0
    statement: >-
      Record assertions. No external effect follows from the act itself, so a
      false assertion is bounded by the record that carries it.
  - id: request
    rank: 1
    statement: >-
      Initiate an act that a DISTINCT holder must complete or approve. The
      holder cannot bring the effect about alone.
  - id: act
    rank: 2
    statement: >-
      Complete an effecting act, with approval required before apply. A
      distinct authority reviews, which is what makes environment-level
      evidence survivable at this tier.
  - id: act_unsupervised
    rank: 3
    statement: >-
      Complete an effecting act with no approval before apply. Nothing else
      stands between the holder and an irreversible external effect, so this
      tier requires evidence that the HOLDER acted rather than its environment.

custody_models:
  - id: holder_readable
    title: Key material readable by the holder's own execution context
    key_readable_by_holder_execution_context: true
    use_requires_authorization_outside_holder_execution_context: false
    evidences: environment
    evidences_statement: >-
      A signature evidences that the holder's EXECUTION ENVIRONMENT acted. The
      key sits in process memory, a readable file, an environment variable or
      a mounted secret, so anything with read access to that environment can
      produce the same signature — and can carry the key elsewhere and produce
      it there. It does NOT evidence that the holder acted, and an audit
      record must not be read as though it did.
    authority_ceiling: act
    notes: >-
      This tier reaches `act` deliberately. Capping software custody lower
      would stall every consumer, which is the outcome the ruling rejected
      when it declined to mandate hardware backing — there is no key
      infrastructure in the stack today. Approval before apply is the
      compensating control at this tier.

  - id: isolated_invocable
    title: Key isolated from the holder's execution context, signable by it without limit
    key_readable_by_holder_execution_context: false
    use_requires_authorization_outside_holder_execution_context: false
    evidences: environment
    evidences_statement: >-
      A signature evidences that the holder's EXECUTION ENVIRONMENT acted. The
      key is held outside that context — a separate process, an OS keystore, a
      remote signing service — so it cannot be read, exfiltrated or replayed
      elsewhere. But the context can request signatures without limit, so a
      compromised environment still signs anything the holder could. Isolation
      here contains the KEY; it does not attribute the ACT.
    authority_ceiling: act
    notes: >-
      Shares a ceiling with `holder_readable` and differs from it in blast
      radius rather than in what a signature proves. The difference is
      recorded because it is real — a stolen key is portable and permanent
      where a compromised environment is neither — but it does not earn
      unsupervised authority, and saying so plainly is the point of the
      ruling.

  - id: isolated_per_use_authorized
    title: Key isolated, and each use authorized outside the holder's execution context
    key_readable_by_holder_execution_context: false
    use_requires_authorization_outside_holder_execution_context: true
    evidences: holder
    evidences_statement: >-
      A signature evidences that the HOLDER acted. The key is isolated from
      the holder's execution context AND each signature requires an
      authorization that context cannot itself supply — a hardware presence
      check, an external policy approval, a separate custodian. A compromised
      environment cannot obtain a signature on its own, which is what makes
      the signature attributable to the holder rather than to whatever is
      running as it.
    authority_ceiling: act_unsupervised

excluded_models:
  - id: asserted_identity
    reason: >-
      A wallet whose holder is asserted rather than proved is not a custody
      model — it is the absence of one, and admitting it would re-open the
      hole this capability exists to close. The core requires proof of
      possession; a consuming domain that needs an interim records it as a
      dated, explicit exception in its own repository rather than as a
      softening of the neutral set. This is the shape
      `modify-ledgerx-credential-contracts-for-test-asset-authority` was
      ratified in part to end: a comment doing a rule's work.
  - id: shared_credential
    reason: >-
      A shared key destroys attribution, so it cannot be a custody model for a
      wallet. The key-attribution requirement already rules the case: an act
      attributable only to a shared credential is recorded as `unattributed`
      and the credential is recorded as transport, never as the actor. A
      custody member for it would contradict that requirement rather than
      extend it.
