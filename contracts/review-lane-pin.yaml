# THE VENDORED SNAPSHOT — CSC-C6's required-check home, layered on LQ-A7's.
#
# `contracts/review-lane-floor-snapshot.yaml` is a BYTE COPY of the
# `pinned_members` floor document above, taken at `core_commit`. It exists
# because CSC-C6 (BLOCKING) requires the completeness assertion to run "on a
# check somebody is required to look at — NOT on the openxFactory advisory lane
# alone, which blocks nobody", and Brett Heap's ruling at record §6.1 is BOTH,
# LAYERED: LQ-A7's set difference in `merge-master-approval.yml` (advisory) AND
# a required-check home. `pytest-suite` is REQUIRED by org ruleset 21538893, and
# `tests/review_lane_pin/test_floor_snapshot.py` runs inside it over this copy,
# offline, needing only `git ls-files` and a file on disk.
#
# THE COPY IS NOT TRUSTED ON ITS OWN. A snapshot carrying an entry the real
# floor lacks would be a silent false green — the CSC-F16 defect species. So
# `pytest-suite` ALSO checks out the pinned core (`continue-on-error`) and the
# same test module compares the two byte for byte when it is present. The
# comparison SKIPS when the core is absent, and that skip is the alarm:
# `pytest-suite.yml` reads the JUnit report and requires that comparison's own
# `<testcase>`, BY NAME, to have run and passed, so a fetch that quietly stopped
# working turns a required check red with a named cause instead of degrading in
# silence. `EXPECT_SKIPPED` is still pinned exactly beside it, but as the
# backstop: an aggregate count cannot tell this skip appearing from this skip
# appearing while another conditional skip starts running, and goes green on the
# canceling pair (Codex P2, PR #569).
#
# NOT IN `contracts/manifest.yaml`, for the same reason this pin is not: neither
# is a contract this repository publishes to consumers. The digest below is
# therefore verified by the test rather than by
# `scripts/validate-manifest-digests.py`, exactly as `verify-openxwallet-pin.py`
# verifies the wallet pin's eight digests off-manifest.
floor_snapshot:
  path: contracts/review-lane-floor-snapshot.yaml
  of: scripts/merge_master/openxfactory-review-authority-floor.yaml
  sha256: "b4dcf676e388e7984da90a8e71b135cc06f2d740b34a41a86de663bc145bf241"
  entry_count: 68
  taken_at: core_commit
  # THE SNAPSHOT CARRIES ONE COMMIT-SHAPED VALUE OF ITS OWN, AND IT IS DECLARED
  # IN `scripts/doc_health/pin_class.py` AS A NON-MEMBER, NOT AS A MEMBER.
  # Inside the generated block's header the generator writes `generated_at`: the
  # OPENXFACTORY commit `git ls-tree` was run against (`b5eddaa3` as of this
  # advance — MOVED from `f6724f04` by codexFactory PR #226, the SECOND
  # post-grace regeneration, requested at PR #699, this repository's OWN
  # archive commit for `mirror-floor-addition-grace` — a commit reachable
  # from openxFactory `main`, same as `f6724f04` before it. Unlike the ninth
  # advance, this move does not retire a non-ancestor pin: it picks up the ONE
  # path PR #699 promoted, `openspec/specs/review-lane-floor-mirror/spec.md`,
  # which had landed COVERED-PENDING under the grace rather than red). It
  # therefore RESOLVES
  # here, and the sweep's coverage test
  # resolves every 40-hex token in every swept file — so this file cannot simply
  # be left alone. An exclusion is required, and the exclusion had to be
  # DECLARED rather than left to whether the value happens to resolve. That is
  # the ground `NON_MEMBERS`'s examples row already states.
  #
  # THE MEMBER ROUTE WAS TRIED FIRST, AND MEASURED, AND IS WRONG TWICE:
  #
  #   1. The generator writes `generated_at` into a YAML COMMENT, not a data
  #      field. The sweep's commit-shaped pass reads every line and FINDS it;
  #      the non-commit pass skips comment lines by design and does NOT. So one
  #      member classifies this file twice — a resolved pin site AND an
  #      `absent_key` — and `tests/doc-health/test_sentinel_vocabulary.py`'s
  #      "no site is classified twice" pin fails, correctly.
  #   2. `PIN_KEY_VOCABULARY` is the UNION of declared field keys, so declaring
  #      this one widens the sweep repo-wide. Measured at this commit: 21 files
  #      inside the scan roots carry a data-field `generated_at`, and every one
  #      of them holds an ISO TIMESTAMP rather than a commit.
  #
  # And the file may not be edited to suit either pass: it is a WITNESS,
  # verified byte for byte, and an edited witness proves nothing. The seam in
  # (1) is real and pre-existing; it is not this act's object.
  #
  # WHAT BINDS THE PROVENANCE INSTEAD, and it is stronger than a reachability
  # verdict: the `sha256` above fixes the bytes, and
  # `tests/review_lane_pin/test_floor_snapshot.py` compares them to the
  # authoritative document in the pinned core whenever that core is on disk. A
  # `generated_at` that drifted could only arrive inside bytes that failed both.
  # The claim this file makes is codexFactory's, not this repository's about
  # itself — which is the line every `NON_MEMBERS` row draws.
  refresh: >-
    Re-copy the file from `scripts/merge_master/openxfactory-review-authority-floor.yaml`
    at the new `core_commit`, recompute `sha256`, and update `entry_count`. Never
    hand-edit the copy: it is a witness, and an edited witness proves nothing.

