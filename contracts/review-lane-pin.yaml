      The PLUS ONE is a machine-generated block carrying every
      tracked path under `openspec/specs` — FIFTY-SEVEN as of this advance —
      written only by
      `scripts/merge_master/generate_specs_floor_block.py` (CSC-C7: "a
      hand-typed or copy-pasted list is refused on its face"), first landed by
      codexFactory PR #162 under the (b′) ruling at openxFactory `1a69b7cb`
      (53 tracked paths), regenerated by codexFactory PR #183 (merge
      `605d48ac`) at openxFactory `6f80e67e` (54 paths, gaining
