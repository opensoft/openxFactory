# WHAT THE CALLER ACTUALLY READS OUT OF THE PINNED TREE. Named so a re-point
# ceremony knows what to re-verify, and so a future reader can tell whether a
# newer commit still carries what this lane depends on.
pinned_members:
  - path: scripts/merge_master/repository_floor.py
    why: >-
      The repository-gate-floor parser and loader. Supplies
      `load_governance_paths` (which refuses an unknown document kind and
      refuses two floors declaring one repository) and
      `parse_repository_floor(..., tree_paths=...)`, whose opt-in reachability
      check the caller opts into so an unreachable floor path is a named
      failure rather than silence. Since the 2026-09-01 advance it also supplies
      `parse_repository_floor_reporting`, which converts THAT one refusal into a
      reported partition — every structural refusal still raises — so the caller
      can name the dead entries and print `matched_paths` over the reachable
      subset BEFORE it exits non-zero (LS-A1).
  - path: scripts/merge_master/repository_floor_drift.py
    why: >-
      Drift detection AT THE CAUSING COMMIT, added by codexFactory PR #162.
      Supplies `post_merge_tree_paths` (the base tree adjusted by a candidate's
      own changed paths — CPL-C1's first sufficient discharge, verbatim) and
      `candidate_floor_drift` (which floored paths THIS candidate kills, kept
      apart from what was already dead). `repository_floor.py` statically
      re-exports both, so the caller's import site is unchanged; the module is
      named here because a re-point ceremony must know it is now load-bearing.
  - path: scripts/merge_master/openxfactory-review-authority-floor.yaml
    why: >-
      The `repository_gate_floor` for `opensoft/openxFactory` — SIXTY-FIVE
      never-clearable paths as of this advance, and the document says on its own
      face that it is 8 + 1 rather than 65 equally-reasoned chokepoints. The
      EIGHT are the hand-reasoned gate chokepoints. FOUR are the original set
      (the register, the two paths that determine which reader opens it, and
      `contracts/review-lane-pin.yaml` itself — added by codexFactory PR #125,
      merge `99fa3ffe`, on the ground that "the review-lane pin selects which
      codexFactory commit's decision core judges this repository. Clearable, it
      would let a pull request choose its own judge"). FOUR ARE NEW TO THIS
      ADVANCE and are not specs: codexFactory PR #182 (merge `e5534552`,
      2026-09-03T20:51:52Z) floored the SIBLING FACTORY-IDENTITY REGISTER
      FAMILY — `governance/factory-identity/register.yaml` and the wallet,
      grant and custody attestation beside it — BY NAME, realizing THIS
      repository's own ratified `add-cpc-clearing-boundary` task 2.7, whose
      requirement is that such a family be entered by name (a path-shaped
      clause is impossible: `_parse_exact_path` refuses wildcards and trailing
