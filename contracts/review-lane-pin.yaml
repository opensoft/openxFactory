kind: pinned_workflow

# ============================================================================
# review-lane-pin.yaml — which codexFactory decision core judges openxFactory.
#
# `.github/workflows/merge-master-approval.yml` checks out
# `opensoft/codexFactory` at an exact commit to obtain the Merge Master decision
# core. THIS FILE IS THAT CLAIM, recorded where a reviewer can see it change,
# and `tests/review_lane_pin/test_review_lane_caller.py` is the running code
# that refuses to let the two disagree.
#
# WHY A FILE AT ALL, when xFactory needs none. The aggregation repo VENDORS
# codexFactory as a submodule, so its working rule #2 can say the workflow's pin
# MUST equal the gitlink, and `tests/test_review_lane_workflow.py` asserts
# exactly that — the gitlink is the recorded value and the test is the tie.
# openxFactory has NO codexFactory gitlink and will not acquire one: it is a
# peer contracts repository, not an aggregation. So there is nothing structural
# for a test to compare the workflow against, and without this file "which core
# judged this pull request" is answerable only by reading a workflow file, while
# advancing it is a one-line edit nobody is obliged to notice. The pin file plus
# the test reconstructs the property the gitlink gave xFactory for free.
#
# WHY `kind: pinned_workflow` AND NOT `pinned_contract_manifest`. The realized
# neighbour, `contracts/openxwallet-pin.yaml`, pins a CONTRACT BUNDLE: a
# commit plus eight content digests, consumed as data. This pins EXECUTABLE
# GOVERNANCE CODE consumed by a workflow — no bundle, no digest set, and the
# thing it protects is "which decision core ran", not "which bytes we read".
# Reusing `pinned_contract_manifest` would have claimed a digest discipline this
# pin does not have and cannot have (the pinned members are Python modules and a
# governance YAML in another repository, content-addressed by the commit).
#
# NOT A PUBLISHED CONTRACT, so NO `contracts/manifest.yaml` ROW. This follows
# `contracts/openxwallet-pin.yaml` exactly: that pin was REMOVED from the
# manifest at `contract-v2.0` because a pin is not a contract this repository
# publishes to consumers. It lives under `contracts/` because that is where this
# repository keeps pins, not because it is a bundle member.
#
# ROUTED TO A HUMAN. `.github/CODEOWNERS` names this path, on the 2026-08-23
# convener ruling's ground and for the same reason the wallet pin is named
# there: a pull request that changes this file changes the code a governance
# surface executes.
# ============================================================================

# The pinned repository. Private; the caller mints a read-only content-App token
# to reach it.
repository: opensoft/codexFactory

# THE TRUSTED REFERENT. Exactly 40 lowercase hex. `revision_kind: commit` is
# declared and a tag or branch is REFUSED — a movable ref is not a pin, and the
# whole point of this file is that the answer to "which core judged this" cannot
# move without a diff.
#
# This key name is deliberately NOT `commit`. `commit` is already a declared
# member key of this repository's derivation-pin class, bound to
# `contracts/openxwallet-pin.yaml`; reusing it here would have produced an
# UNCOVERED pin site. `core_commit` is a key the sweep vocabulary did not know,
# and declaring the member in `scripts/doc_health/pin_class.py` is what teaches
# it — the same move `carve_commit` made, for the same reason.
core_commit: "bfb8bde39f61d3eb4a768cdc7117a3bbc1418d2d"
revision_kind: commit

