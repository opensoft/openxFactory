schema_version: 1
kind: pinned_workflow

# ============================================================================
# review-lane-pin.yaml — which codexFactory decision core judges openxFactory.
#
# `.github/workflows/merge-master-approval.yml` checks out
# `opensoft/codexFactory` at an exact commit to obtain the Merge Master decision
# core. THIS FILE IS THAT CLAIM, recorded where a reviewer can see it change,
# and `tests/review_lane_pin/test_review_lane_caller.py` is the running code
# that refuses to let the two disagree.
#
# WHY A FILE AT ALL, when xFactory needs none. The aggregation repo VENDORS
# codexFactory as a submodule, so its working rule #2 can say the workflow's pin
# MUST equal the gitlink, and `tests/test_review_lane_workflow.py` asserts
# exactly that — the gitlink is the recorded value and the test is the tie.
# openxFactory has NO codexFactory gitlink and will not acquire one: it is a
# peer contracts repository, not an aggregation. So there is nothing structural
# for a test to compare the workflow against, and without this file "which core
# judged this pull request" is answerable only by reading a workflow file, while
# advancing it is a one-line edit nobody is obliged to notice. The pin file plus
# the test reconstructs the property the gitlink gave xFactory for free.
#
# WHY `kind: pinned_workflow` AND NOT `pinned_contract_manifest`. The realized
# neighbour, `contracts/openxwallet-pin.yaml`, pins a CONTRACT BUNDLE: a
# commit plus eight content digests, consumed as data. This pins EXECUTABLE
# GOVERNANCE CODE consumed by a workflow — no bundle, no digest set, and the
# thing it protects is "which decision core ran", not "which bytes we read".
# Reusing `pinned_contract_manifest` would have claimed a digest discipline this
# pin does not have and cannot have (the pinned members are Python modules and a
# governance YAML in another repository, content-addressed by the commit).
#
# NOT A PUBLISHED CONTRACT, so NO `contracts/manifest.yaml` ROW. This follows
# `contracts/openxwallet-pin.yaml` exactly: that pin was REMOVED from the
# manifest at `contract-v2.0` because a pin is not a contract this repository
# publishes to consumers. It lives under `contracts/` because that is where this
# repository keeps pins, not because it is a bundle member.
#
# ROUTED TO A HUMAN. `.github/CODEOWNERS` names this path, on the 2026-08-23
# convener ruling's ground and for the same reason the wallet pin is named
# there: a pull request that changes this file changes the code a governance
# surface executes.
# ============================================================================

# The pinned repository. Private; the caller mints a read-only content-App token
# to reach it.
repository: opensoft/codexFactory

# THE TRUSTED REFERENT. Exactly 40 lowercase hex. `revision_kind: commit` is
# declared and a tag or branch is REFUSED — a movable ref is not a pin, and the
# whole point of this file is that the answer to "which core judged this" cannot
# move without a diff.
#
# This key name is deliberately NOT `commit`. `commit` is already a declared
# member key of this repository's derivation-pin class, bound to
# `contracts/openxwallet-pin.yaml`; reusing it here would have produced an
# UNCOVERED pin site. `core_commit` is a key the sweep vocabulary did not know,
# and declaring the member in `scripts/doc_health/pin_class.py` is what teaches
# it — the same move `carve_commit` made, for the same reason.
core_commit: "db157dbbcf19a69c1b189ed433b5062807d61043"
revision_kind: commit

# When this pin was declared, and against what observation. Recorded because a
# pin with no date cannot be reasoned about at a re-point ceremony.
#
# ADVANCED 2026-09-01, from `f4702f64` (2026-08-28), to make the (b′) floor
# extension OPERATIVE. codexFactory PR #162 (merge `e37c5ac2`, 2026-09-01)
# rewrote `openxfactory-review-authority-floor.yaml` from 4 entries to 57 — the
# four hand-reasoned chokepoints plus ONE machine-generated block carrying every
# tracked path under `openspec/specs` at openxFactory `1a69b7cb`. That document
# is INERT until this line moves: the lane reads the floor from the commit this
# pin names, never from codexFactory `main`. The pair IS the landing.
#
# Authority: `hermes/domain/review-councils/records/`
# `2026-08-31-gate-rules-openxfactory-bprime.md` §12 — *"an openxFactory pull
# request advancing `contracts/review-lane-pin.yaml` `core_commit` and the
# workflow's two pin literals in lockstep"* — ruled by Brett Heap, session
# `openxfactory-f5`.
#
# WHY main's TIP AND NOT `e37c5ac2` ITSELF. `e37c5ac2` is contained in this
# commit (verified by ancestry), and BOTH `pinned_members` below are
# BYTE-IDENTICAL between the two — measured with `git diff` over the two paths,
# empty — so pinning the tip acquires the floor extension and the three new
# core functions without acquiring a different version of anything this lane
# consumes. Everything else in the interval (codexFactory PR #167, the
# provenance axis) lands in modules `scope.does_not_evaluate` already excludes.
declared_at: "2026-09-01"
declared_from: >-
  codexFactory origin/main HEAD as observed on 2026-09-01 (`db157dbb`, merge of
  PR #167), which contains PR #162's merge `e37c5ac2` — the codexFactory half of
  the (b′) landing pair.

# The caller this pin governs. The test asserts this file exists AND that its
# checked-out `ref:` equals `core_commit` above.
governs:
  - .github/workflows/merge-master-approval.yml

# WHAT THE CALLER ACTUALLY READS OUT OF THE PINNED TREE. Named so a re-point
# ceremony knows what to re-verify, and so a future reader can tell whether a
# newer commit still carries what this lane depends on.
pinned_members:
  - path: scripts/merge_master/repository_floor.py
    why: >-
      The repository-gate-floor parser and loader. Supplies
      `load_governance_paths` (which refuses an unknown document kind and
      refuses two floors declaring one repository) and
      `parse_repository_floor(..., tree_paths=...)`, whose opt-in reachability
      check the caller opts into so an unreachable floor path is a named
      failure rather than silence. Since the 2026-09-01 advance it also supplies
      `parse_repository_floor_reporting`, which converts THAT one refusal into a
      reported partition — every structural refusal still raises — so the caller
      can name the dead entries and print `matched_paths` over the reachable
      subset BEFORE it exits non-zero (LS-A1).
  - path: scripts/merge_master/repository_floor_drift.py
    why: >-
      Drift detection AT THE CAUSING COMMIT, added by codexFactory PR #162.
      Supplies `post_merge_tree_paths` (the base tree adjusted by a candidate's
      own changed paths — CPL-C1's first sufficient discharge, verbatim) and
      `candidate_floor_drift` (which floored paths THIS candidate kills, kept
      apart from what was already dead). `repository_floor.py` statically
      re-exports both, so the caller's import site is unchanged; the module is
      named here because a re-point ceremony must know it is now load-bearing.
  - path: scripts/merge_master/openxfactory-review-authority-floor.yaml
    why: >-
      The `repository_gate_floor` for `opensoft/openxFactory` — FIFTY-SEVEN
      never-clearable paths as of this advance, and the document says on its own
      face that it is 4 + 1 rather than 57 equally-reasoned chokepoints. The
      FOUR are the hand-reasoned gate chokepoints (the register, the two paths
      that determine which reader opens it, and `contracts/review-lane-pin.yaml`
      itself — added by codexFactory PR #125, merge `99fa3ffe`, on the ground
      that "the review-lane pin selects which codexFactory commit's decision
      core judges this repository. Clearable, it would let a pull request choose
      its own judge"). The PLUS ONE is a machine-generated block carrying every
      tracked path under `openspec/specs` at openxFactory `1a69b7cb`, written
      only by `scripts/merge_master/generate_specs_floor_block.py` (CSC-C7: "a
      hand-typed or copy-pasted list is refused on its face"), landed by
      codexFactory PR #162 under the (b′) ruling. Authored and owned in
      codexFactory; read here, never authored here — and vendored here as a
      byte copy, see `floor_snapshot` below.

# THE VENDORED SNAPSHOT — CSC-C6's required-check home, layered on LQ-A7's.
#
# `contracts/review-lane-floor-snapshot.yaml` is a BYTE COPY of the
# `pinned_members` floor document above, taken at `core_commit`. It exists
# because CSC-C6 (BLOCKING) requires the completeness assertion to run "on a
# check somebody is required to look at — NOT on the openxFactory advisory lane
# alone, which blocks nobody", and Brett Heap's ruling at record §6.1 is BOTH,
# LAYERED: LQ-A7's set difference in `merge-master-approval.yml` (advisory) AND
# a required-check home. `pytest-suite` is REQUIRED by org ruleset 21538893, and
# `tests/review_lane_pin/test_floor_snapshot.py` runs inside it over this copy,
# offline, needing only `git ls-files` and a file on disk.
#
# THE COPY IS NOT TRUSTED ON ITS OWN. A snapshot carrying an entry the real
# floor lacks would be a silent false green — the CSC-F16 defect species. So
# `pytest-suite` ALSO checks out the pinned core (`continue-on-error`) and the
# same test module compares the two byte for byte when it is present. The
# comparison SKIPS when the core is absent, and that skip is the alarm:
# `pytest-suite.yml` reads the JUnit report and requires that comparison's own
# `<testcase>`, BY NAME, to have run and passed, so a fetch that quietly stopped
# working turns a required check red with a named cause instead of degrading in
# silence. `EXPECT_SKIPPED` is still pinned exactly beside it, but as the
# backstop: an aggregate count cannot tell this skip appearing from this skip
# appearing while another conditional skip starts running, and goes green on the
# canceling pair (Codex P2, PR #569).
#
# NOT IN `contracts/manifest.yaml`, for the same reason this pin is not: neither
# is a contract this repository publishes to consumers. The digest below is
# therefore verified by the test rather than by
# `scripts/validate-manifest-digests.py`, exactly as `verify-openxwallet-pin.py`
# verifies the wallet pin's eight digests off-manifest.
floor_snapshot:
  path: contracts/review-lane-floor-snapshot.yaml
  of: scripts/merge_master/openxfactory-review-authority-floor.yaml
  sha256: "bf7a6b69be1678273d31b604516abb9da8c95e76d58da0f90b44b5846c375b39"
  entry_count: 57
  taken_at: core_commit
  # THE SNAPSHOT CARRIES ONE COMMIT-SHAPED VALUE OF ITS OWN, AND IT IS DECLARED
  # IN `scripts/doc_health/pin_class.py` AS A NON-MEMBER, NOT AS A MEMBER.
  # Inside the generated block's header the generator writes `generated_at`: the
  # OPENXFACTORY commit `git ls-tree` was run against (`1a69b7cb`, reachable
  # from `main`). It therefore RESOLVES here, and the sweep's coverage test
  # resolves every 40-hex token in every swept file — so this file cannot simply
  # be left alone. An exclusion is required, and the exclusion had to be
  # DECLARED rather than left to whether the value happens to resolve. That is
  # the ground `NON_MEMBERS`'s examples row already states.
  #
  # THE MEMBER ROUTE WAS TRIED FIRST, AND MEASURED, AND IS WRONG TWICE:
  #
  #   1. The generator writes `generated_at` into a YAML COMMENT, not a data
  #      field. The sweep's commit-shaped pass reads every line and FINDS it;
  #      the non-commit pass skips comment lines by design and does NOT. So one
  #      member classifies this file twice — a resolved pin site AND an
  #      `absent_key` — and `tests/doc-health/test_sentinel_vocabulary.py`'s
  #      "no site is classified twice" pin fails, correctly.
  #   2. `PIN_KEY_VOCABULARY` is the UNION of declared field keys, so declaring
  #      this one widens the sweep repo-wide. Measured at this commit: 21 files
  #      inside the scan roots carry a data-field `generated_at`, and every one
  #      of them holds an ISO TIMESTAMP rather than a commit.
  #
  # And the file may not be edited to suit either pass: it is a WITNESS,
  # verified byte for byte, and an edited witness proves nothing. The seam in
  # (1) is real and pre-existing; it is not this act's object.
  #
  # WHAT BINDS THE PROVENANCE INSTEAD, and it is stronger than a reachability
  # verdict: the `sha256` above fixes the bytes, and
  # `tests/review_lane_pin/test_floor_snapshot.py` compares them to the
  # authoritative document in the pinned core whenever that core is on disk. A
  # `generated_at` that drifted could only arrive inside bytes that failed both.
  # The claim this file makes is codexFactory's, not this repository's about
  # itself — which is the line every `NON_MEMBERS` row draws.
  refresh: >-
    Re-copy the file from `scripts/merge_master/openxfactory-review-authority-floor.yaml`
    at the new `core_commit`, recompute `sha256`, and update `entry_count`. Never
    hand-edit the copy: it is a witness, and an edited witness proves nothing.

# WHY THIS PIN IS NOT xFACTORY'S PIN — the divergence, and the obligation it
# creates.
#
# xFactory pins ONE codexFactory commit in BOTH of its merge-master surfaces
# (`.github/workflows/merge-master-approval.yml` and
# `.github/workflows/council-convening-lane.yml`) and calls advancing it a
# recorded re-point ceremony, in lockstep, precisely so two cores never judge
# one family. Pinning the SAME commit here was the lockstep-preserving choice
# and it is, again, impossible: at xFactory's pinned commit — `f4702f64`, where
# the 2026-08-28 ceremony left all three surfaces, measured on xFactory `main`
# 2026-09-01 — the floor document above carries FOUR entries, not 57, and the
# three core functions this caller now calls (`post_merge_tree_paths`,
# `candidate_floor_drift`, `parse_repository_floor_reporting`) do not exist.
# Since the floor evaluation is the ONLY thing this caller does, and the (b′)
# extension is the whole object of this advance, the older commit cannot run it.
#
# So the divergence is FORCED BY THE FEATURE, not chosen for freshness — and
# saying so is not the same as discharging it. This is the SECOND time the same
# feature has forced it, which is itself worth recording: convergence held for
# four days.
#
# WHAT WOULD RE-CONVERGE IT: advancing xFactory's two surfaces to this file's
# `core_commit` in one recorded ceremony. That is an act in ANOTHER repository
# and this pull request does not take it. Nothing here requires it first — the
# two families judge different candidates, and the (b′) landing pair is
# openxFactory's and codexFactory's — but the obligation below is why the state
# is written down as diverged rather than left to be inferred.
lockstep:
  status: diverged
  reason: >-
    Diverged again on 2026-09-01 by this advance. Both xFactory judging surfaces
    below name `f4702f64` (measured on xFactory main, 2026-09-01: the two `ref:`
    literals) — where the 2026-08-28 ceremony left all three, openxFactory PR
    #483 paired with xFactory commit eae4dc6. This file now names the commit
    that carries the (b′) 57-entry floor and the drift-detection core the caller
    calls; at `f4702f64` the floor is four entries and those functions are
    absent, so the converged commit cannot evaluate the object this advance
    exists to make operative.
  converged_with:
    - opensoft/xFactory .github/workflows/merge-master-approval.yml
    - opensoft/xFactory .github/workflows/council-convening-lane.yml
  obligation: >-
    A future re-point ceremony should converge all three surfaces onto one
    commit. Advance this pin only at such a ceremony, and change this file, the
    caller's `ref:`, the caller's PINNED_CORE_COMMIT, the pytest-suite core
    checkout's `ref:`, and the vendored floor snapshot with its digest in ONE
    reviewed diff — the tests fail if any of them disagree. A pin moves with
    everything that names it; five sites name this one now, up from three.
  # The diverging commit is NAMED in the caller's header comment rather than
  # here on purpose. `.github/` is outside the derivation-pin sweep roots, while
  # `contracts/**` is inside them: a second commit-shaped value in this file
  # would be a second pin site needing its own declared class member, for a
  # value that is documentation about another repository's workflow rather than
  # a pin this repository consumes.

# WHAT THE PINNED CORE IS AND IS NOT USED FOR HERE. Recorded on the pin because
# a pin that does not say what it authorizes invites scope creep at the next
# edit.
scope:
  advisory_only: true
  evaluates:
    - the repository gate floor for opensoft/openxFactory
    # Added at the 2026-09-01 advance, with the (b′) guards. Each is a REFUSAL
    # this lane can now render that it could not before, and each names the
    # amendment that required it.
    - whether the candidate REMOVES or RENAMES a floored path, judged against
      the post-merge path set rather than the base tree alone, so the deleting
      pull request carries the failure (LA-A2, CPL-C1)
    - whether every tracked openspec/specs path is present on the floor, so a
      spec added off the floor is red rather than silent (LQ-A7)
  # STILL ADVISORY. This lane is required by no ruleset (measured 2026-09-01:
  # openxFactory's three required contexts are pytest-suite, wallet-validation
  # and signed-execution-chain-gate), so every refusal above is a report. LA-C1
  # (BLOCKING) forbids making it required until the drift check has landed; it
  # lands here, which satisfies the ordering and authorizes nothing.
  does_not_evaluate:
    - the tier-1 merge-approval envelope (no candidate class is enrolled for
      this repository; the envelope schema requires a non-empty candidates list
      and the gate_rules_council has defined no OPERABLE class for openxFactory.
      A record exists as of 2026-08-28 and REFUSED the class put to it — a class
      that can never convene is not an operable one — so
      add-substantive-review-lane task 3.2 stays OPEN)
    - any tier-2 per-repo gate rule
    - any council verdict transport
  never_performs:
    - submitting a review
    - minting an approving identity's token
    - calling merge
    - enabling auto-merge
    - changing any ruleset or branch-protection setting

# The governance record this pin serves.
realizes: add-substantive-review-lane task 5.1 (workflow-instance half only)
blocked_half: >-
  Task 5.1's ruleset half remains owed, behind S3 (the wallet-signed exercise
  record at check_verdict) and S5 (revocation at verdict consumption) of
  add-wallet-carried-review-authority, plus a ratified ruleset change.
