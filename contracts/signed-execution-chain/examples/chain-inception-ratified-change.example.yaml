# THE WHOLE OF LINKS 1 AND 2, IN ONE SIGNED ACT — the packaged reference chain
# every other file in this corpus belongs to.
#
# `signed_ratification` is the exact block the ratifying signature covers, and
# the CHAIN IDENTITY below is its digest under `xfc-jcs-sha256-1`. Everything the
# capability requires to be unforgeable after the fact is INSIDE it: the
# presentation that proved possession, the actor-to-wallet binding, the per-act
# value (which is `presentation.exercise_ref` — named, never minted) and the
# out-of-pipeline ground.
#
# THE TWO DIGESTS ARE DIFFERENT VALUES OVER DIFFERENT SUBJECTS, and this file is
# where a reader can see it. `ratified_subject.subject_digest` is the CONTENT
# digest, taken over the subject ratified, and it is what the exercise's
# `object_ref` carries; `chain_identity` is taken over the SIGNED bytes, a strict
# superset. Equating them rejects every conforming chain.
#
# THE RATIFIED SUBJECT IS A PACKAGED PLACEHOLDER THIS CORPUS FULLY DETERMINES, so
# the construction can be watched working rather than taken on trust: the content
# digest below is `xfc-jcs-sha256-1` applied to
# {"fixture": "signed-execution-chain packaged ratified subject", "version": 1}
# and recomputes from those bytes alone.
#
# THE KEY IS A FIXTURE KEY AND ITS PRIVATE HALF EXISTS NOWHERE IN THIS
# REPOSITORY. Only the public half, the digests and the signatures are packaged;
# every signature here verifies, and the corpus is self-checking because the
# validator recomputes each one.
