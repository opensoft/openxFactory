# expected_failure: content_digest_equated_with_chain_identity
# VIOLATES requirement 4's fourth scenario, and it is the defect Codex found on
# `61ab5d84` — a rule gaining a conjunct without a sweep for what it falsifies.
#
# The chain identity is taken over the SIGNED ratification; the content digest
# over the SUBJECT RATIFIED. The signed bytes are a strict SUPERSET — they also
# carry the presentation reference, the per-act value and the actor binding — so
# the two can NEVER be equal for a conforming record, and a gate implementing the
# identity check with the content digest would reject every conforming chain.
#
# It is unbuildable in the other direction too: an exercise's `object_ref` would
# have to commit to a signature not yet made.
