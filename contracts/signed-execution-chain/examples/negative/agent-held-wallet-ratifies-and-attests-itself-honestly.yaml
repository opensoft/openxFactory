# expected_failure: machine_holder_as_ratifying_authority
# expected_failure_detail: holder class
# VIOLATES requirement 8, and the fixture is deliberately HONEST: the agent-held
# wallet signs, and the recorded actor correctly attests THAT SAME wallet. The
# attribution is right; the HOLDER CLASS is what is refused.
#
# Correct attribution is never accepted as evidence that the attributed holder
# was ELIGIBLE TO RATIFY, and the refusal names the holder class rather than the
# missing signature. The ground is constitutional: every omnigent worker
# archetype carries `access_secrets: false`, so a worker cannot hold an authority
# credential.
#
# THE SCOPE IS NARROWING A, ruled by Brett Heap on 2026-08-29: tier 1 is
# RATIFYING authority. An agent-held wallet exercising a `review`-act grant —
# `wal-agent-mrc-0001`, which this repository runs today — is untouched by this
# requirement, because reviewing is not incepting a chain.
