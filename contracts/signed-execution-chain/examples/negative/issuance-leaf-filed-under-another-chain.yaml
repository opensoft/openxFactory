# expected_failure: continuity_broken
# expected_failure_detail: chain
# VIOLATES requirement 6's "every act writes a leaf" THROUGH THE LOOKUP THAT
# CHECKS IT (Codex, P1, round three) — and it is round two's shape one level up:
# the leaf's `chain_ref` and the payload it names could disagree.
#
# Chain B here is complete and internally honest: signed inception, ratification
# leaf, inception leaf, traveling contract, every digest recomputing. The only
# defect is that the leaf recording its ISSUANCE is filed under chain A.
#
# BOTH CHECKS THAT SHOULD HAVE CAUGHT IT LOOKED SCOPE-WIDE. The payload-digest
# recomputation resolved the traveling contract by IDENTIFIER across the whole
# store, so it matched and recomputed cleanly; and the missing-leaf rule collected
# recorded ids GLOBALLY, so chain A's leaf discharged chain B's obligation. Chain B
# passed with its primary custody record silent about an act the contract requires
# to be recorded — which is precisely the hole the missing-leaf rule had just been
# added to close.
#
# A LEAF BELONGS TO THE CHAIN IT NAMES. The lookup is now chain-scoped and the
# recorded set is keyed on the PAIR, so an issuance can only be discharged by a
# leaf on the issuing chain.
