# expected_failure: digest_construction_mismatch
# expected_failure_detail: records a presentation for a different subject
# VIOLATES requirement 4's "each record SHALL name which subject its digest is
# taken over" at the point where naming it is not enough.
#
# This leaf is INTERNALLY IMPECCABLE: its own digest recomputes over its content,
# its signature verifies, its hash link is correct, and its payload digest names
# the right SUBJECT — `ratified_subject`. And the VALUE it commits to is a
# different subject's content digest, so the leaf records the presentation of a
# ratification that is not this chain's.
#
# SELF-CAUGHT, and the fixture exists because of what the catch revealed. The
# reader's ratification-leaf branch checked the subject NAME and never compared
# the value, which is round one's defect class exactly: a check that reads as
# though the commitment were verified while nothing is compared. Adding the
# comparison changed the verdict on NO packaged fixture — measured, by running
# every fixture through both readers — so the check was dead code until this file
# existed. A refusal no fixture provokes is a refusal nobody has seen work.
