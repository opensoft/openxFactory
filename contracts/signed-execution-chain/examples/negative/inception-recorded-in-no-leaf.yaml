# expected_failure: act_unproven
# VIOLATES requirement 6's first scenario. The act completed — a signed
# inception and the traveling contract issued from it — and NO SIGNED LEAF
# records it.
#
# The act is UNPROVEN and every consumer that requires the chain refuses it. The
# act's own success is not evidence that it was permitted: that is the whole
# difference between an audit trail, which is written afterwards and can be
# forged afterwards, and a record the gate walks BEFORE the terminal act.
