# expected_failure: continuity_broken
# expected_failure_detail: records the refusal
# VIOLATES the reason the refusal enumeration is CLOSED at all (Codex, P2).
#
# This chain really is refused — its exercise records a REVOKED grant — and the
# verdict leaf says so: outcome `refused`, and the failing check named correctly.
# The only lie is the CODE. It records `missing_proof_of_possession`, and the
# proof was presented and verified; what failed was standing at exercise.
#
# THE ENUMERATION EXISTS SO A REFUSAL NAMES WHAT WAS ACTUALLY LACKING — the same
# rule that keeps a missing proof from being reported as a missing grant. A
# verdict free to record any enum-valid code while the walk failed for another
# reason turns the enumeration into decoration, and the FALSE REASON is what an
# operator would act on: this one sends them to look for a signature that was
# never missing instead of at a revoked grant. The previous rule checked only
# that a `refusal` object EXISTED.
