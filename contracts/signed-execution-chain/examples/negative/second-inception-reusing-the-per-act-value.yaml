# expected_failure: per_act_value_reused
# VIOLATES requirement 3's enforced uniqueness — the hardening harvested from
# #494, where the round after the first fix showed that NAMING a per-act value is
# necessary and not sufficient.
#
# This inception re-ratifies with the SAME exercise identifier the packaged chain
# already consumed. The pinned schema validates that identifier as a generic
# identifier and constrains nothing about its reuse, so without this capability's
# own refusal a producer could reproduce identical signed bytes, an identical
# digest and — under a deterministic signature scheme — an identical signature,
# and the "new" chain would silently BE the old one.
#
# An obligation a consumed contract does not carry is this capability's to
# enforce or to declare as a dependency, never to take on trust.
