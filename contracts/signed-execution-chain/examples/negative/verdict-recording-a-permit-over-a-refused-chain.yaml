# expected_failure: continuity_broken
# expected_failure_detail: records `permitted` while this reader's walk refuses
# VIOLATES the rule that keeps requirement 7 from being decorative: A VERDICT IS
# NOT EVIDENCE OF THE WALK THAT PRODUCED IT.
#
# The chain here is refused on standing — its exercise records a REVOKED grant —
# and the log carries a gate-verdict leaf recording `permitted`, with all eight
# checks recorded as passing. Every record is well formed and the log is intact.
#
# The reader holds the recorded verdict to ITS OWN walk and refuses the
# disagreement. Without that, a gate could be described as validating chains
# while its records said whatever the producer wanted — which is exactly the
# described-control failure this capability exists to end, written into the
# record itself.
