# expected_failure: chain_unevaluable
# expected_failure_detail: key-ratifier-0001
# VIOLATES nothing in the contract text and everything in the reader's ability to
# answer the question it is asked (Codex, P1, round two).
#
# This chain's carried wallet declares `key-ratifier-0001` — the identifier the
# packaged chain's wallet also declares — for a DIFFERENT public half. Both
# wallets are schema-valid. The leaf-signature reader built one scope-wide map of
# declared keys with `dict.update`, so whichever wallet was encountered last
# silently won: valid leaves of the other chain would fail, and leaves signed by
# the colliding wallet's key would be accepted for a chain that never authorized
# it.
#
# AN AMBIGUOUS KEY IS NOT A RESOLVED ONE. Verifying against a guess is worse than
# declining to verify, so an identifier two carried wallets claim with different
# public halves makes every signature naming it UNEVALUABLE — which is a refusal.
