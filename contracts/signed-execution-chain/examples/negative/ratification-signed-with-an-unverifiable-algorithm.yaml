# expected_failure: chain_unevaluable
# VIOLATES requirement 7's fail-closed doctrine. The ratification declares an
# algorithm this realization does not verify.
#
# THE CHAIN IS REFUSED, NOT PASSED. An unevaluable answer never reads as
# permission, and accepting a signature nobody checked is the opposite of what a
# gate is for. `ecdsa-p256` and `ecdsa-secp256k1` are members of the shipped
# signature-algorithm enumeration and are deliberately not implemented here;
# choosing one is bounded realization work, and until it is done a chain that
# uses one cannot be walked.
