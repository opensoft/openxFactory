# expected_failure: ratification_signature_invalid
# VIOLATES the contract's "canonical unpadded base64url" (Codex, P2).
#
# For a 64-byte signature the FINAL base64url character carries only two data
# bits, and a decoder ignores the remaining four. So fifteen other spellings of
# this exact signature decode to the same bytes, verify identically, and all match
# the schema's 86-character pattern. This fixture is one of them: the signature
# bytes are the packaged chain's own, re-spelled.
#
# ONE SIGNATURE, ONE SPELLING. The reader re-encodes the decoded bytes and
# requires an exact match, because a record that admits sixteen textual forms of
# one signature admits sixteen distinct signed ratifications by digest — and the
# chain identity is a digest OVER those bytes.
