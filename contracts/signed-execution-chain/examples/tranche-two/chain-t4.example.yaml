# CHAIN FOUR — THE REMEDIATION POSITIVE.
#
# A corrective change that is ITSELF A FULL CHAIN: its own links 4-6 walked at the
# gate exactly as for any work, its own closure owed and PASSING. It declares an
# unclosed chain BY CHAIN IDENTITY as a subject falling inside the bytes its
# ratifying signature covers, and it is ADMITTED as the one consumer of that
# unclosed chain.
#
# THE CHAIN IT REPAIRS IS DELIBERATELY OUTSIDE THIS CORPUS, and that is a fact about
# positives rather than an omission: a failed closure inside the positive corpus
# would be a refusal the corpus must not carry, since every packaged positive must
# validate cleanly. The repaired chain is named by identity only — which is all the
# exemption's second condition asks for.
#
# IT IS AN EXEMPT CONSUMER AND NEVER AN EXEMPT CHAIN. `promotion_claimed` is false
# because admission of the repair is never read as closure of the chain being
# repaired, and `inherits_exemption` is false because an exemption that descends is
# an exemption that launders.
