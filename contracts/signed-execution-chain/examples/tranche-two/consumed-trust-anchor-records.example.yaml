# THE CONSUMED `add-trust-anchor` RECORDS, CARRIED SO THE COMPOSITION CAN BE
# WATCHED WORKING RATHER THAN TAKEN ON TRUST.
#
# Tranche two's tier-2 issuance composes THREE records, and only ONE of them is
# this capability's: the canonical `xfactory_certificate_record` carries the
# identity's PUBLIC-KEY FINGERPRINT and its VALIDITY BOUNDS, the canonical
# `xfactory_certificate_issuance_evidence` carries the issuance ACT, and the SIGNED
# CHAIN BINDING carries the subject scope, the closed record-kind enumeration and
# the chain identity served. BOTH TRUST-ANCHOR SHAPES ARE CONSUMED UNMODIFIED —
# this capability defines no second certificate, issuance or anchor vocabulary — and
# they sit here so a reader can resolve every reference the bindings make.
#
# EVERY FINGERPRINT BELOW IS COMPUTED UNDER THE ONE CONSTRUCTION IN FORCE. It is
# `xfc-jcs-sha256-1` applied to the `did:key` multibase spelling of the public half
# the corresponding signed record supplies beside its signature, so the
# RESOLVE-COMPARE-THEN-VERIFY order is runnable from the packaged bytes alone.
#
# THE KEYS ARE FIXTURE KEYS. Only the public halves, the digests and the signatures
# are packaged; the corpus is self-checking because the canonical validator
# recomputes each one.
