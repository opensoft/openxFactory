# expected_failure: commitment_extension_after_dispatch
# VIOLATES the deadline: the commitment for each task is signed NO LATER THAN THAT
# TASK'S DISPATCH. The extension here is written AFTER the task it commits was
# dispatched — a commitment made once the outcome was already in hand.
#
# A COMMITMENT MADE AFTER THE FACT IS A DESCRIPTION. The point of committing at
# dispatch is that the controller cannot silently shed a task whose attestation
# never arrives; an extension minted late is exactly that shedding, pre-narrated.
