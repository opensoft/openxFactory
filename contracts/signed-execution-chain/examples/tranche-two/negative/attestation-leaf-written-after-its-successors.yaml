# expected_failure: attestation_leaf_deferred_past_successor
# VIOLATES the log-order side of the hash link: a link-5 record's leaf is written
# AFTER the chain's link-6 leaf, so at the moment the decision was logged this
# attestation was not yet part of the record.
#
# A LEAF DEFERRED PAST ITS SUCCESSOR'S IS A RECORD BACKDATED INTO A COMMITMENT: the
# decision claims to have committed to an enumeration the log did not yet hold. The
# record itself is a byte-perfect duplicate of a valid attestation — the defect is
# WHERE IN THE LOG IT LANDED, which is exactly what makes the log the record.
