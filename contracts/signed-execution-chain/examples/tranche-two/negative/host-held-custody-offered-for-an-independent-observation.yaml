# expected_failure: custody_ceiling_exceeded
# expected_failure_detail: custody ceiling BOUNDS
# VIOLATES the declared COMPOSITION between this capability's evidence classes and
# `add-trust-anchor`'s ratified, CLOSED custody registry — the two axes read
# TOGETHER AND IN THAT ORDER (`design.md` D2).
#
# The registry classes WHOSE ACT a signature evidences; the evidence classes class
# WHERE A FACT INSIDE THE SIGNED PAYLOAD CAME FROM. THE SIGNING CERTIFICATE'S
# CUSTODY CEILING BOUNDS WHAT ANY FACT UNDER IT EVIDENCES, and NO EVIDENCE CLASS
# RAISES A FACT ABOVE IT. Here the controller certificate declares `host_held`
# custody — which the ratified registry says evidences `using_host` — while a fact
# is carried as `independently_observed`. What the signature evidences is derived
# from the DECLARED CUSTODY and never from the certificate's contents.
