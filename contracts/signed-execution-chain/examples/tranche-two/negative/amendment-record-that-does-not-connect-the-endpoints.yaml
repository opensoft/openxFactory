# expected_failure: amendment_lineage_unsupported
# VIOLATES the middle limb: the amendment record must CONNECT the reviewed digest
# to the ratified one. The lineage here — inside the inception's own signed bytes,
# covered by a valid ratifying signature — declares an amendment record whose
# endpoints are different digests entirely, so the step from `reviewed` to
# `ratified` is asserted and not evidenced.
#
# A RATIFICATION CANNOT MERELY ASSERT A LINEAGE — three limbs or no closure, and the
# middle limb is the one that stops an invented history connecting two real ends.
# The defect lives in signed bytes, which is why this fixture carries its own
# inception rather than mutating a healthy chain's closure.
