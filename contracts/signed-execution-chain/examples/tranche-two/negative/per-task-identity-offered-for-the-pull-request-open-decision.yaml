# expected_failure: subject_scope_mismatch
# expected_failure_detail: issued at
# VIOLATES the subject split at the point that made it necessary. LINK 6 IS ONE
# DECISION COMMITTING TO EVERY LINK-5 ATTESTATION for the work it proposes, so its
# subject is THE CHAIN and not any one task.
#
# A signer valid for one task and authorized only for records ABOUT THAT TASK cannot
# produce it the moment a chain fans out past one task: whichever task's identity
# signed, the record would necessarily cover work from the others. A SINGLE-TASK
# CHAIN IS NOT ACCEPTED AS MAKING THE SCOPE IMMATERIAL, since a rule that holds only
# where the fan-out happens to be one is not the rule.
