# expected_failure: amendment_lineage_absent
# VIOLATES the precondition the three limbs stand on: a closure presented for a
# chain whose inception CARRIES NO AMENDMENT LINEAGE is refused, because the limbs
# compare against fields that do not exist.
#
# CARRYING THE LINEAGE IN A LATER RECORD IS NOT ACCEPTED — later records are not
# covered by the ratifying signature, and what the signature does not cover the
# ratifier did not ratify. The four fields are OPTIONAL in the shape (the additive
# release discipline; the residual is declared at SEC-R16) and REQUIRED BY THE
# READER the moment the chain carries tranche-two records, which this closure is.
