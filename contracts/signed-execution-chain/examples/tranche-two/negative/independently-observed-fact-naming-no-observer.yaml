# attestation is ONE MECHANISM that supplies it rather than the class itself.
#
# A class asserted without the party that supplies it is a word. The third class is
# named for the property it asserts and NOT for the hardware that often supplies it,
# because the ratified custody registry excludes `asserted_hardware_backing` BY NAME:
# where a key physically lives is a fact about blast radius, never a tier.
