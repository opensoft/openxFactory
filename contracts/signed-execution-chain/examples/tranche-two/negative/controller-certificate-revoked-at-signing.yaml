# expected_failure: certificate_revoked_at_signing
# expected_failure_detail: refused outright
# VIOLATES requirement 1's two-horizon doctrine on its FIRST horizon: a
# certificate ALREADY REVOKED AT SIGNING makes the attestation REFUSED OUTRIGHT and
# nothing downstream of it is permitted.
#
# The signature is cryptographically valid, and that is the point: REVOCATION DOES
# NOT INVALIDATE A SIGNATURE, so validity is never accepted in place of standing at
# signing. Compare the sibling fixture for a certificate revoked AFTER a signature
# was already made — the two are DISTINCT OUTCOMES and are recorded as two.
