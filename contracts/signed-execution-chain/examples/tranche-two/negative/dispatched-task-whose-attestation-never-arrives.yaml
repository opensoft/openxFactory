# expected_failure: dispatched_leaf_never_written
# THE DROPPED-ATTESTATION ATTACK ITSELF — the scenario the commitment mechanism
# exists to catch. A task is committed at dispatch, the work runs, and no link-5
# leaf for it is ever written; without the committed expectation this would read as
# a smaller fan-out rather than a suppressed record.
#
# ABSENCE IS ONLY DETECTABLE AGAINST A COMMITMENT, which is why the expected set is
# committed no later than dispatch and why the extension here — timely, controller-
# signed, correctly chained — does not save the chain whose expectation it grew.
