# expected_failure_detail: bounds that are merely PRESENT are not bounds that are MET
# VIOLATES the first limb of the composed verification: THE CERTIFICATE VALID AND
# CURRENT. An ephemeral identity is one whose VALIDITY BOUNDS SAY SO, and the
# signing moment here falls outside them.
