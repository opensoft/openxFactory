# expected_failure: signing_key_fingerprint_mismatch
# expected_failure_detail: FORGED-IDENTITY refusal names
# VIOLATES the RESOLVE-COMPARE-THEN-VERIFY order. The record supplies a public key
# beside its signature, the signature VERIFIES UNDER THAT KEY, and the key's
# computed fingerprint does not EQUAL the certificate's.
#
# THE SIGNATURE'S VERIFYING UNDER THE SUPPLIED KEY IS NEVER ACCEPTED, since it is
# the BINDING TO THE CERTIFICATE that was in question and not the arithmetic. A key
# that is not the certified key is exactly what the forged-identity refusal names.
