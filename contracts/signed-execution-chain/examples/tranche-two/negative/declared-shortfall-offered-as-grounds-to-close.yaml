# platform cannot establish the outcome to this strength declares the shortfall and
# remains conformant AS A REALIZATION — and the closure here offers that declaration
# as grounds to close anyway.
#
# A DECLARATION BOUNDS WHAT MAY BE CLAIMED; IT NEVER EXTENDS IT. The chain does not
# close, on the same downward-only doctrine as the platform attribution ceiling.
