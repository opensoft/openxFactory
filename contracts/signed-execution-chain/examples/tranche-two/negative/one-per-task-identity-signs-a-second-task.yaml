# expected_failure: per_task_identity_reused
# expected_failure_detail: valid for ONE task
# VIOLATES requirement 2's per-task scope. A PER-TASK IDENTITY IS VALID FOR ONE
# TASK, and reuse is never accepted on the strength of the identity still being
# unexpired.
#
# The chain commits a second task by extension, and the SAME per-task binding signs
# both attestations. This refusal DOES NOT REACH THE CHAIN-SCOPED IDENTITY, whose
# one chain spans every task the chain dispatched and whose records are about that
# whole — which is why the two scopes exist and why collapsing them re-creates the
# conflict the split was raised to resolve.
