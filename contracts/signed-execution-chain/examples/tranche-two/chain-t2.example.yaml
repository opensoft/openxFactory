# CHAIN TWO — THE MAIN POSITIVE: A FAN-OUT DISCOVERED AS THE WORK RAN.
#
# Links 1-3 are tranche one's, unchanged in shape. From LINK 4 the signed hash-link
# rule is in force, and this chain is the case that makes the rule's wording
# load-bearing: task `task:t2-b` is dispatched AFTER `task:t2-a` has already
# attested, so the extension committing it descends from THAT LINK-5 RECORD and the
# binding minted for it descends from the extension. THE GATE WALKS THE INTERLEAVED
# ORDER AS IT STANDS, because the order is a property of the records that exist
# rather than of their kinds. `4 -> x1 -> ... -> xn -> 5 -> 6 -> 10` is an
# illustration of the no-interleaving case and binds nothing; chain three below is
# that case.
#
# WHAT ELSE THIS ONE PROVES. One CHAIN-SCOPED tier-2 identity signs the single
# link-6 decision over BOTH tasks' attestations, which is the record no per-task
# identity can produce once a chain fans out past one task. Every tier-2 signature
# resolves its own three-record issuance first. The link-6 and link-10 requests are
# ATTRIBUTED to the party the chain's own inception record binds, RECORDED beside
# the signatures they received, and covered INSIDE the signed bytes. And closure
# runs the THREE LINEAGE LIMBS over an AMENDED packet: the reviewed digest and the
# ratified subject digest DIFFER, which is the ordinary outcome of a review that
# required amendments and exactly what a rule demanding equality would have refused.
#
# EVERY DIGEST AND SIGNATURE HERE RECOMPUTES. The ratified, reviewed and review
# digests are `xfc-jcs-sha256-1` over packaged placeholders this corpus fully
# determines — {"fixture": "<name>", "version": 1} — so the construction can be
# watched working rather than taken on trust. The keys are FIXTURE keys and only
# their public halves are packaged.
