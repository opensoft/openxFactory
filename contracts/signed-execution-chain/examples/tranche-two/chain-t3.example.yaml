# CHAIN THREE — THE UNAMENDED REVIEW, AND THE NO-INTERLEAVING CASE.
#
# TWO POSITIVES IN ONE CHAIN, both of which the delta names and neither of which
# gets its own path in the rules.
#
# THE LINEAGE OF LENGTH ZERO. The council required no amendment, so the REVIEWED
# DIGEST and the RATIFIED SUBJECT DIGEST are THE SAME VALUE and the amendment record
# is the disposition recording that nothing was owed. Closure verifies the IDENTICAL
# THREE LIMBS over the IDENTICAL FOUR FIELDS. There is no second shape and no second
# path for the unamended case, because a second path is a second thing to get wrong
# and the amended case is the common one.
#
# FAN-OUT COMPLETED BEFORE ANY RUNNER ATTESTED. Both tasks are committed in link 4,
# both per-task identities and the chain-scoped one are issued up front, and only
# then do the runners attest. The order reads 4 -> x1 -> x2 -> x3 -> 5 -> 5 -> 6 ->
# 10, and CONTINUITY holds over it — which says nothing about a chain PRESENTED with
# links missing, and establishes ORDER and never COMPLETENESS. The committed
# expectation is what decides whether every dispatched task is accounted for.
