# CHAIN FIVE — THE CORPUS'S APPEND TARGET: A COMPLETE, CONFORMING, SINGLE-TASK CHAIN.
#
# It is complete rather than in flight because tranche one already requires EVERY
# chain in scope to carry its own GATE-VERDICT LEAF: a chain whose own verdict is
# absent from the log has a custody record silent about whether it was ever
# permitted, and that rule is not this tranche's to relax. So the smallest lawful
# append target is a whole chain, and this is it.
#
# MOST NEGATIVE FIXTURES IN THIS CORPUS APPEND ONE RECORD TO THIS CHAIN, so the
# refusal they provoke is the one they are named for. A negative that appends a
# record also draws the findings its own PLACEMENT earns — a link-5 leaf written
# after this chain's link-6 leaf is a deferred leaf, and an attestation for a task
# no commitment covers is uncommitted. That is the rules working, and the expected
# code is what the self-test pins.
