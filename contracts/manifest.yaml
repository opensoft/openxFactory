  # ---- ideation-dashboard workbench contract surface — contract-v1.26 realization (add-staging-workbench 1.7, add-workbench-bullseye-and-create 1.6, add-dashboard-repo-selector 1.6, add-workbench-branch-sessions 1.6) ----
  # The family's FIRST manifest registration beyond contracts/README.md's doc
  # index (the ideation-possibles-register precedent, contract-v1.14): the
  # dashboard projection snapshot (staged-topic growth, add-staging-workbench),
  # the gate-action record (create/document action growth per
  # add-workbench-bullseye-and-create; session-verb 1.1/1.2 growth plus the
  # D23 `provenance` block per add-workbench-branch-sessions 1.8), and the NEW
  # snapshot-index locator (add-dashboard-repo-selector). All growth is
  # additive — no contract_schema_version bump. Per-file sha256 over each
  # schema's bytes. The delegated strict validator
  # (scripts/validate-ideation-dashboard-contracts.py) stays content-addressed
  # by commit; no per-file digest. Realized at the contract-v1.26 additive
  # cut per docs/contract-versioning-policy.md.
  - id: ideation-dashboard-snapshot
    path: contracts/schemas/ideation-dashboard-snapshot.schema.yaml
    source_path: openxFactory/contracts/schemas/ideation-dashboard-snapshot.schema.yaml
    type: schema
    schema_version: 1
    sha256: 6a3b496c59cea9cfb232e35d21b4864a928287c7b98b5436aac0c83d9c14e9b3
    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      The deterministic ideation-dashboard projection snapshot, including the
      staging-workbench staged-topic growth (add-staging-workbench).
      Consumers read snapshots emitted against this schema through their
      pinned openxFactory checkout at the contract-v1.26 tag and MUST verify
      the per-file sha256 before treating a copy as current. Snapshot referential integrity and every rule the shape
      cannot express are enforced by
      scripts/validate-ideation-dashboard-contracts.py (the family's
      delegated owner), never re-implemented by consumers.
  - id: xfactory-workbench-model-catalog
    path: contracts/schemas/xfactory-workbench-model-catalog.schema.yaml
    source_path: openxFactory/contracts/schemas/xfactory-workbench-model-catalog.schema.yaml
    type: schema
    schema_version: 1
    sha256: dff513fa6b607c417a39e5529964f9df2c8f56841ae3b0a894c85b6d1dea0675
    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      The doxBench approved-model catalog wire envelope
      (add-workbench-integrated-editor-chat 2.1): the GET
      /workbench/model-catalog success body, public allowlist only,
      structurally closed against credentials/endpoints/secret names. An
      empty models array is the successful editor-only posture. The allowlist
      is the SEVEN REQUIRED base fields plus, since contract-v1.38, the THREE
      OPTIONAL routing-declaration fields — routing_rule, routes_to,
      resolved_model_id — which travel together and are ABSENT from a plain
      entry, so a consumer that reads only the seven stays correct against
      every catalog it could already read. A consumer that offers an `auto`
      entry MUST read all three: routing_rule says the entry is a rule rather
      than a model, resolved_model_id is the model that ANSWERS (and is what
      a turn record's model_id carries), and the entry's own data_handling
      states the posture of every model in routes_to. Consumed through the
      pinned openxFactory checkout at the contract-v1.38 tag; per-file sha256
      verified before any copy is treated as current. Catalog rules the shape
      cannot express — routing resolution, the badge covering, the
      availability and headroom rules — are enforced by
      scripts/validate-ideation-dashboard-contracts.py (the family's
      delegated owner), never re-implemented by consumers.
  - id: xfactory-workbench-chat-turn
    path: contracts/schemas/xfactory-workbench-chat-turn.schema.yaml
    source_path: openxFactory/contracts/schemas/xfactory-workbench-chat-turn.schema.yaml
    type: schema
    schema_version: 1
    sha256: 3de2a85323cc4c843a33d179e6ccabdc723280ba9243988adce3bbd6a0431a61
    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      The doxBench grounded chat-turn wire family
      (add-workbench-integrated-editor-chat 2.1): one file, now SIX closed
      envelopes discriminated by kind — the v1 request, validated success and
      fixed redacted failure, plus the co-resident widened v2 family
      contract-v1.34 adds (add-doxbench-editing-phase-b design D15).
      Exact-UTF-8 SHA-256 content identity; working_subject is non-identity by
      type; only limit failures carry measured data. The v1 request carries
      exactly one outline and one document buffer; the v2 request carries the
      outline plus every LOADED document, DECLARES its bound-buffer key, and its
      record states that key, the per-buffer observed hashes by key, a
      buffer-key proposal target, and the selected-model metadata. SINCE
      contract-v1.39 the v2 RECORD also carries `context_packet` — the POSTURE
      (`full | reduced`) the turn's bounded context packet was assembled under,
      plus that reduction's own reason. A consumer that reports how a turn was
      grounded MUST read it; a consumer that does not may ignore it, exactly as
      before. Its ABSENCE is not a posture claim: it means the producer predates
      contract-v1.39, never that the context was full. The reason is present IFF
      the posture is `reduced` (two schema conditionals, restated in the
      delegated validator). The DEPRECATED v1 success envelope is NOT widened
      and cannot state a posture — a recorded limitation, not an omission; the
      migration path is the v2 envelope. The v1 family is DEPRECATED at
      contract-v1.34 with removal target contract-v2.0
      (schema `deprecated_envelopes`; CHANGELOG migration note); it keeps
      validating and is still served until then. Consumed through the pinned
      openxFactory checkout at the declared tag; per-file sha256 verified before
      any copy is treated as current. Hash parity, budget, unknown-model,
      duplicate turn-id, proposal-target, bound-buffer membership,
      context-posture pairing, and failure-pairing rules are enforced by
      scripts/validate-ideation-dashboard-contracts.py, never
      re-implemented by consumers.
