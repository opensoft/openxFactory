  # ---- AVC-09 + AVC-10 — contract-v1.46 realization (qualify-avatar-live-voice) ----
  # The two identifiers the kernel RESERVED and named this change as the owner
  # of, published from their reserved shapes. AVC-09 carries NO numeric
  # latency-budget field (Fork 2 Option C); the gating rule is the neutral
  # relative-regression SLO in acceptance-map.yaml and the measured numbers are
  # AVC-10 samples. `interface-lock.yaml` moved exactly these two out of
  # `frozen.reserved_identifiers` in the same commit; AVC-03 and AVC-05 stay
  # reserved and no identifier is ever reused.
  - id: avatar-client-avc-09-voice-adapter-descriptor
    path: contracts/avatar-client/avc-09-voice-adapter-descriptor.schema.yaml
    source_path: openxFactory/contracts/avatar-client/avc-09-voice-adapter-descriptor.schema.yaml
