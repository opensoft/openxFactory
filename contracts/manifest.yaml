    consumption_rule: >-
      The seventh record kind and the third leg of a tier-2 identity's composed issuance: controller-signed, carrying the identity's SUBJECT SCOPE, its CLOSED enumeration of authorized record kinds, and THE CHAIN IDENTITY IT SERVES.
      THE TWO CANONICAL trust-anchor SHAPES ARE CONSUMED AND NEITHER IS
