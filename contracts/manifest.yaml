      CONVERGENCE NOT YET REACHED. The completeness claim carries its own
      strength, pre- or post-admission, and the residual — provider-side
      configuration outside version control — is a required field rather
      than a note elsewhere.
      Registered at contract-v3.3; consumed through the pinned
      openxFactory checkout with per-file sha256 verified before any copy
      is treated as current.
