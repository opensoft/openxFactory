    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      The SEALED BOUNDED REQUEST, as a record: the TEN declared fields a producer presents at the boundary, with the expiration required and a byte-tagged hash per selected file.
      A SHORT-LIVED SEALED JOB OBJECT and never a committed path of copied
      data — an expiring object is a REQUEST, while a committed copy is a
      MIRROR that outlives the work and carries the source's handling class
      into a second repository's permanent history. Field (10) is a tagged
      union: an ORIGIN SIGNATURE where the originating repository holds an
      active row in `governance/factory-identity/`, and trusted
      hosted-workflow provenance only where it does not — so registering an
      identity TIGHTENS a producer and never loosens one. The manifest
      digest is `signed-execution-chain`'s `xfc-jcs-sha256-1` over the
      `sealed_bundle_manifest` subject; per-file content hashes are plain
      algorithm-tagged SHA-256 over file BYTES, and a canonical-JSON
      construction applied to them is refused as a category error.
      Registered at contract-v3.3; consumed through the pinned
      openxFactory checkout with per-file sha256 verified before any copy
      is treated as current.
