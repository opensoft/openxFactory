  # ---- ideation-dashboard workbench contract surface — contract-v1.26 realization (add-staging-workbench 1.7, add-workbench-bullseye-and-create 1.6, add-dashboard-repo-selector 1.6, add-workbench-branch-sessions 1.6) ----
  # The family's FIRST manifest registration beyond contracts/README.md's doc
  # index (the ideation-possibles-register precedent, contract-v1.14): the
  # dashboard projection snapshot (staged-topic growth, add-staging-workbench),
  # the gate-action record (create/document action growth per
  # add-workbench-bullseye-and-create; session-verb 1.1/1.2 growth plus the
  # D23 `provenance` block per add-workbench-branch-sessions 1.8), and the NEW
  # snapshot-index locator (add-dashboard-repo-selector). All growth is
  # additive — no contract_schema_version bump. Per-file sha256 over each
  # schema's bytes. The delegated strict validator
  # (scripts/validate-ideation-dashboard-contracts.py) stays content-addressed
  # by commit; no per-file digest. Realized at the contract-v1.26 additive
  # cut per docs/contract-versioning-policy.md.
  - id: ideation-dashboard-snapshot
    path: contracts/schemas/ideation-dashboard-snapshot.schema.yaml
    source_path: openxFactory/contracts/schemas/ideation-dashboard-snapshot.schema.yaml
    type: schema
