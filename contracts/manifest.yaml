    sha256: a6ea3b65433bf284246cd555dde6cae881521ca81b745e168843381ed3b20fe6
    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      The session broker and the extracted `xfactory-avatar-client` consume
      AVC-09 and AVC-10 through their pinned openxFactory checkout at the
      contract-v1.46 tag and MUST verify the per-file sha256 before treating a
      copy as current. A descriptor instance carries adapter STATUS and
      references to recorded latency evidence; a per-profile numeric latency
      ceiling is refused structurally, and so is any secret material.
  - id: avatar-client-avc-10-voice-latency-sample
