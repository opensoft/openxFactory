      openxFactory checkout and keep provider-specific adapters behind
      xfactory.memory.*. Provider endpoints and connection refs belong in the
      xFactory memory_gateway binding layer, never in Hermes overlays.
  - id: memory-gateway-conformance-validator
    path: scripts/validate-memory-gateway.py
    source_path: openxFactory/scripts/validate-memory-gateway.py
    type: tool
    schema_version: 1
    intended_consumers:
