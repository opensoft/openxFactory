      DomainxFactory validate chains consume this schema through their pinned
      openxFactory checkout at the contract-v1.15 tag and MUST verify the
      per-file sha256 before treating a copy as current. The domain-owned
      boundary list naming (`<domain.id>_owns`), non-emptiness, and the
