  # ---- client-infrastructure contract family — contract-v1.13 realization (add-client-infrastructure-liaison) ----
  # Canonical openxFactory-owned neutral client-infrastructure coordination schemas;
  # per-file sha256 over the two kinds validate-client-infrastructure.py enforces. The
  # strict validator is registered as a tool (content-addressed by commit; no per-file
  # digest — the document-cataloging/memory-gateway convention). Deliberately NOT per-file
  # members: the packaged reference examples (examples/client-infrastructure/, self-tested
  # on each validator run) and the ratified governing role doc
  # docs/client-infrastructure-liaison.md (prose governed by the changelog) — matching the
  # v1.11 schemas+validator convention of registering only the machine-readable contract
  # schemas plus the tool. Consumed by the per-domain adoption successors (OpsxFactory
  # binding/readiness producer first, then the Medx/Ledger/Ad/codex aliases) through their
  # pinned openxFactory checkout; openxFactory ships no instance records (they live in
  # client installs, credential-contracts residency model).
  - id: xfactory-client-infrastructure-request
    path: contracts/schemas/xfactory-client-infrastructure-request.schema.yaml
    source_path: openxFactory/contracts/schemas/xfactory-client-infrastructure-request.schema.yaml
