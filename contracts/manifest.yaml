      convening job id, the VERIFIED subject pin, and the digest of the INBOUND
      sealed bundle. NO SIGNATURE MEMBER, because the return is UNSIGNED on the
      host and signed ON RETURN by the originating repository's own hosted
      signer; NO OUTCOME AND NO VERDICT-SHAPED MEMBER at any depth, the root and
      every nested object being closed and the canonical validator applying the
      same name scan it applies to the operation report. THE SEAT'S OUTPUT IS
      OPAQUE to this contract: the producing estate's per-seat accounting travels
      inside the payload rather than becoming a neutral member.
      Registered at realization by `admit-deliberation-clearing-operation`
      (ratified 2026-09-04 by Brett Heap, PR #645, merged 3cf917b7); the bundle
