    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      The xfactory_consent_instrument record kind — the authority-chain root: parties by rung (incl. estate hosts), scope with stated out-of-scope, delegation clauses, autonomy position, authority_basis, revocation right + SLA, opaque signed-original custody, the closed six-state lifecycle with declared aliases, amendment deltas, dependent-artifact references, and the declared consent-profile mapping (or explicit data_consent: none).
      Registered at contract-v1.30; digest refreshed at contract-v1.32 by
      add-client-identity-roster, which bumps this schema's
      contract_schema_version 1 -> 2 for two ADDITIVE growths: the
      lifecycle enum gains `withdrawn` as a SECOND TERMINAL state (a
      DISTINCT member, never an alias of `terminated`, because
      withdrawal by the consenting party and termination are distinct
      events that both raise the cascade obligation), and dependent_refs
      gains the named `governed_identity` kind with its two evidence
      siblings (identity_removal_evidence, admission_withdrawal_evidence)
      so the cascade reaches a standing identity in another party's
      tenant. The RECORD envelope's schema_version stays const 1 — the
      per-row schema_version below mirrors that const, not the schema
      file's contract_schema_version — because bumping it would
      invalidate every instrument in the estate, which is the opposite
      of additive. Consumed through the pinned
      openxFactory checkout with per-file sha256 verified before any
      copy is treated as current.
