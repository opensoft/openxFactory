    adapter_owner: openxFactory
    consumption_rule: >-
      The per-domain adoption successors consume both client-infrastructure schemas
      through their pinned openxFactory checkout at the contract-v1.13 tag and MUST
      verify the per-file sha256 before treating a copy as current. The
      client_infrastructure_request is a durable coordination record, never a Hermes
      job envelope; the liaison and no domain agent ever holds tenant-administration
      authority. Everything schema cannot express (transition legality, terminal
      immutability, readiness-gated completion, embedded-secret rejection,
      actor/authority and subject-field separation, idempotency/supersedes integrity)
      is enforced by scripts/validate-client-infrastructure.py.
