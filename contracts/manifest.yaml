      FIRST registration at contract-v1.32. The schema was promoted at
      DTN-004 without a manifest row; add-client-identity-roster
      registers it here, so the digest cross-repo consumers verify now
      exists for the file they pin. Registered in the same cut as its
      one ADDITIVE growth: the OPTIONAL issuance_preconditions object on
      a credential-requirement, a CLOSED vocabulary
      (accepted_request_required, registered_active_subject,
      roster_drift_clear_required) in which every value is const true,
      because a precondition is DECLARED or NOT DECLARED — false would
      read as governance while asserting nothing. Declaring nothing at
      all leaves a requirement record valid. Consumed through the pinned
      openxFactory checkout with per-file sha256 verified before any
      copy is treated as current.
