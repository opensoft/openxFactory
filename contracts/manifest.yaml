  # ---- possibles-derivation contract surface — contract-v1.14 realization (add-possibles-derivation-lane) ----
  # The ADDITIVE AI-derivation intake delta on the ideation-possibles-register
  # kernel (register_entry.origin + the derivation/derivation_human_disposition
  # $defs; no contract_schema_version bump — the conditional never fires on an
  # origin-absent human-authored entry). This is the kernel's FIRST manifest
  # registration: the ideation-dashboard family was previously registered in
  # contracts/README.md's doc index only, and the delta's realization commit is
  # the release-time registration point the change's task 2.6 fixed (the
  # avatar-client / document-cataloging precedent). Per-file sha256 over the
  # file's bytes. The delegated strict validator
  # (scripts/validate-ideation-dashboard-contracts.py) and the index validator
  # (scripts/validate-ideation-cross-reference.py) are content-addressed by
  # commit; no per-file digest.
