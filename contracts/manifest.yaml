    sha256: c57a2aee5385312192a95d42bca3391961ec3268878ac66ccc34c23cea6ac789
    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      The periodic SINGLE-DOOR ATTESTATION that keeps the ledger's completeness claim honest, comparing each governed runner group's admitted repositories and workflow allowlist against an expected set.
      THE EXPECTED SET IS A PER-GROUP MEMBER and there is no estate-wide twin
      — one set for the estate would report every group as diverging from
      every other group's members. THREE FINDING CLASSES stay apart: a
      WIDENING is a breach; a DARK LANE (an enumerated member with no
      allowlist entry) is ALREADY FAILING CLOSED and is a disposition item;
