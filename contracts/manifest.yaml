  - id: xfactory-workbench-model-catalog
    path: contracts/schemas/xfactory-workbench-model-catalog.schema.yaml
    source_path: openxFactory/contracts/schemas/xfactory-workbench-model-catalog.schema.yaml
    type: schema
    schema_version: 1
    sha256: e563cc9fc6ede03dfd62537935d0ae0842617d7de46702aee6ad9026aa021635
    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      The doxBench approved-model catalog wire envelope
      (add-workbench-integrated-editor-chat 2.1): the GET
      /workbench/model-catalog success body, public allowlist only,
      structurally closed against credentials/endpoints/secret names. An
      empty models array is the successful editor-only posture. The allowlist
      is the SEVEN REQUIRED base fields plus TWO OPTIONAL GROUPS, each absent
      from a producer that predates it: the routing declaration since
      contract-v1.38, and `modalities` since contract-v2.2 (below).
      THE ROUTING DECLARATION is the THREE fields routing_rule, routes_to and
      resolved_model_id, which travel together and are ABSENT from a plain
      entry, so a consumer that reads only the seven stays correct against
      every catalog it could already read. A consumer that offers an `auto`
      entry MUST read all three: routing_rule says the entry is a rule rather
      than a model, resolved_model_id is the model that ANSWERS (and is what
      a turn record's model_id carries), and the entry's own data_handling
      states the posture of every model in routes_to.
      SINCE contract-v2.2 an entry MAY additionally declare `modalities` — the
      input modalities it accepts, from the CLOSED vocabulary whose members are
      exactly `text` and `image`. It is optional and ABSENT from a producer that
      predates it, and its ABSENCE IS NOT A CLAIM IN EITHER DIRECTION: a
      consumer reads an undeclared entry as text-only FOR ROUTING while
      recording that no declaration was made, never as a statement that the
      model rejects images. Where present the set is non-empty, carries no
      repeat, and MUST contain `text`, because a chat turn always carries text.
      THE VOCABULARY IS CLOSED AND EXTENDS ONLY BY THE CHANGE THAT GOVERNS A NEW
      MEMBER — the rule the client-identity roster's admission_surface states —
      so a consumer may treat any other value as a refused catalog rather than
      as a value it must tolerate. Consumed through the pinned openxFactory
      checkout at the contract-v2.2 tag; per-file sha256 verified before any
      copy is treated as current. Catalog rules the shape cannot express —
      routing resolution, the badge covering, the availability and headroom
      rules — are enforced by
      scripts/validate-ideation-dashboard-contracts.py (the family's
      delegated owner), never re-implemented by consumers; the three modality
      refusals are NOT among them, being expressible in the shape and therefore
      enforced by these bytes.
  # WHY THIS ROW'S `consumption_rule` GAINED THE NON-BLANK RULE WITHOUT A
  # RELEASE CUT (issue #263). Read this before editing it again.
  #
  # A DOCUMENTATION-ONLY `consumption_rule` edit does not require a cut:
  #   * `docs/contract-versioning-policy.md`'s change classes — Additive,
  #     Deprecating, Breaking — are all defined over fields, shapes and
  #     vocabulary. Manifest prose is none of them, and there is no editorial
  #     class.
  #   * PRECEDENT EXISTS AND POINTS THE SAME WAY. Of the 23 commits in history
  #     that touch a `consumption_rule`, 13 changed no schema file at all, and
  #     `238369ec` ("Record the subject-overlay contract") is a genuine
  #     documentation-only edit — manifest and CHANGELOG prose, NO schema bytes
  #     and NO new version heading. (An earlier reading of this record claimed
  #     the case had "never happened"; that was wrong, and the verdict it
  #     supported is better supported without it.)
  #   * MECHANICALLY nothing new breaks: `validate-manifest-digests.py` passes
  #     (a `consumption_rule` is prose, not a per-file digest) and the
  #     contract-v1.40 TAG still verifies at its own commit, because release
  #     verification is AT-COMMIT.
  #
  # AND THE v1.40 CHANGELOG ENTRY IS DELIBERATELY NOT EDITED. It says the
  # posture family has "TWO DELEGATED RULES" and that one of them lives in
  # exactly one place. That is now outdated — the non-blank rule is a third —
  # and it stays as written anyway: a CHANGELOG entry is the immutable record
  # of what a release SHIPPED, no release was cut here, and editing it would
  # make it describe a bundle that was never published. The current rule set
  # lives in this row and in `check_context_packet`'s docstring, which are the
  # two places a consumer and an implementer actually read.
  - id: xfactory-workbench-chat-turn
    path: contracts/schemas/xfactory-workbench-chat-turn.schema.yaml
    source_path: openxFactory/contracts/schemas/xfactory-workbench-chat-turn.schema.yaml
    type: schema
    schema_version: 1
    sha256: 350bfedc02696e7281a42c0bdc9a25059bf7af14d16d89d9f07018d3e691dc1d
    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      The doxBench grounded chat-turn wire family
      (add-workbench-integrated-editor-chat 2.1): one file, THREE closed
      envelopes discriminated by kind — the widened v2 request, validated
      success and fixed redacted failure that contract-v1.34 added as a
      co-resident family (add-doxbench-editing-phase-b design D15). The v1
      trio it was co-resident WITH — workbench-chat-turn, -success and
      -failure — was REMOVED at contract-v3.0 (retire-doxbench-chat-turn-v1);
      this row said SIX until that cut. NO contract_schema_version moved
      there and the decision is deliberate: the file's own integer stays 1
      (there is no shape left for a bumped integer to describe once the
      envelopes are gone), this row's schema_version stays 1, and every
      envelope's schema_version const stays 1. The break is carried by the
      bundle version and by this row's sha256.
      Exact-UTF-8 SHA-256 content identity; working_subject is non-identity by
      type; only limit failures carry measured data. The v2 request carries the
      outline plus every LOADED document, DECLARES its bound-buffer key, and its
      record states that key, the per-buffer observed hashes by key, a
      buffer-key proposal target, and the selected-model metadata. SINCE
      contract-v1.40 the v2 RECORD also carries `context_packet` — the POSTURE
      (`full | reduced`) the turn's bounded context packet was assembled under,
      plus that reduction's own reason. A consumer that reports how a turn was
      grounded MUST read it; a consumer that does not may ignore it, exactly as
      before. Its ABSENCE is not a posture claim: it means the producer predates
      contract-v1.40, never that the context was full. The reason is present IFF
      the posture is `reduced` (two schema conditionals, restated in the
      delegated validator). TWO DELEGATED RULES now sit beside that pairing,
      and neither is expressible in the released shape. The reason is LINTED
      for credential and endpoint spellings as public prose. And the reason is
      STATES SOMETHING — it carries at least one character in
      `L* | N* | P* | S*` (a letter, number, punctuation mark or symbol) —
      which `minLength: 1` cannot say, because it counts CHARACTERS and a lone
      space, ZWSP, BOM, bidi override, combining mark or control is one of them
      (issue #263). The rule is stated as what it ADMITS rather than as the
      blank categories it excludes, because an exclusion is a rule over a set
      that GROWS WITH THE UNICODE TABLE: a full code-point sweep found 51
      points where two runtimes on different Unicode versions disagreed, with
      the server accepting what the browser refused. `Cn` is never L/N/P/S in
      any table, so admission is version-stable by construction. The admission
      rule is therefore STRICTLY NARROWER than the blank categories: beyond
      them it also refuses `Co` (private use), `Cn` (unassigned) and `Cs`
      (surrogates) — deliberately, on the same fail-closed ground, since a
      private-use code point renders as tofu for any reader without the font
      that defines it.
      HOW IT IS ENFORCED, per surface, because they differ: the delegated
      validator emits a WARNING (`context-packet-blank`) and still ACCEPTS the
      record, because contract-v1.40 accepted it and
      `docs/contract-versioning-policy.md` makes a new validator warning
      ADDITIVE while a new rejection is BREAKING. THIS ROW ANNOUNCED THAT IT
      "becomes an ERROR at contract-v2.0", AND THAT NARROWING WAS NEVER TAKEN:
      contract-v2.0 shipped 2026-08-27, contract-v3.0 is DECLARED here
      (declared, not published — a bundle is not published until its tag
      exists, and this row is written at the cut), and
      `scripts/validate-ideation-dashboard-contracts.py` still calls
      `f.warn("context-packet-blank", ...)`. The claim is CORRECTED rather than
      carried: the promotion to ERROR is RESTATED to contract-v4.0, ahead of
      the declared bundle, on the same rule that governs a deprecation entry
      reaching its target unexecuted (retire-hermes-flat-keys-and-openworkflow-
      tokens, contract-deprecation-execution: execute at the major it targets,
      or restate with the reason). The reason is that nothing authored it —
      not a measurement that it should not be taken — so a successor may take
      it at that major with no new window owed, the warning having been served
      since contract-v1.40. The shape's own `minLength: 1` is unaffected and
      still applies. This
      repository's runtime REFUSES such a reason at construction, at the record
      derivation and at the browser adopter — a server may hold itself to more
      than the wire requires. A producer conformant by the letter can still
      ship a reduction nobody can read, so consumers MUST NOT treat a
      schema-valid reason as a readable one.
      ONE ASYMMETRY, RECORDED RATHER THAN LEFT TO BE DISCOVERED: a third party
      that VENDORS this runtime — importing `doxbench_packet` or running this
      serve, rather than only validating against the published contract —
      inherits the RESTATED contract-v4.0 strictness today, because the runtime
      gates refuse what the validator merely warns about. That is fail-closed, and it
      sits outside what the versioning policy governs: the policy binds the
      published contract surface, not a consumer's choice to run this
      repository's code. A vendoring consumer should know it is holding itself
      to the NEXT major's rule early.
      SINCE contract-v1.45 the v2 RECORD may also carry `provider_retry` — the
      REDACTED fact that a minted token expired part-way through the turn, was
      re-minted once, and bought ONE further paid provider call, with the
      re-mint's `audit_ref` (add-doxchat-model-intake task 3.6; Brett's ruling
      of 2026-08-26 that a re-mint and its paid retry are VISIBLY RECORDED,
      because a second paid call the human cannot see is the decision that
      ruling was made to avoid). PRESENT ONLY WHEN IT HAPPENED: the object is
      `additionalProperties: false` with `retried` and `at_most_once` both
      `const: true`, so there is no `retried: false` spelling and an absent key
      means "nothing to report, or a producer predating contract-v1.45" — never
      a claim that no retry occurred. It carries NO token, no token prefix or
      hash, no provider status and no provider prose; the `audit_ref` is
      disclosable by construction because the broker's declaration records no
      token material against one. The v1 family was DEPRECATED at
      contract-v1.34 and REMOVED at contract-v3.0; the schema's
      `deprecated_envelopes` block went with it, having no kinds left to name,
      while the validator's READER of that block was deliberately KEPT so the
      next deprecation is not inert. An unrecognized or absent kind is now
      refused in the surviving family's failure envelope carrying
      `unrecognized_turn_kind` where a wire-valid client_turn_id exists, and in
      the pre-identity shape where it does not. A consumer pinned at or below
      contract-v2.5 keeps the v1 bytes its pin names. Migration:
      CHANGELOG § contract-v3.0. Consumed through the pinned
      openxFactory checkout at the declared tag; per-file sha256 verified before
      any copy is treated as current. Hash parity, budget, unknown-model,
      duplicate turn-id, proposal-target, bound-buffer membership,
      context-posture pairing, and failure-pairing rules are enforced by
      scripts/validate-ideation-dashboard-contracts.py, never
      re-implemented by consumers.
