  # ---- avatar-client-lab evidence surface — contract-v1.12 realization (adopt-avatar-client-lab-candidates) ----
  # Canonical openxFactory-owned neutral client-lab evidence artifacts landed by the
  # P-row adoption change: the P1 avatar-state derivation table and the P10
  # capability-scenario register (design D2/D3), the 20 adopted deterministic seeds that
  # close the state-reachability denominator (P7/P8/P11/P12/P13), and the SCO-001-S05
  # successor deferral-discharge register (implement-avatar-client-lab task 4.4, registered
  # here per the release-time manifest convention — the 005/v1.9 pattern: successor registers
  # are content-addressed when the next additive bundle is cut, never mid-change). Per-file
  # sha256 over each file's bytes. Deliberately NOT per-file members: the `.md` prose companions
  # (derivation-table narrative, avatar-client-lab/README.md) and client-acceptance-map.yaml
  # (landed by implement-avatar-client-lab; governed by check_client_lab_acceptance_map, not a
  # per-file digest) — matching the v1.7/v1.11 convention of registering only machine-readable
  # YAML, and the proposal's "+2 artifacts" impact accounting. The reference validators
  # (validate-avatar-client.py, validate-avatar-first-ui.py) are content-addressed by commit;
  # no per-file digest. Consumed by the codexFactory avatar-client-lab app as
  # vendored_evidence_inputs at its contract-v1.12 pin resync.
