    source_path: openxFactory/contracts/signed-execution-chain/digest-construction.schema.yaml
    type: schema
    schema_version: 1
    # MOVED BY `add-chain-anchoring`'s ADDITIVE widening of `digest_subject` by
    # eleven subjects, on this file's own written invitation that a later tranche
    # add its subjects here rather than declare a second construction. A row
    # whose digest no longer matches the schema on disk publishes a promise about
    # bytes nobody shipped, so it moves with the bytes; the VERSION NUMBER and its
    # CHANGELOG entry are the cutting session's act and are not taken here.
    # MOVED AGAIN by the catch-up merge to main (contract-v3.3): the
    # `add-cpc-clearing-boundary` tranche-three `sealed_bundle_manifest` widening
    # landed on main while this branch carried its own eleven-subject widening,
    # so this row's digest reflects the UNION of both widenings, not either one
    # alone.
    sha256: 0dfc2e8ebf47ca4e160173882abac98918ba772cff0fab626a3aab614a1ebf0a
    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      THE ONE DIGEST CONSTRUCTION IN FORCE, `xfc-jcs-sha256-1`, and the digest shape every record in this family takes by `$ref`. This file declares NO RECORD KIND, deliberately: it exists so the family cannot grow a second construction rule beside the first.
      RFC 8785 JSON CANONICALIZATION SCHEME, THEN SHA-256, ALGORITHM-TAGGED —
      chosen against a published standard rather than invented, and BOUNDED
      rather than half-implemented. The admitted value classes are object,
      array, string, INTEGER, boolean and null; a non-integer number is
      REFUSED rather than serialized, as is an integer outside
      ±(2**53 - 1), and an unpaired surrogate in a string or a member name
      is refused as a construction error rather than crashing the caller.
      ECMAScript number serialization is the one part of JCS a second
      implementation reliably gets wrong, and a digest two readers compute
      differently is worse than a digest one of them refuses. EVERY DIGEST
      NAMES ITS OWN SUBJECT: the ratification's CONTENT digest, the CHAIN
      IDENTITY over the signed ratification, and a LEAF digest over a
      leaf's content are three digests over three subjects, and the
      content digest MUST NOT be equated with the chain identity.
      Registered at contract-v2.5; EXTENDED ADDITIVELY at contract-v2.6 by add-chain-attestation (tranche two) — no member the v2.5 bundle published was removed, renamed or narrowed, and the per-file sha256 beside this rule is over the extended bytes; consumed through the pinned
