    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      The clearing DISPATCH LEDGER: one record per cleared dispatch AND per refusal, because a boundary that logs only successes cannot evidence what it stopped.
      DISTINCT FROM `contracts/schemas/dispatch-record.schema.yaml`, which is
      `add-capability-steward`'s dispatch-JUNCTION decision — same English
      word, different subject, different owning capability, different `$id`.
      Carries resolved values BESIDE claimed ones, keeps THREE verification
      classes apart (provider-verified, policy-checked-against-the-register,
      and the origin signature's own outcome), types every lane value as
      DECLARED, requires WORKSPACE DISPOSAL evidence as a field, and names a
