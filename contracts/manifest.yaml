  - id: domain-factory-conformance-validator
    path: scripts/validate-domain-factory.py
    source_path: openxFactory/scripts/validate-domain-factory.py
    type: tool
    schema_version: 1
    intended_consumers:
      - every DomainxFactory CI
      - domain starter generator
      - openxFactory contract release checks
    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      Domain repos must invoke this validator from their pinned openxFactory
      checkout (for example via Makefile target `validate`). Copying the
      validator into a domain repo is a conformance violation; domain repos
      may add domain-specific validators alongside it but not replace it.
