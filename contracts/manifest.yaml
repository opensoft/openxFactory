  # (the openxWallet, client-identity-roster, identity-brokering, trust-anchor
  # and signed-execution-chain precedent). The SIX schemas and the ONE registry
  # instance below carry per-file sha256 over their bytes.
  #
  # THE CORPUS COUNTS ARE MEASURED HERE, NOT INCREMENTED. The second figure read
  # "24" from the contract-v3.3 registration onward while the disk held 26 —
  # the validator's own self-test reported the true number on every run and
  # nobody reconciled the two. It is corrected to the measured value rather than
  # bumped from the written one (`admit-deliberation-clearing-operation` task
  # 2.10, which found it), and the qualifier now says AT LEAST ONE per closed
  # refusal code, because more than one fixture may probe a code and one fixture
  # declares the family's non-member shape refusal `schema`.
  #
  # ENTRY NUMBER TWO AND ITS RETURN SHAPE WERE REGISTERED AT REALIZATION on
  # 2026-09-04 by `admit-deliberation-clearing-operation` (ratified by Brett
  # Heap, PR #645, merged 3cf917b7): the register instance gains the member
  # `deliberation`, its dispatch-record row's refusal enumeration grows from two
  # to five, and `clearing-deliberation-return` is a NEW SEVENTH ROW.
  #
  # NO BUNDLE NUMBER IS RESERVED BY THAT REGISTRATION, and
  # `contract_bundle_version` at the head of this file is NOT moved by it. The
  # next additive number is fresh-counted at the tip the cut is taken from, per
  # docs/contract-versioning-policy.md § Bundle Realization Order, because a
  # change MUST NOT reserve a minor before merge order is known — the same split
  # `add-chain-attestation` (#556 rows, #565 cut) and `add-chain-anchoring` (rows
  # below, cut pending) already use. `contract-v3.4` is held by another lane on
  # the repository owner's word, so the three rows this registration moves say
  # WHO registered them and leave the number to the cutting session.
  #
  # THE REGISTRY INSTANCE IS REGISTERED AS A MEMBER, not left as corpus, because
  # its CONTENT is the contract: the closed set of operations a governed host may
  # be asked to perform. A consumer that verified the schema and not the instance
  # would have verified the shape of a decision without verifying the decision.
  - id: clearing-sealed-bundle-manifest
    path: contracts/clearing/sealed-bundle-manifest.schema.yaml
    source_path: openxFactory/contracts/clearing/sealed-bundle-manifest.schema.yaml
    type: schema
