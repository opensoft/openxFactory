    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      A sample is ONE OBSERVATION carrying raw monotonic markers, derived
      intervals, and the direct-or-brokered reference classification — never a
      percentile, never a budget, and never raw content. The relative-regression
      SLO is evaluated only between samples whose platform, network class and
      region agree.
