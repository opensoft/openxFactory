  # 007-client-identity-roster) ----
  # The packaged corpus (examples/client-identity-roster/, 4 example YAMLs + a
  # README + 31 registered negatives) and the canonical validator
  # (scripts/validate-client-identity-roster.py) are content-addressed by
  # commit; no per-file digest (the consent-instrument and openxWallet
  # precedent).
  - id: client-identity-roster
    path: contracts/schemas/xfactory-client-identity-roster.schema.yaml
    source_path: openxFactory/contracts/schemas/xfactory-client-identity-roster.schema.yaml
    type: schema
    schema_version: 1
    sha256: 298bc37be55e3fa8a69e1ffda3bfad4305e225f650a87294336146ca704cb013
    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      TWO KINDS BEHIND ONE top-level oneOf: the roster FRAGMENT — one client as seen by one owning domain, every governed identity standing in that client's provider tenant keyed on the five-element tuple (domain, admission surface, authority class, blast-radius unit, duty), with verified admission and achieved scope, structural scoping preferred, declared provider-forced breadth, and the fragment-scoped free-token legend — and the report-only DRIFT FINDING that cites an entry when observed state departs from the declaration.
      DECLARED PLACEMENT (FR-020, FR-036): a domain's fragments live at
      credentials/client-identity-roster/<client_ref>.yaml in the domain
      repository — ONE FILE PER (client, domain) PAIR, a DIRECT CHILD of
      that directory and never nested beneath it. That tree sits inside
      the tree scripts/validate-credential-contracts.py already scans
      recursively, and THAT VALIDATOR'S SKIP-WITH-NOTICE OVER THESE
      FILES IS EXPECTED AND BLESSED, not a coverage gap: the canonical
      roster validator (scripts/validate-client-identity-roster.py)
      claims exactly that path, and additionally sweeps the whole target
      repository for this kind so a misplaced fragment is reported
      rather than unseen. The DRIFT kind carries no placement rule in
      this release. Both kinds declare schema_version const 1, which is
      what the per-row schema_version above mirrors — not the schema
      file's contract_schema_version. A placement change is a contract
      change. Registered at contract-v1.32; consumed through the pinned
      openxFactory checkout with per-file sha256 verified before any
      copy is treated as current.
