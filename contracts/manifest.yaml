    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      Consumers embed the register kernel through their pinned openxFactory
      checkout at the contract-v1.14 tag and MUST verify the per-file sha256
      before treating a copy as current. An `origin: ai-derived` entry REQUIRES
      the `derivation` block (worker-run identity + machine
      `disposition: pending_review`); register id uniqueness, the derived-entry
      source-citation rule, the machine-only pending_review disposition, and the
      one-way disposition lifecycle are enforced by
      scripts/validate-ideation-dashboard-contracts.py (the kernel's C3
      delegated owner), never re-implemented by consumers.
  # ---- hermes-domain-overlay contract surface — contract-v1.15 realization (add-hermes-domain-overlay-contract) ----
  # The neutral schema for a domain's seedable Hermes overlay plus the
  # role→path overlay descriptor, replacing the hermes-install seeding
  # runtime's minimal structural check and hard-coded role→path convention.
  # Realization proof: the canonical validator's packaged-example self-test
  # AND codexFactory's live 37-authority hermes/domain/overlay.yaml passing
  # unmodified via the documented-convention fallback. Per-file sha256 over
  # each schema's bytes; the canonical validator
  # (scripts/validate-hermes-domain-overlay.py) is content-addressed by
  # commit; no per-file digest.
  - id: hermes-domain-overlay
