  - id: clearing-deliberation-return
    path: contracts/clearing/deliberation-return.schema.yaml
    source_path: openxFactory/contracts/clearing/deliberation-return.schema.yaml
    type: schema
    schema_version: 1
    sha256: d515082851ee6cb7b3ae83ce1338b5dd8e275a432bea7dfd4c490befbc1b6f3e
    compatibility: canonical_openxfactory_contract
    adapter_owner: openxFactory
    consumption_rule: >-
      The DELIBERATION RETURN — register entry number two's declared output shape: the per-seat outputs as STRUCTURED EVIDENCE, bound to the convening they answer.
      A NEUTRAL SCHEMA AUTHORED HERE AND NEVER A PRODUCER'S PATH (ruling OQ1,
      Brett Heap 2026-09-04): a return is validated against the register's
      DECLARED value and never against a bundle's copy of it, so a declared
