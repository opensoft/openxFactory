schema_version: 1
kind: pinned_contract_manifest

# ============================================================================
# openspec-cli-pin.yaml — content-addressed consumption of the OpenSpec CLI,
# `@fission-ai/openspec`, published by `Fission-AI/OpenSpec`.
#
# openxFactory does not OWN the OpenSpec CLI. It CONSUMES it, and it consumes it
# in the most load-bearing place a tool can sit: `openspec validate --strict` is
# the gate every spec delta in this corpus passes, and `openspec archive` is the
# act that moves a ratified delta into canon. This file is the whole of the
# claim about WHICH TOOL that is, and `scripts/validate-openspec-cli-pin.py` is
# the running code that checks it AND the one entrypoint through which strict
# validation runs.
#
# WHAT THIS PIN REPLACES, AND WHY IT IS NOT A REFINEMENT OF IT. Until this file
# existed, the OpenSpec CLI was UNPINNED fleet-wide. The single pin anywhere in
# the estate was one literal line in this repository's own test workflow —
# `.github/workflows/pytest-suite.yml`, `npm install -g @fission-ai/openspec@1.2.0`
# — installed so `tests/proposal-support/` could drive the real binary. That line
# is not a contract: it is read by no consuming repository, it is not verified
# against anything, and nothing refuses when a different version answers. OpenSpec
# itself offers no project-level version field to lean on — `openspec/config.yaml`
# carries only `schema:`, and `openspec config` is global-scope. So every engineer
# and every agent in every repository has been validating and archiving with
# whatever `openspec` happened to be on PATH.
#
# CORRECTED 2026-09-05: THAT LITERAL LINE IS GONE. The paragraph above describes
# the state this pin was cut against and is kept for that reason, but
# `pytest-suite.yml` now installs through `scripts/install-pinned-openspec-cli.py`,
# which reads THIS file with the verifier's own parser and checks the artifact's
# content address before installing it (#667 task 5.1, #677 task 6.2). The two
# copies had already disagreed by then — this file at `1.12.0`, that literal
# still at `1.2.0` — which is the failure the paragraph above predicts, observed
# rather than argued.
#
# WHY `kind: pinned_contract_manifest` UNCHANGED. The grammar is ratified by
# `neutral-product-pin` and realized twice — `contracts/openxwallet-pin.yaml` and
# `contracts/openreposhape-pin.yaml`. Only the DISTRIBUTION FORM is new, so
# reusing the kind keeps `neutral-product-pin` a statement about direction rather
# than a new shape. The sibling pins' reasoning against a
# `<consumer>_<product>_pin` kind carries here unchanged: that template governs
# DESCENDANTS, and openxFactory is not a descendant of a Node package.
#
# THE TRUSTED REFERENT IS `integrity`, AND `version` IS A LABEL. This is the same
# argument `contracts/openreposhape-pin.yaml` makes for a tag, transposed to a
# registry:
#
#   * `integrity` is a CONTENT ADDRESS. `sha512-oFE2Lj…` is the SHA-512 of the
#     published tarball's exact bytes. It cannot be moved, because moving it
#     would require different bytes and different bytes are a different address.
#     Every one of the package's 389 files is inside those bytes.
#   * `version` is a NAME. That npm refuses to re-publish over a version is a
#     REGISTRY POLICY, enforced by an operator, with an unpublish window and an
#     operator who can act inside it — and a policy is not a content address. It
#     is recorded because humans, CI logs and `npm install` all speak in version
#     numbers, exactly as a release tag is recorded beside a commit in the
#     sibling pin: as a human-readable LABEL, never as the thing being trusted.
#
# So the verifier fetches the tarball, recomputes its SHA-512 and its SHA-1, and
# refuses `pin-integrity-mismatch` unless BOTH equal the values below — BEFORE
# the CLI is installed and BEFORE it is invoked. `neutral-product-pin` requires
# exactly that ordering ("The pin's digests SHALL be verified BEFORE the pinned
# reader is invoked, by running code rather than by a stated obligation"), and it
# is the reason this pin does not simply trust `npx` to resolve a version string.
# A `npx -y @fission-ai/openspec@1.12.0` that fetched the wrong bytes would
# report nothing; a recomputed digest that disagrees refuses.
#
# WHY THERE IS NO `files:` LIST AND NO `pinned_by_commit_only:` LIST, and why
# that is not the omission it looks like. Those two lists exist in the sibling
# pins because a COMMIT is not a digest a consumer can compare a file against:
# the surface has to be enumerated so that "an artifact in neither list is an
# undeclared consumption, not a permitted omission" can be checked at all. A
# published tarball has no such gap. ONE digest covers ALL 389 files, so the
# completeness question the two lists answer is answered here by construction and
# more strongly: there is no file inside the artifact that the referent does not
# address, and no file can be added to it without changing the referent. The
# `## MODIFIED Requirements` delta in
# `openspec/changes/archive/2026-09-09-add-openspec-cli-pin/` states this in the
# grammar's own words rather than leaving this file to assert a licence the
# ratified requirement does not give it.
#
# THE DEPENDENCY CLOSURE, CLOSED 2026-09-08 by
# `pin-openspec-cli-dependency-closure` — the paragraph below used to declare it
# OPEN and is kept as `Was:` history, because the shortfall is the argument for
# the mechanism that closes it and deleting the argument would leave the
# mechanism looking like decoration.
#
# THE REFERENT ADDRESSES THE CLI'S OWN BYTES AND NOTHING BELOW CHANGES THAT.
# What is new is a SECOND referent beside it, over the CLI's dependency tree:
# `lockfile:` names an authored `package-lock.json` committed BESIDE this file,
# `lockfile_integrity:` is a SHA-512 content address over that file's exact
# bytes, and `lockfile_packages:` records how many packages the tree holds. The
# verifier hashes the committed lockfile BEFORE any registry round trip is
# spent, refuses `pin-lockfile-mismatch` on any disagreement, refuses when the
# lockfile's own entry for `@fission-ai/openspec` carries an integrity other
# than the `integrity:` below — so the two halves of this pin cannot name
# different artifacts — and then INSTALLS THROUGH THE LOCKFILE with
# `npm ci --ignore-scripts` in a staging project whose `package.json` is DERIVED
# from the lockfile's own root entry. `npm ci` resolves nothing: every one of the
# 80 packages is the version and the integrity the lockfile records, so two runs
# of this pin install the same tree. The reuse cache is keyed on the lockfile's
# digest as well as the artifact's, because a different tree is a different
# install and must not be served from a directory built for another one.
#
# `--ignore-scripts` STAYS, and its reason narrows rather than disappears. It
# was a MITIGATION of an open shortfall — an unpinned transitive dependency must
# not run a lifecycle script inside a gate. The tree is no longer unpinned, so
# the flag is now defence in depth over a KNOWN tree rather than a guard against
# an unknown one, and it is not weakened on that account: a pinned dependency
# with a hostile install script is still a dependency with an install script.
#
# WHAT THE CLOSURE STILL DOES NOT CLAIM, stated here rather than discovered
# later. (1) TRUST ON FIRST USE. The 79 integrity values in the lockfile were
# recorded from what the registry served when the file was generated; this pin
# asserts that every later install matches THEM, not that they were the right
# bytes on the day they were captured. That is the same trust every lockfile in
# the world rests on, and it is a real limit rather than a formality: the CLI's
# own entry is corroborated by `integrity:` below, and the other 79 are not
# corroborated by anything outside the lockfile. (2) THE REGENERATION
# OBLIGATION. A version bump MUST regenerate this lockfile and re-record
# `lockfile_integrity:` and `lockfile_packages:` in the SAME change that moves
# `version`/`integrity`/`shasum`/`tarball` — they are now five things that move
# together, not four — and the regeneration is `npm install
# --package-lock-only --ignore-scripts` in a staging project whose only
# dependency is `@fission-ai/openspec` at the NEW exact version, with the
# staging `name`/`version` unchanged from the lockfile's current root entry so
# the diff is the tree and not the wrapper. A bump that moves the referent and
# leaves this lockfile behind is refused by the verifier on its first run, which
# is the property that makes the obligation checkable rather than remembered.
# (3) THE ROLLBACK ENTRY IS NOT COVERED, and says so in its own block below.
#
# Was: THE DECLARED SHORTFALL, stated here rather than discovered later, AND
# UNCHANGED BY THE BUMP. The referent addresses the CLI's OWN bytes. It does not
# address the CLI's DEPENDENCY CLOSURE: `@fission-ai/openspec@1.12.0` declares
# TEN runtime dependencies, NINE of them at caret ranges (`ora ^9.4.1`,
# `zod ^4.4.3`, `yaml ^2.8.3`, `diff ^9.0.0`, `chalk ^5.6.2`,
# `commander ^14.0.0`, `fast-glob ^3.3.3`, `@inquirer/core ^11.2.1`,
# `@inquirer/prompts ^8.5.2`) and ONE exact (`cross-spawn 7.0.6`), and npm
# resolves those ranges at install time. `1.2.0` declared nine, all caret; the
# shortfall is the same shortfall and it is one dependency wider. Two installs
# of these identical, verified bytes may therefore run over different dependency
# trees. This pin does NOT claim otherwise. What it claims — and checks — is
# that the ADJUDICATING TOOL is the artifact whose digest is below, which is the
# thing that was previously not claimed at all. Closing the dependency closure
# needs a lockfile the publisher does not ship and is named as successor work in
# the change that lands this file, not quietly implied by it. The verifier
# installs with `--ignore-scripts` so that an unpinned transitive dependency
# cannot run a lifecycle script inside a gate; that is a mitigation of the
# shortfall and not a repair of it.
#
# THIS PIN BUMPS THE VERSION, AND THE EVIDENCE IS IN THE CHANGE THAT BUMPS IT.
# The pin was cut at 1.2.0 (#667) because that is where the estate was GREEN:
# measured 2026-09-04, the same trees that were clean at 1.2.0 failed under
# 1.12.0 on PRE-EXISTING conditions — openxFactory 48 passed / 41 failed of 89,
# OpsxFactory 34 / 10 of 44 — and the change that cut it named the bump as
# later, separate, human-only work that must land its target-version evidence
# with it. That readiness work is now done (#673 here, #220 in OpsxFactory) and
# this is that bump. Re-measured 2026-09-05: OpsxFactory reads 46 passed /
# 0 failed at 1.12.0, and openxFactory reads 88 passed / 2 failed of 90 — the
# two remaining being the two openxFactory-scoped DISPOSITIONS below and nothing
# else.
#
# THE DISPOSITIONS, AND WHY THIS PIN CARRIES A DISPOSITION MECHANISM AT ALL.
# A pinned tool is a foreign judgment about a local corpus, and the two can
# genuinely disagree. 1.12.0 added a scenario-currency check that is BLIND to
# this estate's reserved narrowing marker,
# ``**Merged into `<destination>` by <change-id> (<date>):**``, and therefore
# re-reports as ERRORs two deliberate, declared, ratified narrowings — one of
# which `doc-health`'s own promoted marker requirement uses, byte for byte, as
# its WORKED EXAMPLE (openspec/specs/doc-health/spec.md:1770). The only edit
# that would satisfy the check is to restore the old scenario titles, which
# reinstates the permission council LA-A1 was raised to close and contradicts a
# sibling scenario landed by #444. That is not a defect to fix; it is an
# exception to ACCEPT, in writing, with a citation. #673's record named three
# honest exits — sequence the bump after both changes archive, carry a
# dispositioned exception, or take it upstream. Brett Heap ruled on 2026-09-05:
# "take exit 2". `dispositions:` below is that ruling, made checkable.
#
# AND THEN THE SAME DISAGREEMENT ARRIVED FROM A CONSUMING REPOSITORY, WHICH IS
# WHY THE LIST WENT FROM TWO TO FOUR. codexFactory ran this entrypoint over its
# own tree on 2026-09-05 and read `Totals: 23 passed, 2 failed (25 items)` — its
# readiness packet (codexFactory PR #216, `prepare-openspec-1.12-readiness`)
# cleared everything clearable and CONVERTED one block's `Removed from canon`
# marker to `Merged into`, the instrument canon reserves for a retitle
# (openspec/specs/doc-health/spec.md:1750, "That shape is a retitle, whatever the
# marker calls it"). What survived is the identical marker-blindness, twice more,
# against two of Brett's own `Status: draft` changes. Brett Heap ruled the same
# exit for that pair on 2026-09-05 — "use recommended name, go on 3 repo shape" —
# and `disposition-codexfactory-declared-renames` is the change that writes it
# here. THE ENTRIES ARE GROUPED BY REPOSITORY AND THE GROUPS NEVER MIX: `repo:`
# scopes each, and a run over either tree neither applies nor stales the other's,
# which is the property that lets ONE pin file govern a fleet at all.
#
# AND THEN A THIRD TIME, FROM THE SAME CONSUMING REPOSITORY, RAISED BY AN ARCHIVE
# RATHER THAN BY A READINESS SWEEP — WHICH IS WHY codexFactory NOW CARRIES THREE
# AND NOT TWO. codeXfactory/codexFactory PR #318 archived
# `add-floor-regeneration-automation` on 2026-09-10 and PROMOTED its requirement
# "An automated floor regeneration only ever proposes" into that repository's
# `openspec/specs/repository-gate-floor/spec.md`, carrying canon's scenario "The
# human gate is unchanged" in with it — and the ratified, still-ACTIVE
# `relocate-review-authority-floor` holds a `## MODIFIED` block for that same
# requirement which RETITLES the scenario to "The human gate is whatever the
# document's path routes to". So a PROMOTION is what made a declared retitle
# visible to the check: nothing in either change moved, and the finding appeared
# because canon caught up. Measured on #318's tree at head `32743fb7`:
# `Totals: 26 passed, 3 failed (29 items)`. Brett Heap ruled the same exit a
# third time on 2026-09-10 — "go A, ratify the disposition entry as encoded" —
# and `disposition-codexfactory-floor-relocation-retitle` is the change that
# writes it here.
#
# AND THEN A FOURTH AND FIFTH TIME, FROM THE SAME CONSUMING REPOSITORY, RAISED BY
# THE ARCHIVE OF THE VERY CHANGE ONE ENTRY OF THIS LIST USED TO DISPOSE — AND
# THESE TWO ARE NOT MARKER-BLINDNESS AT ALL, WHICH IS WHY THIS LIST IS NO LONGER
# ONE DISAGREEMENT REPEATED. codeXfactory/codexFactory PR #434 archives
# `add-regular-pr-council-clearance` on 2026-09-11, and that archive does two
# things at once. It RETIRES this list's `add-regular-pr-council-clearance` entry,
# which is EXACTLY the event that entry's own `retires_when:` named in those
# words — the mechanism working rather than a defect. And it PROMOTES the retitle
# that entry was granted for into
# `openspec/specs/merge-master-approval/spec.md`, replacing canon's single
# scenario "A human-authored pull request is never auto-approved" with "A
# human-authored pull request is never approved by tier 1 alone" and "A
# gate-integrity path is never approved autonomously". TWO still-ACTIVE changes —
# `extend-merge-master-envelope-to-floor-bot-lanes` and
# `relocate-review-authority-floor` — hold their own `## MODIFIED` block for that
# same requirement, each written against PRE-ARCHIVE canon and each carrying NO
# reserved marker, because neither performed the retitle and neither has anything
# to declare: canon simply moved underneath them. Measured on #434's head
# `87ea247f`: `Totals: 33 passed, 3 failed (36 items)`, the surviving pair
# APPLIED and `REFUSE pin-disposition-stale` on the archived entry (exit 2); with
# that entry deleted and nothing added, exit 1 with exactly those two
# UNDISPOSITIONED; with both added, exit 0. Brett Heap ruled the ORDERING on
# 2026-09-11 — "This change first" — so each sibling delta re-derives against the
# archived canon before its own archive, and
# `disposition-codexfactory-regular-pr-council-clearance-archive` is the change
# that writes both halves here. THAT ORDERING RULING IS NOT WHAT GRANTS THESE TWO
# ENTRIES, and the difference is recorded rather than blurred: its own record says
# it is "recorded for provenance and NOT disposed by this section", so it decides
# which packet re-derives when and nothing about this file. The ENTRIES are
# granted by a SECOND, LATER word given on exactly that question — Brett Heap,
# 2026-09-12T03:04:29.167Z, "ratified_by — ratify the entries as encoded" — which
# is why they carry `ratified_by:`, the stronger of the two authorities this pin
# admits, and not the `recorded_by:` an earlier draft of them reached for.
#
# THE DISPOSITIONS ARE UPGRADE-COUPLED AND STALE-REFUSED, which is what keeps
# them from becoming a suppression list.
#
#   * UPGRADE-COUPLED. They are enumerated against THIS version's findings, in
#     the tool's own message text, matched whole. A later CLI that rewords the
#     message, or drops the check, matches nothing — so every bump RE-DERIVES
#     the list rather than inheriting it. There is deliberately no pattern, no
#     wildcard and no family-level suppression: an exception covers one finding
#     in one delta of one change in one repository, and a second finding needs
#     a second reading by a human.
#   * STALE-REFUSED. A disposition whose finding NO LONGER OCCURS makes the run
#     REFUSE (`pin-disposition-stale`, exit 2) rather than pass. The asymmetry
#     with an undispositioned finding (exit 1) is deliberate and is argued in
#     scripts/validate-openspec-cli-pin.py: an unmatched FINDING is a statement
#     about the deltas, an unmatched DISPOSITION is a statement about this file.
#     `add-composed-view-authoring` has ONE open task left and archives the
#     moment a human takes it; on that day its finding vanishes from every run
#     and this pin must fail until its entry is deleted, so that the archive
#     itself is the event that forces the re-reading. ONLY A WHOLE-CORPUS
#     (`--all`) RUN DECIDES THIS: a `--change <id>` run legitimately never
#     opens the items it was not asked about, so it applies its dispositions,
#     decides no staleness, and says in its output that it checked none.
#   * SCOPED BY REPOSITORY, because one pin governs the whole estate and this
#     entrypoint is invoked with `--repo` against consuming trees that carry
#     none of openxFactory's changes. Without `repo:`, a change absent because
#     it was never here would be indistinguishable from a change absent because
#     it archived — and only the second may refuse.
#
# A DISPOSITION WITHOUT A CITATION IS REFUSED, not ignored. `cited_to:` is
# required and must be non-empty, and one of `ratified_by:`/`recorded_by:` must
# name who granted it. An uncited exception is the thing this estate refuses
# everywhere else it appears — `doc-health`'s uncited-resolution rule, the
# required `cite` in the aggregation's `health/dispositions.yaml` — and it is
# refused here in the same words.
# ============================================================================

package: "@fission-ai/openspec"
source_repository: Fission-AI/OpenSpec
source_url: https://github.com/Fission-AI/OpenSpec
registry: https://registry.npmjs.org

# THE LABEL. Recorded so a human, a log line and an `npm install` can all name
# the same artifact; never the referent. See the header.
version: "1.12.0"

# THE REFERENT, and the kind that says so. `package_integrity` is the
# content-addressed distribution-artifact referent the accompanying MODIFIED
# delta admits into `neutral-product-pin`'s grammar beside `commit`; a pin
# declaring anything else — or declaring a range, a dist-tag such as `latest`,
# or a caret — is refused `pin-tag-only` by the verifier before any byte is
# fetched.
revision_kind: package_integrity
integrity_algorithm: sha512
integrity: "sha512-oFE2Lj7WVSc87nSibk6qe9HjHIOlxhcPAXbPey44DlLvJzBl5+9BZVrNiozOwv++CQhW+MG0kuP1XLZ/uQrrWw=="

# The registry's LEGACY address for the same bytes, checked as well as — never
# instead of — the SHA-512. It is recorded because it is what `npm view … dist`
# and the npm CLI's own output print beside the integrity, so a human comparing
# this file to a terminal has both halves; and it is CHECKED because a pin that
# records a value nothing verifies invites the value to drift into being wrong
# without anyone noticing. SHA-1 is not relied on for collision resistance: the
# SHA-512 is the referent and this is corroboration.
shasum: "c844543999f673cdd72445879b86a4abea4c07ef"
tarball: https://registry.npmjs.org/@fission-ai/openspec/-/openspec-1.12.0.tgz

# THE SECOND REFERENT: THE DEPENDENCY CLOSURE, addressed the way the artifact is.
# `lockfile:` is a BARE NAME and not a path, deliberately — it resolves BESIDE
# this file and nowhere else, so a lockfile cannot wander into another directory
# and no traversal is admitted by the resolution. The committed file therefore
# lives at `contracts/openspec-cli-pin.1.12.0.package-lock.json`: under
# `contracts/` with the pin it belongs to, NAMED for the pin AND for the version
# it locks, so a bump adds a file rather than silently rewriting the one the
# previous referent was installed through, and a reader can see at a glance
# which version a lockfile in the tree belongs to.
#
# `lockfile_integrity:` is npm's own `sha512-<base64>` form over the file's exact
# bytes — the same vocabulary `integrity:` above uses, because it is the same
# kind of claim about a different file. `lockfile_packages:` is the corroborating
# human-readable half, on exactly the terms `shasum:` is corroboration for
# `integrity:`: it is recorded because a reviewer reads a count and not a digest,
# and it is CHECKED because a recorded value nothing verifies drifts into being
# wrong without anyone noticing.
lockfile: openspec-cli-pin.1.12.0.package-lock.json
lockfile_integrity: "sha512-aw5lIN45tQq2WZlltd+NtSaxP9Vg3TrFGP3reqI+3bDoE0YZjW+dPIVgdxQLE+Yn0nqwEequaC3+6ff5nkCORA=="
lockfile_packages: "80"

# THE PREVIOUS REFERENT, RECORDED AS THE ROLLBACK — in the grammar's own terms
# and not as prose, because a rollback written as a sentence is a rollback
# somebody has to re-derive under pressure. These are the exact fields this file
# carried until 2026-09-05, and restoring the pin means moving them back up:
# `version`, `integrity`, `shasum` and `tarball` together, never one of them.
# THE MECHANISM SURVIVES THE ROLLBACK: `1.2.0` and `1.12.0` emit the SAME
# machine-readable report shape (verified by running both), so a pin returned to
# `1.2.0` still parses. Its `dispositions:` list, however, does NOT survive: the
# six entries below exist only because 1.12.0 raises those findings and 1.2.0
# does not, so a rollback that kept them would refuse `pin-disposition-stale` on
# its first run — on EVERY tree, since a rollback un-raises the findings in both
# repositories at once. A rollback deletes the dispositions with the version.
rollback:
  - version: "1.2.0"
    integrity: "sha512-2XDmPZcVY0Bs014lP9aoxe3VoEU8hFvqaBFxQaiJO2nhC8vTKCyo6sT/5YpQcOTfR/a64Hht2anTyqLR4eNhlg=="
    shasum: "0fd5333520c8846f0ac51727379b8812e2f13c1b"
    tarball: https://registry.npmjs.org/@fission-ai/openspec/-/openspec-1.2.0.tgz
    pinned_by: add-openspec-cli-pin
    superseded_on: "2026-09-05"
    superseded_by: bump-openspec-cli-pin-to-1.12
    drop_dispositions_on_rollback: "true"
    dependency_closure: >-
      UNCOVERED, DELIBERATELY, AND A ROLLBACK AUTHORS ITS OWN. No lockfile is
      committed for `1.2.0` and none is generated speculatively, because a
      lockfile generated TODAY would record the versions the caret ranges
      resolve to TODAY — a fiction of reproducibility dressed as a record of
      one — and nothing would ever install through it, so its correctness
      would be checked by no run and would rot in place. The rollback therefore
      moves FIVE things and not four: `version`, `integrity`, `shasum`,
      `tarball` AND a regenerated lockfile with its `lockfile_integrity:` and
      `lockfile_packages:` re-recorded. Until that lockfile is authored, a pin
      returned to `1.2.0` is REFUSED by the verifier on its first run rather
      than installed unlocked — which is the fail-closed answer, and is why
      this field states the gap instead of leaving it to be met at the worst
      possible moment.

# The executable the package installs, asserted by name so a repointed `bin`
# block in some future version is a refusal rather than a silent substitution.
binary: openspec

# NAMED here so the pin is running code rather than an obligation stated in
# prose, matching both sibling pins' own `verify_pin:` key. This file is the
# unusual case in which the verifier is ALSO the consumer entrypoint — see
# `consumer_entrypoint:` below — so the same path appears twice on purpose.
verify_pin: scripts/validate-openspec-cli-pin.py

# THE CONSUMER OBLIGATION, in one field, because it is the whole point of the
# pin. Every repository in the estate runs STRICT OpenSpec validation through
# this entrypoint and through nothing else. A repository that calls a bare
# `openspec` binary is not running the pinned tool, whatever version happens to
# answer, because nothing verified which tool answered. The entrypoint refuses
# when the pinned bytes cannot be verified, refuses when it is given no scan
# target, and — in the PATH mode a developer may ask for — refuses when the
# binary on PATH reports a version other than the one above.
#
# THE TWO GOVERNED ACTS ARE REACHED BY TWO COMMANDS, NOT ONE. This entrypoint
# VALIDATES and has no archive verb — `archive <id>` is rejected as an
# unrecognized argument. The OpenSpec ARCHIVE act runs through
# `scripts/proposal-support.py <root> archive <change-id>` in the SAME pinned
# checkout, which imports this entrypoint's own resolver and verifies the
# artifact's content address before invoking the resolved binary — never an
# ambient `openspec`.
consumer_entrypoint: scripts/validate-openspec-cli-pin.py

# The invocation the entrypoint issues, recorded so that WHICH COMMAND RAN is a
# fact in this file rather than an assumption about a wrapper. `--strict` is not
# optional and the entrypoint offers no flag to drop it: a non-strict pass is not
# the act this pin governs.
pinned_invocation: openspec validate <target> --strict

# Where a stale pin is re-cut. The runbook is this repository's own contract
# versioning policy for the class of act, and the change that lands the bump for
# the act itself; both are named because the refusal trailer names them and a
# refusal that names a document nobody wrote is worse than one that names none.
resync_runbook: docs/contract-versioning-policy.md

# THE ENUMERATED DISPOSITIONS. Read the header block above before adding one.
#
# Each entry ACCEPTS exactly one ERROR-level finding, in one delta path, of one
# item, in one repository, at THIS pinned version. The verifier matches on the
# tuple (`repo`, `item`, `path`, `finding`) with the finding text compared WHOLE
# after whitespace normalization — no prefix, no pattern, no family. It refuses
# `pin-disposition-malformed` when `cited_to:` is empty or absent, when no
# `ratified_by:`/`recorded_by:` names an authority, or when two entries would
# cover the same finding; and it refuses `pin-disposition-stale` when a declared
