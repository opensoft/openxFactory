# openRepoShape #164 (`1a9fc537`, squash-merged 2026-10-06T22:52:05Z), the
# realization of this repository's `prefer-triad-project-shape` task 5.2, and
# what this advance is FOR: the
# Triad named the PREFERRED project shape in the standard's own README,
# AGENTS.md, `AGENTS-shape.md` and `project.yaml` posture comment; the advisory
# said once by `scaffold-project.py`, `adopt-project.py` and `shape-doctor.py`
# out of `scripts/shape_advisory.py`, never blocking and never changing an exit
# status; and the optional staying-single record, its schema
# `contracts/single-repository-record.yaml` and its template
# `templates/single-repository/single-repository.yaml`. It lands fifty-seven
# commits on from the pin this file previously carried, every one a squash
# merge, and the pin cannot skip a commit, so this advance also carries the
# fifty-six before it — the standard growing from a scaffolder into a toolset:
# the native Windows flow `setup-project.py`, with `setup.sh` reduced to a shim
# over it, a rehearsal that creates nothing, and a preflight that offers what is
# missing (#53, #56, #57, #60, #62); `.gitattributes` in the templates and at
# the root, so a clone sees the bytes a pin describes (#58, #65); the one
# compliance command, `openRepoShape --doctor` and `shape-doctor.py` (#96), its
# `placement` row (#99) and the corrections after it (#102, #106, #107, #108,
# #110, #147, #159); the family workstation layout, `--family` and
# `templates/family-root/scripts/siblings.py` (#78, #79, #80); the sixth
# naming form, `<user>-wip`, and `templates/workspace-root/` (#86, #88,
# #154); `docs/cli.md`, generated by `scripts/render-cli-reference.py` (#97),
# and `docs/handbook.html` (#71, #90); a repeatable `--trailer` on every
# pin-moving tool (#112, #151); `update-shape` moving the README's `Shape:`
# line with the pin, and `--accept-local` (#152, #85); one definition of "the
# same repository" (#156, #160); `park` and `resume`, which arrived and then
# moved to opensoft/openRepoTools (#83, #93, #92); the SonarCloud
# maintainability and test-hygiene passes, behaviour unchanged (#116, #117,
# #120, #121, #124, #125, #128, #129, #131, #139-#145); the README and
# docstring passes (#67, #70, #73, #161); the optional MedxEHR clone variable
# (#64); and the fetching shim's trap fix (#75). Exactly 40 hex characters.
#
# The commit this pin previously carried,
# `e9c4827b85f50503bbdd9e5b4fac9d6c3d0baf63` (#700, 2026-09-05), the one before
# it, `122d729bc0c2f2e0ded0bb61b6b97f49512f613e` (#650, 2026-09-04), and the
# ratification commit before both, `deacbdcce4f52af427bcb4edd075fcc992e3dabe`
# (PR #4, `Naming: a descendant form is a claim that needs a pin`), are
# HISTORICAL facts and none of them moves with this bump: `deacbdcc` stays the
# commit `add-project-repo-schema` was ratified against and the one the
# MedxScribe pilot run was made against.
commit: "1a9fc537bcce37301c85fc108fabd8a599b02000"
revision_kind: commit

digest_algorithm: sha256

# NAMED here so the pin is running code rather than an obligation stated in
# prose, matching the sibling pin's own `verify_pin:` key.
verify_pin: scripts/validate-openreposhape-pin.py

# The doctrine this pin serves. openxFactory ratifies the DOCTRINE and pins the
# MECHANICS; the split is the whole point of the standard being a separate
# product, and naming the document here keeps the two halves findable from each
# other.
doctrine: docs/project-repo-schema.md

