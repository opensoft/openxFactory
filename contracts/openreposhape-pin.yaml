schema_version: 1
kind: pinned_contract_manifest

# ============================================================================
# openreposhape-pin.yaml — content-addressed consumption of opensoft/openRepoShape.
#
# openxFactory does not OWN the project repository schema's mechanics; it
# RATIFIES the doctrine (`docs/project-repo-schema.md`) and CONSUMES the
# mechanics at a commit and a set of digests. This file is the whole of that
# claim, and `scripts/validate-openreposhape-pin.py` is the running code that
# checks it.
#
# WHY `kind: pinned_contract_manifest` UNCHANGED. The grammar is ratified by
# `neutral-product-pin` and realized twice already — `contracts/openxwallet-pin.yaml`
# here, and openRepoShape's own assembly-root templates. Only the PRODUCT is new,
# so reusing the kind keeps `neutral-product-pin` a statement about direction
# rather than a new shape. A new kind was REJECTED for the same reason the wallet
# pin rejected one: the `<consumer>_<product>_pin` template governs DESCENDANTS,
# and openxFactory is not a descendant of the shape standard.
#
# WHY THERE IS NO `submodule_path:` AND NO GITLINK. openxFactory CITES this
# standard; it does not MOUNT it. Nothing in this repository runs out of an
# openRepoShape checkout — the doctrine is ratified here and the mechanics run in
# the projects that fork the standard — so a gitlink would put a working-tree
# obligation on every clone of this repository in exchange for nothing. The
# verifier therefore resolves bytes from a checkout the caller supplies
# (`--checkout`) or from the host API (`--from-gh`), and REFUSES rather than
# passing when it can resolve neither. An unanswerable question is never an
# implicit pass.
#
# THE TRUSTED REFERENT IS `commit` PLUS THE THIRTY-ONE `sha256`s.
# `revision_kind: commit` is declared and a tag-only pin is REFUSED
# (`pin-tag-only`). No tag is recorded beside the commit today because
# openRepoShape has cut none; when it does, a tag may be recorded as a LABEL and
# never as the referent — a movable name is not a compatibility pin.
#
# THE TWO LISTS COVER THE WHOLE SURFACE, and that is an obligation rather than a
# courtesy. `neutral-product-pin`'s own scenario says an artifact appearing in
# neither list "is an undeclared consumption, not a permitted omission", so the
# thirty-one digested members below plus the forty-five
# `pinned_by_commit_only:` members are exactly the 76 files present at `commit`.
# The verifier asserts that completeness against the resolved tree; a file at the
# pinned commit that neither list names is `pin-surface-undeclared`.
#
# WHICH THIRTY-ONE, AND WHY THOSE. They are the standard's NORMATIVE SURFACE —
# the artifacts a reader of the ratified doctrine must be able to hold
# openxFactory to: the two policy data files (the naming policy, and the path
# classification an adoption plan proposes a split with), the seven contract and
# manifest templates of the assembly root and of the family holder, the seven
# tools that CREATE or UPDATE a root (`scaffold-project.py` for a new project,
# `adopt-project.py` for an existing repository taken in place, `update-shape.py`
# for a root re-syncing its copied shape files and re-pinning, `scripts/bump-leg.py`
# for a root advancing ONE leg's gitlink, pin and workflow refs in one lockstep
# commit, the `openRepoShape` command that installs itself and runs `setup.sh`,
# `setup.sh` and `bootstrap`), the ten shipped validators and the libraries they
# run out of, the two `AGENTS-shape.md` files the shape COPIES VERBATIM into every
# root it materializes and DIGEST-PINS there, the agent instruction file, the
# README that states the doctrine in the standard's own words, and the LICENCE the
# convener ruled. The forty-five path-only members are the standard's own tests,
# its CI and the CI it ships inside each template, the ignore files, the
# `CLAUDE.md` that says only "Read AGENTS.md.", the template READMEs and Makefiles
# and the per-root `AGENTS.md`/`CLAUDE.md` the shape RENDERS rather than pins, and
# the leg skeletons — content the commit addresses and this repository makes no
# byte-level claim about.
#
# THE RULE DECIDED EVERY NEW FILE, AND NOTHING MOVED LIST. `e9c4827b` carries 16
# files `122d729b` did not, and each was classified by the paragraph above rather
# than by which pull request it arrived in. FOUR are digested: the top-level
# `openRepoShape` command and `scripts/bump-leg.py` are tools that create or
# update a root, exactly as `setup.sh` and `update-shape.py` already were; and
# `templates/assembly-root/AGENTS-shape.md` and
# `templates/family-root/AGENTS-shape.md` are digested because the standard
# itself digests them — `scripts/shape_materialize.py` lists both under
# `COPIED_VERBATIM`/`FAMILY_COPIED_VERBATIM` and writes their `sha256` into each
# project's `contracts/shape-pin.yaml`, because a pin that left AGENTS-shape.md
# undigested would let the very file that tells every project never to
# hand-edit a pinned file drift out from under this pin without the pin ever
# noticing. TWELVE are path-only: the eight `AGENTS.md` and
# `CLAUDE.md` stubs under `templates/` are RENDERED per project and explicitly
# not pinned by the shape ("The shape wrote the block above once and does not
# pin this file"), which puts them where `templates/assembly-root/README.md`
# already is; and `tests/test_bump_leg.py`,
# `tests/test_openreposhape_command.py`, `tests/test_reference_default.py` and
# `tests/test_update_shape_add.py` are the standard's own tests, where every
# `tests/` member already is. Every one of the 60 members declared at
# `122d729b` is still present at `e9c4827b` and still in the list it was in;
# nothing was removed or renamed upstream, and only 13 of the 27 digests moved,
# because only those bytes moved.
# ============================================================================

# ============================================================================
# ADDENDUM (issue #775, direct fix `register-sibling-consumption-pins`):
# MEASURED AND NOT REGISTERED. Issue #775 named this pin beside its
# `openxwallet-pin.yaml` sibling and required `neutral-product-pin`'s
# predicate — "wherever any repository other than openxFactory is expected
# to read it" — to be MEASURED per pin rather than assumed for both. The two
# answer DIFFERENTLY. This pin's own paragraph above already gives the
# reason: openxFactory CITES the standard rather than mounting it, so there
# is no gitlink for another checkout to compare against in the first place.
# Beyond that: the ratified `project-repo-schema` requirement "The standard
# lives in `opensoft/openRepoShape`, is consumed by fork, and openxFactory
# pins it by commit and digest" states in its own scenario that an
# organisation electing the schema "depends on no artifact of this family at
# run time" — every other adopter forks `opensoft/openRepoShape` directly,
# never through this pin (confirmed live: `opensoft/openRepoTools` carries
# its own independent `contracts/openreposhape-pin.yaml`, whose own header
# states it is NOT compared to openxFactory's); `openreposhape-pin-gate.yml`
# is openxFactory's own NON-required `pull_request` gate, carries no
# `workflow_call` trigger and is invoked by no other repository; and
# `scripts/validate-openreposhape-pin.py` has no aggregation-comparison mode
# analogous to `verify-openxwallet-pin.py`'s `verify_aggregation()`. This
# pin is therefore NOT registered in `contracts/manifest.yaml` or indexed as
# a contract member in `contracts/README.md` — it carries a documentation-only
# README row recording this same negative finding instead, so an absent
# registration reads as MEASURED rather than as an oversight indistinguishable
# from one the register simply never declared.
# ============================================================================

source_repository: opensoft/openRepoShape
source_url: https://github.com/opensoft/openRepoShape

# openRepoShape at `main`, 2026-09-05, ten commits on from the pin this file
# previously carried. Two of them are what this bump is FOR, and both close
# refusals openxFactory itself hit: #45 (`5ffa8d58`, a NEUTRAL PRODUCT may elect
# the shape and be its own assembly root — `openDox` and `openXdox` were refused
# `naming-role-mismatch` before it) and #42 (`c2cc9e25`, a descendant's referent
# may be reached through a DECLARED PIN CHAIN rather than in one hop). The other
# eight are the standard maturing around them: the `openRepoShape` command and
# `setup.sh` cloning where you stand (#37), `scripts/bump-leg.py` (#35), the
# pinned `AGENTS-shape.md` pair and the pointer stubs (#30), `update-shape`
# reporting and taking upstream-ADDED files (#29), the election-date default for
# `reference:` (#27), the README quick start (#46), and two `update-shape` apply
# corrections (#47, #52). Exactly 40 hex characters.
#
# The commit this pin previously carried,
# `122d729bc0c2f2e0ded0bb61b6b97f49512f613e` (#650, 2026-09-04), and the
# ratification commit before it, `deacbdcce4f52af427bcb4edd075fcc992e3dabe`
# (PR #4, `Naming: a descendant form is a claim that needs a pin`), are both
# HISTORICAL facts and neither moves with this bump: `deacbdcc` stays the commit
# `add-project-repo-schema` was ratified against and the one the MedxScribe pilot
# run was made against.
commit: "e9c4827b85f50503bbdd9e5b4fac9d6c3d0baf63"
revision_kind: commit

digest_algorithm: sha256

# NAMED here so the pin is running code rather than an obligation stated in
# prose, matching the sibling pin's own `verify_pin:` key.
verify_pin: scripts/validate-openreposhape-pin.py

# The doctrine this pin serves. openxFactory ratifies the DOCTRINE and pins the
# MECHANICS; the split is the whole point of the standard being a separate
# product, and naming the document here keeps the two halves findable from each
# other.
doctrine: docs/project-repo-schema.md

