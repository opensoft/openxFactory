# THE EIGHTEEN PATH-ONLY MEMBERS. Presence is checked; identity comes from the
# commit. Naming them is what makes the surface COMPLETE rather than partially
# declared — see the header note on `pin-surface-undeclared`.
pinned_by_commit_only:
