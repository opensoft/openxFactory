# ============================================================================
# openreposhape-pin.yaml — content-addressed consumption of opensoft/openRepoShape.
#
# openxFactory does not OWN the project repository schema's mechanics; it
# RATIFIES the doctrine (`docs/project-repo-schema.md`) and CONSUMES the
# mechanics at a commit and a set of digests. This file is the whole of that
# claim, and `scripts/validate-openreposhape-pin.py` is the running code that
# checks it.
#
# WHY `kind: pinned_contract_manifest` UNCHANGED. The grammar is ratified by
# `neutral-product-pin` and realized twice already — `contracts/openxwallet-pin.yaml`
# here, and openRepoShape's own assembly-root templates. Only the PRODUCT is new,
# so reusing the kind keeps `neutral-product-pin` a statement about direction
# rather than a new shape. A new kind was REJECTED for the same reason the wallet
# pin rejected one: the `<consumer>_<product>_pin` template governs DESCENDANTS,
# and openxFactory is not a descendant of the shape standard.
#
# WHY THERE IS NO `submodule_path:` AND NO GITLINK. openxFactory CITES this
# standard; it does not MOUNT it. Nothing in this repository runs out of an
# openRepoShape checkout — the doctrine is ratified here and the mechanics run in
# the projects that fork the standard — so a gitlink would put a working-tree
# obligation on every clone of this repository in exchange for nothing. The
# verifier therefore resolves bytes from a checkout the caller supplies
# (`--checkout`) or from the host API (`--from-gh`), and REFUSES rather than
# passing when it can resolve neither. An unanswerable question is never an
# implicit pass.
#
# THE TRUSTED REFERENT IS `commit` PLUS THE THIRTY-SEVEN `sha256`s.
# `revision_kind: commit` is declared and a tag-only pin is REFUSED
# (`pin-tag-only`). No tag is recorded beside the commit today because
# openRepoShape has cut none; when it does, a tag may be recorded as a LABEL and
# never as the referent — a movable name is not a compatibility pin.
#
# THE TWO LISTS COVER THE WHOLE SURFACE, and that is an obligation rather than a
# courtesy. `neutral-product-pin`'s own scenario says an artifact appearing in
# neither list "is an undeclared consumption, not a permitted omission", so the
# thirty-seven digested members below plus the sixty-seven
# `pinned_by_commit_only:` members are exactly the 104 files present at `commit`.
# The verifier asserts that completeness against the resolved tree; a file at the
# pinned commit that neither list names is `pin-surface-undeclared`.
#
# WHICH THIRTY-SEVEN, AND WHY THOSE. They are the standard's NORMATIVE SURFACE —
# the artifacts a reader of the ratified doctrine must be able to hold
# openxFactory to: the three policy and schema data files (the naming policy,
# the path classification an adoption plan proposes a split with, and the
# schema of the optional staying-single record), the eight contract and
# manifest templates of the assembly root, of the family holder and of that
# record, the eight tools that CREATE or UPDATE a root (`scaffold-project.py`
# for a new project, `adopt-project.py` for an existing repository taken in
# place, `update-shape.py` for a root re-syncing its copied shape files and
# re-pinning, `scripts/bump-leg.py` for a root advancing ONE leg's gitlink, pin
# and workflow refs in one lockstep commit, the `openRepoShape` command that
# installs itself and runs `setup.sh`, `setup.sh`, now the shim that finds an
# interpreter and hands over, `setup-project.py`, the flow it hands over to, and
# `bootstrap`), the thirteen shipped validators, shipped root scripts and the
# libraries they run out of (among them `shape-doctor.py`, the one command that
# runs the others and prints the verdict a repository is held to, and
# `scripts/shape_advisory.py`, the Triad advisory the doctor, the scaffold and
# adoption all say), the two `AGENTS-shape.md` files the shape COPIES VERBATIM
# into every root it materializes and DIGEST-PINS there, the agent instruction
# file, the README that states the doctrine in the standard's own words, and the
# LICENCE the convener ruled. The sixty-seven path-only members are the
# standard's own tests, its CI and the CI it ships inside each template, the
# ignore and attributes files, the `CLAUDE.md` stubs that say only "Read
# AGENTS.md.", the template READMEs and Makefiles and the per-root
# `AGENTS.md`/`CLAUDE.md` the shape RENDERS rather than pins, the leg and
# workspace skeletons, and the DERIVED readings of the digested surface
# (`docs/cli.md`, its generator, and `docs/handbook.html`) — content the commit
# addresses and this repository makes no byte-level claim about.
#
# THE RULE DECIDED EVERY NEW FILE, AND NOTHING MOVED LIST. `1a9fc537` carries 28
# files `e9c4827b` did not, and each was classified by the paragraph above rather
# than by which pull request it arrived in. SIX are digested.
# `setup-project.py` is the flow that creates a root — `setup.sh` became a shim
# over it (openRepoShape #60), so digesting the shim and not the flow would pin
# the doorway and leave the room unpinned; `shape-doctor.py` is a shipped
# validator, the one that runs the others and prints the verdict; and
# `templates/family-root/scripts/siblings.py` is a script the shape SHIPS into
# every family holder beside that holder's `scripts/bootstrap.py` and
# `scripts/validate-family.py`, both already digested here, and copies verbatim
# and pins there (`FAMILY_COPIED_VERBATIM`). The other three are what
# openRepoShape #164 brought for this repository's own
# `prefer-triad-project-shape`: `contracts/single-repository-record.yaml` is the
# schema of the optional staying-single record the doctrine names, owned by the
# standard and normative in the same way the naming policy is;
# `templates/single-repository/single-repository.yaml` is that record's
# template, a contract template exactly as `templates/assembly-root/project.yaml`
# is, placeholders and all; and `scripts/shape_advisory.py` is the library
# `scaffold-project.py`, `adopt-project.py` and `shape-doctor.py` all say the
# advisory out of, exactly as `scripts/repo_shape.py` is the one they read the
# policy through. TWENTY-TWO are path-only: the seven new `tests/` files are the
# standard's own tests, where every `tests/` member already is; the root's
# `.gitattributes` and the assembly-root and family-root templates' sit with the
# `.gitignore` files — the standard copies and pins the templates' copies
# exactly as it copies and pins their `.gitignore`, `Makefile` and
# `.github/workflows/validate.yml`, all three path-only here since `122d729b`,
# so "the shape pins it" has never by itself been this pin's rule (the
# `AGENTS-shape.md` pair is digested for what it SAYS, not for being copied);
# the nine files of `templates/workspace-root/` are a skeleton the shape
# neither materializes nor pins (its own `.gitattributes`: it "ships no
# `contracts/` and no digest pin"), copied by `openRepoTools wip init` and
# rendered per person where it carries `{{LOGIN}}`, so its README, AGENTS.md,
# CLAUDE.md, ignore and attributes files and `.gitkeep`-style seeds take the
# places their assembly-root counterparts already hold; and `docs/cli.md`, its
# generator `scripts/render-cli-reference.py` and `docs/handbook.html` are
# DERIVED readings — the first GENERATED from the digested tools' own `--help`,
# the last the designed reading of the digested README, and the generator a
# tool for the standard's own documentation rather than for any root — so
# digesting them would be a second claim about bytes this pin already claims
# at their source. Every one of the 76 members declared at `e9c4827b` is still
# present at `1a9fc537` and still in the list it was in; nothing was removed or
# renamed upstream, and 21 of the 31 digests moved, because only those bytes
# moved.
# ============================================================================

# ============================================================================
# ADDENDUM (issue #775, direct fix `register-sibling-consumption-pins`):
# MEASURED AND NOT REGISTERED. Issue #775 named this pin beside its
# `openxwallet-pin.yaml` sibling and required `neutral-product-pin`'s
# predicate — "wherever any repository other than openxFactory is expected
# to read it" — to be MEASURED per pin rather than assumed for both. The two
# answer DIFFERENTLY. This pin's own paragraph above already gives the
# reason: openxFactory CITES the standard rather than mounting it, so there
# is no gitlink for another checkout to compare against in the first place.
# Beyond that: `openreposhape-pin-gate.yml` is openxFactory's own NON-required
# `pull_request` gate (its `on:` block carries `pull_request` and nothing
# else — no `workflow_call` — and `openreposhape-pin` is absent from the
# repository's required-status-check rulesets), and it is invoked by no other
# repository; and `scripts/validate-openreposhape-pin.py` has no
# aggregation-comparison mode analogous to `verify-openxwallet-pin.py`'s
# `verify_aggregation()` — grepped for `aggregation`, zero hits.
#
# THE PREDICATE MEASURED IS "ANOTHER REPOSITORY READS *THIS* PIN", NOT
# "ANOTHER REPOSITORY CONSUMES `openRepoShape`", AND AN EARLIER DRAFT OF THIS
# ADDENDUM CONFLATED THE TWO (corrected on PR #1026 review, which was right).
# The withdrawn sentence claimed "every other adopter forks
# `opensoft/openRepoShape` directly" and offered `opensoft/openRepoTools` as
# confirmation. openRepoTools is the COUNTEREXAMPLE to that generalisation,
# not its confirmation: it MOUNTS the standard as a git submodule —
# `[submodule "upstream/openRepoShape"]` in its `.gitmodules`, gitlink
# `32450eb5c5d18fbb0747dc5ad420cf67742cfa99` at `upstream/openRepoShape`, and
# its OWN `contracts/openreposhape-pin.yaml` declaring
# `submodule_path: upstream/openRepoShape`, `materialization: mounted` and
# `verify_pin: tests/test_upstream_pin.py`, a suite that checks that gitlink,
# that checkout and a recomputed `tree_sha256` — and it is not a fork of
# `opensoft/openRepoShape` at all (`fork: false`, no parent). Nor does its
# header say what that sentence attributed to it; what it says is "THE
# DEPENDENCY RUNS ONE WAY … openRepoShape pins this repository nowhere",
# which is a claim about openRepoShape, not about openxFactory.
#
# THE RATIFIED FORK CLAUSE IS NARROWER THAN THAT GENERALISATION AND IS NOT
# CONTRADICTED. `project-repo-schema`'s requirement "The standard lives in
# `opensoft/openRepoShape`, is consumed by fork, and openxFactory pins it by
# commit and digest" obliges the fork of "An organisation OUTSIDE this
# family", and its scenario's own WHEN is "an organisation with no
# openxFactory, no codexFactory and no wallet register … depends on no
# artifact of this family at run time". openRepoTools is inside the family
# and is the standard's own tooling sibling, so its mount is not a breach of
# that clause; it is simply outside what the clause speaks to.
#
# WHAT R1 ACTUALLY TURNS ON IS NARROWER STILL, AND IT HOLDS. openRepoTools'
# pin is an INDEPENDENT second pin of the same upstream product, and it reads
# nothing of openxFactory's: the string `openxFactory` does not occur
# anywhere in `opensoft/openRepoTools` — not in any of the three revisions of
# that pin file, not in its tests, not anywhere in its tree — and an org-wide
# code search for `openreposhape-pin` outside openxFactory returns that one
# repository and no other consumer. Two repositories pinning the same
# upstream separately is not one repository reading the other's pin, which is
# the predicate `neutral-product-pin` states. The registration decision is
# therefore UNCHANGED by this correction; only its stated grounds are.
#
# SO THE OUTCOME: this pin is NOT registered in `contracts/manifest.yaml`,
# nor indexed as a contract member in `contracts/README.md` — it carries a
# documentation-only README row recording this same negative finding
# instead, so an absent registration reads as MEASURED rather than as an
# oversight indistinguishable from one the register simply never declared.
# ============================================================================

