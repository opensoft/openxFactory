# A CONFORMANT SEALED BOUNDED REQUEST from an UNREGISTERED producer.
#
# Field (10) is TRUSTED HOSTED-WORKFLOW PROVENANCE, and that satisfies it —
# exactly as the ratified basis states, because this producer holds no active row
# in the factory-identity register. `add-cpc-clearing-boundary` tightens field
# (10) only WHERE AN IDENTITY IS REGISTERED, so registering one TIGHTENS a
# producer and never loosens one, and the boundary stays usable by a producer
# that has not yet been issued a key.
#
# THE ABSENCE OF A REGISTERED IDENTITY DOES NOT BY ITSELF REFUSE. That is the
# ratified scenario this example exists to hold: a corpus that only ever showed
# the signed form would let a later reader conclude the interim floor had been
# quietly removed.
#
# This manifest is also the BASE most negative fixtures mutate, precisely because
# it carries no signature: a mutation to a signed manifest invalidates the
# signature as a side effect, and a fixture that fails for two reasons pins
# neither.
