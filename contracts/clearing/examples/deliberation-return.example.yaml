# THE DELIBERATION RETURN, in the shape register entry number two declares.
#
# WHAT IS HERE AND NOTHING ELSE: the per-seat outputs, keyed by seat identity,
# and the three run identifiers that bind the return to the convening it answers
# — the convening job id, the VERIFIED subject pin, and the digest of the
# INBOUND sealed bundle. A return that could not name the exact bundle, at the
# exact verified pin, for the exact convening job, would be a return nothing
# could be matched against, and matching it afterwards by timing or by order is
# the guess the binding removes.
#
# WHAT IS DELIBERATELY ABSENT. No signature: the return is UNSIGNED on the host,
# because the entry forbids any seat key or signing key ever being present there,
# and it is signed ON RETURN by the originating repository's own hosted signer.
# No outcome, no verdict, no eligibility, no recommendation: what the seats
# produce is evidence, and the outcome is computed by the runtime from the signed
# returns, outside this boundary.
#
# THE SEAT'S OUTPUT IS OPAQUE, and both forms are shown so a reader sees the
# choice the shape offers: `inline` for an output small enough to travel in the
# record, `reference` for one that sits beside it in the sealed return object
# with its byte hash. The producing estate's own per-seat members — turn counts,
# declared caps, model usage — travel INSIDE the payload rather than becoming
# members of this neutral family.
