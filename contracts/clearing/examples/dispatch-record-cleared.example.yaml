# A CLEARED DISPATCH, RECORDED — and recorded FROM DECLARATIONS, because this
# operation carries no bundle.
#
# `bundle_present: false` is the fact that explains every null below. The
# ratified requirement covers this case explicitly: "Where a registered operation
# is dispatched WITHOUT a sealed bundle — as the first read-only operation is —
# the record carries the REGISTER ENTRY'S DECLARED data-handling classification,
# and, for each selected lane, that lane's DECLARED runner group and DECLARED
# dispatch label." So `policy_checked` rows carry a null CLAIM and a resolved
# value: there was no bundle to claim anything.
#
# THE THREE VERIFICATION CLASSES ARE KEPT APART, which is most of the point of
# this shape. `provider_verified` holds only fields the provider can answer.
# `policy_checked` holds fields nothing can verify — reported as policy-checked,
# never as verified, because "verified" applied to a field nothing could verify
# is the false assurance this boundary exists to prevent. `origin_signature` is
# its OWN outcome; here `not_required`, because no bundle and no registered
# producer are in play.
#
# THE LANES ARE DECLARED. There is no observed counterpart in this record and
# there is none in the shape: observed group membership is established only by
# the single-door attestation reading the provider's API.
#
# DISPOSAL IS A FIELD, NOT A LOG LINE. add-cpc-clearing-boundary put it here
# deliberately — this record already exists, is already written for admissions
# and refusals alike, and its completeness is already attested rather than
# assumed. Note what the method says: no workspace was created at all, which is a
# stronger statement than one that was cleaned up.
