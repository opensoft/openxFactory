# A REFUSAL, RECORDED IN THE SAME SHAPE — which is the requirement, not a
# convenience: "a boundary that logs only successes cannot evidence what it
# stopped".
#
# THE OPERATION IS RECORDED AS CLAIMED. `operation.claimed` is `deliberation`
# and `operation.resolved` is null. A record that dropped the claim would leave
# the ledger unable to answer what was ASKED FOR — the question an auditor
# actually has after a refusal — and a record that put the claim in `resolved`
# would present a refused claim as a cleared one.
#
# THE GROUND COMES FROM THE CLOSED ENUMERATION. `unregistered_operation` is one
# of exactly two members today, and the other is `unknown_lane_selector`. Those
# two are what the current realization can actually emit. Nine further grounds
# are named in the requirement text and none of them is here, because a closed
# enumeration seeded with grounds no implementation can produce is closed in name
# only. Each becomes a member as the operation that can produce it lands, by a
# governed change to the schema and never as a new string in a workflow.
#
# DISPOSAL IS STILL RECORDED. The ratified scenario is explicit that disposal
# evidence is written "INCLUDING on failure, refusal, and timeout" — and the
# honest method here is that there was nothing to dispose of, said in those words
# rather than by leaving the field empty and letting a reader assume it.
