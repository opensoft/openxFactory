residual_statement: Runner-group membership and workflow allowlists are provider-side configuration
  outside this repository's version control, changeable by an administrator with no pull request.
  This contract does not make that configuration versioned and does not claim to; it makes
  a change to it OBSERVABLE within one attestation cycle.
