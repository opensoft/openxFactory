# A SINGLE-DOOR ATTESTATION carrying ALL THREE finding classes at once — which is
# the state the estate is actually in, and the reason the classes exist.
#
# THE EXPECTED SET IS COMPUTED PER GROUP. The two groups below expect different
# things because different members are enumerated for them. One estate-wide
# expected set would report each group as diverging from the other group's
# members, "which is a definition that cannot be green while more than one group
# exists".
#
# THE THREE CLASSES, AND WHY CONFLATING ANY TWO WOULD BE WRONG:
#
#   * WIDENING — `an-unaccounted-worker.yml` on the artifact group, and
#     `codeXfactory/codexFactory` admitted as a repository. These are BREACHES:
#     something can reach the host that the enumeration does not account for.
#     The repository admission is the measured residual the ruling closes, and it
#     is why the eighteen-hour queued run 33381257642 could queue at all.
#
#   * DARK LANE — `review-lane-worker.yml` and `ideation-organizer-worker.yml`
#     are enumerated for the artifact group and hold NO allowlist entry. They are
#     ALREADY FAILING CLOSED. Filing them as breaches would make this attestation
#     red on day one over two lanes that cannot reach the host at all, for a
#     condition strictly SAFER than the expectation.
#
#   * CONVERGENCE NOT YET REACHED — the clearing workflow's own path is absent
#     from both groups, because the operator's one console act per group has not
#     happened. Convergence is a TERMINAL STATE, not an entry condition, and this
#     interval is the contract's starting position rather than a breach of it.
#
# THE COMPLETENESS CLAIM IS THE NARROWER ONE, and it says why in its own words.
# The FULL claim becomes available only after the clearing path is admitted to
# every governed group and every non-clearing admitted repository is removed.
# Claiming it now is refused; see
# `negative/attestation-claiming-full-completeness-before-admission.yaml`.
#
# THE MEASUREMENTS are those recorded 2026-09-01 in the ratified packet's own
# tasks.md — six allowlisted paths on the artifact group, one on the execution
# lane, two dark lanes — with a fictional extra entry added so the widening class
# has something to be about. Re-measure before treating any of this as current.
