# THE COMPOSED OPERATION REPORT — one report of record for one dispatch, across
# BOTH probed lanes.
#
# The ratified requirement allows the report to be COMPOSED — each probed lane
# forwards its facts to a composing step that assembles the single structured
# report — and forbids only "a report that exists only as scattered log lines a
# reader must reassemble". This is that composed artifact: `lanes` is a KEYED
# COLLECTION, not two files and not an array of fragments.
#
# EVERY LANE FACT IS DECLARED OR PROBED, AND THE TWO ARE NOT MIXED. `declared`
# carries what the DISPATCH said the lane was; `runner`, `host`, `heartbeat`,
# `environment`, `tools` and `compute` carry what the host said about itself.
# There is no observed-group member anywhere, because the provider exposes no
# runner-group context to a running job and a job reporting its own group would
# be the bundle-trust error moved onto the host.
#
# THE ENVIRONMENT ECHO IS NINE ALLOWLISTED NAMES. Not a `printenv`. A credential
# that someday lands in this process's environment cannot be printed into a
# public run log by accident, because a name outside the allowlist cannot be
# written into this shape at all.
#
# THE COMPUTE ROUND TRIP RECORDS BOTH DIGESTS even though they agree here — the
# ratified disagreement scenario requires both values, and a shape that carried
# only the verdict could not evidence what disagreed.
#
# WHAT IS ABSENT IS THE POINT: no eligibility field, no readiness verdict, no
# go/no-go. This is EVIDENCE produced BY passing through the boundary, and it is
# deliberately not the neutral infrastructure-readiness result the promoted
# preflights await — that is a decision input consulted BEFORE dispatch.
