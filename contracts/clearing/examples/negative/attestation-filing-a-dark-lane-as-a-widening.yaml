# expected_failure: clearing-attestation-dark-lane-as-breach
# expected_failure_detail: ALREADY FAILING CLOSED
# VIOLATES "An enumerated member holds no allowlist entry → the attestation MUST
# NOT report it as a single-door breach AND it MUST be raised as a dark-lane
# disposition item, because that member is already failing closed."
#
# THE TWO DIVERGENCE DIRECTIONS ARE NOT THE SAME FINDING, and this fixture is the
# direction that is easy to get wrong. An entry the expected set does not derive
# means something CAN reach the host that nobody accounted for. An enumerated
# member with no entry means something CANNOT reach the host that somebody
# expected to. The second is strictly safer than the expectation. Filing it as a
# breach would have made this attestation red on its first run over two lanes
# that cannot reach the host at all — and a control that is red for a safe
# condition is a control that gets muted.
