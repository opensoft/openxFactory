# expected_failure: clearing-attestation-expected-set-not-per-group
# expected_failure_detail: PER GROUP
# VIOLATES "THE EXPECTED ALLOWLIST SHALL BE COMPUTED PER GROUP, not once for the
# estate ... Computing one estate-wide expected set instead would report every
# group as diverging from every other group's members, which is a definition
# that cannot be green while more than one group exists."
#
# Both groups here declare the SAME expected allowlist — the union of what the
# two of them permit. It looks tidier and it is unusable: the execution lane
# would forever appear to be missing the artifact group's members, and the
# artifact group would forever appear to be missing the execution lane's. An
# attestation that can never be green is an attestation nobody reads.
