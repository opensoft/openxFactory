# VIOLATES add-cpc-clearing-boundary's second addition: "Where a bundle's copy
# disagrees with the register entry, THE REGISTER GOVERNS: the request SHALL be
# refused and the disagreement recorded, rather than the dispatch proceeding on
# either value."
#
# NOTE WHAT IS REFUSED. Not "the dispatch runs on the register's value anyway" —
# that would be a silent correction, and a producer would learn nothing. Not "the
# dispatch runs on the bundle's value" — that is the producer choosing its own
# worker profile by writing it into a bundle it controls. The refusal is the only
# answer that denies both.
