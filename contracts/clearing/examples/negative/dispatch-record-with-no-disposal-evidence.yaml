# expected_failure: clearing-record-disposal-unattested
# expected_failure_detail: UNATTESTED DISPOSAL
# VIOLATES add-cpc-clearing-boundary's ADDED requirement: "A dispatch record
# whose disposal field is absent or empty SHALL NOT be read as evidence of a
# clean host, and the periodic attestation that reads those records SHALL report
# it as an UNATTESTED DISPOSAL rather than passing it."
#
# NOTE THE DIRECTION OF THE RULE. `disposed: false` would be LAWFUL here — it
# records that the host was not left clean, which is a fact somebody can act on.
# What is refused is the EMPTY field, because an empty field and a clean host are
# indistinguishable to a reader, and the attestation would otherwise count the
# dispatch as clean on the strength of nothing.
