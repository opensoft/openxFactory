# expected_failure: clearing-origin-row-expired
# expected_failure_detail: whichever field (10) it carries
# VIOLATES the field-(10) tightening add-cpc-clearing-boundary made, read
# together with the factory-identity register's own declared limits: an origin
# row confers authority only while its declared expiry stands, and "REVOCATION AT
# THE MOMENT OF CLEARING IS UNREALIZABLE TODAY" — so the expiry is the ONLY
# revocation that propagates at all.
#
# THE ROW THIS PRODUCER RESOLVES TO IS `state: active` AND LAPSED AT ONCE. That
# pair is invisible to a reader that filters on the state field, which is the
# whole reason this fixture exists: `state` says what a human last wrote, and
# `expires_at` says what time has since done.
#
# THE REFUSAL RUNS IN BOTH DIRECTIONS, and this fixture carries the direction
# that is easy to get wrong. It offers HOSTED PROVENANCE — the lawful field (10)
# for a producer holding no registered identity. If the reader had merely SKIPPED
# the lapsed row, this request would have validated: the producer would look
# unregistered, and an EXPIRY would have WIDENED what it may present. Registering
# an identity tightens a producer and never loosens one; letting one lapse must
# not loosen one either.
