# expected_failure: clearing-lane-not-permitted
# VIOLATES "A bundle requests a lane its operation does not permit → the dispatch
# MUST be refused."
#
# The pairing is what fails, not either half: the artifact GROUP is real and the
# coding LABEL is real, and the register entry pairs each group with its own
# lane's label. A cross-paired request would route a coding-lane label into the
# artifact group — which is why the entry declares LANES rather than a set of
# groups and a set of labels.
