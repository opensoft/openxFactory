# expected_failure: clearing-manifest-hash-not-byte-tagged
# expected_failure_detail: category error
# VIOLATES add-cpc-clearing-boundary's carve-out, which refuses this BY NAME:
# "A canonical-JSON construction is applied to file bytes ... it MUST be refused
# as a category error, AND per-file content hashes MUST be algorithm-tagged
# SHA-256 over the file's bytes."
#
# The mistake is seductive because it looks STRICTER — one construction
# everywhere. It is not stricter, it is meaningless: a canonicalization has
# nothing to canonicalize in a byte stream. One construction for JSON values, one
# byte hash for file content.
