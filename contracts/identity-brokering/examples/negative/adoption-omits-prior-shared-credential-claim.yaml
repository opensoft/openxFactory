# expected_failure: schema
# expected_failure_detail: 'prior_shared_credential' is a required property
# requirement: IDB-R7
# VIOLATES R7: the retirement obligation satisfied by saying nothing.
#
# THE ADOPTION THAT SAYS NOTHING WAS THE EXEMPT ONE.
# `adoption-leaves-shared-secret-live` names the htpasswd credential and
# records `retired: false`, and the validator refuses it. This record replaces
# the SAME credential and simply omits the `replaced_credential` block — and
# every check passed, because the retirement rule only ever ran on records that
# volunteered the block. The surface display name says out loud that htpasswd
# is still underneath; the record's shape does not have to.
#
# So the requirement was enforced against honesty and inert against silence,
# which is the wrong way round: the adoption most likely to leave a shared
# secret live is exactly the one that never mentions it.
#
# `prior_shared_credential` is now REQUIRED, with two values. `replaced`
# demands the block, and the validator then demands the retirement and its
# date. `none` is the AUDITABLE CLAIM that there was no shared static
# credential to retire — a claim someone can be shown to be wrong about, which
# is what an omission never is. Two words, and R7's retirement obligation stops
# being satisfiable by leaving a field out.
