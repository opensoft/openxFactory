# expected_failure: schema
# expected_failure_detail: mapping
# requirement: IDB-R5
# VIOLATES R5: a mapping smuggled into a first-party assertion.
#
# The provenance conditionals were built to make the wrong combinations
# unrepresentable, and they closed every one but this: `broker_asserted`
# refused a `pre_broker` block and admitted a `mapping` block. The subject is a
# real broker-issued one, the issuer is named, the record reads as a
# first-party broker assertion — and it carries a mapping whose evidence
# reference is `we inferred it from the name`.
#
# The point is which rules apply. Every check governing a mapping — that it
# resolves to a broker-issued subject rather than to itself, that its target is
# not a bare username the corpus records as pre-broker — hangs off provenance
# being `mapped_historical_actor`. Declared `broker_asserted`, none of them run,
# so an unverified resolution travels inside the class that is supposed to mean
# "the broker said this".
#
# The three classes are exclusive. A record carrying a mapping is a record
# whose actor was RESOLVED from a pre-broker username, and that is
# `mapped_historical_actor` with that class's obligations attached.
