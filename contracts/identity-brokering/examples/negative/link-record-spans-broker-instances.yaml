# VIOLATES R8: a merge reaching across broker instances.
#
# Approved, recorded, and every prior subject kept resolvable — this record does
# the merge paperwork correctly. What it merges is a persona from the DEDICATED
# HealthLinc instance into a persona in the shared one, on the entirely
# reasonable-sounding grounds that they are the same human.
#
# They may well be. Personas still do not span instances, and nothing may
# require them to: a human holding a persona in two instances holds two SINGLE
# personas, each single within its own instance. Merging them here would
# undo the isolation the dedicated instance exists to provide — a clinical
# patient population becoming reachable from the operator plane by way of a
# merge record, which is the co-residence bar defeated through the linking
# machinery rather than through a deployment decision.
