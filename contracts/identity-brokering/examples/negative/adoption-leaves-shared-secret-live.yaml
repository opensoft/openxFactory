# expected_failure: shared-secret-not-retired
# expected_failure_detail: records retired=False
# requirement: IDB-R7
# VIOLATES R7: the adoption leaves the shared credential live.
#
# Persona login ships, and the htpasswd user stays "for the transition" and
# "for the monitoring check that has not been updated yet". The surface now has
# TWO authentication paths, one of which is the shared static secret the
# adoption was supposed to remove — and the credential inventory grew by an
# adoption that was meant to shrink it.
#
# It is also the most likely of all these failures to happen in practice, and
# the least likely to be noticed, because everything works. Retiring the
# replaced credential is part of the adoption, not a follow-up task.
