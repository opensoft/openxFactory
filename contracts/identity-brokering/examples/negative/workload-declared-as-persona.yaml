# expected_failure: workload-as-persona
# expected_failure_detail: is declared by broker service client
# requirement: IDB-R6
# VIOLATES R6: a workload in the persona population.
#
# The oauth2-proxy service account, given a persona so that "the dashboard's
# own requests show up in the same place as everybody else's". Reasonable
# instinct, wrong mechanism: it puts a non-human actor into the population the
# governed layer treats as humans, and it creates a second, weaker authority
# vocabulary beside the ratified one.
#
# The ratified one is stronger in every dimension that matters — attenuated
# grants, proof of possession, key-attributed audit, revocation that propagates
# — and the weaker vocabulary would win by convenience if it were allowed to
# exist. A workload's authority comes from `credential-contracts` grants and
# `openxwallet` holders; no persona is created for it.
