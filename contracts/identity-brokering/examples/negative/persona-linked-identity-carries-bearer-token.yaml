# expected_failure: credential-value-embedded
# expected_failure_detail: a bearer-token-shaped value
# requirement: IDB-R7
# VIOLATES R7: a linked identity carrying the token that proved it.
#
# A linked upstream identity is a provider id plus the subject that provider
# issued — a REFERENCE PAIR. Here the id token that established the link is
# stored beside it, because "then we do not have to call the provider again".
# The assertion becomes a bearer credential at rest, replayable by anyone who
# can read a persona record, and it is not even long-lived enough to be useful
# — the storage buys nothing and costs everything.
#
# Both halves of the scan fire: the property name is credential-shaped, and the
# VALUE is a serialized bearer token whatever the property had been called.
