# expected_failure: credential-value-embedded
# expected_failure_detail: a value REASSEMBLED from adjacent chunks
# requirement: IDB-R7
# VIOLATES R7: a credential smuggled through in pieces.
#
# Neither entry is a secret on its own — `client_sec` is not a credential and
# `ret=hV3Qk9…` is not an assignment — and a per-value scan sees nothing. Joined
# in the order a reader would read them, they are the export line the previous
# probe pastes whole.
#
# Splitting is what a wrapped or column-truncated export does by accident, and
# what someone working around a rejected commit does on purpose; the scan
# cannot tell the two apart and does not need to. This is why the value scan
# REASSEMBLES adjacent chunks — array items in order, and a mapping's own
# sibling strings — rather than testing each string in isolation.
#
# It stays a blocklist over the classes it knows: a secret encoded some other
# way passes, so keeping credentials out of free-text fields remains an
# obligation on consumers rather than one this validator can discharge.
