# expected_failure: second-persona-in-instance
# requirement: IDB-R1
# VIOLATES R1: one persona per human within a broker instance.
#
# The same federated upstream identity — the operator's own Entra directory,
# subject 9c1f52a7-… — resolving to a SECOND persona in the same instance. This
# is what identity-per-surface produces when nobody notices: a human who
# already has a persona signs in through a path that creates another, and from
# then on their records split between two subjects that nothing links.
#
# The federated identity is the only evidence of sameness the broker actually
# has, which is why the check keys on it. Two personas sharing one upstream
# identity are one human twice — the precise outcome the whole capability
# exists to prevent, and the reason the answer to isolation is a dedicated
# INSTANCE rather than a partition inside a shared one.
