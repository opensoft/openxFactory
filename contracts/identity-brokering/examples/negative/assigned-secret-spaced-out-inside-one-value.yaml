# expected_failure: credential-value-embedded
# expected_failure_detail: the value at 'oidc_token_reason' is an assigned secret value
# requirement: IDB-R7
# VIOLATES R7: a secret pasted into free text, spaced out.
#
# `export-secret-split-across-chunks` splits a secret ACROSS fields and array
# items, and the scan answers by joining what a reader would read together.
# This splits it INSIDE ONE VALUE, with spaces, and neither half of that
# machinery reaches it: the per-value regexes need the assignment and its value
# adjacent (`client_secret: hV3x` has four characters after the colon, under the
# floor), and chunk reassembly only ever joined SEPARATE strings.
#
# Both forms in this record are the ordinary ones. `client_secret: hV3x K9pQ
# 2mZr 7Lw4` is what a wrapped or column-truncated realm export looks like
# pasted out of a terminal. `KEYCLOAK_ADMIN_PASSWORD = h u n t e r 2 2 2` is
# what a person types when a previous commit was rejected — and the scan cannot
# tell accident from intent, and does not need to.
#
# Each string is now tested twice: as written, and with its whitespace
# collapsed. It fails with NO schema finding: the shape is entirely conformant
# and the credential is in it, which is the whole argument for scanning values
# and not only names.
#
# Still a blocklist over the classes it knows. A secret encoded some other way
# passes, so keeping credentials out of free text remains an obligation on
# consumers rather than one this validator can discharge.
