# expected_failure: credential-value-embedded
# expected_failure_detail: an assigned secret value
# requirement: IDB-R7
# VIOLATES R7: a configuration export carrying a credential value.
#
# The specific artifact the requirement names. A client's configuration is
# exported to be reviewed and replayed as desired state, and the export line
# comes with it — pasted into the one free-text field on the record, where it
# looks like documentation rather than a secret. The shape is entirely
# conformant; the VALUE is a credential.
#
# This is why the export must be credential-free BY CONSTRUCTION rather than by
# redaction after the fact: redaction is a step someone performs, and the step
# that gets skipped is the one nothing checks. Every credential this family
# touches is a `credential-contracts` record with declared custody and a named
# holder, referenced and never carried — as the `credential_requirement` block
# on this very record already does correctly.
