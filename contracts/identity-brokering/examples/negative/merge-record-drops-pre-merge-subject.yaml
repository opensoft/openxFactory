# VIOLATES R4: the merge drops a prior subject identifier.
#
# Approved, recorded, and it looks complete: an approver, a time, an evidence
# reference, and a pre-merge entry for the surviving subject. What is missing is
# the LOSING subject — the identifier every record written before the merge
# actually carries. Dropping it silently orphans all of them, re-creating at
# merge time precisely the attribution loss the capability was built to
# prevent.
#
# The failure is invisible at merge time and discovered later, by a reader
# asking who took an act, which is why the resolvability obligation is
# structural rather than procedural: the record carries every prior subject and
# the survivor it resolves to, or it is not a valid merge.
