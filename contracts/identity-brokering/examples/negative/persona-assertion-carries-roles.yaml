# expected_failure: never-mirror-property
# expected_failure_detail: 'roles' is an undeclared property
# requirement: IDB-R3
# VIOLATES R3: the broker asserts identity and membership only.
#
# The most plausible version of the mistake, and the reason the property set is
# a CLOSED ALLOW-LIST rather than a denylist. Someone needs the workbench to
# know who may approve, the broker already knows who logged in, and adding
# `roles` to the assertion is one line. From there the tenancy graph grows a
# field at a time until broker state is a second copy of it — and the copy will
# disagree with the first one, discovered by an authorization decision going
# the wrong way.
#
# Authorization resolves in the governed layer, against the governed tenancy
# graph and the grants already recorded there. The assertion contributes
# identity and memberships, and there is nowhere in the shape to put anything
# else.
