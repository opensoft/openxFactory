# VALID surface adoption proving the SILENCE IS LOAD-BEARING: a
# single-organization deployment — one clinic, its own stack, no operator layer
# above it — running its own broker with NO co-residence restriction at all.
#
# It is conformant, and nothing requires it to join a shared instance. A
# contract mandating one shared broker would make this deployment
# non-conformant for no governance benefit, which is why the capability is
# deliberately silent on instance count in BOTH directions: a dedicated
# instance needs no restriction to justify it, and a restriction cannot be
# answered by anything less.
