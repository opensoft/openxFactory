# VALID administrative merge: the SECOND and only other way a federated
# identity joins a persona. Two personas that were the same human are merged
# through the governed administration workflow, and the record names the
# approver, BOTH prior subject identifiers, and the time.
#
# The pre-merge block is the load-bearing half. Every prior subject stays
# resolvable to the surviving persona, so records already written against the
# losing identifier stay attributable. Without it the merge silently orphans
# every one of them — re-creating, at merge time, exactly the attribution loss
# the whole capability is built to prevent.
