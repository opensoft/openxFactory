schema_version: 1
kind: openxfactory-hermes-runtime-contract-schema
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://xforge.us/schemas/openxfactory/hermes-runtime/v2/approval-decision-policy.schema.yaml
contract_id: approval-decision-policy
contract_schema_version: 2
title: Immutable approval aggregation and supersession policy
description: >-
  Pins reviewer selectors, quorum aggregation, deterministic conflict handling,
  and the issuer roles permitted for expiry, cancellation, or revocation.
type: object
$defs:
  reviewer_selector:
    type: object
    properties:
      selector_id:
        $ref: shared-definitions.schema.yaml#/$defs/canonical_id
      principal_ids:
        type: array
        minItems: 1
        maxItems: 64
        uniqueItems: true
        items:
          $ref: shared-definitions.schema.yaml#/$defs/principal_id
      principal_types:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: shared-definitions.schema.yaml#/$defs/principal_type
      group_principal_ids:
        type: array
        minItems: 1
        maxItems: 64
        uniqueItems: true
        items:
          $ref: shared-definitions.schema.yaml#/$defs/principal_id
      minimum_count:
        type: integer
        minimum: 1
      distinct_principals:
        const: true
    required: [selector_id, minimum_count, distinct_principals]
    anyOf:
    - required: [principal_ids]
    - required: [principal_types]
    - required: [group_principal_ids]
    additionalProperties: false
  supersession_authority:
    type: object
    properties:
      event_type:
        enum: [expired, cancelled, revoked]
      principal_ids:
        type: array
        minItems: 1
        maxItems: 64
        uniqueItems: true
        items:
          $ref: shared-definitions.schema.yaml#/$defs/principal_id
      principal_types:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: shared-definitions.schema.yaml#/$defs/principal_type
      group_principal_ids:
        type: array
        minItems: 1
        maxItems: 64
        uniqueItems: true
        items:
          $ref: shared-definitions.schema.yaml#/$defs/principal_id
    required: [event_type]
    anyOf:
    - required: [principal_ids]
    - required: [principal_types]
    - required: [group_principal_ids]
    additionalProperties: false
properties:
  schema_version:
    const: 1
  kind:
    const: openxfactory-hermes-runtime-approval-decision-policy
  policy_id:
    $ref: shared-definitions.schema.yaml#/$defs/canonical_id
  policy_digest:
    $ref: shared-definitions.schema.yaml#/$defs/sha256_digest
  authority_scope:
    $ref: shared-definitions.schema.yaml#/$defs/governed_scope
  reviewer_selectors:
    type: array
    minItems: 1
    maxItems: 32
    items:
      $ref: '#/$defs/reviewer_selector'
  aggregation:
    enum: [all_required_selectors, minimum_approvals]
  minimum_approvals:
    type: integer
    minimum: 1
  conflict_resolution:
    enum: [contested, reject_overrides]
  supersession_authorities:
    type: array
    minItems: 1
    maxItems: 3
    items:
      $ref: '#/$defs/supersession_authority'
  created_at:
    $ref: shared-definitions.schema.yaml#/$defs/rfc3339_timestamp
  extensions:
    $ref: shared-definitions.schema.yaml#/$defs/extensions
required:
- schema_version
- kind
- policy_id
- policy_digest
- authority_scope
- reviewer_selectors
- aggregation
- conflict_resolution
- supersession_authorities
- created_at
allOf:
- if:
    properties:
      aggregation:
        const: minimum_approvals
  then:
    required: [minimum_approvals]
  else:
    not:
      required: [minimum_approvals]
additionalProperties: false
