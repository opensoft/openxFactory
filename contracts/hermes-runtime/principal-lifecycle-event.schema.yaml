schema_version: 1
kind: openxfactory-hermes-runtime-contract-schema
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://xforge.us/schemas/openxfactory/hermes-runtime/v2/principal-lifecycle-event.schema.yaml
contract_id: principal-lifecycle-event
contract_schema_version: 2
title: Append-only principal lifecycle event
type: object
properties:
  schema_version: {const: 1}
  kind: {const: openxfactory-principal-lifecycle-event}
  event_id:
    $ref: shared-definitions.schema.yaml#/$defs/event_id
  record_digest_profile:
    $ref: shared-definitions.schema.yaml#/$defs/record_digest_profile
  record_digest:
    $ref: shared-definitions.schema.yaml#/$defs/record_digest
  principal_ref:
    $ref: shared-definitions.schema.yaml#/$defs/principal_reference
  predecessor_ref:
    $ref: shared-definitions.schema.yaml#/$defs/authority_predecessor_reference
  from_state:
    type: string
    enum: [provisioning, active, suspended, retired]
  to_state:
    type: string
    enum: [provisioning, active, suspended, retired]
  authorizing_grant_ref:
    $ref: shared-definitions.schema.yaml#/$defs/authority_grant_reference
  occurred_at:
    $ref: shared-definitions.schema.yaml#/$defs/rfc3339_timestamp
  reason: {type: string, minLength: 1, maxLength: 1024}
  extensions:
    $ref: shared-definitions.schema.yaml#/$defs/extensions
required:
  - schema_version
  - kind
  - event_id
  - record_digest_profile
  - record_digest
  - principal_ref
  - predecessor_ref
  - from_state
  - to_state
  - authorizing_grant_ref
  - occurred_at
  - reason
additionalProperties: false
