schema_version: 1
kind: openxfactory-hermes-runtime-contract-schema
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://xforge.us/schemas/openxfactory/hermes-runtime/v2/approval-request.schema.yaml
contract_id: approval-request
contract_schema_version: 2
title: Immutable digest-bound approval request
description: >-
  Binds requester authority, exact content target and action, reviewer
  selectors, and one immutable decision-policy pin.
type: object
properties:
  schema_version:
    const: 1
  kind:
    const: openxfactory-hermes-runtime-approval-request
  request_id:
    $ref: shared-definitions.schema.yaml#/$defs/canonical_id
  request_digest:
    $ref: shared-definitions.schema.yaml#/$defs/sha256_digest
  owning_scope:
    $ref: shared-definitions.schema.yaml#/$defs/layer_scope
  target:
    $ref: shared-definitions.schema.yaml#/$defs/content_resource_reference
  requested_action:
    $ref: shared-definitions.schema.yaml#/$defs/canonical_id
  authority_scope:
    $ref: shared-definitions.schema.yaml#/$defs/governed_scope
  requester_principal_ref:
    $ref: shared-definitions.schema.yaml#/$defs/principal_reference
  requester_grant_ref:
    $ref: shared-definitions.schema.yaml#/$defs/authority_grant_reference
  reviewer_selector_ids:
    type: array
    minItems: 1
    maxItems: 32
    uniqueItems: true
    items:
      $ref: shared-definitions.schema.yaml#/$defs/canonical_id
  decision_policy_id:
    $ref: shared-definitions.schema.yaml#/$defs/canonical_id
  decision_policy_digest:
    $ref: shared-definitions.schema.yaml#/$defs/sha256_digest
  decision_policy_pin:
    $ref: shared-definitions.schema.yaml#/$defs/git_file_pin
  created_at:
    $ref: shared-definitions.schema.yaml#/$defs/rfc3339_timestamp
  expires_at:
    $ref: shared-definitions.schema.yaml#/$defs/rfc3339_timestamp
  extensions:
    $ref: shared-definitions.schema.yaml#/$defs/extensions
required:
- schema_version
- kind
- request_id
- request_digest
- owning_scope
- target
- requested_action
- authority_scope
- requester_principal_ref
- requester_grant_ref
- reviewer_selector_ids
- decision_policy_id
- decision_policy_digest
- decision_policy_pin
- created_at
- expires_at
additionalProperties: false
