schema_version: 1
kind: openxfactory-hermes-runtime-contract-schema
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://xforge.us/schemas/openxfactory/hermes-runtime/v2/domain-regression-inventory.schema.yaml
contract_id: domain-regression-inventory
contract_schema_version: 1
title: Supported-Domain regression denominator inventory
description: >-
  Closed, schema-validated denominator of the exact published DomainxFactory
  stack.yaml blobs that canonical validation reproduces. Each entry pins a
  canonical repository, published commit, repository-relative stack path, the
  raw-Git-blob digest of that stack, the domain identifier, and the exact
  openxFactory contract pin the stack declares. Explicit exclusions record every
  DomainxFactory deliberately left out of the denominator with a cited reason.
type: object
properties:
  schema_version:
    const: 1
  kind:
    const: openxfactory-hermes-runtime-domain-regression-inventory
  inventory_version:
    type: integer
    minimum: 1
  entries:
    type: array
    minItems: 5
    items:
      type: object
      properties:
        repository:
          $ref: shared-definitions.schema.yaml#/$defs/canonical_repository
        commit:
          $ref: shared-definitions.schema.yaml#/$defs/git_commit
        stack_path:
          $ref: shared-definitions.schema.yaml#/$defs/repository_relative_path
        stack_digest:
          $ref: shared-definitions.schema.yaml#/$defs/sha256_digest
        domain_id:
          $ref: shared-definitions.schema.yaml#/$defs/canonical_id
        expected_contract_ref:
          $ref: shared-definitions.schema.yaml#/$defs/git_commit
        expected_contract_schema_version:
          type: integer
          minimum: 1
        expected_result:
          const: pass
      required:
      - repository
      - commit
      - stack_path
      - stack_digest
      - domain_id
      - expected_contract_ref
      - expected_contract_schema_version
      - expected_result
      additionalProperties: false
  exclusions:
    type: array
    minItems: 1
    items:
      type: object
      properties:
        repository:
          $ref: shared-definitions.schema.yaml#/$defs/canonical_repository
        reason:
          type: string
          minLength: 1
          maxLength: 1024
        evidence:
          type: string
          minLength: 1
          maxLength: 1024
      required:
      - repository
      - reason
      - evidence
      additionalProperties: false
required:
- schema_version
- kind
- inventory_version
- entries
- exclusions
additionalProperties: false
