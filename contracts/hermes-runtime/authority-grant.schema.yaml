schema_version: 1
kind: openxfactory-hermes-runtime-contract-schema
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://xforge.us/schemas/openxfactory/hermes-runtime/v2/authority-grant.schema.yaml
contract_id: authority-grant
contract_schema_version: 2
title: Immutable exact-action authority grant
type: object
properties:
  schema_version: {const: 1}
  kind: {const: openxfactory-authority-grant}
  grant_id:
    $ref: shared-definitions.schema.yaml#/$defs/canonical_id
  record_digest_profile:
    $ref: shared-definitions.schema.yaml#/$defs/record_digest_profile
  record_digest:
    $ref: shared-definitions.schema.yaml#/$defs/record_digest
  installation_id:
    $ref: shared-definitions.schema.yaml#/$defs/canonical_id
  grant_kind:
    enum: [root, delegated]
  principal_ref:
    $ref: shared-definitions.schema.yaml#/$defs/principal_reference
  scope:
    $ref: shared-definitions.schema.yaml#/$defs/governed_scope
  action:
    $ref: shared-definitions.schema.yaml#/$defs/authority_action
  resource_constraint:
    $ref: shared-definitions.schema.yaml#/$defs/resource_reference
  policy_pin:
    $ref: shared-definitions.schema.yaml#/$defs/git_file_pin
  root_anchor_ref:
    $ref: shared-definitions.schema.yaml#/$defs/trust_anchor_reference
  issuer_grant_ref:
    $ref: shared-definitions.schema.yaml#/$defs/authority_grant_reference
  starts_at:
    $ref: shared-definitions.schema.yaml#/$defs/rfc3339_timestamp
  expires_at:
    $ref: shared-definitions.schema.yaml#/$defs/rfc3339_timestamp
  issued_at:
    $ref: shared-definitions.schema.yaml#/$defs/rfc3339_timestamp
  extensions:
    $ref: shared-definitions.schema.yaml#/$defs/extensions
required:
  - schema_version
  - kind
  - grant_id
  - record_digest_profile
  - record_digest
  - installation_id
  - grant_kind
  - principal_ref
  - scope
  - action
  - resource_constraint
  - policy_pin
  - starts_at
  - issued_at
allOf:
  - if:
      properties:
        grant_kind: {const: root}
      required: [grant_kind]
    then:
      required: [root_anchor_ref]
      not:
        required: [issuer_grant_ref]
    else:
      required: [issuer_grant_ref]
      not:
        required: [root_anchor_ref]
additionalProperties: false
