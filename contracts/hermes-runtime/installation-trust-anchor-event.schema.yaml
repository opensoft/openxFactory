schema_version: 1
kind: openxfactory-hermes-runtime-contract-schema
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://xforge.us/schemas/openxfactory/hermes-runtime/v2/installation-trust-anchor-event.schema.yaml
contract_id: installation-trust-anchor-event
contract_schema_version: 2
title: Append-only installation trust anchor event
type: object
properties:
  schema_version: {const: 1}
  kind: {const: openxfactory-installation-trust-anchor-event}
  event_id:
    $ref: shared-definitions.schema.yaml#/$defs/canonical_id
  record_digest_profile:
    $ref: shared-definitions.schema.yaml#/$defs/record_digest_profile
  record_digest:
    $ref: shared-definitions.schema.yaml#/$defs/record_digest
  installation_id:
    $ref: shared-definitions.schema.yaml#/$defs/canonical_id
  predecessor_ref:
    $ref: shared-definitions.schema.yaml#/$defs/authority_predecessor_reference
  event_type:
    enum: [rotate, revoke]
  predecessor_anchor_ref:
    $ref: shared-definitions.schema.yaml#/$defs/trust_anchor_reference
  successor_anchor_ref:
    $ref: shared-definitions.schema.yaml#/$defs/trust_anchor_reference
  authorizing_principal_ref:
    $ref: shared-definitions.schema.yaml#/$defs/principal_reference
  authorizing_grant_ref:
    $ref: shared-definitions.schema.yaml#/$defs/authority_grant_reference
  effective_at:
    $ref: shared-definitions.schema.yaml#/$defs/rfc3339_timestamp
  occurred_at:
    $ref: shared-definitions.schema.yaml#/$defs/rfc3339_timestamp
  reason:
    type: string
    minLength: 1
    maxLength: 1024
  extensions:
    $ref: shared-definitions.schema.yaml#/$defs/extensions
required:
  - schema_version
  - kind
  - event_id
  - record_digest_profile
  - record_digest
  - installation_id
  - predecessor_ref
  - event_type
  - predecessor_anchor_ref
  - authorizing_principal_ref
  - authorizing_grant_ref
  - effective_at
  - occurred_at
  - reason
allOf:
  - if:
      properties:
        event_type: {const: rotate}
      required: [event_type]
    then:
      required: [successor_anchor_ref]
    else:
      not:
        required: [successor_anchor_ref]
additionalProperties: false
