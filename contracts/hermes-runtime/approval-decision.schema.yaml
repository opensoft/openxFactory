schema_version: 1
kind: openxfactory-hermes-runtime-contract-schema
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://xforge.us/schemas/openxfactory/hermes-runtime/v2/approval-decision.schema.yaml
contract_id: approval-decision
contract_schema_version: 2
title: Immutable actual-reviewer approval decision
description: >-
  Repeats the exact request target, action, scope, and policy while binding the
  actual reviewer principal and exact reviewer grant.
type: object
properties:
  schema_version:
    const: 1
  kind:
    const: openxfactory-hermes-runtime-approval-decision
  decision_id:
    $ref: shared-definitions.schema.yaml#/$defs/canonical_id
  decision_digest:
    $ref: shared-definitions.schema.yaml#/$defs/sha256_digest
  request_id:
    $ref: shared-definitions.schema.yaml#/$defs/canonical_id
  request_digest:
    $ref: shared-definitions.schema.yaml#/$defs/sha256_digest
  owning_scope:
    $ref: shared-definitions.schema.yaml#/$defs/layer_scope
  target:
    $ref: shared-definitions.schema.yaml#/$defs/content_resource_reference
  requested_action:
    $ref: shared-definitions.schema.yaml#/$defs/canonical_id
  authority_scope:
    $ref: shared-definitions.schema.yaml#/$defs/governed_scope
  decision_policy_id:
    $ref: shared-definitions.schema.yaml#/$defs/canonical_id
  decision_policy_digest:
    $ref: shared-definitions.schema.yaml#/$defs/sha256_digest
  reviewer_selector_id:
    $ref: shared-definitions.schema.yaml#/$defs/canonical_id
  actual_reviewer_principal_ref:
    $ref: shared-definitions.schema.yaml#/$defs/principal_reference
  reviewer_grant_ref:
    $ref: shared-definitions.schema.yaml#/$defs/authority_grant_reference
  decision:
    enum: [approve, reject]
  rationale_ref:
    $ref: shared-definitions.schema.yaml#/$defs/content_resource_reference
  decided_at:
    $ref: shared-definitions.schema.yaml#/$defs/rfc3339_timestamp
  extensions:
    $ref: shared-definitions.schema.yaml#/$defs/extensions
required:
- schema_version
- kind
- decision_id
- decision_digest
- request_id
- request_digest
- owning_scope
- target
- requested_action
- authority_scope
- decision_policy_id
- decision_policy_digest
- reviewer_selector_id
- actual_reviewer_principal_ref
- reviewer_grant_ref
- decision
- decided_at
additionalProperties: false
