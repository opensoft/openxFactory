kind: xfactory_certificate_record
certificate_id: cert:core-service-01
realization_ref: realization:core-self-hosted-authority
anchor_ref: anchor:core-issuing
subject:
  identifier: "svc-ledger-api.core.internal"
  subject_class: service
  display_label: Ledger API service
  public_key_fingerprint: "sha256:2E64C1B9F0A7D3528B41E0CA96D7F3125A8E0B4D71C3F692"
validity:
  not_before: "2026-08-01T00:00:00Z"
  not_after: "2027-08-01T00:00:00Z"
state: valid
key_generation:
  generation_ref: keygen:core-service-01-g1
  generated_at: "2026-08-01T00:00:00Z"
declared_chain_custody:
  custody_model: host_held
  registry_id: trust-anchor-chain-custody
  registry_version: 1
  credential_record_ref: credential:core-service-01-key
  vault_binding_ref: vaultbinding:core/service-01-key
  declared_at: "2026-08-01T00:00:00Z"
  declared_by: opensoft
evidences: using_host
assurance_ceiling: host_attributed_act
custody_in_force_at: "2026-08-01T00:00:00Z"
issuance_evidence:
