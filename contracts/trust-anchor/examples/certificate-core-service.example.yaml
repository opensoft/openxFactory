# VALID certificate record: a service certificate under the self-hosted issuing
# authority, whose private key is READABLE by the host that uses it. That is the
# ordinary case, and the record says what it evidences — the USING HOST — rather
# than leaving a reader to assume the certificate proves the service decided
# anything. Because the key is readable, the material itself lives in a
# credential record with a vault binding, which this record names and does not
# carry.
