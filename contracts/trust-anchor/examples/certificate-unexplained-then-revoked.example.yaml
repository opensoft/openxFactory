# VALID certificate record for a certificate NOBODY CAN EXPLAIN. There is no
# issuance evidence, and the record says so: the question "should this exist?" is
# answered UNANSWERED — not yes — and the certificate is a revocation candidate
# until the record is produced. It was then revoked, and the propagation record
# in this corpus shows that revocation reaching one authority and failing to
# reach another inside the declared window.
schema_version: 1
kind: xfactory_certificate_record
certificate_id: cert:core-legacy-03
realization_ref: realization:core-self-hosted-authority
anchor_ref: anchor:core-issuing
subject:
  identifier: "legacy-reporting.core.internal"
  subject_class: service
validity:
  not_before: "2026-01-15T00:00:00Z"
  not_after: "2026-08-31T00:00:00Z"
state: revoked
revocation:
  revoked_at: "2026-08-25T10:00:00Z"
  reason_statement: >-
    Unexplained certificate: no issuance evidence could be produced within the
    review window, so the revocation candidacy was actioned rather than left
    open.
  propagation_ref: prop:core-legacy-03-revocation
key_generation:
  generation_ref: keygen:core-legacy-03-g1
declared_chain_custody:
  custody_model: host_held
  registry_id: trust-anchor-chain-custody
  registry_version: 1
  credential_record_ref: credential:core-legacy-03-key
  vault_binding_ref: vaultbinding:core/legacy-03-key
evidences: using_host
assurance_ceiling: host_attributed_act
issuance_evidence:
  present: false
  unexplained:
    question_answered_as: unanswered
    disposition: revocation_candidate
    recorded_at: "2026-08-20T08:00:00Z"
    statement: >-
      The certificate exists under a held anchor with no issuance evidence
      record. Nothing here asserts it was authorized; the honest state is that
      the question is open, and the disposition follows from that.
dependent_binding_enumeration:
  state: complete
  asserted_at: "2026-08-20T08:00:00Z"
  binding_refs:
    - bind:core-legacy-03-partner-feed
  statement: >-
    One binding, found by the audit that found the certificate. It is what makes
    the revocation's propagation checkable: revoking this certificate has to
    reach the authority this binding bought, and the propagation record is held
    to that set rather than to whatever it chose to list.
trust_evaluation:
  evaluated_at: "2026-08-20T08:05:00Z"
  basis: held_anchor_record
  chain_terminates_in_held_anchor: true
  revocation_standing_check:
    basis: checked_at_use
    performed_at_use: true
    checked_at: "2026-08-20T08:05:00Z"
    result: current_standing_active
  outcome: refused
  refusal:
    code: issuance_evidence_absent
    statement: >-
      Refused for a use requiring recorded authority. The chain terminated in a
      held anchor and the certificate was well-formed and unrevoked at the time,
      and none of that substitutes for evidence that it should exist.
