kind: xfactory_trust_anchor
anchor_id: anchor:managed-root
realization_ref: realization:managed-cloud-authority-canary
anchor_identity:
  subject_name: "Managed Fleet Root Authority"
  public_key_fingerprint: "sha256:44D1F0B7C2A98E5330761FDA0C4B8E27519A3D6E0FB8C721"
chain_position:
  role: root
  path_depth: 0
validity:
