# VALID trust anchor for an authority the family does NOT operate. Two things
# are worth reading here.
#
# First, the custody: the key is hardware-resident inside a managed service and
# usable by that service without a per-use authorization the family can compel,
# so it evidences the USING HOST — below the strictest member of the set. That is
# not silently accepted: the record NAMES the obligation entry where the
# realization declared the shortfall.
#
# Second, there is no credential record for the key, because no credential
# record can exist for a key the family cannot hold. The same declared entry
# covers that, which is exactly the arrangement the ratified degraded-obligation
# rule admits — and it is the reason an undeclared version of this record does
# not validate.
