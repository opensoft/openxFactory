# expected_failure: obligation-undeclared
# expected_failure_detail: declared SATISFIED is an undeclared shortfall
# requirement: TA-R8
# VIOLATES TA-R8: a record that does not establish what the obligation requires,
# pointing at an obligation entry that says the obligation is SATISFIED.
#
# This is the shape an undeclared shortfall actually takes once a contract asks
# for declarations. Nobody writes "we are silent about this"; they cite the entry
# that exists and hope the citation is not resolved. Here the self-hosted
# realization — the one that CAN reach per-certificate provenance and declares
# that it does — files an issuance record at the floor level and refers to its own
# satisfied entry as cover.
#
# An undeclared shortfall is non-conformance even where the identical shortfall,
# declared, would be conformant. So the reference is resolved: the entry must
# belong to this realization, name this obligation, and actually record a
# shortfall.
schema_version: 1
kind: xfactory_certificate_issuance_evidence
issuance_evidence_id: ie:neg-undeclared-shortfall
certificate_ref: cert:core-service-01
anchor_ref: anchor:core-issuing
realization_ref: realization:core-self-hosted-authority
authority:
  authority_ref: policy:core-service-issuance-policy
  authority_kind: policy
establishment_level: per_policy_attestation_with_authority_log
request_provenance:
