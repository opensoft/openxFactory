# expected_failure: provenance-asserted-unestablished
# expected_failure_detail: worse than a declared gap
# requirement: TA-R2
# VIOLATES TA-R2: a record declaring the FLOOR establishment level — per-policy
# attestation plus the authority's own log — while asserting the per-certificate
# request provenance that level exists precisely because the authority does not
# expose.
#
# This is the tempting middle position the ratification refused: keep the weaker
# level, fill in the stronger fields, and let a reader assume both. An
# asserted-but-unestablished record is worse than a declared gap, because a
# declared gap can be consumed carefully and a false assertion cannot be
# consumed at all. The schema forbids the recorded form; this rule names WHY.
