  authority_kind: policy
establishment_level: per_policy_attestation_with_authority_log
request_provenance:
  establishment: established
  requester_ref: role:fleet-operator
  request_id: req:neg-asserted-2026-08
  requested_at: "2026-08-01T00:00:00Z"
  statement: >-
    Reconstructed from a change ticket that happened to be open at the time,
    which is not the authority establishing anything.
authority_attestation:
  policy_attestation_ref: attestation:managed-device-issuance-profile-2026-08
  authority_log_ref: authoritylog:managed-issuing-2026-08-01
