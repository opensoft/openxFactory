# expected_failure: schema
# expected_failure_detail: 'issuing_workflow' was expected
# requirement: TA-R4
# VIOLATES TA-R4's attribution half — and does so UNREPRESENTABLY, which is the
# point of this probe.
#
# `failure.attribution` is a constant. There is no member for the dependent that
# stopped authenticating, so this record cannot be authored at all; the shape
# refuses it before any rule runs. The probe exists because the attribution half
# is the part that is easy to skip and expensive to omit: attributing the outage
# to the dependent produces an incident report that teaches nothing, a fix that is
# a re-bind with no obligation attached, and a guarantee of recurrence at the next
# renewal.
#
# The dependent was configured correctly when it was configured. The renewal is
# what changed beneath it.
