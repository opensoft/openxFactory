# expected_failure: certificate-outlives-anchor
# expected_failure_detail: does not extend the anchor's
# requirement: TA-R1
# VIOLATES TA-R1: the certificate's validity runs past its anchor's.
#
# The failure this catches is a rotation plan that treats the two windows as
# independent. An anchor's window BOUNDS its subordinates: when it closes,
# certificates chaining to it stop being trusted from that moment, and a
# certificate's own remaining validity does not extend the anchor's standing. A
# record whose dates say otherwise is describing a trust set the family does not
# actually have.
