# expected_failure: key-material-reversibly-encoded
# expected_failure_detail: base64-encoded key material
# requirement: TA-R7
# VIOLATES TA-R7 in the form it always actually arrives in: the QA authority's
# key, base64-encoded, committed with the reason stated in the record itself.
#
# The reason given is the one the ratified text names and refuses — "QA only".
# There is no field here that grants an exemption, because the contract provides
# none: a demonstration or QA authority's private key is an authority key, and a
# committed one is a compromised one. The reason is in a free-text note precisely
# because that is where it goes in real life, and the finding does not depend on
# reading it.
#
# The scan reverses the encoding and re-runs the value patterns. "Any encoding a
# reader can reverse" is the ratified wording, and base64 is what makes committed
# key material look like configuration.
