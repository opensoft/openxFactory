# expected_failure: key-material-embedded
# expected_failure_detail: contains a private key block
# requirement: TA-R1
# VIOLATES TA-R1 (and TA-R7): the anchor record carries the key it should only
# reference.
#
# This is the PLAUSIBLE version of the mistake, and the reason the check walks
# values and not only property names. Every object in this family closes
# additionalProperties, so no key-shaped PROPERTY can be added at any depth —
# that half is structurally impossible. What remains possible is a key pasted
# into a string field that legitimately exists, here the anchor's own notes, by
# someone capturing "the root key we generated" while the ceremony was fresh.
#
# A raw key can be neither expired nor revoked, and a committed authority key is
# a compromised authority key. Key material is therefore unrepresentable here
# rather than discouraged.
schema_version: 1
kind: xfactory_trust_anchor
anchor_id: anchor:neg-root-with-key
realization_ref: realization:core-self-hosted-authority
anchor_identity:
  subject_name: "Leaky Root Authority"
chain_position:
  role: root
  path_depth: 0
validity:
  not_before: "2026-01-01T00:00:00Z"
  not_after: "2036-01-01T00:00:00Z"
state: held
admitted_issuance_authorities:
  - authority_ref: policy:core-root-issuance-policy
    authority_kind: policy
    statement: Subordinate authorities only.
declared_chain_custody:
  custody_model: host_isolated_per_use_authorized
  registry_id: trust-anchor-chain-custody
  credential_record_ref: credential:neg-root-signing-key
  vault_binding_ref: vaultbinding:core/neg-root-signing-key
notes: "ceremony output, keep for reference: -----BEGIN PRIVATE KEY-----MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQDA-----END PRIVATE KEY-----"
