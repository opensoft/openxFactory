# expected_failure: revocation-window-arithmetic
# expected_failure_detail: recomputed rather than trusted
# requirement: TA-R6
# VIOLATES TA-R6's bounded-window requirement arithmetically: a window declared as
# one hour that closes a day later.
#
# A window nobody checks is a window that means whatever its widest field says. The
# closing moment is recomputed from the opening moment and the bound, on the same
# principle that makes `evidences` derived: a record does not get to assert a
# conclusion its own inputs contradict. Left unchecked, this is how a one-hour
# obligation quietly becomes a one-day one — and the open-exposure escalation is
# timed against the close, so the window's honesty is what makes that escalation
# fire.
