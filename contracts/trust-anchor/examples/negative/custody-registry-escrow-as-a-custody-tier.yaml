# expected_failure: custody-discriminator-duplicated
# expected_failure_detail: escrow is a relationship on the credential record
# requirement: TA-R3
# VIOLATES TA-R3 and the ratified OQ2 ruling: operator escrow added as a custody
# MEMBER.
#
# It looks harmless — the member's own derivation is correct, and it reads like a
# useful distinction. But escrow answers "who else can obtain this key", which is
# ORTHOGONAL to "can the using host read it". Note what the member has to declare
# to exist at all: exactly the same two booleans as the member above it, because
# the escrow fact is invisible to this axis. One axis carrying two questions makes
# both unreadable, and the reading that gets lost is the one at point of use.
#
# The structural guard is discriminator uniqueness: two members declaring the
# same pair differ only in something this axis cannot express. Escrow belongs on
# the credential-contracts record every custody block already references.
schema_version: 1
kind: xfactory_trust_anchor_chain_custody_registry
registry_id: trust-anchor-chain-custody-probe
registry_version: 1
assurance_levels:
  - id: host_attributed_act
    rank: 1
    statement: An act attributed to the using host, reviewed before effect.
  - id: holder_attributed_act
    rank: 2
    statement: An act attributed to the named holder, with nothing else in the way.
custody_models:
  - id: host_held
    title: host held
    key_readable_by_using_host: true
    use_requires_authorization_outside_using_host: false
    evidences: using_host
    openxwallet_custody_model: holder_readable
    evidences_statement: Probe member; see the fixture comment for what it violates.
    assurance_ceiling: host_attributed_act
  - id: host_isolated_per_use_authorized
    title: host isolated per use authorized
    key_readable_by_using_host: false
    use_requires_authorization_outside_using_host: true
    evidences: named_holder
    openxwallet_custody_model: isolated_per_use_authorized
    evidences_statement: Probe member; see the fixture comment for what it violates.
    assurance_ceiling: holder_attributed_act
  - id: operator_escrowed
    title: operator escrowed
    key_readable_by_using_host: false
    use_requires_authorization_outside_using_host: true
    evidences: named_holder
    openxwallet_custody_model: isolated_per_use_authorized
    evidences_statement: Probe member; see the fixture comment for what it violates.
    assurance_ceiling: holder_attributed_act
    notes: The operator holds a recoverable copy for break-glass.
undeclared_custody_resolves_to: host_held
