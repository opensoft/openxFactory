# expected_failure: shortfall-claim-moment-missing
# expected_failure_detail: indistinguishable from a backdated one
# requirement: TA-R8
# VIOLATES TA-R8's timeliness guard by DECLARING NO MOMENT. The anchor cites a
# shortfall entry and carries neither `declared_at` on its custody block nor
# `created_at` on the record, so the comparison the ratified guard depends on —
# was the gap declared BEFORE the claim? — has only one side.
#
# The earlier form of the rule SKIPPED when either side was missing, which made
# omitting two optional timestamps a complete bypass: an adversarial review dated
# a shortfall in 2030, deleted the anchor's two dates, and the record validated.
# A guard that fails open on the record that wants it to is not a guard, so the
# citation is refused and the schema now requires `declared_at` alongside a
# shortfall reference — this fixture is refused twice over, by shape and by rule.
