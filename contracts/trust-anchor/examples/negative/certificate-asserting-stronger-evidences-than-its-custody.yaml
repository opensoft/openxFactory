# expected_failure: certificate-evidences-derivation
# expected_failure_detail: never from the certificate's own contents
# requirement: TA-R3
# VIOLATES TA-R3: the certificate declares host-held custody and records that it
# evidences the NAMED HOLDER.
#
# This is the free-text-custody failure with the field renamed. What a certificate
# evidences is DERIVED from the declared custody through the closed registry, not
# from the certificate's contents and not from the record's own assertion — so the
# derivation is recomputed rather than read. The ceiling is left correct here on
# purpose, so the probe tests the derivation itself rather than being caught by
# the cap downstream.
