# expected_failure: trusted-without-held-anchor
# expected_failure_detail: accepted on its own strength
# requirement: TA-R1
# VIOLATES TA-R1: a certificate recorded as trusted whose chain terminates in no
# anchor the evaluating system holds.
#
# Note what is NOT wrong with it. The chain it presents is well-formed, the
# signatures would verify, the validity window is current, and the standing check
# was performed at use and came back active. None of that is trust. A certificate
# is trusted only through an anchor record the evaluating system already holds,
# and a certificate accepted on its own strength is an untrusted certificate
# however well-formed it is.
#
# The record cannot even express the alternative: `trust_evaluation.basis` is a
# constant, so "accepted because it parsed" has no shape here, and the refusal
# vocabulary contains no member for it either.
