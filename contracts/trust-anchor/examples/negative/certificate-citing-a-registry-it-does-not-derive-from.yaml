# expected_failure: custody-registry-pointer-mismatch
# expected_failure_detail: cannot be adjudicated against one closed set while naming another
# requirement: TA-R3
# VIOLATES TA-R3 by pointing somewhere else. The custody block names
# `some-other-registry-entirely` at version 99, and every derivation on the record
# — `evidences`, the assurance ceiling — is the canonical registry's, correctly.
#
# So the record validated: the pointer was decorative. Two fields the schema
# requires, resolved by nothing, and a reader following them lands on a registry
# that may say anything at all. The closed set a record is adjudicated against is
# the set it names, so the name has to be the canonical one — which also closes
# the pairing with the fixture beside this one, where the diverging registry the
# pointer would have led to is the document being shipped.
