# expected_failure: issuance-floor-under-a-family-operated-authority
# expected_failure_detail: the middle option the ratification refused
# requirement: TA-R2
# VIOLATES OQ1's ruling. The record declares the DECLARED FLOOR — per-policy
# attestation plus the authority's own log — while declaring, in the same record,
# that the family OPERATES the issuing authority.
#
# The ruling is explicit about which option it refused: "Reject the tempting
# middle option of writing the weaker form into the requirement itself: that
# would let the self-hosted authority, which can do better, stop at the floor."
# The floor was never a choice — it is the honest form where the authority's
# internals are out of reach. An operator that can extract per-certificate
# provenance and records the floor instead IS the refused middle option, arriving
# one record at a time rather than as a change to the requirement.
#
# `issuing_authority.operated_by_family` was REQUIRED by the schema and read by
# nothing, so the ruling lived in the schema's description and nowhere else.
