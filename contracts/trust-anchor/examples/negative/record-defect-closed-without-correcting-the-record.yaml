# expected_failure: record-defect-not-closed-by-record-correction
# expected_failure_detail: not closed by re-binding alone
# requirement: TA-R5
# VIOLATES TA-R5: a defect entry resolved as `record_corrected`, naming a binding
# that is NOT in the enumeration it was supposedly added to.
#
# The record even carries the rebind evidence, which is exactly how this happens:
# the binding was re-bound, the outage ended, the defect got closed, and the
# enumeration — the thing that will be read at the NEXT renewal — was never
# actually corrected. Closing the incident is not correcting the record, and the
# resolution cannot be recorded without naming a binding the enumeration holds.
