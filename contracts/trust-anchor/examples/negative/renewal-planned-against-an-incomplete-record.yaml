# expected_failure: renewal-planned-on-incomplete-record
# expected_failure_detail: cannot proceed by misdeclaring the state
# requirement: TA-R5
# VIOLATES TA-R5: a renewal that PROCEEDED while declaring the certificate's
# dependent enumeration `known_incomplete`.
#
# Two layers catch it, which is deliberate. The shape forces the planning outcome
# to `refused` whenever the enumeration is known incomplete, so the recorded form
# above cannot be authored — you cannot write down "I knew the set was incomplete
# and I renewed anyway". And because the escape from a shape like that is to
# misdeclare the state, the validator compares the declared state against the
# certificate record itself: this renewal claims incomplete where the record says
# complete, and a renewal claiming complete over a record that says otherwise
# fails the same comparison.
#
# You cannot evidence the completion of an obligation over a set you never
# enumerated, which is why planning is refused rather than best-effort.
