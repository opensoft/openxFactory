# expected_failure: key-material-reversibly-encoded
# expected_failure_detail: no exception for test, demonstration or QA material
# requirement: TA-R7
# VIOLATES TA-R7 in the shape the ratified scenario names, with the armor gone and
# the recovery recipe written out beside the blob. The record states the reason
# ("QA only, not production") and states how to reverse it, and neither changes
# the finding.
#
# The pairing is deliberate: the previous QA probe carried an ARMORED key, so it
# could not tell whether the refusal came from the exemption being refused or from
# the label being matched. This one has no label. "QA only" is not a reason the
# contract accepts, and there is no field in which to record it as one.
