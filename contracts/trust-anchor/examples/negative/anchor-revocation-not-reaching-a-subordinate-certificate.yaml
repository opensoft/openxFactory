# expected_failure: revocation-transitivity-incomplete
# expected_failure_detail: propagation gap, not a paperwork omission
# requirement: TA-R6
# VIOLATES TA-R6: an anchor revocation that reaches an authority of its own and
# names NO subordinate certificate.
#
# Revoking an anchor revokes transitively what its subordinate certificates
# supported. This record revokes the anchor, evidences one propagation, and leaves
# the certificate that chains to it — and the authority THAT supported — entirely
# untouched. The closure is computed from the corpus's own anchor chain rather
# than trusted from the record, because the certificates a revocation forgets are
# exactly the ones nobody remembered to list.
