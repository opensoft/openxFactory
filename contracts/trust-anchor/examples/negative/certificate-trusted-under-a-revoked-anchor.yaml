# expected_failure: trusted-under-closed-anchor
# expected_failure_detail: stops trusting its subordinates
# requirement: TA-R1
# VIOLATES TA-R1: recorded as trusted under an anchor that has been revoked.
#
# This is the withdrawal that withdraws nothing, which is the failure the
# anchor-first framing exists to prevent. The certificate is inside its own
# validity window and its standing check came back active — because a
# certificate-level standing check does not ask about the ANCHOR. Trust runs
# through the anchor record, so the anchor's state is the answer.
