# expected_failure: renewal-failure-misnames-dependents
# expected_failure_detail: the dependents lacking succeeded evidence are
# requirement: TA-R4
# VIOLATES TA-R4: the renewal is honestly recorded as failed and attributed to the
# issuing workflow, and then names the WRONG dependent as unbound — the one that
# was actually re-bound and evidenced.
#
# This is the same evasion as blaming the dependent, with the constant filled in
# correctly and the facts moved instead. Attribution to the issuing workflow is
# only useful if the named set is the real one; otherwise the remediation is
# pointed at a binding that is already fine while the broken one stays broken and
# recorded as healthy.
