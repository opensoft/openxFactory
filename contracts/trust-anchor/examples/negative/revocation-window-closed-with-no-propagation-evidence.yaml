# expected_failure: revocation-window-closed-unevidenced
# expected_failure_detail: escalated as an OPEN EXPOSURE
# requirement: TA-R6
# VIOLATES TA-R6: the declared window closed with one downstream authority
# unevidenced, and the record reports COMPLETE.
#
# Read the unevidenced entry: the revocation was SENT. That is the whole
# temptation — the request went out, nothing bounced, and the window expired while
# nobody was watching. A revocation whose propagation cannot be evidenced within
# the declared window is an open exposure, and reporting completion on the
# strength of the request is how an authority stays live after everyone believes
# it is dead.
#
# The honest version of this record is in the positive corpus, escalated.
