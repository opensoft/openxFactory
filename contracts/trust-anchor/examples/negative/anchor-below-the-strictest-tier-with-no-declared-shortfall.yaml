# expected_failure: anchor-custody-below-strictest-tier
# expected_failure_detail: no shortfall is declared
# requirement: TA-R7
# VIOLATES TA-R7: an anchor whose key custody sits below the strictest member of
# the closed set, with nothing declared about it.
#
# The realization here is the SELF-HOSTED one, which is what makes the record
# dishonest rather than merely degraded. The managed anchors in the positive
# corpus declare exactly this shortfall and are conformant on the strength of the
# declaration; this record says nothing, and silence reads as the strongest case
# to anyone who does not go looking.
#
# An undeclared shortfall is non-conformance even where the identical shortfall,
# declared, would be conformant. Declaring it is cheap. Leaving a reader to assume
# is what the rule refuses.
