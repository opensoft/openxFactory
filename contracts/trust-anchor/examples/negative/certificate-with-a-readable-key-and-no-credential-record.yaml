# expected_failure: custody-credential-record-missing
# expected_failure_detail: must name the credential-contracts record
# requirement: TA-R7
# VIOLATES TA-R7: the certificate declares custody the registry says is READABLE
# BY THE USING HOST, and names no credential record or vault binding.
#
# A readable key exists somewhere as material — that is what readable means — so
# the record has to say where. This rule keys on the registry's own boolean rather
# than on the member's name, so renaming or adding members cannot slip past it:
# whatever a future member is called, if its key can be read then its material has
# a home and the record names it.
