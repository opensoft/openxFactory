# expected_failure: issuance-level-above-the-declared-achievement
# expected_failure_detail: asserting the evidence instead
# requirement: TA-R2
# VIOLATES TA-R8's closing clause through a TA-R2 record: the realization's
# declaration says it achieves the floor
# (`achieved_establishment_level: per_policy_attestation_with_authority_log`)
# and this record asserts the strict level, with a requester, a request id and a
# request time filled in.
#
# Every record-local rule passes — the strict level requires established
# provenance and established provenance requires exactly these three fields, and
# they are all here. The contradiction is with the DECLARATION, which is where a
# consumer reads which form of evidence to expect. "The gap is not closed by the
# realization asserting the evidence instead" is the ratified sentence, and
# `achieved_establishment_level` is the field that makes it checkable — which it
# was not, being required by the schema and read by nothing.
