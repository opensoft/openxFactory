# expected_failure: renewal-key-change-understated
# expected_failure_detail: a rebind obligation with no owner
# requirement: TA-R4
# VIOLATES TA-R4 by SILENCE. The certificate declares that its current key
# generation supersedes an earlier one — so the key changed — and no renewal
# record in this corpus accounts for that change.
#
# The renewal record is where the rebind obligation lives: who owed what, to which
# dependents, and with what evidence. A key change with no renewal record is that
# obligation with no owner, and the dependents keep pointing wherever they
# pointed. This is the shape an adversarial probe reached for after the
# `changed: false` shape — same silence, one fewer record to write.
