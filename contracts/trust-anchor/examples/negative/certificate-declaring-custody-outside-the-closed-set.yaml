# expected_failure: custody-model-unknown
# expected_failure_detail: declared FROM A CLOSED SET
# requirement: TA-R3
# VIOLATES TA-R3: a custody model no registry declares — and note the name chosen,
# because it is the one people reach for.
#
# "Hardware-backed" is not a member of this set, deliberately: the family's own
# live canary runs hardware-resident keys that a host can use without limit, and
# those evidence the HOST. If an unrecognised model were treated as uncapped
# rather than refused, every ceiling derived from it would resolve to nothing —
# the cap failing open at the one point it is supposed to bind.
