# expected_failure: key-material-reversibly-encoded
# expected_failure_detail: PKCS#8 PrivateKeyInfo
# requirement: TA-R7
# VIOLATES TA-R7 with the armor removed. The value is base64 of a PKCS#8
# `PrivateKeyInfo` — the same key an armored PEM carries, without the
# `-----BEGIN … PRIVATE KEY-----` label wrapped around it.
#
# This is the probe that showed the scan was checking the wrong thing. Matching
# the armor AFTER decoding means matching a LABEL, and a label is exactly what an
# evader drops: `openssl pkcs8 -topk8 -nocrypt -outform DER | base64` produces a
# value with no armor anywhere, and the earlier form of this rule passed it. So
# the decoded BYTES are tested for private-key STRUCTURE — a SEQUENCE, the
# version INTEGER, the algorithm OID — and the label is now irrelevant to whether
# the finding fires.
