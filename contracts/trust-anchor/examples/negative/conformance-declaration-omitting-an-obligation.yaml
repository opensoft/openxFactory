# expected_failure: obligation-coverage-incomplete
# expected_failure_detail: carries no entry
# requirement: TA-R8
# VIOLATES TA-R8: a declaration covering seven of the eight obligations. The
# missing one is the dependent-binding enumeration — which is, of course, the one
# this realization has not done.
#
# That is the whole failure mode. An undeclared shortfall does not announce
# itself; it looks like a complete declaration with one row that was never
# written, and the obligation nobody declared is reliably the obligation nobody
# met. So the declaration is CLOSED over all eight and coverage is checked in both
# directions: a missing entry is refused, and so is an entry naming an obligation
# this capability does not have.
#
# The ratified text treats the silence itself as non-conformance, even where the
# identical shortfall, declared, would have been conformant — and declaring it
# afterwards does not validate the claims made while it was silent.
