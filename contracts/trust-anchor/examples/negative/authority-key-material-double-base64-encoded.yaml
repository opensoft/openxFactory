# expected_failure: key-material-reversibly-encoded
# expected_failure_detail: base64-then-base64
# requirement: TA-R7
# VIOLATES TA-R7 by adding a second wrapper. One decode leaves base64 rather than
# key material, so a single-layer scan sees a long meaningless string and moves
# on — and `base64 -d | base64 -d` is not a harder recipe for a reader to follow
# than `base64 -d`.
#
# "Any encoding a reader can reverse" does not become two encodings a reader can
# reverse just because the wrapper was applied twice. The scan reverses a second
# layer for the same reason it reverses the first.
