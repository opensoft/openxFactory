# expected_failure: key-material-reversibly-encoded
# expected_failure_detail: PKCS#8 PrivateKeyInfo
# requirement: TA-R7
# VIOLATES TA-R7 with the armor removed AND the encoding changed. Hex of the same
# unarmored PKCS#8 structure — the combination that gets reached for once base64
# is known to be scanned.
#
# It carries its own probe because the two evasions are independent: an
# armor-dependent scan misses this whatever encoding it reverses, and an
# encoding-specific scan misses it whatever structure it looks for. Both halves
# have to be right at once, which is why both halves have a fixture.
