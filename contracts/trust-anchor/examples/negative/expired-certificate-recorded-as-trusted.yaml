# expected_failure: certificate-outside-validity-trusted
# expected_failure_detail: state is 'expired'
# requirement: TA-R6
# VIOLATES TA-R6's at-use principle for the state the rule forgot. Standing was
# checked at use and came back active, the chain terminates in a held anchor, and
# the certificate's own state is `expired`. The evaluation reads `trusted`.
#
# The at-use rule was written for REVOCATION and stopped there, so `expired` — the
# ordinary end of a certificate's life, and the one that arrives without anybody
# doing anything — passed. The refusal vocabulary has reserved
# `certificate_outside_validity` all along; nothing produced it. A standing check
# that returns "not revoked" is not a statement that the certificate is inside its
# validity window, and reading it as one is how an expired certificate keeps
# working until something else refuses it.
