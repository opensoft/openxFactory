# expected_failure: issuance-evidence-absent-trusted
# expected_failure_detail: answered UNANSWERED, not yes
# requirement: TA-R2
# VIOLATES TA-R2: a certificate with no issuance evidence, recorded as trusted.
#
# The record is otherwise honest — it even says the question is unanswered and
# the certificate is a revocation candidate — and then trusts it anyway. That
# combination is the actual failure mode: the absence gets written down and then
# not acted on, because everything else about the certificate looks fine.
#
# "Should this exist?" is answered UNANSWERED, not yes, and unanswered is not a
# basis for trust.
