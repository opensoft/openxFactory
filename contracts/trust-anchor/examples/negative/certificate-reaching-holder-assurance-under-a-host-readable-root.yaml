# expected_failure: chain-custody-not-monotone
# expected_failure_detail: READABLE BY THE USING HOST
# requirement: TA-R3
# VIOLATES TA-R3's derivation ONE LEVEL UP. The certificate's own custody is
# impeccable — isolated from the using host, each use authorized outside it — so
# every record-local rule passes and it reads `named_holder` at the top of the
# ladder. It chains to `anchor:partner-readable-root`, whose private key its
# operator keeps as a readable file.
#
# Anything with read access to that host can issue a certificate for this subject,
# anywhere, indefinitely. So "the NAMED HOLDER acted" is not something this
# certificate can evidence, whatever its own key custody is: the leaf's custody
# bounds it from below and the chain bounds it from above. The anchor's declared
# R7 shortfall stays conformant — this is what it COSTS at point of use, which is
# the ratified answer to "does a declared gap cost anything".
