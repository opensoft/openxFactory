# expected_failure: revoked-certificate-trusted
# expected_failure_detail: standing is checked at USE
# requirement: TA-R6
# VIOLATES TA-R6: a revoked certificate recorded as trusted, on a standing check
# that came back active.
#
# The record contradicts itself and the contradiction is easy to produce: the
# standing check was performed against a cached or stale source, so the answer it
# returned was about the certificate at issuance rather than the certificate now.
# The certificate's own state says revoked. Issuance-time validity is not evidence
# of current standing, and a check that returns the wrong answer does not become
# the right answer by being recorded.
