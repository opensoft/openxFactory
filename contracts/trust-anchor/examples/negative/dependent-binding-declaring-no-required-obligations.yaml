kind: xfactory_certificate_dependent_binding
binding_id: bind:neg-obligation-silent
certificate_ref: cert:core-service-01
holding_system:
  system_ref: system:core-quiet-consumer
  inside_family: true
  statement: >-
    A consumer that authenticates with this certificate's key and declines to
