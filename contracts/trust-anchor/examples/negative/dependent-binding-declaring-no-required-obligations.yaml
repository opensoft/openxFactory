# expected_failure: schema
# expected_failure_detail: 'required_obligations' is a required property
# requirement: TA-R8
# VIOLATES TA-R8's point-of-use half, and it is the loophole the design NAMES:
# declare every obligation `cannot`, then make sure no binding ever says which
# obligations it depends on, and the declaration costs nothing anywhere.
#
# An adversarial review ran exactly that — all eight obligations `cannot`,
# `required_obligations` deleted from every binding — and the corpus stayed green.
# A declared gap is only a refusal if something at the point of use names the
# obligation it needs, so `required_obligations` is REQUIRED and non-empty. A
# binding that depends on nothing beyond the anchor framing still says so by
# naming TA-R1; what it may not do is decline to answer.
#
# Pinned to `schema` with the message as its detail, because the guarantee IS the
# shape: a binding that cannot be authored is stronger than one authored and then
# refused. It also fires `dependent-binding-unenumerated`, since a certificate
# that enumerated it would already be tracking it.
