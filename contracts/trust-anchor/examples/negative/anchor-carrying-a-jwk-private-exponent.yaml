# expected_failure: key-material-embedded
# expected_failure_detail: private exponent 'd'
# requirement: TA-R7
# VIOLATES TA-R7: the same refusal reached by the other route key material
# actually travels — a serialized JWK carrying its private exponent.
#
# Because every object in this family is closed, a JWK cannot arrive as
# structured data at all; it can only arrive as a STRING, which is precisely
# where a name-based scan would not be looking. `d` alone is far too generic a
# key to blocklist, but alongside `kty` it is unambiguous.
