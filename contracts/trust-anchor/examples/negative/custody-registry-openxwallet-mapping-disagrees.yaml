# expected_failure: custody-openxwallet-mapping-mismatch
# expected_failure_detail: cannot disagree about the same question
# requirement: TA-R3
# VIOLATES TA-R3's composition clause: a member claiming to be an openxWallet
# custody model whose declared booleans are not that model's.
#
# The ratified text says this contract COMPOSES with openxWallet's custody rule
# rather than restating a second custody model. A mapping nobody checks is how
# the second model arrives anyway: one registry drifts, both keep their labels,
# and a consumer reading either one gets a different answer to the same question.
# So the mapping is resolved against the canonical openxWallet registry AT RUN
# TIME and the booleans must agree.
schema_version: 1
kind: xfactory_trust_anchor_chain_custody_registry
registry_id: trust-anchor-chain-custody-probe
registry_version: 1
assurance_levels:
  - id: host_attributed_act
    rank: 1
    statement: An act attributed to the using host, reviewed before effect.
  - id: holder_attributed_act
    rank: 2
    statement: An act attributed to the named holder, with nothing else in the way.
custody_models:
  - id: host_held
    title: host held
    key_readable_by_using_host: true
    use_requires_authorization_outside_using_host: false
    evidences: using_host
    openxwallet_custody_model: holder_readable
    evidences_statement: Probe member; see the fixture comment for what it violates.
    assurance_ceiling: host_attributed_act
  - id: host_isolated_per_use_authorized
    title: host isolated per use authorized
    key_readable_by_using_host: false
    use_requires_authorization_outside_using_host: true
    evidences: named_holder
    openxwallet_custody_model: isolated_invocable
    evidences_statement: Probe member; see the fixture comment for what it violates.
    assurance_ceiling: holder_attributed_act
undeclared_custody_resolves_to: host_held
