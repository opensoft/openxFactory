# recording itself as authorized anyway.
#
# Authorization is DERIVED from the anchor's admitted set, never asserted by the
# record that would benefit from asserting it. The honest version of this record
# exists in the positive corpus and says `unauthorized`; that is what makes the
# finding actionable rather than invisible. Compare the certificate that carries
# it: the certificate's own validity does not ratify an unauthorized issuance
# retroactively.
