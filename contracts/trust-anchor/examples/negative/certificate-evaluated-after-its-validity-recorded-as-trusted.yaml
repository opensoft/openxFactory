# expected_failure: certificate-outside-validity-trusted
# expected_failure_detail: after this certificate's own validity ended
# requirement: TA-R6
# VIOLATES TA-R6's at-use principle by the CLOCK rather than by the state field.
# The state still says `valid` — nothing has updated it — and the evaluation
# happened five days after the certificate's own `not_after`.
#
# The state field is a record somebody maintains; the validity window is
# arithmetic on the record's own fields. Keying the rule only on `state` would
# make it depend on the maintenance nobody did, which is exactly the condition
# under which an expired certificate keeps being trusted. The comparison uses the
# record's OWN moments — `evaluated_at` and the standing check's `checked_at` —
# never the wall clock, so the record stays a stable statement about a moment
# rather than a claim that decays into a finding the day after it is written.
