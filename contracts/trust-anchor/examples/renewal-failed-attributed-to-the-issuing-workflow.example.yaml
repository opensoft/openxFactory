# VALID renewal recorded as FAILED, with the failure attributed to the ISSUING
# WORKFLOW. The authority issued successfully; one of the two dependents was
# re-bound and evidenced and the other was not, so the renewal is not complete —
# and the thing that failed is the workflow that changed the key, not the mesh
# that stopped authenticating.
#
# The attribution is a constant in the shape: there is no field in which to
# record this as the dependent's failure. That is deliberate. Attributing the
# outage to the dependent produces an incident report that teaches nothing, a fix
# that is a re-bind with no obligation attached, and a guarantee of recurrence at
# the next renewal.
