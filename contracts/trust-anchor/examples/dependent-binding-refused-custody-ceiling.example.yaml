# VALID dependent binding recorded as REFUSED because the assurance it requires
# exceeds what the certificate's declared custody supplies. This is the ratified
# scenario recorded correctly: the refusal NAMES THE CUSTODY CEILING, and it says
# nothing about the certificate's contents — the certificate is perfectly
# well-formed and that was never the question.
#
# Raising this to admitted requires changing CUSTODY (a key with a per-use
# authorization the host cannot supply), not re-asserting the claim.
schema_version: 1
kind: xfactory_certificate_dependent_binding
binding_id: bind:managed-device-05-attested-signing
certificate_ref: cert:managed-device-05
