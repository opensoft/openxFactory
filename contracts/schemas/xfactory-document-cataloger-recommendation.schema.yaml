$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "xfactory-document-cataloger-recommendation.schema.yaml"
title: "Document-cataloger immutable recommendation evidence"
contract_schema_version: 1
description: >-
  Immutable evidence artifact persisted after validating the output of one
  bounded, read-only `document-cataloger` Omnigent job (spec requirement
  "Bounded cataloger execution and protected evidence"): one file per job
  at `health/document-catalog/recommendations/YYYY-MM-DD/<job-id>.yaml`
  with `status: record`. One job classifies one bounded shard, so a single
  record carries one `entries` item per shard document; a later main run
  validates and merges eligible entries into a new
  `xfactory-document-catalog-snapshot.schema.yaml` document (spec scenario
  "Recommendation arrives asynchronously") — this file is never itself the
  merged catalog. Every facet is unconditionally `state: suggested` (spec:
  "Model output SHALL be suggested, never approved"); the shared
  `facet_assignment` shape is reused from the snapshot schema and narrowed
  here rather than restated, so a merge can carry an entry's facets
  forward byte-for-byte. Job-level classifier provenance needs no block of
  its own: the spec places taxonomy digest, classifier, model, and prompt
  versions on every inferred facet (spec requirement "Controlled
  classification facets and provenance"), which the shared shape already
  carries.
type: object
additionalProperties: false
required: [schema_version, kind, status, job_id, as_of, entries]
properties:
  schema_version: {const: 1}
  kind: {const: xfactory_document_catalog_recommendation}
  status: {const: record}
  job_id:
    type: string
    minLength: 1
    description: >-
      The dispatching job's id — the `<job-id>` in this record's
      contract-mandated persistence path, echoed inside the artifact.
  as_of: {type: string, format: date}
  entries:
    type: array
    minItems: 1
    items: {$ref: "#/$defs/recommendation_entry"}
$defs:
  recommendation_entry:
    type: object
    additionalProperties: false
    description: >-
      One shard document's suggested classification, bound to one content
      state via the canonical locator plus `content_hash` so a later merge
      can discard a stale entry (spec: weekly reconciliation checks
      "stale recommendations"; carry-forward keys on locator and content
      hash). The locator kernel admits the opaque variant because the
      output-policy filter MAY replace a path with an opaque document
      reference plus path hash before persistence (spec scenario
      "Protected source is classified").
    required: [repo, content_hash, facet_assignments]
    properties:
      repo: {type: string, minLength: 1}
      path: {type: string, minLength: 1}
      document_ref: {type: string, pattern: "^[0-9a-f]{64}$"}
      path_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
      content_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
      facet_assignments:
        type: array
        minItems: 1
        description: >-
          Suggested-only facet output. Each item satisfies the snapshot
          schema's shared `facet_assignment` shape (vocabularies,
          provenance, transitions) with two additional narrowings that
          shape alone cannot express by reuse: `state` is fixed to
          `suggested`, and `review` may only be null (spec: model output
          is never `reviewed` or `overridden` directly; a disposition
          requires a separate authorized owner-override step downstream
          of this record).
        items:
          allOf:
            - $ref: "xfactory-document-catalog-snapshot.schema.yaml#/$defs/facet_assignment"
            - required: [state]
              properties:
                state: {const: suggested}
                review: {type: "null"}
    allOf:
      - $ref: "xfactory-document-opaque-locator.schema.yaml#/$defs/document_locator"
