$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "crystallization-build.schema.yaml"
title: "Crystallization build record (ordinary governed job; gapless provenance)"
contract_schema_version: 1
description: >-
  The governed build job profile and acceptance record
  (add-crystallizer-contracts, requirements "Builds Are Ordinary Governed
  Jobs", "Provenance Chains Without Gaps", "Dry-Run And Leak Scan Are
  Build Acceptance Criteria", "Builds Run Under Budget Caps With Declared
  Abort"). A build is a normal `crystallization_build` job executed by
  codexFactory for every consuming domain (the consuming domain owns
  fitness gates); acceptance requires the corpus green, a demonstrated
  dry-run mode, a clean generated-artifact leak scan, and the reviewed
  authority binding; the provenance manifest pins episodes, corpus, spec,
  builder, and toolchain so capability -> spec -> corpus -> episodes
  resolves without a gap; maintenance is regeneration-first.
  Artifact-residence guidance (task 3.3, the staged rung->home lean):
  residence MUST be declared with the digest — recommended homes are a
  workflow-contract instance in the owning domain repo for L3 playbooks,
  the domain's Omnigent overlay profiles for L4 specialists, and a
  `capabilities/<capability-id>/` tree in the owning domain repo for
  L5/L6 programs (executed on governed benches via the install layer;
  residence never implies invocability — dispatch is the only entry).
  Canonical validator: scripts/validate-crystallizer-contracts.py.
type: object
additionalProperties: false
required:
  - schema_version
  - kind
  - job_type
  - spec_ref
  - consuming_domain
  - budget
  - acceptance
  - provenance_manifest
  - artifact
properties:
  schema_version:
    const: 1
  kind:
    const: crystallization_build
  job_type:
    const: crystallization_build
  spec_ref:
    type: string
    pattern: "^cspec:"
  consuming_domain:
    type: string
    minLength: 1
  budget:
    type: object
    additionalProperties: false
    required: [cap, abort]
    properties:
      cap:
        type: number
        exclusiveMinimum: 0
      abort:
        type: string
        minLength: 1
  acceptance:
    type: object
    additionalProperties: false
    required: [corpus_green, dry_run_proven, leak_scan_clean, binding_reviewed]
    properties:
      corpus_green:
        type: boolean
      dry_run_proven:
        type: boolean
      leak_scan_clean:
        type: boolean
      binding_reviewed:
        type: boolean
  provenance_manifest:
    type: object
    additionalProperties: false
    required: [episodes, corpus_digest, spec, builder, toolchain]
    properties:
      episodes:
        type: array
        minItems: 1
        items:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
      corpus_digest:
        type: string
        pattern: "^sha256:[0-9a-f]{64}$"
      spec:
        type: object
        additionalProperties: false
        required: [id, digest]
        properties:
          id:
            type: string
            pattern: "^cspec:"
          digest:
            type: string
            pattern: "^sha256:[0-9a-f]{64}$"
      builder:
        type: object
        additionalProperties: false
        required: [identity, version]
        properties:
          identity:
            type: string
            minLength: 1
          version:
            type: string
            minLength: 1
      toolchain:
        type: object
        additionalProperties: false
        required: [bench_pins]
        properties:
          bench_pins:
            type: string
            minLength: 1
  artifact:
    type: object
    additionalProperties: false
    required: [digest, packaging, residence]
    properties:
      digest:
        type: string
        pattern: "^sha256:[0-9a-f]{64}$"
      packaging:
        enum: [playbook, profile, program]
      residence:
        type: string
        minLength: 1
  actuals:
    type: object
    additionalProperties: false
    properties:
      spent:
        type: number
      aborted:
        type: boolean
    description: "Returned for calibration; present once the build ran."
