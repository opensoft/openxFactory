schema_version: 1
name: xfactory_credential_contracts
description: >-
  Canonical shapes of the five credential contract record kinds promoted
  from OpsxFactory evidence (promote-credential-contracts change; DTN-004):
  credential requirements, runtime capability grant, credential binding,
  credential broker contract, and credential audit policy. Domain content —
  credential families, scopes, workflow and action names, providers — is
  domain-local; this schema constrains shape only. The semantic invariants
  (no raw secrets to workers, short-lived scoped grants, audit and
  revocation) are owned by docs/credential-access-model.md.
type: object
required:
  - schema_version
  - kind
oneOf:
  - properties:
      kind:
        const: xfactory_credential_requirements
      domain:
        type: object
        required: [id]
        properties:
          id: {type: string}
          product_name: {type: string}
      requirements:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - id
            - purpose
            - access_mode
            - requires_domain_approval
            - requires_human_approval
            - max_grant_minutes
            - audit_required
          properties:
            id: {type: string}
            purpose: {type: string}
            access_mode:
              type: string
              description: >-
                THE DISCRIMINATOR THE SHARED-SECRET LIFT TURNS ON, DECLARED AS A
                VOCABULARY HERE AND CLOSED AT THE NEXT MAJOR
                (add-binding-consumer-identity §1.4). The declared members are
                `dispatch_only`, `contents_write`, `workload_identity` and
                `delegated_api` — the values already in the wild; adding one is
                its own additive act. It is typed as an unconstrained string on
                THIS major because closing it would refuse a value the current
                major accepts, which is the breaking class however sensible the
                vocabulary looks: a variant spelling and an absent mode both
                validate today. The canonical validator warns
                `consumer-access-mode-vocabulary` on a value outside the
                vocabulary for the whole of this minor, and treats an unreadable
                mode as making the lift UNAVAILABLE rather than satisfied — an
                entry that cannot answer the question is not a matching entry.
                The `enum` lands at the major with the rest of the acts named in
                docs/contract-versioning-policy.md § Deprecations Currently In
                Force.
            allowed_workflows:
              type: array
              items: {type: string}
            minimum_scopes:
              type: array
              items: {type: string}
            requires_domain_approval: {type: boolean}
            requires_human_approval: {type: boolean}
            max_grant_minutes: {type: integer}
            audit_required: {type: boolean}
            issuance_preconditions:
              type: object
              minProperties: 1
              additionalProperties: false
              description: >-
                Governed conditions that must hold at the MINT SURFACE before a
                grant is issued against this requirement (add-client-identity-roster,
                Decision B). A CLOSED vocabulary: the mechanism existed as a
                domain-local extra key riding a neutral schema that neither
                declared nor forbade it, so a refusal had no neutral home to be
                declared against. Every value is `const: true` because a
                precondition is DECLARED or NOT DECLARED — `false` is not a
                second meaning, it is a declaration that reads as governance
                while asserting nothing. Declaring nothing at all leaves a
                requirement record valid: the property is optional and this
                growth is purely additive.
              properties:
                accepted_request_required:
                  const: true
                  description: >-
                    The grant issues only against an ACCEPTED client-infrastructure
                    request (adopt-deployment-handoff-boundary: issuance is the
                    authoritative gate, because the request is where acceptance
                    is recorded).
                registered_active_subject:
                  const: true
                  description: >-
                    The request's target resolves to a REGISTERED, ACTIVE subject
                    in the client's service-subject registry
                    (adopt-deployment-handoff-boundary: the registry lookup happens
                    where the credential is born, there being no dispatch-time
                    checker service).
                roster_drift_clear_required:
                  const: true
                  description: >-
                    No OPEN client-identity drift finding
                    (`xfactory_client_identity_drift_finding`) stands against the
                    identity this grant would serve — the one lever that stops a
                    drifted identity receiving fresh credentials without mutating
                    anything in the client's estate.
    required: [kind, domain, requirements]
  - properties:
      kind:
        const: xfactory_runtime_capability_grant_template
      runtime_capability_grant:
        type: object
        required:
          - id
          - job_id
          - domain
          - requirement_id
          - issued_by
          - approved_by
          - expires_at
          - audit_ref
        properties:
          id: {type: string}
          job_id: {type: string}
          client_id: {type: string}
          domain: {type: string}
          requirement_id: {type: string}
          issued_by: {type: string}
          approved_by: {type: string}
          customer_ref: {type: string}
          allowed_workflows:
            type: array
            items: {type: string}
          allowed_actions:
            type: array
            items: {type: string}
          expires_at: {type: string}
          audit_ref: {type: string}
    required: [kind, runtime_capability_grant]
  - properties:
      kind:
        const: xfactory_credential_binding_template
      client:
        type: object
        required: [id]
        properties:
          id: {type: string}
          display_name: {type: string}
      credential_bindings:
        type: object
        minProperties: 1
        description: >-
          THE MAP KEY IS THE REQUIREMENT ID THE BINDING RESOLVES, and from the
          next major it carries the identity-brokering identifier grammar
          (`^[A-Za-z0-9][A-Za-z0-9._:/-]*$`, 1–200 characters) —
          add-binding-consumer-identity §1.3. The key was a CONVENTION before
          that change and nothing enforced it, which is why the shared-secret
          lift's sixth condition (a `consumer.requirement_ref.requirement_id`
          equal to its own binding's key) needs the grammar to stop the key
          being a shape the comparison cannot express. The grammar is NOT
          imposed on this major: the map accepts arbitrary keys today —
          `corpus content write`, `m365-admin (legacy)`, `_leading_underscore`
          and `sync.lane#1` all validate — so imposing it here would refuse four
          shapes the current major accepts, which is the breaking class. The
          canonical validator warns `consumer-binding-key-grammar` for the whole
          of this minor and the `propertyNames` constraint lands at the major
          with the other acts named in docs/contract-versioning-policy.md
          § Deprecations Currently In Force. The sixth lift condition is
          unaffected at this minor: it compares the reference's id to the key as
          a STRING, which needs no grammar to be equal.
        additionalProperties:
          type: object
          required: [provider, secret_ref, owner, rotation_policy]
          properties:
            provider: {type: string}
            vault: {type: string}
            secret_ref: {type: string}
            owner: {type: string}
            rotation_policy: {type: string}
            consumer:
              description: >-
                WHO HOLDS THIS BINDING AND WHAT IT AUTHENTICATES TO THE STORE
                WITH — the per-system authority made a RECORD FACT rather than
                an assertion about the estate (add-binding-consumer-identity;
                the successor add-notebook-hosting-credential-custody named five
                times and could not perform itself). Optional on this major.

                DECLARED HERE, CONSTRAINED AT THE NEXT MAJOR — and the
                declaration is the point. This key was already writable: the
                binding object is not closed, so a `consumer:` value of ANY
                shape passed this schema before it was declared, unenforceable
                and invisible to every consumer of this contract. Declaring it
                gives the hole a name, a meaning and a warning. CONSTRAINING it
                is the breaking half: `type: object`, `required:
                [holder_ref, fetch_identity]`, `additionalProperties: false` and
                the members' `pattern` each refuse a shape THIS major accepts —
                a locally shaped object carrying neither identifier, a scalar, a
                list, an undeclared extra member, a placeholder-styled value —
                so every one of them waits for the next major and lands there
                together, behind one deprecation window and the NINE warning
                codes the canonical validator emits for the whole of this minor.
                A release that imposed any of them while calling itself additive
                would be a narrowing wearing an additive label.

                MEMBERS, described here and enforced there:

                  holder_ref
                    The CONSUMING SYSTEM that holds this binding, spelled in
                    identity-brokering's own `holder_ref` grammar (the
                    `credential_reference` block of
                    contracts/identity-brokering/*.schema.yaml, shipped and
                    digest-pinned since contract-v1.37) — for example
                    `opsx:service-subject:aks-opensoft-qa`. A CONSUMING SYSTEM
                    IS NOT A PERSONA and SHALL NOT be spelled as one: a
                    workload, agent, job or service is kept out of the persona
                    population by `add-identity-brokering`'s "Workloads are not
                    personas", and its authority comes from credential-contracts
                    grants and openxwallet holders instead. A wallet-carrying
                    governed actor MAY be named by its wallet's identifier; a
                    wallet reference is an admissible VALUE and never the
                    required type, because the wallet family is consumed at a
                    pin here rather than owned and most consumers of a binding
                    carry no wallet at all.
                  fetch_identity
                    The identity that consuming system USES TO AUTHENTICATE to
                    the secret store — promoted credential-contracts' own
                    "fetch-identity identifier", the second of the two things a
                    consuming lane receives. The first, the opaque secret
                    reference, is `secret_ref` above; this shape carried it and
                    not its partner until now.
                  identity_namespace
                    The ISSUING DIRECTORY, ACCOUNT OR TENANT WITHIN THE PROVIDER
                    that minted `fetch_identity` — an Entra tenant, a cloud
                    account, a vault namespace — in the same identifier grammar
                    (add-consumer-identity-namespace). OPTIONAL, and additive: a
                    principal name is unique only inside the directory that
                    issued it, so two tenants of ONE provider may both call a
                    principal `runtime_identity` and, until this member existed,
                    the record had no way to say so. WHERE BOTH SIDES OF A
                    COMPARISON DECLARE ONE, the shared-authority check compares
                    the PAIR (identity_namespace, fetch_identity); where either
                    is absent or ungrammatical it FALLS BACK to the bare
                    identity and still REPORTS, so an estate cannot silence a
                    real shared authority by omitting a member. NOT spelled
                    `tenant` or `tenant_ref` — adopt-subject-tenant-domain-
                    vocabulary reserves that word for the tenant-operator layer
                    (contracts/policies/layer-vocabulary.yaml) — and not
                    `realm`, which is one product's word for this idea. Like
                    every other member it is UNCONSTRAINED at this minor and
                    carries the grammar at the major, warned until then by
                    `consumer-identity-namespace-grammar`.
                  requirement_ref
                    QUALIFIED, never a bare id: an object of `requirement_id`
                    plus `requirements_document_ref`, the shape
                    identity-brokering already ships for this pointer. A bare id
                    resolves ambiguously — this schema imposes no
                    repository-wide uniqueness on a requirement `id` while the
                    canonical validator scans a whole `credentials/` tree, so
                    one id may match records with DIFFERENT access modes. The
                    document reference is REPOSITORY-RELATIVE, carries no
                    leading `/`, no `..` segment and no foreign-repository
                    prefix, and ends `.yaml` or `.yml`; it resolves ONLY against
                    requirement records the validator itself discovered and
                    schema-checked in the tree under validation, and THE
                    VALIDATOR NEVER OPENS A PATH TAKEN FROM A RECORD.
                  shared_credential_acknowledged
                    A DECLARED-OR-ABSENT token whose only valid value is `true`,
                    on the reasoning `issuance_preconditions` states in this
                    same schema: a precondition is DECLARED or NOT DECLARED, and
                    `false` is not a second meaning but a declaration that reads
                    as governance while asserting nothing. It is one of the six
                    conditions that can lift the shared-secret refusal; a
                    false-valued token never lifts anything at either release.
                  instantiation_stub
                    The same const-true form, declaring that this record is a
                    STUB written before any install, vault or fetch identity
                    exists. It is THE EXEMPTION from the omission warning and
                    from the major's requiredness, and it is a TOKEN rather than
                    a `*.template.yaml` FILENAME on purpose: a filename is
                    author-chosen, invisible in the bytes a pinned consumer
                    validates, and UNREACHABLE by a pinned schema, so a
                    filename-keyed exemption could never reach the layer where
                    the refusal lands and would let a record carrying live
                    values escape a required field by what it is called. A stub
                    SHALL NOT instead satisfy the field with a placeholder: a
                    grammar-passing sentinel reads as an authority declaration
                    while naming nothing, and scaffolding that manufactures
                    conformance is worse than scaffolding that omits it. The
                    domain-starter generator emits exactly
                    `consumer: {instantiation_stub: true}` for this reason.

                WHAT THE DECLARATION BUYS AND WHAT IT DOES NOT. It makes
                revocation of ACCESS readable: which grant to revoke and whose
                future fetches stop become a lookup rather than an inference,
                and the store's access log becomes reconcilable against a
                declaration. It does NOT un-share a bearer secret already
                fetched — evicting a consumer that holds the secret still
                requires ROTATION, which reaches every consumer of that
                identity — and it does not prove the store's grant matches the
                declaration; where the two disagree the store governs. AND IT
                PUBLISHES, in one object beside `vault` and `secret_ref`, which
                principal reaches which secret. That is the same fact read from
                two sides, it is stated rather than omitted, and it is why a
                PACKAGED fixture carries synthetic identifiers while live ones
                stay in the consuming installs' own credential trees.
    required: [kind, client, credential_bindings]
  - properties:
      kind:
        const: xfactory_credential_broker_contract
      broker:
        type: object
        required: [id, resolves, issues, must, must_not]
        properties:
          id: {type: string}
          resolves:
            type: array
            minItems: 1
            items: {type: string}
          issues:
            type: array
            minItems: 1
            items: {type: string}
          must:
            type: array
            minItems: 1
            items: {type: string}
          must_not:
            type: array
            minItems: 1
            items: {type: string}
    required: [kind, broker]
  - properties:
      kind:
        const: xfactory_credential_audit_policy
      audit:
        type: object
        required: [required, minimum_fields]
        properties:
          required: {type: boolean}
          minimum_fields:
            type: array
            minItems: 1
            items: {type: string}
    required: [kind, audit]
