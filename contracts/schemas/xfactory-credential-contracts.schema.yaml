schema_version: 1
name: xfactory_credential_contracts
description: >-
  Canonical shapes of the five credential contract record kinds promoted
  from OpsxFactory evidence (promote-credential-contracts change; DTN-004):
  credential requirements, runtime capability grant, credential binding,
  credential broker contract, and credential audit policy. Domain content —
  credential families, scopes, workflow and action names, providers — is
  domain-local; this schema constrains shape only. The semantic invariants
  (no raw secrets to workers, short-lived scoped grants, audit and
  revocation) are owned by docs/credential-access-model.md.
type: object
required:
  - schema_version
  - kind
oneOf:
  - properties:
      kind:
        const: xfactory_credential_requirements
      domain:
        type: object
        required: [id]
        properties:
          id: {type: string}
          product_name: {type: string}
      requirements:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - id
            - purpose
            - access_mode
            - requires_domain_approval
            - requires_human_approval
            - max_grant_minutes
            - audit_required
          properties:
            id: {type: string}
            purpose: {type: string}
            access_mode: {type: string}
            allowed_workflows:
              type: array
              items: {type: string}
            minimum_scopes:
              type: array
              items: {type: string}
            requires_domain_approval: {type: boolean}
            requires_human_approval: {type: boolean}
            max_grant_minutes: {type: integer}
            audit_required: {type: boolean}
    required: [kind, domain, requirements]
  - properties:
      kind:
        const: xfactory_runtime_capability_grant_template
      runtime_capability_grant:
        type: object
        required:
          - id
          - job_id
          - domain
          - requirement_id
          - issued_by
          - approved_by
          - expires_at
          - audit_ref
        properties:
          id: {type: string}
          job_id: {type: string}
          client_id: {type: string}
          domain: {type: string}
          requirement_id: {type: string}
          issued_by: {type: string}
          approved_by: {type: string}
          customer_ref: {type: string}
          allowed_workflows:
            type: array
            items: {type: string}
          allowed_actions:
            type: array
            items: {type: string}
          expires_at: {type: string}
          audit_ref: {type: string}
    required: [kind, runtime_capability_grant]
  - properties:
      kind:
        const: xfactory_credential_binding_template
      client:
        type: object
        required: [id]
        properties:
          id: {type: string}
          display_name: {type: string}
      credential_bindings:
        type: object
        minProperties: 1
        additionalProperties:
          type: object
          required: [provider, secret_ref, owner, rotation_policy]
          properties:
            provider: {type: string}
            vault: {type: string}
            secret_ref: {type: string}
            owner: {type: string}
            rotation_policy: {type: string}
    required: [kind, client, credential_bindings]
  - properties:
      kind:
        const: xfactory_credential_broker_contract
      broker:
        type: object
        required: [id, resolves, issues, must, must_not]
        properties:
          id: {type: string}
          resolves:
            type: array
            minItems: 1
            items: {type: string}
          issues:
            type: array
            minItems: 1
            items: {type: string}
          must:
            type: array
            minItems: 1
            items: {type: string}
          must_not:
            type: array
            minItems: 1
            items: {type: string}
    required: [kind, broker]
  - properties:
      kind:
        const: xfactory_credential_audit_policy
      audit:
        type: object
        required: [required, minimum_fields]
        properties:
          required: {type: boolean}
          minimum_fields:
            type: array
            minItems: 1
            items: {type: string}
    required: [kind, audit]
