$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "project-register.schema.yaml"
title: "Project register: repository -> project -> project-group navigation hierarchy"
contract_schema_version: 1
description: >-
  Declares the family's descriptive repos -> projects -> project-groups
  navigation hierarchy for the ideation-area dashboard
  (`add-ideation-dashboard`; promoted spec requirement "Project grouping
  hierarchy"; design decision D10). The SCHEMA is neutral and lives in
  openxFactory, but the INSTANCE is owned by the aggregation/workspace
  layer — the layer that already owns which repositories assemble together
  (for example, the xFactory aggregation repo's instance spans the nine
  family repos) — never openxFactory itself, which defines only this
  contract.

  The ideation-dashboard snapshot generator consumes this register
  READ-ONLY, resolving each snapshot's `repository` through it into
  `project` and `project_group` fields (`ideation-dashboard-snapshot.schema.yaml`);
  renderers read that resolved grouping from the snapshot only, never from
  this register directly (spec: "renderers read grouping from the
  snapshot, never the register directly").

  Grouping is descriptive navigation only: membership here confers no
  lifecycle state and no authority over the repositories, projects, or
  groups it names — it is a map, not a governance boundary. A repository
  absent from this register is legal and renders ungrouped, as its own
  implicit project, rather than failing the dashboard (spec scenario "A
  repository is absent from the register").

  THE SCHEMA-ELECTION FIELDS ARE GOVERNED BY THAT SAME POSTURE, UNCHANGED
  (`add-project-repo-schema`). A project MAY declare `schema` — the project
  repository schema it elected — `reference` — the document that election
  followed, the staged fragment's path before ratification and the ratified
  `docs/project-repo-schema.md` after — and `repository_roles`, assigning
  repositories it already lists a `role` of `spec`, `code` or `assembly`.
  All three are OPTIONAL and ADDITIVE: a project declaring none of them is
  legal, renders identically and is reviewed identically. NEITHER `schema`
  NOR `reference` NOR A `role` CONFERS lifecycle state, authority, gate
  standing or clearance eligibility over any repository, project or group
  it names, and a consumer deriving any permission from one is DEFECTIVE.
  These are exactly the fields a later consumer reads as permission, which
  is why the posture is restated here rather than left to the paragraph
  above — the ratified doctrine of `add-wallet-carried-review-authority` is
  that "Electing the schema changes no gate, no floor, no grant, and no
  clearance eligibility", and this register is bound by it.

  `repositories` STAYS THE SINGLE MEMBERSHIP ANSWER and is unchanged: it
  remains an array of repository-id STRINGS, because
  `scripts/ideation_dashboard/register.py` and every renderer downstream of
  the snapshot read those items as strings, and widening the schema does not
  widen the readers. `repository_roles` therefore ADDS roles beside
  membership rather than retyping it.

  WHERE AN ELECTING PROJECT CARRIES ITS OWN ASSEMBLY-ROOT MANIFEST, THE ROW
  IS DERIVABLE FROM IT AND THE MANIFEST IS THE SOURCE; this register stays
  descriptive and is never the origin of an election. The direction is what
  lets an organisation with no aggregation and no register still be
  conformant.

  ADDITIONAL VALIDATOR-SIDE RULES for these fields (checked by
  `scripts/validate-ideation-dashboard-contracts.py`, not by this shape):
  every `repository_roles[].repository` MUST also appear in that project's
  `repositories`; a repository MUST NOT be assigned a role twice within one
  project; at most one repository per project may carry `role: assembly`;
  and `reference` MUST NOT be declared without `schema`.

  VALIDATOR-SIDE RULES this schema cannot express structurally (checked by
  the register validator, not by this shape): every `id` (project and
  project-group) is unique within the register; every project id named by
  a `project_groups[].projects` entry MUST exist among `projects[].id`;
  and a project belongs to at most one project group (the snapshot's
  `project_group` field is singular). REPOSITORY membership is
  MULTI-PARENT (Brett's 2026-08-06 ruling on `add-project-scoped-selection`,
  amending the original D10 single-parent reading): a repository MAY live
  in any number of projects — a project is a named VIEW over repositories,
  not an owner. The snapshot keeps its singular `project` field as the
  PRIMARY project (the first project in register order that declares the
  repository — deterministic, so grouping roll-ups render each repository
  under exactly one heading) and additionally carries the full additive
  `projects` list; selection scoping reads full membership from the
  register projection. The project->group half stays single-parent and is
  flagged here for the generator/orchestrator, since nothing in the shape
  below prevents authoring a project into more than one group.

  Forward-compatible / additive: consumers MUST ignore unknown properties.
  A later delta may extend project or project-group entries without a
  `schema_version` bump; only a breaking change (a removed or retyped
  field) requires one. This is why no object here sets
  `additionalProperties: false`.
type: object
required:
  - schema_version
  - kind
  - projects
properties:
  schema_version: {const: 1}
  # Normative kind literal from D10 ("kind: project-register"); hyphenated
  # per the design decision, not the underscored `xfactory_*` in-file kind
  # convention (same divergence as the sibling snapshot/workbench schemas).
  kind: {const: project-register}
  projects:
    type: array
    # MAY be empty (register not yet populated); each present entry MUST
    # NOT be empty of repositories — see $defs/project.
    items: {$ref: "#/$defs/project"}
  project_groups:
    type: array
    # Optional at the top level: a register may group repositories into
    # projects without yet rolling those projects into project groups.
    items: {$ref: "#/$defs/project_group"}
$defs:
  # --- a named set of repositories (D10) ---
  project:
    type: object
    required: [id]
    properties:
      id:
        type: string
        minLength: 1
        # Stable project id; project_groups reference this. MUST be unique
        # within the register (validator-side — see file description).
      name:
        type: string
        minLength: 1
        # Human display name; optional, `id` remains the reference.
      repositories:
        type: array
        # A project MAY be empty (Brett's 2026-08-06 ruling on
        # add-opendox-project-header, reversing the original task-2.6 rule):
        # a project is created first and gains members later through
        # edit-project commissions, so an empty set is a legal starting and
        # ending state. A repository id MAY appear under any number of
        # projects (multi-parent membership, same-day ruling — see the file
        # description; the first-declaring project in register order is the
        # snapshot's PRIMARY).
        #
        # UNCHANGED by `add-project-repo-schema`, deliberately: the items stay
        # STRINGS so every live reader keeps working, and roles are added
        # beside membership in `repository_roles` rather than by retyping this.
        items:
          type: string
          minLength: 1
          # A repository id (matches a snapshot's `repository` field).
      # --- the schema election (add-project-repo-schema) ---
      # All three OPTIONAL and ADDITIVE, and none of them confers anything —
      # see the posture paragraph in the file description, which governs them
      # unchanged.
      schema:
        type: string
        minLength: 1
        # The project repository schema this project elected, e.g.
        # `project-repo-schema`. The value set is DELIBERATELY NOT ENUMERATED:
        # closing an enumeration in the first change that opens it forecloses a
        # second schema nobody has proposed. It confers nothing.
      reference:
        type: string
        minLength: 1
        # The document the election followed — the staged fragment's path
        # before ratification, `docs/project-repo-schema.md` after. Recording
        # it is what makes a project started ahead of ratification legible
        # rather than undeclared. VALIDATOR-SIDE: MUST NOT appear without
        # `schema`, a reference to an election nobody declared naming nothing.
      repository_roles:
        type: array
        # Roles for repositories this project ALREADY lists in `repositories`.
        # Named for what it holds rather than for the shape that produced it:
        # a project that declined the schema has no "legs", and the register
        # must read identically for an electing and a declining project.
        items:
          type: object
          required: [repository, role]
          properties:
            repository:
              type: string
              minLength: 1
              # VALIDATOR-SIDE: MUST also appear in this project's
              # `repositories`, which stays the single membership answer.
            role:
              type: string
              enum: [spec, code, assembly]
              # VALIDATOR-SIDE: at most one `assembly` per project — an
              # electing project has exactly one per-project root. A consumer
              # reading `role: spec` as "spec authority lives here" is
              # DEFECTIVE; the register is a map, not a governance boundary.
  # --- a group of projects (D10) ---
  project_group:
    type: object
    required: [id, projects]
    properties:
      id:
        type: string
        minLength: 1
        # Stable project-group id; MUST be unique within the register
        # (validator-side — see file description).
      name:
        type: string
        minLength: 1
        # Human display name; optional.
      projects:
        type: array
        minItems: 1
        # An empty project group is invalid, same reasoning as an empty
        # project (task 2.6). VALIDATOR-SIDE (see file description): every
        # referenced id MUST exist among top-level `projects[].id`, and a
        # given project id MUST appear under at most one group
        # (single-parent D10 reading).
        items:
          type: string
          minLength: 1
          # A project id from the top-level `projects` array.
