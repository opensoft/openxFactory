$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "xfactory-workbench-chat-turn.schema.yaml"
title: "doxBench grounded chat turn (request / success / fixed failure)"
# 1 -> 2 at contract-v3.0, and this is the ONE integer that major moved. The
# v1 envelope trio left this file (retire-doxbench-chat-turn-v1), so an
# instance that validated here at contract-v2.5 may not validate here now —
# which is exactly what this integer exists to say, per
# docs/contract-versioning-policy.md § Version Identity item 1. NOT bumped
# with it: the manifest row's `schema_version` (the consent-instrument
# precedent keeps the row at 1 while a file's own integer moves), every
# envelope's `schema_version: {const: 1}` (bumping those would invalidate
# every instance in the estate), and the contract SET's integer, which
# scripts/validate-domain-openxfactory-pins.py hard-pins to 1 and every
# supported consumer declares.
contract_schema_version: 2
description: >-
  The POST /actions/workbench/chat-turn wire family
  (add-workbench-integrated-editor-chat task 2.1; consumer contract
  codexFactory specs/010-doxbench-editor-chat/contracts/chat-turn.md). One
  file, three closed envelopes discriminated by `kind`: the request
  (workbench-chat-turn-v2), the validated success
  (workbench-chat-turn-v2-success), and the fixed redacted failure
  (workbench-chat-turn-v2-failure). Every object
  is closed; a failure NEVER carries prompt text, buffer text, provider
  payload, credential, endpoint, secret name, or exception detail — only
  limit failures carry measured data, and only numeric dimension/values (the
  delegated validator enforces that pairing). `working_subject` is free-form
  NON-IDENTITY authoring focus (FR-012): a string, never an actor, customer,
  patient, tenant, authority, credential, or routing key — identity-shaped
  values are refused by type alone, and no identity-bearing sibling field
  exists to smuggle one. Content identity is exact-UTF-8 lowercase SHA-256
  over the full text (R4); the validator recomputes request-buffer hashes, so
  a mismatched content_hash is refused rather than trusted. The outline plus
  at least one loaded document buffer accompany every request (FR-013): both
  complete, never truncated, selected, summarized, or omitted. A path that
  does not exist yet is `null`, never a fabricated or guessed string
  (`buffer_state.path`, the not-yet-created artifact, data-model S4): a
  REQUIRED key with a nullable value — absent and null are
  different facts, and only null is expressible.

  THE DEPRECATED v1 FAMILY IS REMOVED (contract-v3.0,
  retire-doxbench-chat-turn-v1). Until this release the file also carried three
  co-resident v1 envelopes — `workbench-chat-turn`,
  `workbench-chat-turn-success` and `workbench-chat-turn-failure` — added at
  contract-v1.31, DEPRECATED at contract-v1.34 by the widened family above, and
  declared removable at a stated target through a top-level
  `deprecated_envelopes` block. Thirteen minors and one major passed with the
  contract validator warning on every packaged instance, far past the "at least
  one full published release" floor the versioning policy sets. The three
  `$defs`, their `oneOf` entries and the whole `deprecated_envelopes` block
  leave with them: a block declaring the deprecation of kinds this file no
  longer defines names nothing. The shared definitions the removed envelopes
  reached are RETAINED, measured from the surviving family's own reference
  closure rather than assumed. A consumer pinned below contract-v3.0 keeps
  validating v1 instances against the bytes its pin names — compatibility flows
  from the consumer, and no new release reaches backwards into an old pin. The
  migration path is `contracts/CHANGELOG.md` and
  `docs/contract-versioning-policy.md` § Deprecations Executed.

  THE ASSEMBLED CONTEXT'S POSTURE (contract-v1.40, add-doxbench-editing-phase-b
  task 10.7). `success_v2` gains ONE optional property, `context_packet`, and
  the widened family gains nothing else: the posture (`full | reduced`) under
  which the turn's bounded context packet was assembled, plus the reduction's
  own reason when there is one. It exists so the ratified "with the reduced
  posture STATED" clause is readable by a consumer and showable to the human
  rather than stated only inside the packet. ADDITIVE: the key is OPTIONAL, its
  ABSENCE is not a posture claim (it means a producer older than v1.40), and no
  existing shape changes. (That release also recorded a limitation of the then
  DEPRECATED v1 success envelope, which was deliberately not widened; the
  envelope is gone at contract-v3.0 and the limitation with it.)
oneOf:
  - $ref: "#/$defs/request_v2"
  - $ref: "#/$defs/success_v2"
  - $ref: "#/$defs/failure_v2"
$defs:
  content_hash:
    type: string
    pattern: "^[0-9a-f]{64}$"
  confined_path:
    # Repository-relative, confined: never absolute, never an escape. The
    # delegated validator re-checks `..` traversal segment-wise.
    type: string
    minLength: 1
    maxLength: 512
    pattern: "^[^/].*$"
  scope_key:
    type: object
    additionalProperties: false
    required: [repository, ref, tile_kind, tile_id]
    properties:
      repository: { type: string, minLength: 1, maxLength: 128 }
      ref: { type: string, minLength: 1, maxLength: 256 }
      tile_kind: { enum: [cluster, possible, staged] }
      tile_id: { type: string, minLength: 1, maxLength: 256 }
  buffer_state:
    # One COMPLETE authoring buffer (FR-005/FR-013): descriptor + full text +
    # both identities. `base_hash` is the loaded base's identity; the
    # stale-authority comparisons happen against `content_hash`.
    type: object
    additionalProperties: false
    required: [kind, repository, path, base_ref, base_revision,
               base_hash, content_hash, content, dirty]
    properties:
      kind: { enum: [outline, document] }
      repository: { type: string, minLength: 1, maxLength: 128 }
      # Nullable: a not-yet-created artifact has no path until its first Save
      # (the null-path -> create lifecycle, data-model S4).
      path:
        oneOf:
          - { type: "null" }
          - { $ref: "#/$defs/confined_path" }
      base_ref: { type: string, minLength: 1, maxLength: 256 }
      base_revision: { type: string, minLength: 1, maxLength: 128 }
      base_hash: { $ref: "#/$defs/content_hash" }
      content_hash: { $ref: "#/$defs/content_hash" }
      content: { type: string, maxLength: 1048576 }
      dirty: { type: boolean }
  transcript_turn:
    type: object
    additionalProperties: false
    required: [role, content]
    properties:
      role: { enum: [human, assistant] }
      content: { type: string, maxLength: 65536 }
      turn_id: { type: string, minLength: 1, maxLength: 128 }
  typed_proposal:
    # A human-reviewable replacement for exactly ONE buffer, bound to the
    # content identity the model saw (FR-026..FR-029). Untyped replacement
    # content — a proposal with no target — is refused at the schema.
    #
    # RETAINED AT contract-v3.0 AND NO LONGER REACHED, deliberately and on the
    # record (retire-doxbench-chat-turn-v1 task 2.1). The measured reference
    # closure of the surviving family does NOT contain this definition:
    # `keyed_typed_proposal` below RESTATES the shape with a buffer-key target
    # rather than `$ref`-ing this one, so removing the v1 envelopes leaves this
    # block unreferenced. The ratified requirement names `typed_proposal` among
    # the shared definitions that "do NOT leave with the envelopes", on a
    # factual premise the measurement contradicts. Task 2.1 rules that "any
    # surprise is a finding, not a licence", so the surprise is RECORDED here
    # and the definition STAYS: the realization does not remove bytes the
    # ratified text names as retained. Disposing of it is the cut's decision,
    # taken against this measurement rather than against the premise.
    type: object
    additionalProperties: false
    required: [target, base_hash, summary, content]
    properties:
      target: { enum: [outline, document] }
      base_hash: { $ref: "#/$defs/content_hash" }
      summary: { type: string, minLength: 1, maxLength: 500 }
      content: { type: string, maxLength: 1048576 }
  # ---- the widened, co-resident family (contract-v1.34) ----
  buffer_key:
    # A buffer's KEY in the widened family (design D1): the permanently
    # reserved `outline`, the reserved `document` key that holds the ONE
    # not-yet-created artifact of the create flow, or a document's own
    # repository-relative path. Both reserved spellings already satisfy the
    # confined-path shape, so ONE constraint expresses all three and no `oneOf`
    # can match a key twice. WHICH keys a given turn actually holds is the
    # request's own statement, checked by the delegated validator against the
    # buffer set the request supplies — a schema cannot know a loaded set.
    $ref: "#/$defs/confined_path"
  keyed_observed_hashes:
    # The recomputed identity of EVERY buffer the request supplied, keyed by
    # buffer key. v1 required exactly the two keys `outline` and `document`
    # because the set held exactly those two buffers; the widened record states
    # one identity per loaded document, so a reader can ask which text the model
    # saw for any of them. `outline` stays REQUIRED: its key is permanently
    # reserved and every turn carries it.
    type: object
    minProperties: 2
    maxProperties: 25
    required: [outline]
    propertyNames: { $ref: "#/$defs/buffer_key" }
    additionalProperties: { $ref: "#/$defs/content_hash" }
  keyed_typed_proposal:
    # v1's `typed_proposal` with its two-value `target` enum widened to a BUFFER
    # KEY. Every other field, bound and rule is unchanged. A target the request
    # did not supply is unroutable and is refused by the delegated validator
    # rather than guessed at.
    type: object
    additionalProperties: false
    required: [target, base_hash, summary, content]
    properties:
      target: { $ref: "#/$defs/buffer_key" }
      base_hash: { $ref: "#/$defs/content_hash" }
      summary: { type: string, minLength: 1, maxLength: 500 }
      content: { type: string, maxLength: 1048576 }
  selected_model:
    # WHAT THE HUMAN CHOSE, beside `model_id`'s WHAT ANSWERED. The two differ
    # exactly when the chosen catalog entry is a ROUTING RULE this capability
    # owns (an `auto` entry) rather than a provider model, which is why
    # `routing_rule` is stated rather than inferred from the two ids being
    # unequal. `data_handling` is the chosen entry's own catalog badge, carried
    # so a transcript states the handling posture the human was shown at send
    # time rather than the one the catalog happens to declare when it is read
    # back. The resolved model is NOT repeated here: it is `model_id`, once.
    type: object
    additionalProperties: false
    required: [requested_model_id, routing_rule, data_handling]
    properties:
      requested_model_id: { type: string, minLength: 1, maxLength: 128 }
      routing_rule: { type: boolean }
      data_handling: { type: string, minLength: 1, maxLength: 500 }
  context_packet:
    # WHAT THE TURN RAN UNDER (contract-v1.40, add-doxbench-editing-phase-b task
    # 10.7). The ratified knowledge-service requirement ends "Where the knowledge
    # service is unavailable the turn SHALL degrade to a declared reduced packet
    # — the selected thread and the loaded buffers, with the reduced posture
    # STATED". Until this release the posture was stated only INSIDE the
    # assembled context, which no reader of the record and no human on the
    # surface could consult: `success_v2` is a CLOSED envelope and had no field
    # for it. This is that field.
    #
    # ITS VOCABULARY IS THE PACKET'S OWN, deliberately, so no third spelling of
    # the same fact exists: `posture` and `reduced_reason` are the two members
    # of `ContextPacket` this states, with the SAME two-value posture and the
    # SAME truth-pairing the packet enforces at construction — a reduced packet
    # STATES its reason and a full packet carries none. That pairing is not
    # advisory here either: the two conditionals below refuse each half of it.
    #
    # WHY ONE OBJECT rather than two sibling keys on the envelope, on the
    # `selected_model` precedent one $def above: the posture and its reason are
    # one fact about one thing, grouping keeps the "present iff" rule local to
    # the object that owns it, and it keeps the ENVELOPE's key set identical for
    # a full turn and a reduced one — which is the ratified independence claim
    # ("MUST NOT ... make the editors unusable") read on the wire, where the two
    # turns differ in what the record SAYS and not in the shape it arrives in.
    #
    # `reduced_reason` is FREE PROSE with the same 500-`maxLength` ceiling every
    # other authored string in this family carries (`data_handling`, a proposal
    # `summary`, a failure `message`). THE UNIT IS CODE POINTS, which is what
    # JSON Schema's `maxLength` counts — so a 500-character CJK reason is
    # conformant at roughly 1,500 UTF-8 bytes, and a consumer sizing a buffer
    # must size it in bytes rather than in `maxLength`. Producers are expected
    # to refuse an over-long reason BEFORE emitting it rather than discovering
    # the ceiling at validation; this repository's own producer does, in the one
    # place the reason is carried onto the record. It is a statement about the
    # ASSEMBLY, not
    # about content: it names why the packet is reduced and, in the reasons this
    # capability ships, says in as many words that nothing unbounded was
    # substituted and no rail was bypassed. The delegated validator scans it for
    # public-only violations exactly as it scans a failure's `message`.
    type: object
    additionalProperties: false
    required: [posture]
    properties:
      posture: { enum: [full, reduced] }
      reduced_reason: { type: string, minLength: 1, maxLength: 500 }
    allOf:
      # A REDUCTION NOBODY CAN READ IS A SILENT DEGRADATION -- the packet's own
      # words, and its own refusal, restated on the wire.
      - if:
          required: [posture]
          properties: { posture: { const: reduced } }
        then:
          required: [reduced_reason]
      # AND A FULL PACKET CARRIES NO REASON. A record that declared `full` while
      # naming a reduction would state two contradictory facts and let a reader
      # pick; the packet refuses that construction, so the record refuses it too.
      # This is a SEPARATE conditional and not the inverse of the one above:
      # they guard different instances, and each has its own packaged negative.
      - if:
          required: [posture]
          properties: { posture: { const: full } }
        then:
          not: { required: [reduced_reason] }
  provider_retry:
    # A MID-TURN RE-MINT AND THE PAID RETRY IT BOUGHT (contract-v1.45,
    # add-doxchat-model-intake task 3.6; handed here by
    # add-model-provider-broker task 2.4).
    #
    # Brett ruled on 2026-08-26 that when a minted token expires part-way
    # through a turn the dashboard re-mints and retries ONCE, "with the re-mint
    # and the paid retry VISIBLY RECORDED in the turn record" — a second paid
    # call the human cannot see is exactly the decision that ruling was made to
    # avoid. Three records already existed on the server side (the port's
    # content-free mint ledger, the console's stderr notice, and the broker's own
    # audit trail correlated by `--retry-of`) and the browser can read NONE of
    # them, so the fact never reached the person paying for it. This is the field
    # that carries it to them.
    #
    # THE REDACTED FACT AND NOTHING MORE. It states that the turn re-minted once
    # and made one further paid provider call, and it names the re-mint's audit
    # reference. It carries no token, no token prefix, no token hash, no
    # provider status, no provider words, no endpoint and no timing that would
    # let one be reconstructed — the same redaction discipline the failure
    # envelope keeps, for the same reason: this record is stored, mirrored into a
    # thread sidecar and rendered in a page.
    #
    # `audit_ref` IS DISCLOSABLE BY CONSTRUCTION rather than by care: the
    # broker's own declaration records no token material against an audit
    # reference, and it is the identifier the broker's trail is keyed by — so a
    # reader of this record and a reader of `broker-audit.jsonl` can be shown to
    # be reading about the same issuance, which is what makes "visibly recorded"
    # mean something on both sides of the seam instead of only on the server's.
    #
    # `retried: true` is a CONST rather than a boolean anyone may set false. A
    # turn that did not retry omits the whole object; a `retried: false` would be
    # a second, weaker spelling of an absence that is already unambiguous, and
    # two spellings of one fact is how a consumer comes to read the wrong one.
    #
    # WHAT `at_most_once` RECORDS: that the ruling's bound HELD. A second expiry
    # inside one turn does not buy a third call — it surfaces the standard
    # refusal, and that turn produces a FAILURE envelope rather than this one —
    # so a success record carrying this object is a record of exactly one retry.
    # Stated on the record rather than left to a reader who would have to know
    # the port's internals to infer it.
    type: object
    additionalProperties: false
    required: [retried, at_most_once]
    properties:
      retried: { const: true }
      at_most_once: { const: true }
      audit_ref: { type: string, minLength: 1, maxLength: 200 }
  request_v2:
    # The widened request. It carries the outline plus every loaded document,
    # and it DECLARES which of them the chat is bound to. `active_document_path`
    # is deliberately absent: the binding is stated, never inferred from an
    # adjacent field that answers a different question (design D17), and the two
    # questions had different answers exactly when a human worked the outline
    # with a document loaded.
    type: object
    additionalProperties: false
    required: [schema_version, kind, client_turn_id, scope, bound_buffer,
               working_subject, message, model_id, last_assistant_turn_id,
               transcript, buffers]
    properties:
      schema_version: { const: 1 }
      kind: { const: workbench-chat-turn-v2 }
      client_turn_id: { type: string, minLength: 1, maxLength: 128 }
      scope: { $ref: "#/$defs/scope_key" }
      # The DECLARED binding: what the chat is working ON. It MUST name one of
      # the buffers this same request supplies (delegated validator), and it
      # never narrows what the turn is GROUNDED on — every loaded buffer rides
      # the request regardless of which one is bound.
      bound_buffer: { $ref: "#/$defs/buffer_key" }
      working_subject: { type: string, maxLength: 512 }
      message: { type: string, minLength: 1, maxLength: 65536 }
      model_id: { type: string, minLength: 1, maxLength: 128 }
      last_assistant_turn_id:
        oneOf: [ { type: "null" }, { type: string, maxLength: 128 } ]
      transcript:
        type: array
        maxItems: 128
        items: { $ref: "#/$defs/transcript_turn" }
      buffers:
        # The outline plus one to twenty-four document buffers. The lower bound
        # is unchanged from v1 (one outline and at least one document buffer,
        # which the delegated validator pairs as before); the upper bound is the
        # surface's own declared loaded-set bound plus the reserved outline, so
        # a request can never carry more buffers than a human is allowed to
        # load. Reaching the bound REFUSES the load with the measured bound
        # stated; nothing is evicted, because every loaded buffer may hold
        # unsaved human text.
        type: array
        minItems: 2
        maxItems: 25
        items: { $ref: "#/$defs/buffer_state" }
  success_v2:
    # The widened, validated success — the turn's durable RECORD. It names the
    # bound buffer (from the request's DECLARED binding, never derived), states
    # every buffer's observed identity by key, and carries the selected-model
    # metadata beside the model that answered.
    type: object
    additionalProperties: false
    required: [schema_version, kind, client_turn_id, assistant_turn_id,
               model_id, selected_model, bound_buffer, observed_hashes,
               assistant_prose, proposals]
    properties:
      schema_version: { const: 1 }
      kind: { const: workbench-chat-turn-v2-success }
      client_turn_id: { type: string, minLength: 1, maxLength: 128 }
      assistant_turn_id: { type: string, minLength: 1, maxLength: 128 }
      # The model that ANSWERED. With a routing-rule entry this is the model the
      # rule resolved to, which is what makes a transcript state which model
      # produced which turn instead of leaving it to be inferred.
      model_id: { type: string, minLength: 1, maxLength: 128 }
      selected_model: { $ref: "#/$defs/selected_model" }
      # WHAT THE TURN RAN UNDER (contract-v1.40, task 10.7). OPTIONAL, which is
      # what makes this release additive: a record produced before v1.40 omits
      # it and stays valid, and no reader of an older record has to change.
      # OMISSION IS NOT A POSTURE CLAIM -- it means the producer predates this
      # release, never that the context was full. A consumer that needs the
      # posture must read this key and treat its absence as unknown.
      context_packet: { $ref: "#/$defs/context_packet" }
      # WHAT THE TURN COST (contract-v1.45, add-doxchat-model-intake task 3.6).
      # OPTIONAL, which is what makes this release additive, and PRESENT ONLY
      # WHEN IT HAPPENED: a turn that minted once and answered once carries no
      # such key, and its absence is not a claim — it means "nothing to report,
      # or a producer older than v1.45". Present on the v2 envelope ONLY: the v1
      # family is deprecated and its promise is byte-identical stability.
      provider_retry: { $ref: "#/$defs/provider_retry" }
      bound_buffer: { $ref: "#/$defs/buffer_key" }
      observed_hashes: { $ref: "#/$defs/keyed_observed_hashes" }
      assistant_prose: { type: string, maxLength: 900000 }
      # At most one proposal per supplied buffer (the delegated validator holds
      # that rule, which is expressed over the REQUEST's own buffer count); the
      # transport ceiling here is the largest buffer set a request may carry.
      proposals:
        type: array
        maxItems: 25
        items: { $ref: "#/$defs/keyed_typed_proposal" }
  failure_v2:
    # The fixed redacted failure for a v2 turn. Structurally identical to the v1
    # failure and deliberately so — a refusal discloses nothing whichever family
    # it answers — but it carries its own `kind`, so the whole v1 family can be
    # deprecated as a unit and a v2 turn is never answered in a deprecated
    # envelope.
    type: object
    additionalProperties: false
    required: [schema_version, kind, client_turn_id, error, message]
    properties:
      schema_version: { const: 1 }
      kind: { const: workbench-chat-turn-v2-failure }
      client_turn_id: { type: string, minLength: 1, maxLength: 128 }
      error: { type: string, pattern: "^[a-z][a-z0-9_]{2,63}$" }
      message: { type: string, minLength: 1, maxLength: 500 }
      limit:
        type: object
        additionalProperties: false
        required: [dimension, measured, maximum]
        properties:
          dimension: { type: string, minLength: 1, maxLength: 64 }
          measured: { type: integer, minimum: 0 }
          maximum: { type: integer, minimum: 0 }
