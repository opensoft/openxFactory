$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ideation-dashboard-snapshot-index.schema.yaml"
title: "Ideation-dashboard snapshot index: the (repository, ref) locator"
contract_schema_version: 1
description: >-
  The thin LOCATOR that enumerates which ideation-dashboard snapshots exist and
  where each one lives (`add-dashboard-repo-selector`; spec requirement
  "Snapshot index contract"; design decision D3). One entry per available
  (repository, ref) pair, each naming its repository, its ref, the snapshot's
  location, the `source_revision` that snapshot projects, and the generated-at
  stamp derived from that revision. The repository selector renders this index,
  a refresh re-fetches it, and every renderer discovers available snapshots
  ONLY through it.

  ITS OWN CONTRACT, NOT A SNAPSHOT FIELD (D3). An index describes a SET of
  snapshots; a snapshot (`ideation-dashboard-snapshot.schema.yaml`) describes ONE
  repository's corpus at ONE revision. Folding the index into the snapshot would
  make every snapshot carry facts about its siblings, which breaks the snapshot's
  determinism property — the same working tree MUST yield a byte-identical
  snapshot, and sibling facts change without that tree changing. Keeping the
  index separate also keeps it CHEAP to fetch often while the snapshots stay
  large and stable, which is exactly the traffic shape a refresh wants.

  KEYED ON THE PAIR (repository, ref), `ref` DEFAULTING TO `main` (D4). A
  CONSUMER that names no ref means `main`; an index ENTRY always states its ref
  explicitly, so the artifact never leaves the key implicit (only an
  `aggregates[].members` entry may omit it, where absent means `main`). The
  served plane exercises only `(repository, main)`: a snapshot
  generated for any other ref is session-local derived data that MUST NEVER be
  published to a data source and MUST NEVER appear in a published index (spec
  scenario "A non-main snapshot is offered for publication"). The key is carried
  from the first release anyway so a later session-scoped or runtime-plane
  consumer binds to this locator without it being re-cut.

  WHAT THIS ARTIFACT MUST NOT CARRY: no document, cluster, possible, staged-topic,
  change, keyword, or funnel data of any kind, and no readiness, completeness, or
  tally derived from them. It is a locator, not a projection — that data belongs
  to the snapshot the entry locates (spec scenario "The index is asked to carry
  projection data"). Grouping (`project`/`project_group`) is likewise NOT carried
  here: the project register is the grouping roster and renderers read the
  resolved grouping from the SNAPSHOT, never from a second list.

  VALIDATOR-SIDE RULES this shape cannot express (enforced by
  `scripts/validate-ideation-dashboard-contracts.py`, and these comments ARE the
  requirements):
    * every (repository, ref) pair is UNIQUE within one index — two entries for
      the same pair make "which snapshot is this repository's?" ambiguous; and
    * no projection data anywhere in the index — a `documents`, `clusters`,
      `possibles`, `staged_topics`, `changes`, or `keyword_index` key, at the
      root or inside an entry, is refused (the locator-not-projection rule).

  DETERMINISM. Like the snapshot, this artifact carries no wall clock: an
  entry's `generated_at` is derived from its `source_revision`'s commit date (or
  omitted, exactly as the snapshot omits it outside a git checkout), so a
  republished index diffs only when a snapshot it locates actually moved.

  Forward-compatible / additive: consumers MUST ignore unknown properties, so no
  object here sets `additionalProperties: false` and additive growth needs no
  `contract_schema_version` bump — only a breaking change (a removed or retyped
  field) does. This is the ideation-dashboard family posture.
type: object
required:
  - schema_version
  - kind
  - entries
properties:
  schema_version: {const: 1}
  # Normative kind literal; hyphenated like its sibling snapshot/register kinds,
  # not the underscored `xfactory_*` in-file convention.
  kind: {const: ideation-dashboard-snapshot-index}
  generated_at:
    type: string
    format: date-time
    # OPTIONAL index-level stamp, derived from the newest entry's revision date —
    # never the process clock (see the determinism note above).
  entries:
    type: array
    # MAY be empty (no snapshot published yet): an empty index is the honest
    # bootstrap state, and a renderer offering no repository is a truthful
    # renderer. Each present entry locates exactly one (repository, ref).
    items: {$ref: "#/$defs/entry"}
  aggregates:
    type: array
    # OPTIONAL composed views: an aggregate names the member (repository, ref)
    # pairs a cross-repository selection composes FROM, so a composing renderer
    # reads the index and the snapshots it names and never scans a repository
    # (spec scenario "An aggregate selection is rendered"). Still pure locator
    # data — an aggregate carries no projection of its own. The RENDERING shape
    # of such a selection (merged funnel with repository badges, drill-in from a
    # roll-up, or counts-only overview) is deliberately NOT fixed by this
    # contract: it is the staged topic's open question 1.
    items: {$ref: "#/$defs/aggregate"}
$defs:
  # --- one available snapshot, addressed by the (repository, ref) pair ---
  entry:
    type: object
    required: [repository, ref, snapshot, source_revision]
    properties:
      repository:
        type: string
        minLength: 1
        # Canonical repository id — the same id the located snapshot carries in
        # its own `repository` field and the id the project register names.
      ref:
        type: string
        minLength: 1
        # The git ref the located snapshot projects. `main` for every published
        # entry; a non-`main` ref marks session-local derived data that is never
        # published (see the keying note above).
      snapshot:
        type: string
        minLength: 1
        # WHERE the snapshot is, relative to this index (a sibling filename or a
        # relative path — never an absolute filesystem path and never a host, so
        # one index serves a raw-file tree, a blob prefix, and a local directory
        # unchanged; the data source is configuration, not contract).
      source_revision:
        type: string
        minLength: 1
        # The revision the located snapshot projects — the SAME value that
        # snapshot's `generation.source_revision` carries. The index never
        # restates it differently: provenance is one fact in two places, and a
        # mismatch is a publication bug.
      generated_at:
        type: string
        format: date-time
        # Derived from `source_revision`'s commit date, never the wall clock;
        # omitted when the snapshot itself omits it. This is the stamp the
        # freshness header and the stale banner display.
      display_name:
        type: string
        minLength: 1
        # Optional human label for the selector; `repository` remains the key.
  # --- a composed cross-repository selection (locator only) ---
  aggregate:
    type: object
    required: [id, members]
    properties:
      id:
        type: string
        minLength: 1
        # Stable id of the composed view (for example the aggregation
        # repository's own id, `xFactory`, for the all-submodules dev view).
      display_name:
        type: string
        minLength: 1
      members:
        type: array
        minItems: 1
        # The (repository, ref) pairs this view composes from. Each member
        # SHOULD name an `entries` pair present in the same index; a member that
        # names no available entry composes without it rather than failing the
        # view (the same degrade-not-refuse rule as an unfetchable entry).
        items: {$ref: "#/$defs/member"}
  member:
    type: object
    required: [repository]
    properties:
      repository: {type: string, minLength: 1}
      ref:
        type: string
        minLength: 1
        # Absent means `main` (D4's default applies to members too).
