$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "gate-action-record.schema.yaml"
title: "Gate-action record: human-authenticated console action audit entry"
contract_schema_version: 1
description: >-
  Records one execution of a human gate-console action for the
  ideation-area dashboard (`add-ideation-dashboard`; promoted spec
  requirement "Human gate console"; design decisions D16/D17). Every gate
  action — `demote` (reject / move back to staging), `edit-apply` (a human
  applying and committing an AI-drafted concept redline), `ratify`
  (approve), and `kickoff` (post-ratification realization-workflow
  dispatch, D17) — produces the SAME governed artifacts as the equivalent
  manual path, PLUS one of these records (spec: "each producing the same
  governed artifacts as the manual path plus a recorded action").

  `actor` records WHO performed the action. Agents are structurally unable
  to author a gate-action record at all: the gate console rejects any
  agent-invoked action before one is ever written (spec scenario "An agent
  invokes a gate action") — that boundary is enforced by the console and
  its authenticator, not by this schema, which only shapes the record of
  an action a human already took.

  `demote` is the mechanized reverse transition (D16): the same move as
  the 2026-07-13 manual demotion, tooled. A demotion without a recorded
  `reason` is invalid (allOf below) — the durable "why" a change went back
  to staging.

  PER-ACTION ARTIFACT REQUIREMENTS (encoded schema-side, allOf below): a
  `ratify` record MUST reference at least one `ratification-record`
  artifact, and a `kickoff` record MUST reference at least one
  `workflow-job` artifact. Each is a SINGLE-INSTANCE "this action's
  artifact list contains an entry of a given kind" check — cleanly
  expressible in draft 2020-12 as `if action then artifacts contains kind`
  — so, unlike the register's cross-snapshot transition rules, it is
  enforced structurally here rather than deferred. The gate console is
  authority-bearing (D16), so an authority-bearing record naming the wrong
  action-to-artifact pairing is caught at write time. Later additive deltas
  extended the same per-action shape to `dispose-possible`
  (`register-update`), `propose` (`workflow-job`), `create-document`
  (`document`), and — `add-workbench-branch-sessions` — `edit-document`
  (`commit`) and `open-pr` (`pull-request`); `abandon-session` is constrained
  on `target.ref` + `reason` with NO artifact-kind requirement (see below).
  Each was safe at the time it landed because no existing record carried that
  action. This does NOT narrow the additive posture below: new action kinds
  and new artifact kinds stay unconstrained, and no PRE-EXISTING action ever
  gains a required companion artifact.

  WHEEL ACTION COMMISSIONS (`add-wheel-action-verbs`; additive growth of
  `contract_schema_version: 1`): `promote-to-staging`, `derive-possibles`,
  and `research-brief` each record a governed dispatch and therefore MUST
  reference a `workflow-job` artifact. The first and third target a
  `possible_id`; the cluster-scoped derivation targets a `cluster_id`.
  `demote` is unchanged by that change: it was already enumerated with a
  `change_id` target and required `reason`, and it still records a plan whose
  execution is a separate human act.

  BRANCH SESSIONS (`add-workbench-branch-sessions`, design D13; landed
  2026-07-26 as an ADDITIVE growth of `contract_schema_version: 1` — no bump,
  no existing record invalidated): the workbench's working state moved onto a
  git branch materialized as a worktree, so three session actions join the
  vocabulary — `edit-document` (the session-only rewrite of an existing
  document, deliberately NOT `edit-apply`, which stays the main-resident
  redline path), `open-pr` (push the session branch and open or update the
  pull request that is the formal re-entry of the work into the governed doc
  system), and `abandon-session` (end a session without saving, carrying a
  required reason). `target` gains an OPTIONAL `ref` naming the session
  branch, and the artifact vocabulary gains `commit` and `pull-request` as
  FIRST-CLASS kinds — the `document` precedent Brett set on 2026-07-25, not
  `other`, so an audit consumer can filter them from the enum.

  Two REALIZATION FACTS (codexFactory feature 007) this schema is shaped to
  validate, recorded so a reader does not infer a stricter contract than the
  one written:

    * a `commit` artifact's `reference` is the record's OWN action stamp,
      never a sha. A commit cannot contain its own sha, so resolution is
      DEFINED rather than literal: the referenced commit is the one that
      INTRODUCED the record file on the session branch
      (`git log --diff-filter=A -- <record-path>`), which immediately after
      the action is the branch tip. This schema requires only
      `{kind, reference}` of an artifact, and a resolvable reference satisfies
      it — so no `reference` pattern is imposed here.
    * `open-pr` and `abandon-session` records are MAIN-RESIDENT — written into
      the served checkout's records tree, never onto the session branch, which
      the merge deletes and the abandoned-branch cleanup may later delete.
      Neither action adds a commit to the branch, so NEITHER may be required
      to carry a `commit` artifact: a record naming one would name something
      that does not exist. An `abandon-session` record satisfies
      `artifacts.minItems` by naming the branch itself as an `other`-kind
      artifact, which is why its conditional constrains `target.ref` +
      `reason` and imposes NO artifact-kind requirement at all.

  GATEWAY PROVENANCE (`add-workbench-branch-sessions`, design D23; Brett's
  2026-07-27 ruling, an ADDITIVE growth of `contract_schema_version: 1` —
  no bump, no existing record invalidated). The gate console's human/agent
  boundary is a CONSOLE-PRESENCE control — anti-CSRF / same-origin — and not
  authentication: a process running as the identified human, on the human's own
  machine, can read the per-serve console token or declare console presence on
  the CLI and act as the human. Brett ACCEPTED that residual (distinguishing the
  two needs the xForge-host identity work deferred under D22) and required the
  event to be TAGGED WITH THE FACTS WE ACTUALLY KNOW instead: the OPTIONAL
  `provenance` block names the SURFACE the action arrived on (`http` | `cli`)
  and HOW the console-presence test was satisfied (`console-token` | `tty` |
  `declared`). That converts an accepted-but-invisible residual into an
  AUDITABLE one — if a process ever does act as the human, the record says which
  door it came through.

  `provenance` is OPTIONAL and NO conditional requires it, for ANY action —
  deliberately, and this absence is a DECISION exactly like the
  `create-document`/`commit` absence below. Gate-action records written BEFORE
  this growth already exist: the `dispose-possible` records committed in this
  corpus under `ideation/dashboard/gate-records/`, and every record the
  realization under review on codexFactory PR #49 has already emitted, whose
  per-gate-action commit series on a session branch is FDA TRACEABILITY EVIDENCE
  under design D18. A conditional requiring `provenance` would invalidate those
  records retroactively — a schema that rejects the evidence it exists to govern
  destroys exactly what the strictness would be for. The obligation is a ROUTE
  obligation: the CODE always emits `provenance`, and a codexFactory test pins
  that. A later change MAY make it conditionally required once no pre-growth
  record is live evidence. The growth precedent is this schema's own — the
  `create-document` action enum value and the first-class `document` artifact
  kind, both grown here on 2026-07-25 under Brett's ruling, and the three
  branch-session actions grown on 2026-07-26.

  VALIDATOR-SIDE (cross-instance, not shape-expressible): kickoff is
  downstream of the ratify gate (D17) — the console MUST refuse a `kickoff`
  whose target change carries no recorded ratification (spec scenario "A
  non-ratified change is asked for kickoff"). A gate-action record shapes a
  single action; whether the target already carries a ratify record is a
  console/validator precondition across records, not a property of this one.

  Forward-compatible / additive: consumers MUST ignore unknown properties.
  A later delta may add new action kinds or artifact kinds without a
  `schema_version` bump; only a breaking change (a removed or retyped
  field) requires one. This is why no object here sets
  `additionalProperties: false`.
type: object
required:
  - schema_version
  - kind
  - actor
  - action
  - target
  - at
  - artifacts
properties:
  schema_version: {const: 1}
  # Normative kind literal from D16 ("gate-action record"); hyphenated per
  # the design decision, not the underscored `xfactory_*` in-file kind
  # convention (same divergence as the sibling dashboard/workbench/register
  # schemas).
  kind: {const: gate-action-record}
  actor:
    type: string
    minLength: 1
    # Human identity string (spec: "executable by a human only"). This
    # schema only records WHO acted; that no agent path can ever reach
    # this field is enforced by the console/authenticator, not here.
  action:
    type: string
    enum: [demote, edit-apply, ratify, kickoff, dispose-possible, propose,
           lens-save-recipe, lens-add-as-cluster, create-document,
           edit-document, open-pr, abandon-session, promote-to-staging,
           derive-possibles, research-brief]
    # The gate-console actions (spec "Human gate console" + D17 kickoff):
    # reject-to-staging, AI-redline-apply, approve/ratify, post-ratification
    # workflow dispatch, and — add-possibles-derivation-lane ("One-way
    # derived-possible disposition on the gate console") — the human
    # disposition of a pending_review ai-derived possible (ADDITIVE enum
    # extension; every prior record stays valid). `propose`
    # (add-propose-verb) commissions proposal authoring for a staging
    # topic: kickoff's recorded-dispatch mechanic at the staging->proposal
    # boundary (ADDITIVE, same posture). `create-document`
    # (add-workbench-bullseye-and-create) brings a NEW ideation document
    # into existence through the tested authoring scaffold, create-only —
    # an existing target refuses as a source-edit and is never overwritten,
    # so this action carries NO edit or delete authority. It targets
    # `document` (allOf below) and references the created document as a
    # `document`-kind artifact (ADDITIVE enum extension; every prior record
    # stays valid). The three BRANCH-SESSION actions
    # (add-workbench-branch-sessions, D13) close the set: `edit-document`
    # rewrites an EXISTING document inside the session worktree — session-only,
    # no create and no delete authority, and no per-edit redline, because the
    # pull-request review is the governance; `open-pr` pushes the session
    # branch and opens or updates the pull request into the existing
    # Merge-Master ritual, dispatching and never deciding (it cannot merge,
    # approve, self-review, or bypass protection, and consults NO readiness
    # signal — D21); `abandon-session` ends a session without saving and
    # carries the durable "why", exactly as a demotion does. All three are
    # ADDITIVE enum extensions; every prior record stays valid. The three
    # `add-wheel-action-verbs` values are also ADDITIVE recorded commissions:
    # they require a workflow-job below but add no authoring or disposition
    # authority to the record.
  target: {$ref: "#/$defs/target"}
  provenance: {$ref: "#/$defs/provenance"}
  at:
    type: string
    format: date-time
    # Wall-clock stamp of the action; this is a live audit record, not a
    # deterministic projection (contrast `ideation-dashboard-snapshot`).
  artifacts:
    type: array
    minItems: 1
    # Every action produces at least the manual path's artifacts (spec) —
    # an action record with no artifact is invalid.
    items: {$ref: "#/$defs/artifact"}
  reason:
    type: string
    minLength: 1
    # REQUIRED for action=demote and for a rejected dispose-possible (allOf
    # below) — an unreasoned demotion or rejection is invalid; optional
    # narrative for other actions.
  citation:
    type: string
    minLength: 1
    # REQUIRED for a rejected dispose-possible (allOf below) — an uncited
    # rejection is invalid, mirroring the register state machine's own
    # rejected-entry rule; optional otherwise.
  notes:
    type: string
    minLength: 1
    # Free-text human narrative; never load-bearing for validation.
allOf:
  # A demotion without a recorded reason is invalid (task 2.8).
  - if: {properties: {action: {const: demote}}}
    then: {required: [reason]}
  # The four change-lifecycle actions target a change (the original
  # strictness, preserved per-action now that `target` also serves the
  # possible-disposition action).
  - if: {properties: {action: {enum: [demote, edit-apply, ratify, kickoff]}}}
    then: {properties: {target: {required: [change_id]}}}
  # A dispose-possible record targets a register possible with a recorded
  # outcome and MUST reference the register-update artifact it produced
  # (the updated cross-reference index).
  - if: {properties: {action: {const: dispose-possible}}}
    then:
      properties:
        target: {required: [possible_id, outcome]}
        artifacts:
          contains:
            required: [kind]
            properties: {kind: {const: register-update}}
  # A rejected disposition without reason AND citation is invalid (the
  # register kernel's uncited-rejection rule, surfaced on the audit record).
  - if:
      properties:
        action: {const: dispose-possible}
        target:
          properties: {outcome: {const: rejected}}
          required: [outcome]
      required: [action, target]
    then: {required: [reason, citation]}
  # A ratify record MUST reference at least one ratification-record artifact
  # (single-instance contains; the gate console is authority-bearing, D16).
  - if: {properties: {action: {const: ratify}}}
    then:
      properties:
        artifacts:
          contains:
            required: [kind]
            properties: {kind: {const: ratification-record}}
  # A kickoff record MUST reference at least one workflow-job artifact
  # (post-ratification realization dispatch, D17).
  - if: {properties: {action: {const: kickoff}}}
    then:
      properties:
        artifacts:
          contains:
            required: [kind]
            properties: {kind: {const: workflow-job}}
  # A propose record targets a staging topic and MUST reference the
  # workflow-job descriptor it dispatched (add-propose-verb: commissioning,
  # never authoring).
  - if: {properties: {action: {const: propose}}}
    then:
      properties:
        target: {required: [topic_id]}
        artifacts:
          contains:
            required: [kind]
            properties: {kind: {const: workflow-job}}
  # The three wheel generative actions are commissions, never the work. Each
  # therefore targets its governed source and MUST reference the workflow-job
  # descriptor it dispatched (`add-wheel-action-verbs`, design D2).
  - if: {properties: {action: {const: promote-to-staging}}}
    then:
      properties:
        target: {required: [possible_id]}
        artifacts:
          contains:
            required: [kind]
            properties: {kind: {const: workflow-job}}
  - if: {properties: {action: {const: derive-possibles}}}
    then:
      properties:
        target: {required: [cluster_id]}
        artifacts:
          contains:
            required: [kind]
            properties: {kind: {const: workflow-job}}
  - if: {properties: {action: {const: research-brief}}}
    then:
      properties:
        target: {required: [possible_id]}
        artifacts:
          contains:
            required: [kind]
            properties: {kind: {const: workflow-job}}
  # A create-document record names the document it brought into existence
  # (add-workbench-bullseye-and-create): a create record that does not name
  # the created path audits nothing. Safe as a per-action conditional — no
  # record has ever carried this action, so no prior record is invalidated.
  # The created document rides as a `document`-kind artifact with the
  # relpath as its `reference` (Brett's 2026-07-25 ruling on that change's
  # open question 4 grew the artifact enum a first-class `document` value
  # instead of overloading `other`), and that kind is REQUIRED here — a
  # create record whose artifact list names no document is not an audit
  # record of a creation. Unlike the enum growth itself this conditional is
  # only safe per-action, which it is.
  - if: {properties: {action: {const: create-document}}}
    then:
      properties:
        target: {required: [document]}
        artifacts:
          contains:
            required: [kind]
            properties: {kind: {const: document}}
  # --- the three BRANCH-SESSION conditionals (add-workbench-branch-sessions,
  # D13). Each constrains ONLY its own NEW action, which is exactly why each is
  # safe: no record has ever carried `edit-document`, `open-pr`, or
  # `abandon-session`, so nothing pre-existing is narrowed and no
  # `contract_schema_version` bump is owed.
  #
  # What deliberately does NOT appear here, stated because its absence is a
  # DECISION and not an omission: the commit-per-gate-action rule is NOT a
  # conditional on `create-document`. That action pre-dates branch sessions and
  # is legitimately performed OUTSIDE one — against the served checkout, where
  # no commit is produced — so requiring a `commit` artifact for it would
  # invalidate the non-session case and narrow a PRE-EXISTING action, the one
  # thing this schema's additive posture forbids. The rule therefore lives in
  # the requirement and is enforced at the route, and `target.ref` stays
  # OPTIONAL for the same reason even though the route populates it for every
  # in-session action, `create-document` included.
  #
  # An `edit-document` record names the document it rewrote, the session branch
  # it rewrote it on, and the commit it rode: all three, or it audits nothing.
  # The `commit` artifact's `reference` is this record's own action stamp, not a
  # sha — resolution is the introduced-by rule stated in the description.
  - if: {properties: {action: {const: edit-document}}}
    then:
      properties:
        target: {required: [document, ref]}
        artifacts:
          contains:
            required: [kind]
            properties: {kind: {const: commit}}
  # An `open-pr` record names the session branch it pushed and the pull request
  # it opened or updated. NO `commit` artifact is required — the record is
  # main-resident and this action adds no commit to the branch.
  - if: {properties: {action: {const: open-pr}}}
    then:
      properties:
        target: {required: [ref]}
        artifacts:
          contains:
            required: [kind]
            properties: {kind: {const: pull-request}}
  # An `abandon-session` record names the branch it abandoned and WHY — the
  # unreasoned-demotion rule applied to the other ending. No artifact KIND is
  # required: this action produces no commit and no pull request, and the branch
  # it names is carried as an `other`-kind artifact purely to satisfy
  # `artifacts.minItems`. The record is main-resident precisely so it OUTLIVES
  # the branch the later cleanup may delete.
  - if: {properties: {action: {const: abandon-session}}}
    then:
      required: [reason]
      properties:
        target: {required: [ref]}
$defs:
  # --- what the action acted on ---
  target:
    type: object
    # Per-action required fields live in the allOf conditionals above: the
    # four change-lifecycle actions require `change_id`; `dispose-possible`
    # requires `possible_id` + `outcome`; the wheel commissions require
    # `possible_id`, `cluster_id`, and `possible_id` respectively;
    # `edit-document` requires `document` + `ref`; `open-pr` and
    # `abandon-session` require `ref`. (The
    # unconditional `change_id` requirement moved into the conditional when the
    # disposition action landed — every previously valid record stays valid.)
    properties:
      change_id:
        type: string
        minLength: 1
        # The proposal/change this action targets (matches a snapshot
        # `change.id`).
      possible_id:
        type: string
        minLength: 1
        # The possibles-register entry a dispose-possible,
        # promote-to-staging, or research-brief action targets (matches a
        # `register_entry.id`).
      cluster_id:
        type: string
        minLength: 1
        # The cross-reference cluster a derive-possibles action scopes. The
        # console revalidates its existence against the pinned snapshot; this
        # schema records the target identity only.
      set:
        type: string
        minLength: 1
        # The workbench reference-set slug a lens verb lands
        # (add-lens-gate-verbs; ADDITIVE — every prior record stays
        # valid): lens-save-recipe writes the manifest of this set,
        # lens-add-as-cluster additionally submits its pending_review
        # human-seen entry.
      topic_id:
        type: string
        minLength: 1
        # The staging topic a propose action commissions (matches a
        # `ideation/staging/<topic_id>/` directory / staged tile
        # `staging_id`).
      outcome:
        type: string
        enum: [accepted, rejected, deferred]
        # The human verdict a dispose-possible action recorded (mirrors
        # `derivation_human_disposition.outcome` in the register kernel).
      document:
        type: string
        minLength: 1
        # A repository-relative document path this action acted on. Three
        # senses, all structurally unrestricted by action: the document
        # WITHIN a change that an `edit-apply` redlined; REQUIRED for
        # `create-document` (add-workbench-bullseye-and-create; allOf
        # above) — the path the create-only authoring scaffold brought into
        # existence; and REQUIRED for `edit-document`
        # (add-workbench-branch-sessions; allOf above) — the path the
        # session-only rewrite replaced inside the session WORKTREE, relative
        # to the worktree root rather than to the served checkout. Broadened
        # commentary only; the field, its type, and its optionality are
        # unchanged, so every prior record stays valid.
      ref:
        type: string
        minLength: 1
        # The git ref — the SESSION BRANCH — a branch-session action acted on
        # (add-workbench-branch-sessions, D13; ADDITIVE — every prior record
        # stays valid). REQUIRED for `edit-document`, `open-pr`, and
        # `abandon-session` (allOf above) and OPTIONAL everywhere else, on
        # purpose: `create-document` pre-dates sessions and is legitimately
        # invoked outside one, where there is no ref to name, so an
        # unconditional requirement would invalidate every existing record and
        # narrow a pre-existing action. Inside a session the ROUTE populates it
        # for every action — a session record that does not name its branch
        # audits nothing — which is a route obligation, not a schema one.
  # --- which gateway the action arrived through (add-workbench-branch-sessions,
  # D23; Brett's 2026-07-27 ruling). OPTIONAL at the record level and required by
  # NO conditional — see the description's GATEWAY PROVENANCE paragraph for why
  # (pre-growth records already exist, in this corpus and among those PR #49's
  # realization has emitted, and must not be invalidated retroactively; that
  # commit series is FDA-traceability evidence under design D18). Both fields are
  # required WITHIN the block, which is safe for
  # the same reason the per-action conditionals are: no record has ever carried
  # this block, so a half-filled provenance has never been written. A record
  # WITHOUT `provenance` stays valid; a record WITH it must say both things or it
  # tags nothing.
  provenance:
    type: object
    required: [surface, console_presence]
    properties:
      surface:
        type: string
        enum: [http, cli]
        # The gateway the invocation arrived on: the loopback HTTP console, or
        # the CLI parity verb. Recorded because the two doors have different
        # presence tests and different residuals, and an auditor asking "how did
        # this happen" needs the door named.
      console_presence:
        type: string
        enum: [console-token, tty, declared]
        # HOW the console-presence test was satisfied: the per-serve console
        # token issued at `/capabilities` (`console-token`, the HTTP door), an
        # interactive terminal (`tty`), or an explicit operator declaration
        # (`declared`, e.g. `XF_HUMAN_CONSOLE=1`). There is deliberately NO
        # value meaning "not shown": an invocation that cannot demonstrate
        # console presence is REFUSED before a record is written, so no record
        # can honestly carry one. `declared` is the WEAKEST of the three and is
        # named as its own value rather than folded into the others precisely so
        # an audit consumer can filter for it.
  # --- an artifact this action produced ---
  artifact:
    type: object
    required: [kind, reference]
    properties:
      kind:
        type: string
        enum:
          - transition-manifest
          - ratification-record
          - redline
          - workflow-job
          - register-update
          - document
          - commit
          - pull-request
          - other
        # The manual-path artifact kinds an action can produce (spec: "the
        # same governed artifacts as the manual path"). SCHEMA-SIDE (allOf
        # above): a `ratify` record requires a `ratification-record` entry
        # and a `kickoff` record requires a `workflow-job` entry.
        #
        # `document` — an ideation/corpus document this action brought into
        # existence or rewrote, referenced by repository-relative path
        # (add-workbench-bullseye-and-create; Brett's 2026-07-25 ruling on
        # that change's design open question 4, which rejected carrying a
        # created document as `other`). ADDITIVE enum extension in the
        # `add-lens-gate-verbs` shape: no `contract_schema_version` bump, and
        # every prior record stays valid because no record is required to
        # carry this kind — an audit consumer can now filter document-
        # producing actions from the enum rather than only from `action`.
        #
        # `commit` — the SINGLE session commit a file-producing gate action
        # rode, carrying that action's documents AND this record together
        # (add-workbench-branch-sessions, D4/D13). Its `reference` is the
        # record's own ACTION STAMP and never a sha: a commit cannot contain
        # its own sha, so resolution is DEFINED as the commit that INTRODUCED
        # the record file on the session branch. REQUIRED on an
        # `edit-document` record (allOf above) and NEVER required of
        # `create-document`, whose non-session use produces no commit (D13).
        #
        # `pull-request` — the pull request an `open-pr` action opened or
        # updated, referenced by URL: the formal re-entry of a session's work
        # into the governed doc system, dispatched into the existing
        # Merge-Master ritual and decided there, never here. REQUIRED on an
        # `open-pr` record (allOf above).
        #
        # Both are ADDITIVE enum extensions in the same shape as `document`,
        # and both are FIRST-CLASS kinds rather than `other` on the precedent
        # Brett set on 2026-07-25 — an audit consumer should be able to filter
        # session commits and session pull requests from the artifact
        # vocabulary and not only from `action`. No `contract_schema_version`
        # bump: no pre-existing record is required to carry either kind.
      reference:
        type: string
        minLength: 1
        # Path or id locating the produced artifact.
