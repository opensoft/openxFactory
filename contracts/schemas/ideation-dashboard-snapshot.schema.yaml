$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ideation-dashboard-snapshot.schema.yaml"
title: "Ideation-dashboard deterministic projection snapshot"
contract_schema_version: 1
description: >-
  The single data path for the ideation-area dashboard (`add-ideation-dashboard`;
  promoted spec requirements "Snapshot projection contract", "Realization funnel
  model", "Project grouping hierarchy", "Cluster canvas working surface", and
  "Keyword lens set-builder"). A deterministic generator scans `ideation/` plus
  active and archived OpenSpec changes for ONE repository and emits this
  snapshot; every renderer reads only the snapshot, never the repository
  directly (spec scenario "A renderer needs data the snapshot lacks"). The
  snapshot is a projection, never a source of truth: when it disagrees with the
  repository the resolution is regeneration and dashboard artifacts are never
  hand-edited (spec scenario "The dashboard disagrees with the repository").

  Deterministic: the same working tree MUST yield a byte-identical snapshot
  (spec scenario "The generator runs twice on the same tree"), so the envelope
  carries no wall-clock field — the generation stamp is the tree-derived
  `source_revision`, and any `generated_at` is derived from that revision's
  commit date, never the process clock.

  Forward-compatible / additive: consumers MUST ignore unknown properties. A new
  view acquires data by delta declaring new snapshot fields and the generator
  populating them; because unknown fields are tolerated, additive growth needs
  no `schema_version` bump and only a breaking change (a removed or retyped
  field) does. This is why — unlike the immutable `xfactory-document-catalog`
  record — no object here sets `additionalProperties: false`. Fields fed by
  not-yet-landed upstream changes are optional until those changes land: cluster
  `readiness`/`conflict_flags` arrive verbatim from the ideation-cross-reference
  index (add-ideation-cross-reference-readiness); document `inferred_topics` and
  keyword `inferred_doc_count` arrive from document-cataloging; document
  `completeness` (a deterministic per-document maturity signal) and staged-topic
  `health` (a folder-scoped health aggregate derived from it) grow from
  add-staging-workbench — the generator realization populates both, this schema
  growth lands first. The regenerated projection carries no lifecycle `status`
  (it is overwritten nightly, not an immutable `record` like the document
  catalog).
type: object
required:
  - schema_version
  - kind
  - repository
  - generation
  - documents
  - clusters
  - possibles
  - staged_topics
  - changes
  - keyword_index
properties:
  schema_version: {const: 1}
  # Normative kind literal from the promoted spec ("Snapshot projection
  # contract"); hyphenated per that requirement, not the underscored
  # `xfactory_*` in-file kind convention.
  kind: {const: ideation-dashboard-snapshot}
  repository:
    type: string
    minLength: 1
    # Canonical repository id this snapshot projects; keeps DomainxFactory
    # instances and an aggregation roll-up additive (v1 = openxFactory only).
  project:
    type: string
    minLength: 1
    # Resolved from the project register (D10); ABSENT = ungrouped, rendered as
    # its own implicit project (spec scenario "A repository is absent ...").
  project_group:
    type: string
    minLength: 1
    # Resolved project group for `project`; absent when ungrouped. Descriptive
    # navigation only — no lifecycle or authority semantics.
  generation: {$ref: "#/$defs/generation"}
  documents:
    type: array
    items: {$ref: "#/$defs/document"}
  clusters:
    type: array
    items: {$ref: "#/$defs/cluster"}
  possibles:
    type: array
    items: {$ref: "#/$defs/possible"}
  staged_topics:
    type: array
    items: {$ref: "#/$defs/staged_topic"}
  changes:
    type: array
    items: {$ref: "#/$defs/change"}
  keyword_index:
    type: array
    # Seeds the keyword-lens rail; per-doc match computation is renderer-side
    # from each document's `topics` (spec: "Keyword lens set-builder").
    items: {$ref: "#/$defs/keyword_entry"}
$defs:
  # --- shared vocabularies ---
  lifecycle_status:
    type: string
    # The controlled `Status:` header vocabulary (docs/document-lifecycle.md).
    enum: [brainstorm, staged, draft, ratified, standard, superseded, retired, record]
  evidence_pin:
    type: object
    # A pinned passage with cataloging-contract provenance (section ref +
    # passage hash); backs the canvas evidence board (D12).
    required: [document, section, passage_sha256]
    properties:
      document: {type: string, minLength: 1}                     # document `id` the passage lives in
      section: {type: string, minLength: 1}                      # section reference within the doc
      passage_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}  # hash of the pinned passage
  # --- generation stamp ("Snapshot projection contract") ---
  generation:
    type: object
    required: [source_revision]
    properties:
      source_revision:
        type: string
        minLength: 1
        # Git revision of the pinned checkout this snapshot projects; the
        # determinism anchor and the viewer's divergence check (spec scenario
        # "Snapshot and content disagree").
      generated_at:
        type: string
        format: date-time
        # Provenance only; to preserve byte-identity it is derived from
        # `source_revision`'s commit date (or omitted), never the wall clock.
      generator_version:
        type: string
        minLength: 1
        # Generator build id; deterministic per build.
  # --- source documents (funnel column 1) ---
  document:
    type: object
    required: [id, path, stage]
    properties:
      id: {type: string, minLength: 1}           # stable doc id (edges reference this)
      path: {type: string, minLength: 1}         # repo-relative path
      stage: {$ref: "#/$defs/lifecycle_status"}  # lifecycle Status: header
      kind: {type: [string, "null"]}             # Kind: header
      summary: {type: [string, "null"]}          # Summary: header
      topics:
        type: array
        items: {type: string, minLength: 1}
        # DECLARED Topics: header subjects — the doc→cluster edge source; never
        # conflated with `inferred_topics`.
      inferred_topics:
        type: array
        # Structurally separate from declared `topics`; optional until
        # document-cataloging lands (spec: declared kept distinct from inferred).
        items:
          type: object
          required: [tag, confidence, state]
          properties:
            tag: {type: string, minLength: 1}
            confidence: {type: number, minimum: 0, maximum: 1}
            state: {type: string, enum: [pending, suggested, reviewed]}
      dates:
        type: object
        properties:
          captured: {type: string, format: date}         # Captured: header
          last_transition: {type: string, format: date}  # last lifecycle move
      destinations:
        type: object
        # Where this doc is heading downstream (link refs only).
        properties:
          staged_topics: {type: array, items: {type: string, minLength: 1}}  # staging ids
          changes: {type: array, items: {type: string, minLength: 1}}        # change ids
          capabilities: {type: array, items: {type: string, minLength: 1}}   # capability names
      completeness:
        type: object
        # Deterministic per-document maturity signal (add-staging-workbench;
        # design D1/D2; requirement "Deterministic per-document completeness
        # signal"). `score` is a FIXED-weight combination of the five named
        # signals below at a fixed decimal precision — both are v1 contract
        # constants (see `completeness_signal` below), never a per-run input.
        # Optional: absent on a pre-growth snapshot, on an excluded document
        # (`_document_exclusion_reason`), or before the generator realization
        # populates it — a renderer MUST treat absence as "no bars", never as
        # a zero score (design D7). BOUNDED to judgment-free surfaces: this
        # score and its signals MUST NOT feed the readiness recommendation
        # gate and MUST NOT produce a doc-health finding; the ONE sanctioned
        # gate consumer anywhere in the corpus is the staged-to-proposal
        # readiness gate (add-staging-workbench), and even that gate never
        # reads this object directly — it consumes document scores only
        # indirectly, through the `staged_topic.health` aggregate below.
        required: [score, structure, length, open_markers, keyword_coverage, link_degree]
        properties:
          score: {type: number, minimum: 0, maximum: 1}
          structure: {$ref: "#/$defs/completeness_signal"}
          length: {$ref: "#/$defs/completeness_signal"}
          open_markers: {$ref: "#/$defs/completeness_signal"}
          keyword_coverage: {$ref: "#/$defs/completeness_signal"}
          link_degree: {$ref: "#/$defs/completeness_signal"}
  # --- per-document completeness signal (add-staging-workbench design D1/D2) ---
  completeness_signal:
    type: object
    # One NAMED completeness signal: a normalized `value` (0..1, saturating at
    # a FIXED constant so padding past the threshold cannot outscore
    # substance) beside the RAW `count` that produced it, so a rendered bar is
    # always explainable in the signal's own terms. The five signals are:
    # `structure` (fraction of the document's expected structural elements
    # present — the expected set is fixed per `Kind:` with a common fallback:
    # H1 title, the governance header block, at least one section); `length`
    # (body size normalized against a fixed saturation threshold, so padding
    # past it cannot outscore substance); `open_markers` (an INVERSE signal —
    # the standing TODO/TBD/FIXME/open-question-marker count normalized
    # against a fixed saturation count and subtracted from 1, so MORE
    # standing markers yields a LOWER value, never higher); `keyword_coverage`
    # (fraction of the document's declared `Topics:` subjects that resolve to
    # the snapshot's keyword vocabulary); `link_degree` (the document's
    # snapshot edge degree — cluster document edges plus `destinations` —
    # normalized against a fixed saturation degree). All five weights, every
    # saturation constant, and the decimal precision of `value`/`score` are
    # FIXED v1 contract constants (design D2) — deterministic and
    # reproducible from the pinned tree alone, with no model call, no wall
    # clock, no network, and no judgment input of any kind (design D1); a
    # tunable weight configuration is a possible successor, never a per-run
    # input (open question 1).
    required: [value, count]
    properties:
      value: {type: number, minimum: 0, maximum: 1}
      count:
        type: integer
        minimum: 0
        # The raw measurement behind `value` (element count, word count,
        # marker count, resolved-topic count, or edge degree — per signal).
  # --- topic clusters (funnel column 2; D11/D12 working surface) ---
  cluster:
    type: object
    required: [id, name, topics, document_edges]
    properties:
      id: {type: string, minLength: 1}
      name: {type: string, minLength: 1}
      topics:
        type: array
        items: {type: string, minLength: 1}  # the cluster's topic set
      document_edges:
        type: array
        # Many-to-many doc→cluster edges from Topics: headers; one edge per
        # member doc naming the topics that matched (spec scenario "One doc
        # feeds several clusters"). These edges are the ONLY canvas members.
        items:
          type: object
          required: [document, matched_topics]
          properties:
            document: {type: string, minLength: 1}
            matched_topics: {type: array, items: {type: string, minLength: 1}}
      tallies:
        type: object
        # Funnel tallies count LINKS, not cards (spec: "Realization funnel model").
        properties:
          document_links: {type: integer, minimum: 0}
          possible_links: {type: integer, minimum: 0}
      readiness:
        type: object
        # Verbatim tier scores from the ideation-cross-reference index; rendered
        # without re-scoring (spec scenario "Readiness scores exist for a
        # cluster"). Optional until add-ideation-cross-reference-readiness
        # supplies it; shape owned there, so unconstrained here.
      conflict_flags:
        type: array
        # Verbatim conflict flags from the same index; optional until it lands.
      lineage:
        type: object
        # Downstream artifacts for the canvas lineage strip — DISTINCT from the
        # member edges above (spec scenario "Member pane derivation").
        properties:
          staged_picks: {type: array, items: {type: string, minLength: 1}}  # staging ids
          proposals: {type: array, items: {type: string, minLength: 1}}     # change ids
          realized: {type: array, items: {type: string, minLength: 1}}      # change ids
  # --- possibles register (funnel column 3; consolidated in the cross-ref index) ---
  possible:
    type: object
    required: [id, title, claim, state]
    properties:
      id: {type: string, minLength: 1}
      title: {type: string, minLength: 1}
      claim: {type: string, minLength: 1}
      state: {type: string, enum: [latent, picked, rejected, superseded]}
      reason:
        type: string
        minLength: 1
        # REQUIRED for rejected/superseded (allOf below); the durable "why".
      citation:
        type: string
        minLength: 1
        # REQUIRED for rejected/superseded — an uncited rejection is invalid.
      claiming_clusters:
        type: array
        items: {type: string, minLength: 1}
        # Many-to-many cluster→possible edges; one entry per claiming cluster
        # (spec scenario "One possible is claimed by several clusters").
      pick:
        type: object
        # Present when state=picked (allOf below): the organize-gate pick edge.
        required: [staging_id]
        properties:
          staging_id: {type: string, minLength: 1}  # cited at the pick
          change_id: {type: string, minLength: 1}   # inherited at the proposal gate
      option_set:
        type: object
        # Choose-one grouping of alternative shapes of one feat; siblings share
        # `id`. Choosing one drafts the others' superseded transitions (D12).
        required: [id]
        properties:
          id: {type: string, minLength: 1}
          members: {type: array, items: {type: string, minLength: 1}}  # sibling possible ids
      supporting_evidence:
        type: array
        items: {$ref: "#/$defs/evidence_pin"}
        # doc + section ref + passage hash; seeds the canvas evidence board.
    allOf:
      # An uncited rejection/supersession is invalid (task 2.3 register rule).
      - if: {properties: {state: {enum: [rejected, superseded]}}}
        then: {required: [reason, citation]}
      - if: {properties: {state: {const: picked}}}
        then: {required: [pick]}
  # --- staged picks (funnel column 4) ---
  staged_topic:
    type: object
    required: [staging_id]
    properties:
      staging_id: {type: string, minLength: 1}
      files: {type: array, items: {type: string, minLength: 1}}  # topic-folder files
      readiness_state:
        type: string
        minLength: 1
        # Exit-readiness state; verbatim from the cross-ref index when present.
      target_change:
        type: string
        minLength: 1
        # Exit path — the change id this topic promotes into.
      health:
        type: object
        # Per-staged-topic health aggregate (add-staging-workbench design D8;
        # requirement "Staged-topic health signal"), derived EXCLUSIVELY from
        # the topic FOLDER's own corpus documents — documents that merely
        # declare the topic as a destination (a document's
        # `destinations.staged_topics`) are inbound context, never health
        # inputs. `status` is DERIVED from `blockers`, never scored directly:
        # `ready` (blockers empty), `stub` (the folder carries no corpus
        # documents), `developing` (otherwise) — so the icon and the gate can
        # never disagree about WHY. The ready threshold (`READY_MIN_SCORE`,
        # v1 = 0.60 per Brett's 2026-07-25 ruling, calibrated at realization)
        # is a FIXED v1 contract constant, pinned beside the completeness
        # weights — never a per-run input. Deterministic and reproducible
        # from the pinned tree alone, exactly like `document.completeness`.
        # NOT a readiness judgment: MUST NOT feed the readiness
        # recommendation gate or re-score any readiness tier, and no cluster
        # or possible gains any aggregate (design D3 — this is the ONE
        # sanctioned aggregate in the whole snapshot). This object is the
        # staged tile's display truth ONLY: the staged-to-proposal readiness
        # gate re-evaluates health LIVE against the pinned checkout at
        # request time through the same scoring module the generator uses,
        # never against this field, so a stale snapshot can show `ready`
        # while the live gate still refuses (design D9). Optional: absent on
        # a pre-growth snapshot or before the generator realization
        # populates it.
        required: [standing_open_items, doc_score_min, doc_score_mean, blockers, status]
        properties:
          standing_open_items:
            type: integer
            minimum: 0
            # Sum of the member documents' `open_markers` RAW counts (not
            # the normalized `value`).
          doc_score_min:
            type: number
            minimum: 0
            maximum: 1
            # Minimum `completeness.score` over the folder's member
            # documents, at the same fixed decimal precision.
          doc_score_mean:
            type: number
            minimum: 0
            maximum: 1
            # Mean `completeness.score` over the folder's member documents,
            # at the same fixed decimal precision.
          blockers:
            type: array
            items: {$ref: "#/$defs/health_blocker"}
            # Empty array <=> status: ready.
          status:
            type: string
            enum: [ready, developing, stub]
  # --- staged-topic health blocker (add-staging-workbench design D8) ---
  health_blocker:
    type: object
    # A named, countable reason a staged topic's health is not `ready` —
    # always explainable in one hover or one gate-refusal message (design
    # D8). The staged-to-proposal readiness gate cites these VERBATIM when it
    # refuses.
    required: [kind, document]
    properties:
      kind:
        type: string
        enum: [standing_open_items, below_ready_threshold]
      document: {type: string, minLength: 1}  # the member document this blocker names
      count:
        type: integer
        minimum: 0
        # REQUIRED for kind=standing_open_items — the document's standing
        # open-marker raw count.
      score:
        type: number
        minimum: 0
        maximum: 1
        # REQUIRED for kind=below_ready_threshold — the document's
        # completeness score (compare against the READY_MIN_SCORE constant).
    allOf:
      - if: {properties: {kind: {const: standing_open_items}}}
        then: {required: [count]}
      - if: {properties: {kind: {const: below_ready_threshold}}}
        then: {required: [score]}
  # --- changes (funnel columns 5-6: proposals + realized; D6 active + archived) ---
  change:
    type: object
    required: [id, status]
    properties:
      id: {type: string, minLength: 1}
      status: {type: string, enum: [active, archived]}
      ratification:
        type: object
        # Present once ratified; both fields required together.
        required: [ratifier, date]
        properties:
          ratifier: {type: string, minLength: 1}
          date: {type: string, format: date}
      code_surface: {type: [string, "null"]}    # release-realization front-matter
      target_release: {type: [string, "null"]}
      task_progress:
        type: object
        # Task completion for the progress bar.
        properties:
          completed: {type: integer, minimum: 0}
          total: {type: integer, minimum: 0}
      origin_staging_id: {type: [string, "null"]}  # staging topic this change came from
  # --- keyword-lens rail seed ("Keyword lens set-builder") ---
  keyword_entry:
    type: object
    required: [keyword, declared_doc_count]
    properties:
      keyword: {type: string, minLength: 1}
      declared_doc_count:
        type: integer
        minimum: 0
        # Docs carrying this keyword as a DECLARED Topics: subject.
      inferred_doc_count:
        type: integer
        minimum: 0
        # Docs carrying it as an INFERRED tag — kept separate from declared;
        # optional until document-cataloging lands.
