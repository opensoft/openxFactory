schema_version: 1
name: xfactory_domain_stack
description: >-
  Canonical shape of a DomainxFactory stack.yaml. This is the conformance
  contract every domain repo pins and is validated against by
  scripts/validate-domain-factory.py (consumed from openxFactory, never
  copied). The Hermes stack is declared as an ordered list of authority
  layers, each bound to a canonical role. Canonical roles fix vocabulary:
  "customer" is always the served subject (patient, client entity, campaign,
  project, managed system); "client" is always the tenant/operator
  organization (clinic, firm, agency, engineering org, MSP); "domain" is
  always the reusable expert domain. Domains supply display names but may
  not repurpose role semantics. Legacy key styles (subject_overlay,
  care_organization_overlay, client_overlay/customer_overlay flat keys)
  are deprecated and produce validator warnings.
type: object
required:
  - schema_version
  - kind
  - domain
  - xfactory
  - hermes
  - omnigent
  - tenancy
properties:
  schema_version:
    type: integer
  kind:
    type: string
    enum:
      - xfactory_domain_stack
  domain:
    type: object
    required:
      - id
      - product_name
      - display_name
      - category
    properties:
      id:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
      product_name:
        type: string
      display_name:
        type: string
      category:
        type: string
  xfactory:
    type: object
    required:
      - contract_repo
      - contract_name
      - contract_ref_type
      - contract_ref
      - contract_schema_version
      - contract_declared_at
      - contract_source
    properties:
      contract_repo:
        type: string
      contract_name:
        type: string
        enum:
          - openxFactory
      contract_ref_type:
        type: string
        enum:
          - commit
          - tag
      contract_ref:
        type: string
      contract_schema_version:
        type: integer
      contract_declared_at:
        type: string
      contract_source:
        type: string
      promoted_from:
        type: array
        description: >-
          Optional promotion provenance: neutral openxFactory artifacts this
          domain originated. Declared when a concept born in this repo was
          promoted through the domain-to-neutral promotion process; health
          tooling verifies entries resolve once the candidate register entry
          reaches adopted status.
        items:
          type: object
          required:
            - artifact
            - candidate_id
          properties:
            artifact:
              type: string
            candidate_id:
              type: string
            origin_artifact:
              type: string
      specializes:
        type: array
        description: >-
          Optional overlay provenance: neutral openxFactory artifacts this
          domain refines through thin overlays after adopting a promotion.
        items:
          type: object
          required:
            - neutral_artifact
            - overlay
          properties:
            neutral_artifact:
              type: string
            overlay:
              type: string
  hermes:
    type: object
    required:
      - layers
    properties:
      layers:
        type: array
        description: >-
          Ordered top (served subject) to bottom (reusable domain). Must
          contain exactly one layer per canonical role customer, client,
          and domain. Additional intermediate layers are allowed with
          role: extension and an authority_scope note.
        minItems: 3
        items:
          type: object
          required:
            - role
            - display_name
            - overlay
          properties:
            role:
              type: string
              enum:
                - customer
                - client
                - domain
                - extension
            display_name:
              type: string
            overlay:
              type: string
              description: Repo-relative directory containing the layer overlay/template files.
            authority_scope:
              type: string
              description: Required when role is extension.
  omnigent:
    type: object
    required:
      - domain_overlay
      - orchestrator_profile
    properties:
      domain_overlay:
        type: string
      orchestrator_profile:
        type: string
  memory_gateway:
    type: object
    description: >-
      DomainxFactory specialization of the canonical xFactory Memory Gateway.
      This block declares provider profiles, per-layer bindings, break-glass
      workflows, and the conformance tier the domain claims. Hermes overlay
      files must not contain direct memory provider endpoints or credential
      refs; governed access is routed through xfactory.memory.*.
    required:
      - conformance_tier
      - canonical_contract
      - providers
      - bindings
    properties:
      conformance_tier:
        type: string
        enum:
          - M0
          - M1
          - M2
          - M3
          - M4
      canonical_contract:
        type: string
      placeholder:
        type: boolean
        description: >-
          True only for starter scaffolds that have not selected providers yet.
          Domain-ready stacks must declare concrete providers and bindings.
      customer_memory_gateway:
        type: object
        properties:
          customer_layer_name:
            type: string
          customer_subject_kinds:
            type: array
            items:
              type: string
          required_operations:
            type: array
            items:
              type: string
          direct_provider_policy:
            type: object
            properties:
              worker_credentials_allowed:
                type: boolean
              diagnostics_only:
                type: boolean
              diagnostic_namespace:
                type: string
      omnigent_expert_memory_gateway:
        type: object
        properties:
          consumer_layer:
            type: string
          expert_profiles:
            type: array
            items:
              type: string
          allowed_knowledge_scopes:
            type: array
            items:
              type: string
          source_authority_minimum:
            type: string
          audit_required:
            type: boolean
      providers:
        type: array
        items:
          type: object
          required:
            - provider_id
            - provider_role
            - profile_ref
          properties:
            provider_id:
              type: string
            provider_role:
              type: string
            profile_ref:
              type: string
            allowed_knowledge_scopes:
              type: array
              items:
                type: string
            source_authority_minimum:
              type: string
      bindings:
        type: array
        items:
          type: object
          required:
            - binding_id
            - provider_id
            - layer_scope
            - allowed_operations
            - grant_ttl_seconds
          properties:
            binding_id:
              type: string
            provider_id:
              type: string
            layer_scope:
              type: array
              items:
                type: string
            allowed_operations:
              type: array
              items:
                type: string
            client_scope:
              type: array
              items:
                type: string
            subject_scope:
              type: array
              items:
                type: string
            grant_ttl_seconds:
              type: integer
      break_glass_workflows:
        type: array
        items:
          type: object
          required:
            - id
            - workflow_ref
            - allowed_actor_classes
            - subject_scope
            - minimal_packet_profile
            - max_ttl_seconds
            - notification_targets
            - retrospective_review_sla
          properties:
            id:
              type: string
            workflow_ref:
              type: string
            allowed_actor_classes:
              type: array
              items:
                type: string
            subject_scope:
              type: array
              items:
                type: string
            minimal_packet_profile:
              type: string
            max_ttl_seconds:
              type: integer
            notification_targets:
              type: array
              items:
                type: string
            retrospective_review_sla:
              type: string
  tenancy:
    type: object
    description: >-
      Must declare tenant_kinds (or client_kinds for operator-tenant domains)
      and an isolation map. Every isolation value must be one of the
      recognized isolation scopes so isolation is a checkable claim rather
      than free text.
    properties:
      tenant_kinds:
        type: array
        items:
          type: string
      client_kinds:
        type: array
        items:
          type: string
      customer_kinds:
        type: array
        items:
          type: string
      isolation:
        type: object
        additional_property_values:
          enum:
            - per_tenant
            - per_client
            - per_customer
            - per_patient
            - per_campaign
            - per_project
            - per_ledger
            - shared_with_review
