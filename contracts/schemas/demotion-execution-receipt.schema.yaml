$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "demotion-execution-receipt.schema.yaml"
title: Demotion execution receipt
contract_schema_version: 1
description: >-
  Durable evidence written only after an explicit demotion execution has
  returned proposal material to its exact staged destination. A transition
  manifest is planning evidence; this receipt is execution evidence.
type: object
required:
  - schema_version
  - kind
  - actor
  - change_id
  - status
  - destination
  - executed_at
  - transition_manifest
  - returned_artifacts
  - removed_change_folder
properties:
  schema_version: {const: 1}
  kind: {const: demotion-execution-receipt}
  actor: {type: string, minLength: 1}
  change_id: {type: string, minLength: 1}
  status: {const: executed}
  destination:
    type: object
    required: [kind, id, path]
    properties:
      kind: {const: staged}
      id: {type: string, minLength: 1}
      path:
        type: string
        pattern: ^ideation/staging/[^/]+$
  executed_at: {type: string, format: date-time}
  transition_manifest: {type: string, minLength: 1}
  returned_artifacts:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  removed_change_folder: {type: boolean}
