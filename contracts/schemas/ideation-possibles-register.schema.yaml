$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ideation-possibles-register.schema.yaml"
title: "Ideation possibles-register consolidation section (cross-reference index embed)"
contract_schema_version: 1
description: >-
  The canonical possibles register for the ideation area (`add-ideation-dashboard`;
  promoted `ideation-cross-reference` delta requirement "Possibles register
  consolidation", `document-lifecycle` requirement "Possible feats declaration",
  and decision R1/R2/R3). Every `Possible feats:` declaration across ideation
  documents is consolidated into ONE register entry per possible, each carrying a
  single lifecycle state and explicit many-to-many edges to its claiming topic
  clusters.

  EMBEDDING (envelope-less fragment — no third standalone register file). Per R1
  and both promoted deltas the register "is the cross-reference index" and "no
  third standalone register file exists": the register is a SECTION of the unified
  cross-reference index (`ideation/cross-reference.md`) owned by the active
  ratified `add-ideation-cross-reference-readiness` change, the same consolidation
  posture as that index's `Topics:`/`Target capabilities:` tag bootstrap. This
  file is therefore a pure `$defs` kernel — modelled on
  `xfactory-document-opaque-locator.schema.yaml`, it is NEVER validated as a whole
  document on its own and carries no top-level `type`/`kind`/`schema_version`
  envelope. The index owns the top-level envelope; this fragment owns the register
  section's shape and is `$ref`'d into the index's schema. SEAM RESOLVED
  (2026-07-14, `add-ideation-cross-reference-readiness` task 2.1): the index's own
  structured schema is now realized at
  `contracts/schemas/ideation-cross-reference.schema.yaml`, which embeds this
  kernel under the top-level field `possibles_register` via
  `$ref: "ideation-possibles-register.schema.yaml#/$defs/possibles_register"`,
  fixing the previously provisional embedding field name and confirming a
  structured (not markdown-only) register block. That index is the source of
  truth (`ideation/cross-reference.yaml`); `ideation/cross-reference.md` is its
  generated projection. This delta was declared relative to
  `add-ideation-cross-reference-readiness`'s outcome and archives after it; its
  task 1.1 sequencing confirmed the resolved embedding field name above.
  Consumers embed via `$ref: "ideation-possibles-register.schema.yaml#/$defs/possibles_register"`
  (whole section) or `#/$defs/register_entry` (one entry).

  STATE MACHINE (documented; only the single-instance slices below are schema-
  expressible). A possible occupies exactly one state:
    - `latent`    — enumerated, unpicked backlog (not failure); the seeded default.
    - `picked`    — selected at the organize gate; carries a pick edge citing the
                    staged topic's staging ID, inheriting the change ID when the
                    topic crosses the proposal gate.
    - `rejected`  — declined before ever being picked; REQUIRES reason + citation.
    - `superseded`— displaced (e.g. an option-set sibling was chosen, or a picked
                    possible was abandoned); REQUIRES reason + citation.
  Legal transitions:
    latent -> picked | rejected | superseded
    picked -> superseded            (reason + citation; abandonment of a picked
                                     possible is a supersession, never a rejection,
                                     because it already carried a pick edge / lineage)
    rejected, superseded            terminal.
  No backward transitions and NO RESURRECTION: a previously rejected or superseded
  idea that becomes viable again is recorded as a NEW register entry with a new
  `id`, preserving the original entry's audit trail; the register is never edited
  back to `latent`/`picked`. `rejected` is a pre-pick disposition only (an entry
  that was never picked); a picked entry that stops being pursued goes to
  `superseded`, not `rejected`. JSON Schema validates one instance, not a
  transition across snapshots, so transition legality, terminality, no-resurrection,
  and `id` uniqueness within the register are enforced by the strict register
  validator (task 2.4), not by this schema; the conditional `allOf` blocks below
  express only the per-state field requirements.

  ALIGNMENT with the snapshot's read-side `possible` projection
  (`ideation-dashboard-snapshot.schema.yaml#/$defs/possible`): `register_entry`
  is the source-of-truth shape, `possible` is its snapshot projection, and the
  field names match one-for-one — `id`, `title`, `claim`, `state` (same four-value
  enum), `reason`, `citation`, `claiming_clusters` (cluster-id strings),
  `pick.staging_id`/`pick.change_id`, `option_set.id`/`option_set.members`, and
  `supporting_evidence` items (the shared `evidence_pin`: `document` + `section` +
  `passage_sha256`, `$ref`'d from the snapshot schema so pins stay byte-identical
  across the register and its projection, mirroring how
  `xfactory-document-cataloger-recommendation.schema.yaml` reuses the snapshot's
  `facet_assignment`). The one register-only field the snapshot's `possible` does
  not yet carry is `provenance` (the `Possible feats:` ingestion source — every
  ingested possible cites the document and section it came from); the snapshot MAY
  project it additively later without a break. HUMAN-SEEN CLUSTER INTAKE is a
  SIBLING concern, out of this fragment: the promoted "Human-seen cluster intake"
  requirement lands on the cross-reference index's CLUSTER/recommendation entry
  (the `pending_review` disposition + evidence contract per R8) owned by
  `add-ideation-cross-reference-readiness` task 2.1, not on the register. The only
  linkage here is that a `claiming_clusters` edge MAY reference a human-seen
  cluster's id like any other cluster id; the register carries no human-seen state.

  AI-DERIVATION INTAKE (SIBLING of human-seen; lands ON this fragment,
  `add-possibles-derivation-lane`). Where the human-seen cluster intake above
  lands on the INDEX's cluster entry, the possibles-side analog lands HERE: a
  bounded, read-only derive-possibles worker PROPOSES candidate register entries
  that carry `origin: ai-derived` and a `derivation` block (worker-run identity +
  machine `disposition: pending_review`); humans dispose them on the same gate
  console, and an accepted candidate becomes a first-class `latent` possible
  retaining `origin: ai-derived` — the one-for-one mirror of the index topic
  entry's `origin` + `human_seen` pair. The worker-run identity lives in
  `derivation.worker_run`, NOT in `ingestion_provenance`, whose `Possible feats:`
  meaning and `required: [document, section]` are untouched; a derived entry
  cites its source clusters and passages through the existing `claiming_clusters`
  and `supporting_evidence` fields. Both `origin` and `derivation` are OPTIONAL
  and the conditional never fires on an origin-absent (human-authored) entry, so
  the delta is ADDITIVE and needs NO `contract_schema_version` bump. The
  register-wide `id` uniqueness, the required source citation on a derived entry,
  the machine-only `pending_review` disposition, and the one-way disposition
  lifecycle (no edit back to undisposed, no resurrection) are enforced by the
  strict register validator (`scripts/validate-ideation-dashboard-contracts.py`,
  this fragment's C3 delegated owner), not by this schema.

  ADDITIVE / forward-compatible: the cross-reference index is a generated
  projection, so — like `ideation-dashboard-snapshot` — objects here stay open
  (no `additionalProperties: false`), consumers MUST ignore unknown properties,
  and additive growth needs no `contract_schema_version` bump; only a removed or
  retyped field does. This fragment's `contract_schema_version` is tracked in
  `contracts/manifest.yaml` at task 2.5, distinct from the index instance's own
  top-level `schema_version`.
$defs:
  # --- the register section the cross-reference index embeds ---
  possibles_register:
    type: array
    description: >-
      The consolidated register: one entry per possible (validator rule — `id`
      unique within the array; not expressible as a JSON Schema key constraint).
      Embedded into the cross-reference index under the field its task-2.1
      realization names (working name `possibles_register`); see the embedding
      note above and task 1.1.
    items: {$ref: "#/$defs/register_entry"}
  # --- one consolidated possible ("Possibles register consolidation"; R2/R3) ---
  register_entry:
    type: object
    # Open (additive projection posture); source-of-truth twin of the snapshot's
    # `possible` $def — same field names, plus `provenance`.
    required: [id, title, claim, state, provenance]
    properties:
      id:
        type: string
        minLength: 1
        # Stable register id; edges (cluster claims, option-set members) and the
        # snapshot projection reference this. Unique within the register
        # (validator rule).
      title:
        type: string
        minLength: 1
        # Short name of the candidate feat.
      claim:
        type: string
        minLength: 1
        # What the possible asserts the topic could become — the durable backlog
        # statement that would otherwise evaporate into prose.
      state:
        type: string
        enum: [latent, picked, rejected, superseded]
        # Exactly one state; see the documented transition machine above. Same
        # enum as the snapshot's `possible.state`.
      reason:
        type: string
        minLength: 1
        # REQUIRED for `rejected`/`superseded` (allOf below) — the durable "why",
        # mirroring the contested-finding disposition rule. Absent for
        # `latent`/`picked`.
      citation:
        type: string
        minLength: 1
        # REQUIRED for `rejected`/`superseded` (allOf below) — an uncited
        # rejection/supersession is invalid (spec scenario "A possible is
        # rejected without citation"). For a supersession the citation names what
        # displaced it (e.g. the chosen option-set sibling's `id`).
      provenance: {$ref: "#/$defs/ingestion_provenance"}
      claiming_clusters:
        type: array
        items: {type: string, minLength: 1}
        # Many-to-many edges to the topic clusters that claim this possible — one
        # cluster id per entry (spec scenario "Declarations are consolidated";
        # snapshot scenario "One possible is claimed by several clusters"). A
        # cluster id here MAY be a human-seen cluster; that provenance lives on the
        # cluster entry in the index, never on the possible.
      pick: {$ref: "#/$defs/pick_edge"}
      option_set: {$ref: "#/$defs/option_set"}
      supporting_evidence:
        type: array
        # Passage pins backing the possible (doc + section ref + passage hash),
        # byte-identical to the snapshot's `possible.supporting_evidence` items
        # and the canvas evidence board (D12).
        items: {$ref: "ideation-dashboard-snapshot.schema.yaml#/$defs/evidence_pin"}
      # --- AI-derivation intake (add-possibles-derivation-lane; ADDITIVE) ---
      # One-for-one mirror of the index topic_entry's `origin` + `human_seen`
      # pair (see the AI-DERIVATION INTAKE note in the header). Both OPTIONAL; a
      # human-authored possible carries neither and is unaffected.
      origin:
        type: string
        enum: [human-authored, ai-derived]
        # Provenance of the possible. Absent defaults to `human-authored`
        # (exactly as the index topic_entry.origin absent means
        # `machine-derived`). An `ai-derived` entry REQUIRES the `derivation`
        # block (allOf below).
      derivation: {$ref: "#/$defs/derivation"}
    allOf:
      # A rejected/superseded possible without a recorded reason AND citation is
      # invalid (task 2.3 register rule; spec scenario "A possible is rejected
      # without citation").
      - if: {properties: {state: {enum: [rejected, superseded]}}}
        then: {required: [reason, citation]}
      # A picked possible MUST carry its organize-gate pick edge.
      - if: {properties: {state: {const: picked}}}
        then: {required: [pick]}
      # An `ai-derived` possible carries its `derivation` block (worker-run
      # identity + `pending_review`) — mirrors the index topic_entry's human-seen
      # conditional. Never fires on an origin-absent (human-authored) entry, so
      # the delta stays additive.
      - if:
          properties: {origin: {const: ai-derived}}
          required: [origin]
        then:
          required: [derivation]
  # --- `Possible feats:` ingestion provenance (register-only) ---
  ingestion_provenance:
    type: object
    description: >-
      Where the possible was ingested from — every consolidated possible cites the
      source document and the `Possible feats:` section it was declared in
      (`document-lifecycle` "Possible feats declaration"). Required on every entry;
      the snapshot's `possible` does not yet project it (additive later).
    required: [document, section]
    properties:
      document: {type: string, minLength: 1}   # source document `id` (or repo-relative path pre-snapshot)
      section: {type: string, minLength: 1}     # the `Possible feats:` section reference within that document
  # --- organize-gate pick edge (R3) ---
  pick_edge:
    type: object
    description: >-
      Present when `state=picked`. Cites the staged topic's staging ID at the
      organize gate; `change_id` is absent until the staged topic crosses the
      proposal gate, then inherited while the original `staging_id` is retained
      (spec scenario "A picked possible's topic crosses the proposal gate";
      `document-lifecycle` scenario "A possible is picked at the organize gate").
      Same shape as the snapshot's `possible.pick`.
    required: [staging_id]
    properties:
      staging_id: {type: string, minLength: 1}  # cited at the pick
      change_id: {type: string, minLength: 1}    # inherited at the proposal gate; optional until then
  # --- choose-one option set (D12) ---
  option_set:
    type: object
    description: >-
      Groups alternative shapes of one feat; sibling entries share `id`. Choosing
      one member is realized as: the chosen member proceeds (latent -> picked) and
      each sibling's `latent`/`picked` -> `superseded` transition is DRAFTED with
      the required reason and citation (the chosen member's `id`) for human commit
      (D12; spec scenario "An option set resolves"). The drafting is a
      canvas/composer action a human commits — never an autonomous register
      mutation. Same shape as the snapshot's `possible.option_set`.
    required: [id]
    properties:
      id: {type: string, minLength: 1}                              # shared option-set id
      members:
        type: array
        items: {type: string, minLength: 1}                         # sibling `register_entry` ids
  # --- AI-derivation block (add-possibles-derivation-lane; ADDITIVE) ---
  derivation:
    type: object
    description: >-
      Present when `register_entry.origin: ai-derived` (allOf conditional on
      `register_entry`). Records the bounded derive-possibles worker run that
      PROPOSED the possible and the machine review disposition; a derived
      possible is never an autonomous act — humans dispose it on the gate
      console. The possibles-side analog of the index topic_entry's `human_seen`
      intake block. Open posture (this family): consumers ignore unknown
      properties; additive growth needs no `contract_schema_version` bump.
    required: [worker_run, disposition]
    properties:
      worker_run:
        type: object
        description: >-
          The orchestration-stamped worker-run identity. The tool-less worker
          proposes titles/claims/rationale prose only; the correlation id and
          every other machine-precision value are orchestration-authoritative,
          not worker-supplied (the change's "Orchestration-authoritative
          identifiers" requirement). Lives here, not in `ingestion_provenance`,
          so that fragment's `Possible feats:` shape is not stretched.
        required: [correlation_id, worker_profile, prompt_contract_version]
        properties:
          correlation_id: {type: string, minLength: 1}        # the run's orchestration correlation id
          worker_profile: {type: string, minLength: 1}        # the bounded derive-possibles Omnigent profile
          prompt_contract_version: {type: string, minLength: 1}  # the versioned prompt contract that produced the proposal
      disposition:
        const: pending_review
        # The MACHINE output — a derived possible is always a proposal pending
        # review, never an autonomous verdict (as with the index
        # `recommendation.disposition` / `human_seen.disposition` /
        # `score_evidence.disposition`). The human verdict is recorded in
        # `human_disposition`; this machine field stays `pending_review`.
      human_disposition: {$ref: "#/$defs/derivation_human_disposition"}
  # --- human disposition of a derived possible (LOCAL structural mirror) ---
  derivation_human_disposition:
    type: object
    description: >-
      Recorded when a human authority disposes a `pending_review` derived
      possible on the gate console. A DOCUMENTED STRUCTURAL MIRROR of the index
      schema's `human_disposition`
      (`ideation-cross-reference.schema.yaml#/$defs/human_disposition`), copied
      field-for-field rather than `$ref`'d — this kernel is EMBEDDED by that
      index, so a `$ref` back into it would be circular (the family's established
      mirror pattern, as `score_evidence` mirrors the organizer recommendation).
      accepted -> the entry becomes a first-class `latent` possible retaining
      `origin: ai-derived`; rejected -> the entry is recorded `rejected` with
      reason + citation (the register `state` machine above). The one-way
      lifecycle is enforced by the strict register validator.
    required: [outcome, authority]
    properties:
      outcome:
        type: string
        enum: [accepted, rejected, deferred]
      authority:
        type: string
        minLength: 1
        # The disposing tier/authority on the gate console.
      at: {type: string, format: date}
      note: {type: string, minLength: 1}
