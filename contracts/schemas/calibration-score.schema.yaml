$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "calibration-score.schema.yaml"
title: "Calibration score (every ex-ante prediction graded at maturity)"
contract_schema_version: 1
description: >-
  One graded prediction (add-capability-steward, requirement "Savings Are
  Sentinel-Anchored And Predictions Are Scored"): recurrence forecasts,
  build estimates, half-lives, and savings projections are stored with
  maturity dates by their producing contracts, and this record is the
  grade — actual against predicted, feeding the empirical-Bayes priors so
  the factory learns to invest. An unscored predictor is decoration
  (pattern-ledger RF-C5); this record is where that rule cashes out.
  Canonical validator: scripts/validate-capability-steward.py.
type: object
additionalProperties: false
required:
  - schema_version
  - kind
  - score_id
  - prediction_ref
  - prediction_kind
  - actual
  - score
  - feeds
properties:
  schema_version: {const: 1}
  kind: {const: calibration_score}
  score_id: {type: string, pattern: "^cal:"}
  prediction_ref: {type: string, minLength: 1}
  prediction_kind: {enum: [recurrence_forecast, build_estimate, half_life, savings_projection]}
  actual: {type: ["number", "string"]}
  score: {type: number}
  feeds: {const: prior-update}
  at: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}"}
