#     conjunction rule seats the CSC as a second client voice on rules touching
#     security posture, and what that seat does when seated is `review`.
#     `review` is the canonical act token the register reader enforces
#     (`register-act-not-review` refuses anything else). Widening the act set
#     because the bench grew would smuggle new authority through a recovery.
#   * `objects: [opensoft/openxFactory]` — STANDS, and it still needs the
#     explicit sentence `grant-grc-0001` gave it, because it still looks wrong
#     at first reading. This body governs codexFactory's gate rules, so a
#     reader expects `codeXfactory/codexFactory` here. It is
#     `opensoft/openxFactory` for a structural reason: the reader enforces SET
#     EQUALITY between this list and the backing row's `target_repo`, the
#     register is an openxFactory artifact adjudicated inside THIS repository's
#     REQUIRED `wallet-validation` check, and `repo_scan` builds its context
#     from the scanned repository's own records — a cross-repository audience
#     has no resolution path today. A row naming `codeXfactory/codexFactory`
#     would be a row this estate cannot resolve, not a wider authority.
#   * `authority_tier: act` — STANDS, on an UNCHANGED basis: the custody
#     attestation `../attestations/custody-attest-wal-agent-grc-0001.yaml`,
#     which attests `holder_readable` custody for `wal-agent-grc-0001` and was
#     NOT touched by this event. Q-GRC-1 (RULED 2026-09-06T14:13:46Z) was never
#     scoped to four seats, so the FIFTH key's `holder_readable` custody needs
#     no fresh determination and gets none. Without the attestation row the
#     unattested cap applies and this grant could reach only `request`.
#     `act_unsupervised` is refused outright for review authority.
#   * `approval_posture` — BYTE-IDENTICAL to `grant-grc-0002`'s three lines,
#     carried forward unchanged. It is the compensating control that lets
#     `holder_readable` custody reach tier `act` at all (clarifications N13);
