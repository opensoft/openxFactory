# IT IS A COLD START, NOT A RE-ISSUANCE. `agent:gate-rules-council` has held no
# wallet, no grant and no register row before this act, so
# `docs/governed-reissuance-runbook.md` does NOT govern here and no grant is
# superseded. The governing document is
# `docs/council-seat-key-mint-runbook.md` — the mint-and-register ceremony,
# whose §0.2 draws exactly this line: "If the body already holds a wallet, you
# are performing a re-issuance and governed-reissuance-runbook.md governs
# instead."
#
# IT IS A ROOT GRANT. No `parent_grant_ref`: `parent_grant_ref` means DERIVED
# FROM, and nothing this grant carries is derived from `grant-mrc-0001` or
# `grant-mrc-0002`. The two bodies are two holders. That `grant-mrc-0002` and
# this grant share an `expires_at` is a RULING (Q-GRC-3, so that one
# re-issuance ceremony covers both bodies), not a derivation.
