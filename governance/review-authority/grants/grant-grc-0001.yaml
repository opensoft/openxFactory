# ============================================================================
# THE SCOPE — EACH ELEMENT EXAMINED, AND WHY IT STANDS
# ============================================================================
#
# The mint runbook's §3.3 requires it in terms: "Re-examine every scope element
# and RECORD WHY IT STANDS. A later reader must be able to tell a decision from
# a paste." This is a cold start, so nothing is inherited and every element is
# a first choice — which makes the record MORE owed here, not less.
#
#   * `acts: [review]` — STANDS, and it is the whole act set. `review` is the
#     canonical act token the register reader enforces
#     (`register-act-not-review` refuses anything else). This body SETS gate
#     rules; setting them is a governed roster/rule act in codexFactory, not an
#     act over an openxFactory object, and it is not what this grant confers.
#     What this grant confers is the authority to REVIEW. Nothing else was
#     considered, and widening the set on a cold start would smuggle authority
#     nobody ruled.
#   * `objects: [opensoft/openxFactory]` — STANDS, AND IT NEEDS AN EXPLICIT
#     SENTENCE BECAUSE IT LOOKS WRONG AT FIRST READING. This body governs
#     codexFactory's gate rules, so a reader expects `opensoft/codexFactory`
#     here. It is `opensoft/openxFactory` for a structural reason, and the
#     reason is not a paste from `grant-mrc-0002`: the reader enforces SET
#     EQUALITY between this list and the backing row's `target_repo`, the
#     register is an OPENXFACTORY artifact adjudicated inside THIS
#     repository's REQUIRED `wallet-validation` check, and `repo_scan` builds
#     its context from the scanned repository's own records — a
#     cross-repository audience has no resolution path today
#     (add-wallet-carried-review-authority clarifications N7). A row naming
#     `opensoft/codexFactory` would be a row this estate cannot resolve, not a
#     wider authority. The object is therefore the repository whose review this
#     register commissions, and the body's DOMAIN of rule-setting is a
#     different thing that no field here carries. The same asymmetry is already
#     on `grant-mrc-0002` for the same reason; it is re-derived here rather
#     than inherited.
#   * `authority_tier: act` — STANDS, on a named and checkable basis: the
#     custody attestation
#     `../attestations/custody-attest-wal-agent-grc-0001.yaml`, which attests
#     `holder_readable` custody for `wal-agent-grc-0001`. Without that row the
#     unattested cap applies and this grant could reach only `request`.
#     `act_unsupervised` is refused outright for review authority and was never
#     a candidate.
#   * `approval_posture` — BYTE-IDENTICAL to `grant-mrc-0002`'s three lines, and
#     identical is the point rather than a shortcut: approval-before-apply is
#     the compensating control that lets `holder_readable` custody reach tier
#     `act` at all (clarifications N13), authority agents may not approve, and
#     no human-escalation act is enumerated. Task 3.5 requires the byte
#     identity by name. A posture that relaxed any of the three would quietly
#     remove the ground the tier stands on.
#
# THE AUDIENCE is `wal-agent-grc-0001` / `agent:gate-rules-council` — the
# wallet minted in the same act and the body codexFactory's roster spells
# `gate_rules_council`. The register's `council_ref`/`council_id` pair records
# both spellings because neither is derivable from the other by any declared
# rule; the reader checks that they denote one body.
#
# ============================================================================
# THE EXPIRY — RULED, AND DELIBERATELY SHARED
# ============================================================================
#
# `expires_at: 2027-06-30T00:00:00Z`, RULED as Q-GRC-3 by Brett Heap at
# 2026-09-06T14:13:46Z: "the same date as grant-mrc-0002, so one re-issuance
# ceremony covers both bodies." It is character-for-character equal to
# `row-grc-0001`'s, because the reader compares the two and any drift is a
# `register-grant-mismatch`.
#
# WHY SHARING IT IS A DECISION AND NOT A COPY. `grant-mrc-0002`'s date is bound
# to the Operator identity record's review expiry, itself bound to
# `claude-sonnet-5`'s published retirement floor — the earliest floor among the
# pinned seat identifiers. THIS body's pinned identifiers are `claude-opus-5`
# (`lead-architect` under R1, `lead-security`) and `claude-sonnet-5`
# (`lead-quality`, `company-policy-lead`), so the same floor is the binding
# floor here too, and the shared date is the same binding reached
# independently. What the ruling adds on top is the OPERATIONAL reason: two
# bodies whose grants expire on one day are one scheduled ceremony rather than
# two.
#
# THE HONEST CAVEAT, carried from the re-issuance runbook's §6.1: NOTHING IN
# THIS ESTATE READS A RETIREMENT DATE. This expiry is a date in a file that the
# register reader computes against at read time (`register-row-expired`,
# `grant-state-stale`), and that is the whole of its enforcement. The
# retirement horizon it is bound to is a promise with a named human owner, not
# a control.
#
# ON THAT DAY every gate-rules convening parks — IF AND WHEN ONE RUNS. NONE
# EVER HAS: codexFactory's `.github/workflows/gate-rules-convening.yml`
# (workflow id 352457764) reports `total_count: 0` runs. The sentence above
# describes the CONTROL'S SHAPE, not an observed behaviour, and must not be
# read as evidence that convenings happen.
#
