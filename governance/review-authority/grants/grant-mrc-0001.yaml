#
# REASON CLASS IS **DRIFT** — a composition-caused revocation — and DRIFT
# propagates exactly as CAUSE: no derived authority survives on the strength of
# its parent's reason. The class is carried IN THE REASON PROSE below because
# the pinned schema's `revocation` block is `additionalProperties: false` over
# exactly {revoked_at, reason, propagated_from} and has no classed field;
# whether `reason` may carry the class as-is or needs a distinct carrier is
# openXwallet `add-composition-drift-cascade` task 3.2, still OPEN.
#
# `propagated_from` is ABSENT and correctly so: this grant is the ORIGIN of the
# revocation, not a descendant that inherited one. There is no `revoked_by`
# field in the schema, so the ratifying human is named in the re-issuance record
# — `openspec/changes/add-wallet-carried-review-authority/reissuance-2026-09-02-s5-composition.md`
# — and not here.
