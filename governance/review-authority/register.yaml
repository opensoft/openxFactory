# THE PER-SEAT SIGNING KEYS (add-per-seat-register-entries, wallet-v1.2).
#
# Four Ed25519 keypairs were minted 2026-08-28, one per seat of codexFactory's
# `merge_readiness_council`, and their private halves provisioned as
# COUNCIL_SEAT_SIGNING_KEY_<SEAT> in that repository's `worker-credentials`
# environment. The record is codexFactory
# `hermes/domain/review-councils/records/2026-08-28-seat-signing-keys-minted.md`
# (merged 78b8fa2) and the PUBLIC halves below are copied from it verbatim.
#
# WHY THEY ARE HERE AND NOT ON THE ROWS. A key field on a row fails the reader's
# exact set equality over the nine row fields, and four per-seat rows fail the
# single-row cap — which is retained, and which bounds AUTHORITY ROWS. These four
# entries add no holder, no target repository and no act: all four seats descend
# from row-mrc-0001, share `wal-agent-mrc-0001`, `grant-mrc-0001`,
# `opensoft/openxFactory`, `review`, tier `act` and one expiry. The only per-seat
# fact is the signing key, and a key is not a grant. Every seat has its OWN key,
# so one seat's compromise is one seat's problem.
#
# 2026-09-02 ADDENDUM, append-only: the paragraph above names `grant-mrc-0001`,
# which the register act of 2026-09-02 REVOKED for DRIFT. The sentence is left
# standing because it records what the four entries descended from when they
# were minted; read it now as `grant-mrc-0002`, the grant row-mrc-0001 points at
# after that act. NOTHING ELSE ABOUT THESE FOUR ENTRIES MOVED: all four still
# name `authorizing_row: row-mrc-0001`, that row is still `state: active` and
# still unexpired (2027-06-30T00:00:00Z), and all four therefore still resolve —
# checked, not assumed, by the reader's `register-seat-row-unresolved` rule
# inside the REQUIRED wallet-validation check.
#
# TWO SPELLINGS OF ONE BODY, both recorded on purpose. `council_ref` is the
# AUTHORITY ATTACHMENT and must equal the authorizing row's `holder_ref`;
# `council_id` is the RUNTIME NAME, carried VERBATIM into the Hermes projection,
# which keys its seat lookup on the exact pair (council_id, seat_id) and spells
# the council `merge_readiness_council`. Neither spelling is forced by grammar
# (underscores are legal in the identifier grammar) and neither is derivable
# from the other by any declared rule, so recording only one would force the
# operator to INVENT the other at projection time - and an invented value is a
# projection that can disagree with this register. The reader checks that the
# two denote one body.
#
# WHAT THE READER ENFORCES, so this block is RECORDED and not merely present:
# each entry's field set is exactly these seven names; `key_fingerprint`
# RECOMPUTES from `public_key`; `seat_id`, `key_id` and `key_fingerprint` are
# unique; `authorizing_row` resolves to an ACTIVE, unexpired row in this file;
# and `council_ref` is the `holder_ref` that row commissions. A `public_key` is 43
# characters of canonical unpadded base64url — 32 raw bytes — which is why a
# 64-hex PRIVATE seed pasted here is refused by shape, in the required check,
# before it can merge. NO PRIVATE HALF, SEED OR PASSPHRASE MAY EVER APPEAR IN
# THIS FILE.
#
# WHAT DERIVES FROM THIS BLOCK. The operator's Hermes register projection
# (`hermes_review_authority_register_projection`, schema_version 2) takes each
# seat row from here plus the authorizing row, the wallet's custody model and the
# grant's constraints — nothing invented — and `revocation_staleness_bound` above
# travels into it verbatim as `projected_from.staleness_bound`. Until the
# projection is re-derived, the runtime still refuses with
# `review_authority.root_key_mismatch`; that step is an operator act and it must
# not carry a fact this file does not.
#
# The council's seat ROSTER is governed in codexFactory, not here: this reader
# cannot resolve `lead-quality` against a council definition, so an entry is
# checked against the body this register commissions rather than against a roster.
# Adding a seat here that the council does not seat records authority nothing
# will ever present.
