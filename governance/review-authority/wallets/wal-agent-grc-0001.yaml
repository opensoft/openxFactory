# LIVE INSTANCE — not packaged corpus, not a teaching fixture.
#
# The SECOND wallet in the stack: codexFactory's `gate_rules_council` as a
# body, minted under tasks §3.2–3.3 of the ratified change
# register-gate-rules-council-seats (openxFactory PR #717 → `a59f2ae5`,
# amended #751). openxFactory ships no instance records EXCEPT the declared
# narrow exception `wal-agent-mrc-0001.yaml` already records: repo_scan builds
# its context from the scanned repository's own records, and a
# cross-repository audience wallet has no resolution path today
# (add-wallet-carried-review-authority clarifications N7). This file must stay
# OUTSIDE any examples/ path or the scanner will silently stop treating it as
# live (mint runbook §3.1).
#
# WHY A SECOND WALLET AND NOT A SECOND AUDIENCE ON THE FIRST. `gate_rules_council`
# is a DIFFERENT BODY from `merge_readiness_council` — a cross-layer
# rule-SETTING body (codexFactory `hermes/domain/review-councils/gate-rules.yaml`
# `council.scope: per_repository_rule_setting`), not the per-PR enrolled
# surface. Two bodies are two holders, two compositions, two revocation
# radiuses and two grants; one wallet holding both would make one body's
# composition drift revoke the other's authority by accident rather than by
# the ruling that accepts the coupling (Q-GRC-2 accepts a SHARED-ROSTER
# coupling, which is a different thing from a shared wallet).
#
# Custody holder_readable is the registry's designed tier for a consumer with
# no key infrastructure: it reaches authority tier `act`, its signatures
# evidence the ENVIRONMENT, and approval-before-apply is the compensating
# control already in force by the constitutional floor (N13).
