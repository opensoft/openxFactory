  # process environment. The namespacing is not cosmetic: the merge-readiness
  # mint of 2026-08-28 took `root_key_env_var()`'s output
  # (`COUNCIL_SEAT_SIGNING_KEY_<SEAT>`), that function is not council-aware,
  # and `lead-security` is a seat BOTH bodies seat — so the unnamespaced name
