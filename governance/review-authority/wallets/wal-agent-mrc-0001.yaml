# LIVE INSTANCE — not packaged corpus, not a teaching fixture.
#
# The first wallet in the stack: codexFactory's merge_readiness_council as a
# body, minted under tasks 4.1–4.2 of the ratified change
# add-wallet-carried-review-authority. openxFactory ships no instance records
# EXCEPT this declared narrow exception: repo_scan builds its context from the
# scanned repository's own records, and a cross-repository audience wallet has
# no resolution path today (clarifications N7). S4's register joins this
# directory tree; this file must stay OUTSIDE any examples/ path or the
# scanner will silently stop treating it as live.
#
# Custody holder_readable is the registry's designed tier for a consumer with
# no key infrastructure: it reaches authority tier `act`, its signatures
# evidence the ENVIRONMENT, and approval-before-apply is the compensating
# control already in force by the constitutional floor (N13).
