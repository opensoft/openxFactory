keys:
  # THE FOUR COUNCIL SEAT SIGNING KEYS, wallet-declared (openXwallet
  # `add-multi-key-wallets`, ratified 2026-08-28 by Brett Heap's in-session
  # ruling "rule option 1 and build it"; realized at `wallet-v1.3`).
  #
  # WHY THEY BELONG HERE AND NOT ONLY IN THE REGISTER. hermes-install writes the
  # REGISTER-RECORDED `key_id` into an exercise record's `presenting_key_ref` —
  # deliberately, over the per-convening ephemeral one, "because the contract
  # requires this ref to resolve to a wallet key present in the corpus, and an
  # ephemeral key never is". The pinned validator's rule (r) refuses a
  # presenting key no wallet DECLARES, so before this block the first exercise
  # record naming a seat key would have been refused on arrival. The register
  # knowing a key is not the wallet declaring it.
  #
  # ONE AUTHORITY, SEVERAL PRESENTERS. These keys do not multiply what this
  # wallet may hold: grant-mrc-0001 is addressed to the WALLET, row-mrc-0001
  # commissions ONE holder, and each key's custody caps only what THAT key's
  # signature evidences. The pinned reader refuses a declared key whose ceiling
  # outranks this wallet's own, so the arrangement is checked and not merely
  # intended.
  #
  # CUSTODY IS `holder_readable` FOR ALL FOUR, and the determination is not a
  # convenience. Each private half is a 32-byte Ed25519 seed held as an
  # encrypted GitHub Actions secret in codexFactory's `worker-credentials`
  # environment and read by `root_key_from_env()` out of the `deliberate` job's
  # own process environment. That job IS the holder's execution context, so the
  # key is readable by it and each use requires no authorization outside it —
  # `holder_readable` exactly, evidencing the ENVIRONMENT, ceiling `act`. The
  # registry member's own words ("an environment variable or a mounted secret")
  # describe the artifact without stretching. The still-open Q10
  # `isolated_per_use_authorized` authorizer question is NOT implicated: no key
  # declared here reaches for that member or for a ceiling above `act`.
  #
  # THE ROOT KEY'S DECLARATION ABOVE IS BYTE-UNTOUCHED. `key-mrc-0001`'s private
  # half is still retained in the operator's vault and still never enters git,
  # CI or an agent session. That is the exit the mint record took, and nothing
  # here revisits it.
  #
  # PROVENANCE OF THESE VALUES. `key_fingerprint` is VERBATIM from codexFactory
  # `hermes/domain/review-councils/records/2026-08-28-seat-signing-keys-minted.md`
  # (merged `78b8fa2`) and byte-identical to the same key's entry in
  # `../register.yaml`. `public_key_multibase` and `did` are DERIVED from that
  # record's published public half by `did:key`'s own encoding — `z` plus
  # base58btc of the two-byte ed25519 multicodec prefix and the 32 raw bytes —
  # the same encoding `key-mrc-0001` above already uses, where the `did` and the
  # multibase are one string. Nothing is invented: the pinned reader RECOMPUTES
  # each fingerprint from the multibase beside it, and the register reader
  # recomputes the same value from that key's base64url half, so a transcription
  # slip in either place fails the REQUIRED `wallet-validation` check.
  #
  # These are the three UNCONDITIONAL seats plus the CONDITIONAL tenant seat,
  # declared together on purpose: a candidate whose class seats
  # `company-policy-lead` must not be the convening that discovers a missing
  # declaration.
