# CANARY — DELIBERATELY BROKEN. THIS FILE MUST NEVER REACH `main`.
#
# `add-signed-execution-chain` task 4.6: a deliberately broken chain FAILS a real
# pull request, and the evidence records the run id, the check id, the
# validator's single named refusal, and the live ruleset read showing
# `signed-execution-chain-gate` REQUIRED — the shape task 2.6 of
# `add-wallet-carried-review-authority` proved on canary PR #387, where removing
# one field from a live in-tree grant turned the required `wallet-validation`
# check red. Task 4.5 was performed on 2026-08-31 (org ruleset 21957695), so the
# fourth conjunct is finally readable and this canary is finally producible.
#
# ONE DIFFERENCE FROM #387, AND IT IS STRUCTURAL. That canary mutated a LIVE
# record: `governance/review-authority/grants/grant-mrc-0001.yaml` already
# existed and was already scanned. This family has NO live record to mutate —
# `repo scan: 0 artifact(s) checked` is the DECLARED expected state of this
# repository until the first ratification is incepted under the capability, and
# this realization mints no chain. So the canary must ADD the record it breaks.
# It is placed at a real in-tree location the whole-tree sweep walks
# (`governance/`, the same neighbourhood the review-authority records live in);
# it is not under `contracts/signed-execution-chain/examples/`, which the sweep
# excludes because layer 1 owns it.
#
# WHAT IS BROKEN, AND WHY IT IS BROKEN THIS WAY. Documents 1-7 are the packaged
# positive corpus VERBATIM: one complete chain — inception, traveling contract,
# four log leaves, and the realization's conformance declaration. Document 8 is
# the packaged negative fixture
# `examples/negative/leaf-whose-predecessor-digest-is-wrong.yaml`, verbatim: a
# fifth leaf whose OWN digest and signature verify over its own bytes, and whose
# `previous_leaf_digest` is not the digest of the leaf before it. The break is
# engineered to be SINGULAR — editing a hex character inside an existing leaf
# would also invalidate that leaf's own digest and signature and produce three
# refusals where the evidence conjunct calls for one.
#
# EXPECTED, and verified locally before pushing:
#   ERROR [leaf_hash_link_broken] ... the predecessor digest ... does not match
#   ... validate-signed-execution-chain: 1 error(s), 2 warning(s)
# The second warning is the standing `reader-not-required` one, emitted a second
# time because this file carries a copy of the declaration; on `main` today it is
# emitted once. Both go away when the declaration is flipped to record the
# ruleset state performed at 4.5 — a separate pull request, not this one.
#
# `pytest-suite` goes red beside the gate, and that is the same fact seen twice:
# `tests/signed_execution_chain/test_chain_reader.py::test_the_reader_exits_zero_on_the_corpus_and_the_tree`
# runs the very sweep the gate runs. A canary that reddened the gate but left
# that test green would mean the two had drifted apart.
