# CANARY A — DO NOT MERGE. This file exists to be REFUSED by the live,
# REQUIRED `signed-execution-chain-gate`, and then closed unmerged with its
# branch deleted. It is `add-chain-attestation` tasks.md § 5.8's first canary,
# carried at openxFactory issue #579, on the sequence Brett Heap ruled
# 2026-09-07 ("After the remedy lands" — the acceptance amendment landed as
# PR #755, merge commit `64aad02e`).
#
# WHAT IT IS. One YAML stream at a real in-tree location the whole-tree sweep
# walks — `governance/signed-execution-chain/`, deliberately NOT under
# `contracts/signed-execution-chain/examples/`, which `repo_scan()` excludes
# because layer 1 owns it. Documents 1-106 are the tranche-two POSITIVE corpus
# verbatim, in the order the reader's own `positive_records()` loads it: the
# four chains t2-t5, the tranche-two conformance declaration, and the CONSUMED
# `add-trust-anchor` records every tier-2 signature resolves against. Documents
# 107-108 are the packaged negative fixture
# `contracts/signed-execution-chain/examples/tranche-two/negative/dispatched-task-whose-attestation-never-arrives.yaml`
# verbatim — chain t5's link-6 open decision, and the closure that follows it,
# for a chain whose link-4 committed expectation named a task
# (`task:t5-dropped`) that produced no link-5 attestation and no leaf.
#
# NOT A BYTE OF EITHER HALF IS EDITED. § 5.8's amendment of 2026-09-07 rules
# that both canaries stay byte-for-byte as they ship at `contract-v3.0`; the
# canary is the PLACEMENT, never a mutation.
#
# THE EXPECTED REFUSAL SET IS TWO, AND IT IS ONE FACT SEEN TWICE — the
# acceptance § 5.8 now carries:
#   ERROR [dispatched_leaf_never_written]      — `task:t5-dropped`, from link 5's side
#   ERROR [open_decision_enumeration_incomplete] — `task:t5-dropped`, from link 6's side
# The CONTROL for this reading is the same 106 positives placed live with no
# fixture appended: 106 artifact(s) checked, 0 errors, 0 warnings.
#
# `pytest-suite` goes red beside the gate, and that is one fact seen twice
# rather than a second defect:
# `tests/signed_execution_chain/test_chain_reader.py::test_the_reader_exits_zero_on_the_corpus_and_the_tree`
# runs the very sweep the gate runs. A canary that reddened the gate and left
# that test green would mean the two had drifted apart (precedent: canary
# PR #549, `add-signed-execution-chain` task 4.6).
# CHAIN TWO — THE MAIN POSITIVE: A FAN-OUT DISCOVERED AS THE WORK RAN.
#
# Links 1-3 are tranche one's, unchanged in shape. From LINK 4 the signed hash-link
# rule is in force, and this chain is the case that makes the rule's wording
# load-bearing: task `task:t2-b` is dispatched AFTER `task:t2-a` has already
# attested, so the extension committing it descends from THAT LINK-5 RECORD and the
# binding minted for it descends from the extension. THE GATE WALKS THE INTERLEAVED
# ORDER AS IT STANDS, because the order is a property of the records that exist
# rather than of their kinds. `4 -> x1 -> ... -> xn -> 5 -> 6 -> 10` is an
# illustration of the no-interleaving case and binds nothing; chain three below is
# that case.
#
# WHAT ELSE THIS ONE PROVES. One CHAIN-SCOPED tier-2 identity signs the single
# link-6 decision over BOTH tasks' attestations, which is the record no per-task
# identity can produce once a chain fans out past one task. Every tier-2 signature
# resolves its own three-record issuance first. The link-6 and link-10 requests are
# ATTRIBUTED to the party the chain's own inception record binds, RECORDED beside
# the signatures they received, and covered INSIDE the signed bytes. And closure
# runs the THREE LINEAGE LIMBS over an AMENDED packet: the reviewed digest and the
# ratified subject digest DIFFER, which is the ordinary outcome of a review that
# required amendments and exactly what a rule demanding equality would have refused.
#
# EVERY DIGEST AND SIGNATURE HERE RECOMPUTES. The ratified, reviewed and review
# digests are `xfc-jcs-sha256-1` over packaged placeholders this corpus fully
# determines — {"fixture": "<name>", "version": 1} — so the construction can be
# watched working rather than taken on trust. The keys are FIXTURE keys and only
# their public halves are packaged.
