    and the hermes-content doc wants a neutral hermes_domain_overlay schema (currently only structural-checked).
    None of these are covered by the already-staged Change A/B (which are codexFactory-side content authoring),
    so a single cross-cutting openxFactory schema effort connecting all three is a distinct, concrete
    artifact this cluster''s material converges on.'
