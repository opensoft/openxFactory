d, **the placement this amendment decides, `contracts/manifest.yaml`, `contracts/CHANGELOG.md` and the `dox-v1.0` BUNDLE TAG.** They sit in the assembly root because it is the only object whose ONE commit names both legs: a tag on a leg describes half a project, and `neutral-product-pin` makes a consumer pin a commit and a digest, so the commit a consumer pins must be the one that answers *what was this project at that moment*. openXdox therefore pins the ASSEMBLY ROOT; `openxFactory` does NOT pin openDox's assembly root directly (RULING F — `opensoft/openxFactory` issue #656, Brett Heap, 2026-09-05, "rule F openXdox only") — it reaches openDox's commit only by reading it through openXdox's own pin. *(AMENDED 2026-09-10 — RULED Q7: `openxFactory` DOES now pin and mount openDox's assembly root directly, Brett Heap verbatim "SECOND SUBMODULE — openxFactory mounts the openDox assembly root" (`#656` comment `5626248666`), landed by openxFactory #932 → `f4fb4ffc`. RULING F's CHAIN survives as a LOCKSTEP INVARIANT — the direct pin MUST EQUAL the commit `openXdox/contracts/opendox-pin.yaml` names, read as a git blob at the `openXdox` gitlink's commit — so RULING OQ-2 is untouched and openDox's commit is still decided in one place. The mount exists because § 5.2's shed leaves 32 importing files with nowhere to import from; see `design.md` § D12's pin discussion.)* `.github/CODEOWNERS`, a required check from day one and a branch-protection ruleset are owed in EACH of the three, not once for the project. (2) **The `openXdox` PROJECT — THREE repositories created from scratch** (AMENDED 2026-09-05): assembly root `opensoft/openXdox`, `opensoft/openXdox-spec`, `opensoft/openXdox-code`; all three PUBLIC, Apache-2.0. **The `-code` leg** carries the domain-mapping core PARAMETERIZED by a domain profile (RULING C2): the corpus-adapter IMPLEMENTATION and projection mechanism (`corpus_root`, `generator`, `snapshot`, `snapshot_registry`, `register`, `completeness`, `round_trip`), the gate-and-commission loop (`gate_console`, `gate_routes`, `kickoff`, `record_binding`, `register_edit_lane`), `doxbench_scope`, the routes it contributes to openDox's extension point, and the three machineries that do not exist anywhere today — the model/scenario workbench for `governed-derived-model` families, the evidence-and-provenance surface, and the role-and-authority projection. **The `-spec` leg** carries openXdox's own OpenSpec instance and the requirements of its domain-mapping declaration. **The assembly root** carries `project.yaml` — whose `neutral_product_pins: [openDox]` is the family's ONE CHAIN (RULING OQ-2) — `contracts/opendox-pin.yaml`, its own pin of openDox NAMING THE OPENDOX ASSEMBLY ROOT's commit and digest, the shape and leg pins, the gate, `contracts/manifest.yaml`, `contracts/CHANGELOG.md` and the `xdox-v1.0` bundle tag. (3) `openxFactory` SHEDS: all 48 modules of `scripts/ideation_dashboard/` (49,605 LOC), all 40 files of `web/` (30,410 LOC excluding the vendored `markdown-it.min.js`), all 125 files of `tests/ideation-dashboard/` (3,927 `def test_` — 52% of this repository's 7,612 test functions) and the four-file `tests/ideation_dashboard/` underscore spelling, `scripts/ideation-dashboard-nightly.py`, `scripts/validate-ideation-dashboard-contracts.py`, the four dashboard contract schemas and 142 packaged examples under `examples/ideation-dashboard/`, the five dashboard governance docs, and `openspec/specs/ideation-dashboard/spec.md` (289,266 B / 102 requirements / 472 scenarios); and GAINS `contracts/openxdox-pin.yaml`, one gitlink (RULING F — `openxFactory` pins openXdox only; openDox's commit is read through openXdox's own pin and is never separately declared, pinned or mounted here) *(AMENDED 2026-09-10 — RULED Q7, `#656` comment `5626248666`: TWO gitlinks and TWO pin files, openXdox and openDox, held in LOCKSTEP; openxFactory #932 → `f4fb4ffc`)*, `scripts/doc_health/` edits (the two back-imports at `derive_possibles.py:857` and `ideation_readiness.py:1351` relocate to a small neutral module BOTH sides depend on), `contracts/manifest.yaml` / `README.md` / `CHANGELOG.md` / `contracts/releases/<tag>.digests.yaml`, `.github/CODEOWNERS`, the dashboard workflows converted to consumer gates on the `openxwallet-consumer-gate` shape, `README.md`, and `docs/openxdox-naming.md` Amendment 3. (4) BRANCH-PROTECTION RULESET STATE in **seven** repositories (AMENDED 2026-09-05 — this first said three, before the shape was elected: the six new ones and `openxFactory`) — a repository setting, not a tree fact, and therefore its own evidence line. `scaffold-project.py` creates NO ruleset; it prints a hint for the case where an existing organisation ruleset refuses the seed push, so every one of the seven is a separate act. *(Corrected by reality check 2026-09-05 (lane openxfactory-4-opendox-extraction): the seven-count double-counts `openxFactory`, which needs no ruleset act — read live at `gh api orgs/opensoft/rulesets`, its required-check tokens (`wallet-validation`, `pytest-suite`, `lane-line`, `release-tag-gate` on ruleset 21538893; `signed-execution-chain-gate`, `lane-line` on 21957695) name no dashboard workflow today, so nothing in its ruleset state has to move; `tasks.md` § 1.5 already authorises and § 8.1 already counts SIX, not seven, and the packet contradicts its own "seven" nowhere else. It is also NOT "a repository setting" for this organisation: every ruleset binding `opensoft` repositories is `source_type: "Organization"` (confirmed live), an org-admin edit scoped by `repository_name.include` — one such ruleset gaining six new entries is still one org-admin act per required-check ruleset, not per repository, though the evidence line is still owed per repository once its own check has reported. Read "**six**" and "every one of the six is a separate act" in place of "seven" above; `openxFactory`'s ruleset state is VERIFIED UNCHANGED by this packet, not a repository under it.)* (5) The xFactory aggregation: `.gitmodules`, two root gitlinks — **naming the two ASSEMBLY ROOTS** (AMENDED 2026-09-05); the legs are the assembly roots' own submodules and the aggregation never mounts them directly — `README.md`, `CLAUDE.md`, and `project-register.yaml`, which gains one row per elected project carrying `schema`, `reference` and `repository_roles`, **DERIVED from each `project.yaml` and never the origin of the election** (`docs/project-repo-schema.md` § The manifest is the source). (6) Omnigent-Install: the per-tenant installer that provisions an instance, its database and its two GitHub Apps through the App Manifest flow, plus the intent inbox and minter. (7) OpsxFactory: the `dox` workload set (`workflows/aks-administration.yaml:412-431`) becomes per-tenant, and the ungoverned `openxdox` DNS record is governed. (8) codexFactory: two draft Speckit features (002, 010) and the false `stack.yaml` doxBench digest declaration, plus the review-authority FLOOR de-floor that must precede any removal under `openspec/specs/` (Rule 7 substrate row 1). **(9) UNDER RULING DQ-1 (2026-09-04T22:14Z) `openxFactory` ALSO GAINS A SURFACE RATHER THAN ONLY SHEDDING ONE:** a small ENGINEERING ADAPTER PACKAGE beside `scripts/doc_health/` implementing openDox's corpus-adapter seam over this repository's own corpus, carrying the fifteen engineering-vocabulary requirements that leave the CAPABILITY but NOT the repository, plus its own tests. `codexDox` is a THIN DESCENDANT that pins openXdox and reuses that adapter; it owns no adapter of its own. Per `release-realization` this change archives ONLY on merged plus green realization evidence across the affected repositories, never on landing.
