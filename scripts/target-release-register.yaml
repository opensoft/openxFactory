    retires_when: >-
      canon admits a deferred allocation, or this packet's cut names its
      release, or this packet archives.

  # ---- class: realization-state ---------------------------------------------
  # The declaration names a STATE of the work rather than a target. Canon
  # already carries that state without a vocabulary word for it: a non-empty
  # code surface with `target_release: implemented` is held active as
  # approved-but-unrealized intent by the *Realization archive gate* until its
  # code is merged and has run green.

  - change: add-nightly-dashboard-refresh
    token: "implementation_pending"
    class: realization-state
    why: >-
      "implementation_pending — the requirements land now; the change archives
      only on merged code with green realization evidence" states the archive
      gate's own condition in the target field.
    cited_to:
      - openspec/specs/release-realization/spec.md § Realization archive gate
    retires_when: >-
      the declaration is corrected to the target it realizes on, or the packet
      archives.

  - change: add-roster-directory-admission-surface
    token: "implementation_pending"
    class: realization-state
    why: >-
      Declares the bare state word with no target beside it.
    cited_to:
      - openspec/specs/release-realization/spec.md § Realization archive gate
    retires_when: >-
      the declaration is corrected to the target it realizes on, or the packet
      archives.

  - change: qualify-avatar-live-voice
    token: "implementation_pending"
    class: realization-state
    why: >-
      "implementation_pending — the requirements land now; realization runs
      post-ratification against a NAMED INTEGRATION".
    cited_to:
      - openspec/specs/release-realization/spec.md § Realization archive gate
    retires_when: >-
      the declaration is corrected to the target it realizes on, or the packet
      archives.

  - change: split-opendox-two-layer-product
    token: "implementation_pending"
    class: realization-state
    why: >-
      "implementation_pending — the affected repositories' own main lines, plus
      release identities allocated AT THE CUT" — a state word in front of a
      declaration that then names both a main line and a deferred allocation.
    cited_to:
      - openspec/specs/release-realization/spec.md § Realization archive gate
      - docs/contract-versioning-policy.md § Bundle Realization Order
    retires_when: >-
      the declaration is corrected to the target it realizes on, or the packet
      archives.

  # ---- class: non-bundle-target ---------------------------------------------
  # The declaration names a KIND of realization that is neither a main line nor
  # a bundle: the creation of a repository. The promoted sentence has no
  # spelling for it, and the two packets that need one follow an archived
  # precedent rather than inventing a release.

  - change: implement-keycloak-install-repo
    token: "repository-bootstrap"
    class: non-bundle-target
    why: >-
      "repository-bootstrap (the archived `add-xfactory-installer-repository`
      precedent for a repo-creation act)". The realization is a new repository,
      not a line and not a bundle.
    cited_to:
      - openspec/changes/archive — add-xfactory-installer-repository, the precedent the declaration names
    retires_when: >-
      canon admits a repository-bootstrap target, or the declaration is
      corrected, or the packet archives.

  - change: implement-openxpki-install-repo
    token: "repository-bootstrap"
    class: non-bundle-target
    why: >-
      "repository-bootstrap (the archived `add-xfactory-installer-repository`
      precedent for a repo-creation act)".
    cited_to:
      - openspec/changes/archive — add-xfactory-installer-repository, the precedent the declaration names
    retires_when: >-
      canon admits a repository-bootstrap target, or the declaration is
      corrected, or the packet archives.

  # ---- class: answers-another-question --------------------------------------
  # The declaration is prose that answers the ARCHIVE question instead of the
  # TARGET question: it restates the *Realization archive gate* where the target
  # belongs. Nothing in it is wrong; it is simply not a value. These three are
  # the class a sweep could correct with the least judgment — and they are NOT
  # swept here, because their authors' meaning has to be read out of a sentence
  # rather than off a token, and reading it for them is the owning lane's act.

  - change: admit-review-lane-repin-to-merge-approval-envelope
    token: "a"
    class: answers-another-question
    why: >-
      "a code surface, so per `release-realization` it archives only on merged +
      green realization evidence" — the archive rule, in the target field.
    cited_to:
      - openspec/specs/release-realization/spec.md § Realization archive gate
    retires_when: >-
      the declaration names a target, or the packet archives.

  - change: amend-mirror-floor-regeneration-merge-authority
    token: "a"
    class: answers-another-question
    why: >-
      "a code surface, so per `release-realization` it archives only on merged +
      green realization evidence. No contract bundle is cut."
    cited_to:
      - openspec/specs/release-realization/spec.md § Realization archive gate
    retires_when: >-
      the declaration names a target, or the packet archives.

