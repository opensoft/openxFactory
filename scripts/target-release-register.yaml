schema_version: 1
kind: target-release-vocabulary-register

# THE CLOSED GRANDFATHER REGISTER FOR `target_release:`.
#
# `release-realization`'s promoted requirement *Realization axis declaration*
# admits exactly two values — `implemented` or a named release — and the ADDED
# requirement *Realization axis vocabulary is gated* makes a house validator
# refuse any other value on an ACTIVE proposal. Measured at that gate's
# authoring, the standing corpus does not meet the vocabulary: of the ACTIVE
# proposals, a minority declare a value inside it. Refusing the rest at the
# gate's landing would refuse a corpus that in twelve cases is obeying ANOTHER
# ratified policy (`docs/contract-versioning-policy.md` § Bundle Realization
# Order allocates bundle versions LATE, so a proposal that named a number would
# reserve one the policy allocates at the cut), and rewriting them all to
# `implemented` would assert realizations nobody performed.
#
# So the gate is a RATCHET rather than a sweep: every declaration this file does
# not name is judged from the day the gate lands, and every declaration it names
# is REPORTED and not refused. The file is CLOSED — an entry may be REMOVED when
# its declaration is corrected or its packet archives, and an entry is never
# ADDED, because admitting a new value to the vocabulary is a canon act and not
# a validator edit.
#
# THE ASYMMETRY IS THE PIN FILE'S, DELIBERATELY (`contracts/openspec-cli-pin.yaml`
# `dispositions:`, and `scripts/validate-openspec-cli-pin.py`'s own account of
# why): an UNMATCHED DECLARATION FAILS (exit 1) — somebody wrote a value canon
# does not admit, and the remedy is theirs. An UNMATCHED ENTRY REFUSES (exit 2)
# — the exception outlived the condition it was granted for, and the remedy is
# to delete the entry in the same pull request that made it stale. Silently
# tolerating the second is how an exception list rots into a blanket.
#
# THIS FILE IS NOT UNDER `contracts/`, AND THAT IS DELIBERATE: a file under
# `contracts/` is a bundle surface whose change owes a bundle cut, and an
# exception register that could not be edited without cutting a contract
# release would be edited late or not at all. It lives beside the validator that
# reads it, and moves with it.
#
# Every entry declares:
#   change       the ACTIVE change directory under `openspec/changes/`
#   token        the VALUE TOKEN as it stands — the first whitespace-delimited
#                word of the declaration, trailing `.,;:` stripped. An author
#                who edits the declaration changes the token, the entry stops
#                matching, and the run refuses until somebody looks.
#   class        why the declaration sits outside the vocabulary
#   why          the reason in this packet's own words
#   cited_to     where the reason is written down
#   retires_when the event that ends the exception

register:

  # ---- class: deferred-allocation -------------------------------------------
  # The declaration names a release that EXISTS but is deliberately unnumbered,
  # because the bundle's version is allocated at the cut. Under the promoted
  # two-value sentence there is no spelling for "a release, not yet numbered",
  # so an author obeying the versioning policy cannot also satisfy the
  # vocabulary. Whether canon should admit a deferred allocation as a third
  # value is the successor question this packet names and does not take.

  - change: add-chain-attestation
    token: "THE"
    class: deferred-allocation
    why: >-
      Declares "THE NEXT ADDITIVE MINOR, DELIBERATELY NOT NUMBERED HERE —
      allocated AT REALIZATION by merge order". The refusal to number is the
      versioning policy's own rule, written into the declaration.
    cited_to:
      - docs/contract-versioning-policy.md § Bundle Realization Order — "allocates versions late"
    retires_when: >-
      canon admits a deferred allocation, or this packet's cut names its
      release, or this packet archives.

