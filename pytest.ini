[pytest]
# THE ROOTDIR ANCHOR — this file exists primarily for hermeticity, not for
# configuration (PR #49 review finding 17, residue 1). It deliberately
# declared no options until `testpaths` below (issue #625).
#
# pytest computes `rootdir` from the invocation and then collects conftest.py
# files from `confcutdir` (which defaults to rootdir) DOWN to each argument. With
# no inifile anywhere, a run started inside a test directory made THAT directory
# the rootdir, which cut `tests/conftest.py` — the FR-043 hermeticity guard's
# registration — out of collection entirely. Measured in `tests/notebooklm/` and
# `tests/merge-master/`: `which nlm` resolved to a real-binary stand-in, three
# invocations landed, and the refusal ledger stayed empty. Most directories
# under `tests/` have no conftest.py of their own (15 of 20 when last
# measured, 2026-08-27; the count moves as directories are added).
#
# With this file present, rootdir resolves HERE from any invocation inside the
# repository, so `tests/conftest.py` is always in the conftest chain and the guard
# always applies. The alternative — a conftest.py per directory — is the one thing
# that must NOT be done: `conftest` is an ambient top-level module name with a
# single `sys.modules` entry, and adding `tests/notebooklm/conftest.py` hijacked
# it — as any conftest that does not claim the slot (closing paragraph) still
# would — for the doc-health modules' `from conftest import FakeGit` (measured; it broke
# codexFactory's `scripts/validate-docs.sh`, which ran these tests when they
# lived in codexFactory, before the doc-health relocation
# (adopt-neutral-tooling-home, ratified 2026-08-03; archived 2026-08-05) — that
# script now runs only codexFactory's own test tree). This file adds no module
# name at all.
#
# The ordinary invocations are unaffected: `python3 -m pytest tests` and
# `python3 -m pytest tests/ideation-dashboard` already resolved rootdir to this
# directory via the cwd fallback, so only the runs that were UNGUARDED change.
#
# `tests/notebooklm/test_hermeticity_guard.py` asserts the guard from inside a
# conftest-less directory, and `tests/ideation-dashboard/test_hermeticity.py`
# drives that probe as a subprocess with `cwd` set there. Delete this file and
# those tests fail.
#
# THE OTHER HALF OF THE AMBIENT-NAME PROBLEM is repaired inside the conftests
# rather than here (issue #305). Each of the four that exist calls
# `claim_conftest_slot(globals())` from `tests/hermeticity.py`, re-claiming
# `sys.modules["conftest"]` for its own subtree, so
# `pytest tests/doc-health tests/ideation-dashboard` no longer depends on
# argument order. That changes nothing about the paragraph above: a NEW
# per-directory conftest is still the wrong answer to a ROOTDIR problem, because
# it does nothing for the 12 rootless test-bearing directories that have none
# — and it would now have to carry the claim as well. (Re-measured 2026-08-27
# after `tests/domain_pin_setter/` landed: 20 directories under `tests/` hold
# `test_*.py`, 15 have no conftest.py of their own, 3 of those 15 are packages. `python3 -c "import pathlib;
# d=sorted({p.parent for p in pathlib.Path('tests').rglob('test_*.py')});
# print(len(d), sum(not (x/'conftest.py').is_file() for x in d))"`.)

# TESTPATHS — a bare root invocation equal to CI's (issue #625).
#
# `python -m pytest -q --collect-only` at the repo root recursed into
# `experiments/avatar-brokered-call/`, which carries its own `avatar_f0`
# package and its own `pyproject.toml` (`testpaths = ["tests/offline"]`,
# `pythonpath = ["src"]`) meant to run only inside that experiment's own venv,
# where `avatar_f0` is `pip install -e`'d per its README's "Setup" section.
# This repo's environment never installs that package, so collecting those
# tests from here always failed with `ModuleNotFoundError: No module named
# 'avatar_f0'` — 19 errors, one per test file under
# `experiments/avatar-brokered-call/tests/`.
#
# `.github/workflows/pytest-suite.yml` runs `python3 -m pytest tests/ -q -m
# "not postgres"`, so CI never walks `experiments/` and never saw this.
# `testpaths` only takes effect when no path is given on the command line
# (pytest docs, "Command line options"), so it changes nothing about that
# invocation, or any other invocation that names a path explicitly — it only
# changes what a bare `pytest` / `pytest --collect-only` at the root
# collects, making that equal to CI's.
testpaths = tests
