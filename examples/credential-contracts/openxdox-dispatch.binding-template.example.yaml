# Example (add-dispatch-credential-contract): the openXdox credential BINDINGS —
# where each requirement resolves to a real secret provider. The dispatch and
# content credentials are DISTINCT bindings (different secret_ref / owner): the
# serving tier's dispatch credential never shares identity or key material with
# the content-write credential. Both are org-owned GitHub Apps whose keys live
# in the operator's Key Vault (delivered BY REFERENCE, never a baked value); the
# minter turns the dispatch App key into short-lived tokens the inbox reads by
# env-name. `rotation_policy: operator_managed` — the vault operator is the
# per-install binding (OpsxFactory when licensed, the client's IT channel when
# self-hosted).
schema_version: 1
kind: xfactory_credential_binding_template
client:
  id: opensoft
  display_name: Opensoft (QA)
#
# Each binding now DECLARES ITS CONSUMER (add-binding-consumer-identity): who
# holds it and what identity that system authenticates to the store with. The
# identifiers are SYNTHETIC — a packaged fixture owes the SHAPE, and the corpus
# is digest-pinned and distributed to every consumer that pins the contract, so
# naming a live install's fetch identity would buy illustrative realism with a
# permanent widening of who knows which principal reaches which secret. The live
# ones stay in the consuming installs' own `credentials/` trees, where the
# residency model already puts an estate fact.
credential_bindings:
  intent_dispatch:
    provider: azure_key_vault
    vault: kv-opensoft-xfactory-qa
    secret_ref: openxdox-intent-dispatch-app
    owner: opensoft-platform
    rotation_policy: operator_managed
    consumer:
      holder_ref: example:service-subject:intent-serving-tier
      fetch_identity: example-serving-tier-workload-identity
      requirement_ref:
        requirement_id: intent_dispatch
        requirements_document_ref: openxdox-dispatch.requirements.example.yaml
  corpus_content_write:
    provider: azure_key_vault
    vault: kv-opensoft-xfactory-qa
    secret_ref: xfactory-content-app
    owner: opensoft-platform
    rotation_policy: operator_managed
    consumer:
      holder_ref: example:service-subject:corpus-apply-lane
      fetch_identity: example-apply-lane-workload-identity
      requirement_ref:
        requirement_id: corpus_content_write
        requirements_document_ref: openxdox-dispatch.requirements.example.yaml
