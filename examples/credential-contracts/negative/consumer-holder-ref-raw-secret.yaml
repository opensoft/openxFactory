# NEGATIVE (expect: baked-secret). A raw credential-bearing CONNECTION STRING in
# `consumer.holder_ref`.
#
# THE SCREEN'S SCOPE AND THE SCREEN ITSELF BOTH MOVED HERE, and the pairing is
# deliberate. `_looks_like_raw_secret` read `secret_ref` and nothing else, so
# this change's two new free-string members would have been two unscreened sinks
# on the one record kind whose invariant is "never bake a secret". Widening the
# scope of a leaky screen without fixing the screen would have shipped the gap
# wider — openxFactory#506 — so the detector gained credential-bearing URIs,
# `key=value` secret assignments and dotted JWTs in the same act.
#
# KNOWN LIMIT, recorded rather than claimed away: `_B64ISH` requires 40
# characters, so a 38-character alphanumeric secret still passes. The screen
# catches shapes it recognises; it is not a secret detector.
schema_version: 1
kind: xfactory_credential_binding_template
client:
  id: example-client
credential_bindings:
  projection_sync_lane:
    provider: azure_key_vault
    vault: kv-example-projection
    secret_ref: example-projection-operated-identity
    owner: example-platform
    rotation_policy: operator_managed
    consumer:
      holder_ref: "postgresql://projection_lane:hunter2@db.example.invalid/projection"
      fetch_identity: example-sync-lane-workload-identity
