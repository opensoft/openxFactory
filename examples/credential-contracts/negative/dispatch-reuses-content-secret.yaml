# NEGATIVE (expect: shared-secret-identity). The dispatch binding reuses the
# content App's secret_ref — the serving tier would then hold key material able
# to mint a content-write token. Violates dispatch-only serving-tier separation.
#
# RE-ARMED BY add-binding-consumer-identity §3.6, AND ARMED THE WAY A SECURITY
# SEAT BROKE IT. This is the capability's only red proof of serving-tier
# separation, and under the FIVE-condition draft of the lift it was LIFT
# GRANTED with its shared secret byte-untouched: add four declarations —
# distinct holders, distinct fetch identities, a two-sided acknowledgment, and
# both requirement references pointed at the CONTENT requirement so their access
# modes compare equal — and the pair walked through. The earlier task asserted
# this fixture stayed refused against a version of it that declared no consumer
# at all, which is a non-test.
#
# So the four declarations are HERE, and CONDITION SIX is what refuses them:
# `intent_dispatch`'s reference names `corpus_content_write`, which is not its
# own map key. A precondition an author can satisfy by choosing where to point
# is not a precondition.
schema_version: 1
kind: xfactory_credential_binding_template
client:
  id: opensoft
credential_bindings:
  intent_dispatch:
    provider: azure_key_vault
    vault: kv-opensoft-xfactory-qa
    secret_ref: xfactory-content-app
    owner: opensoft-platform
    rotation_policy: operator_managed
    consumer:
      holder_ref: example:service-subject:intent-serving-tier
      fetch_identity: example-serving-tier-workload-identity
      requirement_ref:
        requirement_id: corpus_content_write
        requirements_document_ref: openxdox-dispatch.requirements.example.yaml
      shared_credential_acknowledged: true
  corpus_content_write:
    provider: azure_key_vault
    vault: kv-opensoft-xfactory-qa
    secret_ref: xfactory-content-app
    owner: opensoft-platform
    rotation_policy: operator_managed
    consumer:
      holder_ref: example:service-subject:corpus-apply-lane
      fetch_identity: example-apply-lane-workload-identity
      requirement_ref:
        requirement_id: corpus_content_write
        requirements_document_ref: openxdox-dispatch.requirements.example.yaml
      shared_credential_acknowledged: true
