# NEGATIVE (expect: shared-secret-identity). Both bindings DECLARE the
# acknowledgment and one of them values it `false` — condition four fails,
# because a false-valued token is not a declaration.
#
# TWO ACTS, AND THE DIFFERENCE IS THE POINT. Withholding the LIFT from this pair
# is not the same as REFUSING the record: the record itself stays VALID at the
# introducing minor (it validates on the current major, so refusing it in a
# minor would narrow like any other act) and only WARNS, under
# `consumer-token-not-true`, until the major. What is refused here is the SHARED
# SECRET, by the default rule, exactly as it would be if the token were absent.
# Declining to grant an exemption is not refusing a record.
#
# The const-true form is `issuance_preconditions`' own reasoning, one record kind
# over: a precondition is DECLARED or NOT DECLARED, and `false` is a declaration
# that reads as governance while asserting nothing.
schema_version: 1
kind: xfactory_credential_binding_template
client:
  id: example-client
credential_bindings:
  projection_sync_lane:
    provider: azure_key_vault
    vault: kv-example-projection
    secret_ref: example-projection-operated-identity
    owner: example-platform
    rotation_policy: operator_managed
    consumer:
      holder_ref: example:service-subject:projection-sync-lane
      fetch_identity: example-sync-lane-workload-identity
      requirement_ref:
        requirement_id: projection_sync_lane
        requirements_document_ref: two-consumer-operated-identity.requirements.example.yaml
      shared_credential_acknowledged: true
  projection_editor_surface:
    provider: azure_key_vault
    vault: kv-example-projection
    secret_ref: example-projection-operated-identity
    owner: example-platform
    rotation_policy: operator_managed
    consumer:
      holder_ref: example:service-subject:projection-editor-surface
      fetch_identity: example-editor-surface-workload-identity
      requirement_ref:
        requirement_id: projection_editor_surface
        requirements_document_ref: two-consumer-operated-identity.requirements.example.yaml
      shared_credential_acknowledged: false
