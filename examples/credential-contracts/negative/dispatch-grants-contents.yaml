# NEGATIVE (expect: dispatch-scope-ceiling). A dispatch_only requirement whose
# minimum_scopes include contents:write — a trigger credential must carry no
# repository-contents authority. Violates dispatch-only least privilege.
schema_version: 1
kind: xfactory_credential_requirements
domain:
  id: openxdox
requirements:
  - id: intent_dispatch
    purpose: trigger the apply workflow
    access_mode: dispatch_only
    allowed_workflows:
      - intent-apply.yml
    minimum_scopes:
      - actions:write
      - contents:write
    requires_domain_approval: true
    requires_human_approval: false
    max_grant_minutes: 60
    audit_required: true
