# NEGATIVE (expect: shared-secret-identity). A qualified reference that resolves
# to NOTHING in the repository under validation — condition five fails.
#
# The unresolvable reference is REPORTED rather than treated as an absent
# condition that happens not to fail. A check that treats what it could not read
# as satisfied is the fail-open shape this family has already had to repair once,
# in a drift check that skipped a byte comparison whenever a digest was missing.
schema_version: 1
kind: xfactory_credential_binding_template
client:
  id: example-client
credential_bindings:
  projection_sync_lane:
    provider: azure_key_vault
    vault: kv-example-projection
    secret_ref: example-projection-operated-identity
    owner: example-platform
    rotation_policy: operator_managed
    consumer:
      holder_ref: example:service-subject:projection-sync-lane
      fetch_identity: example-sync-lane-workload-identity
      requirement_ref:
        requirement_id: projection_sync_lane
        requirements_document_ref: credentials/no-such-document.requirements.yaml
      shared_credential_acknowledged: true
  projection_editor_surface:
    provider: azure_key_vault
    vault: kv-example-projection
    secret_ref: example-projection-operated-identity
    owner: example-platform
    rotation_policy: operator_managed
    consumer:
      holder_ref: example:service-subject:projection-editor-surface
      fetch_identity: example-editor-surface-workload-identity
      requirement_ref:
        requirement_id: projection_editor_surface
        requirements_document_ref: credentials/no-such-document.requirements.yaml
      shared_credential_acknowledged: true
