# NEGATIVE (expect: baked-secret). The THIRD free string on the record kind
# whose invariant is "never bake a secret", screened in the same commit that
# declares it.
#
# `identity_namespace` carries the same identifier grammar as the two members
# beside it, and that grammar admits `ghp_…`, `AKIA…` and base64-shaped values —
# so a new free-string member left unscreened would reopen exactly the gap
# add-binding-consumer-identity §2.6 closed for `holder_ref` and
# `fetch_identity`, one member later.
schema_version: 1
kind: xfactory_credential_binding_template
client:
  id: example-client
credential_bindings:
  example_system_read:
    provider: azure_key_vault
    vault: kv-example
    secret_ref: example-secret-reference
    owner: example-platform
    rotation_policy: operator_managed
    consumer:
      holder_ref: example:service-subject:example-system
      fetch_identity: example-system-workload-identity
      identity_namespace: ghp_EXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLE00
