# NEGATIVE (expect: baked-secret). A dotted JWT in `consumer.fetch_identity`.
#
# THE SHARPEST OF THE TWO SINKS, because this value PASSES the identifier
# grammar: a JWT's character set is exactly the grammar's, so nothing about the
# member's shape objects to it and only the raw-secret screen can. Before
# openxFactory#506 the screen had no arm for a structured bearer token either,
# so this record produced ZERO findings — a bearer token sitting in a field
# beside its own vault and secret reference.
#
# The token below is a fixture value with a `none` algorithm header and no
# signature segment; it is not a credential.
schema_version: 1
kind: xfactory_credential_binding_template
client:
  id: example-client
credential_bindings:
  projection_sync_lane:
    provider: azure_key_vault
    vault: kv-example-projection
    secret_ref: example-projection-operated-identity
    owner: example-platform
    rotation_policy: operator_managed
    consumer:
      holder_ref: example:service-subject:projection-sync-lane
      fetch_identity: eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJzdWIiOiJmaXh0dXJlIn0.
