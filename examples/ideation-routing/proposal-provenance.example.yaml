    claim_ids:
      - XFI-2026-003-C01
    routing_record:
      repository: openxFactory
      path: ideation/brainstorm/cross-domain/XFI-2026-003/routing.yaml
      revision: 5142065b2833a2b6d2ccbcb460bf164fd4e1e417
