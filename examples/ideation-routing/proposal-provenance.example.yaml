# Valid routed proposal provenance: each list item validates independently
# against contracts/schemas/xfactory-idea-routing-reference.schema.yaml
# `#/$defs/ideation_provenance_entry` (add-cross-factory-ideation-routing task
# 2.2).
#
# This is the `ideation_provenance` block an OpenSpec proposal support manifest
# carries when selected staged material derives from routed claims
# (document-lifecycle delta "Proposal-owned supporting documents", scenario
# "Routed material enters a proposal"; metadata-application-matrix "OpenSpec
# Provenance"). Each entry names the source Idea ID, the selected Claim IDs, and
# a routing-record reference whose repository, path, and FULL committed revision
# MUST resolve. The `ideation_provenance:` wrapper is a container for this file
# only. `pending_capture` is INVALID here (see
# negative/proposal-provenance-pending-capture.yaml).
