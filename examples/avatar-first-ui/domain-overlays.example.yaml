      pseudo_locale_coverage: true
    rendering:
      mode: plain_text
    handoff:
      roles: [governance_council]
      url_carries_no_secret: true
    runtime_compatibility:
      baseline_identity: avatar-client-parallel-v1
    domain_overlay:
      persona_roles: [neutral_analyst]
      handoff_roles: [governance_council, domain_specialist]
      restricted_tool_classes: [policy_commitment, schema_change]

  # 4) Confirmation-before-consequential-action archetype (neutral;
  #    Ledgerx-style is inspiration only — no accounting-specific content)
  - profile:
      id: confirmation_before_consequential_action
      domain_factory_repo: DomainxFactory
      default_implementation_level: L1_audio_first_visual_avatar
      primary_user_kind: customer
      primary_subject_kind: subject
      avatar_required: true
      conventional_ui_fallback_required: true
    authority_boundaries:
      avatar_is_presentation_only: true
      workflow_authority_layer: openxFactory
      policy_authority_layer: Hermes
      execution_layer: Domain Omnigent
      final_enforcement_layer: accountable_human_or_external_system
    presentation:
      surface_default: review
      presentation_modes: [conversation, work, review]
    media:
      held_answer_state: connecting
    interaction_mode:
      value: provider_vad
    speech_gate:
      value: confirmation_before_action
    timing:
      readiness_ms: 2000
      heartbeat_ms: 4000
      lease_ms: 8000
    consent_purpose_mappings:
      - {behavior: microphone_capture, purpose_ref: avatar.media_capture}
      - {behavior: provider_session, purpose_ref: avatar.provider_processing}
      - {behavior: retain_structured_record, purpose_ref: avatar.structured_record}
    persona_reference:
      persona_id: neutral.confirmer
      version: 1
      catalog_locator: domain-owned-persona-catalog
    retention_overlay:
      policy_refs: [retention.consequential]
      display_flags: {show_retention_state: true}
    accessibility_baseline:
      keyboard_operation: true
      stable_focus: true
      visible_focus: true
      screen_reader_announcements: true
      captions: true
      text_only_mode: true
      reduced_motion: true
      high_contrast: true
      non_color_cues: true
      zoom_reflow: true
      pseudo_locale_coverage: true
    rendering:
      mode: plain_text
    outcome_slots:
      - outcome_ref: grant
        message_key: session.ready
        fallback_modes: [text, handoff]
      - outcome_ref: denial
        message_key: session.denied
        retry_guidance: retry_after_disclosure
        fallback_modes: [text, handoff, retry_later]
    fallback_slots:
      denial: {message_key: session.denied, approved_modes: [text, handoff]}
      audio_unavailable: {message_key: audio.unavailable, approved_modes: [text]}
    handoff:
      roles: [accountable_human]
      url_carries_no_secret: true
    runtime_compatibility:
      baseline_identity: avatar-client-parallel-v1
    domain_overlay:
      persona_roles: [neutral_confirmer]
      handoff_roles: [accountable_human]
      restricted_tool_classes: [final_authority_decision, money_movement, regulated_subject_action]
