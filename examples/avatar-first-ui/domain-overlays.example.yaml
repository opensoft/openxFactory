schema_version: 1
kind: xfactory_avatar_first_ui_overlay_examples

# Domain-NEUTRAL archetypes for the avatar-first UI standard. These are
# instantiation stubs (.example.yaml), not live configuration and not domain
# content: DomainxFactory repositories provide real domain profiles later.
# Each archetype carries the AVC-aligned additive blocks with valid, closed
# values so the offline validator passes. Personas are referenced only (Q1);
# retention/consent policy is referenced only (Q8/FR-014); kernel IDs and
# readiness/heartbeat/lease ceilings are consumed read-only from the frozen
# avatar-client-parallel-v1 baseline.

examples:
  # 1) Customer surface — avatar-first
  - profile:
      id: customer_avatar_first
      domain_factory_repo: DomainxFactory
      default_implementation_level: L1_audio_first_visual_avatar
      primary_user_kind: customer
      primary_subject_kind: subject
      avatar_required: true
      conventional_ui_fallback_required: true
    authority_boundaries:
      avatar_is_presentation_only: true
      workflow_authority_layer: openxFactory
      policy_authority_layer: Hermes
      execution_layer: Domain Omnigent
      final_enforcement_layer: accountable_human_or_external_system
    presentation:
      surface_default: conversation
      presentation_modes: [conversation, work, review]
    media:
      held_answer_state: connecting
    interaction_mode:
      value: provider_vad
    speech_gate:
      value: confirmation_before_action
    timing:
      readiness_ms: 3000
      heartbeat_ms: 5000
      lease_ms: 10000
    consent_purpose_mappings:
      - {behavior: microphone_capture, purpose_ref: avatar.media_capture}
      - {behavior: provider_session, purpose_ref: avatar.provider_processing}
      - {behavior: retain_structured_record, purpose_ref: avatar.structured_record}
    persona_reference:
      persona_id: neutral.guide
      version: 1
      catalog_locator: domain-owned-persona-catalog
    retention_overlay:
      policy_refs: [retention.default]
      display_flags: {show_retention_state: true}
    accessibility_baseline:
      keyboard_operation: true
      stable_focus: true
      visible_focus: true
      screen_reader_announcements: true
      captions: true
      text_only_mode: true
      reduced_motion: true
      high_contrast: true
      non_color_cues: true
      zoom_reflow: true
      pseudo_locale_coverage: true
    rendering:
      mode: plain_text
    handoff:
      roles: [accountable_human]
      url_carries_no_secret: true
    runtime_compatibility:
      baseline_identity: avatar-client-parallel-v1
      # Realized against the released avatar-client kernel (contract-v1.7).
      # released_tag pins the consumed KERNEL bundle, not this profile's own bundle.
      released_tag: contract-v1.7
      released_commit: ddff475f758f23cb11fbfc9a6d5bc352a810f916
