      domain_factory_repo: DomainxFactory
      default_implementation_level: L1_audio_first_visual_avatar
      primary_user_kind: operator
      primary_subject_kind: subject
      avatar_required: false
      conventional_ui_fallback_required: true
    authority_boundaries:
      avatar_is_presentation_only: true
      workflow_authority_layer: openxFactory
      policy_authority_layer: Hermes
      execution_layer: Domain Omnigent
      final_enforcement_layer: accountable_human_or_external_system
    presentation:
      surface_default: work
      presentation_modes: [conversation, work, review]
    media:
      held_answer_state: connecting
    interaction_mode:
      value: provider_vad
    speech_gate:
      value: confirmation_before_action
    timing:
      readiness_ms: 3000
      heartbeat_ms: 5000
      lease_ms: 10000
    consent_purpose_mappings:
      - {behavior: microphone_capture, purpose_ref: avatar.media_capture}
      - {behavior: provider_session, purpose_ref: avatar.provider_processing}
    persona_reference:
      persona_id: neutral.copilot
      version: 1
      catalog_locator: domain-owned-persona-catalog
    retention_overlay:
      policy_refs: [retention.default]
      display_flags: {show_retention_state: true}
    accessibility_baseline:
      keyboard_operation: true
      stable_focus: true
      visible_focus: true
      screen_reader_announcements: true
      captions: true
      text_only_mode: true
      reduced_motion: true
      high_contrast: true
      non_color_cues: true
      zoom_reflow: true
      pseudo_locale_coverage: true
    rendering:
      mode: narrow_sanitized
    handoff:
      roles: [accountable_human, domain_specialist]
      url_carries_no_secret: true
    runtime_compatibility:
      baseline_identity: avatar-client-parallel-v1
    domain_overlay:
      persona_roles: [neutral_copilot]
      handoff_roles: [accountable_human, domain_specialist]
      restricted_tool_classes: [destructive_action, money_movement]

  # 3) Domain governance surface — conventional-first with avatar analyst
  - profile:
      id: domain_conventional_first
      domain_factory_repo: DomainxFactory
      default_implementation_level: L0_text_avatar
      primary_user_kind: domain_expert
      primary_subject_kind: governed_artifact
      avatar_required: false
      conventional_ui_fallback_required: true
    authority_boundaries:
      avatar_is_presentation_only: true
      workflow_authority_layer: openxFactory
      policy_authority_layer: Hermes
      execution_layer: Domain Omnigent
      final_enforcement_layer: governance_council_or_external_system
    presentation:
      surface_default: review
      presentation_modes: [conversation, work, review]
    media:
      held_answer_state: connecting
    interaction_mode:
      value: provider_vad
    speech_gate:
      value: confirmation_before_action
    timing:
      readiness_ms: 3000
      heartbeat_ms: 5000
      lease_ms: 10000
    consent_purpose_mappings:
      - {behavior: microphone_capture, purpose_ref: avatar.media_capture}
    persona_reference:
      persona_id: neutral.analyst
      version: 1
      catalog_locator: domain-owned-persona-catalog
    retention_overlay:
      policy_refs: [retention.governance]
      display_flags: {show_retention_state: true}
    accessibility_baseline:
      keyboard_operation: true
      stable_focus: true
      visible_focus: true
      screen_reader_announcements: true
      captions: true
      text_only_mode: true
      reduced_motion: true
      high_contrast: true
      non_color_cues: true
