schema_version: 1
kind: xfactory_avatar_first_ui_fixture
fixture_id: det-control-degraded
evidence_ids: [AFU-008-S01, AFU-004-S05]
# Provenance: adopted verbatim from codexFactory branch 002-avatar-client-lab @ 3a8fbd5
#   (7/7 panel-confirmed; evidence in specs/002-avatar-client-lab/upstream-drafts/STATUS.md).
# Deterministic control_degraded fixture (avatar-client-lab P13 upstream candidate). The
# authoritative control/policy channel DEGRADES while media remains connected. Per the settled
# derivation invariants (normative until P1 lands): control_degraded => `blocked`, NEVER `speaking`;
# governed commands disable; recovery is required before consequential transitions resume. Unlike a
# consent revocation (a clean authored terminal), a control degradation is a fail-closed local safety
# transition nobody authored. IMPORTANT: this fixture uses the RAW kernel control_health enum value
# `degraded` (schema-valid against avc-12-state-snapshot.schema.yaml, whose enum is [healthy,
# degraded, lost]) rather than the already-flavored `control_lost` spelling the landed
# `control-lost-failure.yaml` seed used; gate (ix)(a) normalizes both forms. Fixed clock/IDs/font/
# locale/platform + canonical AVC inputs -> declared shapes. No live model, provider, clock, or RNG.
inputs:
  clock: "2026-07-11T00:01:40Z"
  ids:
    session_id: sess-0109
    workflow_id: wf-0109
    persona_id: neutral.guide
    persona_version: 1
  font: pinned-neutral-sans-with-rtl-face
  locale: en
  platform_capabilities:
    keyboard: true
    screen_reader: true
    reduced_motion: false
canonical:
  commands:
    - {command_type: start_session}
  events:
    - {event_type: session_started, authority: authoritative}   # session begins
    - {event_type: media_authorized, authority: authoritative}  # capture authorized
    - {event_type: lifecycle_transition, authority: authoritative, control_health: degraded}  # control channel degraded while media connected
  snapshot:
    logical_session_id: sess-0109
    last_event_sequence: 3
    state_revision: 3
    control_health: degraded          # KERNEL denominator evidence: normalizes to media.state `control_degraded`
    presentation_mode: conversation
expected:
  view_state:
    presentation_mode: conversation
    media_state: blocked              # control_degraded => derived `blocked`, never `speaking`
    control_state: degraded           # fail-closed local safety transition, NOT an authored outcome
    workflow_projection: intake
    governed_commands_enabled: false  # governed commands disable immediately on control degradation
    recovery_required: true           # snapshot recovery required before consequential transitions resume
  records:
    - {kind: session_started, session_id: sess-0109}
    - {kind: media_authorized, session_id: sess-0109}
    - {kind: control_degraded, session_id: sess-0109}
