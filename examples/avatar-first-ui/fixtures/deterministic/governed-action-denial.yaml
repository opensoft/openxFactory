schema_version: 1
kind: xfactory_avatar_first_ui_fixture
fixture_id: det-governed-action-denial
evidence_ids: [AFU-004-S03]
# Deterministic governed-action DENIAL fixture (avatar-client-lab task 4.2,
# contributed upstream). A denial is an authoritative negative OUTCOME rendered
# faithfully (AVC-02 result_kind: denial, reason: consent_missing, fallback_modes:
# [text, human_handoff], safe_message_key) — structurally incapable of carrying a
# credential or SDP — surfaced through the outcome/fallback slots, with the avatar
# NEVER entering `speaking`. This is the "denial" half of the denial-vs-failure
# distinction (acceptance-and-tests.md claim 5b): a governed negative outcome, NOT
# a crash. Its peer `control-lost-failure.yaml` is the "failure" half, and the two
# must render differently. Fixed clock/IDs/font/locale/platform + canonical AVC
# command/event/snapshot inputs -> declared canonical view-state/record shapes. No
# live model, provider, clock, or RNG. Two identical runs yield equivalent shapes.
inputs:
  clock: "2026-07-11T00:00:10Z"
  ids:
    session_id: sess-0003
    workflow_id: wf-0003
    persona_id: neutral.guide
    persona_version: 1
  font: pinned-neutral-sans-with-rtl-face
  locale: en
  platform_capabilities:
    keyboard: true
    screen_reader: true
    reduced_motion: false
canonical:
  commands:
    - {command_type: start_session}
  events:
    - {event_type: session_started, authority: authoritative}   # listening: session begins
    - {event_type: lifecycle_transition, authority: authoritative, result_kind: denial, reason: consent_missing}  # authoritative denial outcome
  snapshot:
    state_revision: 2
    presentation_mode: conversation
    session_outcome: denied
expected:
  view_state:
    presentation_mode: conversation
    media_state: idle          # capture never authorized; avatar never enters speaking
    control_state: healthy      # a denial is a governed outcome, NOT a control failure
    workflow_projection: intake
    outcome_slot: {result_kind: denial, reason: consent_missing, safe_message_key: msg.consent_missing}
    fallback_slot: {fallback_modes: [text, human_handoff]}
  records:
    - {kind: session_started, session_id: sess-0003}
    - {kind: session_denied, session_id: sess-0003, reason: consent_missing}
