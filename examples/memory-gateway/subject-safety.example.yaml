schema_version: 1
kind: xfactory_memory_gateway_subject_safety_examples
subject_safety_profiles:
  - id: medx_adult_patient_standard
    subject_category: adult
    age_band: adult
    authority_mode: direct
    guardian_or_delegate_ref: null
    allowed_interaction_modes:
      - avatar_first
      - chat
      - form
      - clinician_mediated
    prohibited_uses:
      - none
    redaction_class: customer_private
    retention_profile: medx_standard_patient_retention
    personalization:
      allowed: true
      prohibits:
        - manipulation
    audit_level: standard
  - id: medx_minor_patient_guardian
    subject_category: minor
    age_band: minor_13_to_15
    authority_mode: guardian
    guardian_or_delegate_ref: guardian:demo-parent-1
    allowed_interaction_modes:
      - guardian_mediated
      - clinician_mediated
    prohibited_uses:
      - inferred_personality_targeting
      - marketing_personalization
      - autonomous_sensitive_disclosure
    redaction_class: minor_safe
    retention_profile: medx_minor_patient_retention
    personalization:
      allowed: false
      degradation: minor_safe_context_packet
    audit_level: enhanced
