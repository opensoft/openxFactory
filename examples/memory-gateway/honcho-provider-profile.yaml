schema_version: 1
kind: xfactory_memory_gateway_provider_profile_example
provider_profile:
  id: honcho_profile_memory_v1
  provider_role: profile_memory
  product: Honcho
  adapter: xfactory.memory.adapters.honcho_stub
  allowed_layers:
    - customer
    - client
  ports:
    identity: adapter
    consent: external
    preference: native
    timeline: adapter
    source_claim: unsupported
    evidence_graph: unsupported
    current_state: adapter
    memory_item: adapter
    workflow_context: adapter
    follow_up: external
    promotion: external
    audit: companion
  erasure:
    preference: hard_delete
    memory_item: requires_reindex
    audit: unsupported
  companion_stores:
    - consent-profile-store
    - audit-ledger
  prohibited_content:
    - raw_credentials
    - clinical_source_truth
    - payment_source_truth
  expensive_operation_classes:
    - bulk_profile_export
  boundary_note: >-
    Honcho can help model people/profile relationships, but it does not own
    consent, promotion, or canonical customer truth.
