schema_version: 1
kind: xfactory_memory_gateway_provider_profile_example
provider_profile:
  id: agentmemory_worker_local_v1
  provider_role: worker_local_memory
  product: AgentMemory
  adapter: xfactory.memory.adapters.agentmemory_stub
  allowed_layers:
    - domain_omnigent
  ports:
    identity: unsupported
    consent: unsupported
    preference: unsupported
    timeline: unsupported
    source_claim: unsupported
    evidence_graph: unsupported
    current_state: unsupported
    memory_item: adapter
    workflow_context: adapter
    promotion: external
    audit: companion
    source_authority: unsupported
  erasure:
    memory_item: hard_delete
    audit: unsupported
  companion_stores:
    - audit-ledger
  prohibited_content:
    - packet_content_above_redaction_class
    - customer_private_without_packet_refs
    - authoritative_expert_truth
  expensive_operation_classes:
    - worker_memory_export
  boundary_note: >-
    AgentMemory remains worker-local recall. Durable customer or expert
    learning must be proposed as a promotion candidate.
