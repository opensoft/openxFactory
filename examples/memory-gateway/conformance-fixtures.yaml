  - id: promotion_denied_without_deidentification
    tier: M1
    operation: xfactory.memory.propose_promotion
    expected_decision: denied
    expected_denial_reason: promotion_missing_deidentification
    provider_io_attempted: false
    asserts:
      - cross-layer promotion cannot rely on provider consolidation
  - id: promotion_denied_without_required_review
    tier: M1
