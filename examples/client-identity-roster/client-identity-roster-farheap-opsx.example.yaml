# CLIENT IDENTITY ROSTER FRAGMENT — client `farheap`, owning domain
# `opsxfactory`. A TRUTHFUL WORKED CASE: every provider fact below is
# transcribed from a record in the OpsxFactory evidence chain, cited inline by
# repo + path + commit. Nothing here is illustrative filler, because a packaged
# example is an instantiation template a domain copies (research.md Decision 8).
#
# It carries the two mandated cases the roster delta names for this domain:
#
#   1. THE BUSINESS CENTRAL WORKED CASE (entry 1) — ONE identity admitted by
#      TWO acts on ONE surface, whose EFFECTIVE REACH is their UNION and whose
#      forced breadth is DECLARED. This is the case the change exists for: four
#      admin-consented permissions held for six days still returned `401` until
#      the admin-center authorization landed, so neither act admits alone, and
#      the second act has NO SCOPE SELECTOR — it converts a bound the provider
#      enforced (the environment) into one only gate logic enforces.
#   2. THE `planned` ENTRY (entry 2) — the Production environment, whose
#      application user does not exist ("Production has no application user for
#      this client id", observer identity evidence). It validates clean, is
#      never reported as missing or incomplete, and its single admission act is
#      UNVERIFIED by derivation: no `evidence_ref`, therefore no `verified_at`.
#
# TWO ACTS, ONE SURFACE — and that is ratified, not a judgement call. The
# ratified vocabulary carries `business_central` as ONE member whose description
# names BOTH acts; the delta's "each act is its own admission surface" scenario
# governs acts that admit INDEPENDENTLY, and these two do not.
#
#   3. THE `device` (NODE-INVENTORY) WORKED CASE (entry 3), added by
#      add-roster-device-admission-surface (contract-v1.35). The `device`
#      surface is ONE tenant-wide READ surface covering Entra registered
#      devices + Intune managed devices + Windows 365 Cloud PCs. Its governed
#      unit IS the tenant device estate, so tenant-wide read is the GOVERNED
#      scope, not excess: `exceeds_governed_unit: false`, NO `declared_excess`,
#      and NO `spanned_surfaces` (the three provider areas are prose in the
#      `device` member's description, never structured breadth). It is READ-ONLY
#      (`observe`/`observe`), its single act is `logic_enforced` (the read-only
#      roles carry no narrower selector — the provider offers nothing narrower),
#      and `per_unit_principal_available: {device: false}`. It is a `planned`
#      entry with an UNVERIFIED act (no `evidence_ref`/`verified_at`), because
#      the OpsxFactory node-inventory reader is a DOWNSTREAM consumer not yet
#      admitted — mirroring entry 2's unverified convention, and asserting no
#      verified provider fact this neutral repository cannot cite.
#
#   4. THE `directory` (SERVICE-INVENTORY) WORKED CASE (entry 4), added by
#      add-roster-directory-admission-surface (contract-v1.39). The `directory`
#      surface is ONE tenant-wide READ surface covering the tenant DIRECTORY AND
#      SERVICE ESTATE — the organization profile and its subscribed service
#      plans, the tenant's service principals/applications, and its verified
#      domains. Its governed unit IS that estate, so tenant-wide read is the
#      GOVERNED scope, not excess: `exceeds_governed_unit: false`, NO
#      `declared_excess`, and NO `spanned_surfaces` (those provider areas are
#      not `admission_surface` consts — they are prose in the `directory`
#      member's description, and the schema would refuse them in a structured
#      breadth field). It is READ-ONLY (`observe`/`observe`), its single act is
#      `logic_enforced`, and `per_unit_principal_available: {directory: false}`.
#      A `planned` entry with an UNVERIFIED act, on the same reasoning as
#      entries 2 and 3. Every provider fact is transcribed from the MERGED
#      `microsoft_service_discovery_reader` credential requirement
#      (opensoft/OpsxFactory, `credentials/requirements.yaml`, commit
#      `824f8ef`), whose `minimum_scopes` are exactly the three roles below
#      under `exact_effective_scopes: true` and
#      `reject_write_or_destructive_scopes: true`.
schema_version: 1
kind: xfactory_client_identity_roster
client_ref: farheap
# The provider tenant identifier of the client this fragment covers. Declared,
# never derived: `client_ref` above is a governance slug, and the
# `client_tenant_single` rule has nothing to compare `home_tenant` against
# without it. Verified tid, OpsxFactory tenants/farheap.yaml and every evidence
# record below.
client_tenant: 96d3fa6b-5547-49ca-9af1-dba9bec50c2b
domain: opsxfactory
legend:
  # Provider fidelity for the two DOMAIN-DECLARED tokens lives here, bound per
  # fragment. `business_central_administration` registers the ENVIRONMENT as the
  # blast-radius unit (workflow `registration_unit: environment`), because an
  # extension install, a schema sync and an update schedule reach every company
  # in an environment and none can be pinned to one.
  blast_radius_units:
    sandbox1: "Sandbox1 (FarHeap Business Central environment, US)"
    production: "Production (FarHeap Business Central environment, friendly name FARHEAP, US)"
    tenant_device_estate: >-
      The FarHeap tenant DEVICE ESTATE as one unit — every Entra registered
      device, every Intune managed device and every Windows 365 Cloud PC in
      tenant 96d3fa6b-5547-49ca-9af1-dba9bec50c2b. Tenant-wide read is the
      GOVERNED scope for this unit, not excess: the provider offers no narrower
      selector on the read-only device roles.
    tenant_directory_estate: >-
      The FarHeap tenant DIRECTORY AND SERVICE ESTATE as one unit — the
      organization profile and its subscribed service plans, every service
      principal and application registration, and every verified domain in
      tenant 96d3fa6b-5547-49ca-9af1-dba9bec50c2b. Tenant-wide read is the
      GOVERNED scope for this unit, not excess: a complete tenant
      service-surface inventory is what read-only DISCOVER is for, and the
      provider offers no narrower selector on the read-only directory roles.
  duties:
    environment_observation: >-
      Business Central ENVIRONMENT observation — extension deployment status,
      Access Control enumeration and environment inventory, producing
      infrastructure_readiness_result artifacts. The books are never touched.
    node_inventory: >-
      Read-only enumeration of the tenant device estate — Entra registered
      devices, Intune managed devices and Windows 365 Cloud PCs — producing a
      node inventory. No device is created, modified, wiped or retired.
    service_inventory: >-
      Read-only enumeration of the tenant directory and service estate — the
      organization profile and its subscribed service plans, service
      principals/applications, and verified domains — producing a tenant
      service-surface inventory. No directory object is created, modified or
      deleted.
entries:

  # ------------------------------------------------------------------
  # ENTRY 1 — the Business Central worked case (SC-003, SC-004).
  # ------------------------------------------------------------------
  - identity_ref: opsx-farheap-bc-observer
    identity_kind: entra_app_registration
    home_tenant: 96d3fa6b-5547-49ca-9af1-dba9bec50c2b
    principal_locations:
      - 96d3fa6b-5547-49ca-9af1-dba9bec50c2b
    residency_model: client_tenant_single
    # The Entra `app_id` — a provider-native OBJECT identifier, not a tenant
    # identifier. Two domains that really do share one application share THIS
    # value; tenant collocation never produces it.
    provider_object_ref: 8ab93407-88ce-4fa3-97cb-6232acab65c5
    admission_surface: business_central
    duty: environment_observation
    blast_radius_unit: sandbox1
    # INTENDED observation; ACHIEVED mutation. The gap is real and DECLARED
    # below rather than renamed away: Business Central exposes exactly four
    # app-only roles and NO read-only admin-center role, so the credential able
    # to read a deployment status is also able to delete an environment.
    authority_class_intended: observe
    authority_class_achieved: mutate
    granted_permissions:
      # The four app role assignments held by this service principal, VERBATIM
      # from the identity evidence record's `app_role_assignments`. All four are
      # declared `mutate` because the ratified workflow declares its credential
      # excess against the SET (`declared_credential_excess.credential_roles`,
      # all four listed, `no_narrower_role_reason: no read-only admin-center
      # role exists`) and the estate has never measured a per-role split;
      # declaring any of them `observe` would be an UNCITED narrowing, and the
      # safe direction for a governance record is the conservative one.
      - id: API.ReadWrite.All
        achieves: mutate
        reaches: [business_central]
      - id: Automation.ReadWrite.All
        achieves: mutate
        reaches: [business_central]
      - id: AdminCenter.ReadWrite.All
        achieves: mutate
        reaches: [business_central]
      - id: app_access
        achieves: mutate
        reaches: [business_central]
    admission:
      # ACT 1 — the PER-ENVIRONMENT APPLICATION USER. Its scoping mechanism is
      # the ENVIRONMENT, and the provider itself enforces it: an application
      # user in Sandbox1 admits to Sandbox1, and Production, having none, is
      # not reachable. Does NOT exceed the governed unit.
      - surface: business_central
        act: >-
          per-environment application user created and Enabled in Sandbox1
          (userName OPSX-FARHEAP-BC-OBSERVER, userSecurityId
          e6c272ab-e445-4de8-9df5-65b0d76937af, permission set D365 READ with
          Company blank so the sanctioned-companies enumeration can see every
          company)
        achieved_scope: "Sandbox1 environment, all companies (permission-set Company blank)"
        enforcement_mode: provider_enforced
        evidence_ref:
          repo: opensoft/OpsxFactory
          path: tenants/farheap-bc-sandbox1-verification-evidence-v2.yaml
          sha: 39f46de
        verified_at: "2026-08-08T08:23:05Z"
        exceeds_governed_unit: false
      # ACT 2 — the ADMIN-CENTER ENTRA-APP AUTHORIZATION. It has NO SCOPE
      # SELECTOR at all, so it is tenant-wide across every environment. This is
      # the structural-to-logical degradation this contract exists to make
      # checkable: `exceeds_governed_unit: true`, and therefore a
      # `declared_excess` is REQUIRED below. The same probe that returned 401
      # for six days under act 1 alone returned 200 once this act landed —
      # which is also why neither act admits on its own.
      - surface: business_central
        act: >-
          admin-center Entra-app authorization registered (Business Central
          admin center > Microsoft Entra Apps > Authorized Microsoft Entra Apps;
          admin consent granted, verified 2026-08-14T10:11:12Z)
        achieved_scope: "tenant-wide across every Business Central environment (no scope selector exists on this act)"
        enforcement_mode: logic_enforced
        evidence_ref:
          repo: opensoft/OpsxFactory
          path: tenants/farheap-bc-sandbox1-verify-probe-evidence-v7.yaml
          sha: 24c56cb
        verified_at: "2026-08-14T13:02:32Z"
        exceeds_governed_unit: true
    declared_excess:
      # Forced breadth, DECLARED — which is what makes it conformant. Two
      # excesses ride this one declaration: the ACHIEVED CLASS above the
      # intended one, and the ACHIEVED SCOPE of act 2 beyond the governed
      # environment. No surface is spanned, so `spanned_surfaces` is absent.
      provider_reason: >-
        No read-only admin-center role exists. Business Central exposes exactly
        four app-only roles, so the credential able to read a deployment status
        is also able to delete an environment; and the admin-center Entra-app
        authorization offers no scope selector, so it cannot be bound to one
        environment. Recorded in the ratified workflow as
        `declared_credential_excess.no_narrower_role_reason` (OpsxFactory
        workflows/business-central-administration.yaml, commit 789a962).
      bound_mechanism: >-
        The deterministic read-only surface containing no destructive call — the
        absence is structural, no plan builder for a mutation exists anywhere in
        the module — plus an explicit prohibited-action-class list, just-in-time
        short-lived grants that do not exist between uses, and per-call evidence.
        Mutation is refused by CLASS before any call is made.
      gate_obligation: business_central_administration_mutation_refused_by_class
      enforcement_test_ref: >-
        OpsxFactory tests for the business_central_administration deterministic
        surface: the prohibited-action-class refusal fixtures, which assert that
        a mutation request against a registered environment is refused by class
        and that an unregistered environment is refused outright.
    # One answer per surface this entry touches. `true`: the per-environment
    # application user IS the principal scoped to the governed unit, and act 1
    # uses it. Act 2 CANNOT use it — it has no scope selector at all — and an
    # act that cannot use the principal is conformant beside a sibling act that
    # does. That is why the structural-before-logical rule is read PER SURFACE.
    per_unit_principal_available:
      business_central: true
    lifecycle_state: enrolled
    standing_credential_attestation:
      no_standing_credential: true
      attested_at: "2026-08-08T07:32:53Z"
      evidence_ref:
        repo: opensoft/OpsxFactory
        path: tenants/farheap-bc-observer-identity-evidence-v1.yaml
        sha: 1ce8cae
    ratified_by: opsxfactory:business-central-administration
    consent_ref: farheap-bc-administration-consent-v1

  # ------------------------------------------------------------------
  # ENTRY 2 — the `planned` entry (FR-013, SC-002, SC-013).
  # ------------------------------------------------------------------
  # The SAME Entra registration (`provider_object_ref` is identical) at a
  # DIFFERENT governed blast-radius unit, which is a different governed identity
  # in roster terms because the ENVIRONMENT is the registered unit. Production
  # has no application user for this client id — a post-condition CONFIRMED in
  # the identity evidence record — so this entry is declared INTENT. It
  # validates clean and is NEVER reported as missing, incomplete or stale.
  - identity_ref: opsx-farheap-bc-observer
    identity_kind: entra_app_registration
    home_tenant: 96d3fa6b-5547-49ca-9af1-dba9bec50c2b
    principal_locations:
      - 96d3fa6b-5547-49ca-9af1-dba9bec50c2b
    residency_model: client_tenant_single
    provider_object_ref: 8ab93407-88ce-4fa3-97cb-6232acab65c5
    admission_surface: business_central
    duty: environment_observation
    blast_radius_unit: production
    authority_class_intended: observe
    authority_class_achieved: mutate
    granted_permissions:
      # Consent is TENANT-level and already granted, so the same four roles
      # apply the moment the application user exists.
      - id: API.ReadWrite.All
        achieves: mutate
        reaches: [business_central]
      - id: Automation.ReadWrite.All
        achieves: mutate
        reaches: [business_central]
      - id: AdminCenter.ReadWrite.All
        achieves: mutate
        reaches: [business_central]
      - id: app_access
        achieves: mutate
        reaches: [business_central]
    admission:
      # THE UNVERIFIED STATE, expressed the only way this contract allows it:
      # by the ABSENCE of BOTH `evidence_ref` and `verified_at`, never by an
      # asserted flag an author could set against the evidence. An unverified
      # act contributes NOTHING to effective reach.
      - surface: business_central
        act: >-
          per-environment application user to be created in the Production
          environment — not yet performed; Production is human-gated and enters
          by separate instruction after the sandbox rehearsal is green
        achieved_scope: "Production environment (intended; no application user exists for this client id)"
        enforcement_mode: provider_enforced
        exceeds_governed_unit: false
    declared_excess:
      # The CLASS overshoot alone: the same four roles, the same absent
      # read-only path. No act here exceeds the governed unit.
      provider_reason: >-
        No read-only admin-center role exists (OpsxFactory
        workflows/business-central-administration.yaml
        `declared_credential_excess.no_narrower_role_reason`, commit 789a962),
        so an observation-intended identity in this environment will achieve
        mutation the moment its application user exists.
      bound_mechanism: >-
        The same deterministic read-only surface and prohibited-action-class
        list that bounds the Sandbox1 entry, plus the ratified rule that
        gated mutations are sandbox-registered-environments-only — Production
        stays human until a separate widening change says otherwise.
      gate_obligation: business_central_administration_mutation_refused_by_class
      enforcement_test_ref: >-
        OpsxFactory tests for the business_central_administration deterministic
        surface: the prohibited-action-class refusal fixtures, plus the
        unregistered-environment refusal, which is what an act against
        Production meets today.
    per_unit_principal_available:
      business_central: true
    lifecycle_state: planned
    standing_credential_attestation:
      no_standing_credential: true
      attested_at: "2026-08-08T07:32:53Z"
      evidence_ref:
        repo: opensoft/OpsxFactory
        path: tenants/farheap-bc-observer-identity-evidence-v1.yaml
        sha: 1ce8cae
    ratified_by: opsxfactory:business-central-administration
    consent_ref: farheap-bc-administration-consent-v1

  # ------------------------------------------------------------------
  # ENTRY 3 — the `device` (node-inventory) worked case
  # (add-roster-device-admission-surface, contract-v1.35).
  # ------------------------------------------------------------------
  # The tenant DEVICE ESTATE read as ONE tenant-wide surface. Its governed unit
  # IS that estate, so tenant-wide read is the GOVERNED scope
  # (`exceeds_governed_unit: false`, no `declared_excess`): there is nothing to
  # declare as excess, because the provider offers no narrower selector on the
  # read-only device roles and the whole estate is what this entry governs. The
  # three provider areas (Entra registered devices / Intune managed devices /
  # Windows 365 Cloud PCs) are NOT `admission_surface` consts — they are prose
  # in the `device` member's schema description and appear in NO structured
  # breadth field. A `planned` entry (the node-inventory reader is a DOWNSTREAM
  # OpsxFactory consumer not yet admitted), so its single act is UNVERIFIED by
  # derivation — no `evidence_ref` and no `verified_at`, exactly as entry 2 —
  # and `provider_object_ref` is omitted because the registration does not yet
  # exist in the provider.
  - identity_ref: opsx-farheap-node-inventory-reader
    identity_kind: entra_app_registration
    home_tenant: 96d3fa6b-5547-49ca-9af1-dba9bec50c2b
    principal_locations:
      - 96d3fa6b-5547-49ca-9af1-dba9bec50c2b
    residency_model: client_tenant_single
    admission_surface: device
    duty: node_inventory
    blast_radius_unit: tenant_device_estate
    # Intended observation, ACHIEVED observation. Unlike Business Central, the
    # device estate offers genuinely read-only application roles: the three
    # granted roles confer no creation, modification or deletion, so there is no
    # forced class overshoot and therefore no `declared_excess`.
    authority_class_intended: observe
    authority_class_achieved: observe
    granted_permissions:
      # The three read-only application roles the admission act consents to. All
      # `observe`; each reaches the single `device` surface. `Device.Read.All`
      # reads Entra registered devices, `DeviceManagementManagedDevices.Read.All`
      # reads Intune managed devices, `CloudPC.Read.All` reads Windows 365 Cloud
      # PCs — one tenant-wide read surface, three provider areas.
      - id: Device.Read.All
        achieves: observe
        reaches: [device]
      - id: DeviceManagementManagedDevices.Read.All
        achieves: observe
        reaches: [device]
      - id: CloudPC.Read.All
        achieves: observe
        reaches: [device]
    admission:
      # THE SINGLE ACT — admin consent for the three read-only roles on ONE
      # Entra app registration. `logic_enforced`: the read is bounded by the
      # exact read-only roles, and there is NO provider scoping selector (unlike
      # Exchange's RestrictAccess), so no per-unit principal exists to use. The
      # act is UNVERIFIED — no `evidence_ref`/`verified_at` — because the
      # registration is not yet admitted; it contributes nothing to effective
      # reach until it is.
      - surface: device
        act: >-
          admin consent to be granted for the read-only application roles
          Device.Read.All, DeviceManagementManagedDevices.Read.All and
          CloudPC.Read.All on one Entra app registration in the FarHeap tenant —
          not yet performed; enters by separate instruction under the downstream
          OpsxFactory node-inventory consent ceremony
        achieved_scope: >-
          tenant-wide device-estate read (intended; the read-only roles carry no
          narrower selector, so the exact effective scopes ARE the bound and the
          provider offers nothing narrower)
        enforcement_mode: logic_enforced
        exceeds_governed_unit: false
    per_unit_principal_available:
      # FALSE — the governed unit is the whole tenant device estate and the
      # read-only roles carry no scope selector, so no principal is scoped to a
      # narrower unit. `logic_enforced` beside a `false` answer is conformant:
      # the bound is our gate logic and the read-only role set, with the
      # provider reason recorded (there is no narrower selector to use).
      device: false
    lifecycle_state: planned
    standing_credential_attestation:
      no_standing_credential: true
      attested_at: "2026-08-08T07:32:53Z"
    ratified_by: opsxfactory:managed-node-inventory
    consent_ref: farheap-node-inventory-consent-v1

  # ------------------------------------------------------------------
  # ENTRY 4 — the `directory` (service-inventory) worked case
  # (add-roster-directory-admission-surface, contract-v1.39).
  # ------------------------------------------------------------------
  # The tenant DIRECTORY AND SERVICE ESTATE read as ONE tenant-wide surface.
  # Its governed unit IS that estate — a COMPLETE tenant service-surface
  # inventory is what read-only DISCOVER is for — so tenant-wide read is the
  # GOVERNED scope (`exceeds_governed_unit: false`, no `declared_excess`):
  # there is nothing to declare as excess, because the provider offers no
  # narrower selector on the read-only directory roles and the whole estate is
  # what this entry governs. The provider areas read (organization profile and
  # subscribed service plans / service principals and applications / verified
  # domains) are NOT `admission_surface` consts — they are prose in the
  # `directory` member's schema description and appear in NO structured breadth
  # field, which the schema would refuse. A `planned` entry (the service
  # DISCOVERY reader is a DOWNSTREAM OpsxFactory consumer not yet admitted), so
  # its single act is UNVERIFIED by derivation — no `evidence_ref` and no
  # `verified_at`, exactly as entries 2 and 3 — and `provider_object_ref` is
  # omitted because the registration does not yet exist in the provider.
  #
  # SEPARATE FROM `device`, DELIBERATELY. `Directory.Read.All` would read the
  # already-admitted `device` surface too, so it is OUTSIDE this surface's
  # admission act; the three roles below are the exact effective set, which is
  # what keeps the two surfaces separately consented, separately scoped and
  # separately revocable.
  - identity_ref: opsx-farheap-service-discovery-reader
    identity_kind: entra_app_registration
    home_tenant: 96d3fa6b-5547-49ca-9af1-dba9bec50c2b
    principal_locations:
      - 96d3fa6b-5547-49ca-9af1-dba9bec50c2b
    residency_model: client_tenant_single
    admission_surface: directory
    duty: service_inventory
    blast_radius_unit: tenant_directory_estate
    # Intended observation, ACHIEVED observation. The realized reader class
    # carries `reject_write_or_destructive_scopes: true` over three `*.Read.All`
    # roles (OpsxFactory credentials/requirements.yaml, commit 824f8ef), so
    # there is no forced class overshoot and therefore no `declared_excess`.
    authority_class_intended: observe
    authority_class_achieved: observe
    granted_permissions:
      # The three read-only application roles the admission act consents to,
      # VERBATIM from `microsoft_service_discovery_reader.minimum_scopes` under
      # `exact_effective_scopes: true` (OpsxFactory
      # credentials/requirements.yaml, commit 824f8ef). All `observe`; each
      # reaches the single `directory` surface. `Organization.Read.All` reads the
      # organization profile and its subscribed service plans,
      # `Application.Read.All` reads the tenant's service principals and
      # applications, `Domain.Read.All` reads its verified domains — one
      # tenant-wide read surface, three provider areas. Business Central
      # presence is detected from the service-plan signal this same read already
      # returns, so it adds no fourth role.
      - id: Organization.Read.All
        achieves: observe
        reaches: [directory]
      - id: Application.Read.All
        achieves: observe
        reaches: [directory]
      - id: Domain.Read.All
        achieves: observe
        reaches: [directory]
    admission:
      # THE SINGLE ACT — admin consent for the three read-only roles on ONE
      # Entra app registration. `logic_enforced`: the read is bounded by the
      # exact read-only roles, and there is NO provider scoping selector (unlike
      # Exchange's RestrictAccess), so no per-unit principal exists to use. The
      # act is UNVERIFIED — no `evidence_ref`/`verified_at` — because the
      # registration is not yet admitted; it contributes nothing to effective
      # reach until it is. The credential itself is never standing: it is
      # presented BY REFERENCE through the promoted `tenant-reader-grant-pipeline`
      # as an app-only workload identity, never a delegated user session
      # (`access_mode: workload_identity`, `max_grant_minutes: 60`, same record).
      - surface: directory
        act: >-
          admin consent to be granted for the read-only application roles
          Organization.Read.All, Application.Read.All and Domain.Read.All on one
          Entra app registration in the FarHeap tenant — not yet performed;
          enters by separate instruction under the downstream OpsxFactory
          service-inventory consent ceremony
        achieved_scope: >-
          tenant-wide directory and service-estate read (intended; the read-only
          roles carry no narrower selector, so the exact effective scopes ARE the
          bound and the provider offers nothing narrower)
        enforcement_mode: logic_enforced
        exceeds_governed_unit: false
    per_unit_principal_available:
      # FALSE — the governed unit is the whole tenant directory and service
      # estate and the read-only roles carry no scope selector, so no principal
      # is scoped to a narrower unit. `logic_enforced` beside a `false` answer is
      # conformant: the bound is our gate logic and the read-only role set, with
      # the provider reason recorded (there is no narrower selector to use).
      directory: false
    lifecycle_state: planned
    standing_credential_attestation:
      # The claim is made against the MERGED reader class, so the attestation
      # moment is that merge's own commit timestamp (OpsxFactory `main`
      # `824f8ef`, 2026-08-22T11:11:27Z) rather than an invented one. The class
      # is `access_mode: workload_identity` with `max_grant_minutes: 60`: no
