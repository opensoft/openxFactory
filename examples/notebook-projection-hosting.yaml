# Hosting declaration and share-out roster for the lifecycle notebook
# projection. Governed by `docs/lifecycle-notebook-projection.md`; ratified by
# `add-notebook-projection-identity` (2026-08-23).
#
# WHY THIS FILE IS NOT UNDER contracts/. It is the operator's own governance
# record for one install's tooling account: no other repository, install or
# domain consumes it, and nothing pins it. Its sibling
# `lifecycle-notebook-workspaces.yaml` — the workspace registry for this same
# projection, read and written by the same script — sits here for the same
# reason. Promoting this shape into `contracts/` is a later, deliberate act if a
# second install ever needs to interoperate on it.
schema_version: 1
kind: notebook_projection_hosting

# WHICH GOOGLE IDENTITY HOSTS THIS INSTALL'S PROJECTION.
# `case` is one of `operator_hosted` or `self_hosted`. Both are legitimate; an
# absent declaration is a nonconforming transition state, not a third case.
hosting:
  case: operator_hosted
  account: xFactor001@opensoft.one
  account_type: google_workspace_user
  domain: opensoft.one
  # The `nlm` CLI profile bound to that account. The CLI selects a profile
  # PROCESS-GLOBALLY (`auth.default_profile`), not per invocation, so the sync
  # VERIFIES this matches the active profile and refuses otherwise — it never
  # switches the profile itself, because that is shared user state.
  nlm_profile: company
  declared_at: "2026-08-23"
  declared_by: Brett Heap
  # Recorded honestly: the migration ran on 2026-08-24 and the books now live
  # in the declared account above. `from_account` / `from_nlm_profile` are kept
  # as the history of where the projection came from — they are what the
  # retirement record in the migration evidence addresses (see
  # docs/notebook-projection-migration-runbook.md).
  migration:
    state: complete
    completed_at: "2026-08-24"
    from_account: brettheap@gmail.com
    from_nlm_profile: personal

  # WHERE THIS ACCOUNT'S CREDENTIAL IS HELD — BY REFERENCE ONLY.
  # (add-notebook-hosting-credential-custody § 1. Ratified 2026-08-23.)
  #
  # This block names the BINDING, never the secret. It is deliberately not
  # enough to obtain anything: resolving it requires the binding instance, which
  # lives in the consuming install and not in this repository (the residency
  # redirect Brett accepted at ratification — neutral obligations here, live
  # binding instances in the installs).
  #
  # `secret_ref` is ABSENT ON PURPOSE and the validator refuses it. It is
  # binding detail; duplicating it here would invite the rest of the binding to
  # follow, and the record's whole job is to point at the binding rather than
  # restate it (review note, 2026-08-23).
  custody:
    # The binding's identifier: which client's binding template, and which key
    # within its `credential_bindings` map.
    binding_kind: xfactory_credential_binding_template
    binding_client: opensoft
    binding_id: notebook_projection_hosting

    # WHAT THE CUSTODY COVERS. Named individually because "the credential" is
    # not one thing, and a second factor left outside custody makes the whole
    # arrangement a single point of failure wearing governance.
    covers:
      - account_password
      - totp_seed

    # THE HONEST REACH — required by the ratified text, and the reason this
    # block is prose-heavy rather than three fields.
    #
    # CUSTODY IS NOT AUTOMATION. Holding this material governs WHO MAY OBTAIN
    # IT and proves who did. It does not make the sign-in unattended: Google's
    # sign-in for this account is an INTERACTIVE BROWSER FLOW, and it stays one.
    # An operator with the vault material still performs that step by hand.
    #
    # A reader planning unattended access on the strength of this block would be
    # planning on something that does not exist, which is why the limit is
    # recorded beside the reference rather than in a doc a reader may not reach.
    interactive_step_remains: true
    interactive_step: >-
      Google sign-in for this account is an interactive browser flow. The
      custody material completes the credential prompts; it does not complete
      the sign-in. See docs/notebook-projection-migration-runbook.md.

    # THE nlm SESSION IS NOT A CUSTODY SUBJECT. The profile under
    # ~/.notebooklm-mcp-cli/ is refreshable session state, and
    # `credential-contracts` already refuses distributing that class: an
    # ephemeral copy's refresh silently stales the master. It is re-established
    # by sign-in, never fetched from a vault, and never shared between systems.
    session_state_in_custody: false

# THE APPROVAL LANE — who decides a share request, RULED 2026-08-27.
#
# Task 2.4 of add-notebook-projection-identity. The ratified requirement says a
# pending request "SHALL be decided by a designated company-policy actor as a
# GOVERNED ACT, in the hosting account's own interface, and SHALL NOT be left to
# whoever happens to read the account's mail." Until this block existed the
# designation was missing, which is the failure that sentence describes: a
# request landing in an inbox with nobody named to answer it.
#
# The standing declaration lives HERE, and the per-decision record lives in the
# roster entry's `granted_by`. Both are needed: this says who MAY decide, the
# entry says who DID.
approval:
  designated_actor: Brett Heap
  declared_at: "2026-08-27"
  declared_by: Brett Heap
  # WHERE the act happens. NotebookLM exposes no administrative or sharing API
  # for inbound requests, so the decision is taken in the hosting account's own
  # interface, signed in as the declared account. `nlm share invite` can perform
  # the grant once the decision is made, but it is the same act from a terminal
  # — never a second lane, and never an automated approver.
  acts_in: the hosting account's own NotebookLM interface
  # No API is designed against, per the ratified text. Detection and relay of
  # pending requests MAY be automated if the platform ever offers a surface;
  # the approval stays a governed human act either way.
  automated_approval: false

# THE SHARE-OUT ROSTER — the record of every governed share act from the
# hosting account. Uniqueness is (hosting_account, user, book_or_alias): a
# re-approval, a role change, or a grant by a different actor UPDATES the one
# live entry rather than adding a second, and the superseded decision moves to
# that entry's `history`. Approving a request writes or updates an entry here;
# denials are recorded in `denied` below.
#
# Empty until the migration lands: there is nothing to share out from an
# account that does not yet hold the books.
# EXECUTED 2026-08-27 through the § 2.4 lane, on Brett Heap's ruling of that
# date. These entries are the RECORD OF THE GRANTED ACT — written from grants
# that were actually cast, never backfilled, which is what task 4.7 requires.
# Verified after the fact by `nlm share status <alias> --json --profile company`:
# every book below
# lists brett.heap@farheap.com as editor beside the owner.
share_out:
  - hosting_account: xFactor001@opensoft.one
    user: brett.heap@farheap.com
    book_or_alias: xf-canon
    role: editor
    granted_at: "2026-08-27"
    granted_by: Brett Heap
  - hosting_account: xFactor001@opensoft.one
    user: brett.heap@farheap.com
    book_or_alias: xf-drafts
    role: editor
    granted_at: "2026-08-27"
    granted_by: Brett Heap
  - hosting_account: xFactor001@opensoft.one
    user: brett.heap@farheap.com
    book_or_alias: xf-ideation-codexfactory
    role: editor
    granted_at: "2026-08-27"
    granted_by: Brett Heap
  - hosting_account: xFactor001@opensoft.one
    user: brett.heap@farheap.com
    book_or_alias: xf-ideation-ledgerxfactory
    role: editor
    granted_at: "2026-08-27"
    granted_by: Brett Heap
  - hosting_account: xFactor001@opensoft.one
    user: brett.heap@farheap.com
    book_or_alias: xf-ideation-medxfactory
    role: editor
    granted_at: "2026-08-27"
    granted_by: Brett Heap
  - hosting_account: xFactor001@opensoft.one
    user: brett.heap@farheap.com
    book_or_alias: xf-ideation-openxfactory
    role: editor
    granted_at: "2026-08-27"
    granted_by: Brett Heap
  - hosting_account: xFactor001@opensoft.one
    user: brett.heap@farheap.com
    book_or_alias: xf-ideation-opsxfactory
    role: editor
    granted_at: "2026-08-27"
    granted_by: Brett Heap

# Recorded refusals. A denied request is a governed act too, and is not left to
# expire unrecorded.
# RULED 2026-08-27 by Brett Heap, the designated company-policy actor: the
# standing 2026-08-15 request is DENIED as stale — "old request and not valid".
# Recorded rather than left to expire, which is the obligation task 2.5 carries
# and the failure this whole lane was raised against.
#
# The requester is not named because the request was never visible through the
# provider's sharing API (migration evidence step 9) and existed only in the
# legacy account's mail. Denying it does not require naming them; leaving it
# unrecorded would have.
denied:
  - hosting_account: xFactor001@opensoft.one
    book_or_alias: "(request predates the migration; no book resolved)"
    decided_at: "2026-08-27"
    decided_by: Brett Heap
    decision: denied
    reason: >-
      Request originated 2026-08-15 against the personal-hosted projection and is
      stale; ruled no longer valid. Any future access is requested afresh through
      the governed lane.
