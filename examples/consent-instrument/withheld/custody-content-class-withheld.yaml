# WITHHELD — NEITHER A POSITIVE NOR A NEGATIVE, which is why this file lives in
# a third directory. The last entry declares `diff_class: content` and EVERY
# INTERNAL LEG IS SOUND: the chain anchors to the pin in both halves, links in
# both halves, its recorded times do not decrease, its enumerations are closed,
# its entries are closed, and the pin is verbatim.
#
# So the RECORD is correct and the INSTRUMENT is what needs attention. A content
# divergence means the referent of a signed original moved, which is grounds for
# RE-EXECUTION rather than for recording — the verdict is WITHHELD, a third
# outcome beside current and refused, and the validator exits 3 ("needs a human
# decision") for a REAL instrument in this state.
#
# The PACKAGED fixture is exempt from that exit: an expected withholding is to
# this bucket what an expected failure is to a negative, so the self-test still
# exits 0.
