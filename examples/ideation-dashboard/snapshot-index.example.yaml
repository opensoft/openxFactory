    display_name: xFactory (all submodules)
    members:
      - repository: openxFactory
        ref: main
      - repository: MedxFactory
        ref: main
      - repository: LedgerxFactory
        ref: main
      # `ref` omitted means `main` (D4's default applies to members too).
      - repository: agenttower
