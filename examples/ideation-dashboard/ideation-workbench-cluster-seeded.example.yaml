# VALID ideation-workbench manifest, cluster-seeded with a saved recipe.
#   - seed.kind=cluster-seeded carries cluster_id (schema allOf);
#   - a manual-include member carries its recorded reason (never a silent edit);
#   - an excluded entry carries its reason (negative evidence);
#   - recipe.pinned is a SUBSET of recipe.checked (validator rule W1);
#   - recipe.new_candidates is DISJOINT from members and excluded (validator rule W2);
#   - the notebook alias matches xf-wb-*.
# This file lives under examples/ (static reference material), so the
# committed-manifest guard deliberately excludes it — a real saved manifest
# would live under gitignored ideation/workbench/.
schema_version: 1
kind: ideation-workbench
repository: openxFactory
name: Dashboard readiness sweep
created: "2026-07-14T08:15:00Z"
updated: "2026-07-14T09:40:00Z"
members:
  - {document: doc-keyword-lens, via: cluster-seed}
  - {document: doc-cluster-canvas, via: cluster-seed}
  - document: doc-ideation-dashboard-brainstorm
    via: manual-include
    reason: The originating brainstorm belongs in the readiness sweep even though it predates the cluster.
excluded:
  - document: doc-lifecycle-notebook-projection
    reason: Notebook-projection doc matched the recipe but is out of the dashboard readiness scope.
seed:
  kind: cluster-seeded
  cluster_id: cl-ideation-dashboard
recipe:
  checked: [ideation-dashboard, keyword-lens, cluster-canvas]
  pinned: [ideation-dashboard]
  last_run:
    source_revision: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
    at: "2026-07-14T09:40:00Z"
  new_candidates: [doc-workflow-visualization]
action_history:
  - {action: readiness, at: "2026-07-14T09:00:00Z", reference: readiness/xf-wb-run-0007}
  - {action: doc-health, at: "2026-07-14T09:20:00Z", reference: health/scoped/xf-wb-0007}
  - {action: draft-organize, at: "2026-07-14T09:40:00Z", reference: staging/dashboard-readiness/DRAFT-skeleton}
notebook:
  alias: xf-wb-dashboard-readiness
