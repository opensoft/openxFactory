# VALID widened success (contract-v1.45): the turn that COST TWO PAID PROVIDER
# CALLS, and says so.
#
# Brett ruled on 2026-08-26 that when a minted token expires part-way through a
# turn the console re-mints and retries ONCE, "with the re-mint and the paid
# retry VISIBLY RECORDED in the turn record" — because a second paid call the
# human cannot see is exactly the decision that ruling was made to avoid. Three
# server-side records of it already existed (the port's content-free mint
# ledger, the console's own stderr notice, and the broker's audit trail
# correlated by `--retry-of`) and the browser could read NONE of them. This key
# is how the fact reaches the person paying for it.
#
# WHAT IT CARRIES AND WHAT IT REFUSES TO: that it happened, that it happened at
# most once (the ruling's bound — a second expiry in one turn refuses instead of
# buying a third call, and that turn produces a FAILURE envelope, never this
# one), and the re-mint's audit reference. Never the token, never a prefix or a
# hash of it, never a provider status and never the provider's words.
#
# THE PAIR TO THIS INSTANCE is every other v2 success example, which carries no
# `provider_retry` at all and stays valid: that is what makes contract-v1.45
# additive. Absence means "nothing to report, or a producer older than v1.45" —
# never `retried: false`, which this shape cannot even express.
