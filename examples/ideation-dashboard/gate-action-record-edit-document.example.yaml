# VALID gate-action record: a human edit-document action inside a BRANCH SESSION
# (add-workbench-branch-sessions task 1.3/D4/D13).
#   - action=edit-document names all three things the schema allOf requires:
#     target.document (the path rewritten INSIDE the session worktree),
#     target.ref (the session branch — a session record that does not name its
#     branch audits nothing), and a `commit`-kind artifact;
#   - the commit artifact's `reference` is this action's OWN STAMP, never a sha:
#     a commit cannot contain its own sha, so the referenced commit is the one
#     that INTRODUCED this record file on the branch
#     (`git log --diff-filter=A -- <record-path>`), which is the action's own
#     commit and, immediately after the action, the branch tip;
#   - the record rides that ONE commit together with the document it wrote, so
#     the audit trail falls out of version control rather than being re-invented;
#   - no redline artifact appears and none is produced — the main-resident
#     `edit-apply` redline path is untouched and stays the way a document on
#     `main` is edited (D5);
#   - `provenance` tags the GATEWAY (D23, Brett 2026-07-27): this action arrived
#     on the loopback HTTP console and its console-presence test was satisfied by
#     the per-serve console token. The block is OPTIONAL in the schema and
#     required by no conditional — the sibling `open-pr` and `abandon-session`
#     examples deliberately OMIT it to demonstrate that pre-growth records stay
#     valid — while the ROUTE always emits it, which is a route obligation
#     pinned by a codexFactory test rather than a schema one.
