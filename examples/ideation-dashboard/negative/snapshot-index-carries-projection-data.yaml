# INVALID ideation-dashboard snapshot index: the index carries PROJECTION data —
# a root-level `keyword_index` and an entry-level `documents`/`clusters` summary.
# Violates the validator rule snapshot-index-carries-projection-data (design D3):
# the index is a LOCATOR, not a projection. Document, cluster, possible,
# staged-topic, change, and keyword data belong to the snapshot each entry
# locates; carrying them here would duplicate the projection, let the two
# disagree, and make the cheap-to-fetch index as heavy as the snapshots it
# indexes.
schema_version: 1
kind: ideation-dashboard-snapshot-index
entries:
  - repository: openxFactory
    ref: main
    snapshot: openxFactory-snapshot.json
    source_revision: "9f2c1b7ad4e35608c1d90ab4477e2f6b0c8d15ae"
    # Projection data smuggled into a locator entry.
    documents:
      - id: doc-ideation-dashboard
        path: ideation/brainstorm/ideation-dashboard.md
    clusters:
      - id: cluster-workflow-visualization
# Projection data at the index root.
keyword_index:
  - keyword: ideation-dashboard
    doc_count: 12
