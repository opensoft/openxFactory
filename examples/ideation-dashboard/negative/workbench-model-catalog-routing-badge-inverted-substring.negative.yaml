# INVALID (routing-badge): THE ADVERSARIAL REVIEW'S OWN INSTANCE A, packaged.
# The rule's badge never states the on-tenant posture — it states the OPPOSITE,
# "non-tenant" — and the old substring predicate accepted it because
# `"on-tenant" in "non-tenant"` is True, so the menu showed the inverse of the
# posture it routes to. Segment membership refuses it: the rule's badge has one
# segment and it is not the target's.
