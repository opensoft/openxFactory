# reason" emits a record with the key silently dropped instead of failing closed,
# which is how a `full` posture and a reduction end up in the same object and
# only one of them survives to the wire.
#
# It is refused TWICE over by the shape, and deliberately so: once for the key
# being present on a full posture, and once for `minLength: 1`. The delegated
# validator refuses it a third time, on the pairing rule.
