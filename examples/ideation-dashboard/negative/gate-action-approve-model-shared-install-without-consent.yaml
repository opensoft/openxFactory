# INVALID gate-action record (contract-v1.45): an approval taken on a SHARED
# install with no consent instrument behind it.
#
# Brett's OQ-3 ruling of 2026-08-21 splits by install. A recorded gate action
# suffices on a single-operator loopback console — the human is spending their
# own subscription on their own corpus, and requiring a consent instrument there
# is ceremony without a second party. Where the model is enrolled on a tenant or
# shared install, or where a turn will process another party's material, a
# consent instrument is REQUIRED, and `consent_ref` is what names it.
#
# The rule is encoded on the record rather than left to the surface that writes
# one, because a surface can be reached by a path nobody reviewed and a schema
# cannot. Its converse is encoded too: a `single-operator` record that CARRIED a
# consent reference is equally invalid, because it would claim a second party
# that does not exist.
