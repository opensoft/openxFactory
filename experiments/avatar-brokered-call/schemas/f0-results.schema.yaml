$schema: https://json-schema.org/draft/2020-12/schema
$id: https://openxfactory.local/schemas/avatar-f0-results.schema.json
title: Avatar F0 Brokered Call Results
type: object
additionalProperties: false
required:
  - protocol_version
  - started_at
  - completed_at
  - environment
  - candidate
  - trial_groups
  - trials
  - metrics
  - assertions
  - redaction_scan
  - overall
  - report_sha256
properties:
  protocol_version:
    const: "1"
  started_at:
    type: string
    format: date-time
  completed_at:
    type: string
    format: date-time
  environment:
    type: object
    additionalProperties: false
    required: [lab_project_ref, runtime, dependency_versions, network_type, docs_retrieved_at]
    properties:
      lab_project_ref: {type: string, minLength: 1}
      runtime: {type: string, minLength: 1}
      dependency_versions:
        type: object
        additionalProperties: {type: string}
      network_type: {type: string, minLength: 1}
      region: {type: [string, "null"]}
      docs_retrieved_at: {type: string, format: date-time}
  candidate:
    type: object
    additionalProperties: false
    required: [requested_model, resolved_model, voice, interaction_mode, turn_detection]
    properties:
      requested_model: {const: gpt-realtime-2.1}
      resolved_model: {type: string, minLength: 1}
      voice: {const: marin}
      interaction_mode: {const: provider_vad}
      turn_detection:
        type: object
        additionalProperties: false
        required: [type, threshold, prefix_padding_ms, silence_duration_ms, create_response, interrupt_response]
        properties:
          type: {const: server_vad}
          threshold: {const: 0.5}
          prefix_padding_ms: {const: 300}
          silence_duration_ms: {const: 500}
          create_response: {const: true}
          interrupt_response: {const: true}
  trial_groups:
    type: array
    minItems: 6
    maxItems: 6
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, planned, completed, passed, failed]
      properties:
        id: {enum: [F0-A, F0-B, F0-C, F0-D, F0-E, F0-F]}
        planned: {type: integer, minimum: 10}
        completed: {type: integer, minimum: 0}
        passed: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
    allOf:
      - contains:
          type: object
          required: [id, planned]
          properties: {id: {const: F0-A}, planned: {const: 20}}
        minContains: 1
        maxContains: 1
      - contains:
          type: object
          required: [id, planned]
          properties: {id: {const: F0-B}, planned: {const: 10}}
        minContains: 1
        maxContains: 1
      - contains:
          type: object
          required: [id, planned]
          properties: {id: {const: F0-C}, planned: {const: 10}}
        minContains: 1
        maxContains: 1
      - contains:
          type: object
          required: [id, planned]
          properties: {id: {const: F0-D}, planned: {const: 10}}
        minContains: 1
        maxContains: 1
      - contains:
          type: object
          required: [id, planned]
          properties: {id: {const: F0-E}, planned: {const: 10}}
        minContains: 1
        maxContains: 1
      - contains:
          type: object
          required: [id, planned]
          properties: {id: {const: F0-F}, planned: {const: 10}}
        minContains: 1
        maxContains: 1
  trials:
    type: array
    minItems: 70
    maxItems: 70
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [trial_id, group_id, status, provider_request_id_hash, durations_ms, assertion_ids]
      properties:
        trial_id: {type: string, pattern: "^F0-[A-F]-[0-9]{2}$"}
        group_id: {enum: [F0-A, F0-B, F0-C, F0-D, F0-E, F0-F]}
        status: {enum: [PASS, FAIL, INCONCLUSIVE]}
        provider_request_id_hash: {type: [string, "null"], pattern: "^[a-f0-9]{64}$"}
        durations_ms:
          type: object
          additionalProperties: {type: number, minimum: 0}
        assertion_ids:
          type: array
          minItems: 1
          items: {type: string, pattern: "^F0-[A-F]-[A-Z0-9_-]+$"}
        note: {type: string}
  metrics:
    type: object
    additionalProperties: false
    required: [sideband_ready_ms, first_playable_after_authorized_ms, hangup_to_terminal_ms]
    properties:
      sideband_ready_ms: {$ref: "#/$defs/duration_summary"}
      first_playable_after_authorized_ms: {$ref: "#/$defs/duration_summary"}
      hangup_to_terminal_ms: {$ref: "#/$defs/duration_summary"}
  assertions:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, status, passed_trials, failed_trials]
      properties:
        id: {type: string, pattern: "^F0-[A-F]-[A-Z0-9_-]+$"}
        status: {enum: [PASS, FAIL, INCONCLUSIVE]}
        passed_trials: {type: integer, minimum: 0}
        failed_trials: {type: integer, minimum: 0}
        note: {type: string}
  redaction_scan:
    type: object
    additionalProperties: false
    required: [status, prohibited_findings]
    properties:
      status: {enum: [PASS, FAIL, INCONCLUSIVE]}
      prohibited_findings: {type: integer, minimum: 0}
  overall:
    enum: [PASS, FAIL, INCONCLUSIVE]
  report_sha256:
    type: string
    pattern: "^[a-f0-9]{64}$"
allOf:
  - if:
      required: [overall]
      properties:
        overall: {const: PASS}
    then:
      properties:
        trial_groups:
          allOf:
            - contains:
                required: [id, completed, passed, failed]
                properties: {id: {const: F0-A}, completed: {const: 20}, passed: {const: 20}, failed: {const: 0}}
              minContains: 1
              maxContains: 1
            - contains:
                required: [id, completed, passed, failed]
                properties: {id: {const: F0-B}, completed: {const: 10}, passed: {const: 10}, failed: {const: 0}}
              minContains: 1
              maxContains: 1
            - contains:
                required: [id, completed, passed, failed]
                properties: {id: {const: F0-C}, completed: {const: 10}, passed: {const: 10}, failed: {const: 0}}
              minContains: 1
              maxContains: 1
            - contains:
                required: [id, completed, passed, failed]
                properties: {id: {const: F0-D}, completed: {const: 10}, passed: {const: 10}, failed: {const: 0}}
              minContains: 1
              maxContains: 1
            - contains:
                required: [id, completed, passed, failed]
                properties: {id: {const: F0-E}, completed: {const: 10}, passed: {const: 10}, failed: {const: 0}}
              minContains: 1
              maxContains: 1
            - contains:
                required: [id, completed, passed, failed]
                properties: {id: {const: F0-F}, completed: {const: 10}, passed: {const: 10}, failed: {const: 0}}
              minContains: 1
              maxContains: 1
        trials:
          items:
            properties:
              status: {const: PASS}
          allOf:
            - contains: {required: [group_id], properties: {group_id: {const: F0-A}}}
              minContains: 20
              maxContains: 20
            - contains: {required: [group_id], properties: {group_id: {const: F0-B}}}
              minContains: 10
              maxContains: 10
            - contains: {required: [group_id], properties: {group_id: {const: F0-C}}}
              minContains: 10
              maxContains: 10
            - contains: {required: [group_id], properties: {group_id: {const: F0-D}}}
              minContains: 10
              maxContains: 10
            - contains: {required: [group_id], properties: {group_id: {const: F0-E}}}
              minContains: 10
              maxContains: 10
            - contains: {required: [group_id], properties: {group_id: {const: F0-F}}}
              minContains: 10
              maxContains: 10
        metrics:
          properties:
            sideband_ready_ms:
              properties:
                p95: {maximum: 3000}
                max: {maximum: 5000}
            first_playable_after_authorized_ms:
              properties:
                p95: {maximum: 2000}
            hangup_to_terminal_ms:
              properties:
                max: {maximum: 5000}
        assertions:
          items:
            properties:
              status: {const: PASS}
              failed_trials: {const: 0}
        redaction_scan:
          properties:
            status: {const: PASS}
            prohibited_findings: {const: 0}
$defs:
  duration_summary:
    type: object
    additionalProperties: false
    required: [count, p50, p95, max]
    properties:
      count: {type: integer, minimum: 0}
      p50: {type: number, minimum: 0}
      p95: {type: number, minimum: 0}
      max: {type: number, minimum: 0}
