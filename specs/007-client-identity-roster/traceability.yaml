schema_version: 1
kind: openxfactory_realization_traceability
feature: 007-client-identity-roster
ratified_change: add-client-identity-roster
capabilities:
  - client-identity-roster
  - consent-instrument
  - doc-health
  - domain-conformance-checks
  - credential-contracts

# One row per ratified FR and per ratified SC. The SC rows EXTEND the 006
# shape, which carries requirement rows only: this feature's success criteria
# are measurements in their own right (a run, a count, a boundary), and a
# criterion with no recorded measurement is the thing this file exists to make
# impossible.
#
# `enforced_by` names the validator rule, test or command that actually holds
# the requirement — the 006 field name, not a renamed one.
# `negative_confirmation` names the probe that proves the check is
# load-bearing, or says `n/a` WITH A REASON where the criterion is
# positive-only.
# `red_proven` is 006's own sense: SUPPRESSING the rule's finding code turns
# the packaged corpus RED, which is what proves the probe fails FOR ITS OWN
# REASON rather than incidentally (FR-018's standard).
#
# REPRODUCTION — no new script (task 10.1 forbids one): task 2.2's
# break-one-negative procedure, which ships as
# `tests/client-identity-roster/test_client_identity_roster.py`'s five
# failure-mode tests (`test_failure_mode_a…e`). The suppression sweep run at
# Phase 10 loaded the validator module 31 times, neutered ONE registered
# finding code per load by dropping it in `Findings.error`, and ran
# `self_test()`:
#   CONTROL (nothing suppressed) — 0 errors, GREEN.
#   31 of 31 registered codes — self-test RED when suppressed.
# Every `red_proven` value below is a line of that recorded sweep, not a claim
# made at authoring time. The self-test's own gate is what turns red: a
# neutered rule makes its registered negative PASS, which is failure mode (c).
red_proof_sweep:
  run_at: 2026-08-15
  control: "self_test() with nothing suppressed — 0 error(s), GREEN"
  codes_registered: 31
  codes_that_turn_the_corpus_red_when_suppressed: 31
  procedure: >-
    task 2.2's break-one-negative procedure, shipped as the five
    `test_failure_mode_*` tests; the sweep applies it to every registered code
    in turn rather than to one sample.

requirements:

  FR-001:
    statement: >-
      A canonical schema `contracts/schemas/xfactory-client-identity-roster.schema.yaml`
      carrying `schema_version` and `kind` describes a per-client, per-domain
      roster fragment and its entries.
    artifact: contracts/schemas/xfactory-client-identity-roster.schema.yaml
    enforced_by: >-
      validate_client_identity_roster.validate_document (Draft 2020-12 schema
      layer); tests/client-identity-roster::test_entry_field_list_matches_the_ratified_one,
      ::test_fragment_field_list_matches_the_ratified_one,
      ::test_every_non_optional_entry_field_is_required
    negative_confirmation: >-
      the field-list tests are themselves the negative: they compare the
      schema's REQUIRED set against the ratified enumeration, so a dropped or
      quietly-optional field fails them. Every packaged negative also rides
      this layer.
    red_proven: >-
      the `schema` code is the layer's own; the three field-list tests fail
      when a ratified field is removed from `required` (measured while
      authoring 1.4/1.5, which is why they exist as tests rather than as a
      description).

  FR-002:
    statement: >-
      `admission` is a LIST whose members each declare surface, act, achieved
      scope, enforcement mode, evidence reference and verification time; a
      record cannot express admission as a single act.
    artifact: contracts/schemas/xfactory-client-identity-roster.schema.yaml
    enforced_by: validate_client_identity_roster.check_admission
    negative_confirmation: >-
      examples/client-identity-roster/negative/scope-exceeds-unit-undeclared.yaml,
      examples/client-identity-roster/negative/unverified-act-counted-as-access.yaml
    red_proven: >-
      undeclared-scope-excess and unverified-act-counted-as-access neutered in
      turn; the packaged corpus went RED each time.

  FR-003:
    statement: >-
      Provider consent alone is not recordable as access; an unverified
      admission act is excluded from effective reach, and effective reach is
      the UNION of verified acts.
    artifact: contracts/schemas/xfactory-client-identity-roster.schema.yaml
    enforced_by: >-
      validate_client_identity_roster.check_admission (the union is computed
      over verified acts only; `act_is_verified` is the predicate)
    negative_confirmation: >-
      examples/client-identity-roster/negative/consent-recorded-as-access.yaml,
      examples/client-identity-roster/negative/unverified-act-counted-as-access.yaml
    red_proven: >-
      consent-recorded-as-access and unverified-act-counted-as-access neutered
      in turn; corpus RED each time. The pinned detail on the second probe is
      "verified_at with NO evidence_ref", so the file cannot pass by carrying
      an independently asserted flag.

  FR-004:
    statement: >-
      `granted_permissions[]` in provider-native identifiers is required on
      every entry and `authority_class_achieved` is checkable against it,
      RECORD-INTERNALLY.
    artifact: contracts/schemas/xfactory-client-identity-roster.schema.yaml
    enforced_by: validate_client_identity_roster.check_authority
    negative_confirmation: >-
      examples/client-identity-roster/negative/achieved-class-contradicted-by-permissions.yaml
    red_proven: >-
      achieved-class-contradicts-permissions neutered; corpus RED. The probe's
      pinned detail names the maximum class the permissions DECLARE, so the
      file cannot pass by an inference the validator does not make.

  FR-005:
    statement: >-
      The authority-class enumeration is CLOSED to `observe` and `mutate`; a
      destructive class is unrepresentable.
    artifact: contracts/schemas/xfactory-client-identity-roster.schema.yaml
    enforced_by: validate_client_identity_roster.check_vocabularies (_closed, authority_class)
    negative_confirmation: >-
      examples/client-identity-roster/negative/destructive-authority-class.yaml
    red_proven: >-
      destructive-authority-class neutered; corpus RED. The pinned detail
      requires the refusal to name the closed vocabulary, not merely to refuse.

  FR-006:
    statement: >-
      Uniqueness is keyed on the tuple (owning domain, admission surface,
      authority class, blast-radius unit, duty); a per-unit or duty-separated
      identity is never a finding.
    artifact: contracts/schemas/xfactory-client-identity-roster.schema.yaml
    enforced_by: >-
      validate_client_identity_roster.check_uniqueness_and_alias;
      tests/client-identity-roster::test_fixture_1_uniqueness_is_scoped_within_a_fragment
    negative_confirmation: >-
      examples/client-identity-roster/negative/full-tuple-duplicate.yaml
      (positive side: repo fixture 1 carries two fragments whose entries share
      the WHOLE tuple across fragments and must NOT be reported)
    red_proven: >-
      duplicate-identity-key neutered; corpus RED. The pinned detail spells out
      all five tuple elements, so a refusal that named fewer would fail the
      detail check rather than pass.

  FR-007:
    statement: >-
      `admission_surface` is a CLOSED vocabulary of exactly `business_central`
      and `exchange` in this release; any other value is refused naming the
      extension route.
    artifact: contracts/schemas/xfactory-client-identity-roster.schema.yaml
    enforced_by: validate_client_identity_roster.check_vocabularies (_closed, admission_surface)
    negative_confirmation: >-
      examples/client-identity-roster/negative/admission-surface-out-of-vocabulary.yaml
    red_proven: >-
      admission-surface-out-of-vocabulary neutered; corpus RED. Detail pinned to
      "admission_surface is 'sharepoint', which is not a member of the closed
      admission_surface vocabulary" — the SET is named, so the same code firing
      on a different field would not satisfy the probe.

  FR-008:
    statement: >-
      Each entry declares, per admission surface and as a MAPPING, whether a
      principal scoped to the governed blast-radius unit is available —
      answering for its own surface and for every spanned surface.
    artifact: contracts/schemas/xfactory-client-identity-roster.schema.yaml
    enforced_by: validate_client_identity_roster.check_authority
    negative_confirmation: >-
      examples/client-identity-roster/negative/per-unit-principal-undeclared.yaml,
      examples/client-identity-roster/negative/per-unit-principal-available-but-logical.yaml,
      examples/client-identity-roster/negative/provider-enforced-without-per-unit-principal.yaml
    red_proven: >-
      per-unit-principal-undeclared, per-unit-principal-available-but-logical
      and provider-enforced-without-per-unit-principal neutered in turn; corpus
      RED each time. The three share a subject, so each carries a pinned detail
      that names its own arm and they cannot be confused for one another.

  FR-009:
    statement: >-
      Provider-forced breadth — spanned surfaces, or an achieved class above
      the intended one — is DECLARABLE with the provider reason and a gate
      obligation, and is conformant when so declared.
    artifact: contracts/schemas/xfactory-client-identity-roster.schema.yaml
    enforced_by: validate_client_identity_roster.check_authority
    negative_confirmation: >-
      examples/client-identity-roster/negative/undeclared-reach.yaml,
      examples/client-identity-roster/negative/undeclared-act-surface.yaml
      (positive side: tests/client-identity-roster/fixtures/multi-surface-reader-representability.yaml,
      which validates CLEAN with the breadth declared)
    red_proven: >-
      undeclared-reach and undeclared-act-surface neutered in turn; corpus RED
      each time. The positive half is separately discriminated by
      ::test_multi_surface_fixture_is_refused_without_its_declaration, which
      removes `spanned_surfaces[]` and nothing else and gets BOTH codes back —
      two independent rules over the same evidence.

  FR-010:
    statement: >-
      Where achieved authority exceeds intended authority, the entry declares
      the excess with the reason, the bounding mechanism, the gate obligation
      and the enforcement-test reference; a name that understates achieved
      authority is a finding, cured by a covering `declared_excess`.
    artifact: contracts/schemas/xfactory-client-identity-roster.schema.yaml
    enforced_by: validate_client_identity_roster.check_authority
    negative_confirmation: >-
      examples/client-identity-roster/negative/achieved-exceeds-intended-undeclared.yaml,
      examples/client-identity-roster/negative/name-understates-achieved-authority.yaml,
      examples/client-identity-roster/negative/scope-exceeds-unit-undeclared.yaml
    red_proven: >-
      achieved-exceeds-intended-undeclared, name-understates-achieved-authority
      and undeclared-scope-excess neutered in turn; corpus RED each time. Gate
      ruling G6 sharpened the name probe so it fails for its OWN reason:
      intended equals achieved, so there is no excess to declare and no cure,
      and the name code fires ALONE rather than masked by the excess code.

  FR-011:
    statement: >-
      Every gate obligation resolves to an existing gate in the owning domain's
      governed workflow records and names a test proving refusal of a target
      outside the governed blast-radius unit.
    artifact: scripts/validate-client-identity-roster.py
    enforced_by: >-
      validate_client_identity_roster.check_repo_context
      (unresolvable-gate-obligation) and .check_authority
      (missing-enforcement-test)
    negative_confirmation: >-
      examples/client-identity-roster/negative/missing-enforcement-test.yaml
      (record-internal) and repo fixture 4 in
      tests/client-identity-roster::test_fixture_4_unresolvable_gate_obligation_exits_nonzero
      (repo-shaped: the named gate is absent while the repo carries a REAL
      gate, so the finding proves non-resolution rather than an empty tree)
    red_proven: >-
      missing-enforcement-test neutered; corpus RED. The resolution half is
      repo-shaped and cannot live in the packaged corpus at all: fixture 4
      asserts the nonzero EXIT, which a packaged file cannot produce.

  FR-012:
    statement: >-
      Each entry declares `identity_kind`, `home_tenant`,
      `principal_locations[]` and a `residency_model`, with
      `vendor_tenant_multi` carrying its five obligations.
    artifact: contracts/schemas/xfactory-client-identity-roster.schema.yaml
    enforced_by: validate_client_identity_roster.check_residency
    negative_confirmation: >-
      examples/client-identity-roster/negative/vendor-homed-declared-client-resident.yaml,
      examples/client-identity-roster/negative/vendor-tenant-multi-missing-obligations.yaml
    red_proven: >-
      vendor-homed-declared-client-resident and
      vendor-tenant-multi-missing-obligations neutered in turn; corpus RED each
      time. Gate ruling G2 pins the first probe's detail to the literal
      `home_tenant` value, so a record that would pass the REJECTED containment
      reading cannot pass this one.

  FR-013:
    statement: >-
      Each entry carries `lifecycle_state` of `planned`, `enrolled` or
      `retired` and a standing-credential attestation whose falsification is
      record-internal.
    artifact: contracts/schemas/xfactory-client-identity-roster.schema.yaml
    enforced_by: >-
      validate_client_identity_roster.check_attestation and
      .check_vocabularies (_closed, lifecycle_state)
    negative_confirmation: >-
      examples/client-identity-roster/negative/false-standing-credential-attestation.yaml,
      examples/client-identity-roster/negative/lifecycle-state-out-of-vocabulary.yaml
      (positive side: the `planned` entry in
      examples/client-identity-roster/client-identity-roster-farheap-opsx.example.yaml)
    red_proven: >-
      false-standing-credential-attestation and lifecycle-state-out-of-vocabulary
      neutered in turn; corpus RED each time. Three failure shapes share the
      attestation code, so the probe pins "The record contradicts itself" — the
      one this file encodes.

  FR-014:
    statement: >-
      Each entry names the domain-qualified ratified capability that justifies
      the identity and the consent instrument that authorizes it, with the
      citation RESOLVING to an instrument record that is in force.
    artifact: scripts/validate-client-identity-roster.py
    enforced_by: >-
      validate_client_identity_roster.check_roots (presence) and
      .check_repo_context (unresolvable-consent-citation,
      consent-instrument-not-in-force)
    negative_confirmation: >-
      examples/client-identity-roster/negative/entry-without-consent-instrument.yaml
      (absence); repo fixture 6 (citation resolves to nothing) and repo fixture
      8 (citation RESOLVES to a terminated instrument cited by a non-retired
      entry — a different code from fixture 6's, so each fails for its own
      reason); positive side: repo fixture 1's `retired` entry citing an ended
      instrument, which is the ratified exemption and must stay clean
    red_proven: >-
      entry-without-consent-instrument neutered; corpus RED. The two resolution
      arms are repo-shaped and are asserted as EXITS by fixtures 6 and 8, each
      additionally asserting that the OTHER arm's code did not fire.

  FR-015:
    statement: >-
      A single canonical validator `scripts/validate-client-identity-roster.py`
      enforces every intra-repo rule.
    artifact: scripts/validate-client-identity-roster.py
    enforced_by: >-
      the validator itself; `python3 scripts/validate-client-identity-roster.py <repo>`
      exits 0/1/2 and self-tests the packaged corpus before it scans anything
    negative_confirmation: >-
      tests/client-identity-roster::test_every_fr016_named_rule_has_a_negative_confirmation
      — a rule with no probe fails the suite
    red_proven: >-
      all 31 registered codes neutered in turn; corpus RED 31/31. That sweep IS
      the measurement that every rule this validator claims is load-bearing.

  FR-016:
    statement: >-
      The fixture corpus carries one positive roster and one NEGATIVE
      CONFIRMATION per rule — sixteen named rules, all homed.
    artifact: examples/client-identity-roster/negative/
    enforced_by: >-
      validate_client_identity_roster.self_test (failure modes
      negative-missing, negative-unregistered, negative-should-fail,
      negative-wrong-reason, negative-detail-mismatch);
      tests/client-identity-roster::test_every_fr016_named_rule_has_a_negative_confirmation
    negative_confirmation: >-
      the five failure-mode tests
      (tests/client-identity-roster::test_failure_mode_a…e) break the corpus
      one way each and assert the self-test refuses
    red_proven: >-
      16 named rules, 16 homed, 0 unhomed (13 packaged, 2 repo-shaped, 1 in the
      doc-health corpus); 31 packaged negatives on disk, 31 registered, and all
      31 red-proven by suppression.

  FR-017:
    statement: >-
      The corpus carries POSITIVE regression fixtures that keep the two killed
      flaws killed: a genuine per-unit pair, a genuine duty pair, a declared
      provider-forced multi-surface reader, and a `planned` entry, each
      validating clean.
    artifact: >-
      examples/client-identity-roster/client-identity-roster-farheap-ledgerx.example.yaml,
      examples/client-identity-roster/client-identity-roster-farheap-opsx.example.yaml,
      tests/client-identity-roster/fixtures/multi-surface-reader-representability.yaml
    enforced_by: >-
      tests/client-identity-roster::test_discrimination_per_unit_and_duty_pairs_pass_while_the_alias_pair_is_refused,
      ::test_multi_surface_representability_fixture_validates_clean,
      ::test_multi_surface_fixture_declares_itself_synthetic
    negative_confirmation: >-
      examples/client-identity-roster/negative/alias-pair-observationally-identical.yaml
      — the near-miss that differs from a genuine pair only by having nothing
      that distinguishes it
    red_proven: >-
      alias-pair-observationally-identical neutered; corpus RED. The
      discrimination is asserted as ONE test producing THREE verdicts, so a
      rule broad enough to catch all three cannot pass. Decision C (Brett,
      2026-08-15) relocated the multi-surface reader from a packaged example to
      a SYNTHETIC fixture with a dated header, after task 0.1's provider
      precondition was FALSIFIED; its zero-findings obligation is unchanged and
      is reached by the Phase 10 measurement.

  FR-018:
    statement: >-
      The validator refuses a negative that validates cleanly, a negative that
      fails for the wrong reason, and a corpus where a registered probe has no
      file or a file has no registration.
    artifact: scripts/validate-client-identity-roster.py
    enforced_by: validate_client_identity_roster.self_test
    negative_confirmation: >-
      tests/client-identity-roster::test_failure_mode_a_registered_probe_with_no_file,
      ::test_failure_mode_b_file_with_no_registration,
      ::test_failure_mode_c_a_negative_that_passes,
      ::test_failure_mode_d_a_negative_that_fails_for_the_wrong_reason,
      ::test_failure_mode_e_the_code_fires_without_its_pinned_detail
    red_proven: >-
      ::test_sandbox_is_green_before_anything_is_broken establishes the control
      (the sandbox corpus passes) and each failure-mode test then breaks
      exactly one thing and asserts refusal — the same discipline the 31-code
      suppression sweep applies to the rules themselves.

  FR-019:
    statement: >-
      The feature packages instantiable examples under
      `examples/client-identity-roster/` with a `negative/` subdirectory and a
      README, covering the Business Central two-admission-act worked case, a
      duty-separated pair and a `planned` entry, for a client held by two
      domains.
    artifact: examples/client-identity-roster/
    enforced_by: >-
      validate_client_identity_roster.self_test (every `*.example.yaml`
      validates CLEAN before any scan)
    negative_confirmation: >-
      the `negative/` subdirectory itself — 31 files, each refused for its
      registered reason in the same self-test
    red_proven: >-
      4 example YAMLs + README + 31 negatives, counted on disk and against the
      registration table in both directions
      (::test_every_negative_on_disk_is_registered_and_every_registration_has_a_file).
      RESIDUAL, recorded rather than smoothed over: the ratified FOURTH
      packaged case (a provider-forced multi-surface reader) is NOT packaged —
      Decision C relocated it to a synthetic fixture because task 0.1 proved no
      such provider fact is citable in the estate, and a packaged example may
      not assert an uncitable provider fact.

  FR-020:
    statement: >-
      The contract declares the placement of a domain's roster fragments as
      `credentials/client-identity-roster/<client_ref>.yaml`, one file per
      (client, domain) pair, inside the tree
      `scripts/validate-credential-contracts.py` already scans.
    artifact: contracts/schemas/xfactory-client-identity-roster.schema.yaml
    enforced_by: >-
      the schema description (the DECLARATION) plus
      validate_client_identity_roster.repo_scan (the ENFORCEMENT) and the
      `client-identity-roster` row's `consumption_rule` in
      contracts/manifest.yaml, which states the same two facts
    negative_confirmation: >-
      repo fixtures 5 and 7 (misplaced outside `credentials/`, and NESTED
      inside the declared directory)
    red_proven: >-
      misplaced-roster-instance is asserted by two repo fixtures rather than
      one, because fixture 7 is the harder case a directory-prefix reading of
      FR-036 would have let through. The blessed skip-with-notice half is
      stated in BOTH the schema description and the manifest
      `consumption_rule`, which is task 1.10's closing condition.

  FR-021:
    statement: >-
      The schema is registered in `contracts/manifest.yaml` with the full row
      shape, carries a `contracts/CHANGELOG.md` entry, and bumps the bundle to
      `contract-v1.32` with the matching release digest inventory, such that
      digest verification passes.
    artifact: >-
      contracts/manifest.yaml, contracts/CHANGELOG.md, contracts/README.md,
      contracts/releases/contract-v1.32.digests.yaml
    enforced_by: >-
      `python3 scripts/validate-manifest-digests.py` and
      `python3 scripts/validate-contract-release.py verify-commit --commit HEAD`
    negative_confirmation: >-
      the digest checkers fail CLOSED — a stale row or a stale inventory entry
      is an error, which is the defect (a manifest row stale since 403c2b5)
      that caused validate-manifest-digests.py to be written at all
    red_proven: >-
      MEASURED, and the honest measure is stated rather than rounded up:
      validate-manifest-digests.py goes from 132 digests checked at `ae3f5c8`
      to 134 at `contract-v1.32`, with the failure set BYTE-IDENTICAL before and
      after — one PRE-EXISTING unrelated mismatch on
      contracts/omnigent/omnigent-domain-overlay.schema.yaml, proven
      pre-existing by recomputing the same manifest against the same blobs at
      `ae3f5c8`. Every row this change touches verifies; the release verifier
      passes over the realized commit. "FR-021 exit 0" therefore reads as ZERO
      NEW, ZERO CHANGED findings over this checkout.

  FR-022:
    statement: >-
      Intra-repo entry conformance is BLOCKING through PACK MEMBERSHIP —
      `scripts/validate-client-identity-roster.py` joins the
      `domain-conformance-checks` pack as its fourth member.
    artifact: tests/conformance-gate/test_conformance_checks.py
    enforced_by: >-
      tests/conformance-gate/test_conformance_checks.py, which loads the roster
      validator alongside the three `check-*` modules and exercises the four
      pack behaviours (entry nonconformance -> nonzero; conformant repo -> 0;
      no fragment -> 0 with an explicit notice; `mutate` with no ratified
      capability -> ERROR not report)
    negative_confirmation: >-
      the pack tests' own nonconformance arms; repo fixture 2
      (mutate-without-ratified-capability -> nonzero EXIT)
    red_proven: >-
      mutate-without-ratified-capability neutered; corpus RED. The 15 existing
      pack tests pass UNMODIFIED (13 passed + 2 skipped at baseline; 17 passed +
      2 skipped after, i.e. exactly the four new ones added).
    residual: >-
      RULING A-N2, carried here so it is not silently dropped. Pack blocking is
      NOMINAL at archive. codexFactory's gate enumerates the pack's three
      members BY NAME, and OpsxFactory's gate invokes no canonical check at all,
      so joining the pack CONFERS blocking status without yet FIRING in either
      domain gate. Domain-gate wiring is a NAMED FOLLOW-UP, out of scope by
      FR-030/SC-012 because it is a domain-repository edit. The claim this
      feature makes is exactly SC-006's, no wider.

  FR-023:
    statement: >-
      Cross-domain composition lands as a sixteenth deterministic doc-health
      family `client-identity-composition`, registered in `FAMILIES` and
      `FAMILY_IDS`, with EACH FINDING carrying its own resolution class rather
      than a blanket family entry.
    artifact: scripts/doc_health/client_identity_composition.py
    enforced_by: >-
      scripts/doc_health/families.py registration;
      tests/doc-health/test_client_identity_composition.py
    negative_confirmation: >-
      tests/doc-health/fixtures/client-identity-composition/ — the four fixture
      repos (alpha, beta, gamma, delta) carrying shared, separate, spanning and
      object-level cases
    red_proven: >-
      the family's findings are asserted per fixture repo in
      tests/doc-health/test_client_identity_composition.py; the suite goes from
      621 passed + 7 skipped at baseline to 642 + 7, i.e. 21 added and ZERO
      pre-existing tests changed or removed.

  FR-024:
    statement: >-
      Two domains each holding their own SEPARATE identity on one admission
      surface and authority class in one client tenant is NOT a finding at any
      level.
    artifact: scripts/doc_health/client_identity_composition.py
    enforced_by: >-
      the family's `_shared_material` predicate — sharing is keyed on shared
      MATERIAL (a shared principal or a shared provider object), never on
      co-presence
    negative_confirmation: >-
      the `client-separate.yaml` fragments in the alpha and beta fixture repos:
      two domains, one surface, one class, one tenant, SEPARATE identities —
      asserted to produce NO finding
    red_proven: >-
      this is the doc-health half of the killed per-unit flaw: a rule keyed on
      co-presence would report the separate case, and the fixture asserts it
      does not. Its discrimination partner is `client-shared.yaml`, which DOES
      report.

  FR-025:
    statement: >-
      The implementation's family set agrees with the RATIFIED DELTA wording
      ("sixteen check families"), not with the promoted spec text, which the
      archive step rewrites after this feature lands.
    artifact: scripts/doc_health/families.py
