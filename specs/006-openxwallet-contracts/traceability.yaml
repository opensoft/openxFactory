schema_version: 1
kind: openxfactory_realization_traceability
feature: 006-openxwallet-contracts
ratified_change: add-openxwallet
capabilities:
  - openxwallet
  - openxwallet-agent-profile

# One row per ratified requirement. `negative_confirmation` names the recorded
# probe; `red_proven` records that suppressing the rule's finding code turns
# the packaged corpus red, which is what proves the probe fails FOR ITS OWN
# REASON rather than incidentally. Reproduce with:
#   python3 specs/006-openxwallet-contracts/evidence/red-proof.py

requirements:
  OXW-R1:
    statement: A wallet is a key, never a record of a key
    artifact: contracts/openxwallet/openxwallet-record.schema.yaml
    enforced_by: validate_openxwallet.check_no_key_material
    negative_confirmation: >-
      examples/negative/wallet-carries-key-material.yaml,
      examples/negative/wallet-carries-jwk-private-exponent.yaml
    red_proven: >-
      key-material-embedded neutered; corpus went red. The probe pins the
      VALUE scan specifically (a PEM block in a legitimate string field),
      because the property-name half is already structurally impossible —
      every object in the family closes additionalProperties.

  OXW-R2:
    statement: Authority travels as attenuated grants, never as keys
    artifact: contracts/openxwallet/openxwallet-grant.schema.yaml
    enforced_by: validate_openxwallet.check_grant (attenuation)
    negative_confirmation: >-
      examples/negative/grant-derived-wider-than-parent.yaml,
      examples/negative/grant-derived-waives-parent-approval.yaml
    red_proven: attenuation-widened neutered; corpus went red

  OXW-R3:
    statement: Use requires proof of possession, not presentation
    artifact: contracts/openxwallet/openxwallet-grant-exercise.schema.yaml
    enforced_by: validate_openxwallet.check_exercise (rules i, j)
    negative_confirmation: >-
      examples/negative/exercise-permitted-without-proof-of-possession.yaml,
      examples/negative/exercise-refusal-names-the-wrong-absence.yaml,
      examples/negative/exercise-verification-failure-as-unauthenticated.yaml,
      examples/negative/exercise-permitted-on-unverified-proof.yaml,
      examples/negative/exercise-by-a-wallet-the-grant-does-not-address.yaml,
      examples/negative/exercise-presenting-key-of-another-wallet.yaml,
      examples/negative/exercise-presenting-key-unknown-to-the-corpus.yaml,
      examples/negative/exercise-verified-proof-names-no-key.yaml
    red_proven: >-
      proof-of-possession-missing and verification-failure-miscategorised
      neutered in turn; corpus went red each time. Three probes because the
      requirement carries three distinct clauses — presentation is
      insufficient, the refusal names the missing PROOF rather than a missing
      grant, and a verification failure stays distinguishable from an
      unauthenticated request.

  OXW-R4:
    statement: Custody is declared and bounds what a signature evidences
    artifact: contracts/openxwallet/openxwallet-custody.registry.yaml
    enforced_by: >-
      validate_openxwallet.check_custody_registry (rules b, c, d) and
      check_grant (rule e)
    negative_confirmation: >-
      examples/negative/grant-exceeds-custody-ceiling.yaml,
      examples/negative/custody-registry-readable-claims-holder.yaml,
      examples/negative/custody-registry-unearned-ceiling.yaml,
      examples/negative/custody-registry-collapsed-ceilings.yaml,
      examples/negative/custody-registry-renamed-top-tier.yaml,
      examples/negative/custody-registry-environment-outranks-holder.yaml,
      examples/negative/wallet-custody-outside-the-closed-set.yaml
    red_proven: >-
      custody-ceiling-exceeded, custody-evidences-derivation,
      custody-ceiling-unearned and custody-collapse neutered in turn; corpus
      went red each time. FIVE probes because this is the ruling's sharp edge:
      the enumeration can fail by claiming the wrong evidence, by granting an
      unearned ceiling, by distinguishing the two cases in NAME while
      collapsing them in EFFECT, or by RENAMING the top tier so the
      unearned-ceiling rule stops matching. The last was found by attacking
      the validator rather than reading it — rule (c) originally compared
      against the literal id `act_unsupervised`, so a registry free to name
      its own tiers slipped an environment-evidencing model into the top tier
      and validated cleanly. Rule (c) now keys on the top RANK.

  OXW-R5:
    statement: Every exercise is key-attributed
    artifact: contracts/openxwallet/openxwallet-grant-exercise.schema.yaml
    enforced_by: validate_openxwallet.check_exercise (rule k)
    negative_confirmation: >-
      examples/negative/wallet-record-duplicating-another-wallet-id.yaml,
      examples/negative/exercise-shared-credential-as-actor.yaml,
      examples/negative/exercise-attributed-to-a-wallet-not-presenting-its-key.yaml,
      examples/negative/exercise-proof-and-attribution-name-different-keys.yaml,
      examples/negative/exercise-verified-key-recorded-unattributed.yaml
    red_proven: >-
      attribution-laundered and record-id-duplicate neutered in turn; corpus
      went red each time. The shared-credential probe is the measured
      2026-08-06 state written down as a record — one application user
      carrying every agent act — and its honest counterpart is the positive
      example exercise-unattributable-act.example.yaml. Three probes cover
      the laundering shapes (the declared stand-in, the contradicted proof,
      the verified key recorded 'unattributed'), and the duplicate-wallet
      probe covers the index itself: a second record under an existing
      wallet_id would let a different key authenticate as it.

  OXW-R6:
    statement: Revocation propagates through the chain
    artifact: contracts/openxwallet/openxwallet-grant.schema.yaml
    enforced_by: validate_openxwallet.check_exercise (rule l, _revoked_ancestor)
    negative_confirmation: examples/negative/exercise-against-revoked-parent.yaml
    red_proven: >-
      revoked-chain-exercised neutered; corpus went red. The probe's grant
      reads state active on its own face and resolves to a revoked parent,
      which is exactly the case a check performed at issuance would miss.

  OXW-R7:
    statement: Distinct-holder constraints are expressible
    artifact: contracts/openxwallet/openxwallet-distinct-holder-constraint.schema.yaml
    enforced_by: validate_openxwallet.check_exercise (rule m)
    negative_confirmation: >-
      examples/negative/exercise-one-holder-satisfies-constraint.yaml,
      examples/negative/exercise-omits-a-declared-constraint.yaml
    red_proven: >-
      distinct-holder-violated neutered; corpus went red. The opt-in half is
      asserted by the positive corpus instead: exercises declaring no
      evaluation validate, and no default distinctness is inferred.

  OXW-R8:
    statement: The capability is an authority control, never an identity substrate
    artifact: contracts/openxwallet/openxwallet-subject-attestation.schema.yaml
    enforced_by: validate_openxwallet.check_subject_attestation
    negative_confirmation: examples/negative/subject-attestation-resolves-through-wallet.yaml
    red_proven: >-
      wallet-ref-as-subject-identifier neutered; corpus went red. The
      "domain adopting no wallets is conformant" half is proven by absence —
      no other capability's fixtures changed, and no validator requires a
      wallet record to exist.

  OXWA-R1:
    statement: An agent holder declares its composition
    artifact: contracts/openxwallet-agent-profile/openxwallet-agent-composition.schema.yaml
    enforced_by: validate_openxwallet.check_agent_composition (rule o)
    negative_confirmation: >-
      examples/negative/composition-hash-without-component-set.yaml,
      examples/negative/composition-for-a-wallet-that-does-not-resolve.yaml,
      examples/negative/composition-declared-for-a-non-agent-wallet.yaml
    red_proven: >-
      composition-set-missing, composition-wallet-unresolved and
      composition-on-non-agent neutered in turn; corpus went red each time.
      The last two arrived with the 2026-08-08 docs review: rule (q) fired
      only on a RESOLVED non-agent wallet (so a dangling wallet_ref skipped
      the class check entirely) and carried no probe of its own.

  OXWA-R2:
    statement: A composition change revokes the agent's grants immediately
    artifact: contracts/openxwallet-agent-profile/openxwallet-agent-composition.schema.yaml
    enforced_by: validate_openxwallet.check_agent_composition (rule p)
    negative_confirmation: examples/negative/composition-changed-grants-still-active.yaml
    red_proven: declared-change-not-revoked neutered; corpus went red

  OXWA-R3:
    statement: Agent authority is grant scope, not a parallel vocabulary
    artifact: contracts/openxwallet/openxwallet-grant.schema.yaml
    enforced_by: validate_openxwallet.check_grant (rules g, h)
    negative_confirmation: examples/negative/grant-parallel-authority-vocabulary.yaml
    red_proven: >-
      authority-vocabulary-parallel neutered; corpus went red. The legal terms
      are READ from contracts/schemas/hermes-job-envelope.schema.yaml at run
      time rather than restated, so the check cannot drift from the vocabulary
      it enforces — restating them would have recreated the second vocabulary
      the requirement forbids.

coverage_closure:
  rule: >-
    The validator fails with negative-requirement-uncovered when any
    requirement in its closed REQUIREMENTS list carries no probe, and with
    negative-requirement-unknown when a fixture claims a requirement that does
    not exist. Coverage cannot silently regress in either direction.
  measured: 11 of 11 requirements carry at least one negative confirmation

corpus:
  positive_examples: 16
  negative_confirmations: 33
  distinct_finding_codes_proven: 21

boundary:
  runtime_created: none
  keys_created: 0
  credentials_created: 0
  wallets_created: 0
  existing_capabilities_modified: 0
  note: >-
    Contracts, schemas, a validator and a fixture corpus. What a validator
    cannot check is recorded rather than implied: that a DECLARED custody
    model is the real one. Custody declaration keeps the contract honest only
    if consumers declare truthfully.

review_hardening:
  pass: adversarial review of the validator, 2026-08-08, before any consumer adopted the family
  finding: >-
    The checks were sound on the shapes they examined and had ten fail-open
    gaps and one crash. Recorded because the pattern is the point: every gap
    was a rule that looked right and asked a slightly wrong question.
  closed:
    - id: collapse-keyed-on-readability
      was: >-
        The collapse rule asked whether a model's KEY WAS READABLE. Readability
        is only one route to evidencing the environment — an isolated key
        signable at will evidences it too — so that middle case sat in neither
        the readable list nor the holder list and could outrank the
        holder-evidencing model untouched. Re-keyed onto what a model
        EVIDENCES, which is the property the ruling was ever about.
      probe: examples/negative/custody-registry-environment-outranks-holder.yaml
    - id: unearned-ceiling-keyed-on-a-name
      was: >-
        The unearned-ceiling rule compared against the literal id
        `act_unsupervised`; a registry names its own tiers, so renaming the top
        tier disabled the rule. Re-keyed onto the top RANK.
      probe: examples/negative/custody-registry-renamed-top-tier.yaml
    - id: presentation-accepted-as-proof
      was: >-
        The rule tested `verified is False`, so an ABSENT verdict passed: a
        signature presented, never checked, act permitted. Now anything that is
        not an explicit verification is unproven.
      probe: examples/negative/exercise-permitted-on-unverified-proof.yaml
    - id: unbound-exercise
      was: >-
        Nothing tied an exercise to the grant it named — an unresolvable grant,
        an act never conferred, a non-audience wallet, or a custody model
        stronger than the wallet declares all passed, leaving every downstream
        rule adjudicating a fiction.
      probe: examples/negative/exercise-by-a-wallet-the-grant-does-not-address.yaml
    - id: declared-custody-unchecked
      was: >-
        The closed set bound only where an EXERCISE reported a model in force,
        never where a wallet DECLARED one, so an invented model made every
        ceiling derived from it resolve to nothing.
      probe: examples/negative/wallet-custody-outside-the-closed-set.yaml
    - id: constraint-escaped-by-silence
      was: >-
        Constraints were read from the exercise's own evaluations, so an
        exercise omitting the block escaped a constraint its grant declared.
        Declaration lives on the grant; the check now reads it from there.
      probe: examples/negative/exercise-omits-a-declared-constraint.yaml
    - id: posture-not-attenuated
      was: >-
        Attenuation compared acts, objects, tier and expiry but not the
        approval posture — so a derivation could keep its parent's tier and
        waive the approval that made that tier survivable.
      probe: examples/negative/grant-derived-waives-parent-approval.yaml
    - id: repo-scan-inert
      was: >-
        Layer 2 validated real artifacts without indexing them first, so every
        cross-record rule resolved only against the packaged corpus and was
        inert on live records, while legitimate parent/child pairs reported
        spurious unresolved-reference findings. It also excluded the packaged
        corpus by this checkout's absolute paths, so scanning a VENDORED copy —
        the normal consumption path — re-adjudicated all the negatives as live
        records.
      probe: verified by scanning a copied checkout; 0 findings where 23 were reported before
    - id: naive-timestamp-aborted-the-run
      was: >-
        A timezone-naive expiry compared against an aware one raised TypeError,
        which the broad handler turned into exit 2 — discarding every finding
        from every other file and reporting a harness error where CI needed
        findings.
      probe: verified directly; the run now reports findings and exits 1
    - id: key-material-patterns-too-narrow
      was: >-
        The value scan matched only the bare PEM armor, missing a PGP block in
        the same field the shipped fixture uses, and missed a serialized JWK
        entirely. Since every object in the family is closed, a JWK can only
        arrive as a string — which is precisely where it was not being looked
        for.
      probe: examples/negative/wallet-carries-jwk-private-exponent.yaml
    - id: detail-pin-failed-open
      was: >-
        `expected_failure` stopped at the first non-comment line, so a detail
        pin after a blank line was silently dropped — the fixture kept a green
        self-test with its invariant pin gone, the exact drift the pin exists
        to prevent. Blank lines are now allowed inside the header block.
      probe: structural; blank lines no longer terminate the header scan

review_docs:
  pass: >-
    adversarial review of the DOCUMENTATION, 2026-08-08, after the validator's
    two code passes — the prose held to the same standard as the mechanism,
    because a sentence overstating what the contract guarantees is itself an
    audit record asserting something the mechanism cannot support
  finding: >-
    Ten verified defects: five sentences asserting guarantees the validator
    did not deliver, plus stale counts and governance headers left behind by
    the hardening pass. Two of the five were closed by tightening the
    VALIDATOR up to its prose (the family's fail-closed design language);
    the other three were prose corrections aligning absolute claims to the
    real mechanism.
  closed:
    - id: audience-binding-evadable
      was: >-
        Rule (r) read the presenting wallet from the record's own
        attribution.wallet_ref, an OPTIONAL self-declaration — omitting it
        skipped the audience binding entirely, and declaring the audience's
        ref alongside another wallet's key passed the binding on a lie. The
        presenting wallet is now DERIVED from the presenting key through the
        corpus's wallet records; a key no wallet declares is refused
        (presenting-key-unresolved), and a declared ref contradicting the
        presented key is attribution laundering.
      probe: >-
        examples/negative/exercise-presenting-key-of-another-wallet.yaml,
        examples/negative/exercise-attributed-to-a-wallet-not-presenting-its-key.yaml,
        examples/negative/exercise-presenting-key-unknown-to-the-corpus.yaml
    - id: binding-key-was-still-self-declared
      was: >-
        The audience-binding fix above derived the presenting wallet from
        attribution.presenting_key_ref — self-declared data, the same trust
        mistake one field over. Found by Codex and Copilot reviewing the fix
        (PR #120), which is the review_hardening pattern recurring on the
        repair itself. The binding key is now the VERIFIED proof block's key
        when one is recorded: an attribution key contradicting it is
        laundering; a verified presented key on an act recorded
        'unattributed' is laundering (the record would otherwise walk a
        non-audience key past the audience and distinct-holder bindings,
        since an unattributed act is held to neither); and because `key_id`
        is scoped to its DID anchor, a bare presenting key declared by more
        than one wallet is refused as ambiguous rather than resolved by
        file order (unfixturable in a one-document-per-probe corpus; the
        branch shares the red-proven presenting-key-unresolved code).
      probe: >-
        examples/negative/exercise-proof-and-attribution-name-different-keys.yaml,
        examples/negative/exercise-verified-key-recorded-unattributed.yaml
    - id: verified-proof-could-omit-its-key
      was: >-
        Round two, same pattern: the proof-key precedence above fell back to
        the attribution key when the proof block named none — and
        proof_of_possession.presenting_key_ref is optional, so a record
        could claim verified=true, omit the proof key, and be bound through
        self-declared attribution again (found by Codex reviewing the second
        fix). A verified proof that does not record WHICH key verified now
        refuses instead of falling back; unverified proofs still bind
        through the declared key, because an unverified signature
        establishes nothing either way.
      probe: examples/negative/exercise-verified-proof-names-no-key.yaml
    - id: reference-corpus-polluted-repo-resolution
      was: >-
        Repo mode indexed the scanned repo's records into the same context
        already holding the packaged positive examples, so a teaching
        fixture could resolve a live record's reference — and, once the
        ambiguity refusal landed, a consumer wallet legitimately reusing a
        DID-scoped key_id an example also uses (key-poster-0001) had every
        exercise refused as ambiguous against a fixture. Repo scans now
        build their own context from the scanned repo's records plus the
        canonical registry and vocabulary; a consumer corpus is closed over
        itself.
      probe: >-
        verified by scanning a scratch consumer repo whose wallet declares
        key-poster-0001 under its own DID: 0 findings where the mixed index
        refused it as ambiguous
    - id: empty-index-guards-failed-open
      was: >-
        Round three, same pattern in its last hiding place: the unresolved-ref
        rules carried empty-collection guards (`and ctx.wallets`,
        `and ctx.wallets_by_key`) — dead code while every context held the
        packaged positives, live and FAIL-OPEN the moment repo scans got
        their own context. A consumer repo declaring no wallets at all
        skipped every resolution those rules exist to force: an exercise's
        presenting key fell back to the self-declared attribution wallet, a
        grant's custody ceiling never bound, and a composition passed
        unresolved. All three rules (e, q, r) now refuse unconditionally —
        and round four removed the remaining three instances of the pattern
        (the constraint-unresolved warning, suppressed in a repo with no
        constraint records even under --strict, and the two
        custody-model-unknown guards on the canonical set).
      probe: >-
        verified by scanning scratch repos — grant+exercise with no wallet
        records fires custody-ceiling-unresolved AND
        presenting-key-unresolved; a lone composition fires
        composition-wallet-unresolved; an exercise evaluating a constraint
        no record declares warns constraint-unresolved; the valid consumer
        repo still scans clean
    - id: index-trusted-shape-and-uniqueness
      was: >-
        Round five: the key index assumed well-formed, unique records. Two
        schema-valid wallet files reusing one wallet_id with different keys
        collapsed in the index (last-write-wins), so an injected or obsolete
        duplicate let a second key authenticate as the grant's audience —
        and grants and constraints had the same silent id collision, which
        swaps SCOPE by file order. A duplicated id is now refused on every
        copy (record-id-duplicate). Separately, repo scans index documents
        BEFORE schema validation, so a malformed key_reference (or any
        non-string id, unhashable ref, mixed-type list reaching a set or
        sort) crashed the harness with exit 2 and DISCARDED every other
        file's findings. The index, every context lookup, and every
        doc-derived set/sort are now type-guarded, so a malformed document
        surfaces as schema findings on its own file.
      probe: >-
        examples/negative/wallet-record-duplicating-another-wallet-id.yaml
        for the duplicate; for the crash class, a scratch corpus of eighteen
        maximally malformed documents (non-mapping blocks, SCALAR containers
        like `constraint_evaluations: 1` — round six's finding, normalized
        by `_sequence` the way `_mapping` normalizes blocks — list ids,
        unhashable refs nested INSIDE containers reaching membership tests,
        non-integer tier ranks reaching the collapse comparison, PyYAML
        `!!set` members that defeat type-enumeration guards (hashability is
        now asked of hash() itself) — rounds six through eight — and
        mixed-type enums across every kind) exits 1 with findings, never 2
    - id: composition-resolution-unchecked
      was: >-
        Rule (q) fired only when a composition's wallet RESOLVED to a
        non-agent, while the profile README stated "must resolve to a
        wallet" — a dangling wallet_ref validated cleanly and the class
        check never ran. Unresolved is now refused
        (composition-wallet-unresolved), and the rule's firing case gained
        the probe it never had.
      probe: >-
        examples/negative/composition-for-a-wallet-that-does-not-resolve.yaml,
        examples/negative/composition-declared-for-a-non-agent-wallet.yaml
    - id: prose-guarantees-corrected
      was: >-
        The custody-registry schema description still keyed the
        unearned-ceiling promise on the NAME act_unsupervised (the code has
        been rank-keyed since the hardening pass) and described the collapse
        rule in its pre-hardening readable-only form; the wallet-record
        description called key-material VALUES "unrepresentable" when the
        value scan is a PEM/JWK blocklist a raw hex seed passes; the
        attestation schema claimed reconstructable_without_wallet is
        "declared true or the record is refused" when omission is permitted
        (only an explicit false is refused, which is what the promoted
        requirement asks); the exercise schema claimed "present iff refused"
        when only one direction is enforced. Each sentence now states what
        the mechanism does, including the limits (blocklist scanning,
        expiry-by-state, per-requirement coverage closure) a consumer would
        otherwise be surprised by.
      probe: prose-only; the reviewer's counterexample corpus validates the same way before and after
