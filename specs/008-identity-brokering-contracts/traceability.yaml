review_hardening:
  # Adversarial review of the ratified family and its canonical validator,
  # 2026-08-21, by a panel independent of the author — twenty-eight bypass
  # probes, fourteen verified findings. Every probe that maps to a finding below
  # now FAILS validation for the code named here; the probes are recorded in the
  # review workspace and each is reproduced as a packaged negative fixture, so
  # the corpus reaches the case permanently rather than only in the review.
  #
  # Disposition vocabulary:
  #   fixed      — a check asked the wrong question; the check was corrected
  #   ruled      — the CONTRACT was tightened beyond the ratified text's letter,
  #                on an architect ruling recorded in research.md
  #   documented — the limit is real and unclosable; it is written down instead
  pass_date: 2026-08-21
  probes_run: 28
  findings_verified: 14
  fixtures_added: 14
  ratified_corpus_regressions: 0

  findings:
    F1:
      severity: high
      disposition: fixed
      was: >-
        Rule (b) keyed persona sameness on the BYTE-EXACT triple (instance_id,
        provider_id, upstream_subject), so a trailing space, a full-width
        character or a case change on any of the three minted a SECOND PERSONA
        for one human — the exact outcome the capability exists to prevent, and
        the rule that exists to prevent it signed off on four variants.
      now: >-
        All three components normalized through `_key` (NFKC, stripped, case
        folded) on both the index and the lookup. Normalized for identity keys
        ONLY, because two genuinely different subjects that fold together must
        stay different everywhere else.
      code: second-persona-in-instance
      fixture: examples/negative/second-persona-via-whitespace-padded-upstream-subject.yaml
      probe: P11 (persona-b trailing space, persona-c provider case, persona-d instance case)

    F2:
      severity: high
      disposition: fixed
      was: >-
        `organization_memberships[].organization_id` was never resolved and used
        the family's general `identifier` pattern, which admits ':' and '/'. So
        `role:platform-admin`, `grant:deploy-prod`, `project:alpha` and
        `stack/<client>/<env>/layer/tenant` were all legal memberships: the
        never-mirror rule held on every PROPERTY and the graph rode in as a
        VALUE, through the one field on a persona assertion that points at
        another record.
      now: >-
        A narrowed `organization_id` $def (no ':', no '/') on the membership AND
        on `broker_organization.organization_id`, so the two shapes agree and no
        organization can be declared under an id a conformant membership could
        not name; plus validator rule (n), resolving each membership id against
        the `broker_organization` records in the same scan. Corpus-coupled like
        rules (b), (i) and (l) — skipped when a scan declares no organizations.
      code: never-mirror-property
      fixture: >-
        examples/negative/persona-membership-names-a-role.yaml,
        examples/negative/persona-membership-names-undeclared-organization.yaml
        (the clean-firing one), examples/negative/persona-membership-carries-tenancy-path.yaml
      probe: P01, P01b, P19
      note: >-
        Narrowing `broker_organization.organization_id` goes one step beyond the
        review's brief, which named only the membership field. Taken
        deliberately: without it the two shapes disagree, and P19's organization
        record — whose own id IS a tenancy path — stayed conformant while a
        membership naming it could not exist.

    F3:
      severity: high
      disposition: fixed
      was: >-
        The display-name-as-subject check compared byte-exactly (after strip and
        lower), so removing the spaces or the punctuation defeated it:
        `BrettHeapOpensoft` and `Brett.Heap.Opensoft` cleared the
        `opaque_subject` pattern AND the comparison at once. Between them the
        two mechanisms were testing punctuation rather than the substitution.
      now: >-
        Both sides compared on their ALPHANUMERIC SKELETON, case folded
        (`_skeleton`). The fixture comment that over-claimed the old behaviour is
        corrected in place.
      code: actor-identifier-not-opaque
      fixture: examples/negative/actor-reference-display-name-with-spaces-removed.yaml
      probe: P02 (spaceless, dotted, trailing-dot)

    F4:
      severity: high
      disposition: fixed
      was: >-
        `repo_scan` excluded any path with `examples` and `identity-brokering`
        in its parts EVEN FOR AN EXPLICITLY NAMED FILE, and did not count the
        exclusions. So `validate-identity-brokering.py <family-example>` — the
        one command an author reaches for to check a single record — reported "0
        errors" for a file it never opened, and a whole-checkout sweep silently
        dropped 41 documents while saying nothing about it.
      now: >-
        The exclusion applies during a directory SWEEP only, and the note line
        reports the excluded count alongside the scanned and skipped counts.
      code: n/a (a silence, not a finding)
      fixture: >-
        none needed; the evidence is behavioural and recorded in
        evidence/f4-single-file-scan.txt — an explicitly named positive now
        reports "1 artifact validated" where it previously reported 0
      probe: P25

    F5:
      severity: medium-high
      disposition: ruled
      was: >-
        A merge approved by one of its own parties passed every check. Probe P20
        is a merge whose SURVIVING persona is the approving administrator, with
        both parties named, both kept resolvable, an approval record referenced
        and a timestamp — the account takeover R4 exists to refuse, with
        immaculate paperwork.
      now: >-
        Refused where the approver is in `subjects` or equals
        `surviving_subject`. The ratified text says a merge is approved through
        GOVERNED ADMINISTRATION and does not spell out "not by a party"; this
        slice adopts the refusal as the faithful reading (architect ruling,
        2026-08-21), recorded as a post-ratification disposition in research.md.
      code: merge-approved-by-a-party
      fixture: examples/negative/merge-approved-by-one-of-its-own-parties.yaml
      probe: P20

    F6:
      severity: medium-high
      disposition: fixed
      was: >-
        A `mapped_historical_actor` whose subject WAS its own
        `mapped_from_username` passed: the mapping block complete, the mapper
        and date and evidence all present, and the durable identifier in the
        actor position still the bare username. The blanket backfill OQ-1
        refuses, wearing the paperwork of a mapping.
      now: >-
        A mapped subject equal to its `mapped_from_username`, or equal to any
        bare username the corpus records as pre-broker, is refused. The second
        clause closes moving the substitution one field along.
      code: bare-username-as-persona
      fixture: examples/negative/mapping-resolves-username-to-itself.yaml
      probe: P03

    F7:
      severity: medium
      disposition: fixed
      was: >-
        `initiated_by` carries both `subject` (who acted) and
        `session_holds_subject` (whose session it was), and only the second was
        checked. So they could disagree — and the disagreement IS the attack: an
        attacker's upstream identity attached to a victim's persona, recorded as
        the victim's own explicit act, with a fully conformant shape.
      now: Equality required between the two initiator fields.
      code: self-link-outside-persona-session
      fixture: examples/negative/self-link-initiated-by-a-different-subject.yaml
      probe: P04

    F8:
      severity: medium
      disposition: ruled + documented
      was: >-
        `resolved_authorization.resolves_in` is closed to `governed_layer` and
        the refs beside it are 300 characters of free text. A record could
        declare the right word and name the broker's own Keycloak admin API —
        an organization's member collection — as the decision point, and every
        declaration in the file was conformant while the decision was still
        "whoever is in the group may act".
      now: >-
        The locator is walked BY SHAPE, using rule (e)'s technique on a
        different value class: broker-administration URI schemes
        (keycloak://, broker://), broker administration paths (/admin/realms,
        an organization's /members collection, a realm's user/role/group/client
        collections), and a scheme-less ref whose first segment is the record's
        own broker instance. Applied to `decision_point_ref` AND `grants_ref`.
      code: membership-as-authority
      fixture: examples/negative/decision-point-is-the-broker-admin-api.yaml
      probe: P07
      residue_documented: >-
        An OPAQUE ref that in fact resolves to broker membership cannot be
        caught by shape at all — README limits item 3. A ref that merely
        CONTAINS the instance id is deliberately not refused either: the
        gate-console positive's governed decision point is
        `hermes://broker-opensoft-shared/authorization/gate-console`, where the
        instance id is a legitimate scoping token, so containment cannot
        discriminate the two.
      packaged_fixture_recommented: >-
        examples/negative/membership-offered-as-authority.yaml now fires
        membership-as-authority TWICE — its own `resolves_in` refusal and the new
        locator walk, since its decision_point_ref is
        `broker://…/organizations/opensoft/members`. Its commentary says so, and
        its detail pin stays on the `resolves_in` wording so it keeps testing
        the invariant it is named for.

    F9:
      severity: medium
      disposition: fixed
      was: >-
        Every posture check keyed on `governed_write_actions.offered`, so a
        record could NAME the actions it writes and declare `offered: false`
        beside them. That is what a diff looks like halfway through adding the
        feature, and what a record looks like when someone answers the posture
        question with the answer they wish were true.
      now: >-
        A schema conditional (a non-empty `actions` list requires
        `offered: true`, which then requires the stronger posture and a named
        decision point) plus a validator check reporting it under its own code,
        so the refusal names the rule rather than an if/then failure — the same
        reason rule (h) reports a second pointer rather than an array length.
      code: write-action-without-resolved-authorization
      fixture: examples/negative/write-actions-named-while-offered-false.yaml
      probe: P06

    F10:
      severity: medium
      disposition: fixed
      was: >-
        The secret-class regexes ran on each literal string and on strings
        JOINED across sibling fields and array items, and missed a secret split
        with whitespace INSIDE ONE VALUE: `client_secret: hV3x K9pQ 2mZr 7Lw4`
        leaves four characters after the colon, under the assigned-secret
        floor. That is what a wrapped or column-truncated export looks like
        pasted out of a terminal.
      now: Each string tested twice — as written, and with its whitespace collapsed.
      code: credential-value-embedded
      fixture: examples/negative/assigned-secret-spaced-out-inside-one-value.yaml
      probe: P13

    F11:
      severity: n/a (contract hardening)
      disposition: ruled
      was: >-
        R7's retirement obligation was enforced only on records that
        VOLUNTEERED a `replaced_credential` block, so an adoption that named
        nothing was silently exempt. The requirement bit on honesty and was
        inert against silence.
      now: >-
        `prior_shared_credential` REQUIRED, `none | replaced`. `replaced`
        requires the block (and the validator then requires the retirement and
        its date); `none` forbids it and is the AUDITABLE CLAIM — something a
        reader can later show to be false, which an omission never is. This
        realizes R7's retirement obligation STRUCTURALLY rather than
        conditionally. Disclosed in research.md.
      code: schema
      fixture: examples/negative/adoption-omits-prior-shared-credential-claim.yaml
      probe: P05
      positives_updated: >-
        all four surface-adoption positives (workbench-read-only -> replaced;
        gate-console-resolved, dedicated-instance and
        single-organization-instance -> none) and all seven adoption negatives,
        so each negative stays a single-reason probe

    F12:
      severity: n/a (contract hardening)
      disposition: ruled
      was: >-
        `population_restricted` had to name the commitment it consulted; `none`
        needed nothing. So the co-residence question could be answered without
        anybody having asked it, `none` being what the field says by default.
      now: >-
        `restriction_ref` required for BOTH enum values, and the validator's
        `isolation-restriction-unrecorded` check extended to both. This realizes
        the OQ-5 co-residence finding's own "unrecorded negative" rule against
        its own output. Disclosed in research.md.
      code: isolation-restriction-unrecorded
      fixture: examples/negative/co-residence-answered-none-with-nothing-recorded.yaml
      probe: P16
      positives_updated: >-
        the three that went red (workbench-read-only,
        gate-console-resolved, single-organization-instance); the
        dedicated-instance positive already referenced its commitment

    F13:
      severity: medium
      disposition: documented
      was: >-
        Rule (i) — workloads are not personas — resolves a subject against the
        `broker_client_declaration` records in the SAME SCAN, and so do rules
        (b), (l) and the new (n). Across the D6 repository split (openxFactory
        owning contracts, a domain repository owning live records, possibly a
        third owning client declarations) the check simply does not reach, and
        nothing said so.
      now: >-
        Not closable by this family: the coupling is inherent to a validator
        that resolves references within a scan and refuses to invent a registry.
        R6's ENFORCEMENT SCOPE is now stated explicitly — README limits item 4
        names all four corpus-coupled rules, spells out what a split repository
        loses, and tells a consumer to scan a tree containing all three record
        kinds or accept the weaker check knowingly. Also recorded in the
        validator's own "what this deliberately does not do" section.
      code: n/a
      fixture: n/a (a scope statement, not a refusable document)
      probe: n/a (structural finding)

    F14:
      severity: low
      disposition: fixed
      was: >-
        The `broker_asserted` provenance branch refused a `pre_broker` block and
        ADMITTED a `mapping` block — the one wrong combination the conditionals
        left representable, and the useful one: every rule governing a mapping
        hangs off provenance being `mapped_historical_actor`, so an unverified
        resolution travelled inside a record reading as a first-party broker
        assertion with no mapping rule applying to it.
      now: >-
        The branch gains `not: {required: [mapping]}`, wrapped in the same
        `allOf` form the `pre_broker_username` branch already uses. The
        schema-derived allow-list walk deliberately excludes `not` branches, so
        this adds no name to the allow-list.
      code: schema
      fixture: examples/negative/broker-asserted-reference-carries-a-mapping.yaml
      probe: P24

  documentation_corrections:
    - target: contracts/identity-brokering/broker-organization.schema.yaml
      was: >-
        "`company_role` is `tenant` or `served`, the ratified `layer-vocabulary`
        spelling of the two company boundaries" — an over-claim. `tenant` IS a
        canonical layer id; `served` is NOT, appearing in the policy only as the
        ROLE TEXT of the subject layer.
      now: >-
        Restated with research.md Decision 4's own honest wording: a company
        boundary is not a Hermes layer, only one of the two words is a canonical
        id, `served` is this family's own spelling carried deliberately and
        BRIDGED rather than silently equated — and `record_kind` is the field
        that does name a layer.
    - target: examples/negative/actor-reference-uses-display-name-as-id.yaml
      was: >-
        claimed the validator check "catches the single-token names the pattern
        would let through", when the comparison was byte-exact and caught only
        an identically spelled subject
      now: >-
        corrected to the skeleton comparison, with the correction dated and the
        remaining residue stated (an abbreviation or initial-plus-surname is a
        name in the identifier position that no comparison against this record's
        own display name can see)
    - target: specs/008-identity-brokering-contracts/research.md (Decision 5)
      was: >-
        "the substitution is structurally impossible for the common case" — the
        length floor cannot deliver that, and the review proved it: a QUALIFIED
        username (`brett.heap.legacy`, 17 characters, pattern-clean) clears the
        floor, so `first.last` and `first.last.company` walk through
      now: >-
        softened to what a floor can actually do (it rules out `bheap`, not a
        username), with the real answer named — a broker-issued subject FORMAT,
        which change task 4.4 is positioned to settle — and the two validator
        rules that carry it until then identified as rules rather than structure
    - target: contracts/identity-brokering/README.md
      was: >-
        two limits stated in a paragraph under "what this family deliberately
        does not do"
      now: >-
        a dedicated "Known limits" section enumerating all six known limits:
        the unresolvable posture, the value-scan blocklist, the F8 opaque-ref
        residue, the F13 corpus-coupling of rules (b)/(i)/(l)/(n) with R6's
        enforcement scope spelled out across the D6 repository split, the
        unverifiable `prior_shared_credential: none` claim, and the
        different-string display name

