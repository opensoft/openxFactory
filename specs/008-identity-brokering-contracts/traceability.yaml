schema_version: 1
kind: openxfactory_realization_traceability
feature: 008-identity-brokering-contracts
ratified_change: add-identity-brokering
capabilities:
  - identity-brokering

# One row per ratified requirement. `positive_confirmation` names the packaged
# example that shows the conformant shape; `negative_confirmation` names the
# recorded probe; `red_proven` records that suppressing the rule's finding code
# turns the packaged corpus red, which is what proves the probe fails FOR ITS
# OWN REASON rather than incidentally. Reproduce with:
#   python3 specs/008-identity-brokering-contracts/evidence/red-proof.py

settlements:
  # Assigned to this feature by the change's task 2.3; both recommendations
  # were adopted as written at ratification. Full reasoning in research.md.
  OQ-3:
    question: the exact `actor_subject` field shape
    settled: >-
      The STRUCTURED REFERENCE — issuer (broker instance), opaque subject,
      display name at record, plus a provenance discriminator.
    realized_in: contracts/identity-brokering/actor-subject-reference.schema.yaml
    reason: >-
      A bare subject is ambiguous without its issuer, and design D3 makes
      multiple instances an expected state (the co-residence gate found a
      dedicated-instance population before the shared instance has its first
      client). The display name must travel with the record anyway, so the
      object exists regardless; adding the issuer to it costs one field, and
      guessing the other way costs a schema major on a field embedded in every
      governed record naming a human.
    left_open: >-
      How a specific consuming record family EMBEDS the reference. Change task
      4.4 (the gate-console binding) confirms or overrides the shape against a
      real record before the bundle cuts.
  OQ-1:
    question: what happens to records written before the broker existed
    settled: >-
      MARK THE BOUNDARY DATE and map on demand. Never a blanket backfill. A
      pre-broker record stays readable and never presents as a persona.
    realized_in: >-
      the three `provenance` classes, with the wrong combinations
      unrepresentable and `pre_broker.presented_as_persona` a required constant
      `false`
    reason: >-
      A backfill asserts identity resolutions nobody verified — the same
      false-audit failure the merge ruling refuses — and a mapping table that
      had to be complete before the broker was useful would stall the adoption
      behind an unbudgeted data-cleanup exercise.

requirements:
  IDB-R1:
    statement: One persona per human within a broker instance
    artifact: contracts/identity-brokering/persona-assertion.schema.yaml
    enforced_by: >-
      validate_identity_brokering.check_persona_assertion (rule b, keyed on the
      federated upstream identity) and check_surface_adoption (rule m, the
      required constant `human_accounts_held_by_surface: false`)
    positive_confirmation: >-
      examples/persona-two-upstreams-two-organizations.example.yaml
      (one human, two upstreams, two memberships),
      examples/persona-dedicated-instance-patient.example.yaml
      (single within its own instance, with an empty membership set)
    negative_confirmation: >-
      examples/negative/second-persona-for-same-human-in-instance.yaml,
      examples/negative/second-persona-via-whitespace-padded-upstream-subject.yaml
      (review F1 — the sameness key normalized: a trailing space on the
      upstream subject minted a second persona for one human),
      examples/negative/surface-holds-local-human-accounts.yaml
    red_proven: >-
      second-persona-in-instance and surface-holds-human-accounts neutered in
      turn; corpus went red each time. The rule keys on the FEDERATED IDENTITY
      because that is the only evidence of sameness the broker actually has —
      there is deliberately no "same human" field, since one would be a second
      identity population.

  IDB-R2:
    statement: Organizations realize company boundaries, on the persona
    artifact: contracts/identity-brokering/broker-organization.schema.yaml
    enforced_by: >-
      validate_identity_brokering.check_broker_organization (rule k, the layer
      vocabulary read from contracts/policies/layer-vocabulary.yaml at run
      time) and check_surface_adoption (rule f, `resolves_in` read from the
      contract)
    positive_confirmation: >-
      examples/organization-tenant-operator.example.yaml,
      examples/organization-served-federated-provider.example.yaml
      (own provider, domain-routed, credential by reference)
    negative_confirmation: >-
      examples/negative/membership-offered-as-authority.yaml,
      examples/negative/decision-point-is-the-broker-admin-api.yaml
      (review F8 — `resolves_in: governed_layer` declared, and the broker's own
      admin API named as the decision point; the FIRST fixture to fire
      membership-as-authority with no accompanying schema finding),
      examples/negative/persona-membership-names-undeclared-organization.yaml
      (review F2 — a pattern-clean membership id no organization declares;
      fires never-mirror-property cleanly, which is what proves the resolution
      rule rather than the pattern is doing the work),
      examples/negative/organization-role-outside-layer-vocabulary.yaml
    red_proven: >-
      membership-as-authority and reserved-layer-term neutered in turn; corpus
      went red each time. The named-negative list in the change left this
      requirement without a probe; both probes were added because its third
      scenario ("membership is offered as authority") states a validation
      failure that nothing else in the corpus exercised. The many-to-many and
      own-provider halves are asserted by the positives: one persona carries
      two memberships, and an organization federates its own provider without
      any persona being duplicated.

  IDB-R3:
    statement: The broker asserts identity and membership only
    artifact: >-
      contracts/identity-brokering/persona-assertion.schema.yaml and
      contracts/identity-brokering/broker-organization.schema.yaml
    enforced_by: >-
      validate_identity_brokering.check_closed_world (rule a — a CLOSED
      ALLOW-LIST derived from the schema, walked at every depth) and
      check_broker_organization (rule h, the single governed-record pointer)
    positive_confirmation: >-
      examples/organization-tenant-operator.example.yaml (exactly one pointer,
      resolving in the governed layer)
    negative_confirmation: >-
      examples/negative/persona-assertion-carries-roles.yaml,
      examples/negative/persona-assertion-carries-project-scope.yaml,
      examples/negative/organization-projects-governed-record.yaml,
      examples/negative/organization-carries-multiple-graph-refs.yaml,
      examples/negative/persona-membership-names-a-role.yaml (review F2 — the
      graph as a membership VALUE rather than a property),
      examples/negative/persona-membership-carries-tenancy-path.yaml
      (review F2 — the same smuggle as a path)
    red_proven: >-
      never-mirror-property and organization-multiple-graph-refs neutered in
      turn; corpus went red each time. FOUR probes because the mirror arrives
      four ways: on the assertion, at depth inside a membership, as copied
      CONTENTS beside a legal pointer, and as a second pointer. The allow-list
      is derived from the schema rather than written as a second list, per
      design D2's named risk — a denylist admits every field nobody thought to
      forbid. Measured separately: an undeclared property injected at all 54
      object paths across the 14 positives is refused at every one
      (`closed-world-property`), so the walk is closed at depth rather than at
      the top level only.

  IDB-R4:
    statement: Identities link explicitly or merge by decision, never silently
    artifact: contracts/identity-brokering/identity-link-record.schema.yaml
    enforced_by: >-
      validate_identity_brokering.check_identity_link_record (rule c, with the
      admissible bases READ OUT OF THE SCHEMA at run time) plus the schema's
      own mode/actor conditionals
    positive_confirmation: >-
      examples/identity-link-self-link.example.yaml (initiated from the session
      already holding the persona),
      examples/identity-link-admin-merge.example.yaml (approver, both prior
      subject identifiers, and each resolving to the survivor)
    negative_confirmation: >-
      examples/negative/link-record-auto-matched-on-email.yaml,
      examples/negative/link-record-without-initiator-or-approver.yaml,
      examples/negative/merge-record-drops-pre-merge-subject.yaml,
      examples/negative/self-link-from-session-not-holding-persona.yaml,
      examples/negative/merge-approved-by-one-of-its-own-parties.yaml
      (review F5 — the merge approved by its own beneficiary; a
      post-ratification disposition, see research.md),
      examples/negative/self-link-initiated-by-a-different-subject.yaml
      (review F7 — the two initiator fields disagreeing, which made an
      attacker's link read as the victim's own explicit act)
    red_proven: >-
      silent-auto-link, link-actor-unnamed, pre-merge-subject-unresolvable and
      self-link-outside-persona-session neutered in turn; corpus went red each
      time. The two obligations design D4 ADDED to the ruling are the two that
      needed the most enforcement: a record naming no actor (otherwise
      "explicit" is unfalsifiable) and a merge dropping a prior subject
      (otherwise the merge orphans every record written against it). The
      session-holds probe is the ratified clause "from a session already
      holding that persona" made checkable.

  IDB-R5:
    statement: A governed record binds its actor to a stable opaque subject
    artifact: contracts/identity-brokering/actor-subject-reference.schema.yaml
    enforced_by: >-
      validate_identity_brokering.check_actor_subject_reference and
      check_opaque_subject (rule d) plus the schema's provenance conditionals
      and the `opaque_subject` pattern and length floor
    positive_confirmation: >-
      examples/actor-reference-broker-asserted.example.yaml,
      examples/actor-reference-pre-broker-username.example.yaml,
      examples/actor-reference-mapped-historical.example.yaml
    negative_confirmation: >-
      examples/negative/actor-reference-uses-display-name-as-id.yaml,
      examples/negative/actor-reference-uses-email-as-id.yaml,
      examples/negative/actor-reference-bare-username-as-persona.yaml,
      examples/negative/actor-reference-display-name-with-spaces-removed.yaml
      (review F3 — the display name with its spaces taken out, which cleared
      BOTH the pattern and the byte-exact comparison),
      examples/negative/mapping-resolves-username-to-itself.yaml
      (review F6 — a mapping that resolved a username to itself, so the
      durable identifier was still the username),
      examples/negative/broker-asserted-reference-carries-a-mapping.yaml
      (review F14 — the one provenance combination the conditionals left
      representable, and the one that skips every mapping rule)
    red_proven: >-
      actor-identifier-not-opaque and bare-username-as-persona neutered in
      turn; corpus went red each time. Three probes for the three
      substitutions the requirement names (display name, address, upstream
      account name), and the bare-username probe is OQ-1's settlement under
      attack: a backfill performed by ASSERTION rather than by mapping. The
      structural half — no '@', no whitespace, and a length floor no bare
      username reaches — carries the cases the corpus has never seen.

  IDB-R6:
    statement: Workloads are not personas
    artifact: contracts/identity-brokering/broker-client-declaration.schema.yaml
    enforced_by: >-
      validate_identity_brokering.check_persona_assertion and
      check_actor_subject_reference (rule i, the declared-client collision) and
      check_broker_client_declaration (the three transport constants)
    positive_confirmation: >-
      examples/broker-client-confidential-web-surface.example.yaml (a
      confidential client for a web surface, declared transport, with its
      stated token need)
    negative_confirmation: >-
      examples/negative/workload-declared-as-persona.yaml,
      examples/negative/service-client-recorded-as-actor.yaml,
      examples/negative/service-client-membership-as-authority.yaml
    red_proven: >-
      workload-as-persona, workload-as-actor and membership-as-authority
      neutered in turn; corpus went red each time. The three probes are the
      three routes: into the persona population, into the actor position of a
      governed record, and into authority by way of a membership. The
      transport declarations are required CONSTANTS rather than optional
      booleans, so the claim is always made and only the conformant value is
      representable.

  IDB-R7:
    statement: Broker credentials are credential-contract records
    artifact: >-
      the `credential_reference` $def shared by
      broker-organization.schema.yaml, broker-client-declaration.schema.yaml
      and surface-adoption.schema.yaml
    enforced_by: >-
      validate_identity_brokering.check_no_credential_material (rule e — names,
      values, and values REASSEMBLED from adjacent chunks) and
      check_surface_adoption (rule g, the retirement of a replaced credential)
    positive_confirmation: >-
      examples/organization-served-federated-provider.example.yaml (provider
      credential by reference),
      examples/surface-adoption-workbench-read-only.example.yaml (the shared
      htpasswd secret retired as part of the adoption)
    negative_confirmation: >-
      examples/negative/configuration-export-carries-client-secret.yaml,
      examples/negative/idp-credential-committed-in-manifest.yaml,
      examples/negative/adoption-leaves-shared-secret-live.yaml,
      examples/negative/persona-linked-identity-carries-bearer-token.yaml,
      examples/negative/export-secret-split-across-chunks.yaml,
      examples/negative/assigned-secret-spaced-out-inside-one-value.yaml
      (review F10 — the split INSIDE one value, which neither the per-value
      regexes nor cross-field reassembly spanned),
      examples/negative/adoption-omits-prior-shared-credential-claim.yaml
      (review F11 — the adoption that said nothing was the exempt one)
    red_proven: >-
      credential-value-embedded and shared-secret-not-retired neutered in turn;
      corpus went red each time. FIVE probes because the requirement has four
      distinct clauses and one of them is a scanning property: a configuration
      export pasted whole, a credential committed as a property, a bearer token
      stored at rest, an adoption leaving the old secret live, and a secret
      SPLIT ACROSS CHUNKS that no per-value scan would see. The last is why the
      scan reassembles array items and sibling strings.

  IDB-R8:
    statement: Isolation escalates by instance, never by fragmenting personas
    artifact: contracts/identity-brokering/surface-adoption.schema.yaml
    enforced_by: >-
      validate_identity_brokering.check_surface_adoption (rule j) and
      check_identity_link_record (rule l, personas do not span instances)
    positive_confirmation: >-
      examples/surface-adoption-dedicated-instance.example.yaml (the
      co-residence finding's population on its own instance),
      examples/surface-adoption-single-organization-instance.example.yaml (a
      dedicated instance with NO restriction — the silence on count, exercised
      in the other direction),
      examples/persona-dedicated-instance-patient.example.yaml
    negative_confirmation: >-
      examples/negative/isolation-by-persona-partition-in-shared-instance.yaml,
      examples/negative/link-record-spans-broker-instances.yaml,
      examples/negative/co-residence-answered-none-with-nothing-recorded.yaml
      (review F12 — `none` was the one answer that needed no evidence)
    red_proven: >-
      isolation-by-partition and persona-spans-instances neutered in turn;
      corpus went red each time. The second probe is the clause that would
      otherwise have gone unproven: the co-residence bar defeated through the
      LINKING machinery rather than through a deployment decision. The silence
      on instance count is proven by absence — the single-organization
      adoption validates with no restriction at all, and nothing in the family
      requires an instance count in either direction.

  IDB-R9:
    statement: A surface declares its authorization posture
    artifact: contracts/identity-brokering/surface-adoption.schema.yaml
    enforced_by: >-
      validate_identity_brokering.check_surface_adoption (rule f) plus the
      schema's write-action/posture conditional
    positive_confirmation: >-
      examples/surface-adoption-workbench-read-only.example.yaml (the
      authenticated-persona posture, honestly declared),
      examples/surface-adoption-gate-console-resolved.example.yaml (write
      actions, the stronger posture, and a named governed decision point)
    negative_confirmation: >-
      examples/negative/write-action-under-authenticated-persona-posture.yaml,
      examples/negative/adoption-write-action-without-decision-point.yaml,
      examples/negative/write-actions-named-while-offered-false.yaml
      (review F9 — the actions named and the posture not; every posture check
      keyed on `offered`)
    red_proven: >-
      write-action-without-resolved-authorization neutered; corpus went red.
      Two probes for the two ways the posture fails: the quiet transition (a
      read-only surface gains a write action and the login silently does work
      it was never designed for) and the declaration satisfying itself (the
      stronger posture written down with no decision point named). Design D9's
      accepted limit is recorded rather than implied: a validator cannot check
      that the resolution HAPPENS.

coverage_closure:
  rule: >-
    The validator fails with negative-requirement-uncovered when any
    requirement in its closed REQUIREMENTS list carries no probe, and with
    negative-requirement-unknown when a fixture claims a requirement that does
    not exist. Coverage cannot silently regress in either direction.
  measured: 9 of 9 requirements carry at least one negative confirmation
  after_review_hardening: >-
    9 of 9, with every requirement except R6 gaining at least one further probe
    from the 2026-08-21 adversarial review; R6's remaining gap is an ENFORCEMENT
    SCOPE limit rather than a missing probe (review F13, recorded in the family
    README's limits section)

corpus:
  positive_examples: 14
  negative_confirmations: 41
  named_by_the_change: 18
  added_for_unproven_clauses: 9
  added_by_review_hardening: 14
  distinct_finding_codes_proven: 22
  fixtures_failing_with_no_schema_finding: 19
  note: >-
    The last count matters because a fixture that also fails schema validation
    can drift into testing nothing while its self-test stays green. Eight of the
    fourteen hardening fixtures fail with NO schema finding at all, so the rule
    each is named for is provably the thing doing the work — including the first
    clean firing of membership-as-authority, which until now was only ever seen
    beside a schema refusal.

runtime_read_vocabularies:
  # Read rather than restated, so a check cannot drift from the thing it
  # enforces. The same technique validate-openxwallet.py uses for the job
  # envelope's approval-policy terms.
  - source: contracts/policies/layer-vocabulary.yaml
    read: canonical layer ids, reserved layer terms
    guard: >-
      the company-role bridge's targets (tenant -> tenant, served -> subject)
      are checked against the canonical ids; a renamed layer fails loudly as
      layer-vocabulary-drift rather than leaving this family speaking a second
      spelling
  - source: contracts/identity-brokering/identity-link-record.schema.yaml
    read: the admissible linking bases
    guard: schema-enum-missing when the enumeration is absent
  - source: contracts/identity-brokering/surface-adoption.schema.yaml
    read: where a per-action authorization decision resolves
    guard: schema-enum-missing when the enumeration is absent
  - source: contracts/identity-brokering/broker-organization.schema.yaml
    read: where a governed-record pointer resolves
    guard: schema-enum-missing when the enumeration is absent

boundary:
  brokers_created: 0
  realms_created: 0
  organizations_created: 0
  credentials_created: 0
  personas_created: 0
  existing_capabilities_modified: 0
  surface_authentication_changed: none
  note: >-
    Contracts, schemas, a validator and a fixture corpus. What the validator
    cannot check is recorded rather than implied: that a declared
    authorization posture is actually resolved at run time, that an adoption
    which does not name a replaced credential did not silently leave one live,
    and that a free-text field carries no secret encoded in a class the scan
    does not know. Each is an obligation this contract places on its
    consumers, stated in the family README.

self_hardening:
  pass: >-
    adversarial pass over the validator by its author, 2026-08-21, before any
    consumer adopted the family — plus three measured probes recorded below
  finding: >-
    Four gaps, three of them the same shape as the ones openxwallet's review
    recorded: a rule that looked right and asked a slightly wrong question.
  closed:
    - id: not-branch-widened-the-allow-list
      was: >-
        The schema-derived allow-list unioned properties across `allOf`,
        `anyOf`, `oneOf`, `if`, `then`, `else` AND `not`. Branch unioning is
        what makes the derivation faithful — the actor reference declares
        `pre_broker` only inside a conditional — but a `not` branch names what
        the contract REFUSES, so unioning it in would have made exactly those
        names legal. Inert today (this family's `not` blocks carry only
        `required`), and a latent fail-open the moment one carried
        `properties`. Excluded, with the reasoning recorded at the exclusion.
      probe: >-
        an undeclared property injected at all 54 object paths across the 14
        positives is refused at every one
    - id: pointer-resolution-point-restated
      was: >-
        The organization's governed-record pointer was checked against a
        LITERAL 'governed_layer' in the validator while the surface adoption's
        equivalent check read its legal values from the schema. One restated
        vocabulary in a family whose whole argument is that restated
        vocabularies drift. Now read from broker-organization.schema.yaml at
        run time, with schema-enum-missing if the enumeration disappears.
      probe: >-
        examples/negative/membership-offered-as-authority.yaml exercises the
        adoption half; the pointer half is exercised by the positives, which
        would fail if the enumeration were read as empty (measured: they do,
        which is how the harness bug below was found)
    - id: self-link-could-carry-extra-subjects
      was: >-
        A `self_link` naming subjects besides the persona it adds to passed
        every check: a merge wearing the paperwork of a link, with no approver
        and no pre-merge entries, silently orphaning every record written
        against the extra subjects. The mode determines which obligations
        apply, so the mode has to match what the record actually does. Now
        refused as link-subjects-inconsistent.
      probe: >-
        rule-only (no fixture of its own; not every enforced rule needs one,
        and requirement coverage is closed independently)
    - id: red-proof-harness-measured-itself
      was: >-
        The red-proof harness built its own Context and did not pass the newly
        added pointer-resolution vocabulary, so every neutered run scored TWO
        extra errors from the positives failing — the harness reported RED
        everywhere while measuring its own misconfiguration rather than the
        rule under test. A harness that cannot go green for the right reason
        cannot prove anything by going red. Fixed by building the same context
        main() builds, with the reason recorded in the harness.
      probe: >-
        evidence/red-proof-output.txt — nineteen codes, each neutering
        producing 1-4 errors traceable to the fixtures that claim it, with no
        constant offset
  measured_probes:
    - name: closed-world at depth
      method: >-
        inject an undeclared property at every object path of every positive
        and require closed-world-property
      result: 54 of 54 paths refused
    - name: malformed-document robustness
      method: >-
        fifteen maximally malformed documents (non-mapping blocks, scalar
        containers where lists are expected, list and dict values in scalar
        positions, non-mapping roots, unknown kinds) through validate_record
      result: >-
        0 crashes and 0 silent passes — every one reports findings on its own
        file rather than aborting the run and discarding every other file's
        findings
    - name: repo-scan layer is live, and closed over the scanned corpus
      method: >-
        a scratch consumer corpus outside this checkout, with two personas
        sharing one federated identity and an actor reference naming a declared
        client's service-account subject
      result: >-
        second-persona-in-instance fired on both personas and workload-as-actor
        on the reference; with the two offending records removed the same
        corpus scans clean, so the cross-record rules resolve against the
        SCANNED repository's own records and neither resolve against nor
        collide with the packaged teaching fixtures

